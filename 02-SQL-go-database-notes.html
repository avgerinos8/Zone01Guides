<!DOCTYPE html>
<html lang="el">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL & Go database/sql — Σημειώσεις</title>
  <style>
    :root {
      --dark-slate-grey: #335c67ff;
      --vanilla-custard: #fff3b0ff;
      --honey-bronze: #e09f3eff;
      --brown-red: #9e2a2bff;
      --night-bordeaux: #540b0eff;
      --ink: #1c1c1c;
      --paper: #fffdf6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
      background: var(--dark-slate-grey);
      color: var(--ink);
      overflow: hidden;
    }

    .deck {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      padding: 64px 88px 40px 88px;
      background: var(--paper);
      overflow-y: auto;
    }

    .slide.active {
      display: flex;
    }

    .slide.title-slide {
      background: var(--dark-slate-grey);
      color: var(--vanilla-custard);
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .eyebrow {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas', 'Menlo', monospace;
      font-size: 14px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--brown-red);
      margin-bottom: 10px;
    }

    .title-slide .eyebrow {
      color: var(--honey-bronze);
    }

    h1 {
      font-size: 44px;
      margin: 0 0 8px 0;
      color: var(--night-bordeaux);
      line-height: 1.15;
    }

    .title-slide h1 {
      font-size: 64px;
      color: var(--vanilla-custard);
    }

    h2 {
      font-size: 30px;
      margin: 0 0 22px 0;
      color: var(--night-bordeaux);
      border-bottom: 3px solid var(--honey-bronze);
      padding-bottom: 12px;
    }

    h3 {
      font-size: 21px;
      color: var(--brown-red);
      margin: 22px 0 8px 0;
    }

    p,
    li {
      font-size: 18px;
      line-height: 1.6;
    }

    .subtitle {
      font-size: 20px;
      color: var(--honey-bronze);
      margin-top: 18px;
    }

    .content {
      flex: 1;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
    }

    .card {
      background: #faf6e9;
      border: 1px solid #e5dcc0;
      border-left: 6px solid var(--honey-bronze);
      border-radius: 4px;
      padding: 18px 22px;
      margin: 14px 0;
    }

    .card.warn {
      border-left-color: var(--brown-red);
    }

    .card.note {
      border-left-color: var(--dark-slate-grey);
    }

    code,
    pre {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas', 'Menlo', monospace;
    }

    pre {
      background: var(--night-bordeaux);
      color: var(--vanilla-custard);
      padding: 18px 20px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 15.5px;
      line-height: 1.55;
      margin: 14px 0;
    }

    code.inline {
      background: #f0e6c8;
      color: var(--night-bordeaux);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: .92em;
    }

    .sep {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas', 'Menlo', monospace;
      color: var(--dark-slate-grey);
      font-size: 13px;
      white-space: pre;
      margin: 18px 0 6px 0;
      opacity: .75;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 16.5px;
    }

    th,
    td {
      border: 1px solid #d8cca0;
      padding: 8px 12px;
      text-align: left;
    }

    th {
      background: var(--dark-slate-grey);
      color: var(--vanilla-custard);
    }

    tr:nth-child(even) {
      background: #f6efd9;
    }

    /* navigation */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 74px;
      background: var(--night-bordeaux);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      z-index: 50;
      padding-left: 2vw;
      padding-right: 2vw;

    }

    .nav-btn {
      background: var(--honey-bronze);
      color: var(--night-bordeaux);
      border: none;
      font-weight: 700;
      font-size: 15px;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-family: inherit;
    }

    .nav-btn:hover {
      background: var(--vanilla-custard);
    }

    .nav-btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      max-width: 50vw;
      justify-content: center;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #7a3a3c;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
    }

    .dot.active {
      background: var(--vanilla-custard);
    }

    .dot.quiz-dot {
      background: var(--brown-red);
    }

    .dot.quiz-dot.active {
      background: var(--honey-bronze);
    }

    .progress-track {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: #26454d;
      z-index: 60;
    }

    .progress-fill {
      height: 100%;
      background: var(--honey-bronze);
      transition: width .25s ease;
    }

    .slide-counter {
      position: fixed;
      top: 14px;
      right: 24px;
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas', 'Menlo', monospace;
      font-size: 13px;
      color: var(--vanilla-custard);
      background: var(--night-bordeaux);
      padding: 5px 12px;
      border-radius: 14px;
      z-index: 60;
    }

    /* quiz */
    .quiz-slide {
      background: #fbf2e0;
    }

    .quiz-badge {
      display: inline-block;
      background: var(--brown-red);
      color: var(--vanilla-custard);
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas', 'Menlo', monospace;
      font-size: 13px;
      letter-spacing: .1em;
      padding: 5px 14px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .quiz-q {
      font-size: 22px;
      font-weight: 700;
      color: var(--night-bordeaux);
      margin-bottom: 22px;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quiz-opt {
      text-align: left;
      background: #fff;
      border: 2px solid #d8cca0;
      border-radius: 6px;
      padding: 14px 18px;
      font-size: 17px;
      font-family: inherit;
      cursor: pointer;
      color: var(--ink);
    }

    .quiz-opt:hover {
      border-color: var(--honey-bronze);
    }

    .quiz-opt.correct {
      border-color: var(--dark-slate-grey);
      background: #e4efe8;
      font-weight: 700;
    }

    .quiz-opt.wrong {
      border-color: var(--brown-red);
      background: #f7e3e3;
    }

    .quiz-opt.disabled {
      cursor: default;
    }

    .quiz-explain {
      margin-top: 20px;
      background: #eef2ea;
      border-left: 6px solid var(--dark-slate-grey);
      padding: 16px 20px;
      border-radius: 4px;
      display: none;
      font-size: 17px;
      line-height: 1.55;
    }

    .quiz-explain.show {
      display: block;
    }

    .final-quiz-progress {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas', 'Menlo', monospace;
      color: var(--brown-red);
      font-size: 14px;
      margin-bottom: 6px;
    }

    .final-score-box {
      text-align: center;
      padding: 40px;
    }

    .final-score-box .big {
      font-size: 64px;
      color: var(--night-bordeaux);
      font-weight: 700;
    }

    .sources {
      list-style: none;
      padding: 0;
    }

    .sources li {
      margin-bottom: 10px;
    }

    .sources a {
      color: var(--honey-bronze);
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--honey-bronze);
      border-radius: 5px;
    }
  </style>
</head>

    window.SLIDES.push({

      title: 'Τι είναι μια σχεσιακή βάση δεδομένων',
      html: `
    <div class="content">
      <p>Μια <strong>σχεσιακή βάση δεδομένων</strong> (relational database) οργανώνει τα δεδομένα σε
      <strong>πίνακες</strong> (tables). Κάθε πίνακας είναι ένα σύνολο από γραμμές που έχουν όλες την ίδια δομή στηλών.
      Η ιδέα βγαίνει από τη «σχεσιακή άλγεβρα» (relational algebra) του Edgar F. Codd (1970) — μαθηματική θεωρία
      συνόλων, ή πιο απλά ...τα δεδομένα μπαίνουν σε σειρές και στήλες.</p>

      <div class="two-col">
        <div class="card">
          <h3>Γραμμή (row / record / tuple)</h3>
          <p>Μία συγκεκριμένη «οντότητα». Στην άσκησή σου, μία γραμμή στον πίνακα <code class="inline">reactions</code>
          είναι μία συγκεκριμένη αντίδραση ενός χρήστη σε ένα post.</p>
        </div>
        <div class="card">
          <h3>Στήλη (column / field / attribute)</h3>
          <p>Μία ιδιότητα που έχουν όλες οι γραμμές. Στο <code class="inline">reactions</code>:
          <code class="inline">user_id</code>, <code class="inline">post_id</code>, <code class="inline">value</code>.</p>
        </div>
      </div>

      <h3>Schema</h3>
      <p>Το <strong>schema</strong> είναι η «δομή» της βάσης — ποιοι πίνακες υπάρχουν, ποιες στήλες έχει ο καθένας,
      τι τύπο δεδομένων δέχεται κάθε στήλη, και ποιοι περιορισμοί (constraints) ισχύουν. Ορίζεται με SQL μέσω
      <code class="inline">CREATE TABLE</code>. Στο δικό σου project, αυτό ζει στο <code class="inline">schema.sql</code>.</p>

      <pre>CREATE TABLE reactions (
    user_id INTEGER NOT NULL,
    post_id INTEGER NOT NULL,
    value   TEXT    NOT NULL  -- 'like' or 'dislike'
);</pre>

      <div class="card note">
        <h3>Τύποι δεδομένων (data types) — θεωρητικά</h3>
        <p>Κάθε SQL διάλεκτος έχει τους δικούς της τύπους, αλλά οι πιο κοινοί σε όλες είναι:
        ακέραιοι (<code class="inline">INTEGER</code>), δεκαδικοί (<code class="inline">REAL</code>,
        <code class="inline">NUMERIC</code>), κείμενο (<code class="inline">TEXT</code>, <code class="inline">VARCHAR</code>),
        ημερομηνία/ώρα, και boolean (πολλές βάσεις, όπως η SQLite, δεν έχουν πραγματικό boolean τύπο — χρησιμοποιούν
        0/1 ή ειδικές λέξεις).</p>
      </div>
    </div>
  `
    });

    window.SLIDES.push({
      type: 'content',
      section: '1 · Θεμέλια',
      title: 'SQL: Γλώσσα, όχι πρόγραμμα',
      html: `
    <div class="content">
      <p>Η <strong>SQL</strong> (Structured Query Language) δεν είναι μια γλώσσα προγραμματισμού με τη γενική έννοια
      (δεν έχεις βρόχους <code class="inline">for</code> ή μεταβλητές όπως στη Go) — είναι μια
      <strong>δηλωτική γλώσσα</strong> (declarative language). Δεν λες <em>πώς</em> να βρεις τα δεδομένα,
      λες <em>τι</em> θέλεις, και η βάση αποφασίζει το πώς (execution plan).</p>

      <div class="two-col">
        <div class="card">
          <h3>Imperative (π.χ. Go)</h3>
          <p>«Πήγαινε σε κάθε γραμμή, έλεγξε αν το post_id είναι 5, αν ναι πρόσθεσέ την σε μια λίστα, μετά μέτρα τη λίστα»</p>
        </div>
        <div class="card">
          <h3>Declarative (SQL)</h3>
          <p>«Δώσε μου τον αριθμό των γραμμών όπου post_id = 5»</p>
        </div>
      </div>

      <h3>Οι 4 κατηγορίες εντολών SQL</h3>
      <table>
        <tr><th>Κατηγορία</th><th>Σκοπός</th><th>Παραδείγματα εντολών</th></tr>
        <tr><td><strong>DDL</strong> (Data Definition)</td><td>Ορισμός δομής</td><td><code class="inline">CREATE</code>, <code class="inline">ALTER</code>, <code class="inline">DROP</code></td></tr>
        <tr><td><strong>DML</strong> (Data Manipulation)</td><td>Δουλειά με δεδομένα</td><td><code class="inline">SELECT</code>, <code class="inline">INSERT</code>, <code class="inline">UPDATE</code>, <code class="inline">DELETE</code></td></tr>
        <tr><td><strong>DCL</strong> (Data Control)</td><td>Δικαιώματα</td><td><code class="inline">GRANT</code>, <code class="inline">REVOKE</code></td></tr>
        <tr><td><strong>TCL</strong> (Transaction Control)</td><td>Ατομικές συναλλαγές</td><td><code class="inline">BEGIN</code>, <code class="inline">COMMIT</code>, <code class="inline">ROLLBACK</code></td></tr>
      </table>

      <div class="card">
        <p>Στην άσκησή σου θα χρησιμοποιήσεις κυρίως <strong>DML</strong> (SELECT/INSERT/UPDATE/DELETE) και
        <strong>TCL</strong> (γιατί χρειάζεσαι atomic replace).</p>
      </div>
    </div>
  `
    });

    window.SLIDES.push({
      type: 'quiz',
      section: '1 · Έλεγχος',
      question: 'Γιατί η SQL χαρακτηρίζεται ως «δηλωτική» (declarative) γλώσσα;',
      options: [
        'Επειδή χρησιμοποιεί μόνο κεφαλαία γράμματα στις εντολές, κάτι που τη διαφοροποιεί οπτικά από γλώσσες όπως η Go',
        'Επειδή περιγράφεις τι δεδομένα θέλεις να πάρεις, χωρίς να καθορίζεις τον ακριβή αλγόριθμο με τον οποίο η βάση θα τα βρει',
        'Επειδή δεν επιτρέπει καθόλου μεταβλητές ή συνθήκες μέσα στις εντολές της, σε αντίθεση με κάθε imperative γλώσσα',
        'Επειδή κάθε εντολή της εκτελείται πάντα άμεσα σε μία μόνο γραμμή του πίνακα και ποτέ σε πολλές ταυτόχρονα'

      correct: 1,
      explain: `Σωστά — λες «τι» θέλεις (π.χ. «όλες τις γραμμές όπου post_id=5»), και το database engine αποφασίζει

  λεπτομέρειες σύνταξης ή απλά λάθος — η SQL έχει και conditions (WHERE) μέσα στις εντολές της, απλά όχι με τη
  μορφή προστακτικού βρόχου.`
    });

  </script>
  <script>
    /* ── section 2 · SELECT basics ──────────────────────────────────────────── ⊃ */

    window.SLIDES.push({
      type: 'content',
      section: '2 · SELECT',
      title: 'Η βασική δομή: SELECT ... FROM ... WHERE',
      html: `
    <div class="content">
      <p>Η πιο θεμελιώδης εντολή στη SQL είναι η <code class="inline">SELECT</code> — «διάβασέ μου δεδομένα».
      Η βασική της δομή έχει μια συγκεκριμένη σειρά λέξεων-κλειδιών:</p>

      <pre>SELECT column1, column2   -- ποιες στήλες θέλω να δω
FROM   table_name          -- από ποιον πίνακα
WHERE  condition           -- ποιες γραμμές να φιλτράρω (προαιρετικό)
ORDER BY column1           -- πώς να τις ταξινομήσω (προαιρετικό)
LIMIT  10;                 -- πόσες γραμμές max να επιστρέψει (προαιρετικό)</pre>

      <div class="card warn">
        <h3>Προσοχή στη σειρά εκτέλεσης!</h3>
        <p>Η SQL <strong>γράφεται</strong> με τη σειρά SELECT → FROM → WHERE, αλλά <strong>εκτελείται</strong>
        εννοιολογικά με διαφορετική σειρά: πρώτα <code class="inline">FROM</code> (ποιος πίνακας), μετά
        <code class="inline">WHERE</code> (φιλτράρισμα γραμμών), και μόνο στο τέλος <code class="inline">SELECT</code>
        (ποιες στήλες κρατάω). Γι' αυτό δεν μπορείς να χρησιμοποιήσεις ένα alias που όρισες στο SELECT μέσα στο WHERE
        της ίδιας εντολής — το WHERE «τρέχει» πριν καν υπάρξει το alias.</p>
      </div>

      <h3>Παράδειγμα πάνω στο δικό σου schema</h3>
      <pre>-- όλες οι αντιδράσεις για το post με id = 5
SELECT user_id, value
FROM   reactions
WHERE  post_id = 5;</pre>

      <h3>Το αστέρι *</h3>
      <p>Το <code class="inline">SELECT *</code> σημαίνει «όλες οι στήλες». Είναι βολικό για exploration στο
      terminal, αλλά σε πραγματικό κώδικα Go αποφεύγεται — γιατί αν αλλάξει το schema (προστεθεί στήλη), ο κώδικάς
      σου που κάνει <code class="inline">rows.Scan(...)</code> με συγκεκριμένο αριθμό μεταβλητών θα σπάσει.
      Πάντα προτίμα να ονομάζεις ρητά τις στήλες που χρειάζεσαι.</p>
    </div>
  `
    });

    window.SLIDES.push({
      type: 'content',
      section: '2 · SELECT',
      title: 'Ταξινόμηση και όριο: ORDER BY, LIMIT, DISTINCT',
      html: `
    <div class="content">
      <h3>ORDER BY</h3>
      <p>Ταξινομεί τα αποτελέσματα. Από προεπιλογή είναι αύξουσα (<code class="inline">ASC</code>) — μπορείς να
      ζητήσεις φθίνουσα με <code class="inline">DESC</code>.</p>
      <pre>SELECT user_id, post_id
FROM   reactions
ORDER BY post_id DESC, user_id ASC;
-- ταξινομεί πρώτα με βάση post_id (φθίνουσα), και όσες γραμμές
-- έχουν ίδιο post_id, τις ταξινομεί δευτερευόντως με user_id (αύξουσα)</pre>

      <h3>LIMIT / OFFSET</h3>
      <p><code class="inline">LIMIT</code> κόβει τα αποτελέσματα σε συγκεκριμένο αριθμό γραμμών.
      Το <code class="inline">OFFSET</code> λέει «παράλειψε τις πρώτες Ν γραμμές» — μαζί υλοποιούν pagination.</p>
      <pre>SELECT * FROM reactions
ORDER BY post_id
LIMIT 10 OFFSET 20;  -- σελίδα 3, αν κάθε σελίδα έχει 10 αποτελέσματα</pre>

      <h3>DISTINCT</h3>
      <p>Αφαιρεί διπλότυπες γραμμές από το αποτέλεσμα (όχι από τον πίνακα — μόνο από αυτό που επιστρέφεται).</p>
      <pre>-- ποιοι χρήστες έχουν αφήσει τουλάχιστον μία αντίδραση;
SELECT DISTINCT user_id FROM reactions;</pre>

      <div class="card note">
        <p>Παρατήρηση σχετική με την άσκησή σου: επειδή ο πίνακας <code class="inline">reactions</code> ΔΕΝ έχει
        uniqueness constraint, ένας χρήστης θα μπορούσε — αν δεν προσέξεις στο <code class="inline">setReaction</code> —
        να καταλήξει με πολλαπλές γραμμές για το ίδιο post. Το <code class="inline">DISTINCT</code> είναι εργαλείο
        ανάγνωσης (query), όχι λύση στο πρόβλημα ακεραιότητας δεδομένων (data integrity) — αυτό λύνεται στη
        λογική εγγραφής, όχι ανάγνωσης.</p>
      </div>
    </div>
  `
    });

    window.SLIDES.push({

      <h3>Το ακρωνύμιο ACID</h3>
      <table>
        <tr><th>Ιδιότητα</th><th>Σημασία</th></tr>
        <tr><td><strong>A</strong>tomicity</td><td>Όλες οι εντολές του transaction επιτυγχάνουν, ή καμία — «όλα ή τίποτα»</td></tr>

      <p>Η άσκησή σου αναφέρεται ρητά σε δύο από αυτά: <strong>Atomicity</strong> («The replacement is atomic: if

      <strong>Isolation</strong> («other database operations must continue to see the previous committed row,
      never the transaction's partial work»).</p>

      <h3>Βασική σύνταξη</h3>
      <pre>BEGIN;
    UPDATE reactions SET value = 'dislike' WHERE user_id = 1 AND post_id = 5;

    </div>

          el.innerHTML = slide.html;
        } else if (slide.type === 'final-quiz-result') {
          el.dataset.finalResult = 'true';
          el.innerHTML = `<div class="content"><div class="final-score-box" id="finalScoreBox"></div></div>`;
        }
        return el;
      }

      function renderQuizBody(slide) {
        const letters = ['Α', 'Β', 'Γ', 'Δ'];
        return `
      <div class="eyebrow">${slide.section}</div>
      <div class="quiz-badge">QUIZ CHECKPOINT</div>
      <div class="quiz-q">${slide.question}</div>
      <div class="quiz-options">
        ${slide.options.map((opt, i) => `
          <button class="quiz-opt" data-idx="${i}">${letters[i]}. ${opt}</button>
        `).join('')}
      </div>
      <div class="quiz-explain" id="explain-${slide.__uid}"></div>
    `;
      }

      function wireQuizOptions(el, slide) {
        const buttons = el.querySelectorAll('.quiz-opt');
        buttons.forEach(btn => {
          btn.addEventListener('click', () => {
            if (el.dataset.answered === 'true') return;
            el.dataset.answered = 'true';
            const chosen = parseInt(btn.dataset.idx, 10);
            buttons.forEach(b => {
              b.classList.add('disabled');
              const bi = parseInt(b.dataset.idx, 10);
              if (bi === slide.correct) b.classList.add('correct');
              else if (bi === chosen) b.classList.add('wrong');
            });
            const explainEl = el.querySelector('.quiz-explain');
            explainEl.textContent = slide.explain;
            explainEl.classList.add('show');
          });
        });
      }

      /* ── final quiz (multi-question flow inside one slide) ───────────────── ⊃ */
      function renderFinalQuizQuestion() {
        const box = document.querySelector('.slide[data-final-result="true"] #finalScoreBox') ||
          document.querySelector('#finalScoreBox');
        const total = window.FINAL_QUIZ.length;

        if (finalQuizIndex >= total) {
          renderFinalScore();
          return;
        }

        const q = window.FINAL_QUIZ[finalQuizIndex];
        const letters = ['Α', 'Β', 'Γ', 'Δ'];
        box.parentElement.innerHTML = `
      <div class="content">
        <div class="final-quiz-progress">Ερώτηση ${finalQuizIndex + 1} / ${total}</div>
        <div class="quiz-q">${q.q}</div>
        <div class="quiz-options">
          ${q.options.map((opt, i) => `<button class="quiz-opt" data-idx="${i}">${letters[i]}. ${opt}</button>`).join('')}
        </div>
        <div class="quiz-explain" id="finalExplain"></div>
        <button class="nav-btn" id="finalNextBtn" style="display:none;margin-top:20px;">Επόμενη ερώτηση →</button>
      </div>
    `;

        const buttons = document.querySelectorAll('.quiz-opt');
        const explainEl = document.getElementById('finalExplain');
        const nextQBtn = document.getElementById('finalNextBtn');
        let answered = false;

        buttons.forEach(btn => {
          btn.addEventListener('click', () => {
            if (answered) return;
            answered = true;
            const chosen = parseInt(btn.dataset.idx, 10);
            if (chosen === q.correct) finalQuizScore++;
            buttons.forEach(b => {
              b.classList.add('disabled');
              const bi = parseInt(b.dataset.idx, 10);
              if (bi === q.correct) b.classList.add('correct');
              else if (bi === chosen) b.classList.add('wrong');
            });
            explainEl.textContent = q.explain;
            explainEl.classList.add('show');
            nextQBtn.style.display = 'inline-block';
          });
        });

        nextQBtn.addEventListener('click', () => {
          finalQuizIndex++;
          renderFinalQuizQuestion();
        });
      }

      function renderFinalScore() {
        const total = window.FINAL_QUIZ.length;
        const box = document.querySelector('#finalScoreBox') || document.querySelector('.slide[data-final-result="true"] .content');
        const pct = Math.round((finalQuizScore / total) * 100);
        let verdict;
        if (pct === 100) verdict = 'Τέλεια κατανόηση — έτοιμος/η για την άσκηση!';
        else if (pct >= 75) verdict = 'Πολύ καλή βάση — ρίξε μια ματιά στα σημεία που έχασες.';
        else if (pct >= 50) verdict = 'Καλή αρχή — αξίζει να ξαναδείς 1-2 ενότητες.';
        else verdict = 'Χρειάζεται περισσότερη μελέτη πριν την άσκηση — γύρνα πίσω στις ενότητες.';

        box.parentElement.innerHTML = `
      <div class="content">
        <div class="final-score-box">
          <div class="eyebrow">Τελικό αποτέλεσμα</div>
          <div class="big">${finalQuizScore} / ${total}</div>
          <p style="font-size:20px;margin-top:12px;">${verdict}</p>
        </div>
      </div>
    `;
      }

      /* ── navigation core ───────────────────────────────────────────────────── ⊃ */
      function renderDots() {
        dotsEl.innerHTML = '';
        window.SLIDES.forEach((s, i) => {
          const d = document.createElement('button');
          d.className = 'dot' + (s.type === 'quiz' || s.type.startsWith('final-quiz') ? ' quiz-dot' : '');
          d.addEventListener('click', () => goTo(i));
          dotsEl.appendChild(d);
        });
      }

      function updateChrome() {
        const total = window.SLIDES.length;
        counterEl.textContent = `${current + 1} / ${total}`;
        progressFill.style.width = `${((current + 1) / total) * 100}%`;
        prevBtn.disabled = current === 0;
        nextBtn.disabled = current === total - 1;
        Array.from(dotsEl.children).forEach((d, i) => d.classList.toggle('active', i === current));
      }

      function goTo(idx) {
        if (idx < 0 || idx >= window.SLIDES.length) return;
        const slides = Array.from(deckEl.children);
        slides[current].classList.remove('active');
        current = idx;
        slides[current].classList.add('active');

        // lazy-trigger final quiz start when entering the intro slide's *next* slide
        if (window.SLIDES[current].type === 'final-quiz-result' && finalQuizIndex === 0 && finalQuizScore === 0 && !window.__finalQuizStarted) {
          window.__finalQuizStarted = true;
          renderFinalQuizQuestion();
        }

        updateChrome();
        deckEl.scrollTop = 0;
      }

      function init() {
        window.SLIDES.forEach((slide, i) => {
          slide.__uid = i;
          const el = buildSlideElement(slide, i);
          deckEl.appendChild(el);
        });
        deckEl.children[0].classList.add('active');
        renderDots();
        updateChrome();

        prevBtn.addEventListener('click', () => goTo(current - 1));
        nextBtn.addEventListener('click', () => goTo(current + 1));
        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowRight') goTo(current + 1);
          if (e.key === 'ArrowLeft') goTo(current - 1);
        });
      }

      document.addEventListener('DOMContentLoaded', init);
    })();

  </script>

</body>
