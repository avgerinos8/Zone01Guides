<!DOCTYPE html>
<html lang="el">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker Fundamentals — Θεωρητικό Υλικό</title>
  <style>
    :root {
      --tone-1: #001a0eff;
      --tone-2: #004225ff;
      /* Jaguar Green */
      --tone-3: #006b3cff;
      --tone-4: #009453ff;
      --tone-5: #d4af37ff;
      /* Gold Accent */

      --tone-1-rgb: 0, 26, 14;
      --tone-2-rgb: 0, 66, 37;
      --tone-3-rgb: 0, 107, 60;
      --tone-4-rgb: 0, 148, 83;
      --tone-5-rgb: 212, 175, 55;

      --tone-text: #f9ebe0ff;
      --tone-text-rgb: 249, 235, 224;


      /* semantic roles — every other rule below reads ONLY these variables */
      --bg: var(--tone-1);
      --panel: var(--tone-3);
      --panel-rgb: var(--tone-3-rgb);
      --ink: var(--tone-text);
      --ink-rgb: var(--tone-text-rgb);
      --accent: var(--tone-5);
      --accent-rgb: var(--tone-5-rgb);
      --danger: var(--tone-4);
      --danger-rgb: var(--tone-4-rgb);

      /* correct/wrong stay green/red on purpose — outside the 5-tone palette */
      --correct: rgb(0, 224, 67);
      --correct-rgb: 0, 224, 67;
      --wrong: rgb(255, 56, 38);
      --wrong-rgb: 255, 56, 38;

      --font-display: "Iowan Old Style", "Georgia", "Times New Roman", serif;
      --font-body: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Consolas", "Menlo", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      font-family: var(--font-body);
      color: var(--ink);
      overflow: hidden;
    }

    /* ── layout shell ─────────────────────────────────────────────────────── ⊃ */

    #progress-track {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: rgba(var(--ink-rgb), 0.12);
      z-index: 50;
    }

    #progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width .35s ease;
    }

    #deck {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: none;
      padding: 64px 9vw 120px 9vw;
      overflow-y: auto;
    }

    .slide.active {
      display: block;
      animation: fadeIn .35s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .eyebrow {
      font-family: var(--font-mono);
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 14px;
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(30px, 4vw, 54px);
      line-height: 1.08;
      margin: 0 0 22px 0;
      color: var(--ink);
    }

    h2 {
      font-family: var(--font-display);
      font-size: clamp(22px, 2.6vw, 32px);
      color: var(--accent);
      margin: 34px 0 14px 0;
      border-bottom: 1px solid rgba(var(--ink-rgb), 0.18);
      padding-bottom: 8px;
    }

    h3 {
      font-family: var(--font-body);
      font-size: 19px;
      color: var(--ink);
      margin: 22px 0 8px 0;
    }

    p,
    li {
      font-size: 17px;
      line-height: 1.62;
      color: rgba(var(--ink-rgb), 0.92);
    }

    strong {
      color: var(--ink);
    }

    a {
      color: var(--accent);
    }

    .lede {
      font-size: 19px;
      color: rgba(var(--ink-rgb), 0.92);
      max-width: 100%;
      line-height: 1.7;
    }

    code,
    .inline-code {
      font-family: var(--font-mono);
      background: rgba(var(--tone-1-rgb), 0.55);
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.92em;
      color: var(--ink);
    }

    /* ── code blocks ──────────────────────────────────────────────────────── ⊃ */
    :root {
      --syn-keyword: #569cd6;
      --syn-type: #4ec9b0;
      --syn-string: #ce9178;
      --syn-comment: #6a9955;
      --syn-number: #b5cea8;
      --syn-func: #dcdcaa;
      --syn-punct: #d4d4d4;
    }

    .code-wrap {
      position: relative;
      margin: 18px 0;
    }

    pre {
      background: rgba(var(--tone-1-rgb), 0.85);
      border: 1px solid rgba(var(--accent-rgb), 0.35);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 18px 20px;
      overflow-x: auto;
      margin: 0;
    }

    .code-wrap>pre {
      margin: 0;
    }

    pre code {
      background: none;
      padding: 0;
      font-family: var(--font-mono);
      font-size: 14.5px;
      line-height: 1.6;
      color: rgba(var(--ink-rgb), 0.95);
      white-space: pre;
    }

    .cm {
      color: rgba(var(--ink-rgb), 0.5);
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .04em;
      background: rgba(var(--panel-rgb), 0.85);
      color: rgba(var(--ink-rgb), 0.85);
      border: 1px solid rgba(var(--ink-rgb), 0.25);
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      opacity: .75;
      transition: opacity .15s, background .15s;
    }

    .copy-btn:hover {
      opacity: 1;
      background: var(--accent);
      color: var(--bg);
    }

    .tok-kw {
      color: var(--syn-keyword);
    }

    .tok-type {
      color: var(--syn-type);
    }

    .tok-str {
      color: var(--syn-string);
    }

    .tok-com {
      color: var(--syn-comment);
    }

    .tok-num {
      color: var(--syn-number);
    }

    .tok-func {
      color: var(--syn-func);
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    .grid3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
    }

    @media (max-width:900px) {

      .grid2,
      .grid3 {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: rgba(var(--panel-rgb), 0.45);
      border: 1px solid rgba(var(--ink-rgb), 0.15);
      border-radius: 10px;
      padding: 18px 20px;
    }

    .card h3 {
      margin-top: 0;
      color: var(--accent);
    }

    .callout {
      border-left: 4px solid var(--danger);
      background: rgba(var(--danger-rgb), 0.18);
      padding: 14px 18px;
      border-radius: 6px;
      margin: 18px 0;
    }

    .callout.good {
      border-left-color: var(--correct);
      background: rgba(var(--correct-rgb), 0.14);
    }

    .callout .tag {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 6px;
    }

    .title-slide {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      height: 100%;
    }

    .title-badge {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 26px;
      overflow: hidden;
    }

    .title-badge .fallback {
      font-family: var(--font-display);
      font-size: 34px;
      color: var(--bg);
      font-weight: 700;
    }

    .kicker-line {
      font-family: var(--font-mono);
      color: var(--accent);
      font-size: 14px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    /* ── quiz ──────────────────────────────────────────────────────────────── ⊃ */

    .quiz-box {
      background: rgba(var(--panel-rgb), 0.35);
      border: 1px solid rgba(var(--ink-rgb), 0.18);
      border-radius: 12px;
      padding: 26px 28px;
      max-width: 920px;
    }

    .quiz-q {
      font-size: 19px;
      margin-bottom: 18px;
      color: var(--ink);
      font-weight: 600;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-opt {
      text-align: left;
      background: rgba(var(--ink-rgb), 0.06);
      border: 1px solid rgba(var(--ink-rgb), 0.22);
      color: rgba(var(--ink-rgb), 0.92);
      font-family: var(--font-body);
      font-size: 15.5px;
      padding: 13px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .quiz-opt:hover {
      background: rgba(var(--accent-rgb), 0.16);
      border-color: var(--accent);
    }

    .quiz-opt.correct {
      background: rgba(var(--correct-rgb), 0.28);
      border-color: var(--correct);
    }

    .quiz-opt.wrong {
      background: rgba(var(--wrong-rgb), 0.32);
      border-color: var(--wrong);
    }

    .quiz-opt.disabled {
      pointer-events: none;
      opacity: 0.9;
    }

    .quiz-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .06em;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
      display: none;
    }

    .quiz-opt.correct .quiz-badge {
      display: inline-block;
      background: var(--correct);
      color: var(--tone-1);
    }

    .quiz-opt.wrong .quiz-badge {
      display: inline-block;
      background: var(--wrong);
      color: var(--tone-text);
    }

    .quiz-explain {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      background: rgba(var(--tone-1-rgb), 0.5);
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.6;
      color: rgba(var(--ink-rgb), 0.92);
      border-left: 3px solid var(--accent);
    }

    .quiz-explain.show {
      display: block;
    }

    .quiz-head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .reset-quiz-btn {
      font-family: var(--font-mono);
      font-size: 12px;
      background: transparent;
      color: rgba(var(--ink-rgb), 0.65);
      border: 1px solid rgba(var(--ink-rgb), 0.3);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .reset-quiz-btn:hover {
      color: var(--ink);
      border-color: var(--accent);
      background: rgba(var(--accent-rgb), 0.12);
    }

    /* ── fill-in-the-blank ─────────────────────────────────────────────────── ⊃ */

    .fb-item {
      background: rgba(var(--panel-rgb), 0.35);
      border: 1px solid rgba(var(--ink-rgb), 0.18);
      border-radius: 12px;
      padding: 22px 24px;
      max-width: 920px;
      margin-bottom: 22px;
    }

    .fb-item pre {
      margin: 12px 0;
    }

    .fb-blank {
      font-family: var(--font-mono);
      font-size: 14.5px;
      background: rgba(var(--accent-rgb), 0.14);
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: var(--ink);
      padding: 1px 6px;
      width: 9ch;
      text-align: center;
    }

    .fb-blank.correct {
      border-color: var(--correct);
      background: rgba(var(--correct-rgb), 0.22);
    }

    .fb-blank.wrong {
      border-color: var(--wrong);
      background: rgba(var(--wrong-rgb), 0.22);
    }

    .fb-blank:disabled {
      opacity: 0.9;
    }

    .fb-actions {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .fb-check-btn {
      font-family: var(--font-mono);
      font-size: 13px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 8px 16px;
      border-radius: 7px;
      cursor: pointer;
    }

    .fb-check-btn:hover {
      opacity: .88;
    }

    .fb-result {
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .fb-result.ok {
      color: var(--correct);
    }

    .fb-result.bad {
      color: var(--wrong);
    }

    /* ── glossary ──────────────────────────────────────────────────────────── ⊃ */

    .glossary-group {
      margin-bottom: 30px;
    }

    .glossary-group h2 {
      margin-top: 0;
    }

    .glossary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media (max-width: 900px) {
      .glossary-grid {
        grid-template-columns: 1fr;
      }
    }

    .gterm {
      background: rgba(var(--panel-rgb), 0.4);
      border: 1px solid rgba(var(--ink-rgb), 0.15);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .gterm .gname {
      font-family: var(--font-mono);
      color: var(--accent);
      font-size: 14px;
      display: block;
      margin-bottom: 4px;
    }

    .gterm .gdef {
      font-size: 14px;
      line-height: 1.5;
      color: rgba(var(--ink-rgb), 0.85);
    }

    .sources-list {
      display: flex;
      flex-direction: column;
      align-items: space-between;
    }

    /* ── nav ───────────────────────────────────────────────────────────────── ⊃ */

    #nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: linear-gradient(0deg, rgba(var(--tone-1-rgb), 0.98) 60%, rgba(var(--tone-1-rgb), 0) 100%);
      z-index: 50;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-btn {
      font-family: var(--font-mono);
      font-size: 14px;
      background: var(--panel);
      color: var(--ink);
      border: 1px solid rgba(var(--ink-rgb), 0.3);
      padding: 10px 18px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn:hover {
      background: var(--accent);
      color: var(--bg);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .nav-btn:disabled:hover {
      background: var(--panel);
      color: var(--ink);
    }

    #dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      max-width: 50vw;
      justify-content: center;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(var(--ink-rgb), 0.25);
      cursor: pointer;
    }

    .dot.active {
      background: var(--accent);
      width: 22px;
      border-radius: 5px;
    }

    .dot.quiz-dot {
      background: rgba(var(--danger-rgb), 0.55);
    }

    .dot.quiz-dot.active {
      background: var(--danger);
    }

    #slide-counter {
      font-family: var(--font-mono);
      font-size: 13px;
      color: rgba(var(--ink-rgb), 0.6);
      white-space: nowrap;
    }

    ul {
      padding-left: 22px;
    }

    li {
      margin-bottom: 8px;
    }

    .vs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      margin: 12px 0;
    }

    .vs-table th,
    .vs-table td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(var(--ink-rgb), 0.18);
    }

    .vs-table th {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .vs-table td {
      color: rgba(var(--ink-rgb), 0.85);
    }

    .vs-table td.hl {
      color: var(--ink);
      font-weight: 600;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(var(--accent-rgb), 0.4);
      border-radius: 5px;
    }
  </style>
</head>

<body>

  <div id="progress-track">
    <div id="progress-fill"></div>
  </div>
  <div id="deck"></div>

  <div id="nav-bar">
    <div class="nav-group">
      <button class="nav-btn" id="btn-reset">Reset Progress</button>
      <button class="nav-btn" id="btn-prev">← Πίσω</button>
    </div>
    <div id="dots"></div>
    <div style="display:flex; align-items:center; gap:16px;">
      <span id="slide-counter"></span>
      <button class="nav-btn" id="btn-next">Επόμενο →</button>
    </div>
  </div>

  <script>
    // ── initialize slides ──────────────────────────────────────────────────── ⊃
    const slides = [];

    function addContent(html) { slides.push({ type: "content", html }); }

    function addQuiz(qOrArray) {
      const questions = Array.isArray(qOrArray) ? qOrArray : [qOrArray];
      slides.push({ type: "quiz", data: questions });
    }

    function addFillBlank(itemOrArray) {
      const items = Array.isArray(itemOrArray) ? itemOrArray : [itemOrArray];
      slides.push({ type: "fillblank", data: items });
    }

    // ── slide title ────────────────────────────────────────────────────────── ⊃
    addContent(`
<div class="title-slide">
  <div class="title-badge"><span class="fallback">D</span></div>
  <div class="kicker-line">Zone01 Athens · Θεωρητικό υλικό</div>
  <h1>Docker Fundamentals<br>Αρχιτεκτονική, Multi-stage Builds &amp; Compose</h1>
  <p class="lede">Ένας πλήρης θεωρητικός οδηγός για τη σωστή χρήση του Docker στην ανάπτυξη και το deployment εφαρμογών Go.</p>
  <div class="callout"><span class="tag">ΣΗΜΕΙΩΣΗ</span> 
    Όταν συναντάς κάτι που δεν καταλαβαίνεις, μην κολλάς! Άνοιξε ένα <strong>νέο tab</strong> και ρώτα έναν AI βοηθό. 
    Σκοπός αυτού του οδηγού δεν είναι να σε μάθει τα πάντα, αλλά να σου δώσει το έναυσμα και τη σωστή βάση για να μάθεις μόνος σου.
  </div>
</div>
`);

    // ── slide intro to docker ──────────────────────────────────────────────── ⊃
    addContent(`
<div class="eyebrow">Ενότητα 1 / 6 — Εισαγωγή στο Docker</div>
<h1>Ορισμός και Σκοπός</h1>
<p class="lede">Το Docker είναι μια πλατφόρμα ανοιχτού λογισμικού που επιτρέπει την αυτοματοποίηση της ανάπτυξης, της
αποστολής και της εκτέλεσης εφαρμογών μέσα σε απομονωμένα περιβάλλοντα εκτέλεσης, τα οποία ονομάζονται
<strong>containers</strong>.</p>

<h2>Το πρόβλημα: «Δουλεύει στο μηχάνημά μου»</h2>
<p>Σε ομαδικά έργα λογισμικού είναι σύνηθες ένας κώδικας να εκτελείται σωστά σε ένα σύστημα και να αποτυγχάνει
σε άλλο. Οι συνήθεις αιτίες είναι:</p>
<ul>
  <li>Διαφορετική έκδοση της γλώσσας ή του runtime (π.χ. Go 1.21 έναντι 1.22)</li>
  <li>Διαφορετικό λειτουργικό σύστημα (Windows, Linux, macOS)</li>
  <li>Ελλιπείς βιβλιοθήκες συστήματος ή διαφορετικά δικαιώματα στους φακέλους</li>
</ul>
<p>Το Docker περικλείει την εφαρμογή μαζί με όλα τα dependencies, τις ρυθμίσεις και το runtime της σε ένα
ενιαίο πακέτο. Αν η εφαρμογή εκτελείται μέσα σε Docker, θα εκτελείται με πανομοιότυπο τρόπο σε οποιοδήποτε
σύστημα διαθέτει τον Docker engine.</p>

<h2>Containers έναντι Virtual Machines</h2>
<p>Είναι συχνό λάθος να ταυτίζονται τα Docker containers με τα Virtual Machines (π.χ. VirtualBox, VMware). Η
θεμελιώδης διαφορά έγκειται στο επίπεδο απομόνωσης:</p>
<table class="vs-table">
  <tr>
    <th>Χαρακτηριστικό</th>
    <th>Virtual Machine</th>
    <th>Docker Container</th>
  </tr>
  <tr>
    <td>Αρχιτεκτονική</td>
    <td>Περιλαμβάνει ολόκληρο Guest OS</td>
    <td class="hl">Μοιράζεται τον Kernel του Host OS</td>
  </tr>
  <tr>
    <td>Μέγεθος</td>
    <td>Τάξη μεγέθους Gigabytes</td>
    <td class="hl">Τάξη μεγέθους Megabytes</td>
  </tr>
  <tr>
    <td>Εκκίνηση</td>
    <td>Λεπτά (πλήρες boot του OS)</td>
    <td class="hl">Χιλιοστά του δευτερολέπτου έως δευτερόλεπτα</td>
  </tr>
  <tr>
    <td>Performance</td>
    <td>Σημαντικό overhead σε RAM/CPU</td>
    <td class="hl">Σχεδόν native performance, μηδενικό επιπλέον overhead</td>

<div class="eyebrow">Ενότητα 2 / 6 — Ανάλυση Dockerfile & Multi-stage</div>
<h1>Το πρόβλημα του Single-stage Build</h1>
<p class="lede">Ένα απλό, μη βελτιστοποιημένο Dockerfile για μια εφαρμογή Go έχει τυπικά την εξής μορφή:</p>

<pre><code class="lang-go">FROM golang:1.22-alpine
WORKDIR /app
COPY . .
RUN go build -o app ./cmd/main.go
EXPOSE 8080
CMD ["./app"]</code></pre>

<p>Αυτή η εικόνα περιέχει ολόκληρο το περιβάλλον ανάπτυξης της Go: τον compiler, τα εργαλεία build, τα headers
και ολόκληρο τον πηγαίο κώδικα. Το αποτέλεσμα είναι ένα τελικό image μεγέθους περίπου <strong>350MB έως
800MB</strong>.</p>
<p>Πέραν του μεγέθους, υπάρχει και ζήτημα ασφάλειας: όποιος αποκτήσει πρόσβαση στο container έχει άμεση
πρόσβαση σε όλα τα αρχεία πηγαίου κώδικα (<code>.go</code>), κάτι που θεωρείται σημαντικό κενό ασφαλείας σε
παραγωγικό περιβάλλον.</p>

<h2>Η λύση: Multi-stage Build</h2>
<p>Η τεχνική του multi-stage build χωρίζει τη διαδικασία σε δύο διακριτά στάδια:</p>
<ul>
  <li><strong>Στάδιο 1 (Builder):</strong> χρησιμοποιείται το πλήρες περιβάλλον της Go αποκλειστικά για τη
  μεταγλώττιση (compile) του κώδικα, με τελικό προϊόν ένα έτοιμο εκτελέσιμο αρχείο (binary).</li>
  <li><strong>Στάδιο 2 (Runtime):</strong> ξεκινά από μια καθαρή, ελαφριά εικόνα Linux (π.χ. Alpine, περίπου
  5MB) και μεταφέρονται σε αυτήν μόνο το έτοιμο binary και τα απαραίτητα assets (static, templates,
  δεδομένα).</li>
</ul>
<p>Το αποτέλεσμα αυτής της διαδικασίας είναι μια τελική εικόνα της τάξης των <strong>27-30MB</strong>:
ταχύτατη στο download, χωρίς περιττά αρχεία, χωρίς εκτεθειμένο πηγαίο κώδικα.</p>
`);

<div class="eyebrow">Ενότητα 2 / 6 — Ανάλυση Dockerfile & Multi-stage</div>
<h1>Ανάλυση multi-stage γραμμή-γραμμή</h1>

<h2>Στάδιο 1 (Builder)</h2>
<pre><code class="lang-go">FROM golang:1.22-alpine AS builder</code></pre>
<p>Κατεβάζει την επίσημη εικόνα της Go και το <code>AS builder</code> ονομάζει το στάδιο, ώστε να μπορεί να γίνει αναφορά σε αυτό αργότερα.</p>

<pre><code class="lang-go">WORKDIR /app
COPY go.mod ./
RUN go mod download
COPY . .</code></pre>
<p>Η αντιγραφή του αρχείου διαχείρισης εξαρτήσεων και η λήψη τους γίνεται <strong>πριν</strong> αντιγραφεί ο υπόλοιπος κώδικας, ώστε το Docker να μπορεί να κάνει cache αυτό το layer· αν αλλάξει μόνο ένα αρχείο HTML στη συνέχεια, δεν θα χρειαστεί να ξαναγίνει λήψη των βιβλιοθηκών.</p>

<pre><code class="lang-go">RUN CGO_ENABLED=0 GOOS=linux go build -ldflags="-w -s" -o app ./cmd/main.go</code></pre>
<ul>
  <li><code>CGO_ENABLED=0</code>: απενεργοποιεί τα C bindings, παράγοντας ένα πλήρως στατικό (statically linked) binary που εκτελείται σε οποιοδήποτε περιβάλλον Linux χωρίς εξάρτηση από εξωτερικές system libraries.</li>
  <li><code>-ldflags="-w -s"</code>: αφαιρεί τις πληροφορίες debugging και τα symbols από το binary, μειώνοντας το μέγεθός του κατά περίπου 30-40%.</li>
</ul>

<h2>Στάδιο 2 (Runtime)</h2>
<pre><code class="lang-go">FROM alpine:3.19
WORKDIR /app
RUN adduser -D -g '' appuser</code></pre>
<p>Δημιουργείται ένας απλός, μη προνομιούχος χρήστης συστήματος. Για λόγους ασφαλείας, η εφαρμογή πρέπει να εκτελείται με περιορισμένα δικαιώματα.</p>

<pre><code class="lang-go">COPY --from=builder /app/app .
USER appuser
CMD ["./app"]</code></pre>
<p>Το <code>COPY --from=builder</code> αντιγράφει επιλεκτικά αρχεία από το προηγούμενο στάδιο. Μεταφέρεται μόνο το έτοιμο εκτελέσιμο· κανένα αρχείο πηγαίου κώδικα δεν μεταφέρεται. Στη συνέχεια ενεργοποιείται ο χρήστης <code>appuser</code>.</p>
`);

<div class="eyebrow">Ενότητα 3 / 6 — Docker Compose</div>
<h1>Ορισμός και ρόλος</h1>
<p class="lede">Το Docker Compose είναι εργαλείο που επιτρέπει τον ορισμό και την εκτέλεση εφαρμογών μέσω ενός απλού αρχείου ρυθμίσεων σε μορφή YAML.</p>

<p>Ακόμη και σε έργα με ένα και μόνο container, λειτουργεί ως το επίσημο <strong>αρχείο ρυθμίσεων (configuration file)</strong> του deployment. Αντί να απαιτείται απομνημόνευση θυρών, ονομάτων και ρυθμίσεων ασφαλείας μέσω επαναλαμβανόμενων εντολών τερματικού, όλες οι παράμετροι καταγράφονται μία φορά στο YAML αρχείο.</p>

<h2>Ανάλυση του docker-compose.yaml</h2>
<pre><code class="lang-go">version: '3.8'                    // version of the Compose file format

services:
  web-app:                         // name of our service
    build:
      context: .                   // build context: current directory
      dockerfile: Dockerfile       // which file builds the image

    container_name: project-app    // replaces --name

    ports:
      - "8080:8080"                // replaces -p (host:container)

    restart: unless-stopped        // replaces --restart</code></pre>
<p>Κάθε πεδίο του YAML αντιστοιχεί ένα-προς-ένα σε ένα flag της χειροκίνητης εντολής <code>docker container run</code>, καταγεγραμμένο όμως μία φορά, δηλωτικά, και υπό έλεγχο εκδόσεων (version control).</p>
`);

<div class="eyebrow">Ενότητα 5 / 6 — Garbage Collection</div>
<h1>Διαχείριση Πόρων και System Prune</h1>
<p class="lede">Το Docker κρατάει cache, παλιά images και stopped containers για να επιταχύνει τη διαδικασία, αλλά συχνά γεμίζει το δίσκο.</p>

<h2>Εντολές Καθαρισμού</h2>

<pre><code>// check disk usage
docker system df</code></pre>
<p>Αυτή η εντολή δείχνει ακριβώς πόσα MB/GB καταλαμβάνουν τα Images, Containers, Volumes και το Build Cache.</p>

<pre><code>// remove unused dangling images
docker image prune</code></pre>
<p>Η εντολή αυτή καθαρίζει τα <em>dangling images</em> (εικόνες που δεν έχουν όνομα και δεν σχετίζονται με κανένα container). Μπορείς να προσθέσεις το <code>-a</code> για να καθαρίσεις όλα τα αχρησιμοποίητα images.</p>

<pre><code>// clean up everything not actively running

<p>Η πιο δραστική εντολή (το Garbage Collection του Docker). Διαγράφει: stopped containers, όλα τα δίκτυα που δεν χρησιμοποιούνται, <strong>dangling images και unreferenced images</strong>, και τέλος (με το flag) όλα τα αχρησιμοποίητα volumes (<strong>ΠΡΟΣΟΧΗ: τα δεδομένα χάνονται</strong>).</p>

<div class="glossary-group">
  <h2>Dockerfile Keywords</h2>
  <div class="glossary-grid">
    <div class="gterm"><span class="gname">FROM ... AS ...</span><span class="gdef">Ορισμός ονόματος σταδίου (multi-stage)</span></div>

    // ── slide outro ────────────────────────────────────────────────────────── ⊃
    addContent(`
<div class="eyebrow">Τέλος παρουσίασης</div>
<p class="lede">Για περαιτέρω εμβάθυνση:</p>
<div class="sources-list">
  <a href="https://docker-handbook.farhan.dev/" target="_blank" rel="noopener">The Docker Handbook</a>
  <a href="https://www.geeksforgeeks.org/devops/docker-tutorial/" target="_blank" rel="noopener">Docker Tutorial</a>

</div>
<p style="margin-top:48px; color:rgba(var(--ink-rgb),0.55); font-family:var(--font-mono); font-size:14px;">
</p>
`);

    // ── highlighting functions ─────────────────────────────────────────────── ⊃
    const GO_KEYWORDS = new Set(["func", "go", "chan", "select", "case", "default", "package", "import", "var", "const", "type", "struct", "interface", "return", "if", "else", "for", "range", "switch", "break", "continue", "defer", "map", "make", "new", "nil", "true", "false", "iota", "fallthrough", "goto"]);
    const GO_TYPES = new Set(["int", "int8", "int16", "int32", "int64", "uint", "uint8", "uint16", "uint32", "uint64", "float32", "float64", "string", "bool", "byte", "rune", "error", "any"]);

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightGo(source) {
      const tokenRe = /(\/\/[^\n]*)|("(?:[^"\\]|\\.)*"|`[^`]*`)|(\b\d+\.?\d*\b)|(\b[A-Za-z_][A-Za-z0-9_]*\b)(\()?/g;
      let out = "";
      let lastIndex = 0;
      let m;
      while ((m = tokenRe.exec(source)) !== null) {
        out += escapeHtml(source.slice(lastIndex, m.index));
        const [full, comment, str, num, ident, followedByParen] = m;
        if (comment) {
          out += `<span class="tok-com">${escapeHtml(comment)}</span>`;
        } else if (str) {
          out += `<span class="tok-str">${escapeHtml(str)}</span>`;
        } else if (num) {
          out += `<span class="tok-num">${escapeHtml(num)}</span>`;
        } else if (ident) {
          if (GO_KEYWORDS.has(ident)) {
            out += `<span class="tok-kw">${ident}</span>` + (followedByParen ? "(" : "");
          } else if (GO_TYPES.has(ident)) {
            out += `<span class="tok-type">${ident}</span>` + (followedByParen ? "(" : "");
          } else if (followedByParen) {
            out += `<span class="tok-func">${ident}</span>(`;
          } else {
            out += ident;
          }
        }
        lastIndex = tokenRe.lastIndex;
      }
      out += escapeHtml(source.slice(lastIndex));
      return out;
    }

    function decorateCodeBlocks(container) {
      container.querySelectorAll("code.lang-go").forEach(codeEl => {
        codeEl.innerHTML = highlightGo(codeEl.textContent);
      });

      container.querySelectorAll("pre").forEach(preEl => {
        if (preEl.parentElement.classList.contains("code-wrap")) return;
        const wrap = document.createElement("div");
        wrap.className = "code-wrap";
        preEl.parentNode.insertBefore(wrap, preEl);
        wrap.appendChild(preEl);

        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.type = "button";
        btn.textContent = "Copy";
        btn.addEventListener("click", () => {
          const text = preEl.querySelector("code")?.textContent ?? preEl.textContent;
          navigator.clipboard.writeText(text).then(() => {
            btn.textContent = "Copied!";
            setTimeout(() => { btn.textContent = "Copy"; }, 1500);
          });
        });
        wrap.appendChild(btn);
      });
    }

    // ── DOM elements logic ─────────────────────────────────────────────────── ⊃
    const deckEl = document.getElementById("deck");
    const dotsEl = document.getElementById("dots");
    const counterEl = document.getElementById("slide-counter");
    const fillEl = document.getElementById("progress-fill");
    const prevBtn = document.getElementById("btn-prev");
    const nextBtn = document.getElementById("btn-next");
    const resetBtn = document.getElementById("btn-reset");

    let current = parseInt(localStorage.getItem("quiz_current_slide")) || 0;
    let savedAnswers = JSON.parse(localStorage.getItem("quiz_answers")) || {};

    function shuffleSeed(arr, seed) {
      const a = arr.slice();
      let s = seed;
      for (let i = a.length - 1; i > 0; i--) {
        s = (s * 9301 + 49297) % 233280;
        const j = Math.floor((s / 233280) * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function renderQuestion(box, q, storeKey) {
      const order = q._order;

      const qDiv = document.createElement("div");
      qDiv.className = "quiz-q";
      qDiv.textContent = q.q;
      box.appendChild(qDiv);

      const optsDiv = document.createElement("div");
      optsDiv.className = "quiz-options";

      const explainDiv = document.createElement("div");
      explainDiv.className = "quiz-explain";

      function handleSelection(selectedIndex, clickedBtn) {
        const allBtns = optsDiv.querySelectorAll(".quiz-opt");
        allBtns.forEach(b => b.classList.add("disabled"));

        if (selectedIndex === q.correct) {
          if (clickedBtn) clickedBtn.classList.add("correct");
          explainDiv.innerHTML = "<strong>ΣΩΣΤΟ!</strong><br>" + q.explain;
        } else {
          if (clickedBtn) clickedBtn.classList.add("wrong");
          explainDiv.innerHTML = "<strong>ΛΑΘΟΣ.</strong><br>" + q.explain;
        }

        allBtns.forEach((b, i2) => {
          if (order[i2] === q.correct) b.classList.add("correct");
          if (!clickedBtn && order[i2] === selectedIndex && selectedIndex !== q.correct) {
            b.classList.add("wrong");
          }
        });

        allBtns.forEach(b => {
          const badge = b.querySelector(".quiz-badge");
          if (!badge) return;
          if (b.classList.contains("correct")) badge.textContent = "ΣΩΣΤΟ";
          else if (b.classList.contains("wrong")) badge.textContent = "ΛΑΘΟΣ";
        });

        explainDiv.classList.add("show");
      }

      order.forEach(origIndex => {
        const btn = document.createElement("button");
        btn.className = "quiz-opt";
        const label = document.createElement("span");
        label.textContent = q.options[origIndex];
        const badge = document.createElement("span");
        badge.className = "quiz-badge";
        btn.appendChild(label);
        btn.appendChild(badge);

        btn.addEventListener("click", () => {
          savedAnswers[storeKey] = origIndex;
          localStorage.setItem("quiz_answers", JSON.stringify(savedAnswers));
          handleSelection(origIndex, btn);
        });

        optsDiv.appendChild(btn);
      });

      box.appendChild(optsDiv);
      box.appendChild(explainDiv);

      if (savedAnswers[storeKey] !== undefined) {
        handleSelection(savedAnswers[storeKey], null);
      }
    }

    function renderFillBlank(wrap, item) {
      const box = document.createElement("div");
      box.className = "fb-item";

      const pre = document.createElement("pre");
      const codeEl = document.createElement("code");

      const parts = item.code.split(/__([a-zA-Z0-9]+)__/g);
      let html = "";
      for (let i = 0; i < parts.length; i++) {
        if (i % 2 === 0) {
          html += highlightGo(parts[i]);
        } else {
          const blankId = parts[i];
          html += `<input type="text" class="fb-blank" data-blank-id="${blankId}" autocomplete="off" spellcheck="false" size="6">`;
        }
      }
      codeEl.innerHTML = html;
      pre.appendChild(codeEl);
      box.appendChild(pre);

      const actions = document.createElement("div");
      actions.className = "fb-actions";
      const checkBtn = document.createElement("button");
      checkBtn.className = "fb-check-btn";
      checkBtn.type = "button";
      checkBtn.textContent = "Έλεγχος";
      const resultSpan = document.createElement("span");
      resultSpan.className = "fb-result";
      actions.appendChild(checkBtn);
      actions.appendChild(resultSpan);
      box.appendChild(actions);

      const explainDiv = document.createElement("div");
      explainDiv.className = "quiz-explain";
      explainDiv.innerHTML = item.explain;
      box.appendChild(explainDiv);

      checkBtn.addEventListener("click", () => {
        const inputs = box.querySelectorAll(".fb-blank");
        let allCorrect = true;
        inputs.forEach(inp => {
          const expected = item.blanks.find(b => b.id === inp.dataset.blankId)?.answer ?? "";
          const ok = inp.value.trim().toLowerCase() === expected.trim().toLowerCase();
          inp.classList.remove("correct", "wrong");
          inp.classList.add(ok ? "correct" : "wrong");
          inp.disabled = true;
          if (!ok) allCorrect = false;
        });
        resultSpan.textContent = allCorrect ? "ΣΩΣΤΟ!" : "Υπάρχουν λάθη — δες τα κόκκινα κενά.";
        resultSpan.className = "fb-result " + (allCorrect ? "ok" : "bad");
        explainDiv.classList.add("show");
        checkBtn.disabled = true;
      });

      wrap.appendChild(box);
    }

    function renderSlide(el, slide, idx) {
      if (slide.type === "content") {
        el.innerHTML = slide.html;
        decorateCodeBlocks(el);
        return;
      }

      if (slide.type === "quiz") {
        el.innerHTML = "";
        const header = document.createElement("div");
        header.className = "quiz-head-row";
        const eyebrow = document.createElement("div");
        eyebrow.className = "eyebrow";
        eyebrow.style.marginBottom = "0";
        eyebrow.textContent = "Quiz Checkpoint";
        const resetQuizBtn = document.createElement("button");
        resetQuizBtn.className = "reset-quiz-btn";
        resetQuizBtn.type = "button";
        resetQuizBtn.textContent = "↺ Reset this quiz";
        header.appendChild(eyebrow);
        header.appendChild(resetQuizBtn);
        el.appendChild(header);

        function renderAllQuestions() {
          el.querySelectorAll(".quiz-box").forEach(n => n.remove());
          slide.data.forEach((q, qIdx) => {
            const box = document.createElement("div");
            box.className = "quiz-box";
            box.style.marginBottom = "18px";
            renderQuestion(box, q, idx + "_" + qIdx);
            el.appendChild(box);
          });
        }

        resetQuizBtn.addEventListener("click", () => {
          slide.data.forEach((q, qIdx) => {
            delete savedAnswers[idx + "_" + qIdx];
            q._order = shuffleSeed(q.options.map((_, i2) => i2), Date.now() % 100000 + qIdx);
          });
          localStorage.setItem("quiz_answers", JSON.stringify(savedAnswers));
          renderAllQuestions();
        });

        renderAllQuestions();
        return;
      }

      if (slide.type === "fillblank") {
        el.innerHTML = "";
        const header = document.createElement("div");
        header.className = "quiz-head-row";
        const eyebrow = document.createElement("div");
        eyebrow.className = "eyebrow";
        eyebrow.style.marginBottom = "0";
        eyebrow.textContent = "Fill in the Blank";
        const resetQuizBtn = document.createElement("button");
        resetQuizBtn.className = "reset-quiz-btn";
        resetQuizBtn.type = "button";
        resetQuizBtn.textContent = "↺ Reset this quiz";
        header.appendChild(eyebrow);
        header.appendChild(resetQuizBtn);
        el.appendChild(header);

        function renderAllItems() {
          el.querySelectorAll(".fb-item").forEach(n => n.remove());
          slide.data.forEach(item => renderFillBlank(el, item));
        }

        resetQuizBtn.addEventListener("click", renderAllItems);
        renderAllItems();
      }
    }

    slides.forEach((s, i) => {
      if (s.type === "quiz") {
        s.data.forEach((q, qIdx) => {
          const idxArr = q.options.map((_, i2) => i2);
          q._order = shuffleSeed(idxArr, i * 7 + 13 + qIdx * 31);
        });
      }
    });

    slides.forEach((s, i) => {
      const el = document.createElement("div");
      el.className = "slide";
      el.dataset.index = i;
      deckEl.appendChild(el);
      renderSlide(el, s, i);

      const dot = document.createElement("div");
      dot.className = "dot" + (s.type === "quiz" || s.type === "fillblank" ? " quiz-dot" : "");
      dot.addEventListener("click", () => goTo(i));
      dotsEl.appendChild(dot);
    });

    const slideEls = Array.from(document.querySelectorAll(".slide"));
    const dotEls = Array.from(document.querySelectorAll(".dot"));

    function goTo(i) {
      if (i < 0 || i >= slides.length) return;

      slideEls[current].classList.remove("active");
      dotEls[current].classList.remove("active");
      current = i;
      localStorage.setItem("quiz_current_slide", current);

      slideEls[current].classList.add("active");
      dotEls[current].classList.add("active");
      slideEls[current].scrollTop = 0;

      counterEl.textContent = (current + 1) + " / " + slides.length;
      fillEl.style.width = (((current + 1) / slides.length) * 100) + "%";

      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === slides.length - 1;
    }

    function performHardReset() {
      localStorage.removeItem("quiz_current_slide");
      localStorage.removeItem("quiz_answers");
      window.location.href = window.location.pathname + '?cache-bust=' + Date.now() + window.location.hash;
    }

    resetBtn.addEventListener("click", performHardReset);
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey && e.shiftKey && e.key === "F5") {
        e.preventDefault();
        performHardReset();
      }
    });

    prevBtn.addEventListener("click", () => goTo(current - 1));
    nextBtn.addEventListener("click", () => goTo(current + 1));

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") goTo(current + 1);
      if (e.key === "ArrowLeft") goTo(current - 1);
    });

    goTo(current);
  </script>
