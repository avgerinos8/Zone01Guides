<!DOCTYPE html>
<html lang="el">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go Concurrency & net — Θεωρητικό Υπόβαθρο</title>
  <style>
    :root {
      --maroon: #991a2e;
      --red: #d93f52;
      --yellow: #ffda4d;
      --white: #ffffff;
      --bg: #160608;
      --panel: #22090f;
      --panel2: #2c0c14;
      --mono: "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace;
      --sans: "Inter", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--white);
      font-family: var(--sans);
      overflow: hidden;
    }

    /* ---------- top bar ---------- */
    #topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--maroon);
      z-index: 50;
    }

    #topbar .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-weight: 700;
      letter-spacing: .5px;
    }

    #topbar .brand img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    #topbar .brand .caret {
      color: var(--yellow);
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    #progress-wrap {
      flex: 1;
      max-width: 420px;
      margin: 0 24px;
      height: 6px;
      background: rgba(255, 255, 255, .08);
      border-radius: 4px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      background: var(--yellow);
      width: 0%;
      transition: width .35s ease;
    }

    #counter {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--yellow);
      white-space: nowrap;
    }

    /* ---------- slide deck ---------- */
    #deck {
      position: fixed;
      top: 56px;
      bottom: 64px;
      left: 0;
      right: 0;
      overflow: hidden;
    }

    #track {
      display: flex;
      height: 100%;
      transition: transform .5s cubic-bezier(.65, 0, .35, 1);
    }

    .slide {
      min-width: 100%;
      max-width: 100%;
      height: 100%;
      flex: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px clamp(24px, 7vw, 120px);
      overflow-y: auto;
      box-sizing: border-box;
    }

    .slide::-webkit-scrollbar {
      width: 8px;
    }

    .slide::-webkit-scrollbar-thumb {
      background: var(--maroon);
      border-radius: 4px;
    }

    .eyebrow {
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--yellow);
      font-size: 12px;
      margin-bottom: 10px;
      opacity: .9;
    }

    h1 {
      font-size: clamp(28px, 4vw, 46px);
      margin: 0 0 18px;
      line-height: 1.15;
    }

    h2 {
      font-size: clamp(20px, 2.6vw, 28px);
      color: var(--yellow);
      margin: 26px 0 10px;
    }

    h3 {
      font-size: 19px;
      color: #ffb3bd;
      margin: 20px 0 8px;
    }

    p,
    li {
      font-size: 17px;
      line-height: 1.65;
      color: #f2dfe2;
    }

    .lead {
      font-size: 19px;
      color: #fff;
      max-width: 820px;
    }

    strong {
      color: var(--yellow);
    }

    a {
      color: var(--yellow);
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: start;
    }

    @media(max-width:900px) {
      .grid2 {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--maroon);
      border-radius: 14px;
      padding: 20px 22px;
    }

    .card.warn {
      border-color: var(--yellow);
    }

    .card h4 {
      margin: 0 0 8px;
      color: var(--yellow);
      font-family: var(--mono);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    code,
    pre {
      font-family: var(--mono);
    }

    pre {
      background: #0d0304;
      border: 1px solid rgba(217, 63, 82, .4);
      border-radius: 10px;
      padding: 16px 18px;
      overflow-x: auto;
      font-size: 14.5px;
      line-height: 1.55;
      box-shadow: inset 0 0 30px rgba(153, 26, 46, .15);
    }

    pre .c1 {
      color: #7a8b99;
    }

    /* comments */
    pre .kw {
      color: var(--red);
      font-weight: 700;
    }

    pre .fn {
      color: var(--yellow);
    }

    pre .str {
      color: #8fd694;
    }

    pre .type {
      color: #7fb8ff;
    }

    code.inline {
      background: rgba(217, 63, 82, .18);
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 14.5px;
    }

    ul {
      padding-left: 22px;
    }

    li {
      margin-bottom: 6px;
    }

    .tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(255, 218, 77, .15);
      color: var(--yellow);
      margin-left: 8px;
      border: 1px solid rgba(255, 218, 77, .4);
    }

    /* ---------- title slide ---------- */
    .title-slide {
      align-items: center;
      text-align: center;
      position: relative;
    }

    .title-slide img {
      width: 150px;
      margin-bottom: 18px;
    }

    .title-slide h1 {
      font-size: clamp(30px, 5vw, 54px);
    }

    .title-slide .sub {
      font-family: var(--mono);
      color: var(--yellow);
      font-size: 16px;
      letter-spacing: 1px;
    }

    .prompt-line {
      font-family: var(--mono);
      margin-top: 30px;
      color: #9fb;
      font-size: 15px;
    }

    .prompt-line .p1 {
      color: var(--red);
    }

    /* ---------- quiz ---------- */
    .quiz-slide {
      justify-content: flex-start;
      padding-top: 60px;
    }

    .qbox {
      max-width: 780px;
      margin: 0 auto;
      width: 100%;
    }

    .qnum {
      font-family: var(--mono);
      color: var(--yellow);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .qtext {
      font-size: 19px;
      margin-bottom: 18px;
      color: #fff;
    }

    .opt {
      display: block;
      width: 100%;
      text-align: left;
      padding: 13px 16px;
      margin-bottom: 10px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 10px;
      color: #f2dfe2;
      font-size: 15.5px;
      cursor: pointer;
      font-family: var(--sans);
      transition: .15s;
    }

    .opt:hover {
      border-color: var(--red);
      background: var(--panel2);
    }

    .opt.correct {
      background: rgba(80, 200, 120, .18);
      border-color: #4ecb75;
      color: #fff;
    }

    .opt.wrong {
      background: rgba(217, 63, 82, .22);
      border-color: var(--red);
      color: #fff;
    }

    .opt:disabled {
      cursor: default;
    }

    .explain {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--panel2);
      border-left: 3px solid var(--yellow);
      font-size: 15px;
      display: none;
    }

    .explain.show {
      display: block;
    }

    .quiz-progress {
      font-family: var(--mono);
      font-size: 13px;
      color: #c88;
      margin-bottom: 22px;
    }

    .quiz-score {
      font-family: var(--mono);
      font-size: 15px;
      color: var(--yellow);
      margin-top: 20px;
    }

    /* ---------- nav ---------- */
    #navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--bg);
      border-top: 1px solid var(--maroon);
      z-index: 50;
    }

    .navbtn {
      font-family: var(--mono);
      background: var(--maroon);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: .15s;
      border: 1px solid rgba(255, 255, 255, .1);
    }

    .navbtn:hover {
      background: var(--red);
    }

    .navbtn:disabled {
      opacity: .3;
      cursor: not-allowed;
    }

    #dots {
      display: flex;
      gap: 6px;
      max-width: 40vw;
      overflow-x: auto;
      padding: 4px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .18);
      flex: none;
      cursor: pointer;
    }

    .dot.active {
      background: var(--yellow);
      box-shadow: 0 0 8px var(--yellow);
    }

    .dot.quiz {
      background: rgba(217, 63, 82, .5);
    }

    .dot.quiz.active {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    ::selection {
      background: var(--red);
      color: #fff;
    }
  </style>
</head>

  <h1>Το πακέτο <code class="inline">net</code></h1>
  <p class="lead">Το <code class="inline">net</code> είναι το χαμηλού επιπέδου networking της Go — αυτό πάνω στο οποίο χτίζεται και το <code class="inline">net/http</code> που ξέρεις ήδη. Χωρίς HTTP, χωρίς request/response, χωρίς routes. Μόνο <strong>bytes πάνω σε μια σύνδεση</strong>. Δεν υπάρχει κάποιο έτοιμο, τυποποιημένο πρωτόκολλο από πάνω — δεν υπάρχει η έννοια του "αιτήματος" (request) που περιμένει "απάντηση" (response), ούτε κάτι σαν διευθύνσεις-endpoints (routes). Το μόνο που έχεις είναι μια ανοιχτή σύνδεση, και πάνω σε αυτήν, ακατέργαστα bytes που στέλνονται προς τις δύο κατευθύνσεις.</p>
  <div class="grid2">
    <div class="card">
      <h4>Τι είναι socket</h4>
      <p>Ένα socket είναι το άκρο μιας δικτυακής σύνδεσης — ένας συνδυασμός <strong>IP + port</strong>. Ο server "ανοίγει" ένα socket σε ένα port και περιμένει (listen). Ο client ανοίγει το δικό του socket και ζητά σύνδεση (dial) προς το socket του server.</p>
    </div>
    <div class="card">
      <h4>TCP vs UDP σε μία πρόταση</h4>
      <p>Το TCP είναι μια <strong>συνεχής, αξιόπιστη σύνδεση</strong> (σαν τηλεφωνική κλήση — παραμένει ανοιχτή, τα δεδομένα φτάνουν με τη σειρά τους). Το UDP στέλνει μεμονωμένα πακέτα χωρίς εγγύηση παράδοσης (σαν γράμμα). Το netcat project σου είναι TCP: μόνιμη σύνδεση, chat.</p>
    </div>
  </div>
`});

  <h1>Server side: <code class="inline">Listen</code> &amp; <code class="inline">Accept</code></h1>
  <p>Ο server-side κύκλος ζωής έχει πάντα δύο ξεχωριστά βήματα, και η διάκρισή τους είναι θεμελιώδης:</p>
  <div class="grid2">

      <p>Δεσμεύει το port και λέει στο λειτουργικό σύστημα "στείλε μου ό,τι φτάνει εδώ". Επιστρέφει ένα <code class="inline">net.Listener</code>. Γίνεται <strong>μία φορά</strong>, στην αρχή του προγράμματος.</p>
    </div>
    <div class="card">
      <h4>2. listener.Accept()</h4>
      <p>Αυτό είναι το interesting κομμάτι: <strong>μπλοκάρει</strong> — σταματάει την εκτέλεση — μέχρι να έρθει ένας νέος client. Όταν έρθει, επιστρέφει ένα <code class="inline">net.Conn</code>: τη συγκεκριμένη σύνδεση με αυτόν τον client.</p>
    </div>
  </div>
  <pre><span class="c1">// conceptual shape only — not a solution</span>
<span class="kw">ln</span>, err := net.<span class="fn">Listen</span>(<span class="str">"tcp"</span>, <span class="str">":8989"</span>)
<span class="kw">for</span> {
    conn, err := ln.<span class="fn">Accept</span>() <span class="c1">// blocks here until someone connects</span>
    <span class="c1">// ...then what? see goroutines section</span>
}</pre>
  <div class="card warn">
    <h4>Το ερώτημα-κλειδί</h4>
    <p>Το <code class="inline">Accept()</code> σου δίνει <strong>έναν</strong> client τη φορά, μπλοκάροντας. Αν θες πολλούς clients ταυτόχρονα (1-to-many, όπως ζητείται), το loop πάνω πρέπει να συνεχίζει να τρέχει <em>ενώ</em> ήδη μιλάει με προηγούμενους clients. Πώς γίνεται αυτό χωρίς να "κολλήσει" ο server; Αυτό είναι ακριβώς το θέμα της Ενότητας 2.</p>
  </div>

  <h1>Το interface <code class="inline">net.Conn</code></h1>
  <p>Μόλις έχεις ένα <code class="inline">net.Conn</code> (είτε σαν server μετά το Accept, είτε σαν client μετά το Dial), δουλεύεις με αυτό σαν <strong>ρεύμα από bytes</strong> προς τις δύο κατευθύνσεις:</p>
  <ul>
    <li><code class="inline">conn.Read(buf []byte)</code> — διαβάζει bytes που έστειλε η άλλη πλευρά</li>
    <li><code class="inline">conn.Write(data []byte)</code> — στέλνει bytes στην άλλη πλευρά</li>
    <li><code class="inline">conn.Close()</code> — κλείνει τη σύνδεση (και τα δύο άκρα το καταλαβαίνουν)</li>
  </ul>
  <p>Αυτό είναι πολύ πιο "γυμνό" από το <code class="inline">net/http</code>: δεν υπάρχει έννοια "request" ή "endpoint". Απλά ένας σωλήνας (pipe) δύο κατευθύνσεων. <strong>Εσύ</strong> ορίζεις το πρωτόκολλο — πότε τελειώνει ένα μήνυμα, τι format έχει.</p>
  <div class="card">
    <h4>Client side: net.Dial</h4>
    <pre><span class="c1">// conceptual shape only</span>
conn, err := net.<span class="fn">Dial</span>(<span class="str">"tcp"</span>, <span class="str">"localhost:8989"</span>)
<span class="c1">// conn is now a net.Conn, same interface as server-side</span></pre>
    <p style="margin-top:10px">Ενδιαφέρον: ο <code class="inline">net.Dial</code> στην πλευρά του client επιστρέφει το <strong>ίδιο</strong> interface (<code class="inline">net.Conn</code>) με αυτό που παίρνει ο server από το <code class="inline">Accept()</code>. Και οι δύο πλευρές "μιλάνε" με τον ίδιο τρόπο μόλις η σύνδεση ανοίξει — η ασυμμετρία server/client υπάρχει μόνο στο πώς <em>ξεκίνησε</em> η σύνδεση.</p>
  </div>
`});

    slides.push({

  <h1>Τι είναι μια goroutine</h1>
  <p class="lead">Μια goroutine είναι μια <strong>ανεξάρτητη ροή εκτέλεσης</strong> μέσα στο ίδιο πρόγραμμα — «light-weight thread», διαχειρίζεται από το Go runtime, όχι απευθείας από το λειτουργικό σύστημα.</p>
  <div class="grid2">
    <div class="card">
      <h4>Γιατί όχι απλά threads (OS threads);</h4>
      <p>Ένα OS thread «κοστίζει» μερικά MB μνήμης stack και είναι ακριβό να δημιουργηθεί/καταστραφεί. Μια goroutine ξεκινά με μόλις <strong>~2KB</strong> stack, που μεγαλώνει δυναμικά. Μπορείς να έχεις χιλιάδες goroutines χωρίς πρόβλημα — κάτι αδιανόητο με OS threads.</p>
    </div>
    <div class="card">
      <h4>Η λέξη-κλειδί <code class="inline">go</code></h4>
      <p>Βάζοντας <code class="inline">go</code> πριν από μια κλήση συνάρτησης, αυτή <strong>δεν εκτελείται εδώ και τώρα</strong> — «εκτοξεύεται» να τρέξει ανεξάρτητα, και το πρόγραμμα συνεχίζει αμέσως στην επόμενη γραμμή, χωρίς να περιμένει το αποτέλεσμα.</p>
    </div>
  </div>
  <pre><span class="kw">func</span> <span class="fn">sayHi</span>(name <span class="type">string</span>) {
    fmt.<span class="fn">Println</span>(<span class="str">"hi"</span>, name)
}

<span class="kw">func</span> <span class="fn">main</span>() {
    <span class="kw">go</span> <span class="fn">sayHi</span>(<span class="str">"A"</span>)   <span class="c1">// starts running independently...</span>
    <span class="kw">go</span> <span class="fn">sayHi</span>(<span class="str">"B"</span>)   <span class="c1">// ...this one too...</span>
    fmt.<span class="fn">Println</span>(<span class="str">"main continues immediately"</span>)
    <span class="c1">// main() might finish before A and B even print anything!</span>
}</pre>
  <div class="card warn">
    <h4>Κρίσιμη παγίδα</h4>
    <p>Αν το <code class="inline">main()</code> τελειώσει, <strong>όλο</strong> το πρόγραμμα τερματίζει — ό,τι goroutines ήταν ακόμα σε εξέλιξη, χάνονται, δεν προλαβαίνουν καν να τυπώσουν. Το παραπάνω παράδειγμα μπορεί να μην τυπώσει τίποτα καθόλου! Αυτό οδηγεί στο ερώτημα: πώς περιμένεις μια goroutine να «τελειώσει» πριν συνεχίσεις;</p>
  </div>
`});

    slides.push({
      type: 'content', eyebrow: 'Ενότητα 2 · Goroutines', html: `
  <h1>Πειραματικό demo: race χωρίς συγχρονισμό</h1>
  <p>Δες τι συμβαίνει όταν πολλές goroutines αγγίζουν την ίδια μεταβλητή <strong>χωρίς κανέναν συντονισμό</strong> — δεν λύνει τίποτα από την άσκησή σου, είναι απλά για να «νιώσεις» το πρόβλημα:</p>
  <pre><span class="kw">func</span> <span class="fn">main</span>() {
    counter := <span class="kw">0</span>
    <span class="kw">for</span> i := <span class="kw">0</span>; i < <span class="kw">1000</span>; i++ {
        <span class="kw">go</span> <span class="kw">func</span>() {
            counter++ <span class="c1">// read, increment, write — NOT atomic!</span>
        }()
    }
    time.<span class="fn">Sleep</span>(time.<span class="fn">Second</span>) <span class="c1">// crude wait, just for the demo</span>
    fmt.<span class="fn">Println</span>(counter) <span class="c1">// often NOT 1000. Sometimes 987, 993...</span>
}</pre>
  <p>Το <code class="inline">counter++</code> δεν είναι μία ατομική (atomic) ενέργεια — είναι στην πραγματικότητα τρία βήματα: <em>διάβασε</em> την τιμή, <em>πρόσθεσε</em> 1, <em>γράψε</em> πίσω. Αν δύο goroutines κάνουν αυτά τα τρία βήματα «στο ίδιο περίπου δευτερόλεπτο», μπορεί και οι δύο να διαβάσουν την ίδια αρχική τιμή και να «χάσουν» μια αύξηση. Αυτό λέγεται <strong>race condition</strong>, και είναι ακριβώς αυτό που θα σε απειλήσει όταν πολλές goroutines (μία ανά client) αγγίζουν κοινές δομές (π.χ. τη λίστα των συνδεδεμένων clients).</p>
  <div class="card">
    <h4>Bonus εργαλείο</h4>
    <p>Η Go έχει built-in <strong>race detector</strong>: τρέχοντας <code class="inline">go run -race .</code> ή <code class="inline">go test -race</code>, το runtime παρακολουθεί προσβάσεις σε μνήμη και σου λέει ρητά «βρήκα race condition εδώ», με ακριβές stack trace. Είναι από τα πιο χρήσιμα εργαλεία debugging concurrency σε όλη τη Go.</p>
  </div>
`});

    slides.push({

  <h1>Το μοτίβο «μία goroutine ανά σύνδεση»</h1>
  <p class="lead">Επιστρέφοντας στο πρόβλημα του Accept-loop από την Ενότητα 1: η λύση σε servers όπως ο δικός σου είναι σχεδόν πάντα το ίδιο μοτίβο.</p>
  <pre><span class="c1">// conceptual shape only — not a solution</span>
<span class="kw">for</span> {
    conn, err := ln.<span class="fn">Accept</span>()  <span class="c1">// blocks until someone connects</span>
    <span class="c1">// ...</span>
    <span class="kw">go</span> <span class="fn">handleConnection</span>(conn) <span class="c1">// handle THIS client independently,</span>
                              <span class="c1">// loop immediately goes back to Accept()</span>
}</pre>
  <p>Η ουσία: το <code class="inline">Accept()</code> loop κάνει <strong>μόνο</strong> μία δουλειά — δέχεται νέες συνδέσεις όσο πιο γρήγορα γίνεται. Η «βαριά» δουλειά (διάβασμα μηνυμάτων, γράψιμο απαντήσεων, αναμονή για input) πάει σε ξεχωριστή goroutine, μία <strong>ανά client</strong>. Έτσι το accept-loop δεν «μπλοκάρει» ποτέ εξαιτίας ενός αργού client.</p>
  <div class="card warn">
    <h4>Ερώτημα σχεδίασης που θα αντιμετωπίσεις</h4>
    <p>Αν κάθε client έχει τη δική του goroutine που διαβάζει τα δικά του μηνύματα... πώς φτάνει ένα μήνυμα από τη goroutine του client A στη goroutine του client B, ώστε να το στείλει εκείνη στον B; Οι goroutines δεν μοιράζονται αυτόματα «αποτελέσματα» μεταξύ τους. Χρειάζεσαι έναν τρόπο επικοινωνίας. → Ενότητα 3.</p>
  </div>
`});

    slides.push({

  <h1>Περιμένοντας goroutines: <code class="inline">sync.WaitGroup</code></h1>
  <p>Ένα εργαλείο (εκτός των επιτρεπόμενων packages σου, απλά για πληρότητα της εικόνας) για να περιμένεις πολλές goroutines να τελειώσουν, χωρίς το άτσαλο <code class="inline">time.Sleep</code> από πριν:</p>
  <pre><span class="kw">var</span> wg sync.WaitGroup

<span class="kw">for</span> i := <span class="kw">0</span>; i < <span class="kw">5</span>; i++ {
    wg.<span class="fn">Add</span>(<span class="kw">1</span>)         <span class="c1">// "there's one more goroutine to wait for"</span>
    <span class="kw">go</span> <span class="kw">func</span>(id <span class="type">int</span>) {
        <span class="kw">defer</span> wg.<span class="fn">Done</span>()  <span class="c1">// "I'm finished" — always deferred</span>
        fmt.<span class="fn">Println</span>(<span class="str">"worker"</span>, id)
    }(i)
}
wg.<span class="fn">Wait</span>()             <span class="c1">// blocks here until Add-count reaches 0</span>
fmt.<span class="fn">Println</span>(<span class="str">"all done"</span>)</pre>
  <p>Δεν θα το χρησιμοποιήσεις στη λύση σου (δεν είναι στα allowed packages — είναι στο <code class="inline">sync</code> πακέτο βασικά, οπότε τεχνικά επιτρέπεται, αλλά ο server σου συνήθως δεν «περιμένει» τους clients να τελειώσουν — τρέχει επ' αόριστον). Αξίζει όμως να ξέρεις τη λογική: <strong>Add / Done / Wait</strong> είναι ένα μετρητή goroutines που μηδενίζεται.</p>
`});

    <div class="card">
      <h4>Buffered — <code class="inline">make(chan T, N)</code></h4>
      <p>Το channel έχει χωρητικότητα N. Το send μπλοκάρει <strong>μόνο αν ο buffer είναι γεμάτος</strong>. Ένας sender μπορεί να «αφήσει» N τιμές χωρίς να περιμένει receiver.</p>

  </div>

    <h4>Γιατί έχει σημασία σε ένα chat server</h4>

`});

  <h1><code class="inline">sync.Mutex</code>: προστασία κοινόχρηστης κατάστασης</h1>
  <p class="lead">Ένα mutex («mutual exclusion») εξασφαλίζει ότι <strong>μόνο μία goroutine τη φορά</strong> μπορεί να εκτελεί ένα συγκεκριμένο κομμάτι κώδικα — αυτό που ονομάζεται «critical section».</p>
  <pre><span class="kw">var</span> mu sync.Mutex
<span class="kw">var</span> counter <span class="type">int</span>

<span class="kw">func</span> <span class="fn">increment</span>() {
    mu.<span class="fn">Lock</span>()          <span class="c1">// only one goroutine passes at a time</span>
    <span class="kw">defer</span> mu.<span class="fn">Unlock</span>()  <span class="c1">// always released, even on panic</span>
    counter++          <span class="c1">// now safe — no other goroutine can be here simultaneously</span>
}</pre>
  <p>Ό,τι κώδικας βρίσκεται ανάμεσα σε <code class="inline">Lock()</code> και <code class="inline">Unlock()</code> εκτελείται <strong>ατομικά</strong> ως προς τις άλλες goroutines που προσπαθούν να πάρουν το ίδιο lock — αν μια δεύτερη goroutine καλέσει <code class="inline">Lock()</code> ενώ μια άλλη το κρατάει ήδη, θα <strong>περιμένει</strong> μέχρι να ελευθερωθεί.</p>
  <div class="card warn">
    <h4>Το <code class="inline">defer mu.Unlock()</code> δεν είναι στολίδι</h4>
    <p>Αν ξεχάσεις να κάνεις Unlock (π.χ. λόγω early return ή panic), το lock μένει «κλειδωμένο» για πάντα — <strong>deadlock</strong>: καμία άλλη goroutine δεν θα μπορέσει ποτέ ξανά να περάσει από εκεί. Το defer εγγυάται ότι το Unlock τρέχει, ό,τι κι αν συμβεί μέσα στη συνάρτηση.</p>
  </div>
`});

    slides.push({
      type: 'content', eyebrow: 'Ενότητα 5 · Mutexes', html: `
  <h1><code class="inline">RWMutex</code>: πολλαπλοί αναγνώστες</h1>
  <p>Ένα κοινό σενάριο: πολλές goroutines θέλουν να <strong>διαβάσουν</strong> μια λίστα (π.χ. λίστα συνδεδεμένων clients για broadcast), αλλά σπάνια κάποια θέλει να τη <strong>γράψει</strong> (νέος client μπήκε/έφυγε). Ένα απλό Mutex θα επέτρεπε μόνο μία ανάγνωση τη φορά — αχρείαστα αργό.</p>
  <div class="grid2">
    <div class="card">
      <h4>RLock() / RUnlock()</h4>
      <p>Πολλές goroutines μπορούν να κρατούν <strong>ταυτόχρονα</strong> read-lock, αρκεί να μην υπάρχει καμία write-lock ενεργή. Ιδανικό για broadcast σε πολλούς clients ταυτόχρονα.</p>
    </div>
    <div class="card">
      <h4>Lock() / Unlock()</h4>
      <p>Το write-lock είναι <strong>αποκλειστικό</strong> — καμία άλλη goroutine, ούτε καν άλλος reader, δεν μπορεί να περάσει όσο κρατιέται. Χρησιμοποιείται όταν πραγματικά τροποποιείς τη δομή (π.χ. προσθήκη/αφαίρεση client).</p>
    </div>
  </div>
  <pre><span class="kw">var</span> mu sync.RWMutex
<span class="kw">var</span> clients <span class="kw">map</span>[<span class="type">string</span>]<span class="type">Conn</span>

<span class="kw">func</span> <span class="fn">broadcast</span>(msg <span class="type">string</span>) {
    mu.<span class="fn">RLock</span>();  <span class="kw">defer</span> mu.<span class="fn">RUnlock</span>()  <span class="c1">// many can read at once</span>
    <span class="kw">for</span> _, c := <span class="kw">range</span> clients { <span class="c1">/* send */</span> }
}

<span class="kw">func</span> <span class="fn">addClient</span>(name <span class="type">string</span>, c <span class="type">Conn</span>) {
    mu.<span class="fn">Lock</span>();  <span class="kw">defer</span> mu.<span class="fn">Unlock</span>()   <span class="c1">// exclusive — nobody else in</span>
    clients[name] = c
}</pre>
`});

  <p>Το <code class="inline">defer</code> προγραμματίζει μια κλήση να τρέξει <strong>όταν η περιβάλλουσα συνάρτηση επιστρέφει</strong> — ό,τι κι αν συμβεί ενδιάμεσα (κανονικό return, error, ακόμα και panic).</p>

}</pre>
  <p>Πολλαπλά defers εκτελούνται σε σειρά <strong>LIFO</strong> (Last In, First Out) — το τελευταίο defer που δηλώθηκε, τρέχει πρώτο. Αυτό είναι χρήσιμο όταν έχεις αλυσίδα από «cleanup» ενεργειών που εξαρτώνται η μία από την άλλη (π.χ. πρώτα αφαίρεσε τον client από τη λίστα, μετά κλείσε τη σύνδεση — ή το αντίστροφο, ανάλογα τι θες να συμβεί πρώτο).</p>

    const deck = document.getElementById('deck');
    const track = document.getElementById('track');
    let current = 0;

    function buildQuizSlide(s, idx) {
      const wrap = document.createElement('div');
      wrap.className = 'slide quiz-slide';
      const box = document.createElement('div');
      box.className = 'qbox';
      box.innerHTML = `<div class="eyebrow">Quiz</div><h1>${s.title}</h1>`;
      s._answered = new Array(s.questions.length).fill(false);
      s.questions.forEach((q, qi) => {
        const qEl = document.createElement('div');
        qEl.className = 'card';
        qEl.style.marginBottom = '20px';
        qEl.innerHTML = `<div class="qnum">Ερώτηση ${qi + 1} / ${s.questions.length}</div><div class="qtext">${q.q}</div>`;
        const optsWrap = document.createElement('div');
        q.opts.forEach((optText, oi) => {
          const btn = document.createElement('button');
          btn.className = 'opt';
          btn.innerHTML = optText;
          btn.addEventListener('click', () => {
            if (s._answered[qi]) return;
            s._answered[qi] = true;
            const allOpts = optsWrap.querySelectorAll('.opt');
            allOpts.forEach((o, i2) => {
              o.disabled = true;
              if (i2 === q.correct) o.classList.add('correct');
              else if (i2 === oi) o.classList.add('wrong');
            });
            const ex = qEl.querySelector('.explain');
            ex.classList.add('show');
          });
          optsWrap.appendChild(btn);
        });
        qEl.appendChild(optsWrap);
        const explain = document.createElement('div');
        explain.className = 'explain';
        explain.innerHTML = `<strong>Εξήγηση:</strong> ${q.explain}`;
        qEl.appendChild(explain);
        box.appendChild(qEl);
      });
      wrap.appendChild(box);
      return wrap;
    }

    function buildSlide(s, idx) {
      if (s.type === 'title') {
        const el = document.createElement('div');
        el.className = 'slide';
        el.innerHTML = s.html;
        return el;
      }
      if (s.type === 'quiz') {
        return buildQuizSlide(s, idx);
      }
      const el = document.createElement('div');
      el.className = 'slide';
      el.innerHTML = `<div class="eyebrow">${s.eyebrow}</div>${s.html}`;
      return el;
    }

    slides.forEach((s, i) => {
      const el = buildSlide(s, i);
      track.appendChild(el);
    });

    function layout() {
      track.style.transform = `translateX(${-current * 100}%)`;
    }

    function renderDots() {
      const dotsWrap = document.getElementById('dots');
      dotsWrap.innerHTML = '';
      slides.forEach((s, i) => {
        const d = document.createElement('div');
        d.className = 'dot' + (s.type === 'quiz' ? ' quiz' : '') + (i === current ? ' active' : '');
        d.addEventListener('click', () => goTo(i));
        dotsWrap.appendChild(d);
      });
    }

    function update() {
      layout();
      document.getElementById('progress-bar').style.width = ((current) / (slides.length - 1) * 100) + '%';
      document.getElementById('counter').textContent = (current + 1) + ' / ' + slides.length;
      document.getElementById('prevBtn').disabled = current === 0;
      document.getElementById('nextBtn').disabled = current === slides.length - 1;
      renderDots();
    }

    function goTo(i) {
      current = Math.max(0, Math.min(slides.length - 1, i));
      update();
    }

    document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
    document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
    window.addEventListener('resize', layout);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') goTo(current + 1);
      if (e.key === 'ArrowLeft') goTo(current - 1);
    });

    update();
  </script>
