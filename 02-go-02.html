<tr><td class="gt-term">υπόλοιπο</td><td class="gt-term">μεγαλύτερο που χωράει</td><td class="gt-def">αποτέλεσμα μέχρι τώρα</td></tr>
<tr><td class="gt-term">1994</td><td class="gt-term">1000 → M</td><td class="gt-def">M</td></tr>
<tr><td class="gt-term">994</td><td class="gt-term">900 → CM</td><td class="gt-def">MCM</td></tr>
<tr><td class="gt-term">94</td><td class="gt-term">90 → XC</td><td class="gt-def">MCMXC</td></tr>
<tr><td class="gt-term">4</td><td class="gt-term">4 → IV</td><td class="gt-def"><strong>MCMXCIV</strong> — τέλος</td></tr>
</table>

<div class="callout">
    <span class="tag">Δύο παράλληλα slices αντί για ένα struct</span>
    <p>
        Θα ήταν πιο καθαρό να έχεις μία λίστα από ζευγάρια «τιμή + σύμβολο» — και αυτό ακριβώς κάνει ένα
        <code>struct</code>, που θα δούμε σε επόμενο guide. Μέχρι τότε, δύο slices που κρατάς
        <strong>ευθυγραμμισμένα</strong> κάνουν τη δουλειά. Ο κανόνας είναι απλός και αυστηρός: ό,τι αλλάζεις
        στο ένα, το αλλάζεις και στο άλλο, στην ίδια ακριβώς θέση.
    </p>
</div>

<h2>Γιατί εδώ το greedy είναι σωστό</h2>

<p>
    Είναι το ίδιο ερώτημα που κάναμε στα κέρματα, και η απάντηση είναι η ίδια:
    <strong>το σύστημα σχεδιάστηκε ώστε να δουλεύει</strong>. Τα έξι αφαιρετικά ζεύγη δεν είναι διακόσμηση —
    υπάρχουν ακριβώς για να μη χρειάζεται ποτέ να γράψεις τέσσερα ίδια σύμβολα στη σειρά. Μόλις τα βάλεις
    μέσα στη λίστα, κάθε τιμή «χωράει καθαρά» στην επόμενη, όπως τα κέρματα του ευρώ.
</p>

<p>
    Δοκίμασε νοερά να αφαιρέσεις το <code>900</code> από τη λίστα. Ο κώδικας θα εξακολουθούσε να τρέχει και
    να τερματίζει κανονικά — απλά θα έβγαζε <code>DCCCC</code> για το 900. Ίδιο μοτίβο με το νόμισμα
    <code>{4, 3, 1}</code>: το greedy δεν αποτυγχάνει με εμφανή τρόπο, <strong>δίνει σιωπηλά λάθος απάντηση</strong>.
</p>

<div class="callout">
    <span class="tag">Γιατί το όριο είναι 3999</span>
    <p>
        Δεν υπάρχει σύμβολο για το 5000. Το μεγαλύτερο που μπορείς να γράψεις με τα κλασικά σύμβολα είναι
        <code>MMM</code> (3000) συν το μεγαλύτερο τριψήφιο, <code>CMXCIX</code> (999) — δηλαδή
        <code>MMMCMXCIX</code> = 3999. Πάνω από εκεί οι Ρωμαίοι έβαζαν μια γραμμή πάνω από το σύμβολο για να
        δηλώσουν πολλαπλασιασμό επί χίλια, κάτι που δεν γράφεται με απλά γράμματα.
    </p>
</div>

<h2>Παράδειγμα 4: πόσες συναντήσεις χωράνε σε μια μέρα</h2>

<p>
    Ένα πρόβλημα όπου το greedy είναι αποδεδειγμένα βέλτιστο. Έχεις μια λίστα από προτεινόμενες συναντήσεις,
    καθεμία με ώρα έναρξης και λήξης. Δεν μπορούν να επικαλύπτονται. Πόσες <strong>το πολύ</strong> μπορείς
    να χωρέσεις;
</p>

<p>
    Η πρώτη σκέψη είναι συνήθως «πάρε πρώτα τις πιο σύντομες» ή «πάρε πρώτα αυτές που ξεκινούν νωρίτερα».
    Και οι δύο δίνουν λάθος αποτελέσματα σε κάποιες περιπτώσεις. Το σωστό κριτήριο είναι διαφορετικό:
    <strong>πάρε πάντα αυτή που τελειώνει νωρίτερα</strong>.
</p>

<pre><code class="lang-go">// MaxMeetings returns how many non-overlapping meetings fit.
// meetings[i] is [start, end], ALREADY sorted by end time.
func MaxMeetings(meetings [][2]int) int {
    count := 0
    lastEnd := 0 // when the last accepted meeting finished

    for _, m := range meetings {
        if m[0] &gt;= lastEnd { // does it start after the previous one ended?
            count++
            lastEnd = m[1] // this one is now the previous
        }
    }
    return count
}
</code></pre>

<p>
    Με τις συναντήσεις <code>[1,4] [3,5] [0,6] [5,7] [8,11] [12,16]</code> (ήδη ταξινομημένες κατά ώρα λήξης):
</p>

<table class="glossary-table">
<tr><td class="gt-term">συνάντηση</td><td class="gt-term">lastEnd πριν</td><td class="gt-def">απόφαση</td></tr>
<tr><td class="gt-term">[1, 4]</td><td class="gt-term">0</td><td class="gt-def">1 &gt;= 0 → δεκτή, lastEnd = 4</td></tr>
<tr><td class="gt-term">[3, 5]</td><td class="gt-term">4</td><td class="gt-def">3 &lt; 4 → επικαλύπτεται, απορρίπτεται</td></tr>
<tr><td class="gt-term">[0, 6]</td><td class="gt-term">4</td><td class="gt-def">0 &lt; 4 → απορρίπτεται</td></tr>
<tr><td class="gt-term">[5, 7]</td><td class="gt-term">4</td><td class="gt-def">5 &gt;= 4 → δεκτή, lastEnd = 7</td></tr>
<tr><td class="gt-term">[8, 11]</td><td class="gt-term">7</td><td class="gt-def">8 &gt;= 7 → δεκτή, lastEnd = 11</td></tr>
<tr><td class="gt-term">[12, 16]</td><td class="gt-term">11</td><td class="gt-def">12 &gt;= 11 → δεκτή — σύνολο <strong>4</strong></td></tr>
</table>

<div class="callout good">
    <span class="tag">Το αναγνωρίζεις;</span>
    <p>
        Το <code>lastEnd</code> είναι το <strong>previous value</strong> pattern της Ενότητας 3: μια
        μεταβλητή που κουβαλάει μαζί της την προηγούμενη απόφαση, ώστε η τρέχουσα να μπορεί να συγκριθεί μαζί
        της. Και το <code>count</code> είναι απλός accumulator. Το greedy δεν είναι νέα τεχνική — είναι μια
        <em>στρατηγική</em> που υλοποιείται με patterns που ήδη ξέρεις.
    </p>
</div>

<h2>Γιατί «η πιο σύντομη πρώτα» δεν δουλεύει</h2>

<p>
    Αξίζει να δεις γιατί η διαισθητική επιλογή αποτυγχάνει. Πάρε τρεις συναντήσεις:
    <code>[1, 5]</code>, <code>[4, 6]</code>, <code>[5, 9]</code>.
</p>

<ul>
    <li><strong>Πιο σύντομη πρώτα:</strong> η <code>[4, 6]</code> διαρκεί μόλις 2, οπότε την παίρνεις πρώτη.
        Αλλά επικαλύπτεται με την <code>[1, 5]</code>, που τελειώνει στις 5 ενώ η <code>[4, 6]</code> έχει ήδη
        αρχίσει στις 4· και με την <code>[5, 9]</code>, που αρχίζει στις 5 ενώ η <code>[4, 6]</code> δεν έχει
        ακόμα τελειώσει. Δεν χωράει καμία άλλη. Σύνολο: <strong>1</strong>.</li>
    <li><strong>Πρώτη λήξη πρώτα:</strong> παίρνεις την <code>[1, 5]</code>, και μετά χωράει και η
        <code>[5, 9]</code>. Σύνολο: <strong>2</strong>.</li>
</ul>

<p>
    Η μία επιλογή, στο πρώτο κιόλας βήμα, κόστισε τη μισή λύση. Και πρόσεξε ότι η
    <code>[4, 6]</code> δεν είχε τίποτα κακό από μόνη της — το πρόβλημα ήταν ότι
    <em>έπιανε το κέντρο</em> του διαθέσιμου χρόνου.
</p>

<p>
    Η διαίσθηση πίσω από το «πρώτη λήξη»: κάθε φορά που διαλέγεις, θέλεις να
    <strong>ελευθερώσεις όσο περισσότερο χρόνο γίνεται</strong> για τις υπόλοιπες. Η συνάντηση που τελειώνει
    νωρίτερα αφήνει τη μεγαλύτερη δυνατή συνέχεια — και αυτό ισχύει σε κάθε βήμα, ανεξάρτητα από το τι
    ακολουθεί. Αυτή ακριβώς η ιδιότητα είναι που κάνει το greedy σωστό εδώ.
</p>

<h2>Πότε να εμπιστευτείς το greedy</h2>

<p>
    Δεν υπάρχει απλός κανόνας που να το αποφασίζει πάντα — η αυστηρή απόδειξη ότι ένα greedy είναι βέλτιστο
    είναι μαθηματική δουλειά. Αλλά υπάρχει μια ερώτηση που καλύπτει τις περισσότερες περιπτώσεις:
</p>

<div class="callout">
    <span class="tag">Η ερώτηση-κλειδί</span>
    <p>
        <em>«Μπορεί μια επιλογή που κάνω τώρα να με εμποδίσει από μια καλύτερη λύση αργότερα;»</em>
    </p>
    <p>
        Αν η απάντηση είναι <strong>όχι</strong> — αν κάθε τοπικά βέλτιστη επιλογή αφήνει το υπόλοιπο
        πρόβλημα στην καλύτερη δυνατή κατάσταση — το greedy είναι σωστό. Αν είναι <strong>ναι</strong> ή
        <strong>δεν ξέρω</strong>, χρειάζεσαι κάτι που να μπορεί να πάρει πίσω τις αποφάσεις του.
    </p>
</div>

<p>
    Στα κέρματα του ευρώ η απάντηση είναι όχι: κάθε κέρμα «χωράει» ακέραιο πλήθος φορές μέσα στο επόμενο
    μεγαλύτερο, οπότε το να πάρεις το μεγαλύτερο δεν χαλάει ποτέ τίποτα. Στο νόμισμα <code>{4, 3, 1}</code>
    η απάντηση είναι ναι: το 4 δεν σχετίζεται «καθαρά» με το 3, και παίρνοντάς το χαλάς το υπόλοιπο.
</p>

<div class="callout good">

    </p>

// MaxTasks returns how many tasks fit inside the time budget.
func MaxTasks(durations []int, budget int) int {
    slices.Sort(durations) // shortest first - the greedy choice

    count := 0
    spent := 0

    for _, d := range durations {
        if spent+d &gt; budget {
            break // it does not fit, and every later one is even longer
        }
        spent += d
        count++
    }
    return count
}

//   10 -&gt; spent 15 (2 tasks)
//   20 -&gt; spent 35 (3 tasks)
//   30 -&gt; would be 65, over budget -&gt; stop

// used[i] records whether letters[i] is already placed.
// current holds the letters chosen so far, in order.
func Arrange(letters []string, used []bool, current []string) {

    // (1) THE END: every position is filled - one complete arrangement
    if len(current) == len(letters) {
        fmt.Println(current)
        return
    }

    // (2) THE LOOP: try every letter as a candidate for the current position
    for i := 0; i &lt; len(letters); i++ {

        // (3) THE CHECK: is this candidate allowed here?
        if used[i] {
            continue // no - skip it, do not descend at all
        }

        // (4) CHOOSE: commit to this candidate
        used[i] = true
        current = append(current, letters[i])

        // (5) EXPLORE: let recursion fill ALL the remaining positions
        Arrange(letters, used, current)

        // (6) THE RECURSION WAKES UP HERE - and we UN-CHOOSE
        used[i] = false
        current = current[:len(current)-1]

        // (7) the loop now continues with the next candidate
    }
}

// [Β Α Γ]
// [Β Γ Α]

<h2>Δεύτερο παράδειγμα: ποιοι αριθμοί αθροίζουν στον στόχο</h2>

<p>

<p>

</p>

<pre><code class="lang-go">// PrintSubsets prints every subset of numbers[index:] that sums to target.
func PrintSubsets(numbers []int, target, index int, chosen []int) {
    if target == 0 {
        fmt.Println(chosen) // base case: exact hit, print this combination
        return
    }
    if target &lt; 0 || index &gt;= len(numbers) {
        return // base case: overshot, or ran out of numbers - dead end
    }

    chosen = append(chosen, numbers[index])                       // 1. CHOOSE
    PrintSubsets(numbers, target-numbers[index], index+1, chosen) // 2. EXPLORE
    chosen = chosen[:len(chosen)-1]                               // 3. UN-CHOOSE

    // now explore the other branch: what if we skip this number entirely?
    PrintSubsets(numbers, target, index+1, chosen)
}

    PrintSubsets([]int{2, 3, 5, 7}, 10, 0, nil)
}

// [3 7]

        <code>RemoveAt</code> στην Ενότητα 4. Η λύση: αντέγραψε ρητά, με
        <code>append([]int{}, chosen...)</code>.

<h2>Το κλάδεμα: γιατί το κόστος παραμένει διαχειρίσιμο</h2>

<p>
    Τέσσερις αριθμοί δίνουν <code>2⁴ = 16</code> πιθανά υποσύνολα. Είκοσι αριθμοί δίνουν πάνω από ένα

</p>

<p>

    ξεκινούσε από εκεί. Αυτό λέγεται <strong>κλάδεμα</strong> (pruning), και είναι η διαφορά ανάμεσα σε έναν

</p>

func ArrangeNoAB(letters []string, used []bool, current []string) int {

</p>

<pre><code class="lang-go">// board[row] = the column of the queen in that row, or -1 if the row is empty.

<div class="callout good">

<h2>Ο έλεγχος: απειλείται αυτό το τετράγωνο;</h2>

<p>
    Επειδή τοποθετούμε μία βασίλισσα ανά γραμμή και προχωράμε από πάνω προς τα κάτω, δεν χρειάζεται να
    ελέγξουμε γραμμές (αδύνατο να συγκρουστούν) ούτε τις γραμμές από κάτω (είναι ακόμα άδειες). Μένουν οι
    στήλες και οι διαγώνιοι, μόνο για τις γραμμές που έχουμε ήδη γεμίσει:
</p>

<pre><code class="lang-go">// isSafe reports whether a queen at (row, col) is attacked by any
// queen already placed in rows 0..row-1.
func isSafe(board []int, row, col int) bool {
    for r := 0; r &lt; row; r++ {
        c := board[r] // the column of the queen in row r

        if c == col {
            return false // same column
        }
        if r-c == row-col || r+c == row+col {
            return false // same diagonal
        }
    }
    return true
}
</code></pre>

<div class="callout">
    <span class="tag">Πώς ελέγχονται οι διαγώνιοι με μία πράξη</span>
    <p>
        Δύο τετράγωνα βρίσκονται στην ίδια διαγώνιο ακριβώς όταν η διαφορά τους
        <code>γραμμή − στήλη</code> είναι ίδια (η μία διαγώνιος), ή όταν το άθροισμά τους
        <code>γραμμή + στήλη</code> είναι ίδιο (η άλλη). Δοκίμασέ το: τα <code>(0,0)</code>,
        <code>(1,1)</code>, <code>(2,2)</code> έχουν όλα διαφορά 0. Τα <code>(0,2)</code>,
        <code>(1,1)</code>, <code>(2,0)</code> έχουν όλα άθροισμα 2.
    </p>
</div>

<h2>Ο αλγόριθμος</h2>

<pre><code class="lang-go">// SolveQueens tries to fill every row from the given row downwards.
// It returns true as soon as one full solution is found.
func SolveQueens(board []int, row int) bool {
    if row == len(board) {
        return true // base case: every row has a queen - solved
    }

    for col := 0; col &lt; len(board); col++ {
        if !isSafe(board, row, col) {
            continue // PRUNE: attacked square, do not even go down this branch
        }

        board[row] = col              // 1. CHOOSE
        if SolveQueens(board, row+1) { // 2. EXPLORE
            return true                //    it worked - stop everything
        }
        board[row] = -1               // 3. UN-CHOOSE
    }

    return false // no column in this row works - tell the caller to back up
}
</code></pre>

<p>
    Δώδεκα γραμμές. Και πρόσεξε ότι είναι <strong>ακριβώς ο ίδιος σκελετός</strong> με το
    <code>PrintSubsets</code>: base case, λούπα πάνω στις επιλογές, choose, explore, un-choose. Το μόνο που
    άλλαξε είναι τι σημαίνει «επιλογή» και τι σημαίνει «έγκυρη».
</p>

<h2>Τι σημαίνει το <code>return false</code> στο τέλος</h2>

<p>
    Αυτή η γραμμή είναι η καρδιά του backtracking και συχνά παρεξηγείται. Λέει:
    <em>«δοκίμασα και τις 8 στήλες αυτής της γραμμής, καμία δεν οδηγεί σε λύση — άρα κάποια από τις επιλογές

</p>

<p>
    Ο καλών παίρνει αυτό το <code>false</code>, εκτελεί το δικό του <code>board[row] = -1</code>, και
    δοκιμάζει την επόμενη δική του στήλη. Έτσι η ακύρωση των επιλογών μεταδίδεται προς τα πάνω, επίπεδο-επίπεδο, όσο χρειάζεται. Κανείς

<div class="callout">

<div class="eyebrow">Ενότητα 7 / 8 — Greedy & Backtracking</div>
<h1>Sudoku: ο ίδιος σκελετός, άλλος περιορισμός</h1>

<p class="lede">
    Αν το N-Queens σου φάνηκε εξειδικευμένο, δες τι γίνεται όταν αλλάξεις μόνο τον έλεγχο εγκυρότητας. Ο
    σκελετός μένει γραμμή προς γραμμή ο ίδιος.
</p>

<p>
    Το πλέγμα είναι <code>[][]int</code> 9×9, όπου το <strong>0 σημαίνει κενό κελί</strong>. Κάθε αριθμός
    1–9 πρέπει να εμφανίζεται ακριβώς μία φορά σε κάθε γραμμή, κάθε στήλη, και κάθε κουτί 3×3.
</p>

<pre><code class="lang-go">// isValidMove reports whether writing val at (row, col) breaks any rule.
func isValidMove(grid [][]int, row, col, val int) bool {
    for i := 0; i &lt; 9; i++ {
        if grid[row][i] == val || grid[i][col] == val {
            return false // already used in this row or this column
        }
    }

    // top-left corner of the 3x3 box this cell belongs to
    boxRow, boxCol := (row/3)*3, (col/3)*3

    for r := boxRow; r &lt; boxRow+3; r++ {
        for c := boxCol; c &lt; boxCol+3; c++ {
            if grid[r][c] == val {
                return false // already used in this 3x3 box
            }
        }
    }
    return true
}
</code></pre>

<div class="callout">
    <span class="tag">Η αριθμητική του κουτιού</span>
    <p>
        Το <code>(row/3)*3</code> είναι ακέραια διαίρεση, από την Ενότητα 3 του Μέρους 1. Για γραμμές 0, 1, 2
        δίνει 0· για 3, 4, 5 δίνει 3· για 6, 7, 8 δίνει 6. Δηλαδή «στρογγυλοποίησε προς τα κάτω στο
        πλησιέστερο πολλαπλάσιο του 3» — ακριβώς η πάνω-αριστερή γωνία του κουτιού στο οποίο ανήκει το κελί.
    </p>
</div>

<pre><code class="lang-go">// SolveSudoku fills every empty cell. It returns true if the puzzle is solvable.
func SolveSudoku(grid [][]int) bool {
    for row := 0; row &lt; 9; row++ {
        for col := 0; col &lt; 9; col++ {
            if grid[row][col] != 0 {
                continue // already filled - not our decision to make
            }

            // this cell is empty: try every digit
            for val := 1; val &lt;= 9; val++ {
                if !isValidMove(grid, row, col, val) {
                    continue // PRUNE
                }

                grid[row][col] = val   // 1. CHOOSE
                if SolveSudoku(grid) { // 2. EXPLORE
                    return true
                }
                grid[row][col] = 0     // 3. UN-CHOOSE - erase the pencil mark
            }

            return false // no digit fits here - the caller must change something
        }
    }
    return true // no empty cell found anywhere - solved
}
</code></pre>

<div class="callout good">
    <span class="tag">Εδώ το un-choose είναι υποχρεωτικό</span>
    <p>
        Σε αντίθεση με το N-Queens, εδώ η επόμενη επανάληψη <strong>δεν</strong> ξαναγράφει το κελί — γιατί
        αν κανένα ψηφίο δεν ταιριάζει, φεύγουμε με <code>return false</code> και το κελί πρέπει να έχει μείνει
        <code>0</code>. Αν ξεχάσεις το <code>grid[row][col] = 0</code>, αφήνεις πίσω σου ένα ψηφίο που
        αποδείχθηκε λάθος, και το puzzle γίνεται άλυτο για λόγους που δεν υπάρχουν στα πραγματικά δεδομένα.
    </p>
</div>

<p>
    Δύο διαφορετικά προβλήματα, ίδιος σκελετός. Αν παραθέσεις τις δύο functions δίπλα-δίπλα, οι μόνες
    ουσιαστικές διαφορές είναι: <em>τι θεωρείται επιλογή</em> (στήλη / ψηφίο), <em>τι θεωρείται
    έγκυρο</em> (<code>isSafe</code> / <code>isValidMove</code>), και <em>πότε τελειώσαμε</em> (όλες οι
    γραμμές / κανένα κενό κελί). Όλα τα υπόλοιπα είναι το ίδιο μοτίβο.
</p>
`);

<h2>Λύση</h2>
<p>Δοκίμασέ το πρώτα μόνος σου. Σύρε παρακάτω μόνο όταν έχεις κολλήσει ή θέλεις να συγκρίνεις.</p>

<div class="spoiler"><div class="spoiler-lock"><span>Drag to reveal →</span></div>
<pre><code class="lang-go">// FindPath returns one route from (r, c) to the 'E' cell, and whether
// such a route exists at all.
func FindPath(grid []string, r, c int, visited map[[2]int]bool) ([][2]int, bool) {
    // base case 1: outside the grid
    if r &lt; 0 || r &gt;= len(grid) || c &lt; 0 || c &gt;= len(grid[r]) {
        return nil, false
    }
    // base case 2: a wall
    if grid[r][c] == '#' {
        return nil, false
    }
    // base case 3: already tried this cell on this search
    here := [2]int{r, c}
    if visited[here] {
        return nil, false
    }
    visited[here] = true

    // base case 4: arrived - the route from here is just "here"
    if grid[r][c] == 'E' {
        return [][2]int{here}, true
    }

    directions := [4][2]int{{-1, 0}, {1, 0}, {0, -1}, {0, 1}}

    for _, d := range directions {
        if rest, ok := FindPath(grid, r+d[0], c+d[1], visited); ok {
            // this direction worked: put the current cell in front of it
            return append([][2]int{here}, rest...), true
        }
    }

    return nil, false // every direction was a dead end
}

func main() {
    grid := []string{
        "#######",
        "#S..#.#",
        "#.##..#",
        "#....E#",
        "#######",
    }
    visited := make(map[[2]int]bool)

    if path, ok := FindPath(grid, 1, 1, visited); ok {
        fmt.Println("steps:", len(path))
        fmt.Println(path)
    } else {
        fmt.Println("no route")
    }
}
</code></pre></div>

        <strong>απαραίτητο</strong>: το ίδιο κελί μπορεί κάλλιστα να ανήκει σε δεύτερη, διαφορετική διαδρομή.
        Αυτή η διάκριση — «μία λύση» εναντίον «όλες οι λύσεις» — καθορίζει αν χρειάζεσαι un-choose, και είναι

<div class="callout">

    </p>

<div class="callout">

<div class="eyebrow">Ενότητα 8 / 8 — Δυναμικός Προγραμματισμός</div>
<h1>Memoization: κράτα ό,τι έχεις ήδη υπολογίσει</h1>

<p class="lede">
    Στην Ενότητα 6 αφήσαμε ένα πρόβλημα ανοιχτό. Ο αναδρομικός <code>Fib</code> ήταν σωστός και σύντομος, αλλά
    για <code>n = 50</code> χρειαζόταν περίπου 25 δισεκατομμύρια κλήσεις. Ας δούμε γιατί, και ας το
    διορθώσουμε με μία μεταβλητή παραπάνω.
</p>

<pre><code class="lang-go">// The version from section 6 - correct, but exponential.
func Fib(n int) int {
    if n &lt;= 2 {
        return 1
    }
    return Fib(n-1) + Fib(n-2)
}
</code></pre>

<p>Το δέντρο κλήσεων για το <code>Fib(6)</code>:</p>

<pre><code>                      Fib(6)
                   /          \
              Fib(5)            Fib(4)
             /      \          /      \
        Fib(4)    Fib(3)   Fib(3)   Fib(2)
       /     \    /    \    /    \
   Fib(3) Fib(2) ...  ...  ...  ...
</code></pre>

<p>
    Μέτρησε πόσες φορές εμφανίζεται το <code>Fib(4)</code>: δύο. Το <code>Fib(3)</code>: τρεις. Και κάθε φορά
    υπολογίζεται από την αρχή, σαν να μην το είχαμε ξαναδεί ποτέ. Το πρόγραμμα δεν έχει κανέναν τρόπο να
    θυμηθεί τι έχει ήδη βρει.
</p>

<h2>Η διόρθωση: ένα map ως σημειωματάριο</h2>

<p>
    Η λύση είναι τόσο απλή που ξενίζει. Πριν υπολογίσεις κάτι, κοίτα αν το έχεις ήδη υπολογίσει. Αφού το
    υπολογίσεις, γράψ' το κάπου. Η τεχνική έχει όνομα: <strong>memoization</strong>.
</p>

<pre><code class="lang-go">// Fib with a memo: every value is computed at most once.
// memo[k] holds the already-known result for Fib(k).
func Fib(n int, memo map[int]int) int {
    if n &lt;= 2 {
        return 1 // base case, as before
    }

    if value, ok := memo[n]; ok {
        return value // seen before - read it back instead of recomputing
    }

    result := Fib(n-1, memo) + Fib(n-2, memo)
    memo[n] = result // write it down before returning
    return result
}

func main() {
    memo := make(map[int]int)
    fmt.Println(Fib(50, memo)) // 12586269025 - instant
}
</code></pre>

<div class="callout good">
    <span class="tag">Τρεις γραμμές, τέσσερις τάξεις μεγέθους</span>
    <p>
        Προσθέσαμε έναν έλεγχο, μια ανάθεση και μια παράμετρο. Ο αριθμός των κλήσεων για το
        <code>Fib(50)</code> έπεσε από περίπου 25 δισεκατομμύρια σε λιγότερες από 100. Η πολυπλοκότητα πήγε
        από <code>O(2ⁿ)</code> σε <code>O(n)</code>, επειδή πλέον κάθε τιμή του <code>n</code> υπολογίζεται
        <strong>ακριβώς μία φορά</strong>.
    </p>
</div>

<h2>Γιατί δουλεύει: το δέντρο γίνεται λίστα</h2>

<p>
    Χωρίς memo, το <code>Fib(6)</code> ζητάει το <code>Fib(4)</code> δύο φορές και υπολογίζει δύο ολόκληρα
    υποδέντρα. Με το memo, το δεύτερο αίτημα βρίσκει την απάντηση έτοιμη και επιστρέφει αμέσως — χωρίς να
    κατέβει καθόλου. Το δεξί υποδέντρο, με όλα τα κλαδιά του, απλώς δεν εξερευνάται ποτέ.
</p>

<p>
    Στην πράξη, από τις δύο αναδρομικές κλήσεις κάθε επιπέδου, μόνο η μία κάνει πραγματική δουλειά. Το δέντρο
    εκφυλίζεται σε μια αλυσίδα μήκους <code>n</code>.
</p>

<div class="callout">
    <span class="tag">Πότε γράφεις στο memo</span>
    <p>
        Το <code>memo[n] = result</code> μπαίνει <strong>αφού</strong> υπολογιστεί το αποτέλεσμα και
        <strong>πριν</strong> από το <code>return</code>. Αν το ξεχάσεις, ο κώδικας παραμένει απόλυτα σωστός —
        απλώς δεν κερδίζεις τίποτα, γιατί το memo μένει άδειο και κάθε κλήση ξαναϋπολογίζει τα πάντα. Είναι
        ένα σφάλμα που δεν εμφανίζεται ως λάθος αποτέλεσμα, μόνο ως αργός κώδικας.
    </p>
</div>

<div class="callout">
    <span class="tag">Το memo πρέπει να είναι κοινό για όλες τις κλήσεις</span>
    <p>
        Πρόσεξε ότι το <code>memo</code> δημιουργείται μία φορά στη <code>main</code> και περνιέται σε κάθε

<div class="eyebrow">Ενότητα 8 / 8 — Δυναμικός Προγραμματισμός</div>
<h1>Tabulation: η ίδια ιδέα, από την άλλη κατεύθυνση</h1>

<p class="lede">
    Το memoization ξεκινάει από το μεγάλο πρόβλημα και κατεβαίνει προς τα μικρά. Υπάρχει και η αντίθετη
    διαδρομή: ξεκίνα από τα μικρά, και χτίσε προς τα πάνω μέχρι να φτάσεις σε αυτό που ζητήθηκε.
</p>

<p>
    Αν το <code>Fib(n)</code> χρειάζεται τα <code>Fib(n-1)</code> και <code>Fib(n-2)</code>, και εκείνα
    χρειάζονται τα προηγούμενά τους, τότε γιατί να μην τα υπολογίσουμε <strong>με τη σειρά</strong>, από το 1
    και πάνω; Τότε κάθε τιμή που χρειαζόμαστε θα είναι ήδη έτοιμη όταν φτάσουμε σε αυτήν.
</p>

<pre><code class="lang-go">// FibTable builds every value from the bottom up. No recursion at all.
func FibTable(n int) int {
    if n &lt;= 2 {
        return 1
    }

    table := make([]int, n+1)
    table[1], table[2] = 1, 1 // the base cases, written down directly

    for i := 3; i &lt;= n; i++ {
        table[i] = table[i-1] + table[i-2] // both are already known
    }
    return table[n]
}
</code></pre>

        <td style="padding:8px;"><strong>Κίνδυνος</strong></td>
        <td style="padding:8px;">stack overflow σε μεγάλο <code>n</code></td>

        <code>n</code> είναι πολύ μεγάλο και ανησυχείς για το βάθος της αναδρομής, ή όταν θέλεις να μειώσεις
        και τη μνήμη — κάτι που, όπως θα δούμε αμέσως, γίνεται μόνο με τη bottom-up μορφή.
    </p>
</div>

<h2>Ένα τελευταίο σκαλί: πετάμε και τον πίνακα</h2>

<p>
    Κοίταξε ξανά τη λούπα του <code>FibTable</code>. Για να υπολογίσει το <code>table[i]</code> χρειάζεται
    μόνο τα δύο αμέσως προηγούμενα. Ό,τι υπάρχει πιο πίσω στον πίνακα δεν ξαναδιαβάζεται ποτέ. Άρα γιατί να
    το κρατάμε;
</p>

<pre><code class="lang-go">// Only the last two values are ever needed - two variables are enough.
func FibTwoVars(n int) int {
    if n &lt;= 2 {
        return 1
    }

    prev, current := 1, 1

    for i := 3; i &lt;= n; i++ {
        prev, current = current, prev+current
    }
    return current
}
</code></pre>

<div class="callout good">
    <span class="tag">Το αναγνωρίζεις;</span>
    <p>
        Δύο μεταβλητές που κουβαλάνε την προηγούμενη κατάσταση καθώς προχωράει η λούπα — αυτό είναι το
        <strong>previous value</strong> pattern της Ενότητας 3, με δύο μεταβλητές αντί για μία. Και η γραμμή
        <code>prev, current = current, prev+current</code> είναι η ταυτόχρονη ανάθεση που είδαμε στο bubble
        sort: η Go υπολογίζει πρώτα ολόκληρη τη δεξιά πλευρά, οπότε δεν χρειάζεται βοηθητική μεταβλητή.
    </p>
</div>

<p>
    Η πολυπλοκότητα χρόνου παραμένει <code>O(n)</code>, αλλά η μνήμη έπεσε από <code>O(n)</code> σε
    <code>O(1)</code>. Αυτή η βελτιστοποίηση είναι διαθέσιμη μόνο στη bottom-up μορφή: το memoization
    χρειάζεται ούτως ή άλλως ολόκληρο το σημειωματάριο, γιατί δεν ξέρει εκ των προτέρων με ποια σειρά θα του
    ζητηθούν οι τιμές.
</p>
`);

<h2>Γιατί το πρόβλημα ταιριάζει στο DP</h2>

<p>Ας ελέγξουμε τις δύο προϋποθέσεις:</p>

<ul>

<h2>Η λύση, από κάτω προς τα πάνω</h2>

<pre><code class="lang-go">// MinCoins returns the fewest coins that add up exactly to amount,
// or -1 if the amount cannot be made at all.
func MinCoins(coins []int, amount int) int {
    // best[i] = fewest coins needed to make exactly i
    best := make([]int, amount+1)
    // best[0] is already 0: zero coins are needed to make zero

    for i := 1; i &lt;= amount; i++ {
        best[i] = -1 // -1 means "not reachable so far"

        for _, c := range coins {
            if c &gt; i {
                continue // this coin alone is bigger than the amount
            }

            rest := best[i-c]
            if rest == -1 {
                continue // the remainder itself cannot be made
            }

            if best[i] == -1 || rest+1 &lt; best[i] {
                best[i] = rest + 1 // this coin gives a better result
            }
        }
    }
    return best[amount]
}
</code></pre>

<p>

<pre><code class="lang-go">// CountPaths returns how many ways lead from the top-left corner to the
// bottom-right corner, moving only right or down.
func CountPaths(rows, cols int) int {
    grid := make([][]int, rows)
    for r := range grid {
        grid[r] = make([]int, cols)
    }

    for r := 0; r &lt; rows; r++ {
        for c := 0; c &lt; cols; c++ {
            if r == 0 || c == 0 {
                grid[r][c] = 1 // along the top row or left column there is one way
                continue
            }
            grid[r][c] = grid[r-1][c] + grid[r][c-1] // from above plus from the left
        }
    }
    return grid[rows-1][cols-1]
}
// CountPaths(3, 3) -&gt; 6
// CountPaths(3, 7) -&gt; 28
</code></pre>

<pre><code class="lang-go">// CountWays returns how many ways there are to climb n stairs,
// taking one or two steps at a time.
func CountWays(n int) int {
    if n &lt;= 2 {
        return n // 1 stair: one way. 2 stairs: two ways (1+1 or 2)
    }

    ways := make([]int, n+1)
    ways[1], ways[2] = 1, 2

    for i := 3; i &lt;= n; i++ {

<h2>Κόστος και αναζήτηση</h2>
<div class="gs-wrap">
  <div class="gs-pill"><span class="gs-name">Big-O</span><span class="gs-def">πώς μεγαλώνει ο χρόνος όταν μεγαλώνουν τα δεδομένα</span></div>
  <div class="gs-pill"><span class="gs-name">linear search</span><span class="gs-def">ένα-ένα μέχρι να βρεθεί — O(n), δουλεύει πάντα</span></div>
  <div class="gs-pill"><span class="gs-name">binary search</span><span class="gs-def">υποδιπλασιάζει το διάστημα — O(log n), απαιτεί ταξινομημένα δεδομένα</span></div>
  <div class="gs-pill"><span class="gs-name">slices.Sort</span><span class="gs-def">η έτοιμη λύση της Go, in place, για κάθε συγκρίσιμο τύπο</span></div>
  <div class="gs-pill"><span class="gs-name">stable sort</span><span class="gs-def">ίσα στοιχεία κρατάνε τη μεταξύ τους σειρά</span></div>
</div>

<h2>Αναδρομή και εξερεύνηση</h2>
<div class="gs-wrap">
  <div class="gs-pill"><span class="gs-name">base case</span><span class="gs-def">επιστροφή χωρίς νέα κλήση — πρέπει να είναι φτάσιμο από κάθε είσοδο</span></div>
  <div class="gs-pill"><span class="gs-name">call stack</span><span class="gs-def">η στοίβα κλήσεων· γεμίζει σε βαθιά αναδρομή και δίνει stack overflow</span></div>
  <div class="gs-pill"><span class="gs-name">divide and conquer</span><span class="gs-def">χώρισε, λύσε αναδρομικά, ένωσε — υποπροβλήματα που δεν επικαλύπτονται</span></div>
  <div class="gs-pill"><span class="gs-name">DFS</span><span class="gs-def">βάθος πρώτα — Stack ή αναδρομή· «υπάρχει διαδρομή;»</span></div>
  <div class="gs-pill"><span class="gs-name">BFS</span><span class="gs-def">πλάτος πρώτα — Queue· δίνει τη συντομότερη διαδρομή</span></div>
  <div class="gs-pill"><span class="gs-name">visited map</span><span class="gs-def">υποχρεωτικό σε κάθε εξερεύνηση γραφήματος, αλλιώς οι κύκλοι δεν τελειώνουν</span></div>
</div>

<h2>Στρατηγικές απόφασης</h2>
<div class="gs-wrap">
  <div class="gs-pill"><span class="gs-name">greedy</span><span class="gs-def">τοπικά βέλτιστη επιλογή, χωρίς επιστροφή — γρήγορο, όχι πάντα σωστό</span></div>
  <div class="gs-pill"><span class="gs-name">αντιπαράδειγμα</span><span class="gs-def">μικρή είσοδος που αποδεικνύει ότι το greedy δεν αρκεί</span></div>

  <div class="gs-pill"><span class="gs-name">pruning</span><span class="gs-def">εγκατάλειψη υποδέντρου μόλις αποδειχθεί άκυρο</span></div>
  <div class="gs-pill"><span class="gs-name">memoization</span><span class="gs-def">αναδρομή που κρατάει τα ήδη γνωστά αποτελέσματα</span></div>

</div>
