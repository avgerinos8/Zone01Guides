        addContent(`
<div class="eyebrow">Ενότητα 4 / 8 — Βασικές Δομές Δεδομένων</div>
<h1>Βασικές Δομές Δεδομένων</h1>
<p class="lede">Θα φτιάξουμε δύο από τις πιο θεμελιώδεις δομές δεδομένων στον προγραμματισμό — τη Στοίβα (Stack) και την Ουρά (Queue) — χρησιμοποιώντας ΜΟΝΟ ό,τι ξέρουμε ήδη: slices και functions. Δεν έχουμε δει ακόμα structs ή methods, οπότε θα υλοποιήσουμε αυτές τις δομές με τον πιο απλό δυνατό τρόπο: ένα slice που αντιπροσωπεύει τη δομή, και functions που το χειρίζονται.</p>

<h2>Πριν ξεκινήσουμε: τι ξέρουμε ήδη για το append</h2>
<p>Ο μόνος τρόπος που έχουμε δει μέχρι τώρα για να προσθέσουμε στοιχείο σε ένα slice είναι το <code>append</code> — και το <code>append</code> προσθέτει πάντα στο <strong>τέλος</strong> του slice, ποτέ στη μέση ή στην αρχή:</p>
<pre><code class="lang-go">numbers := []int{1, 2, 3}
numbers = append(numbers, 4) // numbers is now [1, 2, 3, 4]</code></pre>

<p>Θυμήσου επίσης κάτι που ΔΕΝ έχουμε: σε αντίθεση με ένα <code>map</code>, όπου το <code>delete(m, key)</code> αφαιρεί ένα στοιχείο άμεσα, <strong>δεν υπάρχει έτοιμη <code>delete</code> function για slices</strong> στη Go. Αν θες να "αφαιρέσεις" κάτι από ένα slice, χρειάζεται να το κάνεις εσύ ρητά, με slicing — κόβοντας το slice στο σημείο που θες.</p>
<pre><code class="lang-go">numbers := []int{1, 2, 3}
numbers = numbers[:2] // numbers is now [1, 2]</code></pre>

<br>
<h1>Στοίβα (Stack) — LIFO</h1>
<p class="lede">Μια στοίβα είναι μια δομή δεδομένων όπου το τελευταίο στοιχείο που μπήκε είναι το πρώτο που βγαίνει — <strong>LIFO: Last-In, First-Out</strong>. Σκέψου μια στοίβα από πιάτα: βάζεις νέα πιάτα από πάνω, και όταν παίρνεις ένα, παίρνεις πάντα αυτό που είναι στην κορυφή — το πιο πρόσφατο.</p>

<h2>Οι τρεις βασικές λειτουργίες</h2>
<div class="grid3">
  <div class="card"><h3>Push</h3><p>Προσθέτει ένα νέο στοιχείο στην ΚΟΡΥΦΗ της στοίβας.</p></div>
  <div class="card"><h3>Pop</h3><p>Αφαιρεί ΚΑΙ επιστρέφει το στοιχείο από την κορυφή της στοίβας.</p></div>
  <div class="card"><h3>Peek</h3><p>Επιστρέφει το στοιχείο της κορυφής ΧΩΡΙΣ να το αφαιρέσει.</p></div>
</div>

<h2>Υλοποίηση με slice</h2>
<p>Ένα slice <strong>είναι</strong> μια στοίβα — το <code>append</code> προσθέτει στο τέλος (η "κορυφή" μας). Θεωρούμε ΠΑΝΤΑ ότι η κορυφή της στοίβας είναι το ΤΕΛΕΥΤΑΙΟ στοιχείο του slice — αυτή είναι μια σύμβαση που κρατάμε συνεπή σε όλες τις functions:</p>

<pre><code class="lang-go">// Push adds a value to the top of the stack (end of the slice)
// and returns the updated slice.
func Push(stack []int, value int) []int {
    return append(stack, value)
}</code></pre>

<div class="callout">
  <span class="tag">Προσοχή / Συχνό λάθος</span>
  Το <code>Push</code> δεν τροποποιεί τη στοίβα "επί τόπου" (in-place) — επιστρέφει ΚΑΙΝΟΥΡΙΟ slice. Αυτό δεν είναι δικό του χαρακτηριστικό: το <code>Push</code> ΕΙΝΑΙ, από μέσα, απλά ένα <code>append</code> — οπότε κληρονομεί ακριβώς τη συμπεριφορά του (θυμήσου: το <code>append</code> μπορεί να χρειαστεί να δημιουργήσει νέο underlying array).
  <br>
  Γι' αυτό ΠΑΝΤΑ ξαναγράφουμε τη μεταβλητή της στοίβας με το αποτέλεσμα: <code>myStack = Push(myStack, 5)</code>, ποτέ απλά <code>Push(myStack, 5)</code> χωρίς ανάθεση — ακριβώς όπως θα έκανες και με σκέτο <code>append</code>.
</div>

<p>Για το <code>Pop</code>, χρειαζόμαστε να "αφαιρέσουμε" το τελευταίο στοιχείο — και όπως είδαμε, αυτό σημαίνει slicing, όχι κάποιο <code>delete</code>. Κόβουμε το slice ώστε να κρατήσει ό,τι ΔΕΝ είναι η κορυφή:</p>

<pre><code class="lang-go">// Pop removes and returns the top value of the stack,
// along with the updated stack. ok is false if the stack was empty.
func Pop(stack []int) (value int, updatedStack []int, ok bool) {
    if len(stack) == 0 {
        return 0, stack, false // guard clause: nothing to pop
    }
    top := len(stack) - 1
    value = stack[top]
    updatedStack = stack[:top] // slice off everything except the top
    return value, updatedStack, true
}

// Peek returns the top value without removing it.
func Peek(stack []int) (value int, ok bool) {
    if len(stack) == 0 {
        return 0, false
    }
    return stack[len(stack)-1], true
}</code></pre>

<div class="callout good">
  <span class="tag">Γιατί το stack[:top] είναι καλή επιλογή από πλευράς μνήμης</span>
  Το <code>stack[:top]</code> δεν δημιουργεί καινούριο underlying array — απλά δηλώνει ότι το slice "βλέπει" λιγότερα στοιχεία από πριν (μικρότερο <code>len</code>, ίδιο <code>cap</code>). Η τιμή που ήταν στην κορυφή ΔΕΝ διαγράφεται πραγματικά από τη μνήμη — απλά δεν είναι πια "ορατή" μέσα από το slice. Αυτό είναι καλό για εμάς εδώ: αν κάνεις <code>Push</code> ξανά αμέσως μετά, το νέο στοιχείο μπαίνει ακριβώς εκεί που ήταν το παλιό, χωρίς να χρειαστεί να δεσμευτεί νέος χώρος μνήμης.
</div>

<p>Πρόσεξε το πρότυπο <code>(value int, ok bool)</code> στο <code>Peek</code>, και το αντίστοιχο τριπλό στο <code>Pop</code> — αυτό είναι μια πολύ κοινή σύμβαση στη Go: μια δεύτερη (ή τρίτη) τιμή επιστροφής τύπου <code>bool</code> δηλώνει αν η "κύρια" τιμή είναι πραγματικά έγκυρη. Το χρησιμοποιούμε εδώ αντί για κάποιο sentinel value, γιατί ένα stack από <code>int</code> θα μπορούσε θεωρητικά να περιέχει ΚΑΘΕ δυνατή τιμή int — δεν υπάρχει "ασφαλής" sentinel τιμή να επιλέξουμε.</p>

<pre><code class="lang-go">func main() {
    var stack []int // nil slice, behaves as an empty stack

    stack = Push(stack, 1) // stack is now [1], top = 1
    stack = Push(stack, 2) // stack is now [1, 2], top = 2
    stack = Push(stack, 3) // stack is now [1, 2, 3], top = 3

    top, ok := Peek(stack) // Check the top of the stack
    fmt.Println(top, ok)   // 3 true

    value, stack, ok := Pop(stack)  // Check and remove the top of the stack
    fmt.Println(value, ok) // 3 true
    fmt.Println(stack)     // [1, 2]
}</code></pre>

<div class="eyebrow">Ενότητα 4 / 8 — Βασικές Δομές Δεδομένων</div>
<h1>Ουρά (Queue) — FIFO</h1>
<p class="lede">Η αντίστροφη λογική από τη στοίβα: το ΠΡΩΤΟ στοιχείο που μπήκε είναι το ΠΡΩΤΟ που βγαίνει — <strong>FIFO: First-In, First-Out</strong>. Σκέψου μια ουρά ανθρώπων σε ταμείο: όποιος μπήκε πρώτος στην ουρά, εξυπηρετείται πρώτος.</p>

<h2>Οι δύο βασικές λειτουργίες</h2>
<div class="grid2">
  <div class="card"><h3>Enqueue</h3><p>Προσθέτει ένα νέο στοιχείο στο ΤΕΛΟΣ της ουράς.</p></div>
  <div class="card"><h3>Dequeue</h3><p>Αφαιρεί ΚΑΙ επιστρέφει το στοιχείο από την ΑΡΧΗ της ουράς.</p></div>
</div>

<h2>Υλοποίηση με slice</h2>
<p>Χρησιμοποιούμε την ίδια σύμβαση: το τέλος του slice είναι το "τέλος" της ουράς (εκεί μπαίνουν νέα στοιχεία), και το index 0 είναι η "αρχή" (από εκεί φεύγουν):</p>

<pre><code class="lang-go">// Enqueue adds a value to the back of the queue.
func Enqueue(queue []int, value int) []int {
    return append(queue, value)
}

// Dequeue removes and returns the value at the front of the queue.
func Dequeue(queue []int) (value int, updatedQueue []int, ok bool) {
    if len(queue) == 0 {
        return 0, queue, false
    }
    value = queue[0]
    updatedQueue = queue[1:] // slice off the front element
    return value, updatedQueue, true
}</code></pre>

<div class="callout">
  <span class="tag">Performance</span>
  Το <code>Dequeue</code> εδώ, κάθε φορά που αφαιρεί το πρώτο στοιχείο με <code>queue[1:]</code>, ΔΕΝ διαγράφει πραγματικά τη μνήμη του παλιού πρώτου στοιχείου — απλά μετακινεί το "παράθυρο" του slice προς τα δεξιά. Σε πολύ μεγάλες, μακρόχρονες ουρές αυτό μπορεί σταδιακά να "σπαταλάει" μνήμη (το underlying array δεν συρρικνώνεται ποτέ από μόνο του — μεγαλώνει μόνο). Για τους σκοπούς αυτού του guide δεν μας απασχολεί, αλλά είναι μια λεπτομέρεια που θα ξανασυναντήσεις σε πιο προχωρημένη δουλειά με δομές δεδομένων.
</div>

<h2>Χρήση</h2>
<pre><code class="lang-go">func main() {
    var queue []int

    queue = Enqueue(queue, 1)
    queue = Enqueue(queue, 2)
    queue = Enqueue(queue, 3) // queue is now [1, 2, 3], front = 1

    value, queue, ok := Dequeue(queue)
    fmt.Println(value, ok) // 1 true (the FIRST element that was added)
    fmt.Println(queue)     // [2, 3]
}</code></pre>

<h1>Διπλή Ουρά (Double-Ended Queue)</h1>
<p>Μια <strong>deque</strong> (Double-Ended Queue) επιτρέπει προσθήκη/αφαίρεση ΚΑΙ από τις δύο άκρες — μπροστά ΚΑΙ πίσω. Είναι γενίκευση τόσο του Stack όσο και του Queue ταυτόχρονα:</p>

<pre><code class="lang-go">func PushFront(deque []int, value int) []int {
    return append([]int{value}, deque...) // new slice, value first, then the rest
}

func PushBack(deque []int, value int) []int {
    return append(deque, value) // same as Enqueue
}

func PopFront(deque []int) (value int, updated []int, ok bool) {
    if len(deque) == 0 {
        return 0, deque, false
    }
    return deque[0], deque[1:], true // same as Dequeue
}

func PopBack(deque []int) (value int, updated []int, ok bool) {
    if len(deque) == 0 {
        return 0, deque, false
    }
    last := len(deque) - 1
    return deque[last], deque[:last], true // same as Pop
}</code></pre>

<div class="callout">
  <span class="tag">Σημαντικό — γιατί το PushFront είναι ακριβό</span>
  Πρόσεξε το <code>PushFront</code>:
  <br>το <code>append([]int{value}, deque...)</code> δημιουργεί ένα ΚΑΙΝΟΥΡΙΟ slice ξεκινώντας με το <code>value</code>, και μετά "ξεδιπλώνει" (<code>...</code>) όλα τα στοιχεία του παλιού deque πίσω από αυτό. Δεν υπάρχει φθηνός τρόπος να προσθέσεις στην ΑΡΧΗ ενός slice στη Go — πάντα χρειάζεται να αντιγραφούν όλα τα υπόλοιπα στοιχεία σε νέες θέσεις μνήμης, σε αντίθεση με το <code>append</code> στο τέλος που είναι συνήθως πολύ φθηνότερο (συχνά δεν χρειάζεται καν νέο array, αν υπάρχει ήδη ελεύθερη χωρητικότητα).
</div>

<h2>Αφαίρεση από τη ΜΕΣΗ ενός slice</h2>
<p>Έχουμε δει πώς αφαιρούμε από την αρχή (<code>slice[1:]</code>) και από το τέλος (<code>slice[:len-1]</code>). Τι γίνεται αν θες να αφαιρέσεις το στοιχείο στη θέση <code>n</code>, κάπου στη ΜΕΣΗ;</p>

<pre><code class="lang-go">// RemoveAt removes the element at index n and returns the updated slice.
func RemoveAt(slice []int, n int) []int {
    return append(slice[:n], slice[n+1:]...)
}</code></pre>

<p>Η ιδέα: κρατάμε ό,τι είναι ΠΡΙΝ το <code>n</code> (<code>slice[:n]</code>), και κάνουμε <code>append</code> πάνω του ό,τι είναι ΜΕΤΑ το <code>n</code> (<code>slice[n+1:]...</code>) — παραλείποντας έτσι εντελώς το στοιχείο στη θέση <code>n</code>.</p>

<div class="callout"><span class="tag">Προσοχή — γιατί δεν το κάνουμε συνήθως έτσι στην πράξη</span>Το <code>append(slice[:n], slice[n+1:]...)</code> γράφει ΕΠΙ ΤΟΠΟΥ πάνω στο ίδιο underlying array του αρχικού slice — μετακινεί όλα τα στοιχεία μετά το <code>n</code> μία θέση πιο αριστερά. Αυτό σημαίνει ότι αν κάποια ΑΛΛΗ μεταβλητή "έβλεπε" το ίδιο underlying array (π.χ. ένα slice που είχες φτιάξει νωρίτερα από το ίδιο array), τα δεδομένα της αλλάζουν ΚΑΙ αυτής χωρίς να το περιμένεις — ένα από τα πιο ύπουλα bugs με slices στη Go. Επίσης, ακριβώς όπως το <code>PushFront</code>, κοστίζει O(n) γιατί χρειάζεται να μετακινήσει κατά μέσο όρο τα μισά στοιχεία του slice σε κάθε κλήση.</div>

<h1>Το πρόβλημα: εισαγωγή/αφαίρεση στη ΜΕΣΗ</h1>
<p class="lede">Είδαμε ότι το να πειράζεις στοιχεία στην αρχή ή στη μέση ενός slice είναι ακριβό — χρειάζεται να μετακινηθούν όλα τα υπόλοιπα στοιχεία, γιατί κάθε slice "ζει" σε ένα συνεχόμενο κομμάτι μνήμης.</p>

<p>Σκέψου μια <strong>playlist τραγουδιών</strong>: θες να μπορείς ανά πάσα στιγμή να αφαιρέσεις ΟΠΟΙΟΔΗΠΟΤΕ τραγούδι (όχι μόνο το πρώτο ή το τελευταίο), ή να προσθέσεις ένα νέο τραγούδι στη ΜΕΣΗ της λίστας — ανάμεσα σε δύο υπάρχοντα. Με slice, αυτό μοιάζει έτσι:</p>

<pre><code class="lang-go">// InsertAt inserts value at index n, shifting everything after it to the right.
func InsertAt(playlist []string, n int, value string) []string {

    result := append([]string{}, playlist[:n]...)   // start a fresh slice with a copy of "before"
    result = append(result, value)                  // add the new value next
    result = append(result, playlist[n:]...)         // then add everything that was "after"

    return result
}</code></pre>

<p>Δουλεύει — αλλά κοίτα τι πραγματικά συμβαίνει: κάθε <code>append</code> εδώ μπορεί να χρειαστεί ολόκληρο νέο underlying array, ΚΑΙ χτίζουμε το <code>result</code> αντιγράφοντας ΟΛΑ τα στοιχεία — και αυτά πριν το <code>n</code>, και αυτά μετά. Αν η playlist έχει 10.000 τραγούδια και προσθέτεις κοντά στην αρχή, αντιγράφεις σχεδόν 10.000 στοιχεία — για μια απλή εισαγωγή. Το ίδιο πρόβλημα, συμμετρικά, ισχύει και για αφαίρεση από τη μέση (το είδαμε ήδη με το <code>RemoveAt</code>).</p>

    Πριν μιλήσουμε για ταξινόμηση, χρειαζόμαστε έναν τρόπο να λέμε ότι ένας τρόπος επίλυσης είναι καλύτερος
    από έναν άλλο. Το "καλύτερος" εδώ σημαίνει σχεδόν πάντα ένα πράγμα: <strong>πώς μεγαλώνει ο χρόνος
    εκτέλεσης καθώς μεγαλώνουν τα δεδομένα</strong>.
</p>

<p>
    Πρόσεξε τη διατύπωση. Δεν μας ενδιαφέρει πόσα δευτερόλεπτα κάνει ένα πρόγραμμα — αυτό αλλάζει με το
    μηχάνημα, τη γλώσσα, ακόμα και με το τι άλλο τρέχει εκείνη τη στιγμή στον υπολογιστή σου. Μας ενδιαφέρει
    κάτι σταθερό: αν <strong>δεκαπλασιάσεις</strong> τα δεδομένα, τι γίνεται ο χρόνος; Δεκαπλασιάζεται;
    Εκατονταπλασιάζεται; Ή μένει σχεδόν ίδιος;
</p>

<p>
    Ο συμβολισμός που το εκφράζει αυτό λέγεται <strong>Big-O</strong>, και τον έχεις ήδη συναντήσει: στο
    Complement Lookup είπαμε ότι η brute force λύση είναι <code>O(n²)</code> ενώ η λύση με map είναι
    <code>O(n)</code>.

<title>O(2ⁿ)</title>
<line x1="30" y1="130" x2="180" y2="130" stroke="currentColor" stroke-width="5" opacity="0.5"/>

</div>

<p>Ας τις δούμε μία-μία πιο αναλυτικά, με τη σειρά από την πιο γρήγορη στην πιο αργή.</p>

<p><strong>O(1) — σταθερός χρόνος.</strong> Ο χρόνος δεν αλλάζει καθόλου, όσο κι αν μεγαλώσουν τα δεδομένα. Ένα lookup σε <code>map</code>, ένα <code>len(slice)</code>, ένα <code>slice[i]</code> — όλα κοστίζουν το ίδιο είτε το slice έχει 10 στοιχεία είτε 10 εκατομμύρια. Δεν χρειάζεται καν να "δεις" τα δεδομένα, πηγαίνεις κατευθείαν εκεί που θες.</p>

<p><strong>O(log n) — λογαριθμικός χρόνος.</strong> Σε κάθε βήμα, πετάς το μισό από ό,τι σου έχει απομείνει να ελέγξεις — όχι επειδή το διαγράφεις, αλλά επειδή ξέρεις με σιγουριά ότι η απάντηση δεν είναι εκεί. Το κλασικό παράδειγμα είναι το binary search (θα το δούμε αναλυτικά σε λίγο): κοιτάς το μεσαίο στοιχείο ενός ταξινομημένου slice, και αποφασίζεις "η απάντηση είναι αριστερά ή δεξιά" — πετώντας έτσι το άλλο μισό εντελώς. Το αποτέλεσμα είναι εντυπωσιακό: 1.000.000 στοιχεία χρειάζονται μόνο ~20 τέτοια βήματα, όχι 1.000.000.</p>

<p><strong>O(n) — γραμμικός χρόνος.</strong> Διπλάσια δεδομένα, διπλάσιος χρόνος — απλή αναλογία 1-προς-1. Αυτό συμβαίνει όποτε χρειάζεται να δεις κάθε στοιχείο τουλάχιστον μία φορά, όπως σε μία απλή λούπα: accumulator, sliding window, complement lookup — όλα τα patterns που είδαμε στο προηγούμενο κεφάλαιο είναι O(n), γιατί όλα διασχίζουν το slice μία φορά.</p>

<p><strong>O(n log n) — "γραμμικο-λογαριθμικός" χρόνος.</strong> Εδώ είναι εύκολο να μπερδευτείς με το O(log n) — μοιάζουν οπτικά, αλλά είναι πολύ διαφορετικά πράγματα. Το O(log n) σημαίνει "λίγα βήματα συνολικά" (π.χ. 20 βήματα για 1 εκατομμύριο στοιχεία). Το O(n log n) σημαίνει "για κάθε ένα από τα n στοιχεία, κάνε κάτι που κοστίζει log n" — δηλαδή n φορές περισσότερη δουλειά από το καθαρό O(log n). Στην πράξη: οι καλοί αλγόριθμοι ταξινόμησης χωρίζουν επανειλημμένα τα δεδομένα στη μέση (το "log n" κομμάτι), αλλά χρειάζεται να επεξεργαστούν όλα τα στοιχεία σε κάθε επίπεδο διαίρεσης (το "n" κομμάτι) — τα δύο μαζί δίνουν O(n log n). Είναι πολύ πιο γρήγορο από το O(n²), αλλά πιο αργό από το καθαρό O(n).</p>

<p><strong>O(n²) — τετραγωνικός χρόνος.</strong> Διπλάσια δεδομένα, <strong>τετραπλάσιος</strong> χρόνος. Συμβαίνει όποτε έχεις λούπα μέσα σε λούπα, και οι δύο διασχίζουν (περίπου) όλα τα δεδομένα: το brute-force <code>findPairs</code> που είδαμε στο Complement Lookup είναι το πιο καθαρό παράδειγμα — για κάθε στοιχείο, ξανακοιτάς όλα τα υπόλοιπα. Για μικρά δεδομένα δεν φαίνεται πρόβλημα· για μεγάλα, γίνεται γρήγορα ασύμφορο.</p>

<p><strong>O(2ⁿ) — εκθετικός χρόνος.</strong> Κάθε ΕΝΑ επιπλέον στοιχείο διπλασιάζει ολόκληρο τον χρόνο εκτέλεσης — η χειρότερη κατηγορία απ' όλες. Προκύπτει τυπικά από recursion· θα το δούμε αναλυτικά αργότερα σε αυτό το μάθημα.</p>

<h2>Γιατί η διαφορά είναι τεράστια, όχι απλά "αισθητή"</h2>

<p>
    Οι κατηγορίες παραπάνω μοιάζουν αφηρημένες μέχρι να βάλεις πραγματικούς αριθμούς. Ας δούμε πόσες πράξεις
    χρειάζεται κάθε κατηγορία, για τρία διαφορετικά μεγέθη δεδομένων:
</p>

        Ένας συνηθισμένος υπολογιστής κάνει περίπου ένα δισεκατομμύριο απλές πράξεις το δευτερόλεπτο. Για ένα
        εκατομμύριο στοιχεία, λοιπόν: ο <code>O(n log n)</code> αλγόριθμος τελειώνει σε λιγότερο από
        <strong>ένα εκατοστό του δευτερολέπτου</strong>. Ο <code>O(n²)</code> θέλει περίπου
        <strong>δεκαεπτά λεπτά</strong>. Ίδιο πρόβλημα, ίδιο μηχάνημα, ίδια δεδομένα — μόνο ο κώδικας αλλάζει. Και η διαφορά είναι ασύλληπτη (0.01 δευτ. vs 17 λεπτά).
    </p>

<h2>Πώς μετράς το Big-O ενός δικού σου κώδικα</h2>

<p>Για τα προβλήματα που θα συναντήσεις τώρα, φτάνει ένας πολύ απλός κανόνας: <strong>μέτρα τις φωλιασμένες λούπες</strong>.</p>

<ul>
    <li>Καμία λούπα, μόνο πράξεις και lookups → <code>O(1)</code></li>
    <li>Κάθε βήμα διαιρεί στα δύο τα δεδομένα, "πετώντας" το ένα μισό → <code>O(log n)</code></li>
    <li>Μία λούπα πάνω από τα δεδομένα → <code>O(n)</code></li>
    <li>Λούπα μέσα σε λούπα, και οι δύο πάνω από τα δεδομένα → <code>O(n²)</code></li>
    <li>Λούπα μέσα σε λούπα μέσα σε λούπα, και οι τρεις πάνω από τα δεδομένα → <code>O(n³)</code></li>
    <li>Λούπα μέσα σε λούπα μέσα σε λούπα μέσα σε λούπα, και οι τέσσερις πάνω από τα δεδομένα → <code>O(n⁴)</code></li>
    <li>Κάθε στοιχείο διπλασιάζει τις επιλογές, τυπικά μέσω recursion → <code>O(2ⁿ)</code> (θα το δούμε αναλυτικά αργότερα)</li>
</ul>

<div class="callout">
    <span class="tag">Τρεις συχνές παρανοήσεις</span>
    <ul>
        <li>
            Το Big-O μιλάει για τη <strong>χειρότερη περίπτωση</strong>. Μια
            γραμμική αναζήτηση μπορεί να βρει το στοιχείο στην πρώτη θέση — αλλά τη λέμε <code>O(n)</code>
            επειδή <em>μπορεί</em> να χρειαστεί να φτάσει μέχρι το τέλος.
        </li>
        <li>
            Οι <strong>σταθερές δεν μετράνε</strong>. "Σταθερά" εδώ εννοούμε κάθε αριθμό που δεν εξαρτάται από το μέγεθος n των δεδομένων — π.χ. το "2" σε δύο ξεχωριστές (όχι φωλιασμένες) λούπες η μία μετά την άλλη: αυτό είναι <code>O(n)</code>, όχι <code>O(2n)</code>. Ο λόγος είναι ότι στο Big-O δεν μας ενδιαφέρει ο ΑΚΡΙΒΗΣ αριθμός πράξεων — μας ενδιαφέρει ο <strong>ρυθμός μεταβολής</strong>: πόσο αλλάζει ο χρόνος όταν αλλάζουν τα δεδομένα. Είτε κάνεις n πράξεις είτε 2n, και στις δύο περιπτώσεις ο χρόνος διπλασιάζεται όταν διπλασιάζεις τα δεδομένα — άρα ανήκουν στην ίδια κατηγορία.

            <div style="margin:14px 0 4px; padding:12px 16px; border-left:3px solid currentColor; opacity:0.9; font-size:0.95em; background:rgba(127,127,127,0.08); border-radius:0 6px 6px 0;">
                <div style="font-weight:600; margin-bottom:6px;">Πιο πρακτικά:</div>
                <p style="margin:0.5em 0;">Όταν μετράς πράξεις, καταλήγεις συνήθως σε μια έκφραση σαν <code>3n + 5</code> (π.χ. 3 λούπες πάνω στα δεδομένα, συν 5 σταθερές αρχικοποιήσεις). Εδώ υπάρχουν ΔΥΟ είδη σταθεράς: το <strong>5</strong> είναι μια σταθερά που ΠΡΟΣΤΙΘΕΤΑΙ, και το <strong>3</strong> είναι μια σταθερά που ΠΟΛΛΑΠΛΑΣΙΑΖΕΙ το n. Το Big-O αγνοεί και τα δύο είδη — ας δούμε γιατί, ένα-ένα.</p>

                <p style="margin:0.5em 0;">Πρώτα το <strong>+5</strong>. Δες τι συμβαίνει στο <code>3n + 5</code> καθώς το n δεκαπλασιάζεται:</p>
                <ul style="margin:0.5em 0;">
                    <li>n = 10 &nbsp;→&nbsp; 3(10) + 5 = <strong>35</strong></li>
                    <li>n = 100 &nbsp;→&nbsp; 3(100) + 5 = <strong>305</strong></li>
                    <li>n = 1.000 &nbsp;→&nbsp; 3(1.000) + 5 = <strong>3.005</strong></li>
                </ul>
                <p style="margin:0.5em 0;">Όσο μεγαλώνει το n, το <code>+5</code> γίνεται όλο και πιο αμελητέο σε σχέση με το υπόλοιπο άθροισμα (35→305→3.005: η αναλογία πλησιάζει όλο και περισσότερο στο καθαρό ×10). Γι' αυτό μια προσθετική σταθερά σαν το <code>+5</code> δεν επηρεάζει την κατηγορία.</p>
                <p style="margin:0.5em 0;">Το ίδιο ισχύει και για το <strong>3</strong>. Ναι, το <code>3n</code> είναι πάντα τριπλάσιο του <code>n</code> σε απόλυτη τιμή — αλλά στον <strong>ρυθμό μεταβολής</strong> είναι κι αυτό αμελητέο, γι' αυτό αν βρεις <code>O(3n)</code>, το γράφεις απλά <code>O(n)</code>.</p>
                <p style="margin:0.5em 0;">Κάπου εδώ μπαίνει και μια αντίθεση που δείχνει γιατί αυτό έχει πραγματική σημασία: σύγκρινε <code>100n</code> (φαίνεται "μεγάλο" λόγω του 100) με <code>n²</code> (φαίνεται "μικρό" επειδή δεν έχει μεγάλο πολλαπλασιαστή).</p>
                <ul style="margin:0.5em 0;">
                    <li>n = 50 &nbsp;→&nbsp; 100n = <strong>5.000</strong>, ενώ n² = <strong>2.500</strong> — το n² φαίνεται καλύτερο!</li>
                    <li>n = 10.000 &nbsp;→&nbsp; 100n = <strong>1.000.000</strong>, ενώ n² = <strong>100.000.000</strong> — το n² είναι 100 φορές χειρότερο.</li>
                </ul>
                <p style="margin:0.5em 0 0;">Όσο μεγαλώνει το n, ο κυρίαρχος όρος (<code>n²</code>) τελικά "νικάει" οποιαδήποτε σταθερά, όσο μεγάλη κι αν είναι αυτή. Γι' αυτό το Big-O κοιτάζει μόνο τον κυρίαρχο όρο και αγνοεί τις σταθερές — μιλάει για τη μακροπρόθεσμη συμπεριφορά, όχι για την ακριβή τιμή σε ένα συγκεκριμένο n.</p>
            </div>
        </li>
        <li>
            Η recursion από μόνη της δεν σημαίνει αυτόματα <code>O(2ⁿ)</code> Το backtracking (θα το δούμε αργότερα) είναι επίσης recursion με πολλαπλές κλήσεις ανά βήμα — αλλά ΔΕΝ φτάνει τυπικά στους ίδιους αστρονομικούς αριθμούς, γιατί κόβει κλάδους νωρίς μόλις ξέρει ότι δεν οδηγούν πουθενά (<strong>pruning</strong>). Η θεωρητική χειρότερη περίπτωση παραμένει εκθετική, αλλά στην πράξη εξετάζονται πολύ λιγότερες επιλογές απ' όσες θα έδινε το ωμό <code>2ⁿ</code>.
        </li>
    </ul>
</div>

<div class="callout good">
    <span class="tag">Πού το χρειάζεσαι πραγματικά</span>
    <p>
        Δεν θα σου ζητήσει κανείς να υπολογίσεις Big-O σε χαρτί. Το χρειάζεσαι για μία μόνο απόφαση, που όμως
        την παίρνεις συνεχώς: <em>«αυτό που μόλις έγραψα, θα αντέξει αν τα δεδομένα γίνουν χίλιες φορές
        περισσότερα;»</em> Αν η απάντηση είναι όχι, το Big-O σου λέει και γιατί — και συνήθως δείχνει
        κατευθείαν στη φωλιασμένη λούπα που πρέπει να φύγει.
    </p>
</div>`);

<div class="eyebrow">Ενότητα 5 / 8 — Αναζήτηση & Ταξινόμηση</div>
<h1>Αναζήτηση: γραμμική και δυαδική</h1>

<p class="lede">
    Το πιο απλό ερώτημα πάνω σε μια συλλογή δεδομένων: <em>υπάρχει το X μέσα;</em> Υπάρχουν δύο εντελώς
    διαφορετικές απαντήσεις, και η επιλογή ανάμεσά τους εξαρτάται από ένα μόνο πράγμα.
</p>

<h2>Γραμμική αναζήτηση (linear search)</h2>

<p>Ο προφανής τρόπος: κοίτα ένα-ένα τα στοιχεία μέχρι να βρεις αυτό που ψάχνεις.</p>

<pre><code class="lang-go">// LinearSearch returns the index of target, and whether it was found.
func LinearSearch(numbers []int, target int) (index int, found bool) {
    for i, n := range numbers {
        if n == target {
            return i, true // early return - no reason to keep looking
        }
    }
    return 0, false
}
</code></pre>

<p>
    Δουλεύει πάντα, σε οποιαδήποτε δεδομένα, ταξινομημένα ή όχι. Το κόστος του είναι <code>O(n)</code>: στη
    χειρότερη περίπτωση (το στοιχείο λείπει, ή είναι τελευταίο) διαβάζεις ολόκληρη τη συλλογή.
</p>

<h2>Δυαδική αναζήτηση (binary search)</h2>

<p>
    Τώρα φαντάσου ένα τηλεφωνικό κατάλογο. Ψάχνεις το "Παπαδόπουλος". Θα ξεκινήσεις από την πρώτη σελίδα και
    θα διαβάσεις κάθε όνομα; Προφανώς όχι — θα ανοίξεις κάπου στη μέση, θα δεις ότι είσαι στο "Μ", και θα
    αγνοήσεις <strong>ολόκληρο το πρώτο μισό</strong> του καταλόγου με μία κίνηση.
</p>

<p>
    Αυτό είναι η δυαδική αναζήτηση, και το κλειδί είναι στο ότι ο κατάλογος είναι <strong>ταξινομημένος</strong>.
    Χωρίς αυτή τη συνθήκη, το "είμαι στο Μ, άρα το Π είναι δεξιά" δεν σημαίνει τίποτα.
</p>

<p>Ας το δούμε σε αριθμούς. Ψάχνουμε το <code>23</code> μέσα στο ταξινομημένο slice:</p>

<pre><code>[3,  10, 12, 17, 23, 31, 40, 56, 78]
 0   1   2   3   4   5   6   7   8
</code></pre>

<table class="glossary-table">
<tr><td class="gt-term">βήμα</td><td class="gt-term">left / right</td><td class="gt-term">mid</td><td class="gt-def">τι συμβαίνει</td></tr>
<tr><td class="gt-term">1</td><td class="gt-term">0 / 8</td><td class="gt-term">4 → τιμή 23</td><td class="gt-def">βρέθηκε αμέσως!</td></tr>
</table>

<p>Πολύ τυχερό. Ας ψάξουμε κάτι δυσκολότερο — το <code>56</code>:</p>

<table class="glossary-table">
<tr><td class="gt-term">βήμα</td><td class="gt-term">left / right</td><td class="gt-term">mid</td><td class="gt-def">τι συμβαίνει</td></tr>
<tr><td class="gt-term">1</td><td class="gt-term">0 / 8</td><td class="gt-term">4 → τιμή 23</td><td class="gt-def">23 &lt; 56 → το ψάχνουμε δεξιά, left = 5</td></tr>
<tr><td class="gt-term">2</td><td class="gt-term">5 / 8</td><td class="gt-term">6 → τιμή 40</td><td class="gt-def">40 &lt; 56 → πάλι δεξιά, left = 7</td></tr>
<tr><td class="gt-term">3</td><td class="gt-term">7 / 8</td><td class="gt-term">7 → τιμή 56</td><td class="gt-def">βρέθηκε — 3 βήματα αντί για 8</td></tr>
</table>

<pre><code class="lang-go">// BinarySearch returns the index of target in a SORTED slice.
// The slice MUST be sorted, or the result is meaningless.
func BinarySearch(numbers []int, target int) (index int, found bool) {
    left, right := 0, len(numbers)-1

    for left &lt;= right {
        mid := (left + right) / 2

        if numbers[mid] == target {
            return mid, true
        }
        if numbers[mid] &lt; target {
            left = mid + 1  // target must be in the right half
        } else {
            right = mid - 1 // target must be in the left half
        }
    }
    return 0, false
}
</code></pre>

<div class="callout good">
    <span class="tag">Το αναγνωρίζεις;</span>
    <p>
        Δύο μεταβλητές <code>left</code> και <code>right</code> που κινούνται η μία προς την άλλη μέσα στα
        ίδια δεδομένα — αυτό είναι το <strong>two pointers</strong> pattern από την Ενότητα 3. Η διαφορά από
        το palindrome check είναι ότι εδώ οι δείκτες δεν προχωράνε κατά ένα: <strong>πηδάνε στη μέση</strong>
        του υπόλοιπου διαστήματος. Ακριβώς αυτό το πήδημα είναι που κάνει τον αλγόριθμο <code>O(log n)</code>
        αντί για <code>O(n)</code>.
    </p>
</div>

<div class="callout">
    <span class="tag">Γιατί ~20 βήματα για ένα εκατομμύριο στοιχεία</span>
    <p>
        Κάθε βήμα πετάει τα μισά. Ένα εκατομμύριο γίνεται 500.000, μετά 250.000, μετά 125.000... Πόσες φορές
        μπορείς να κόψεις στη μέση το 1.000.000 πριν φτάσεις στο 1; Είκοσι. Γι' αυτό το
        <code>O(log n)</code> είναι τόσο καλό: για να χρειαστείς <em>ένα ακόμα</em> βήμα, πρέπει να
        <strong>διπλασιάσεις</strong> τα δεδομένα.
    </p>
</div>

<div class="callout">
    <span class="tag">Προσοχή / Συχνό λάθος</span>
    <p>
        Η δυαδική αναζήτηση σε <strong>μη ταξινομημένα</strong> δεδομένα δεν βγάζει σφάλμα — βγάζει
        <em>λάθος απάντηση</em>, σιωπηλά. Θα σου πει "δεν υπάρχει" για στοιχείο που υπάρχει, επειδή πέταξε το

        μοιάζει σωστός και μερικές φορές τυχαίνει να δουλεύει.
    </p>
</div>

<h2>Πότε αξίζει το ένα και πότε το άλλο</h2>

<p>
    Αν η δυαδική είναι τόσο καλύτερη, γιατί να χρησιμοποιήσεις ποτέ τη γραμμική; Γιατί η δυαδική έχει ένα
    προαπαιτούμενο που έχει το δικό του κόστος: <strong>τα δεδομένα πρέπει να ταξινομηθούν πρώτα</strong>, και η
    ταξινόμηση κοστίζει <code>O(n log n)</code> — πολύ περισσότερο από μία μόνο γραμμική αναζήτηση.
</p>

<ul>
    <li><strong>Θα ψάξεις μία φορά</strong> σε μη ταξινομημένα δεδομένα → γραμμική. Το να τα ταξινομήσεις

        αναζήτηση όσες φορές θες. Το αρχικό κόστος αποσβένεται.</li>
    <li><strong>Ψάχνεις συνεχώς "υπάρχει;"</strong> χωρίς να σε νοιάζει η σειρά → ούτε το ένα ούτε το άλλο.
        Χρησιμοποίησε <code>map</code>, που δίνει <code>O(1)</code> — το είδαμε ήδη στο Complement Lookup.</li>
</ul>

<h2>Το <code>slices</code> package — αυτό θα χρησιμοποιείς</h2>

<pre><code class="lang-go">package main

<p>

    (in place) — δεν επιστρέφει καινούριο slice, αλλάζει αυτό που της έδωσες. Δεν γράφεις
    <code>numbers = slices.Sort(numbers)</code>· αυτό δεν θα μεταγλωττιστεί καν. Δεύτερον, δουλεύει με
    <strong>οποιονδήποτε τύπο που μπορεί να συγκριθεί</strong> — <code>int</code>, <code>float64</code>,

fmt.Println(temps) // [18.2 21.5 30.1]
</code></pre>

<h1>Bubble Sort</h1>

<p class="lede">
    Ο πιο απλός αλγόριθμος ταξινόμησης που υπάρχει, και ο πιο αργός από τους γνωστούς. Διδάσκεται ακριβώς
    επειδή είναι απλός: μπορείς να τον κρατήσεις ολόκληρο στο μυαλό σου και να δεις καθαρά <em>γιατί</em>
    κοστίζει όσο κοστίζει.
</p>

<h2>Η ιδέα</h2>

<p>
    Πέρνα από όλο το slice συγκρίνοντας <strong>γειτονικά ζευγάρια</strong>. Όποτε βρίσκεις δύο στοιχεία σε
    λάθος σειρά, αντάλλαξέ τα. Κάνε το ξανά και ξανά, μέχρι να μη χρειάζεται καμία ανταλλαγή.
</p>

<p>
    Το όνομα βγαίνει από αυτό που βλέπεις να συμβαίνει: σε κάθε πέρασμα, το μεγαλύτερο στοιχείο που απομένει
    "ανεβαίνει" σαν φυσαλίδα μέχρι το τέλος και κλειδώνει στη θέση του.
</p>

<h2>Βήμα-βήμα σε τέσσερα στοιχεία</h2>

<p>Ας ταξινομήσουμε το <code>[5, 1, 4, 2]</code>. Το υπογραμμισμένο ζευγάρι είναι αυτό που συγκρίνεται:</p>

<table class="glossary-table">
<tr><td class="gt-term">πέρασμα</td><td class="gt-term">σύγκριση</td><td class="gt-term">κατάσταση</td><td class="gt-def">ενέργεια</td></tr>
<tr><td class="gt-term">1</td><td class="gt-term">5 vs 1</td><td class="gt-term">[5, 1, 4, 2]</td><td class="gt-def">5 &gt; 1 → swap → [1, 5, 4, 2]</td></tr>
<tr><td class="gt-term">1</td><td class="gt-term">5 vs 4</td><td class="gt-term">[1, 5, 4, 2]</td><td class="gt-def">5 &gt; 4 → swap → [1, 4, 5, 2]</td></tr>
<tr><td class="gt-term">1</td><td class="gt-term">5 vs 2</td><td class="gt-term">[1, 4, 5, 2]</td><td class="gt-def">5 &gt; 2 → swap → [1, 4, 2, <strong>5</strong>]</td></tr>
<tr><td class="gt-term">2</td><td class="gt-term">1 vs 4</td><td class="gt-term">[1, 4, 2, 5]</td><td class="gt-def">1 &lt; 4 → καμία αλλαγή</td></tr>
<tr><td class="gt-term">2</td><td class="gt-term">4 vs 2</td><td class="gt-term">[1, 4, 2, 5]</td><td class="gt-def">4 &gt; 2 → swap → [1, 2, <strong>4</strong>, 5]</td></tr>
<tr><td class="gt-term">3</td><td class="gt-term">1 vs 2</td><td class="gt-term">[1, 2, 4, 5]</td><td class="gt-def">1 &lt; 2 → καμία αλλαγή — τέλος</td></tr>
</table>

<p>
    Πρόσεξε δύο πράγματα. Μετά το πρώτο πέρασμα, το <code>5</code> είναι <strong>εγγυημένα</strong> στη σωστή
    θέση — δεν χρειάζεται να το ξανακοιτάξουμε ποτέ. Και στο τρίτο πέρασμα δεν έγινε καμία ανταλλαγή, που
    σημαίνει ότι όλα είναι ήδη ταξινομημένα.
</p>

<h2>Η αφελής υλοποίηση</h2>

<pre><code class="lang-go">// BubbleSort sorts the slice in place. First, naive version.
func BubbleSort(numbers []int) {
    n := len(numbers)

    for pass := 0; pass &lt; n; pass++ {
        for i := 0; i &lt; n-1; i++ {
            if numbers[i] &gt; numbers[i+1] {
                // swap the two neighbours
                numbers[i], numbers[i+1] = numbers[i+1], numbers[i]
            }
        }
    }
}
</code></pre>


<h2>Βελτίωση 1: μη ξανακοιτάς ό,τι έχει ήδη μπει στη θέση του</h2>

<p>
    Είπαμε ότι μετά το πρώτο πέρασμα το μεγαλύτερο στοιχείο είναι στη θέση του. Μετά το δεύτερο, τα δύο
    μεγαλύτερα. Άρα η εσωτερική λούπα μπορεί να σταματάει <strong>όλο και νωρίτερα</strong> (κατά μια θέση κάθε φορά):
</p>

<pre><code class="lang-go">for pass := 0; pass &lt; n; pass++ {
    for i := 0; i &lt; n-1-pass; i++ { // shrink the inner loop each pass
        // ...
    }
}
</code></pre>

<h2>Βελτίωση 2: σταμάτα μόλις δεν χρειάζεται τίποτα</h2>

<p>
    Το τρίτο πέρασμα του παραδείγματος δεν έκανε καμία ανταλλαγή. Αν καταγράψουμε αυτό το γεγονός, μπορούμε
    να κάνουμε break την εξωτερική loop (δηλαδή να τελειώσουμε το sort):
</p>

<pre><code class="lang-go">// BubbleSort sorts the slice in place, ascending.
func BubbleSort(numbers []int) {
    n := len(numbers)

    for pass := 0; pass &lt; n-1; pass++ {
        swapped := false // boolean switch: did anything move this pass?

        for i := 0; i &lt; n-1-pass; i++ {
            if numbers[i] &gt; numbers[i+1] {
                numbers[i], numbers[i+1] = numbers[i+1], numbers[i]
                swapped = true
            }
        }

        if !swapped {
            break // already sorted - no reason to keep passing over it
        }
    }
}
</code></pre>

<div class="callout good">
    <span class="tag">Το αναγνωρίζεις;</span>
    <p>
        Το <code>swapped</code> είναι ακριβώς το <strong>boolean switch</strong> της Ενότητας 3: μια
        μεταβλητή <code>bool</code> που θυμάται αν κάτι συνέβη κατά τη διάρκεια μιας λούπας, και ελέγχεται
        αφού η λούπα τελειώσει.
    </p>
</div>

<h2>Πόσο κοστίζει</h2>

<table class="glossary-table">
  <tr><td class="gt-term">Χειρότερη περίπτωση</td><td class="gt-def">O(n²) — το slice είναι σε ανάποδη σειρά, κάθε ζευγάρι χρειάζεται ανταλλαγή</td></tr>
  <tr><td class="gt-term">Μέση περίπτωση</td><td class="gt-def">O(n²) — δύο φωλιασμένες λούπες, όσο κι αν συρρικνώνεται η εσωτερική</td></tr>
  <tr><td class="gt-term">Καλύτερη περίπτωση</td><td class="gt-def">O(n) — ήδη ταξινομημένο: ένα πέρασμα, καμία ανταλλαγή, break</td></tr>
  <tr><td class="gt-term">Επιπλέον μνήμη</td><td class="gt-def">O(1) — ταξινομεί επί τόπου, δεν φτιάχνει αντίγραφο</td></tr>
</table>

<p>
    Η βελτίωση 1 κόβει τις συγκρίσεις περίπου στις μισές — αλλά <code>n²/2</code> είναι ακόμα
    <code>O(n²)</code>, γιατί όπως είπαμε οι σταθερές δεν μετράνε στο Big-O. Καμία από τις δύο βελτιώσεις
    δεν αλλάζει την κατηγορία· απλά κάνουν τον ίδιο αργό αλγόριθμο λίγο λιγότερο αργό.
</p>

<div class="callout">
    <span class="tag">Θυμήσου: το Big-O εννοεί τη χειρότερη περίπτωση</span>
    <p>
        Είπαμε ότι το Big-O μιλάει για τη χειρότερη περίπτωση, εκτός αν πούμε ρητά κάτι άλλο. Αυτό είναι
        ακριβώς αυτό το σενάριο: ο πίνακας παραπάνω δείχνει ΤΡΕΙΣ διαφορετικές τιμές (<code>O(n²)</code>,
        <code>O(n²)</code>, <code>O(n)</code>) για τον ΙΔΙΟ αλγόριθμο, ανάλογα με τα δεδομένα εισόδου. Όταν
        κάπου διαβάσεις ή ακούσεις απλά "ο bubble sort είναι <code>O(n²)</code>", χωρίς καμία άλλη
        διευκρίνιση, εννοεί τη χειρότερη περίπτωση — αυτή είναι η σύμβαση. Το ότι μπορεί να τρέξει σε
        <code>O(n)</code> σε ήδη ταξινομημένα δεδομένα δεν αλλάζει τι σημαίνει το γυμνό "είναι
        <code>O(n²)</code>" όταν το ακούς χωρίς συμφραζόμενα.
    </p>
</div>

<h3>Πού μένει χρήσιμος</h3>
<p>
    Πρακτικά πουθενά — με μία εξαίρεση που αξίζει να ξέρεις: σε δεδομένα που είναι
    <strong>σχεδόν ταξινομημένα</strong> ήδη (π.χ. μια λίστα που ήταν σε σειρά και μετακινήθηκαν δύο
    στοιχεία), το bubble sort με το <code>swapped</code> flag τελειώνει σε ένα-δύο περάσματα. Αυτό είναι
    το μοναδικό σενάριο όπου δεν είναι η χειρότερη επιλογή — και ακόμα κι εκεί, το insertion sort το
    κάνει καλύτερα.
</p>

<br>

<h1>Οι υπόλοιποι αλγόριθμοι, με μια ματιά</h1>

<p class="lede">
    Δεν θα δούμε υλοποιήσεις εδώ. Ο στόχος είναι να <strong>αναγνωρίζεις τα ονόματα</strong> και να ξέρεις
    πού προτιμάται ο καθένας — όχι να μπορείς να τους γράψεις από μνήμης.
</p>

<table style="width:100%; border-collapse:collapse; margin:16px 0;">
    <tr style="border-bottom:2px solid rgba(var(--ink-rgb),0.3);">

<div class="callout">

    <p>
        Θα δεις αυτόν τον χαρακτηρισμό δίπλα σε αλγορίθμους ταξινόμησης. Σημαίνει ότι δύο στοιχεία με
        <strong>ίδια τιμή</strong> κρατάνε τη μεταξύ τους σειρά μετά την ταξινόμηση. Έχει σημασία όταν

<div class="callout good">

<p>

<pre><code class="lang-go">// Factorial returns n! for a non-negative n.
func Factorial(n int) int {
    if n &lt;= 1 {
        return 1 // BASE CASE - stop here, do not call again
    }
    return n * Factorial(n-1) // RECURSIVE CASE - the same problem, one size smaller
}
</code></pre>

<p>
    Πέντε γραμμές, καμία λούπα. Και όμως υπολογίζει σωστά ένα γινόμενο οσοδήποτε πολλών αριθμών. Πώς;

<h2>Τι πραγματικά συμβαίνει: το call stack</h2>

    ξεχωριστή</strong>, με το δικό της <code>n</code>. Ας δούμε το <code>Factorial(4)</code> βήμα-βήμα:
</p>

<table class="glossary-table">
<tr><td class="gt-term">βήμα</td><td class="gt-term">κλήση</td><td class="gt-def">τι κάνει</td></tr>
<tr><td class="gt-term">1</td><td class="gt-term">Factorial(4)</td><td class="gt-def">4 &gt; 1 → χρειάζεται το Factorial(3). Παγώνει και περιμένει.</td></tr>
<tr><td class="gt-term">2</td><td class="gt-term">Factorial(3)</td><td class="gt-def">3 &gt; 1 → χρειάζεται το Factorial(2). Παγώνει και περιμένει.</td></tr>
<tr><td class="gt-term">3</td><td class="gt-term">Factorial(2)</td><td class="gt-def">2 &gt; 1 → χρειάζεται το Factorial(1). Παγώνει και περιμένει.</td></tr>
<tr><td class="gt-term">4</td><td class="gt-term">Factorial(1)</td><td class="gt-def"><strong>base case</strong> → επιστρέφει 1 χωρίς νέα κλήση</td></tr>
<tr><td class="gt-term">5</td><td class="gt-term">Factorial(2)</td><td class="gt-def">ξυπνάει, υπολογίζει 2 × 1 = 2, επιστρέφει</td></tr>
<tr><td class="gt-term">6</td><td class="gt-term">Factorial(3)</td><td class="gt-def">ξυπνάει, υπολογίζει 3 × 2 = 6, επιστρέφει</td></tr>
<tr><td class="gt-term">7</td><td class="gt-term">Factorial(4)</td><td class="gt-def">ξυπνάει, υπολογίζει 4 × 6 = <strong>24</strong>, επιστρέφει</td></tr>

<p>
    Πρόσεξε το σχήμα: πρώτα <strong>κατεβαίνουμε</strong> μέχρι το base case χωρίς να υπολογίσουμε τίποτα, και
    μετά <strong>ανεβαίνουμε</strong> πίσω υπολογίζοντας. Οι κλήσεις στοιβάζονται η μία πάνω στην άλλη και
    ολοκληρώνονται με την αντίστροφη σειρά.
</p>

<div class="callout good">
    <span class="tag">Το αναγνωρίζεις;</span>
    <p>
        Τελευταία κλήση που μπήκε, πρώτη που βγαίνει. Αυτό είναι <strong>LIFO</strong> — ακριβώς η
        <em>στοίβα</em> της Ενότητας 4. Και δεν είναι μεταφορά: ο υπολογιστής χρησιμοποιεί κυριολεκτικά μια
        δομή που λέγεται <strong>call stack</strong> για να θυμάται ποια κλήση περιμένει ποια. Όταν γράφεις
        αναδρομή, δεν αποφεύγεις τη στοίβα — απλά αφήνεις τη γλώσσα να τη διαχειριστεί για σένα, αντί να τη
        φτιάξεις μόνος σου με ένα slice.
    </p>
</div>

<h2>Τα δύο υποχρεωτικά μέρη</h2>

<p>Κάθε αναδρομική function πρέπει να έχει και τα δύο. Αν λείπει ένα από τα δύο, δεν δουλεύει.</p>

<div class="grid2">
    <div class="card">
        <span class="card-tag">Base case — η έξοδος</span>
        <p>
            Μία τουλάχιστον περίπτωση όπου η function <strong>επιστρέφει χωρίς να ξανακαλέσει τον εαυτό
            της</strong>. Είναι το μικρότερο πρόβλημα, αυτό που ξέρεις την απάντησή του χωρίς σκέψη. Στο
            <code>Factorial</code> είναι το <code>n &lt;= 1</code>.
        </p>
    </div>
    <div class="card">
        <span class="card-tag">Recursive case — το βήμα</span>
        <p>
            Η κλήση στον εαυτό της, με ένα όρισμα που είναι <strong>πιο κοντά στο base case</strong>. Το
            "πιο κοντά" είναι κρίσιμο: αν το πρόβλημα δεν μικραίνει, δεν θα φτάσεις ποτέ στην έξοδο.
        </p>
    </div>
</div>

<h2>Τι γίνεται αν ξεχάσεις το base case</h2>

<pre><code class="lang-go">// BROKEN: no base case, this never stops
func Countdown(n int) {
    fmt.Println(n)
    Countdown(n - 1) // calls forever: 3, 2, 1, 0, -1, -2, ...
}
</code></pre>

<p>
    Ο compiler δεν θα διαμαρτυρηθεί — συντακτικά είναι απόλυτα σωστό. Το πρόγραμμα θα τρέξει, θα τυπώσει
    αριθμούς, και μετά θα καταρρεύσει με ένα μήνυμα σαν αυτό:
</p>

<pre><code>runtime: goroutine stack exceeds 1000000000-byte limit
fatal error: stack overflow
</code></pre>

<p>
    Αυτό είναι το περίφημο <strong>stack overflow</strong>: κάθε κλήση δεσμεύει λίγη μνήμη στο call stack, και
    οι κλήσεις δεν τελειώνουν ποτέ για να την ελευθερώσουν. Η στοίβα γεμίζει, και το πρόγραμμα τερματίζει βίαια.
</p>

<div class="callout">
    <span class="tag">Είναι panic, όχι compile error</span>
    <p>
        Θυμήσου τη διάκριση από το Μέρος 1: το compile error το πιάνει ο compiler πριν καν τρέξει το
        πρόγραμμα. Το stack overflow είναι <strong>runtime</strong> σφάλμα — εμφανίζεται μόνο όταν εκτελεστεί
        ο κώδικας, και μόνο για τις τιμές που το προκαλούν. Μια αναδρομή μπορεί να δουλεύει μια χαρά για
        <code>n = 10</code> και να καταρρέει για <code>n = -1</code>.
    </p>
</div>

<h2>Το ίδιο πράγμα με λούπα</h2>

<p>
    Καθετί που γράφεται αναδρομικά γράφεται και με λούπα. Το <code>Factorial</code> δεν χρειάζεται καν
    προσπάθεια:
</p>

<pre><code class="lang-go">func FactorialLoop(n int) int {
    result := 1 // accumulator - the pattern from section 3
    for i := 2; i &lt;= n; i++ {
        result *= i
    }
    return result
}
</code></pre>

<p>
    Και για την ακρίβεια, εδώ η εκδοχή με λούπα είναι <strong>καλύτερη</strong>: πιο γρήγορη, χωρίς κίνδυνο
    stack overflow, εξίσου ευανάγνωστη. Αν όλα τα αναδρομικά προβλήματα ήταν σαν το παραγοντικό, η αναδρομή
    δεν θα άξιζε ένα ολόκληρο κεφάλαιο.
</p>

<div class="callout">
    <span class="tag">Τότε γιατί τη μαθαίνουμε;</span>
    <p>
        Γιατί υπάρχει μια κατηγορία προβλημάτων όπου η λούπα είναι <em>δυνατή αλλά εφιαλτική</em>, και η
        αναδρομή είναι πέντε γραμμές. Το κοινό τους χαρακτηριστικό: το πρόβλημα
        <strong>περιέχει μέσα του μικρότερα αντίγραφα του εαυτού του</strong> — και δεν ξέρεις εκ των
        προτέρων πόσα ή πόσο βαθιά. Τέτοια είναι η αναζήτηση σε λαβύρινθο, η εξερεύνηση ενός δικτύου φίλων, η
        ταξινόμηση με divide and conquer. Θα δούμε και τα τρία.
    </p>
</div>
`);

<div class="eyebrow">Ενότητα 6 / 8 — Αναδρομή & Divide and Conquer</div>
<h1>Πώς σκέφτεσαι αναδρομικά</h1>

<p class="lede">
    Το δυσκολότερο κομμάτι της αναδρομής δεν είναι η σύνταξη — είναι ότι το μυαλό σου θέλει να παρακολουθήσει
    κάθε κλήση ξεχωριστά, και χάνεται στο τρίτο επίπεδο. Υπάρχει τρόπος να το αποφύγεις.
</p>

<h2>Το άλμα εμπιστοσύνης</h2>

<p>
    Όταν γράφεις μια αναδρομική function, <strong>μην προσπαθήσεις να τρέξεις όλα τα επίπεδα στο μυαλό
    σου</strong>. Αντί γι' αυτό, υπόθεσε ότι η κλήση στον εαυτό σου <em>ήδη δουλεύει σωστά</em> για το
    μικρότερο πρόβλημα, και σκέψου μόνο τι πρέπει να κάνεις εσύ με το αποτέλεσμά της.
</p>

<p>
    Ακούγεται σαν να κλέβεις — «πώς μπορώ να υποθέσω ότι δουλεύει, αφού δεν την έχω γράψει ακόμα;» Αλλά είναι
    ακριβώς το ίδιο πράγμα που κάνεις όταν καλείς μια function που έγραψε κάποιος άλλος: δεν διαβάζεις τον
    κώδικά της, εμπιστεύεσαι ότι κάνει αυτό που λέει το όνομά της.
</p>

<h2>Οι τρεις ερωτήσεις</h2>

<p>Για οποιοδήποτε αναδρομικό πρόβλημα, απάντησε αυτές τις τρεις — με αυτή τη σειρά:</p>

<ul>
    <li><strong>1. Ποιο είναι το μικρότερο πρόβλημα που ξέρω απευθείας;</strong> Αυτό είναι το base case.
        Συνήθως: κενό slice, κενό string, ο αριθμός 0 ή 1, ένας κόμβος χωρίς γείτονες.</li>
    <li><strong>2. Πώς μικραίνω το πρόβλημα κατά ένα βήμα;</strong> Ένα στοιχείο λιγότερο, μισό slice,
        ένας γείτονας παρακάτω.</li>
    <li><strong>3. Πώς συνδυάζω το αποτέλεσμα της μικρότερης κλήσης με το τρέχον στοιχείο;</strong>
        Πρόσθεση, γινόμενο, <code>append</code>, σύγκριση.</li>
</ul>

<h2>Παράδειγμα: άθροισμα ενός slice</h2>

<p>Ας απαντήσουμε τις τρεις ερωτήσεις για το «άθροισε όλους τους αριθμούς ενός slice»:</p>

<div class="grid3">
    <div class="card">
        <span class="card-tag">1. Base case</span>
        <p>Το άθροισμα ενός <strong>κενού</strong> slice είναι 0. Αυτό το ξέρω χωρίς σκέψη.</p>
    </div>
    <div class="card">
        <span class="card-tag">2. Μικραίνω</span>
        <p>Παίρνω το πρώτο στοιχείο και αφήνω <strong>τα υπόλοιπα</strong> — δηλαδή <code>numbers[1:]</code>,
           ένα στοιχείο λιγότερο.</p>
    </div>
    <div class="card">
        <span class="card-tag">3. Συνδυάζω</span>
        <p>Το πρώτο στοιχείο <strong>συν</strong> το άθροισμα των υπολοίπων.</p>
    </div>
</div>

<pre><code class="lang-go">// SumSlice adds every number in the slice, recursively.
func SumSlice(numbers []int) int {
    if len(numbers) == 0 {
        return 0 // 1. base case: nothing to add
    }
    return numbers[0] + SumSlice(numbers[1:]) // 3. combine  |  2. shrink
}
</code></pre>

<p>
    Πρόσεξε ότι η γραμμή του recursive case διαβάζεται σχεδόν σαν ελληνικά: «το πρώτο, συν το άθροισμα των
    υπολοίπων». Αυτό είναι το σημάδι ότι η αναδρομή ταιριάζει στο πρόβλημα — όταν η περιγραφή του προβλήματος
    <em>είναι</em> ο κώδικας.
</p>

<h2>Ένα ακόμα: αντιστροφή string</h2>

<p>Ίδιες τρεις ερωτήσεις, εντελώς διαφορετικό πρόβλημα:</p>

<pre><code class="lang-go">// Reverse returns the input string, backwards.
// Works on ASCII text - see the callout below for why.
func Reverse(s string) string {
    if len(s) &lt;= 1 {
        return s // base case: a single character reversed is itself
    }
    // last character first, then the reverse of everything before it
    return string(s[len(s)-1]) + Reverse(s[:len(s)-1])
}
// Reverse("hello") -&gt; "olleh"
</code></pre>

<div class="callout">
    <span class="tag">Γιατί "works on ASCII"</span>
    <p>

        το θέμα εδώ είναι η αναδρομή — αλλά αξίζει να θυμάσαι ότι το byte-vs-rune δεν εξαφανίζεται επειδή
        άλλαξες τεχνική.
    </p>
</div>

<div class="eyebrow">Ενότητα 6 / 8 — Αναδρομή & Divide and Conquer</div>
<h1>Divide and Conquer: σπάσε, λύσε, ένωσε</h1>

<p class="lede">
    Η αναδρομή γίνεται πραγματικά ισχυρή όταν το πρόβλημα δεν μικραίνει <em>κατά ένα</em>, αλλά κόβεται
    <strong>στη μέση</strong>. Αυτή η διαφορά είναι που ρίχνει το κόστος από <code>O(n)</code> σε
    <code>O(log n)</code>, και από <code>O(n²)</code> σε <code>O(n log n)</code>.
</p>

<p>Το σχήμα έχει πάντα τρία βήματα, και του έδωσαν όνομα: <strong>divide and conquer</strong>.</p>

<div class="grid3">
    <div class="card">
        <span class="card-tag">1. Divide</span>
        <p>Σπάσε το πρόβλημα σε δύο (ή περισσότερα) μικρότερα προβλήματα <strong>του ίδιου είδους</strong>.</p>
    </div>
    <div class="card">
        <span class="card-tag">2. Conquer</span>
        <p>Λύσε το καθένα — αναδρομικά, με την ίδια function. Αν είναι αρκετά μικρό, λύσ' το απευθείας.</p>
    </div>
    <div class="card">
        <span class="card-tag">3. Combine</span>
        <p>Ένωσε τις επιμέρους απαντήσεις σε μία απάντηση για το αρχικό πρόβλημα.</p>
    </div>
</div>

<h2>Το ήδη γνωστό παράδειγμα: binary search</h2>

<p>
    Στην Ενότητα 5 γράψαμε τη δυαδική αναζήτηση με λούπα και δύο δείκτες. Δες την τώρα γραμμένη αναδρομικά,
    και πρόσεξε πόσο καθαρά φαίνονται τα τρία βήματα:
</p>

<pre><code class="lang-go">// BinarySearchRec searches a SORTED slice between indexes left and right.
func BinarySearchRec(numbers []int, target, left, right int) (int, bool) {
    if left &gt; right {
        return 0, false // base case: the interval is empty, target is not here
    }

    mid := (left + right) / 2 // 1. DIVIDE: cut the interval in half

    if numbers[mid] == target {
        return mid, true // found it - nothing left to do
    }

    // 2. CONQUER: only ONE of the two halves can contain the target
    if numbers[mid] &lt; target {
        return BinarySearchRec(numbers, target, mid+1, right)
    }
    return BinarySearchRec(numbers, target, left, mid-1)
}
</code></pre>

<div class="callout">
    <span class="tag">Γιατί εδώ δεν υπάρχει βήμα "combine"</span>
    <p>
        Η δυαδική αναζήτηση είναι ειδική περίπτωση: μετά το divide, <strong>πετάει</strong> το ένα μισό αντί
        να το λύσει. Άρα δεν έχει τίποτα να ενώσει — απλά επιστρέφει ό,τι βρήκε η μία κλήση. Γι' αυτό είναι
        <code>O(log n)</code> και όχι <code>O(n log n)</code>: δουλεύει μόνο σε ένα κλαδί σε κάθε επίπεδο,
        όχι σε δύο.
    </p>
</div>

<h2>Το πλήρες παράδειγμα: merge sort</h2>

<p>
    Στην Ενότητα 5 σου υποσχεθήκαμε ότι το merge sort θα επιστρέψει εδώ. Όχι για να το γράφεις σε πραγματικό
    κώδικα — για αυτό υπάρχει η <code>slices.Sort</code> — αλλά επειδή είναι ο καθαρότερος τρόπος να δεις
    <strong>τι ακριβώς σου δίνει η αναδρομή</strong>.
</p>

<p>Οι τρεις ερωτήσεις, εφαρμοσμένες στην ταξινόμηση:</p>

<ul>
    <li><strong>Base case:</strong> ένα slice με 0 ή 1 στοιχεία είναι <em>ήδη ταξινομημένο</em>. Τίποτα να κάνω.</li>
    <li><strong>Divide:</strong> κόψε στη μέση. Δύο slices, το καθένα μισό μέγεθος.</li>
    <li><strong>Combine:</strong> έχοντας δύο <em>ταξινομημένα</em> μισά, ένωσέ τα σε ένα ταξινομημένο σύνολο.</li>
</ul>

<pre><code class="lang-go">// MergeSort returns a NEW sorted slice. It does not modify the input.
func MergeSort(numbers []int) []int {
    if len(numbers) &lt;= 1 {
        return numbers // base case: already sorted by definition
    }

    mid := len(numbers) / 2
    left := MergeSort(numbers[:mid])  // trust it: this comes back sorted
    right := MergeSort(numbers[mid:]) // trust it: so does this

    return merge(left, right) // combine two sorted halves into one
}
</code></pre>

<p>
    Πέντε γραμμές ουσίας, και ολόκληρη η ταξινόμηση κρύβεται στο <code>merge</code>. Άρα το μόνο που μένει
    είναι: πώς ενώνεις δύο <em>ήδη ταξινομημένα</em> slices;
</p>

<pre><code class="lang-go">// merge combines two already-sorted slices into one sorted slice.
func merge(left, right []int) []int {
    result := make([]int, 0, len(left)+len(right))
    i, j := 0, 0 // one pointer per slice

    for i &lt; len(left) &amp;&amp; j &lt; len(right) {
        if left[i] &lt;= right[j] {
            result = append(result, left[i])
            i++
        } else {
            result = append(result, right[j])
            j++
        }
    }

    // one side ran out - whatever is left on the other side is already sorted
    result = append(result, left[i:]...)
    result = append(result, right[j:]...)
    return result
}
</code></pre>

<div class="callout good">
    <span class="tag">Το αναγνωρίζεις;</span>
    <p>
        Δύο δείκτες, ο καθένας στη δική του συλλογή, που προχωράνε ανεξάρτητα ανάλογα με τη σύγκριση — αυτό
        είναι <strong>two pointers</strong>, στην παραλλαγή «δύο θέσεις, δύο διαφορετικοί ρόλοι» που
        περιγράψαμε στην Ενότητα 3. Το merge sort δεν είναι κάτι καινούριο· είναι δύο πράγματα που ήδη ξέρεις,
        το ένα μέσα στο άλλο.
    </p>
</div>

<h2>Γιατί βγαίνει <code>O(n log n)</code></h2>

<p>Ας ταξινομήσουμε το <code>[5, 2, 9, 1, 7, 3, 8, 4]</code>. Πρώτα κατεβαίνει σπάζοντας:</p>

<pre><code>                [5, 2, 9, 1, 7, 3, 8, 4]          επίπεδο 0
           [5, 2, 9, 1]      [7, 3, 8, 4]          επίπεδο 1
        [5, 2]  [9, 1]    [7, 3]   [8, 4]          επίπεδο 2
      [5] [2]  [9] [1]  [7] [3]  [8] [4]           επίπεδο 3 (base case)
</code></pre>

<p>Και μετά ανεβαίνει ενώνοντας, με το <code>merge</code> σε κάθε βήμα:</p>

<pre><code>      [5] [2]  [9] [1]  [7] [3]  [8] [4]           επίπεδο 3
        [2, 5]  [1, 9]    [3, 7]   [4, 8]          επίπεδο 2
           [1, 2, 5, 9]      [3, 4, 7, 8]          επίπεδο 1
                [1, 2, 3, 4, 5, 7, 8, 9]          επίπεδο 0
</code></pre>

<p>Τώρα μέτρα δύο πράγματα ξεχωριστά:</p>

<ul>
    <li><strong>Πόσα επίπεδα;</strong> Κάθε επίπεδο υποδιπλασιάζει το μέγεθος. Από 8 σε 1 χρειάζονται 3 βήματα —
        δηλαδή <code>log₂(8) = 3</code>. Για ένα εκατομμύριο στοιχεία, 20 επίπεδα.</li>
    <li><strong>Πόση δουλειά ανά επίπεδο;</strong> Σε κάθε επίπεδο, όλα τα <code>merge</code> μαζί περνούν από
        κάθε στοιχείο ακριβώς μία φορά. Δηλαδή <code>n</code> δουλειά, όσο βαθιά κι αν είσαι.</li>
</ul>

<p>
    <code>n</code> δουλειά, <code>log n</code> φορές → <strong><code>O(n log n)</code></strong>. Αυτό είναι
    όλο. Και τώρα ξέρεις γιατί το <code>log</code> εμφανίζεται στον τύπο: <em>δεν</em> είναι αυθαίρετο σύμβολο,
    είναι απλώς «πόσες φορές μπορώ να κόψω στη μέση».
</p>

<div class="callout">
    <span class="tag">Και το quicksort;</span>
    <p>
        Ίδια οικογένεια, αντίστροφη κατανομή δουλειάς. Το merge sort χωρίζει με τον απλούστερο τρόπο (πάντα στη μέση) και
        ενώνει με έξυπνο τρόπο (το <code>merge</code> κάνει όλη τη δουλειά). Το quicksort κάνει το αντίστροφο —
        χωρίζει με έξυπνο τρόπο:
        διαλέγει ένα στοιχείο-άξονα (pivot) και αναδιατάσσει το slice ώστε αριστερά του να είναι όλα τα
        μικρότερα και δεξιά όλα τα μεγαλύτερα. Μετά δεν χρειάζεται καθόλου combine — τα δύο μισά ταξινομούνται
        αναδρομικά και είναι ήδη στη σωστή θέση μεταξύ τους. Γι' αυτό είναι συνήθως ταχύτερο στην πράξη: δεν
        δεσμεύει καθόλου επιπλέον μνήμη για αντίγραφα.
    </p>
</div>

<div class="callout good">
    <span class="tag">Πού αλλού θα δεις αυτό το σχήμα</span>
    <p>
        Το divide and conquer δεν είναι τεχνική ταξινόμησης — είναι τρόπος σκέψης. Θα το συναντήσεις σε
        αναζήτηση (binary search), σε δέντρα (κάθε υποδέντρο είναι ένα μικρότερο δέντρο), σε επεξεργασία
        εικόνας, ακόμα και στον πολλαπλασιασμό πολύ μεγάλων αριθμών. Το σήμα είναι πάντα το ίδιο:
        <em>«αν είχα τη λύση για τα δύο μισά, θα ήξερα τι να κάνω;»</em> Αν η απάντηση είναι ναι, έχεις
        divide and conquer.
    </p>
</div>
`);

<div class="eyebrow">Ενότητα 6 / 8 — Αναδρομή & Divide and Conquer</div>
<h1>Εξερεύνηση δικτύων: DFS και BFS</h1>

<p class="lede">
    Εδώ η αναδρομή σταματάει να είναι εναλλακτική της λούπας και γίνεται <strong>ο φυσικός τρόπος</strong>.
    Γιατί τα δεδομένα δεν είναι πια γραμμή — είναι δίκτυο.
</p>

<h2>Πώς παριστάνουμε ένα δίκτυο χωρίς structs</h2>

<p>
    Ένα <strong>γράφημα</strong> (graph) είναι απλά ένα σύνολο κόμβων και οι συνδέσεις μεταξύ τους. Δεν
    χρειάζεσαι καμία ειδική δομή για να το γράψεις — ένα <code>map</code> από κόμβο σε λίστα γειτόνων αρκεί:
</p>

<pre><code class="lang-go">// each key is a person, each value is the list of that person's friends
friends := map[string][]string{
    "ana":  {"bob", "cleo"},
    "bob":  {"ana", "dan"},
    "cleo": {"ana", "dan", "eve"},
    "dan":  {"bob", "cleo"},
    "eve":  {"cleo"},
}
</code></pre>

<pre><code>        ana
       /   \
     bob   cleo
       \   /   \
        dan     eve
</code></pre>

<p>
    Η ερώτηση που θέλουμε να απαντήσουμε: <em>ξεκινώντας από την ana, ποιους μπορώ να φτάσω;</em> Και εδώ
    εμφανίζεται αμέσως ένα πρόβλημα που δεν είχαμε ποτέ με slices: <strong>κύκλοι</strong>. Η ana οδηγεί στον
    bob, ο bob πίσω στην ana, η ana πάλι στον bob… για πάντα.
</p>

<div class="callout">
    <span class="tag">Ο κανόνας που λύνει τα πάντα</span>
    <p>
        Κράτα ένα <code>map</code> με τους κόμβους που έχεις ήδη επισκεφτεί, και μην ξαναμπείς σε κανέναν.
        Αυτό το <code>visited</code> map είναι <strong>υποχρεωτικό</strong> σε κάθε εξερεύνηση γραφήματος —
        χωρίς αυτό, η αναδρομή δεν τερματίζει ποτέ.
    </p>
</div>

<h2>DFS — Depth-First Search (κατά βάθος)</h2>

<p>
    «Ακολούθησε ένα μονοπάτι όσο πιο βαθιά μπορείς. Όταν κολλήσεις, γύρνα πίσω και δοκίμασε το επόμενο.»
    Ακριβώς όπως εξερευνάς έναν λαβύρινθο κρατώντας το δεξί σου χέρι στον τοίχο.
</p>

<pre><code class="lang-go">// DFS visits every node reachable from start, going as deep as possible first.
func DFS(graph map[string][]string, node string, visited map[string]bool) {
    if visited[node] {
        return // base case: been here already, stop this branch
    }
    visited[node] = true
    fmt.Println("visiting:", node)

    for _, neighbour := range graph[node] {
        DFS(graph, neighbour, visited) // go deep, one neighbour at a time
    }
}

func main() {
    visited := make(map[string]bool)
    DFS(friends, "ana", visited)
}
// visiting: ana
// visiting: bob
// visiting: dan
// visiting: cleo
// visiting: eve
</code></pre>

<p>
    Παρακολούθησε τη σειρά. Από την <code>ana</code> πάει στον <code>bob</code>. Από τον <code>bob</code> στον
    <code>dan</code> — <strong>δεν</strong> γυρίζει να δει την <code>cleo</code> ακόμα, γιατί πρώτα εξαντλεί
    το βάθος. Ο <code>dan</code> οδηγεί στην <code>cleo</code>, η <code>cleo</code> στην <code>eve</code>.
    Μόνο όταν δεν έχει πού αλλού να πάει ξετυλίγεται πίσω.
</p>

<div class="callout">
    <span class="tag">Πού είναι η στοίβα;</span>
    <p>
        Το DFS <em>είναι</em> στοίβα — απλά δεν τη βλέπεις, γιατί είναι το call stack. Κάθε αναδρομική κλήση
        προστίθεται στη στοίβα· κάθε επιστροφή αφαιρεί μία από αυτήν. Αν έγραφες DFS χωρίς αναδρομή, θα χρειαζόσουν ένα slice ως
        Stack και θα έκανες Push/Pop με το χέρι — ακριβώς όπως στην Ενότητα 4.
    </p>
</div>

<h2>BFS — Breadth-First Search (κατά πλάτος)</h2>

<p>
    Η ακριβώς αντίθετη στρατηγική: «δες <strong>όλους</strong> τους άμεσους γείτονες πρώτα, μετά όλους τους
    γείτονες των γειτόνων.» Σαν τους ομόκεντρους κύκλους που απλώνονται όταν πέσει μια πέτρα στο νερό.
</p>

<p>
    Και εδώ είναι το ενδιαφέρον: το BFS <strong>δεν γράφεται φυσικά αναδρομικά</strong>. Χρειάζεται ουρά — τη
    δομή που φτιάξαμε στην Ενότητα 4:
</p>

<pre><code class="lang-go">// BFS visits every reachable node, closest first.
func BFS(graph map[string][]string, start string) []string {
    visited := map[string]bool{start: true}
    queue := []string{start} // the Queue from section 4
    var order []string       // accumulator, the pattern from section 3

    for len(queue) &gt; 0 {
        node := queue[0]
        queue = queue[1:] // Dequeue: take from the FRONT
        order = append(order, node)

        for _, neighbour := range graph[node] {
            if !visited[neighbour] {
                visited[neighbour] = true      // mark on ENQUEUE, not on visit
                queue = append(queue, neighbour) // Enqueue: add to the BACK
            }
        }
    }
    return order
}
// BFS(friends, "ana") -&gt; [ana bob cleo dan eve]
</code></pre>

<p>
    Σύγκρινε τα δύο αποτελέσματα. Το DFS έδωσε <code>ana, bob, dan, cleo, eve</code> — προχώρησε όσο πιο βαθιά μπορούσε. Το BFS
    έδωσε <code>ana, bob, cleo, dan, eve</code> — πρώτα και οι δύο άμεσοι φίλοι της ana, μετά το επόμενο
    επίπεδο.
</p>

<div class="callout">
    <span class="tag">Προσοχή / Συχνό λάθος</span>
    <p>
        Στο BFS, σημειώνεις τον κόμβο ως <code>visited</code> τη στιγμή που τον <strong>βάζεις στην
        ουρά</strong>, όχι όταν τον βγάζεις. Αν το κάνεις ανάποδα, ο ίδιος κόμβος μπορεί να μπει στην ουρά
        πολλές φορές πριν προλάβει να επεξεργαστεί — και σε μεγάλα γραφήματα η ουρά μεγαλώνει ανεξέλεγκτα.
    </p>
</div>

<h2>Το πραγματικό πλεονέκτημα του BFS: συντομότερη διαδρομή</h2>

<p>
    Επειδή το BFS εξερευνά επίπεδο-επίπεδο, την πρώτη φορά που θα φτάσει σε έναν κόμβο, τον έχει φτάσει με
    <strong>τα λιγότερα δυνατά βήματα</strong>. Αυτό δεν ισχύει για το DFS, που μπορεί να φτάσει στον ίδιο
    κόμβο μέσα από μια πολύ μακριά διαδρομή.
</p>

<pre><code class="lang-go">// Distance returns how many steps away each node is from start.
func Distance(graph map[string][]string, start string) map[string]int {
    dist := map[string]int{start: 0}
    queue := []string{start}

    for len(queue) &gt; 0 {
        node := queue[0]
        queue = queue[1:]

        for _, neighbour := range graph[node] {
            if _, seen := dist[neighbour]; !seen {
                dist[neighbour] = dist[node] + 1 // one step further than here
                queue = append(queue, neighbour)
            }
        }
    }
    return dist
}
// Distance(friends, "ana") -&gt; map[ana:0 bob:1 cleo:1 dan:2 eve:2]
</code></pre>

<p>
    Πρόσεξε ότι το <code>dist</code> map παίζει <strong>δύο ρόλους ταυτόχρονα</strong>: κρατάει την απόσταση,
    και ταυτόχρονα λειτουργεί ως <code>visited</code> — αν ένας κόμβος έχει ήδη απόσταση, τον έχουμε ήδη δει.
    Είναι μια συνηθισμένη τεχνική που σου εξοικονομεί μια ολόκληρη μεταβλητή.
</p>

<h2>Πότε ποιο</h2>

        <td style="padding:8px;">βαθιά σε ένα κλαδί, μετά πίσω</td>
        <td style="padding:8px;">όλο το επίπεδο, μετά το επόμενο</td>
    </tr>
    <tr style="border-bottom:1px solid rgba(var(--ink-rgb),0.15);">

        <td style="padding:8px;">«υπάρχει διαδρομή;», εξερεύνηση όλων των συνδυασμών, λαβύρινθοι</td>
        <td style="padding:8px;">«ποια είναι η <em>συντομότερη</em> διαδρομή;», επίπεδα απόστασης</td>
    </tr>
    <tr>
        <td style="padding:8px;"><strong>Κίνδυνος</strong></td>
        <td style="padding:8px;">stack overflow σε πολύ βαθιά γραφήματα</td>
        <td style="padding:8px;">μεγάλη κατανάλωση μνήμης σε πολύ πλατιά γραφήματα</td>
    </tr>
</table>

<div class="callout good">
    <span class="tag">Και τα δύο κοστίζουν το ίδιο</span>
    <p>
        Το DFS και το BFS είναι και τα δύο <code>O(V + E)</code>: κάθε κόμβος (vertex) επισκέπτεται μία φορά,
        κάθε σύνδεση (edge) εξετάζεται μία φορά. Η επιλογή ανάμεσά τους δεν είναι θέμα ταχύτητας — είναι θέμα
        <strong>του τι σειρά χρειάζεσαι</strong>.
    </p>
</div>

<div class="eyebrow">Ενότητα 6 / 8 — Αναδρομή & Divide and Conquer</div>
<h1>Οι τρεις παγίδες</h1>

<p class="lede">
    Η αναδρομή είναι κομψή, αλλά υπάρχουν τρεις τρόποι να πάει στραβά. Οι δύο πρώτοι εμφανίζονται αμέσως και
    με σαφές μήνυμα σφάλματος· ο τρίτος είναι ο επικίνδυνος, γιατί ο κώδικας δουλεύει — απλά δεν τελειώνει ποτέ.
</p>

<h2>Παγίδα 1: το base case που δεν φτάνει ποτέ</h2>

<p>
    Δεν αρκεί να <em>υπάρχει</em> base case — πρέπει και να είναι <strong>φτάσιμο από κάθε είσοδο</strong>.
    Δες τη διαφορά:
</p>

<pre><code class="lang-go">// BROKEN for negative input: n never reaches 0 going down
func CountdownBad(n int) {
    if n == 0 {
        return
    }
    fmt.Println(n)
    CountdownBad(n - 1) // CountdownBad(-5) runs forever
}

// SAFE: any n below the limit exits
func CountdownGood(n int) {
    if n &lt;= 0 {
        return // covers 0 AND every negative number
    }
    fmt.Println(n)
    CountdownGood(n - 1)
}
</code></pre>

<p>
    Η αλλαγή είναι ένας χαρακτήρας, <code>==</code> σε <code>&lt;=</code>. Είναι το ίδιο είδος σκέψης με τα
    guard clauses της Ενότητας 3: <em>ποιες εισόδους δεν έχω σκεφτεί;</em>
</p>

<h2>Παγίδα 2: πολύ βαθιά, ακόμα και σωστά</h2>

<p>
    Μια απόλυτα σωστή αναδρομή μπορεί να καταρρεύσει απλά επειδή είναι βαθιά. Το <code>SumSlice</code> που
    γράψαμε δουλεύει τέλεια για 100 στοιχεία και καταρρέει σε ένα slice με μερικά εκατομμύρια — κάθε στοιχείο
    δεσμεύει ένα επίπεδο στο call stack.
</p>

<div class="callout">
    <span class="tag">Η Go δεν κάνει tail-call optimization</span>
    <p>
        Κάποιες γλώσσες (Scheme, Haskell, εν μέρει η Kotlin) αναγνωρίζουν όταν η αναδρομική κλήση είναι το
        <em>τελευταίο</em> πράγμα που κάνει μια function, και τη μετατρέπουν αυτόματα σε λούπα, χωρίς να
        μεγαλώνει η στοίβα. <strong>Η Go δεν το κάνει αυτό, σκόπιμα</strong> — οι σχεδιαστές της προτίμησαν
        να έχεις πάντα καθαρό stack trace όταν κάτι πάει στραβά. Πρακτικά: μην βασίζεσαι στην αναδρομή για
        γραμμικά προβλήματα με πολλά δεδομένα. Γράψε λούπα.
    </p>
</div>

<p>
    Η καλή είδηση: στο divide and conquer το βάθος είναι <code>log n</code>, όχι <code>n</code>. Ένα merge
    sort σε ένα εκατομμύριο στοιχεία φτάνει μόλις 20 επίπεδα βαθιά. Το πρόβλημα εμφανίζεται μόνο όταν
    χρησιμοποιείς αναδρομή εκεί που θα έπρεπε να έχεις λούπα.
</p>

<h2>Παγίδα 3: η ίδια δουλειά, ξανά και ξανά</h2>

<p>
    Αυτή είναι η σοβαρή. Ας γράψουμε την ακολουθία Fibonacci — κάθε αριθμός είναι το άθροισμα των δύο
    προηγούμενων: <code>1, 1, 2, 3, 5, 8, 13, 21…</code>
</p>

<pre><code class="lang-go">func Fib(n int) int {
    if n &lt;= 2 {
        return 1 // base case
    }
    return Fib(n-1) + Fib(n-2) // TWO recursive calls, not one
}
</code></pre>

<p>
    Ο κώδικας είναι σωστός και όμορφος. Δοκίμασέ τον με <code>Fib(10)</code> και δουλεύει ακαριαία. Δοκίμασε
    <code>Fib(45)</code> και ο υπολογιστής σου θα μείνει απασχολημένος για λεπτά. Γιατί;
</p>

<p>Ας δούμε τι συμβαίνει στο <code>Fib(5)</code>:</p>

<pre><code>                    Fib(5)
                  /        \
             Fib(4)          Fib(3)
            /      \        /      \
       Fib(3)    Fib(2)  Fib(2)   Fib(1)
      /      \
   Fib(2)   Fib(1)
</code></pre>

<p>
    Μέτρα το <code>Fib(3)</code>: υπολογίζεται <strong>δύο φορές</strong>, σε δύο διαφορετικά κλαδιά, από την
    αρχή και τις δύο φορές. Το <code>Fib(2)</code> τρεις φορές. Και όσο μεγαλώνει το <code>n</code>, η
    επικάλυψη πολλαπλασιάζεται:
</p>

<table class="glossary-table">
<tr><td class="gt-term">Fib(10)</td><td class="gt-def">~177 κλήσεις — ακαριαίο</td></tr>
<tr><td class="gt-term">Fib(30)</td><td class="gt-def">~2.7 εκατομμύρια κλήσεις — αισθητή καθυστέρηση</td></tr>
<tr><td class="gt-term">Fib(40)</td><td class="gt-def">~331 εκατομμύρια κλήσεις — δευτερόλεπτα αναμονής</td></tr>
<tr><td class="gt-term">Fib(50)</td><td class="gt-def">~25 δισεκατομμύρια κλήσεις — πρακτικά δεν τελειώνει σε λογικό χρόνο</td></tr>
</table>

<p>
    Αυτό είναι μια νέα κατηγορία Big-O που δεν είχαμε συναντήσει: <strong><code>O(2ⁿ)</code></strong>,
    <em>εκθετική</em>. Κάθε επιπλέον στοιχείο εισόδου <strong>διπλασιάζει</strong> τη δουλειά. Είναι η
    χειρότερη κατηγορία που θα δεις σε πρακτικό κώδικα, και σχεδόν πάντα σημαίνει ότι κάτι υπολογίζεται
    πολλές φορές χωρίς λόγο.
</p>

<div class="callout">
    <span class="tag">Δύο αναδρομικές κλήσεις δεν σημαίνουν αυτόματα εκθετικό</span>
    <p>
        Το merge sort κάνει επίσης δύο αναδρομικές κλήσεις, και είναι <code>O(n log n)</code>, όχι
        <code>O(2ⁿ)</code>. Η διαφορά: το merge sort σπάει το πρόβλημα σε δύο μισά που
        <strong>δεν επικαλύπτονται</strong> — κάθε στοιχείο πάει σε ένα μόνο κλαδί. Το Fibonacci καλεί
        <code>Fib(n-1)</code> και <code>Fib(n-2)</code>, που μοιράζονται σχεδόν όλη τους τη δουλειά. Το
        σχήμα φαίνεται ίδιο, η επικάλυψη είναι το παν.
    </p>
</div>

<div class="callout good">
    <span class="tag">Η λύση έχει όνομα, και είναι το επόμενο κεφάλαιο</span>
    <p>
        Αν το <code>Fib(3)</code> υπολογίζεται δύο φορές, γιατί να μην κρατήσουμε το αποτέλεσμα την πρώτη
        φορά και να το ξαναδιαβάσουμε τη δεύτερη; Ένα απλό <code>map[int]int</code> θα αρκούσε — και θα
        έριχνε το κόστος από <code>O(2ⁿ)</code> σε <code>O(n)</code>. Αυτή η ιδέα λέγεται
        <strong>memoization</strong>, και είναι η μισή Δυναμική Ταξινόμηση (Dynamic Programming), το θέμα της
        Ενότητας 8. Κράτα το <code>Fib</code> στο μυαλό σου· θα το ξαναδούμε εκεί.
    </p>
</div>
`);

<h1>Πόσο μεγάλο είναι το δωμάτιο;</h1>

<p class="lede">
    Ένα πρόβλημα που με λούπες γίνεται πολύ δύσκολο, ενώ με αναδρομή λύνεται σε λίγες γραμμές.
</p>

<h2>Η αποστολή</h2>
<p>
    Σου δίνεται ένας λαβύρινθος ως <code>[]string</code>, όπου το <code>#</code> είναι τοίχος και η
    <code>.</code> είναι ελεύθερο κελί. Δοσμένης μιας θέσης εκκίνησης, γράψε μια function που επιστρέφει

</p>

<pre><code class="lang-go">grid := []string{
    "#######",
    "#..#..#",
    "#.##..#",
    "#.....#",
    "#######",
}
// starting from row 1, column 1, the answer is 12
</code></pre>

<div class="callout">
    <span class="tag">Γιατί αυτό είναι γράφημα, χωρίς να το λέει</span>
    <p>
        Δεν υπάρχει πουθενά <code>map[string][]string</code> εδώ — και όμως το πρόβλημα είναι ακριβώς ίδιο με
        την εξερεύνηση του δικτύου φίλων. Κάθε ελεύθερο κελί είναι κόμβος, και οι «γείτονές» του είναι τα
        τέσσερα διπλανά κελιά. Το γράφημα είναι <strong>υπονοούμενο</strong> (implicit): δεν το φτιάχνεις,
        το διαβάζεις από τη δομή του πλέγματος καθώς προχωράς.
    </p>
</div>

<div class="spoiler"><div class="spoiler-lock"><span>HINT 1 — Drag to reveal →</span></div>
    <p>Το base case δεν είναι ένα, είναι <strong>τρία</strong>, και όλα επιστρέφουν 0: βγήκα έξω από τα όρια του πλέγματος, πάτησα τοίχο, ή έχω ήδη μετρήσει αυτό το κελί. Γράψ' τα και τα τρία στην αρχή σαν guard clauses, πριν από οτιδήποτε άλλο.</p>
</div>

<br>

<div class="spoiler"><div class="spoiler-lock"><span>HINT 2 — Drag to reveal →</span></div>
    <p>Χρειάζεσαι <code>visited</code>, αλλά το κλειδί είναι ζευγάρι συντεταγμένων. Στη Go, ένα <strong>array</strong> είναι έγκυρο κλειδί map (είναι comparable), ενώ ένα slice δεν είναι. Άρα το <code>map[[2]int]bool</code> δουλεύει, και το γράφεις ως <code>visited[[2]int{r, c}]</code>.</p>
</div>

<br>

<div class="spoiler"><div class="spoiler-lock"><span>HINT 3 — Drag to reveal →</span></div>

</div>

<br>

<h2>Λύση</h2>
<p>Δοκίμασέ το πρώτα μόνος σου. Σύρε παρακάτω μόνο όταν έχεις κολλήσει ή θέλεις να συγκρίνεις.</p>

<div class="spoiler"><div class="spoiler-lock"><span>Drag to reveal →</span></div>
<pre><code class="lang-go">// CountReachable returns how many open cells can be reached from (r, c).
func CountReachable(grid []string, r, c int, visited map[[2]int]bool) int {
    // base case 1: outside the grid
    if r &lt; 0 || r &gt;= len(grid) || c &lt; 0 || c &gt;= len(grid[r]) {
        return 0
    }
    // base case 2: a wall is not a cell we can stand on
    if grid[r][c] == '#' {
        return 0
    }
    // base case 3: already counted - this is what stops the infinite loop
    key := [2]int{r, c}
    if visited[key] {
        return 0
    }
    visited[key] = true

    count := 1 // this cell itself
    count += CountReachable(grid, r-1, c, visited) // up
    count += CountReachable(grid, r+1, c, visited) // down
    count += CountReachable(grid, r, c-1, visited) // left
    count += CountReachable(grid, r, c+1, visited) // right
    return count
}

func main() {
    grid := []string{
        "#######",
        "#..#..#",
        "#.##..#",
        "#.....#",
        "#######",
    }
    visited := make(map[[2]int]bool)
    fmt.Println(CountReachable(grid, 1, 1, visited)) // 12
}
</code></pre></div>

<div class="callout good">

    </p>
</div>

<div class="callout">

    </p>
</div>

<div class="eyebrow">Ενότητα 7 / 8 — Greedy & Backtracking</div>
<h1>Greedy: πάρε το καλύτερο τώρα, μη γυρίσεις πίσω</h1>

<p class="lede">
    Η πιο απλή στρατηγική λήψης αποφάσεων που υπάρχει: σε κάθε βήμα, διάλεξε ό,τι φαίνεται καλύτερο
    <strong>αυτή τη στιγμή</strong>, χωρίς να σκεφτείς τι θα σημάνει αυτό αργότερα. Και ποτέ, μα ποτέ, μην
    ξανασκεφτείς μια επιλογή που έχεις ήδη κάνει.
</p>

<p>
    Ακούγεται αφελές — και μερικές φορές είναι. Αλλά για μια ολόκληρη οικογένεια προβλημάτων δίνει
    <strong>αποδεδειγμένα τη βέλτιστη λύση</strong>, σε ένα μόνο πέρασμα. Η δουλειά σου δεν είναι να μάθεις να
    γράφεις greedy — είναι πολύ εύκολο. Είναι να μάθεις <em>πότε να το εμπιστεύεσαι</em>.
</p>

<h2>Παράδειγμα 1: ρέστα με τα λιγότερα κέρματα</h2>

<p>
    Είσαι ταμίας και πρέπει να δώσεις 87 λεπτά ρέστα, με όσο το δυνατόν λιγότερα κέρματα. Τα διαθέσιμα
    κέρματα ευρώ σε λεπτά: <code>200, 100, 50, 20, 10, 5, 2, 1</code>.
</p>

<p>
    Η greedy στρατηγική είναι αυτό που κάνει κάθε ταμίας χωρίς να το σκεφτεί: <em>δώσε το μεγαλύτερο κέρμα
    που χωράει ακόμα, και επανάλαβε</em>.
</p>

<pre><code class="lang-go">// GreedyCoins returns how many coins are needed for the amount.
// coins must be sorted from largest to smallest.
func GreedyCoins(coins []int, amount int) int {
    count := 0
    for _, coin := range coins {
        for amount &gt;= coin {
            amount -= coin // take this coin
            count++
        }
    }
    return count
}
</code></pre>

<table class="glossary-table">
<tr><td class="gt-term">υπόλοιπο</td><td class="gt-term">μεγαλύτερο που χωράει</td><td class="gt-def">σύνολο κερμάτων</td></tr>
<tr><td class="gt-term">87</td><td class="gt-term">50</td><td class="gt-def">1</td></tr>
<tr><td class="gt-term">37</td><td class="gt-term">20</td><td class="gt-def">2</td></tr>
<tr><td class="gt-term">17</td><td class="gt-term">10</td><td class="gt-def">3</td></tr>
<tr><td class="gt-term">7</td><td class="gt-term">5</td><td class="gt-def">4</td></tr>
<tr><td class="gt-term">2</td><td class="gt-term">2</td><td class="gt-def"><strong>5</strong> — τέλος</td></tr>
</table>

<p>
    Πέντε κέρματα, και είναι πράγματι το ελάχιστο δυνατό. Το greedy δούλεψε — και μάλιστα σε
    <code>O(n)</code>, χωρίς να δοκιμάσει ούτε έναν εναλλακτικό συνδυασμό.
</p>

<h2>Παράδειγμα 2: το ίδιο πρόβλημα, άλλα κέρματα</h2>

<p>
    Τώρα φαντάσου ένα νόμισμα με κέρματα <code>4, 3, 1</code>. Πρέπει να δώσεις ρέστα <strong>6</strong>.
    Ίδιος αλγόριθμος, ίδιος κώδικας:
</p>

<table class="glossary-table">
<tr><td class="gt-term">υπόλοιπο</td><td class="gt-term">greedy παίρνει</td><td class="gt-def">σύνολο</td></tr>
<tr><td class="gt-term">6</td><td class="gt-term">4</td><td class="gt-def">1</td></tr>
<tr><td class="gt-term">2</td><td class="gt-term">1</td><td class="gt-def">2</td></tr>
<tr><td class="gt-term">1</td><td class="gt-term">1</td><td class="gt-def"><strong>3</strong> κέρματα: 4 + 1 + 1</td></tr>
</table>

<div class="callout">
    <span class="tag">Αλλά η σωστή απάντηση είναι 2</span>
    <p>
        <code>3 + 3 = 6</code>. Δύο κέρματα, όχι τρία. Το greedy απέτυχε — και πρόσεξε
        <strong>πώς</strong> απέτυχε: όχι με σφάλμα, όχι με panic, αλλά με μια απάντηση που μοιάζει απόλυτα
        έγκυρη. Πήρε το 4 επειδή ήταν το μεγαλύτερο που χωρούσε, και αυτή η επιλογή έκλεισε τον δρόμο προς
        την καλύτερη λύση — αλλά ο αλγόριθμος δεν έχει κανέναν μηχανισμό να το ανακαλύψει, γιατί
        <em>ποτέ δεν γυρίζει πίσω</em>.
    </p>
</div>

<p>
    Αυτό είναι το κεντρικό μάθημα του greedy, και αξίζει να το πεις δυνατά: <strong>ο ίδιος ακριβώς
    αλγόριθμος είναι σωστός για το ευρώ και λάθος για το νόμισμα {4, 3, 1}</strong>. Η ορθότητα δεν είναι
    ιδιότητα του κώδικα — είναι ιδιότητα του <em>προβλήματος</em>.
</p>

<h2>Παράδειγμα 3: ρωμαϊκοί αριθμοί</h2>

<p>
    Μετάτρεψε έναν αριθμό από 1 έως 3999 σε ρωμαϊκή γραφή. Το 1994 γίνεται <code>MCMXCIV</code>, το 2024
    γίνεται <code>MMXXIV</code>. Τα βασικά σύμβολα:
</p>

<table class="glossary-table">
<tr><td class="gt-term">I</td><td class="gt-term">V</td><td class="gt-term">X</td><td class="gt-term">L</td><td class="gt-term">C</td><td class="gt-term">D</td><td class="gt-def">M</td></tr>
<tr><td class="gt-term">1</td><td class="gt-term">5</td><td class="gt-term">10</td><td class="gt-term">50</td><td class="gt-term">100</td><td class="gt-term">500</td><td class="gt-def">1000</td></tr>
</table>

<p>
    Η πρώτη σκέψη είναι ακριβώς η ίδια με τα κέρματα: <em>πάρε το μεγαλύτερο σύμβολο που χωράει ακόμα, και
    επανάλαβε</em>. Αλλά υπάρχει μια παγίδα. Με μόνο αυτά τα εφτά σύμβολα, το 4 θα γινόταν
    <code>IIII</code> και το 900 θα γινόταν <code>DCCCC</code> — και τα δύο είναι λάθος ρωμαϊκή γραφή. Το
    σωστό είναι <code>IV</code> και <code>CM</code>.
</p>

<div class="callout">
    <span class="tag">Η ιδέα: μετέτρεψε τους κανόνες σε «κέρματα»</span>
    <p>
        Τα ρωμαϊκά έχουν έξι <strong>αφαιρετικά ζεύγη</strong>: <code>CM</code>=900, <code>CD</code>=400,
        <code>XC</code>=90, <code>XL</code>=40, <code>IX</code>=9, <code>IV</code>=4. Αντί να τα χειριστείς
        ως ειδικές περιπτώσεις με <code>if</code>, βάλ' τα μέσα στη λίστα σαν να ήταν κανονικά σύμβολα. Τότε
        το πρόβλημα γίνεται <strong>ακριβώς το ίδιο</strong> με τα ρέστα — δεκατρία «κέρματα» αντί για εφτά.
    </p>
</div>

<pre><code class="lang-go">// ToRoman converts a number from 1 to 3999 into Roman numerals.
func ToRoman(n int) string {
    // The two slices stay aligned: values[i] is written as symbols[i].
    // Sorted from largest to smallest - greedy depends on that.
    values := []int{1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1}
    symbols := []string{"M", "CM", "D", "CD", "C", "XC", "L", "XL", "X", "IX", "V", "IV", "I"}

    result := ""

    for i, value := range values {
        for n &gt;= value {
            result += symbols[i] // take this "coin"
            n -= value           // and subtract what it is worth
        }
    }
    return result
}
// ToRoman(1994) -&gt; "MCMXCIV"
// ToRoman(2024) -&gt; "MMXXIV"
// ToRoman(3999) -&gt; "MMMCMXCIX"
</code></pre>

<p>Ας δούμε το 1994 βήμα-βήμα:</p>
