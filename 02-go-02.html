<div class="eyebrow">Ενότητα 1 / 8 — Packages & Οργάνωση Project</div>
<h1>Go Modules</h1>
<p class="lede">Μέχρι τώρα γράφαμε κώδικα σε ένα μόνο αρχείο. Αλλά τι γίνεται όταν το project μεγαλώνει, ή όταν θέλουμε να χρησιμοποιήσουμε κώδικα που έγραψε κάποιος άλλος; Χρειαζόμαστε έναν τρόπο να ορίσουμε "αυτό εδώ είναι ένα ξεχωριστό project" και να διαχειριστούμε τι εξαρτάται από τι. Αυτός ο τρόπος στη Go λέγεται <strong>module</strong>.</p>

<h2>Τι είναι ένα module</h2>
<p>Ένα module είναι απλά μια συλλογή από Go packages που ζουν μαζί σε έναν φάκελο (και τους υποφακέλους του) και εκδίδονται/διαχειρίζονται μαζί ως μία μονάδα. Κάθε φορά που ξεκινάς ένα καινούριο, ανεξάρτητο project σε Go, το πρώτο πράγμα που κάνεις είναι να το "δηλώσεις" ως module. Αυτό δεν είναι απλά τυπικότητα — χωρίς αυτό το βήμα, ο compiler δεν ξέρει πώς να ονομάσει το project σου ώστε άλλος κώδικας (δικός σου ή τρίτου) να μπορεί να το εισάγει (import) αργότερα.</p>

<h2>Δημιουργία module με <code>go mod init</code></h2>
<p>Η εντολή που δηλώνει έναν φάκελο ως module τρέχει στο terminal, μέσα στον φάκελο του project:</p>

<pre><code class="lang-go">go mod init example.com/myproject</code></pre>

<p>Το <code>example.com/myproject</code> εδώ είναι το <strong>module path</strong> — ένα μοναδικό όνομα για το project σου. Σε πραγματικά, δημόσια projects συνήθως είναι το path ενός repository (π.χ. <code>github.com/username/projectname</code>), γιατί έτσι είναι εγγυημένα μοναδικό παγκοσμίως και ταυτόχρονα λέει στους άλλους πού να βρουν τον πηγαίο κώδικα. Για ασκήσεις/μάθηση, ένα απλό όνομα όπως <code>learngo</code> είναι απόλυτα αποδεκτό.</p>

<div class="callout">
  <span class="tag">Σημαντικό</span>
  Το <code>go mod init</code> τρέχει ΜΙΑ φορά, στην αρχή του project. Δεν το ξανατρέχεις κάθε φορά που προσθέτεις αρχεία ή packages — μόνο όταν φτιάχνεις το project από την αρχή.
</div>

<h2>Το αρχείο <code>go.mod</code></h2>
<p>Η εντολή <code>go mod init</code> δημιουργεί ένα αρχείο με όνομα <code>go.mod</code> στη ρίζα του project. Αυτό το αρχείο είναι η "ταυτότητα" του module — περιέχει το όνομά του, την έκδοση της Go που χρησιμοποιείται, και (καθώς προσθέτεις εξωτερικές βιβλιοθήκες) τη λίστα των εξαρτήσεών του.</p>

<pre><code class="lang-go">module example.com/myproject

go 1.22
</code></pre>

<p>Ένα φρέσκο module, χωρίς καμία εξωτερική εξάρτηση ακόμα, έχει μόνο αυτές τις δύο γραμμές. Καθώς το project μεγαλώνει και εισάγεις κώδικα από άλλους (τρίτα packages), το <code>go.mod</code> ενημερώνεται αυτόματα και προσθέτει μία γραμμή <code>require</code> για κάθε εξάρτηση, μαζί με τη συγκεκριμένη έκδοσή της.</p>

<h2>Το αρχείο <code>go.sum</code></h2>
<p>Δίπλα στο <code>go.mod</code>, όταν υπάρχουν εξωτερικές εξαρτήσεις, εμφανίζεται και ένα δεύτερο αρχείο: το <code>go.sum</code>. Ενώ το <code>go.mod</code> λέει <em>ποιες</em> εξαρτήσεις χρειάζεσαι και σε ποια έκδοση, το <code>go.sum</code> κρατάει ένα κρυπτογραφικό "αποτύπωμα" (checksum/hash) του ακριβούς περιεχομένου κάθε εξάρτησης. Ο σκοπός του είναι ασφάλεια: αν κάποιος αλλάξει κρυφά το περιεχόμενο μιας βιβλιοθήκης που ήδη χρησιμοποιείς (π.χ. σε επίθεση τύπου supply-chain), το checksum δεν θα ταιριάζει πια, και η Go θα αρνηθεί να χτίσει το project σου, προειδοποιώντας σε.</p>

<div class="callout good">
  <span class="tag">Καλή πρακτική</span>
  Και τα δύο αρχεία, <code>go.mod</code> ΚΑΙ <code>go.sum</code>, πρέπει να μπαίνουν σε version control (π.χ. Git). Δεν είναι προσωρινά ή "παραγόμενα" αρχεία που αγνοούνται — είναι μέρος του project.
</div>

<h2>Διαχείριση εξωτερικών εξαρτήσεων</h2>
<p>Όταν θέλεις να χρησιμοποιήσεις μια βιβλιοθήκη τρίτου στο project σου, απλά την εισάγεις (<code>import</code>) στον κώδικά σου και μετά τρέχεις:</p>

<pre><code class="lang-go">go mod tidy</code></pre>

<p>Η εντολή αυτή κάνει δύο πράγματα ταυτόχρονα: κατεβάζει (και καταγράφει στο <code>go.mod</code>/<code>go.sum</code>) οποιαδήποτε εξάρτηση χρησιμοποιείς στον κώδικα αλλά δεν είναι ακόμα καταγεγραμμένη, και ταυτόχρονα αφαιρεί από το <code>go.mod</code> ό,τι είχε καταγραφεί παλιότερα αλλά πια δεν χρησιμοποιείται πουθενά στον κώδικα. Είναι καλή συνήθεια να την τρέχεις τακτικά, ειδικά πριν από ένα commit.</p>
`);

        addContent(`
<div class="eyebrow">Ενότητα 1 / 8 — Packages & Οργάνωση Project</div>
<h1>Packages (Πακέτα)</h1>
<p class="lede">Ένα module μπορεί να περιέχει πολλά packages. Ένα package είναι η μονάδα οργάνωσης κώδικα μέσα σε ένα module — μια ομάδα από αρχεία <code>.go</code> που μοιράζονται τον ίδιο σκοπό και "βλέπουν" το ένα τα identifiers του άλλου χωρίς να χρειάζεται import μεταξύ τους.</p>

<h2>Ορισμός package στην αρχή του αρχείου</h2>
<p>Κάθε αρχείο <code>.go</code> ξεκινά υποχρεωτικά με μία δήλωση <code>package</code>, που λέει σε ποιο package ανήκει αυτό το αρχείο. Όλα τα αρχεία μέσα στον ίδιο φάκελο πρέπει να δηλώνουν το ίδιο package name.</p>

<pre><code class="lang-go">package main

// everything below belongs to package "main"
func main() {
    // ...
}</code></pre>

<p>Το <code>package main</code> είναι ειδικό: δηλώνει ότι αυτό το package παράγει ένα εκτελέσιμο πρόγραμμα (όχι μια βιβλιοθήκη), και πρέπει να περιέχει μια function <code>main()</code> — αυτή είναι το σημείο εκκίνησης όταν τρέχεις το πρόγραμμα. Ένα module μπορεί να έχει το πολύ ένα package main ανά εκτελέσιμο που παράγει, αλλά μπορεί να έχει όσα άλλα (non-main) packages χρειάζεται για να οργανώσει τη λογική του.</p>

<h2>Εισαγωγή packages (<code>import</code>) και alias</h2>
<p>Για να χρησιμοποιήσεις κώδικα από άλλο package (είτε δικό σου, είτε της standard library, είτε τρίτου), το εισάγεις με <code>import</code> στην κορυφή του αρχείου, αμέσως μετά τη δήλωση package:</p>

<pre><code class="lang-go">package main

import (
    "fmt"
    "math"
)

func main() {
    fmt.Println(math.Sqrt(16)) // 4
}</code></pre>

<p>Μετά το import, αναφέρεσαι σε ό,τι εξάγει εκείνο το package βάζοντας μπροστά το όνομά του και τελεία, π.χ. <code>math.Sqrt(...)</code>. Αν το όνομα ενός package είναι μακρύ, ασαφές, ή συγκρούεται με άλλο import που ήδη χρησιμοποιείς, μπορείς να του δώσεις ένα δικό σου, τοπικό όνομα (<strong>alias</strong>) στο import:</p>

<pre><code class="lang-go">import (
    m "math" // alias: "m" instead of "math"
)

func main() {
    fmt.Println(m.Sqrt(16)) // same package, shorter name
}</code></pre>

<h2>Φτιάχνοντας το δικό μας package</h2>
<p>Ας δούμε ένα πλήρες, μικρό παράδειγμα από την αρχή: πώς φτιάχνουμε ένα δικό μας package, τι μπαίνει μέσα του, και πώς το χρησιμοποιούμε από αλλού. Ας υποθέσουμε ότι έχουμε ένα module με όνομα <code>learngo</code>, και θέλουμε ένα ξεχωριστό package με βοηθητικές functions πάνω σε αριθμούς.</p>

<p><strong>Βήμα 1:</strong> Φτιάχνουμε έναν υποφάκελο με το όνομα του package — εδώ <code>mathutil/</code> — και μέσα του ένα αρχείο <code>.go</code>:</p>

<pre><code>learngo/
├── go.mod
├── main.go
└── mathutil/
    └── mathutil.go</code></pre>

<p><strong>Βήμα 2:</strong> Μέσα στο <code>mathutil.go</code>, η πρώτη γραμμή δηλώνει το package name (ίδιο με το όνομα του φακέλου, από σύμβαση), και μετά ορίζουμε ό,τι functions θέλουμε να εξάγουμε — με κεφαλαίο πρώτο γράμμα, ώστε να είναι ορατές έξω από το package:</p>

<pre><code class="lang-go">package mathutil

// Sum adds every int in a slice and returns the total.
func Sum(numbers []int) int {
    total := 0
    for _, n := range numbers { // iteration over the slice
        total += n
    }
    return total
}

// Max returns the largest int in a slice.
// Assumes the slice is not empty.
func Max(numbers []int) int {
    largest := numbers[0]
    for _, n := range numbers {
        if n > largest {
            largest = n
        }
    }
    return largest
}</code></pre>

<p><strong>Βήμα 3:</strong> Από το <code>main.go</code>, κάνουμε import το package χρησιμοποιώντας το module path (<code>learngo</code>) συν το όνομα του υποφακέλου (<code>mathutil</code>), και καλούμε τις exported functions του με το πρόθεμα <code>mathutil.</code>:</p>

<pre><code class="lang-go">package main

import (
    "fmt"
    "learngo/mathutil" // module path "learngo" + subfolder "mathutil"
)

func main() {
    values := []int{4, 9, 2, 7} // a slice of int

    fmt.Println(mathutil.Sum(values)) // 22
    fmt.Println(mathutil.Max(values)) // 9
}</code></pre>

<div class="callout good">
  <span class="tag">Τι μόλις έγινε</span>
  Το <code>main</code> δεν ξέρει (και δεν χρειάζεται να ξέρει) ΠΩΣ υλοποιούνται οι <code>Sum</code> και <code>Max</code> — απλά τις καλεί μέσω του ονόματος package. Αυτό είναι το ίδιο το νόημα της οργάνωσης σε packages: διαχωρισμός του "τι κάνει κάτι" (το exported API) από το "πώς το κάνει" (η εσωτερική υλοποίηση).
</div>

<p>Αν το <code>mathutil.go</code> είχε επιπλέον μια βοηθητική function με πεζό πρώτο γράμμα (π.χ. <code>func clamp(n int) int</code>), αυτή θα ήταν χρησιμοποιήσιμη μόνο μέσα στο ίδιο το package <code>mathutil</code> — το <code>main.go</code> δεν θα μπορούσε καν να τη δει, πόσο μάλλον να την καλέσει.</p>

<h2>Ορατότητα και Προσβασιμότητα: Exported vs Unexported</h2>
<p>Η Go δεν έχει keywords όπως <code>public</code> ή <code>private</code> για να ελέγξει ποιος βλέπει τι — αντί αυτού, χρησιμοποιεί έναν πολύ απλό κανόνα βασισμένο στο <strong>πρώτο γράμμα</strong> του ονόματος:</p>

<div class="grid2">
  <div class="card"><h3>Κεφαλαίο πρώτο γράμμα → Exported</h3><p>Το identifier (function, variable, type, κ.λπ.) είναι ορατό και χρησιμοποιήσιμο από ΑΛΛΑ packages που το εισάγουν. Π.χ. <code>func Calculate()</code>, <code>var MaxRetries</code>.</p></div>
  <div class="card"><h3>Πεζό πρώτο γράμμα → Unexported</h3><p>Το identifier είναι ορατό ΜΟΝΟ μέσα στο ίδιο package. Άλλα packages που το εισάγουν δεν μπορούν καν να το δουν, πόσο μάλλον να το χρησιμοποιήσουν. Π.χ. <code>func calculate()</code>, <code>var maxRetries</code>.</p></div>
</div>

<p>Αυτό ισχύει για functions, variables, constants, types — οτιδήποτε δηλώνεται σε επίπεδο package. Είναι ο βασικός μηχανισμός της Go για το τι θεωρείται "δημόσιο API" ενός package (αυτό που θέλεις να χρησιμοποιούν άλλοι) και τι είναι εσωτερική λεπτομέρεια υλοποίησης που δεν αφορά κανέναν έξω από το package.</p>

<div class="callout">
  <span class="tag">Προσοχή / Συχνό λάθος</span>
  Το κεφαλαίο/πεζό γράμμα δεν είναι απλά σύμβαση στυλ — είναι το ίδιο το μηχανισμό ελέγχου προσβασιμότητας της γλώσσας. Αν ξεχάσεις να κάνεις κεφαλαίο το πρώτο γράμμα μιας function που θες να χρησιμοποιήσει άλλο package, θα πάρεις σφάλμα μεταγλώττισης σε εκείνο το άλλο package, όχι εδώ.
</div>

<h2>Η ειδική function αρχικοποίησης <code>init()</code></h2>
<p>Κάθε package μπορεί προαιρετικά να ορίσει μία ή περισσότερες functions με το ειδικό όνομα <code>init()</code>. Αυτές οι functions δεν καλούνται από εσένα ρητά — η Go τις τρέχει <strong>αυτόματα</strong>, μία φορά, πριν εκτελεστεί η <code>main()</code>, αφού πρώτα έχουν αρχικοποιηθεί όλες οι package-level μεταβλητές. Χρησιμοποιείται για setup που πρέπει να τρέξει πριν ξεκινήσει οτιδήποτε άλλο (π.χ. έλεγχος ρυθμίσεων, προετοιμασία δεδομένων).</p>

<pre><code class="lang-go">package main

import "fmt"

func init() {
    fmt.Println("this runs first, automatically")
}

func main() {
    fmt.Println("this runs second")
}</code></pre>

<p>Η <code>init()</code> δεν παίρνει ορίσματα και δεν επιστρέφει τίποτα. Δεν τη χρειάζεσαι συχνά σε αρχικά προγράμματα — αλλά είναι σημαντικό να αναγνωρίζεις το πρότυπο όταν το συναντήσεις σε κώδικα άλλων.</p>
`);

        // ── Mini-glossary — §1.1-1.2 ─────────────────────────────────────────── ⊃
        addContent(`
<div class="eyebrow">Μίνι Γλωσσάρι — §1.1 &amp; §1.2</div>
<h2>Όροι που μόλις είδαμε</h2>
<div class="glossary-columns">
  <div class="gc-line"><span class="gc-term">module</span><span class="gc-def">συλλογή packages που διαχειρίζονται μαζί ως μία μονάδα</span></div>
  <div class="gc-line"><span class="gc-term">go.mod</span><span class="gc-def">αρχείο ταυτότητας module: όνομα, έκδοση Go, εξαρτήσεις</span></div>

<div class="eyebrow">Ενότητα 1 / 8 — Packages & Οργάνωση Project</div>
<h1>Δομή και Οργάνωση Go Projects</h1>
<p class="lede">Ένα module δεν χρειάζεται να έχει όλο τον κώδικά του σε έναν φάκελο. Καθώς ένα project μεγαλώνει, το χωρίζουμε σε πολλά packages — καθένα σε δικό του υποφάκελο — ώστε κάθε κομμάτι της λογικής να έχει τον δικό του χώρο, το δικό του όνομα, και σαφή όρια με τα υπόλοιπα.</p>

<h2>Οργάνωση κώδικα σε υποπακέτα (sub-packages)</h2>
<p>Ένα "sub-package" δεν είναι κάτι ειδικό συντακτικά — είναι απλά ένας υποφάκελος μέσα στο module, με δικά του αρχεία <code>.go</code> που δηλώνουν το δικό τους <code>package</code> name (συνήθως ίδιο με το όνομα του φακέλου, από σύμβαση, όχι υποχρέωση). Έτσι ένα project μπορεί να μοιάζει έτσι:</p>

<pre><code>myproject/
├── go.mod
├── main.go          <span class="cm">// package main</span>
└── shapes/
    └── shapes.go     <span class="cm">// package shapes</span></code></pre>

<p>Εδώ το <code>myproject</code> είναι ένα module με δύο packages: το <code>main</code> στη ρίζα, και το <code>shapes</code> στον υποφάκελο <code>shapes/</code>. Κάθε φάκελος = ένα package. Δεν μπορείς να έχεις δύο διαφορετικά packages στον ίδιο φάκελο, ούτε το ίδιο package χωρισμένο σε δύο διαφορετικούς φακέλους.</p>

<h2>Σωστή εισαγωγή υποπακέτων</h2>
<p>Για να χρησιμοποιήσεις ένα sub-package από άλλο σημείο του ίδιου module, το import path είναι το module path (από το <code>go.mod</code>) ακολουθούμενο από τη διαδρομή του υποφακέλου:</p>

<pre><code class="lang-go"><span class="cm">// go.mod: module myproject</span>
package main

import (
    "fmt"
    "myproject/shapes" // module path + subfolder path
)

func main() {
    fmt.Println(shapes.Area(4, 5))
}</code></pre>

<p>Πρόσεξε: το import path χρησιμοποιεί το <strong>module path</strong>, όχι κάποιο relative path τύπου <code>"./shapes"</code> — αυτού του είδους τα relative imports δεν υπάρχουν στη Go. Το module path είναι πάντα το σημείο αναφοράς, ό,τι κι αν λέει το <code>go.mod</code> στη ρίζα του project.</p>

<h2>Αποφυγή κυκλικών εξαρτήσεων (Circular Dependencies)</h2>
<p>Η Go απαγορεύει ρητά τις <strong>κυκλικές εξαρτήσεις</strong>: αν το package A κάνει import το package B, τότε το B δεν επιτρέπεται να κάνει import (άμεσα ή έμμεσα, μέσω κάποιου τρίτου package) το A. Αν προσπαθήσεις, ο compiler αρνείται να χτίσει το project και σου δείχνει ολόκληρο τον κύκλο εξάρτησης.</p>

<div class="grid2">
  <div class="card"><h3>Γιατί απαγορεύεται</h3><p>Αν επιτρεπόταν, ο compiler δεν θα ήξερε με ποια σειρά να μεταγλωττίσει τα packages — το A χρειάζεται το B έτοιμο, αλλά και το B χρειάζεται το A έτοιμο. Είναι λογικό αδιέξοδο, όχι απλά τεχνικός περιορισμός.</p></div>
  <div class="card"><h3>Πώς αποφεύγεται</h3><p>Συνήθως λύνεται είτε συγχωνεύοντας τα δύο packages σε ένα, είτε εξάγοντας το κοινό κομμάτι που χρειάζονται και τα δύο σε ένα τρίτο, ανεξάρτητο package που δεν εξαρτάται από κανέναν από τους δύο.</p></div>
</div>

<h2>Standard Project Layout — awareness</h2>
<p>Σε μεγάλα, πραγματικά (real-world) Go repositories θα συναντήσεις συχνά μια οικογένεια συμβάσεων για το πώς ονομάζονται οι φάκελοι ενός project. Δεν είναι κανόνας της ίδιας της γλώσσας — είναι σύμβαση της κοινότητας — αλλά είναι πολύ διαδεδομένη, οπότε αξίζει να την αναγνωρίζεις όταν την βλέπεις:</p>

<div class="glossary-strip">
  <div class="gs-pill"><span class="gs-name">/cmd</span><span class="gs-def">τα entry points — ένας υποφάκελος ανά εκτελέσιμο πρόγραμμα (package main) που παράγει το project</span></div>
  <div class="gs-pill"><span class="gs-name">/pkg</span><span class="gs-def">κώδικας-βιβλιοθήκη που προορίζεται να είναι χρησιμοποιήσιμος και από άλλα, εξωτερικά projects</span></div>
  <div class="gs-pill"><span class="gs-name">/internal</span><span class="gs-def">κώδικας που ο ίδιος ο compiler της Go εμποδίζει να εισαχθεί από οποιοδήποτε project έξω από αυτό — εσωτερική λεπτομέρεια, εγγυημένα</span></div>
</div>

<p class="lede">Αυτό είναι απλά για αναγνώριση προς το παρόν — για μικρά projects και ασκήσεις, ένα απλό, επίπεδο layout (όπως το παράδειγμα με το <code>shapes/</code> παραπάνω) είναι απόλυτα αρκετό. Δεν χρειάζεται να ακολουθείς αυτή τη σύμβαση για να γράφεις σωστή Go.</p>
`);

<div class="eyebrow">Ενότητα 2 / 8 — Εισαγωγή-Έξοδος & Ορίσματα CLI</div>
<h1>Ορίσματα Γραμμής Εντολών (os.Args)</h1>
<p class="lede">Μέχρι τώρα, κάθε πρόγραμμά μας έπαιρνε δεδομένα μέσω hardcoded τιμών στον κώδικα ή input από το πληκτρολόγιο κατά την εκτέλεση. Υπάρχει όμως κι ένας τρίτος τρόπος: να δώσεις δεδομένα στο πρόγραμμα τη στιγμή που το ξεκινάς, μέσα από το ίδιο το terminal. Αυτά λέγονται <strong>ορίσματα γραμμής εντολών</strong> (command-line arguments), και είναι θεμελιώδη για κάθε εργαλείο που τρέχει από terminal — από το <code>ls</code> μέχρι το <code>git</code>.</p>

<h2>Τι είναι το os.Args</h2>
<p>Η standard library της Go εκθέτει τα ορίσματα γραμμής εντολών μέσα από ένα package με όνομα <code>os</code> ("operating system"), και συγκεκριμένα μέσα από μια μεταβλητή τύπου <code>[]string</code> (slice από strings) ονόματι <code>Args</code>. Κάθε "λέξη" που δίνεις μετά το όνομα του εκτελέσιμου, χωρισμένη από κενά, γίνεται ένα στοιχείο (element) αυτού του slice.</p>

<pre><code class="lang-go">package main

import (
    "fmt"
    "os"
)

func main() {
    fmt.Println(os.Args)
}</code></pre>

<p>Αν τρέξεις το παραπάνω πρόγραμμα από terminal ως:</p>

<pre><code>go run main.go hello world 123</code></pre>

<p>Το αποτέλεσμα θα είναι:</p>

<pre><code>[main hello world 123]</code></pre>

<div class="callout">
  <span class="tag">Προσοχή / Συχνό λάθος</span>
  Το <code>os.Args[0]</code> ΔΕΝ είναι το πρώτο πραγματικό όρισμα — είναι το όνομα/διαδρομή του ίδιου του εκτελέσιμου προγράμματος. Αυτό ισχύει πάντα, σε κάθε γλώσσα προγραμματισμού που ακολουθεί αυτή τη σύμβαση, όχι μόνο στη Go. Τα πραγματικά ορίσματα που έδωσε ο χρήστης ξεκινούν από το index 1.
</div>

<h2>Iteration και επεξεργασία των ορισμάτων: os.Args[1:]</h2>
<p>Επειδή το index 0 δεν είναι ποτέ χρήσιμο όρισμα, σχεδόν πάντα δουλεύουμε με το slice <code>os.Args[1:]</code> — δηλαδή, "όλα τα στοιχεία από το index 1 και μετά" (θυμήσου το slicing από το Μέρος 1). Αυτό μας δίνει μόνο τα ορίσματα που έδωσε ο χρήστης, χωρίς το όνομα του προγράμματος να μπλέκεται στη μέση.</p>

<pre><code class="lang-go">package main

import (
    "fmt"
    "os"
)

func main() {
    userArgs := os.Args[1:] // real arguments only, program name excluded

    if len(userArgs) == 0 {
        fmt.Println("no arguments given")
        return
    }

    for i, arg := range userArgs { // iteration over the slice
        fmt.Println(i, "→", arg)
    }
}</code></pre>

<p>Ένα σημαντικό σημείο εδώ: κάθε στοιχείο του <code>os.Args</code> είναι πάντα <code>string</code> — ακόμα κι αν ο χρήστης έδωσε κάτι που "μοιάζει" με αριθμό, όπως το <code>123</code> στο προηγούμενο παράδειγμα. Αν το πρόγραμμά σου χρειάζεται έναν πραγματικό αριθμό (<code>int</code>) από ένα όρισμα, πρέπει να το μετατρέψεις εσύ ρητά — κάτι που δεν καλύπτουμε ακόμα σε αυτό το guide, αφού απαιτεί error handling (θα το δούμε σε επόμενο guide).</p>

<div class="grid2">
  <div class="card"><h3>Πότε χρησιμοποιείς os.Args</h3><p>Για απλά, γρήγορα εργαλεία με λίγα, σταθερής θέσης ορίσματα — π.χ. "δώσε μου ένα filename ως πρώτο όρισμα".</p></div>
  <div class="card"><h3>Πότε ΔΕΝ αρκεί</h3><p>Όταν θέλεις named options με <code>--</code> μπροστά (π.χ. <code>--verbose</code>, <code>--output=file.txt</code>), προαιρετικά ορίσματα, ή default τιμές. Εκεί χρειάζεσαι κάτι πιο ισχυρό — το βλέπουμε αμέσως μετά.</p></div>
</div>
`);

        addContent(`
<div class="eyebrow">Ενότητα 2 / 8 — Εισαγωγή-Έξοδος & Ορίσματα CLI</div>
<h1>Ειδικές Εντολές με Παύλα: το package flag</h1>
<p class="lede">Σίγουρα έχεις δει προγράμματα του terminal να παίρνουν ορίσματα με παύλα μπροστά, όπως <code>ls -l</code>, ή <code>git commit --message "κείμενο"</code>. Αυτά λέγονται <strong>flags</strong> (ή "options"/"switches"), και είναι διαφορετικά από τα απλά, θεσιακά ορίσματα του <code>os.Args</code>: έχουν όνομα, μπορεί να έχουν default τιμή, και δεν εξαρτώνται από τη σειρά που τα γράφεις.</p>

<h2>Γιατί όχι απλά os.Args για αυτό</h2>
<p>Θα μπορούσες, θεωρητικά, να διασχίσεις εσύ το <code>os.Args</code> με το χέρι, ψάχνοντας για strings που ξεκινούν με <code>-</code> ή <code>--</code>. Αλλά αυτό γρήγορα γίνεται δύσκολο να διαβαστεί και επιρρεπές σε λάθη: τι γίνεται αν το flag δεν δοθεί καθόλου; Τι default τιμή παίρνει; Τι γίνεται αν δοθεί σε διαφορετική σειρά από τα υπόλοιπα; Το package <code>flag</code> της standard library λύνει ακριβώς αυτό το πρόβλημα, με έτοιμο, δοκιμασμένο κώδικα.</p>

<h2>Ορισμός και ανάγνωση ενός flag</h2>
<p>Η πιο απλή μορφή είναι το <code>flag.String(name, defaultValue, usageText)</code> (υπάρχουν αντίστοιχα και για <code>Int</code>, <code>Bool</code>, κ.λπ.) — ορίζει ένα flag με το δοσμένο όνομα, και επιστρέφει έναν <strong>pointer</strong> προς την τιμή του (θυμήσου τους pointers από το Μέρος 1). Μετά τον ορισμό όλων των flags, καλείς <code>flag.Parse()</code> ΜΙΑ φορά, η οποία διαβάζει το πραγματικό <code>os.Args</code> και γεμίζει τις τιμές πίσω από αυτούς τους pointers.</p>

<pre><code class="lang-go">package main

import (
    "flag"
    "fmt"
)

func main() {
    name := flag.String("name", "world", "the name to greet")
    flag.Parse() // must be called after all flags are defined, before they're read

    fmt.Println("hello,", *name) // dereference the pointer to get the value
}</code></pre>

<p>Τρέχοντας αυτό ως <code>go run main.go -name=Ana</code> τυπώνει <code>hello, Ana</code>· τρέχοντάς το χωρίς κανένα flag τυπώνει <code>hello, world</code> — η default τιμή χρησιμοποιείται αυτόματα. Πρόσεξε το <code>*name</code>: το <code>flag.String</code> επιστρέφει <code>*string</code> (pointer σε string), οπότε χρειάζεται dereference (<code>*</code>) για να πάρεις την πραγματική τιμή.</p>

<div class="callout">
  <span class="tag">Σημαντικό</span>
  Το <code>flag.Parse()</code> πρέπει να καλείται ΑΦΟΥ έχεις ορίσει όλα τα flags σου με <code>flag.String</code>/<code>flag.Int</code>/κ.λπ., αλλά ΠΡΙΝ διαβάσεις οποιαδήποτε τιμή τους. Αν διαβάσεις μια τιμή πριν το Parse(), θα πάρεις πάντα την (κενή) αρχική τιμή, όχι αυτή που έδωσε ο χρήστης.

<h2>Πολλαπλά flags και διαφορετικοί τύποι</h2>
<pre><code class="lang-go">package main

import (
    "flag"
    "fmt"
)

func main() {
    name := flag.String("name", "world", "the name to greet")
    times := flag.Int("times", 1, "how many times to repeat the greeting")
    loud := flag.Bool("loud", false, "shout the greeting in capital letters")

    flag.Parse()

    for i := 0; i < *times; i++ {
        greeting := "hello, " + *name
        fmt.Println(greeting)
    }
    fmt.Println("loud mode:", *loud)
}</code></pre>

<p>Τρέχοντας <code>go run main.go -name=Ana -times=3 -loud</code> ορίζει και τα τρία flags — πρόσεξε ότι το <code>-loud</code> (τύπου <code>Bool</code>) δεν χρειάζεται τιμή μετά του· η απλή του παρουσία σημαίνει <code>true</code>. Η σειρά με την οποία γράφεις τα flags στο terminal δεν έχει σημασία — μπορείς να γράψεις <code>-loud -times=3 -name=Ana</code> και θα δουλέψει ακριβώς το ίδιο.</p>

<p class="lede">

</p>

<pre><code class="lang-go">package main

import (
    "flag"
    "fmt"
)

func main() {
    verbose := flag.Bool("verbose", false, "print extra detail")
    flag.Parse()

    files := flag.Args() // everything that was NOT recognised as a flag

    fmt.Println("verbose mode:", *verbose)
    fmt.Println("how many files:", len(files))

    }

<p>Τρέχοντάς το ως <code>go run main.go -verbose notes.txt report.txt</code> παίρνεις:</p>

<pre><code>verbose mode: true

<div class="callout">

        Και τα δύο σου δίνουν "τα ορίσματα του χρήστη" — αλλά το <code>os.Args[1:]</code> σου δίνει

<h1>Το όρισμα είναι πάντα string — τι κάνεις αν θες αριθμό;</h1>

<p class="lede">
    Είπαμε νωρίτερα ότι κάθε στοιχείο του <code>os.Args</code> είναι <code>string</code>, ακόμα κι όταν ο
    χρήστης γράψει <code>123</code>. Ας δούμε γιατί αυτό είναι πραγματικό πρόβλημα, και όχι λεπτομέρεια.
</p>

<pre><code class="lang-go">// The user runs: go run main.go 5
count := os.Args[1] // count is the STRING "5", not the number 5

// This does NOT compile - you cannot multiply a string by a number:
// total := count * 2
</code></pre>

<p>
    Ο compiler σε σταματάει, κάτι που είναι καλό. Χρειάζεσαι λοιπόν μια μετατροπή — και εδώ εμφανίζεται μια
    δυσκολία που αξίζει να τη δεις τώρα: <strong>η μετατροπή μπορεί να αποτύχει</strong>. Τι θα έπρεπε να
    επιστρέψει η μετατροπή αν ο χρήστης γράψει <code>go run main.go abc</code>; Δεν υπάρχει σωστός αριθμός να
    δώσεις.
</p>

<p>
    Η standard library της Go έχει έτοιμη λύση γι' αυτό (το package <code>strconv</code>), αλλά η υπογραφή της
    επιστρέφει ένα <code>error</code> — και το error handling δεν το έχουμε δει ακόμα. Οπότε ας γράψουμε τη
    δική μας, μικρή εκδοχή, που λέει "πέτυχε ή απέτυχε" με ένα απλό <code>bool</code>:
</p>

<pre><code class="lang-go">// toInt converts a string of digits to an int.
// ok is false if the string contains anything that is not a digit.
func toInt(s string) (value int, ok bool) {
    if len(s) == 0 {
        return 0, false // empty string is not a number
    }

    for _, ch := range s {
        if ch &lt; '0' || ch &gt; '9' {
            return 0, false // found something that is not a digit
        }
        digit := int(ch - '0')  // '0'-'9' are consecutive, so this maps '7' to 7
        value = value*10 + digit // shift left one decimal place, then add
    }
    return value, true
}
</code></pre>

<p>Και τώρα το εργαλείο μας μπορεί να δεχτεί πραγματικό αριθμό από τη γραμμή εντολών:</p>

<pre><code class="lang-go">func main() {
    args := os.Args[1:]

    if len(args) == 0 {
        fmt.Println("usage: program &lt;count&gt;")
        return // guard clause - nothing to do without an argument
    }

    count, ok := toInt(args[0])
    if !ok {
        fmt.Println("that is not a valid number:", args[0])
        return
    }

    for i := 0; i &lt; count; i++ {
        fmt.Println("hello")
    }
}
</code></pre>

        addContent(`<div class="eyebrow">Ενότητα 3 / 8 — Patterns</div>
<h1>Γιατί χρειαζόμαστε "patterns"</h1>
<p>Μέχρι τώρα έμαθες τα "γράμματα" της Go: syntax, τύπους, functions, packages. Αυτή η ενότητα είναι διαφορετική — δεν μαθαίνεις νέα syntax, μαθαίνεις <strong>τρόπους σκέψης</strong>. Κάθε δύσκολο πρόβλημα προγραμματισμού, όσο περίπλοκο κι αν φαίνεται, συνήθως λύνεται συνδυάζοντας 2-3 από ένα μικρό σύνολο επαναλαμβανόμενων μοτίβων (patterns). Μόλις τα αναγνωρίζεις, το "δεν ξέρω από πού να ξεκινήσω" γίνεται "α, αυτό είναι sliding window + accumulator".</p>
<br>
<h1>Result Variable — accumulator</h1>
<p>Το πρώτο και πιο βασικό pattern απ' όλα: μια μεταβλητή που θα κρατήσει μια τιμή που θέλουμε να "μετρήσουμε" ή να καταγράφουμε καθώς τρέχει μια loop. Τη δηλώνουμε <strong>έξω</strong> από τη loop — μία φορά — και μέσα στη loop απλά την ενημερώνουμε, ξανά και ξανά, μέχρι να τελειώσει η επανάληψη.</p>

<p><strong>Παράδειγμα 1:</strong> μέτρα πόσα στοιχεία έχει ένας πίνακας.</p>

<pre><code class="lang-go">func main() {
    x := []int{43, 52, 12, 5, 6, 9, 1, 2, 3, 4}
    length := CountElements(x)
    fmt.Println(length)
}

func CountElements(x []int) int {
    var count int   // the result variable — declared once, outside the loop
    for i := range x {
        count++      // updated on every iteration
    }
    return count
}</code></pre>

<p>Ευτυχώς, όπως ξέρουμε ήδη, δεν χρειάζεται να γράφουμε μόνοι μας κάτι σαν το <code>CountElements</code> — για κάθε slice, το <code>len(x)</code> μας δίνει ακριβώς αυτό, έτοιμο. Αλλά το ενδιαφέρον εδώ δεν είναι το αποτέλεσμα· είναι <em>πώς</em> δουλεύει από μέσα: ο "μετρητής" μας αυξανόταν κατά ένα, σε κάθε πέρασμα της <code>for</code>.</p>

<p><strong>Παράδειγμα 2:</strong> η πραγματική αξία του pattern φαίνεται όταν ο μετρητής δεν αυξάνεται <em>πάντα</em>, αλλά μόνο όταν ισχύει κάτι συγκεκριμένο. Π.χ. πόσες φορές εμφανίζεται ένας μονός αριθμός σε ένα slice:</p>

<pre><code class="lang-go">func CountOdd(numbers []int) int {
    var count int
    for _, n := range numbers {
        if n%2 != 0 {
            count++ // only bump the counter when the condition holds
        }
    }
    return count
}</code></pre>

<p>Ή πόσες φορές εμφανίζεται ένας συγκεκριμένος χαρακτήρας μέσα σε ένα string:</p>

<pre><code class="lang-go">func CountRune(input string, target rune) int {
    var count int
    for _, letter := range input {
        if letter == target {
            count++
        }
    }
    return count
}</code></pre>

<p>Πρόσεξε — και στα δύο, η δομή είναι <em>ακριβώς η ίδια</em>: μεταβλητή έξω από τη loop, ένας έλεγχος μέσα, <code>count++</code> όποτε ο έλεγχος περνάει. Μόνο η συνθήκη αλλάζει.</p>

<h2>Το result δεν χρειάζεται να αυξάνεται κατά 1 κάθε φορά</h2>
<p>Δοκίμασε τώρα κάτι λίγο διαφορετικό: αντί για μετρητή, ένα άθροισμα — κάθε φορά, αντί να προσθέτεις 1, προσθέτεις τον ίδιο τον αριθμό:</p>

<pre><code class="lang-go">func SumPositive(numbers []int) int {
    var sum int // still a result variable — just a different starting point
    for _, n := range numbers {
        if n > 0 {
            sum += n // add the number itself, not just +1
        }
    }
    return sum
}</code></pre>

<div class="callout"><span class="tag">Προσοχή στην αρχική τιμή</span>Αν αντί για άθροισμα ήθελες <em>γινόμενο</em> (<code>result *= num</code>), η αρχική τιμή δεν πρέπει να είναι <code>0</code> — αφού οτιδήποτε επί 0 κάνει 0, το αποτέλεσμα θα ήταν μόνιμα <code>0</code>. Η σωστή αρχική τιμή για γινόμενο είναι <code>1</code>.</div>

<h2>Στο result "χτίζουμε" μια φράση</h2>
<p>Ακριβώς όπως αυξάνουμε ένα <code>count</code> τύπου <code>int</code>, μπορούμε να "χτίζουμε" και μια μεταβλητή τύπου <code>string</code> — κάθε φορά που κάτι ισχύει, προσθέτουμε κομμάτι κειμένου πάνω σε ό,τι έχουμε ήδη:</p>

<pre><code class="lang-go">func main() {
    words := []string{"go", "is", "really", "fun", "today"}
    fmt.Println(LongWords(words)) // prints: really today
}

// LongWords builds a single string containing every word longer than 3 letters.
func LongWords(words []string) string {
    var result string
    for _, w := range words {
        if len(w) > 3 {
            result += w + " " // add this word, plus a space to separate it from the next
        }
    }
    return result
}
</code></pre>

<div class="callout good"><span class="tag">Ορισμός</span>Το pattern που μόλις είδες, ξανά και ξανά, λέγεται <strong>accumulator</strong>. Η ιδέα είναι πάντα η ίδια: μια μεταβλητή που ξεκινά από μια "ουδέτερη" αρχική τιμή <em>έξω</em> από τη λούπα (<code>0</code> για μέτρημα/άθροισμα, κενό string για κείμενο, <code>nil</code>/κενό slice για λίστα), και <em>μέσα</em> στη λούπα απλά "μαζεύει" κάτι πάνω σε ό,τι ήδη έχει — <code>count++</code>, <code>sum += n</code>, <code>result += w</code>, <code>append(result, x)</code>. Ό,τι κι αν αλλάζει (τύπος δεδομένων, συνθήκη, τελεστής), ο σκελετός παραμένει ο ίδιος.</div>

<p>Σε μια result variable μπορούμε να βάζουμε <em>πολλά</em> πράγματα, όχι μόνο ένα.
<br>π.χ. τις θέσεις (indices) που εμφανίζεται το γράμμα <code>e</code> μέσα σε ένα string — εδώ η result variable είναι ένα <code>[]int</code>, κι αντί για <code>+=</code> χρησιμοποιούμε <code>append</code>:</p>

<pre><code class="lang-go">func PositionsOfE(input string) []int {
    var positions []int // a slice can be a result variable too
    for i, letter := range input {
        if letter == 'e' {
            positions = append(positions, i)
        }
    }
    return positions
}</code></pre>

<p>Πόσα γράμματα έχει η κάθε λέξη μιας φράσης;</p>

<pre><code class="lang-go">// WordLengths returns the length of every word in the input.
// Assumes words are separated by exactly one space.
func WordLengths(input string) []int {
    var result []int
    count := 0
    for _, letter := range input {
        if letter == ' ' {
            result = append(result, count) // word ended, save its length
            count = 0                       // reset for the next word
        } else {
            count++
        }
    }
    result = append(result, count) // don't forget the last word — no trailing space after it
    return result
}
// WordLengths("go is fun") → [2 2 3]</code></pre>

<h2>Όταν η Result Variable δεν αρκεί: το πρόβλημα</h2>
<p>Το <code>WordLengths</code> παραπάνω δουλεύει — αλλά μόνο υπό μία σιωπηρή προϋπόθεση: ότι ανάμεσα στις λέξεις υπάρχει <em>ακριβώς ένα</em> κενό. Τι θα συμβεί αν δοκιμάσουμε μια φράση με <strong>πολλά συνεχόμενα κενά</strong>;</p>

<pre><code class="lang-go">WordLengths("hello   world") // three spaces between the words</code></pre>

<p>Ας το τρέξουμε με πινακάκι για κάθε iteration:</p>

<table class="glossary-table">
<tr><td class="gt-term">h e l l o</td><td class="gt-term">[]</td><td class="gt-term">5</td><td class="gt-def">count ανεβαίνει σε 5</td></tr>
<tr><td class="gt-term">κενό #1</td><td class="gt-term">[5]</td><td class="gt-term">0</td><td class="gt-def">append(5), count = 0</td></tr>
<tr><td class="gt-term">κενό #2</td><td class="gt-term">[5, 0]</td><td class="gt-term">0</td><td class="gt-def">το count ήταν 0 → append(<strong>0</strong>), count = 0</td></tr>
<tr><td class="gt-term">κενό #3</td><td class="gt-term">[5, 0, 0]</td><td class="gt-term">0</td><td class="gt-def">το ίδιο ξανά → append(<strong>0</strong>), count = 0</td></tr>
<tr><td class="gt-term">w o r l d</td><td class="gt-term">[5, 0, 0]</td><td class="gt-term">5</td><td class="gt-def">count ανεβαίνει σε 5</td></tr>
<tr><td class="gt-term">τέλος</td><td class="gt-term">[5, 0, 0, 5]</td><td class="gt-term">5</td><td class="gt-def">append(5)</td></tr>
</table>


<p>Αποτέλεσμα: <code>[5 0 0 5]</code> — αντί για το σωστό <code>[5 5]</code>. Κάθε επιπλέον κενό δημιουργεί ένα ψεύτικο μηδενικό "word" μέσα στη λίστα μας. Το πρόβλημα δεν είναι το <code>count</code> — είναι ότι ο κώδικας δεν ξέρει να ξεχωρίσει "μόλις τελείωσα μια πραγματική λέξη" από "βρίσκομαι ήδη ανάμεσα σε λέξεις και βλέπω ένα ακόμα κενό".</p>

<div class="callout"><span class="tag">Το πρόβλημα</span>Χρειαζόμαστε κάτι που να θυμάται: "βρίσκομαι <em>μέσα</em> σε λέξη αυτή τη στιγμή, ή όχι;" — και να κάνει <code>append</code> μόνο στην πρώτη περίπτωση.</div>
<br>
<h1>Boolean Switch / Boolean State</h1>
<p>Η λύση: μια δεύτερη μεταβλητή, τύπου <code>bool</code>, που απλά καταγράφει μια κατάσταση — <strong>true</strong> ή <strong>false</strong> — και ελέγχεται πριν από κάθε ενέργεια.</p>
<pre><code class="lang-go">func WordLengths(input string) []int {
    var result []int
    count := 0
    inWord := false // boolean switch — "am I currently inside a word?"

    for _, letter := range input {
        if letter == ' ' {
            if inWord {           // only save a word if we were actually in one
                result = append(result, count)
                count = 0
                inWord = false
            }
            // if we weren't in a word, this space is just noise — do nothing
        } else {
            count++
            inWord = true
        }
    }
    if inWord { // catch the last word too, if the string doesn't end in a space
        result = append(result, count)
    }
    return result
}
// WordLengths("hello   world") → [5 5]  ✓</code></pre>

<div class="callout good"><span class="tag">Τι άλλαξε</span>Το <code>inWord</code> δεν αποθηκεύει δεδομένα — αποθηκεύει <em>κατάσταση</em>. Ελέγχεται ΠΡΙΝ κάνουμε append, ώστε ένα κενό που ακολουθεί άλλο κενό να μην παράγει ψεύτικο μηδενικό.</div>
<div class="callout"><span class="tag">Πότε το αναγνωρίζεις</span>Μάλλον χρειάζεσαι ένα boolean switch όταν, μέσα σε μια loop, θέλεις να αλλάξεις τη συμπεριφορά σου ανάλογα με το αν έχει ήδη συμβεί κάτι — όχι ανάλογα με την τρέχουσα τιμή, αλλά ανάλογα με το <em>ιστορικό</em> μέχρι εκείνο το σημείο.</div>
<h2>Boolean Switch για αρχική κατάσταση</h2>
<p>Άλλο παράδειγμα: Τύπωσε μια λίστα αριθμών χωρισμένους με κόμμα (χρησιμοποιώντας: <code>fmt.Print(", ", n)</code>), χωρίς όμως να βάλεις κόμμα πριν από τον πρώτο:</p>

<pre><code class="lang-go">func PrintCommaSeparated(numbers []int) {
    firstRun := true // boolean switch: is this the very first number?
    for _, num := range numbers {
        if firstRun {
            fmt.Print(num)
            firstRun = false
        } else {
            fmt.Print(", ", num)
        }
    }
}
// PrintCommaSeparated([]int{1,2,3}) → 1, 2, 3   (no leading comma)</code></pre>

<p>Ας δούμε ακριβώς τι κάνει η <code>for</code> σε κάθε πέρασμα, για <code>numbers := []int{32, 64, 128}</code>:</p>

<table class="glossary-table">
<tr><td class="gt-term">index</td><td class="gt-term">num</td><td class="gt-term" style="color: #90EE90;">firstRun</td><td class="gt-def">console (Print)</td></tr>
<tr><td class="gt-term">0</td><td class="gt-term">32</td><td class="gt-term" style="color: #90EE90;">true (→ false)</td><td class="gt-def"><code>32</code></td></tr>
<tr><td class="gt-term">1</td><td class="gt-term">64</td><td class="gt-term" style="color: #90EE90;">false</td><td class="gt-def"><code>, 64</code></td></tr>
<tr><td class="gt-term">2</td><td class="gt-term">128</td><td class="gt-term" style="color: #90EE90;">false</td><td class="gt-def"><code>, 128</code></td></tr>
</table>

<p>Έξοδος: <code>32, 64, 128</code>. Το <code>firstRun</code> "θυμάται" ότι το πρώτο νούμερο έχει ήδη τυπωθεί, ώστε κάθε επόμενο να προσθέτει το κόμμα μπροστά του — μόνο το πρώτο ξεφεύγει από αυτόν τον κανόνα.</p>

<p>Θα μπορούσαμε βέβαια να το γράψουμε πιο απλά, χρησιμοποιώντας το ίδιο το <code>index</code> της λούπας αντί για ξεχωριστό boolean switch:</p>

<pre><code class="lang-go">func PrintCommaSeparated(numbers []int) {
    for index, num := range numbers {
        if index == 0 {
            fmt.Print(num) // the very first element — no comma before it
        } else {
            fmt.Print(", ", num) // every other element gets a leading comma
        }
    }
}</code></pre>

<p>Εδώ το <code>index == 0</code> κάνει ακριβώς την ίδια δουλειά με το <code>firstRun</code>: ξεχωρίζει "είμαστε στο πρώτο στοιχείο" από "είμαστε σε οποιοδήποτε άλλο". Η διαφορά είναι ότι δεν χρειάζεται δική του μεταβλητή — το <code>range</code> μάς δίνει το index έτοιμο, οπότε το ελέγχουμε απευθείας.</p>

<div class="callout"><span class="tag">Γιατί όχι απευθείας index==0</span>Το κάναμε πρώτα με boolean switch επίτηδες, γιατί το <code>index == 0</code> δουλεύει μόνο όταν έχεις πρόσβαση σε index αριθμημένο από το 0 — κάτι που δεν ισχύει πάντα (π.χ. αν διάβαζες τους αριθμούς έναν-έναν από κάπου αλλού, χωρίς slice και χωρίς index). Το boolean switch βασίζεται στο ιστορικό ("έχει ήδη συμβεί;"), όχι στη θέση — γι' αυτό δουλεύει παντού, ενώ το index==0 δουλεύει μόνο όταν έχεις index.</div>
<h2>Boolean Switch: "Είμαι μέσα σε παρένθεση;"</h2>
<p>Ένα πιο ρεαλιστικό παράδειγμα. Μέτρα πόσα γράμματα έχει το <em>πραγματικό</em> κείμενο μιας φράσης, αγνοώντας οτιδήποτε βρίσκεται μέσα σε παρένθεση. (Για ευκολία κάνουμε την παραδοχή ότι η παρένθεση μπορεί απλά να ανοίγει και μετά να κλείνει, χωρίς εμφωλευμένες ή ημιτελείς παρενθέσεις.)</p>

<pre><code class="lang-go">// CountLetters counts every letter — including inside parentheses. Wrong!
func CountLetters(input string) int {
    count := 0
    for _, letter := range input {
        if unicode.IsLetter(letter) {
            count++
        }
    }
    return count
}
// CountLetters("go is fun (ignore this part) really cool") → 31  (counts inside the parens too!)</code></pre>

<p>Με ένα boolean switch που θυμάται αν βρισκόμαστε αυτή τη στιγμή μέσα σε παρένθεση, το περιεχόμενό της αγνοείται εντελώς — και, σε αντίθεση με το προηγούμενο παράδειγμα με το <code>#</code>, εδώ το switch χρειάζεται να ξαναγυρίσει σε <code>false</code> όταν κλείσει η παρένθεση, ώστε το κείμενο που ακολουθεί να ξαναμετρηθεί κανονικά:</p>

<pre><code class="lang-go">func CountLetters(input string) int {
    count := 0
    inParens := false // boolean switch — "am I currently inside parentheses?"
    for _, letter := range input {
        if letter == '(' {
            inParens = true
        }
        if !inParens && unicode.IsLetter(letter) {
            count++
        }
        if letter == ')' {
            inParens = false
        }
    }
    return count
}
// CountLetters("go is fun (ignore this part) really cool") → 17  ✓</code></pre>

<div class="callout"><span class="tag">Γιατί αυτή η σειρά;</span>Η σειρά των if, δεν μπήκε έτσι στην τύχη. Δοκίμασε νοερά να αντιστρέψεις τα δύο <code>if</code> των παρενθέσεων — πρώτα το κλείσιμο <code>')'</code>, και μετά το άνοιγμα <code>'('</code> (αντίστροφα από ότι τώρα) — και τρέξε την ίδια iteration στο μυαλό σου. Θα άλλαζε κάτι;</div>

<h2>Πότε χρησιμοποιείς boolean switch</h2>
<p>Χρειάζεσαι ένα boolean switch όποτε η συμπεριφορά σου μέσα σε μια loop πρέπει να αλλάξει ανάλογα με <em>κάτι που συνέβη νωρίτερα</em> — όχι ανάλογα με την τρέχουσα τιμή από μόνη της. Αν η απάντηση στο "τι κάνω τώρα;" εξαρτάται από το ιστορικό του loop μέχρι εκείνο το σημείο (είμαι ήδη μέσα σε λέξη; βρίσκομαι μέσα σε παρένθεση;), χρειάζεσαι κάτι να το θυμάται — και αυτό είναι πάντα μια μεταβλητή <code>bool</code>, δηλωμένη έξω από τη loop, ελεγχόμενη και ενημερωμένη μέσα σε αυτήν.</p>

<div class="callout"><span class="tag">Γιατί "switch" / διακόπτης</span>Λειτουργεί σαν διακόπτης που μπορεί να αλλάζει "κατάσταση" ξανά και ξανά καθ' όλη τη διάρκεια του iteration (<code>true</code>→<code>false</code>→<code>true</code>...), και κάθε φορά που αλλάζει, αλλάζει μαζί του και η συμπεριφορά του κώδικα μέσα στη loop. Είδαμε και τις δύο περιπτώσεις: μπορεί να γίνει <code>true</code> μία φορά και να μείνει έτσι (σχόλιο), ή να αλλάζει κατεύθυνση συνέχεια (παρένθεση) — ο κώδικας γύρω από το switch είναι αυτός που καθορίζει ποια συμπεριφορά θα έχει, όχι το ίδιο το <code>bool</code>.</div>
`);
        addContent(`<div class="eyebrow">Ενότητα 3 / 8 — Patterns</div>
<h1>Break, Continue, Early Return</h1>
<p>Ένα pattern που μοιάζει πολύ με το boolean switch — μερικές φορές αντί να <em>θυμόμαστε</em> κατάσταση, απλά <strong>σταματάμε</strong> ή <strong>παραλείπουμε</strong> τη στιγμή που δεν χρειάζεται να συνεχίσουμε. Τρεις παραλλαγές της ίδιας ιδέας:</p>

<p><strong style="font-size: 1.2em"><code>break</code></strong> — βρήκα αυτό που χρειαζόμουν, δεν έχει νόημα να συνεχίσω τη loop:</p>

<pre><code class="lang-go">func Contains(numbers []int, target int) bool {
    found := false
    for _, n := range numbers {
        if n == target {
            found = true
            break // no reason to keep scanning — we already have the answer
        }
    }
    return found
}</code></pre>

<p><strong style="font-size: 1.2em"><code>continue</code></strong> — αυτό το πέρασμα της loop δεν με ενδιαφέρει, πάμε κατευθείαν στο επόμενο, χωρίς να τρέξει ο υπόλοιπος κώδικας του σώματος:</p>

<pre><code class="lang-go">func PrintCommaSeparatedV2(numbers []int) {
    firstRun := true
    for _, n := range numbers {
        if firstRun {
            firstRun = false
            fmt.Print(n)
            continue // skip the comma-printing below, just for this one iteration
        }
        fmt.Print(", ", n)
    }
}</code></pre>

<p>Το <code>continue</code> "παρακάμπτει" τον κώδικα που ακολουθεί, ώστε να τρέξει μόνο όταν πραγματικά χρειάζεται.</p>

<p><strong style="font-size: 1.2em"><code>early return</code></strong> — τερματίζει όλη τη function αμέσως, όχι μόνο ένα πέρασμα της loop. Π.χ. μια function που μετράει πόσα <code>e</code> υπάρχουν σε ένα string:</p>

<pre><code class="lang-go">func CountE(input string) int {
    if len(input) == 0 {
        return 0 // empty input can never contain an 'e' — no point even entering the loop
    }
    var count int
    for _, letter := range input {
        if letter == 'e' {
            count++
        }
    }
    return count
}</code></pre>

<p>Το <code>if len(input) == 0 { return 0 }</code> εδώ δεν είναι απλά "προαιρετική βελτιστοποίηση" — δηλώνει ρητά μια περίπτωση που ξέρουμε την απάντηση εκ των προτέρων, χωρίς να χρειάζεται καν να μπούμε στη λούπα.</p>


<div class="callout good"><span class="tag">Good practice</span>Είναι πάντα καλή ιδέα να χρησιμοποιείς break, continue και early return για να "ξεφορτώνεσαι" περιπτώσεις, αντί για <code>if</code> μέσα σε <code>if</code> μέσα σε <code>if</code> — τα nested if δυσκολεύουν πολύ την ανάγνωση του κώδικα. Ο επίσημος <a href="https://go.dev/wiki/CodeReviewComments#indent-error-flow" target="_blank" rel="noopener">Go Code Review Comments</a> οδηγός προτείνει ρητά αυτό ακριβώς: κράτα το "happy path" της function χωρίς indentation — χειρίσου τα error/edge cases πρώτα με early return/continue, ώστε ο κύριος κώδικας να μένει επίπεδος αντί να βαθαίνει σε κάθε νέα συνθήκη.</div>
<pre><code class="lang-go">// Chaos: nested ifs, hard to follow

        if n != 0 {
            if n > 0 {
                if n < 100 {
                    fmt.Println(n)
                } else {
                    fmt.Println("rejected: too big")
                }
            } else {
                fmt.Println("rejected: negative")
            }
        } else {
            fmt.Println("rejected: zero")
        }
    }
}

// Organized: early exits, flat and easy to read
func PrintValid(numbers []int) {
    for _, n := range numbers {
        if n == 0 {
            fmt.Println("rejected: zero")
            continue
        }
        if n < 0 {
            fmt.Println("rejected: negative")
            continue
        }
        if n >= 100 {
            fmt.Println("rejected: too big")
            continue
        }
        fmt.Println(n)
    }
}</code></pre>

<h1>Sentinel Value</h1>
<p>Μερικές φορές μια function πρέπει να επιστρέψει ΕΝΑ πράγμα (π.χ. έναν <code>int</code>), αλλά χρειάζεται και έναν τρόπο να πει "κάτι πήγε στραβά" — μια ειδική περίπτωση διαφορετική από κάθε κανονική τιμή. Λύση: επιστρέφουμε μια ειδική, προσυμφωνημένη τιμή που ΔΕΝ θα μπορούσε ποτέ να είναι πραγματικό αποτέλεσμα. Αυτή η ειδική τιμή λέγεται <strong>sentinel value</strong>.</p>

<p>Πρόβλημα: άθροισε τους αριθμούς μέσα σε ένα string, χωρισμένους με κενό — π.χ. <code>"3 15 7"</code> → <code>25</code>. Δεν έχουμε δει ακόμα το πακέτο <code>strconv</code> της standard library που κάνει ακριβώς αυτή τη μετατροπή string→int, οπότε θα γράψουμε τη δική μας απλή βοηθητική function, <code>Atoi</code> — και, για τους σκοπούς αυτού του παραδείγματος, θα υποθέσουμε ότι δεν εμφανίζονται αρνητικοί αριθμοί:</p>

<pre><code class="lang-go">// Atoi converts a string of digits to an int.
// Assumes no negative numbers and no leading/trailing spaces in "s".
func Atoi(s string) int {
    var result int
    for _, letter := range s {
        digit := int(letter - '0') // '0'-'9' are consecutive in ASCII, so this maps '7' → 7
        result = result*10 + digit
    }
    return result
}

func SumNumbers(input string) int {
    var sum int
    numStr := ""
    for _, letter := range input {
        if letter == ' ' {
            sum += Atoi(numStr)
            numStr = ""
        } else {
            numStr += string(letter)
        }
    }
    sum += Atoi(numStr) // don't forget the last number
    return sum
}
// SumNumbers("3 15 7") → 25</code></pre>

<p>Τι γίνεται όμως αν κάπου στη φράση υπάρχει ένα γράμμα αντί για αριθμό — π.χ. <code>"3 x 7"</code>; Το <code>Atoi("x")</code> θα υπολογίσει κάποιο παράλογο νούμερο από το ASCII του <code>'x'</code>, χωρίς κανένα σήμα ότι κάτι πήγε στραβά. Χρειαζόμαστε τρόπο να το ανιχνεύσουμε <em>και</em> να ενημερώσουμε τον καλούντα.</p>

<pre><code class="lang-go">func SumNumbers(input string) int {
    var sum int
    numStr := ""
    for _, letter := range input {
        if letter == ' ' {
            sum += Atoi(numStr)
            numStr = ""
        } else if letter >= '0' && letter <= '9' {
            numStr += string(letter)
        } else {
            return -1 // sentinel value: "something went wrong, this isn't a real sum"
        }
    }
    sum += Atoi(numStr)
    return sum
}</code></pre>

<p>Αν βρούμε γράμμα στη φράση αντί για αριθμό, έστω και σε ένα σημείο, κάνουμε early return το <strong>-1</strong> — και έχουμε κάνει μόνοι μας, σιωπηρά, την παραδοχή ότι το -1 σημαίνει "σφάλμα".</p>

<div class="callout"><span class="tag">Προσοχή</span>Αν όμως η άσκηση επέτρεπε <em>αρνητικούς</em> αριθμούς μέσα στη φράση (π.χ. <code>"3 -5 7"</code>), το -1 δεν θα μπορούσε πια να είναι sentinel value — θα μπορούσε να είναι και πραγματικό, έγκυρο αποτέλεσμα του αθροίσματος.</div>

<p>Γενικότερα: σαν sentinel value βάζουμε μόνο τιμές που ξέρουμε με σιγουριά ότι δεν μπορούν να εμφανιστούν ως κανονικό αποτέλεσμα. Υπάρχουν όμως πολλές περιπτώσεις όπου αυτό απλά δεν γίνεται — δεν υπάρχει "ασφαλής" ειδική τιμή. Το sentinel value ως τεχνική έρχεται ιστορικά από γλώσσες που δεν μπορούσαν να επιστρέψουν πολλαπλές τιμές από μία function. Στη Go, δεν έχουμε αυτόν τον περιορισμό — μπορούμε απλά:</p>

<pre><code class="lang-go">func main() {
    total, ok := SumNumbers("3 15 7")
    fmt.Println(total, ok) // 25 true

    total, ok = SumNumbers("3 x 7")
    fmt.Println(total, ok) // 0 false
}
  
// ok reports whether the input was successfully parsed as a valid sum.
func SumNumbers(input string) (sum int, ok bool) {
    numStr := ""
    for _, letter := range input {
        if letter == ' ' {
            sum += Atoi(numStr)
            numStr = ""
        } else if letter >= '0' && letter <= '9' {
            numStr += string(letter)
        } else {
            return 0, false // no need to pick a "fake" number — just say it failed
        }
    }
    sum += Atoi(numStr)
    return sum, true
}</code></pre>

<div class="callout good"><span class="tag">Τι άλλαξε</span>Αντί να "κρύβουμε" το σφάλμα μέσα στην ίδια τιμή που θα μπορούσε να είναι και σωστό αποτέλεσμα, το δηλώνουμε ρητά με ένα δεύτερο <code>bool</code>. Δεν χρειάζεται πια να μαντέψουμε ποια τιμή είναι "ασφαλής" ως sentinel — λειτουργεί ακόμα κι όταν <em>κάθε</em> δυνατή τιμή int θα μπορούσε να είναι έγκυρο αποτέλεσμα.</div>

<h1>Η αξία των patterns</h1>
<p>Δεν χρειάζεται να απομνημονεύσεις τα παρακάτω patterns. Όσα περισσότερα patterns γνωρίζεις, τόσες περισσότερες ιδέες θα έχεις διαθέσιμες όταν σκέφτεσαι πώς να λύσεις ένα πρόβλημα — είτε πρόκειται για ένα εντελώς άσχετο πρόβλημα που απλά «μοιάζει» με κάτι που έχεις ξαναδεί, είτε για ένα πιο σύνθετο πρόβλημα που χρειάζεται να συνδυάσεις δύο ή περισσότερα patterns μαζί. Οπότε απλά κατανόησε πώς δουλεύουν.</p>

<h1>Extremum: Εύρεση Μεγίστου/Ελαχίστου</h1>
<p>Ένα από τα πιο συχνά ερωτήματα πάνω σε δεδομένα: ποιο είναι το μεγαλύτερο (ή μικρότερο) στοιχείο;</p>

<pre><code class="lang-go">// looks reasonable... but is it?
func Max(numbers []int) int {
    var max int
    for _, n := range numbers {
        if n > max {
            max = n
        }
    }
    return max
}
</code></pre>

<p>Όλα φαίνονται να δουλεύουν σωστά. Αν βρεις μεγαλύτερο αριθμό από το <code>max</code>, αντικατέστησέ το — επομένως, αφού θα συγκρίνω όλους τους αριθμούς, στο τέλος θα καταλήξω με τον μεγαλύτερο. Για θετικούς αριθμούς όλα δουλεύουν σωστά. Το bug κρύβεται στην αρχικοποίηση της μεταβλητής μας!</p>

<p>Δοκίμασέ το νοερά με τους αριθμούς <code>{-8, -3, -20}</code>. Το σωστό μέγιστο είναι <code>-3</code> — αλλά η function επιστρέφει <code>0</code>, αφού κανένα στοιχείο δεν ξεπερνάει ποτέ την αρχική τιμή <code>0</code>. Το <code>0</code> "κρύφτηκε" σαν λανθασμένη απάντηση, χωρίς κανένα ορατό σφάλμα.</p>

<p>Η λύση: αρχικοποίησε τη μεταβλητή με ένα <em>πραγματικό</em> στοιχείο του slice — το πρώτο — αντί για μια αυθαίρετη τιμή σαν το 0:</p>
<pre><code class="lang-go">func Max(numbers []int) int {
    max := numbers[0] // start from a real element, not an arbitrary guess
    for _, n := range numbers[1:] { // already used index 0 above, skip it
        if n > max {
            max = n
        }
    }
    return max
}
// Max([]int{-8, -3, -20}) → -3   ✓</code></pre>

<div class="callout"><span class="tag">Προσοχή</span>Αυτή η εκδοχή κάνει panic αν το slice είναι κενό — το <code>numbers[0]</code> δεν υπάρχει. Πάντα να ελέγχεις <code>len(numbers) == 0</code> πρώτα, αν υπάρχει έστω και μικρή πιθανότητα κενού slice.</div>

<p>Ας πούμε τώρα, πώς το πρόβλημα ήταν βρες τον μεγαλύτερο <strong>άρτιο</strong> αριθμό ενός slice. Αν δοκίμαζες να «σπείρεις» τη μεταβλητή σου με το πρώτο στοιχείο του slice, θα είχες πρόβλημα αν αυτό το πρώτο στοιχείο ήταν μονός — δεν είναι καν υποψήφια απάντηση, οπότε αν τελικά δεν υπάρχει κανένας άρτιος στο slice, θα κατέληγες να επιστρέφεις έναν μονό αριθμό σαν να ήταν σωστό αποτέλεσμα, χωρίς κανένα σήμα ότι κάτι πήγε στραβά.</p>

<p>Η εναλλακτική λύση εδώ: αντί για κάποιο στοιχείο του slice, ξεκίνα από τη <strong>μικρότερη δυνατή τιμή</strong> που θα μπορούσε ποτέ να υπάρξει — αυτό είναι το <strong>extremum pattern</strong>. Η Go δίνει έτοιμη μια τέτοια τιμή στο πακέτο <code>math</code>:</p>

<pre><code class="lang-go">import "math"

// MaxEven returns the largest even number in the slice.
// If no even number exists, it returns math.MinInt — impossible as a real answer.
func MaxEven(numbers []int) int {
    best := math.MinInt // smallest possible value — a safe starting point
    for _, n := range numbers {
        if n%2 == 0 && n > best {
            best = n
        }
    }
    return best
}
// MaxEven([]int{7, 3, 12, 5, 8, 11}) → 12
// MaxEven([]int{7, 3, 9, 5, 11})     → math.MinInt  (no even numbers at all)</code></pre>

<div class="callout good"><span class="tag">Η λεπτομέρεια που μετράει</span>Και οι δύο προσεγγίσεις δουλεύουν όταν βρεθεί έστω ένας άρτιος. Η διαφορά φαίνεται στην αποτυχημένη περίπτωση: με το <code>numbers[0]</code> trick, αν δεν υπάρχει κανένας άρτιος, θα κατέληγες να επιστρέφεις έναν μονό αριθμό σαν να ήταν έγκυρη απάντηση — τίποτα δεν σου λέει ότι κάτι πήγε στραβά. Με το <code>math.MinInt</code>, το ίδιο το αποτέλεσμα σου το λέει: αν το τελικό <code>best</code> ισούται με <code>math.MinInt</code>, ξέρεις με σιγουριά ότι δεν βρέθηκε κανένας άρτιος — μπορείς να το ελέγξεις ρητά με <code>if best == math.MinInt</code>, αντί να το ανακαλύψεις αργότερα σαν bug.</div>

<p>Στην πραγματικότητα, το extremum pattern από μόνο του δεν έχει ιδιαίτερο ενδιαφέρον — υπάρχουν αρκετές καλύτερες εναλλακτικές, ανάλογα με το πρόβλημα. Το παρουσιάσαμε εδώ κυρίως για να μπεις στη διαδικασία να σκέφτεσαι πόσο σημαντικό ρόλο παίζει η αρχικοποίηση μιας μεταβλητής — και, ένα βήμα παραπέρα, ότι η καλύτερη λύση συχνά δεν είναι ούτε το <code>numbers[0]</code> ούτε το <code>math.MinInt</code>, αλλά ένα <strong>τυχαίο στοιχείο από το ίδιο το δείγμα</strong> σου.</p>

<br>
<h1>Παρακολούθηση Προηγούμενης Τιμής</h1>
<p>Πολλά προβλήματα χρειάζονται σύγκριση <em>διαδοχικών</em> στοιχείων — "είναι το τρέχον μεγαλύτερο από το προηγούμενο;" Το <code>range</code> από μόνο του δεν σου δίνει το προηγούμενο στοιχείο· χρειάζεσαι μια ξεχωριστή μεταβλητή που το "κουβαλάει" μαζί σου.</p>

<p>Πρόβλημα: έχεις τις τιμές μιας μετοχής ανά ημέρα. Βρες το μήκος της μεγαλύτερης <em>συνεχόμενης ανοδικής πορείας</em> — πόσες ημέρες στη σειρά η τιμή ανέβαινε σε σχέση με την προηγούμενη:</p>

<pre><code class="lang-go">prices := []int{3, 5, 8, 4, 9, 12, 15, 2}</code></pre>

<pre><code class="lang-go">func LongestUpstreak(prices []int) int {
    if len(prices) == 0 {
        return 0
    }

    best := 1
    current := 1
    prev := prices[0] // seed with the first value before the loop starts

    for _, p := range prices[1:] {
        if p > prev {
            current++ // still climbing
        } else {
            current = 1 // streak broken, restart counting from this day
        }
        if current > best {
            best = current
        }
        prev = p // this iteration's value becomes "previous" for the next one
    }
    return best
}
// LongestUpstreak(prices) → 4</code></pre>

<p>Ας το τρέξουμε με πινακάκι για κάθε iteration:</p>

<table class="glossary-table">
<tr><td class="gt-term">τιμή</td><td class="gt-term">prev</td><td class="gt-def">current / best</td></tr>
<tr><td class="gt-term">3</td><td class="gt-term">—</td><td class="gt-def">current=1, best=1 (αρχική τιμή)</td></tr>
<tr><td class="gt-term">5</td><td class="gt-term">3</td><td class="gt-def">5 &gt; 3 → current=2, best=2</td></tr>
<tr><td class="gt-term">8</td><td class="gt-term">5</td><td class="gt-def">8 &gt; 5 → current=3, best=3</td></tr>
<tr><td class="gt-term">4</td><td class="gt-term">8</td><td class="gt-def">4 &lt; 8 → current=1 (σπάει η πορεία), best=3</td></tr>
<tr><td class="gt-term">9</td><td class="gt-term">4</td><td class="gt-def">9 &gt; 4 → current=2, best=3</td></tr>
<tr><td class="gt-term">12</td><td class="gt-term">9</td><td class="gt-def">12 &gt; 9 → current=3, best=3</td></tr>
<tr><td class="gt-term">15</td><td class="gt-term">12</td><td class="gt-def">15 &gt; 12 → current=4, best=<strong>4</strong></td></tr>
<tr><td class="gt-term">2</td><td class="gt-term">15</td><td class="gt-def">2 &lt; 15 → current=1 (σπάει), best=4</td></tr>
</table>

<p>Αποτέλεσμα: <strong>4</strong> — η πορεία <code>4 → 9 → 12 → 15</code>.</p>

<div class="callout good"><span class="tag">Τι κάνει το prev</span>Το <code>prev</code> "ταξιδεύει" μαζί με τη λούπα: πρώτα χρησιμοποιείται για τη σύγκριση, <em>μετά</em> ενημερώνεται με την τρέχουσα τιμή. Αν η σειρά ήταν ανάποδη — ενημέρωση πρώτα, σύγκριση μετά — κάθε τιμή θα συγκρινόταν με τον εαυτό της, και το <code>p > prev</code> θα ήταν πάντα false.</div>

<p>Θα μπορούσαμε βέβαια να συγκρίνουμε το τρέχον στοιχείο απευθείας με <code>prices[i-1]</code>, αντί να κρατάμε ξεχωριστή μεταβλητή <code>prev</code> — αλλά αυτό χρειάζεται έλεγχο <code>i > 0</code> σε κάθε iteration (αλλιώς <code>prices[-1]</code> δεν υπάρχει → panic). Το <code>prev</code> σαν μεταβλητή είναι συνολικά καλύτερη λύση — είναι ένα πολύ ωραίο pattern που θα χρησιμοποιήσεις αρκετά σε loops. Αποφεύγει εντελώς αυτόν τον έλεγχο, αφού αρχικοποιείται πριν καν ξεκινήσει η λούπα — και δουλεύει το ίδιο, ακόμα κι αν οι τιμές δεν έρχονταν από ένα slice με index, αλλά μία-μία από κάπου αλλού.</p>
<p>Παρατήρησε επίσης το "αόριστο" <code>best := 1</code> — σαν να μην είχαν προηγηθεί όσα είπαμε με αφορμή το extremum pattern παραπάνω. Ας προβληματιστούμε λίγο για την αρχική τιμή που έχουμε βάλει. Δοκίμασέ το νοερά με μια εντελώς φθίνουσα ακολουθία, π.χ. <code>{15, 12, 9, 6, 3}</code>: κάθε μέρα «σπάει» την πορεία, το <code>current</code> ξαναγυρίζει σε 1 συνέχεια. Αφού καμία μέρα δεν ήταν πραγματικά ανοδική, θα περίμενες το τελικό <code>best</code> να είναι 0 ή 1;</p>

<div class="callout"><span class="tag">Πότε το αναγνωρίζεις</span>
Χρειάζεσαι previous value όποτε η ερώτηση του προβλήματος περιέχει τη λέξη <em>"διαδοχικά"</em> ή μια σύγκριση με κάτι που ήρθε πριν: «πόσες φορές ανέβηκε σε σχέση με χθες», «υπάρχουν δύο ίδια στοιχεία δίπλα-δίπλα», «πόσο μεγάλη είναι η μεγαλύτερη σερί». Το σήμα είναι ότι η απάντηση για το τρέχον στοιχείο <strong>δεν μπορεί να δοθεί κοιτάζοντας μόνο αυτό</strong> — χρειάζεται και τον γείτονά του. Το <code>range</code> σου δίνει ένα στοιχείο τη φορά, οπότε το προηγούμενο πρέπει να το κουβαλήσεις εσύ.
</div>

<br>

<h1>Two Pointers</h1>
<p>Αντί για μία μεταβλητή δείκτη (index) που διασχίζει ένα slice, χρησιμοποιούμε <strong>δύο ταυτόχρονα</strong> — συνήθως ξεκινώντας από τις δύο άκρες και κινούμενοι προς το κέντρο. Είναι εξαιρετικά χρήσιμο όταν ψάχνεις σχέσεις ανάμεσα σε στοιχεία, ειδικά σε <strong>ταξινομημένα</strong> δεδομένα.</p>

<h2>Παράδειγμα 1: Palindrome check</h2>
<p>Ένα string είναι palindrome αν διαβάζεται ίδιο και ανάποδα — π.χ. <code>"level"</code>, <code>"radar"</code>. Ο φυσικός τρόπος να το ελέγξεις: βάλε έναν δείκτη στην αρχή, έναν στο τέλος, και σύγκρινε τους χαρακτήρες τους καθώς πλησιάζουν στο κέντρο.</p>

<pre><code class="lang-go">func IsPalindrome(s string) bool {
    left, right := 0, len(s)-1

    for left < right {
        if s[left] != s[right] {
            return false
        }
        left++
        right--
    }
    return true
}</code></pre>

<p>Ας το τρέξουμε νοερά για <code>"level"</code>:</p>

<table class="glossary-table">
<tr><td class="gt-term">left</td><td class="gt-term">right</td><td class="gt-def">σύγκριση</td></tr>
<tr><td class="gt-term">0 (l)</td><td class="gt-term">4 (l)</td><td class="gt-def">l == l → match, left++, right--</td></tr>
<tr><td class="gt-term">1 (e)</td><td class="gt-term">3 (e)</td><td class="gt-def">e == e → match, left++, right--</td></tr>
<tr><td class="gt-term">2 == 2</td><td class="gt-term">—</td><td class="gt-def">left ΔΕΝ είναι πια &lt; right, η λούπα σταματάει → true</td></tr>
</table>

<p>Πρόσεξε ότι το μεσαίο γράμμα <code>v</code> δεν χρειάστηκε καν να συγκριθεί με τον εαυτό του — μόλις <code>left</code> και <code>right</code> συναντηθούν (ή προσπεράσουν ο ένας τον άλλο), κάθε ζευγάρι έχει ήδη ελεγχθεί. Δεν υπάρχει λόγος να συνεχίσει η λούπα.</p>

<div class="callout"><span class="tag">Η γενική ιδέα</span>Two pointers δεν σημαίνει μόνο «ξεκίνα από τις άκρες». Είναι γενικότερα χρήσιμο να έχεις <strong>δύο ξεχωριστές μεταβλητές index</strong> μέσα στην ίδια λούπα — είτε κινούνται η μία προς την άλλη (όπως εδώ), είτε κινούνται προς την ίδια κατεύθυνση αλλά ανεξάρτητα, με διαφορετική «ταχύτητα» ή διαφορετικό ρόλο η καθεμία. Το κοινό σημείο σε όλες τις παραλλαγές: μία μεταβλητή index δεν αρκεί, χρειάζεσαι δύο ξεχωριστές «θέσεις» μέσα στα ίδια δεδομένα ταυτόχρονα.</div>

<br>

<h1>Sliding Window</h1>
<p>Πρόβλημα: στο ίδιο slice τιμών, βρες το <strong>μέγιστο άθροισμα οποιωνδήποτε 3 διαδοχικών ημερών</strong> — δηλαδή το καλύτερο δυνατό "παράθυρο" τριών τιμών στη σειρά.</p>

<pre><code class="lang-go">prices := []int{3, 5, 8, 4, 9, 12, 15, 2}</code></pre>

<p>Η πρώτη, φυσική σκέψη: για κάθε πιθανή θέση παραθύρου, υπολόγισε το άθροισμα από την αρχή:</p>

<pre><code class="lang-go">// Slow: recomputes the full sum for every window position
func MaxWindowSum(prices []int, k int) int {
    best := 0
    for start := 0; start+k <= len(prices); start++ {
        sum := 0
        for i := start; i < start+k; i++ { // recomputes from scratch every time
            sum += prices[i]
        }
        if sum > best {
            best = sum
        }
    }
    return best
}
// MaxWindowSum(prices, 3) → 36   (the window [9, 12, 15])</code></pre>

<p>Δουλεύει σωστά — το πρόβλημα είναι ότι <strong>δεν είναι καθόλου αποδοτικός</strong>. Το παράθυρο <code>[3,5,8]</code> και το επόμενο <code>[5,8,4]</code> μοιράζονται δύο κοινά στοιχεία (<code>5</code> και <code>8</code>) — αλλά ο κώδικας τα ξαναπροσθέτει από το μηδέν σε κάθε νέα θέση, σαν να μην τα είχε ξαναδεί.</p>

<h2>Με sliding window: πρόσθεσε δεξιά, αφαίρεσε αριστερά</h2>
<pre><code class="lang-go">func MaxWindowSum(prices []int, k int) int {
    windowSum := 0
    for i := 0; i < k; i++ { // build the very first window, once
        windowSum += prices[i]
    }
    best := windowSum

    for i := k; i < len(prices); i++ {
        windowSum += prices[i]   // add the element entering on the right
        windowSum -= prices[i-k] // remove the element leaving on the left
        if windowSum > best {
            best = windowSum
        }
    }
    return best
}
// MaxWindowSum(prices, 3) → 36   ✓ (same answer, far less repeated work)</code></pre>

<div class="callout good"><span class="tag">Τι άλλαξε</span>Αντί να ξαναϋπολογίζουμε ολόκληρο το άθροισμα σε κάθε θέση, "σέρνουμε" το παράθυρο κατά μία θέση: προσθέτουμε το ένα νέο στοιχείο που μπαίνει δεξιά, αφαιρούμε το ένα στοιχείο που φεύγει αριστερά. Κάθε μετακίνηση του παραθύρου γίνεται με 2 πράξεις αντί να ξαναδιασχίζουμε ολόκληρο το <code>k</code> από την αρχή.</div>

<h2>Πότε μας χρειάζεται</h2>
<p>Κάθε φορά που το πρόβλημα ζητάει κάτι πάνω σε <em>συνεχόμενο</em> κομμάτι δεδομένων σταθερού μεγέθους — "άθροισμα k διαδοχικών", "μέση τιμή των τελευταίων k ημερών" — και παρατηρείς ότι διαδοχικά παράθυρα μοιράζονται τα περισσότερα στοιχεία τους, το sliding window γλιτώνει ακριβώς αυτή την επαναλαμβανόμενη δουλειά.</p>

<div class="callout"><span class="tag">Θα το ξαναδούμε</span>Υπάρχει και μια διαφορετική μορφή sliding window: αντί για ήδη υπάρχον slice με γνωστό index (όπως εδώ), τα δεδομένα έρχονται <em>streaming</em> — ένα-ένα, χωρίς να ξέρεις εκ των προτέρων πόσα θα έρθουν. Εκεί χρειάζεσαι να θυμάσαι τα k πιο πρόσφατα στοιχεία κάπου, ώστε να ξέρεις ποιο να αφαιρέσεις όταν έρθει νέο — και αυτό ταιριάζει φυσικά με τη δομή <strong>Queue</strong> που θα δούμε στην Ενότητα 4. Θα το ξαναδούμε τότε.</div>

<h1>Variable-Size Sliding Window</h1>
<p>Το sliding window που είδαμε παραπάνω είχε σταθερό μέγεθος — πάντα ακριβώς <code>k</code> στοιχεία. Υπάρχει όμως και μια δεύτερη, εξίσου συχνή μορφή: το window <strong>μεγαλώνει και μικραίνει</strong> δυναμικά, ανάλογα με μια συνθήκη — δεν ξέρεις εκ των προτέρων πόσο μεγάλο θα είναι.</p>

<p>Πρόβλημα: στο ίδιο slice τιμών, βρες το <strong>μεγαλύτερο συνεχόμενο διάστημα ημερών</strong> του οποίου το άθροισμα δεν ξεπερνάει ένα όριο <code>limit</code>:</p>

<p>Θα συνδιάσουμε 2 μοτίβα. Το sliding window και το two pointers. Το window που ακολουθεί δεν έχει σταθερό μέγεθος — <strong>μεγαλώνει και μικραίνει</strong> δυναμικά, ανάλογα με μια συνθήκη, με δύο δείκτες <code>left</code> και <code>right</code> να δουλεύουν μαζί, ο καθένας με διαφορετικό ρόλο. Δεν ξέρεις εκ των προτέρων πόσο μεγάλο θα είναι το τελικό window.</p>
<pre><code class="lang-go">prices := []int{3, 5, 8, 4, 12, 9, 4, 3, 2, 1, 8, 2, 7}
limit := 20</code></pre>

<pre><code class="lang-go">func LongestWindowUnderLimit(prices []int, limit int) []int {
    left := 0        // left edge of the current window
    windowSum := 0    // running sum of everything currently inside the window
    bestLength := 0   // length of the best window found so far
    resultstart := 0        // left edge of the BEST window found so far
    resultend := 0          // right edge of the BEST window found so far

    for right := 0; right < len(prices); right++ {
        windowSum += prices[right] // step 1: always expand the window to the right first

        for windowSum > limit { // this loop will enter only after right has progressed enough to make windowSum &gt; limit
            windowSum -= prices[left] // remove the leftmost element from the sum
            left++                    // move the left edge forward, shrinking the window
        } // repeat shrinking until the window is valid again (sum <= limit)

        length := right - left + 1 // step 3: measure the current, now-valid window
        if length > bestLength {   // step 4: is this the best window we've seen so far?
            bestLength = length
            resultstart = left  // remember WHERE this best window started...
            resultend = right   // ...and where it ended
        }
    }

    return prices[resultstart : resultend+1] // slice out the actual values of the best window found
}</code></pre>


<p>Ας το δούμε οπτικά:</p>

<p>Η σειρά εκτέλεσης μέσα σε κάθε πέρασμα της εξωτερικής λούπας ακολουθεί πάντα τα ίδια τέσσερα βήματα: πρώτα το <code>right</code> προχωράει και «μπάζει» ένα νέο στοιχείο μέσα στο window (το window μπορεί προσωρινά να γίνει άκυρο, με άθροισμα πάνω από το όριο) — μετά, μια εσωτερική λούπα σπρώχνει το <code>left</code> όσο χρειάζεται, «βγάζοντας» στοιχεία από την αριστερή άκρη, μέχρι το window να ξαναγίνει έγκυρο — μετά μετράμε το μήκος του τρέχοντος, έγκυρου πια window — και τέλος, αν αυτό το μήκος είναι το καλύτερο που έχουμε δει μέχρι στιγμής, καταγράφουμε ΠΟΥ ακριβώς βρίσκεται (τα <code>start</code>/<code>end</code>), όχι μόνο πόσο μεγάλο είναι.</p>

</div>
<p>Τελικό αποτέλεσμα: το καλύτερο window βρίσκεται στα <code>start=6, end=11</code> — δηλαδή <code>prices[6:12]</code> — με τιμές <code>[4, 3, 2, 1, 8, 2]</code>, άθροισμα ακριβώς 20, μήκος 6.</p>

<div class="callout good"><span class="tag">Το σχήμα expand-then-shrink</span>Πρόσεξε τη δομή: το <code>right</code> ΠΑΝΤΑ επεκτείνεται πρώτα (εξωτερική λούπα). Μετά, μια ΕΣΩΤΕΡΙΚΗ λούπα συρρικνώνει από αριστερά ΟΣΟ χρειάζεται, μέχρι η συνθήκη να ξαναϊσχύσει. Αυτό το σχήμα είναι σχεδόν πάντα το ίδιο σε κάθε variable sliding window πρόβλημα, όποιο κι αν είναι το ακριβές κριτήριο εγκυρότητας — και το <code>start</code>/<code>end</code> είναι απλά μια δεύτερη «καταγραφή θέσης» πάνω στο ήδη γνωστό extremum pattern, ώστε να θυμόμαστε ΠΟΥ ήταν το καλύτερο, όχι μόνο πόσο μεγάλο.</div>
<br>

<h1>Complement Lookup</h1>
  <p class="lede">Ένα ακόμα pattern για να ψάχνεις σχέσεις ανάμεσα σε στοιχεία ενός slice.</p>

  <h2>Το πρόβλημα</h2>
  <p>Έχεις ένα slice από αριθμούς και έναν στόχο (target sum). Θες να βρεις ζευγάρια στοιχείων των οποίων το άθροισμα ισούται με το target.</p>
  <div class="callout">
    <p><strong>Παράδειγμα:</strong> <code>[2, 7, 11, 15, 4, 5]</code>, target = <code>9</code> → τα ζευγάρια <code>2 + 7</code> και <code>4 + 5</code> ταιριάζουν.</p>
  </div>

  <h2>Η πρώτη, προφανής λύση</h2>
  <p>Για κάθε στοιχείο, σύγκρινέ το με κάθε άλλο στοιχείο που βρίσκεται μετά του. Δύο nested loops.</p>
  <pre><code class="lang-go"><span class="tok-kw">func</span> findPairs(arr []<span class="tok-type">int</span>, targetSum <span class="tok-type">int</span>) [][]<span class="tok-type">int</span> {
    <span class="tok-kw">var</span> pairs [][]<span class="tok-type">int</span>
    <span class="tok-kw">for</span> i := <span class="tok-num">0</span>; i < <span class="tok-func">len</span>(arr); i++ {
        <span class="tok-kw">for</span> j := i + <span class="tok-num">1</span>; j < <span class="tok-func">len</span>(arr); j++ {
            <span class="tok-kw">if</span> arr[i]+arr[j] == targetSum {
                pairs = <span class="tok-func">append</span>(pairs, []<span class="tok-type">int</span>{i, j})
            }
        }
    }
    <span class="tok-kw">return</span> pairs
}</code></pre>

<div class="callout">
    <p>Αυτή η προσέγγιση —δοκίμασε <strong>όλους</strong> τους δυνατούς συνδυασμούς, χωρίς καμία συντόμευση— είναι προσέγγιση <strong>brute force</strong>. Δεν είναι έξυπνη, αλλά είναι πάντα σωστή αφετηρία: λύνει το πρόβλημα με σιγουριά, πριν σκεφτείς αν υπάρχει καλύτερος τρόπος.</p>
    <p>Στη συγκεκριμένη περίπτωση: για <strong>κάθε</strong> στοιχείο του array, τρέχουμε ένα loop πάνω σε (σχεδόν) <strong>όλα</strong> τα υπόλοιπα στοιχεία. Αν το array έχει <code>n</code> στοιχεία, αυτό σημαίνει περίπου <code>n × n = n²</code> συγκρίσεις συνολικά.</p>
    <p>Αυτό εκφράζεται ως πολυπλοκότητα χρόνου <strong>O(n²)</strong>. Στην πράξη: αν το array εισόδου διπλασιάσει το μέγεθός του, ο χρόνος εκτέλεσης δεν διπλασιάζεται — <strong>τετραπλασιάζεται</strong> (ακριβώς επειδή για κάθε νέο στοιχείο τρέχει ολόκληρος ο εσωτερικός βρόχος ξανά). Για μικρά arrays δεν φαίνεται πρόβλημα, αλλά όσο μεγαλώνουν τα δεδομένα, το O(n²) γίνεται γρήγορα ασύμφορο.</p>
  </div>

  <p>Ο διπλός βρόχος υπάρχει επειδή, για κάθε στοιχείο, <strong>ψάχνουμε</strong> ανάμεσα στα υπόλοιπα ποιο ταιριάζει. Αυτό το "ψάξιμο" είναι που κοστίζει.</p>
  <div class="callout good">
    <p>Θα μπορούσαμε να <strong>ξέρουμε αμέσως</strong> αν το ζευγάρι υπάρχει, αντί να το ψάχνουμε κάθε φορά από την αρχή;</p>
  </div>

  <p>Για κάθε στοιχείο <code>x</code>, το ζευγάρι που χρειαζόμαστε είναι πάντα συγκεκριμένο: <code>targetSum - x</code>. Δεν χρειάζεται να "ψάξουμε" γι' αυτό — απλά χρειάζεται να θυμόμαστε <strong>ποιες τιμές έχουμε ήδη δει</strong>.</p>
  <p>Αν κρατάμε τις τιμές που έχουμε ήδη συναντήσει σε μια δομή όπου ο έλεγχος "το έχω ξαναδεί;" γίνεται στιγμιαία (O(1)), τότε δεν χρειάζεται δεύτερο loop καθόλου.</p>

<div class="spoiler" style="max-width:100%; margin:12px 0;">

    </div>

      <p>Υπάρχει ήδη το <code>complement</code> μέσα στο <strong>map</strong>; Αν ναι, βρήκες ζευγάρι.</p>
    </div>

  <pre><code class="lang-go"><span class="tok-com">// ── find pairs in one pass using a map as lookup ──</span>
<span class="tok-kw">func</span> findPairs(arr []<span class="tok-type">int</span>, targetSum <span class="tok-type">int</span>) [][]<span class="tok-type">int</span> {
    <span class="tok-kw">var</span> pairs [][]<span class="tok-type">int</span>
    seen := <span class="tok-func">make</span>(<span class="tok-kw">map</span>[<span class="tok-type">int</span>]<span class="tok-type">int</span>) <span class="tok-com">// value -> index where it was seen</span>
 
    <span class="tok-kw">for</span> i, x := <span class="tok-kw">range</span> arr {
        complement := targetSum - x
        <span class="tok-kw">if</span> j, ok := seen[complement]; ok {
            pairs = <span class="tok-func">append</span>(pairs, []<span class="tok-type">int</span>{j, i})
        }
        seen[x] = i
    }
 
    <span class="tok-kw">return</span> pairs
}</code></pre>
  <div class="callout good">
    <p>Ένα μόνο πέρασμα από το array, χωρίς δεύτερο loop. Κάθε lookup στο map είναι O(1) κατά μέσο όρο — η συνολική πολυπλοκότητα πέφτει από O(n²) σε <strong>O(n)</strong>.</p>
  </div>

<h2>Πότε μας χρειάζεται</h2>
<div class="glossary-strip">
  <div class="gs-pill"><span class="gs-name">"βρες ζευγάρι που..."</span><span class="gs-def">αθροίζει σε συγκεκριμένο target</span></div>
  <div class="gs-pill"><span class="gs-name">"υπάρχουν δύο στοιχεία"</span><span class="gs-def">που ικανοποιούν μια σχέση μεταξύ τους</span></div>
  <div class="gs-pill"><span class="gs-name">nested loop</span><span class="gs-def">πάνω στα ίδια δεδομένα</span></div>
  <div class="gs-pill"><span class="gs-name">χρειάζεσαι lookup</span><span class="gs-def">όχι ξανά loop από την αρχή</span></div>
  <div class="gs-pill"><span class="gs-name">"το έχω ξαναδεί;"</span><span class="gs-def">στιγμιαίος έλεγχος με map, αντί για δεύτερο loop</span></div>
</div>

<p>Το <strong>Complement Lookup</strong> είναι ένα pattern που εκμεταλλεύεται τη δυνατότητα που δίνουν τα maps να κάνεις lookup σε στιγμιαίο χρόνο (O(1)). Αντί να ψάχνεις ενεργά μέσα σε μια δεύτερη λούπα αν υπάρχει το ταίρι ενός στοιχείου, υπολογίζεις εκ των προτέρων <em>ποιο ακριβώς</em> ταίρι χρειάζεσαι (<code>targetSum - x</code>). Μετά, απλά ρωτάς το map αν το έχεις ήδη δει. Η ιδέα «ξέρω τι ψάχνω, άρα το ρωτάω απευθείας αντί να το ψάχνω» είναι αυτό που ρίχνει την πολυπλοκότητα από O(n²) σε O(n).</p>

<div class="callout"><span class="tag">Σκέψου το</span>

</div>

</div>
<br>
<div class="spoiler"><div class="spoiler-lock"><span>Drag to reveal →</span></div>
    <p>Για <strong>τριάδες</strong> ακόμα δουλεύει, με μια μικρή προσαρμογή: για κάθε ζευγάρι στοιχείων <code>(a, b)</code>, ψάχνεις με lookup αν υπάρχει το <code>targetSum - a - b</code>. Αυτό σημαίνει ένα loop για τα ζευγάρια (O(n²)) συν ένα O(1) lookup ανά ζευγάρι — συνολικά O(n²), κάτω από το O(n³) που θα έπαιρνε το brute force με τρία nested loops. Ακόμα βελτίωση, δηλαδή — απλά όχι πια O(n).</p>

</div>
<br>
<div class="spoiler"><div class="spoiler-lock"><span>Drag to reveal → (κώδικας για τριάδες)</span></div>

<span class="tok-kw">func</span> findTriples(arr []<span class="tok-type">int</span>, targetSum <span class="tok-type">int</span>) [][]<span class="tok-type">int</span> {
    <span class="tok-kw">var</span> triples [][]<span class="tok-type">int</span>

    <span class="tok-kw">for</span> i := <span class="tok-num">0</span>; i < <span class="tok-func">len</span>(arr); i++ {

<div class="eyebrow">VSCode Challenge 1/2 — Συνδυαστική Άσκηση</div>
<h1>Το Πρόβλημα του "Δεύτερου Μεγαλύτερου"</h1>
<p class="lede">Χρόνος να συνδυάσεις δύο patterns στην ίδια function.</p>

<h2>Η αποστολή</h2>
<p>Γράψε μια function που δέχεται ένα μη κενό slice από <code>int</code> και επιστρέφει τον <strong>δεύτερο μεγαλύτερο</strong> διαφορετικό αριθμό μέσα του (όχι απλά τον δεύτερο στη σειρά — αν το slice είναι <code>{5, 5, 3}</code>, ο δεύτερος μεγαλύτερος ΔΙΑΦΟΡΕΤΙΚΟΣ αριθμός είναι το 3, όχι το 5). Αν δεν υπάρχει δεύτερος διαφορετικός αριθμός (π.χ. το slice έχει μόνο ένα μοναδικό στοιχείο, όπως <code>{7, 7, 7}</code>), επίστρεψε ένα sentinel value της επιλογής σου.</p>

<div class="spoiler"><div class="spoiler-lock"><span>HINT 1 — Drag to reveal →</span></div>
    <p>Χρειάζεσαι ΔΥΟ μεταβλητές "μέχρι τώρα μέγιστο" — μία για τον απόλυτο μεγαλύτερο, μία για τον δεύτερο μεγαλύτερο. Σκέψου το extremum pattern, αλλά διπλό.</p>
</div>
<br>
<div class="spoiler"><div class="spoiler-lock"><span>HINT 2 — Drag to reveal →</span></div>
    <p>Πρόσεξε τι σημαίνει "διαφορετικός" — αν δεις έναν αριθμό ίσο με το τρέχον μέγιστο, δεν πρέπει να τον θεωρήσεις "δεύτερο μεγαλύτερο". Ένα guard clause (continue) σε αυτή την περίπτωση θα βοηθήσει να κρατήσεις τη λογική καθαρή.</p>
</div>

<h2>Λύση</h2>
<p>Δοκίμασέ το πρώτα μόνος σου. Σύρε παρακάτω μόνο όταν έχεις κολλήσει ή θέλεις να συγκρίνεις.</p>

<div class="spoiler"><div class="spoiler-lock"><span>Drag to reveal →</span></div><pre><code class="lang-go">import "math"

// secondLargest returns the second-largest distinct value in the slice,
// or math.MinInt if no such value exists.
func secondLargest(numbers []int) int {
    largest := math.MinInt
    second := math.MinInt

    for _, n := range numbers {
        if n == largest {
            continue // already counted as the largest, skip duplicates
        }
        if n > largest {
            second = largest // old largest becomes the new second
            largest = n
        } else if n > second {
            second = n
        }
    }
    return second
}</code></pre></div>

<h1>Η Μεγαλύτερη Πτώση από Κορυφή</h1>
<p class="lede">Αυτή τη φορά τρία patterns μαζί — και ένα από αυτά χρησιμοποιείται με τρόπο που δεν έχεις ξαναδεί.</p>

<h2>Η αποστολή</h2>
<p>

<p>

<div class="callout">

<div class="spoiler"><div class="spoiler-lock"><span>HINT 1 — Drag to reveal →</span></div>
    <p>Δεν χρειάζεσαι το τελικό μέγιστο — χρειάζεσαι το μέγιστο <strong>μέχρι εκείνο το σημείο</strong>. Αυτή είναι μια χρήση του extremum pattern που δεν έχεις ξαναδεί: η μεταβλητή δεν είναι η απάντηση, είναι εργαλείο που ενημερώνεται καθώς προχωράς.</p>

<div class="spoiler"><div class="spoiler-lock"><span>HINT 2 — Drag to reveal →</span></div>

</div>

<br>

<h2>Λύση</h2>
<p>Δοκίμασέ το πρώτα μόνος σου. Σύρε παρακάτω μόνο όταν έχεις κολλήσει ή θέλεις να συγκρίνεις.</p>

<div class="spoiler"><div class="spoiler-lock"><span>Drag to reveal →</span></div>
<pre><code class="lang-go">// maxDropFromPeak returns the largest drop from any running peak
// to a later price. Returns 0 if the price never dropped.
func maxDropFromPeak(prices []int) int {
    if len(prices) == 0 {
        return 0 // guard clause: nothing to measure
    }

    peak := prices[0]  // running extremum: highest price seen SO FAR
    biggestDrop := 0   // result variable: the answer we are building

    for _, p := range prices[1:] {
        if p &gt; peak {
            peak = p  // new peak - there is no drop to measure yet
            continue  // skip the rest of this iteration
        }

        drop := peak - p
        if drop &gt; biggestDrop {
            biggestDrop = drop // a second extremum, over the drops
        }
    }
    return biggestDrop
}
// maxDropFromPeak([]int{10, 7, 12, 4, 15, 3}) -&gt; 12
// maxDropFromPeak([]int{3, 20, 1, 25})        -&gt; 19
// maxDropFromPeak([]int{1, 2, 3, 4})          -&gt; 0
</code></pre></div>

    προκύπτουν τα περισσότερα bugs σε τέτοια προβλήματα.
</div>
