<!--
  ZONE01 SLIDE-DECK TEMPLATE. This file is self-contained instruction-wise —
  script.js/style.css are a fixed engine you never need to see or edit.

  Edit only the inline <script> at the bottom of <body>. It's a sequence of
  calls, ending with initSlideDeck() exactly once:

    addContent(html, opts?)
      One slide. HTML classes available: h1 h2 h3 p .lede .callout
      .callout.good .card .grid2 .grid3 <pre><code> (hand-color tokens with
      <span class="tok-kw|tok-type|tok-str|tok-com|tok-num|tok-func">, no
      auto-highlighter exists) .glossary-table/.glossary-strip/.glossary-columns
      (mix all three for variety) .title-slide/.title-badge/.kicker-line
      (title slide only, keep the "ask an AI when stuck" callout as-is).
      Drag-to-reveal spoiler (e.g. hiding a code answer until dragged open):
        <div class="spoiler"><div class="spoiler-lock"><span>Drag to
        reveal →</span></div><pre><code>...</code></pre></div>
      A click/tap does nothing — only an actual drag past ~40% unlocks it.
      opts = { bg: "path/to/image.jpg", overlayAlpha: 0..1 (default 0.5),
      backgroundSize (default "auto"), backgroundRepeat (default "no-repeat"),
      backgroundPosition (default "top left") }
      → optional per-slide background image with a solid readability
      overlay; different slides can use different images or none at all.
      backgroundPosition accepts real CSS values, e.g. "center center",
      "top left", "bottom right", "50% 50%".

    addQuiz(question | [question,...], opts?)
      One or more MC questions on one slide.
      question = { q, options:[4 strings], correct: index, explain }
      opts = { bg, overlayAlpha } — same background option as addContent.
      Rules: options similar length/style; correct-answer slot varies
      across questions; distractors are plausible, never "obviously
      silly"; include at least one distractor ~5 words longer than the
      correct answer somewhere in the deck; one short explain per question.

    addFillBlank(item | [item,...], opts?)
      item = { code (mark blanks with __id__), blanks:[{id,answer}], explain,
               lang? }
      opts = { label, note }
      Auto-adds a "Reveal hint"/"Check" UI — nothing else to wire up. If an
      item has exactly 1 blank, the hint button is disabled automatically
      (shows "[Time to Guess]" instead) since there'd be nothing to guess.
      code gets syntax-colored automatically — defaults to "go" if item.lang
      is omitted; set item.lang to "js" | "html" | "css" (or "go" explicitly)
      to override per item. Only the static code text is colored — the
      __id__ blanks always stay live, editable inputs, untouched by this.

    addMatching(pairs | [set1, set2, ...], opts?)
      pairs = [{term, def}, ...] for ONE set, OR an array of 2-3 such sets
      to stack multiple independent matching games on the same slide.
      opts = { label, note }

  Score: every quiz/fillblank/matching item is scored automatically (100
  correct, 50 fill-blank-with-hint-used, 0 wrong) and shown as a small
  badge next to each slide's "Reset this quiz". To show the aggregate
  result, put <div id="final-score"></div> ANYWHERE in the deck (typically
  the sources/last slide) — it fills itself in automatically.

  Deck structure: title → theory sections (interleave addQuiz() checkpoints
  regularly, not just at the end) → a glossary addContent() may appear
  after ANY section/quiz where it helps (not only once at the very end) →
  one final combined addQuiz() with 2-3 questions → sources/footer slide
  with the #final-score placeholder (keep the "pavgerin/avgerinos8" credit).

  Never solve the actual exercise — theory/tools only. Prose Greek, code
  comments English. Confirm the section list with the user before writing
  full content, unless already confirmed.
-->

<head>
  <!-- Must be the very first thing in <head>, inline (not an external
       file — no time for an extra network round-trip): captures the URL's
       #hash and immediately strips it from the address bar, BEFORE the
       browser gets any chance to attempt its own native scroll-to-fragment.
       That native attempt is guaranteed broken here (the target heading
       doesn't exist until static/script.js builds all the slides later),
       and worse, some browsers RETRY it once the target appears — landing
       on a still-hidden (display:none) element, which produces exactly the
       "scrolled somewhere wrong" symptom, and only intermittently since the
       retry timing itself isn't consistent. Stripping the hash here removes
       every native attempt entirely — see handleHashNavigation() in
       script.js, which reads window.__initialHash (not location.hash,
       that's been cleared) and does the whole thing itself, deterministically,
       once slides actually exist. -->
  <script>
    window.__initialHash = location.hash;
    if (location.hash) {
      history.replaceState(null, "", location.pathname + location.search);
    }
  </script>
  <!-- Separate, deliberately self-contained inline script — no dependency on
       static/script.js's own functions or variables, since the whole point
       is to still work if THAT script is what's broken (a future syntax
       error there fires as a window "error" event too, same as a runtime
       exception during initSlideDeck()). Registered here, before that
       script is even requested, so it's guaranteed to already be listening
       no matter how early things go wrong.

       Concretely, this exists for: a course author edits quiz/fill-blank/
       matching content after a learner has already saved progress against
       the OLD shape (e.g. removes one matching pair — the learner's saved
       progress records answers by INDEX into that pairs array, so a saved
       index that's now out of bounds throws when the exercise tries to
       render it). That renderMatching()-specific case is now guarded
       directly (see script.js), but this is the general backstop for
       "broke some other way nobody anticipated" — shows a plain, honest
       screen instead of the blank page that an uncaught error during
       initSlideDeck()'s single synchronous build pass would otherwise
       leave behind (that pass aborts entirely partway through on any
       uncaught exception, so nothing after that point ever renders). -->
  <script>
    (function () {
      var shown = false;
      window.addEventListener("error", function () {
        if (shown) return;
        // The critical check: only a failure BEFORE the page ever finished
        // its first successful render counts as "broken" here. That flag
        // is set as the very last line of initSlideDeck() in script.js —
        // if we get this far while it's still unset, the deck's one
        // synchronous build pass aborted partway through and never
        // finished, which is the actual blank-page failure mode this
        // exists for. An error AFTER that flag is set means the page
        // already rendered successfully and is visibly working — showing
        // this takeover for something later (e.g. a click handler
        // throwing) would break a page that wasn't actually broken.
        if (window.__pageInitialized) return;
        shown = true;
        showContentChangedFallback();
      });

      function showContentChangedFallback() {
        var overlay = document.createElement("div");
        overlay.style.cssText = "position:fixed;inset:0;z-index:999999;background:#1a1a1a;" +
          "display:flex;flex-direction:column;align-items:center;justify-content:center;" +
          "gap:20px;font-family:-apple-system,'Segoe UI',Arial,sans-serif;color:#e0e0e0;" +
          "text-align:center;padding:24px;";

        var msg = document.createElement("div");
        msg.textContent = "Internal Error";
        msg.style.cssText = "font-size:22px;font-weight:600;letter-spacing:.02em;";
        overlay.appendChild(msg);

        var btn = document.createElement("button");
        btn.textContent = "Reset Progress";
        btn.style.cssText = "font-family:inherit;font-size:15px;padding:10px 22px;" +
          "border-radius:7px;border:1px solid #888;background:transparent;" +
          "color:#ccc;cursor:pointer;";
        btn.addEventListener("click", function () {
          // Self-contained on purpose — mirrors getStoragePrefix()/
          // performHardReset() in script.js exactly, but doesn't call them:
          // if THIS is running, we can't assume anything in that file is
          // actually intact.
          var prefix = "quiz_deck_" + window.location.pathname.replace(/[^a-zA-Z0-9]/g, "_") + "_";
          localStorage.removeItem(prefix + "current_slide");
          localStorage.removeItem(prefix + "answers");
          localStorage.removeItem(prefix + "scores");
          localStorage.removeItem(prefix + "notified_100");
          localStorage.removeItem(prefix + "version");
          window.location.reload();
        });
        overlay.appendChild(btn);

        document.body.appendChild(overlay);
      }
    })();
  </script>

<div class="eyebrow">Ενότητα 1 / 8 — Εισαγωγή</div>
<h1>Γιατί υπάρχει ένα βήμα πριν τον κώδικα</h1>
<p class="lede">Πριν μιλήσουμε για το εργαλείο, χρειάζεται να είναι ξεκάθαρο τι πρόβλημα λύνει. Αν δεν είναι, το design μοιάζει με περιττό ενδιάμεσο βήμα.</p>

<h2>Η προφανής προσέγγιση, και πού σταματάει</h2>
<p>Παίρνεις την εκφώνηση, ανοίγεις τον editor και αρχίζεις να γράφεις. Το layout το αποφασίζεις καθώς γράφεις: ένα container εδώ, λίγο padding εκεί, το κουμπί δεξιά επειδή εκεί έμεινε χώρος. Δουλεύει, μέχρι το σημείο που κάποιος ρωτάει «τι γίνεται όταν η λίστα είναι άδεια;» ή «πώς φαίνεται σε οθόνη 360 pixel;».</p>
<p>Σε αυτό το σημείο η αλλαγή δεν είναι πια μια γραμμή κειμένου. Είναι αλλαγή σε markup, σε στυλ, σε state, και συχνά σε τρία αρχεία ταυτόχρονα. Το ίδιο ερώτημα, απαντημένο σε ένα design tool, κοστίζει δύο λεπτά και ένα σύρσιμο του ποντικιού.</p>

<div class="callout">
  <span class="tag">Το κεντρικό επιχείρημα</span>
  Το design δεν είναι το στάδιο όπου κάτι γίνεται όμορφο. Είναι το στάδιο όπου οι αποφάσεις είναι ακόμα φθηνές. Όσο πιο αργά αλλάζει μια απόφαση, τόσο περισσότερο κοστίζει, και αυτή η καμπύλη είναι απότομη.
</div>

<h2>UI και UX δεν είναι το ίδιο πράγμα</h2>
<p>Οι δύο όροι χρησιμοποιούνται συχνά μαζί, σαν να περιγράφουν την ίδια δουλειά. Δεν την περιγράφουν.</p>

<div class="grid2">
  <div class="card">
    <h3>UI — User Interface</h3>
    <p>Το ορατό και το απτό. Τι χρώμα έχει το κουμπί, πόσο μεγάλο είναι το κείμενο, πού μπαίνει το εικονίδιο, πώς αντιδρά η οθόνη στο πάτημα. Αφορά τη μορφή.</p>
  </div>
  <div class="card">
    <h3>UX — User Experience</h3>
    <p>Η διαδρομή. Πόσα βήματα χρειάζονται για να ολοκληρωθεί μια εργασία, τι βλέπει ο χρήστης όταν κάτι αποτυγχάνει, αν καταλαβαίνει πού βρίσκεται. Αφορά τη ροή.</p>
  </div>
</div>

<p>Μια οθόνη μπορεί να είναι άψογη ως UI και άχρηστη ως UX: όμορφα κουμπιά, σωστές αποστάσεις, και μια διαδικασία εγγραφής επτά βημάτων που κανείς δεν ολοκληρώνει. Το αντίστροφο συμβαίνει επίσης — μια σωστή ροή που φαίνεται τόσο πρόχειρη ώστε ο χρήστης δεν την εμπιστεύεται.</p>

<div class="callout">
  <span class="tag">Προσοχή / Συχνό λάθος</span>
  Το πιο συχνό λάθος του προγραμματιστή που ξεκινάει με design είναι να ανοίξει το εργαλείο και να αρχίσει να διαλέγει χρώματα. Η σειρά είναι αντίστροφη: πρώτα ποιες οθόνες υπάρχουν και πώς συνδέονται, μετά τι έχει η κάθε μία, και τελευταία πώς φαίνεται.
</div>
`);

<div class="eyebrow">Ενότητα 1 / 8 — Εισαγωγή</div>
<h1>Τι είναι το Penpot</h1>
<p class="lede">Ένα design και prototyping tool που τρέχει στον browser, είναι open source, και αποθηκεύει τα αρχεία του σε ανοιχτά πρότυπα του web.</p>

<h2>Τα τέσσερα πράγματα που το ξεχωρίζουν</h2>
<div class="grid2">
  <div class="card">
    <h3>Ανοιχτός κώδικας</h3>
    <p>Ο κώδικας είναι διαθέσιμος στο GitHub. Μπορείς να το τρέξεις στον δικό σου server με Docker, ή να χρησιμοποιήσεις την cloud έκδοση χωρίς να πληρώσεις για τα βασικά.</p>
  </div>
  <div class="card">
    <h3>Βασισμένο σε web standards</h3>
    <p>Τα σχέδια είναι SVG. Τα layouts είναι πραγματικό CSS Flexbox και CSS Grid, όχι μια δική του απομίμηση. Τα design tokens ακολουθούν το πρότυπο του W3C.</p>
  </div>
  <div class="card">
    <h3>Τρέχει στον browser</h3>
    <p>Δεν υπάρχει εγκατάσταση και δεν εξαρτάται από λειτουργικό σύστημα. Linux, Windows και macOS βλέπουν ακριβώς το ίδιο περιβάλλον.</p>
  </div>
  <div class="card">
    <h3>Χωρίς κλείδωμα σε προμηθευτή</h3>
    <p>Επειδή η μορφή αρχείου είναι ανοιχτή, τα σχέδια δεν είναι όμηροι μιας εταιρείας. Αν αύριο αλλάξει η τιμολόγηση, τα αρχεία παραμένουν αναγνώσιμα.</p>
  </div>
</div>

<h2>Πού βρίσκεται σήμερα</h2>
<p>Η ανάπτυξη είναι ενεργή και γρήγορη. Μέσα στο 2026 προστέθηκαν, μεταξύ άλλων, νέα μηχανή rendering με WebGL, MCP server για συνεργασία με AI εργαλεία, typography tokens στο Design sidebar και background blur. Επειδή το εργαλείο αλλάζει συχνά, όποια λεπτομέρεια του interface δεις εδώ και δεν ταιριάζει με αυτό που έχεις μπροστά σου, το help center είναι η πηγή αλήθειας, όχι ο οδηγός.</p>

<div class="callout">
  <span class="tag">Ειλικρινές όριο</span>
  Το Penpot δεν είναι σε κάθε σημείο ισοδύναμο με τα εμπορικά εργαλεία. Το οικοσύστημα plugins είναι πολύ μικρότερο από αυτό του Figma, και σε πολύ μεγάλα αρχεία η απόδοση έχει υπάρξει αδύναμο σημείο — γι αυτό ακριβώς δουλεύουν τη νέα μηχανή WebGL. Για τη δουλειά που θα κάνεις εδώ, τίποτα από τα δύο δεν σε εμποδίζει.
</div>

<h2>Τι σημαίνει «SVG-native» στην πράξη</h2>
<p>Ένα ορθογώνιο με στρογγυλεμένες γωνίες στο Penpot δεν είναι μια ιδιόκτητη δομή που μόνο το Penpot καταλαβαίνει. Είναι ένα SVG element με συγκεκριμένα attributes. Αυτό έχει τρεις συνέπειες που θα δεις παρακάτω στον οδηγό: το export σε SVG είναι ακριβές και όχι μια μετατροπή, το Inspect tab μπορεί να σου δείξει πραγματικό CSS, και ένα αρχείο Penpot διαφέρει με τρόπο που διαβάζεται όταν μπει σε version control.</p>
`);

<div class="eyebrow">Ενότητα 1 / 8 — Εισαγωγή</div>
<h1>Ξενάγηση στο περιβάλλον</h1>
<p class="lede">Δύο επίπεδα: το Dashboard, όπου ζουν τα αρχεία, και το Workspace, όπου γίνεται η δουλειά.</p>

<h2>Dashboard</h2>
<p>Είναι η αρχική οθόνη μετά το login. Εδώ οργανώνεις σε <strong>teams</strong>, μέσα στα teams σε <strong>projects</strong>, και μέσα στα projects σε <strong>files</strong>. Ένα file μπορεί να έχει πολλές <strong>pages</strong>, και κάθε page έχει το δικό της άπειρο canvas.</p>
<p>Στο Dashboard επίσης ανεβάζεις custom fonts, βλέπεις τα shared libraries της ομάδας και έχεις πρόσβαση στα έτοιμα templates. Υπάρχουν κοινοτικά templates για Material Design 3 και για Android UI kit, τα οποία μπορείς να εισάγεις και να τα μελετήσεις σαν έτοιμα παραδείγματα.</p>

<div class="callout good">
  <span class="tag">Πρακτική συμβουλή</span>
  Πριν σχεδιάσεις οτιδήποτε από το μηδέν, κατέβασε ένα template και άνοιξέ το. Το να δεις πώς είναι οργανωμένα τα layers και τα components κάποιου άλλου διδάσκει περισσότερα από πέντε σελίδες θεωρίας.
</div>

<h2>Workspace</h2>
<p>Η οθόνη εργασίας χωρίζεται σε τέσσερις περιοχές:</p>

<table class="glossary-table">
  <tr><td class="gt-term">Toolbar</td><td class="gt-def">Τα εργαλεία δημιουργίας: board, rectangle, ellipse, text, image, path, curve. Το κάθε ένα έχει και shortcut ενός γράμματος.</td></tr>

  <tr><td class="gt-term">Canvas</td><td class="gt-def">Ο άπειρος καμβάς στο κέντρο. Zoom με το scroll και το Ctrl, μετακίνηση με το space πατημένο ή με το μεσαίο κουμπί.</td></tr>
  <tr><td class="gt-term">Δεξί sidebar</td><td class="gt-def">Οι ιδιότητες του επιλεγμένου αντικειμένου. Εδώ αλλάζουν διαστάσεις, χρώματα, layout, εφέ, και εδώ ορίζονται τα interactions του prototype.</td></tr>
</table>

<h2>Τρεις τρόποι να δεις το ίδιο αρχείο</h2>

<div class="grid3">

    <h3>Prototype</h3>

  </div>

</div>

<div class="eyebrow">Ενότητα 2 / 8 — Boards & δομή</div>
<h1>Το board είναι η οθόνη</h1>
<p class="lede">Ο καμβάς είναι άπειρος. Το board είναι το ορθογώνιο που δηλώνει «αυτό εδώ είναι μια οθόνη συσκευής».</p>

<h2>Τι κάνει ένα board και τι δεν κάνει ένα group</h2>
<p>Και τα δύο περιέχουν άλλα αντικείμενα, οπότε η διαφορά δεν είναι προφανής στην αρχή. Είναι όμως ουσιαστική:</p>

<div class="grid2">
  <div class="card">
    <h3>Board</h3>
    <p>Έχει δικό του background, μπορεί να κόβει ό,τι ξεφεύγει από τα όριά του (clip content), είναι στόχος για export, είναι προορισμός για τα interactions του prototype, και μόνο πάνω σε board μπαίνει flex ή grid layout.</p>
  </div>
  <div class="card">
    <h3>Group</h3>
    <p>Μια απλή ομαδοποίηση για να μετακινείς πολλά αντικείμενα μαζί. Δεν έχει background, δεν κόβει τίποτα, δεν εμφανίζεται ως οθόνη στο prototype.</p>
  </div>
</div>

<div class="callout">
  <span class="tag">Προσοχή / Συχνό λάθος</span>
  Ομαδοποιείς τα στοιχεία μιας κάρτας σε group, και μετά απορείς γιατί το κουμπί δεν στοιχίζεται όταν μεγαλώνει το κείμενο. Το group δεν έχει layout. Αν το πράγμα που φτιάχνεις έχει εσωτερική διάταξη, θέλει board.
</div>

<h2>Μεγέθη για κινητά</h2>
<p>Όταν δημιουργείς board, το δεξί sidebar προσφέρει έτοιμα μεγέθη ανά κατηγορία συσκευής. Για Android, το πιο χρήσιμο σημείο εκκίνησης είναι το <strong>360 × 800</strong>. Δεν είναι μια συγκεκριμένη συσκευή, είναι το πλάτος που καλύπτει τη μεγάλη πλειοψηφία των τηλεφώνων όταν μετρηθεί σε ανεξάρτητες μονάδες.</p>

<h2>Γιατί 360 και όχι 1080</h2>
<p>Ένα σύγχρονο τηλέφωνο έχει οθόνη 1080 φυσικών pixel σε πλάτος. Δεν σχεδιάζεις όμως σε 1080, γιατί το Android δεν τοποθετεί σε φυσικά pixel: τοποθετεί σε <strong>dp</strong> (density-independent pixels). Ένα dp ισούται με ένα φυσικό pixel σε οθόνη 160 dpi, και πολλαπλασιάζεται ανάλογα με την πυκνότητα της συσκευής.</p>

<table class="glossary-table">
  <tr><td class="gt-term">mdpi</td><td class="gt-def">×1 — 160 dpi, η βάση του συστήματος</td></tr>
  <tr><td class="gt-term">hdpi</td><td class="gt-def">×1.5 — 240 dpi</td></tr>
  <tr><td class="gt-term">xhdpi</td><td class="gt-def">×2 — 320 dpi</td></tr>
  <tr><td class="gt-term">xxhdpi</td><td class="gt-def">×3 — 480 dpi, η πιο κοινή κατηγορία σήμερα</td></tr>
  <tr><td class="gt-term">xxxhdpi</td><td class="gt-def">×4 — 640 dpi</td></tr>
</table>

<p>Η πρακτική συνέπεια είναι απλή: σχεδιάζεις σε κλίμακα ×1 και θεωρείς ότι ένα pixel στον καμβά είναι ένα dp στη συσκευή. Το ίδιο ισχύει και στο web, όπου η αντίστοιχη μονάδα λέγεται CSS pixel. Την πολλαπλή κλίμακα τη χρειάζεσαι μόνο στο export των εικόνων, και αυτό το βλέπουμε στην ενότητα 7.</p>

<div class="callout good">
  <span class="tag">Το αναγνωρίζεις;</span>
  Αν έχεις γράψει ποτέ CSS με <code>@media (max-width: 600px)</code>, έχεις ήδη δουλέψει σε αυτή τη λογική. Το breakpoint δεν μετράει φυσικά pixel, μετράει CSS pixel. Το dp είναι η ίδια ιδέα με άλλο όνομα.
</div>
`);

<div class="eyebrow">Ενότητα 2 / 8 — Boards & δομή</div>
<h1>Shapes, layers και η πειθαρχία των ονομάτων</h1>

<h2>Τα βασικά αντικείμενα</h2>
<p>Ορθογώνιο, έλλειψη, κείμενο, εικόνα, path και curve. Το path και το curve φτιάχνουν ελεύθερα σχήματα σημείο προς σημείο, όπως σε κάθε διανυσματικό εργαλείο. Οι <strong>boolean operations</strong> — union, difference, intersection, exclude — συνδυάζουν δύο σχήματα σε ένα καινούριο, και είναι ο συνηθισμένος τρόπος να φτιαχτεί ένα εικονίδιο χωρίς να σχεδιαστεί με το χέρι.</p>

<h2>Το panel των layers δεν είναι λίστα, είναι δέντρο</h2>
<p>Η σειρά στο panel καθορίζει και τη σειρά στον άξονα z: ό,τι είναι πιο ψηλά στη λίστα ζωγραφίζεται πάνω από ό,τι είναι πιο χαμηλά. Η ένθεση δείχνει τι περιέχεται μέσα σε τι.</p>

<div class="callout">
  <span class="tag">Προσοχή / Συχνό λάθος</span>
  Ένα αρχείο με είκοσι layers που λέγονται Rectangle, Rectangle copy, Group, Group 2 είναι πρακτικά αδιάβαστο μία εβδομάδα αργότερα, και εντελώς άχρηστο για όποιον άλλον το ανοίξει. Τα ονόματα δεν είναι διακοσμητικά: εμφανίζονται στο Inspect, στα exports και στα components.
</div>

<p>Μια σύμβαση που λειτουργεί: ονόμασε με βάση τον ρόλο, όχι το σχήμα. Όχι <code>Rectangle 4</code> αλλά <code>card-background</code>. Όχι <code>Group 7</code> αλλά <code>product-card</code>. Είναι η ίδια λογική με τα ονόματα μεταβλητών στον κώδικα, και έχει τα ίδια οφέλη.</p>

<h2>Constraints: τι γίνεται όταν αλλάξει το μέγεθος του γονέα</h2>
<p>Κάθε αντικείμενο μέσα σε board έχει constraints — έναν κανόνα για το τι συμβαίνει όταν το board αλλάξει διαστάσεις. Οι επιλογές είναι, οριζόντια και κάθετα ξεχωριστά: <code>left</code>, <code>right</code>, <code>left and right</code>, <code>center</code>, <code>scale</code>.</p>

<h2>Η προφανής προσέγγιση, και το σημείο που σπάει</h2>
<p>Σχεδιάζεις μια οθόνη 360 πλάτος. Βάζεις ένα κουμπί πλάτους 320 στη θέση x = 20, ώστε να έχει 20 pixel περιθώριο δεξιά και αριστερά. Φαίνεται σωστό.</p>
<p>Αντιγράφεις το board και το κάνεις 412 πλάτος, για να δεις πώς φαίνεται σε μεγαλύτερο τηλέφωνο. Με το προεπιλεγμένο constraint <code>left</code>, το κουμπί μένει στο x = 20 με πλάτος 320 και το δεξί περιθώριο γίνεται 72. Το σχέδιο δεν είναι πια συμμετρικό, και το λάθος είναι σιωπηλό: τίποτα δεν σου το επισημαίνει.</p>
<p>Με constraint <code>left and right</code>, το κουμπί κρατάει και τις δύο αποστάσεις και τεντώνεται σε πλάτος 372. Αυτό είναι το ζητούμενο.</p>

<div class="callout good">
  <span class="tag">Πότε το χρησιμοποιείς</span>
  Τα constraints είναι για αντικείμενα που τοποθετούνται ελεύθερα, με απόλυτες συντεταγμένες. Μόλις βάλεις flex ή grid layout στον γονέα, οι θέσεις υπολογίζονται από το layout και τα constraints παύουν να ισχύουν για τα παιδιά του. Η ενότητα 4 εξηγεί γιατί το layout είναι σχεδόν πάντα η καλύτερη επιλογή.
</div>
`);

<div class="eyebrow">Ενότητα 3 / 8 — Χρώμα, τυπογραφία, spacing</div>
<h1>Τρεις αποφάσεις που κρατούν όλο το σχέδιο όρθιο</h1>
<p class="lede">Το μεγαλύτερο μέρος του «φαίνεται προσεγμένο» δεν είναι ταλέντο. Είναι το ότι οι τιμές προέρχονται από ένα μικρό, κλειστό σύνολο.</p>

<h2>Η προφανής προσέγγιση, και το αποτέλεσμά της</h2>
<p>Σχεδιάζεις την πρώτη οθόνη και διαλέγεις ένα γκρι για το δευτερεύον κείμενο από τον color picker. Την επόμενη μέρα, σε άλλη οθόνη, διαλέγεις πάλι ένα γκρι — λίγο διαφορετικό, γιατί το επέλεξες με το μάτι. Μετά από πέντε οθόνες έχεις εννιά αποχρώσεις του γκρι, τέσσερα μεγέθη κειμένου που διαφέρουν κατά ένα pixel, και αποστάσεις 12, 13, 15 και 16.</p>
<p>Κανένα από αυτά δεν είναι ορατό λάθος όταν κοιτάς μία οθόνη. Είναι όμως ορατό ως συνολική εντύπωση προχειρότητας, και είναι πραγματικό πρόβλημα για όποιον γράψει τον κώδικα: εννιά γκρι σημαίνουν εννιά σταθερές που κανείς δεν ξέρει πότε να χρησιμοποιήσει.</p>

<div class="callout">
  <span class="tag">Ο κανόνας</span>
  Περιόρισε τις επιλογές πριν αρχίσεις να σχεδιάζεις. Λίγα χρώματα, λίγα μεγέθη κειμένου, λίγες αποστάσεις. Κάθε φορά που μπαίνεις στον πειρασμό να προσθέσεις μια δέκατη απόχρωση, το πραγματικό ερώτημα είναι ποια από τις εννιά ήθελες.
</div>

<h2>Χρώμα: contrast πριν από αισθητική</h2>
<p>Ένα χρώμα κειμένου δεν κρίνεται μόνο του, κρίνεται σε σχέση με το φόντο πάνω στο οποίο κάθεται. Ο λόγος αντίθεσης (contrast ratio) εκφράζεται ως αριθμός από 1:1 έως 21:1, και οι οδηγίες WCAG δίνουν συγκεκριμένα κατώφλια:</p>

<table class="glossary-table">
  <tr><td class="gt-term">4.5:1</td><td class="gt-def">Ελάχιστο για κανονικό κείμενο (επίπεδο AA)</td></tr>
  <tr><td class="gt-term">3:1</td><td class="gt-def">Ελάχιστο για μεγάλο κείμενο, καθώς και για εικονίδια και περιγράμματα στοιχείων ελέγχου</td></tr>
  <tr><td class="gt-term">7:1</td><td class="gt-def">Το αυστηρότερο επίπεδο AAA, για κανονικό κείμενο</td></tr>
</table>

<p>Το πιο συνηθισμένο θύμα αυτού του κανόνα είναι το ανοιχτό γκρι κείμενο πάνω σε λευκό, που φαίνεται κομψό στην οθόνη του σχεδιαστή και γίνεται αδιάβαστο στον ήλιο ή σε φθηνό panel.</p>

<div class="callout">
  <span class="tag">Προσοχή / Συχνό λάθος</span>
  Χρώμα ως μοναδικός φορέας πληροφορίας. Αν το μόνο που ξεχωρίζει ένα πεδίο με λάθος είναι το κόκκινο περίγραμμα, τότε για έναν χρήστη με αχρωματοψία δεν ξεχωρίζει τίποτα. Πρόσθεσε πάντα και δεύτερο σήμα: εικονίδιο, κείμενο, ή αλλαγή στο σχήμα.
</div>

<h2>Τι αποθηκεύεις στο Penpot</h2>
<p>Στο panel Assets αποθηκεύεις χρώματα με όνομα. Από εκεί και πέρα, το χρώμα δεν επαναλαμβάνεται ως τιμή σε είκοσι σημεία: εφαρμόζεται με ένα κλικ, και αν αλλάξει, αλλάζει παντού. Η ενότητα 5 πάει αυτή την ιδέα ένα βήμα παραπέρα με τα design tokens.</p>
`);

<div class="eyebrow">Ενότητα 3 / 8 — Χρώμα, τυπογραφία, spacing</div>
<h1>Τυπογραφία και αποστάσεις</h1>

<h2>Type scale</h2>
<p>Αντί να διαλέγεις μέγεθος κάθε φορά, ορίζεις μια κλίμακα και χρησιμοποιείς μόνο τις βαθμίδες της. Μια κλίμακα που δουλεύει για οθόνη κινητού:</p>

<table class="glossary-table">
  <tr><td class="gt-term">32 / 28</td><td class="gt-def">Τίτλος οθόνης, ένας ανά οθόνη</td></tr>
  <tr><td class="gt-term">22 / 20</td><td class="gt-def">Επικεφαλίδα ενότητας</td></tr>
  <tr><td class="gt-term">16</td><td class="gt-def">Κυρίως κείμενο, η βάση της κλίμακας</td></tr>
  <tr><td class="gt-term">14</td><td class="gt-def">Δευτερεύον κείμενο, ετικέτες</td></tr>
  <tr><td class="gt-term">12</td><td class="gt-def">Λεζάντες και βοηθητικά — κάτω από αυτό γίνεται δυσανάγνωστο</td></tr>
</table>

<p>Το ύψος γραμμής (line height) είναι εξίσου σημαντικό με το μέγεθος. Για κείμενο παραγράφου, τιμή γύρω στο 1.4 έως 1.6 φορές το μέγεθος διαβάζεται άνετα. Για μεγάλους τίτλους, πιο κοντά στο 1.1 έως 1.2, γιατί αλλιώς οι γραμμές μοιάζουν ασύνδετες.</p>

<div class="callout good">
  <span class="tag">Ειδικά για Android</span>
  Η προεπιλεγμένη οικογένεια γραμματοσειρών του συστήματος είναι η Roboto. Αν σχεδιάσεις με κάτι άλλο, κάποιος θα πρέπει να πακετάρει τη γραμματοσειρά μέσα στην εφαρμογή. Δεν είναι εμπόδιο, είναι απόφαση που πρέπει να ληφθεί συνειδητά και όχι κατά λάθος. Στο Penpot ανεβάζεις custom fonts από το Dashboard και μετά εμφανίζονται κανονικά στη λίστα.
</div>

<h2>Spacing: το πλέγμα των 8</h2>
<p>Η πιο διαδεδομένη σύμβαση είναι όλες οι αποστάσεις να είναι πολλαπλάσια του 8, με το 4 να επιτρέπεται για μικρές λεπτομέρειες. Δηλαδή: 4, 8, 16, 24, 32, 48, 64.</p>
<p>Ο λόγος δεν είναι μυστικιστικός. Ένα μικρό σύνολο τιμών αφαιρεί μια απόφαση που θα έπαιρνες εκατοντάδες φορές, κάνει τις αποστάσεις να επαναλαμβάνονται με τρόπο που το μάτι αναγνωρίζει ως τάξη, και δίνει στον developer μια κλίμακα αντί για αυθαίρετους αριθμούς.</p>

<h2>Ένα μέγεθος που δεν είναι διαπραγματεύσιμο</h2>
<p>Κάθε στοιχείο που πατιέται με το δάχτυλο χρειάζεται περιοχή αφής τουλάχιστον <strong>48 × 48 dp</strong>. Αυτό δεν σημαίνει ότι το εικονίδιο πρέπει να είναι 48 dp — ένα εικονίδιο 24 dp με padding 12 dp γύρω του δίνει ακριβώς 48.</p>

<div class="callout">
  <span class="tag">Προσοχή / Συχνό λάθος</span>
  Το κλασικό λάθος είναι το εικονίδιο κλεισίματος στη γωνία ενός modal: σχεδιάζεται 16 dp, φαίνεται καθαρό στην οθόνη του υπολογιστή, και στο τηλέφωνο αστοχεί μία στις τρεις φορές. Το ότι φαίνεται δεν σημαίνει ότι πατιέται.
</div>

<h2>Πώς φαίνεται αυτό σε κώδικα</h2>
<p>Οι ίδιες τιμές, όπως θα τις έγραφε κάποιος σε CSS. Η αντιστοιχία δεν είναι σύμπτωση: το σχέδιο και ο κώδικας περιγράφουν το ίδιο πράγμα.</p>

<pre><code class="lang-css">/* one small, closed set of values — nothing outside it */
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 16px;
  --space-4: 24px;
  --space-5: 32px;

  --text-body: 16px;
  --text-label: 14px;
  --line-body: 1.5;
}

.card {
  padding: var(--space-3);
  gap: var(--space-2);
  font-size: var(--text-body);
  line-height: var(--line-body);
}
</code></pre>
`);

<div class="eyebrow">Ενότητα 4 / 8 — Flex & Grid Layout</div>
<h1>Το σημείο όπου το Penpot διαφέρει ουσιαστικά</h1>
<p class="lede">Τα layouts του Penpot δεν μιμούνται το CSS. Είναι CSS Flexbox και CSS Grid, με τα ίδια ονόματα ιδιοτήτων και την ίδια συμπεριφορά.</p>

<h2>Η προφανής προσέγγιση, και το σημείο που σπάει</h2>
<p>Τρεις κάρτες η μία κάτω από την άλλη, με 16 pixel κενό ανάμεσά τους. Τις τοποθετείς με το χέρι στα y = 0, 216 και 432. Φαίνεται σωστό, γιατί είναι σωστό.</p>
<p>Μετά ο τίτλος της πρώτης κάρτας γίνεται δίγραμμος και το ύψος της πάει από 200 σε 224. Τώρα η δεύτερη κάρτα επικαλύπτεται κατά 8 pixel και η τρίτη είναι λάθος τοποθετημένη. Τις μετακινείς με το χέρι. Μετά αλλάζει και η δεύτερη κάρτα. Τις μετακινείς πάλι.</p>
<p>Αυτό δεν είναι υπερβολή του παραδείγματος: είναι η κανονική εμπειρία σε ένα σχέδιο με απόλυτες θέσεις, και είναι ο λόγος που σε πολλά σχέδια οι οθόνες μένουν σκόπιμα λίγες. Με flex layout, το ίδιο συμβάν δεν απαιτεί καμία ενέργεια: δηλώνεις ότι το κενό είναι 16, και το κενό παραμένει 16 ό,τι κι αν γίνει με τα ύψη.</p>

<h2>Τρεις τρόποι τοποθέτησης</h2>
<div class="grid3">
  <div class="card">
    <h3>Static</h3>
    <p>Η προεπιλογή. Κάθε αντικείμενο έχει x και y. Αντιστοιχεί σε απόλυτη τοποθέτηση. Τα constraints της ενότητας 2 ισχύουν εδώ.</p>
  </div>
  <div class="card">
    <h3>Flex layout</h3>
    <p>Μία διάσταση: τα παιδιά μπαίνουν σε σειρά ή σε στήλη και μοιράζονται τον χώρο. Το πιο συχνά χρήσιμο.</p>
  </div>
  <div class="card">
    <h3>Grid layout</h3>
    <p>Δύο διαστάσεις: ορίζεις γραμμές και στήλες και τοποθετείς περιεχόμενο σε κελιά ή περιοχές.</p>
  </div>
</div>

<p>Το layout μπαίνει σε board, group ή επιλογή από το Design panel, ή με <code>Shift + A</code> για flex και <code>Ctrl/⌘ + Shift + A</code> για grid. Τα layouts φωλιάζουν: ένα grid για τη γενική διάταξη της οθόνης, flex μέσα σε κάθε περιοχή του, και ακόμα ένα flex μέσα σε κάθε κάρτα. Ακριβώς όπως σε πραγματική σελίδα.</p>

<h2>Flex, ιδιότητα προς ιδιότητα</h2>
<table class="glossary-table">
  <tr><td class="gt-term">Direction</td><td class="gt-def">row ή column, με τις αντίστροφες εκδοχές τους — είναι το <code>flex-direction</code></td></tr>
  <tr><td class="gt-term">Wrap</td><td class="gt-def">αν τα παιδιά αλλάζουν γραμμή όταν δεν χωρούν — είναι το <code>flex-wrap</code></td></tr>
  <tr><td class="gt-term">Alignment</td><td class="gt-def">οι δύο άξονες στοίχισης, δηλαδή <code>justify-content</code> και <code>align-items</code></td></tr>
  <tr><td class="gt-term">Gap</td><td class="gt-def">το κενό ανάμεσα στα παιδιά, ξεχωριστά για γραμμές και στήλες</td></tr>
  <tr><td class="gt-term">Padding</td><td class="gt-def">εσωτερικό περιθώριο του container, ενιαίο ή ανά πλευρά</td></tr>
</table>

<p>Στα παιδιά ενός flex container εμφανίζεται μια ρύθμιση μεγέθους με τρεις τιμές, μία για κάθε άξονα:</p>

<table class="glossary-table">
  <tr><td class="gt-term">Fix</td><td class="gt-def">σταθερή διάσταση, δεν αλλάζει ό,τι κι αν γίνει</td></tr>
  <tr><td class="gt-term">Fill</td><td class="gt-def">καταλαμβάνει τον διαθέσιμο χώρο — η αντιστοιχία του <code>flex-grow: 1</code></td></tr>
  <tr><td class="gt-term">Fit content</td><td class="gt-def">συρρικνώνεται ακριβώς στο περιεχόμενό του — η αντιστοιχία του <code>width: auto</code></td></tr>
</table>

<div class="eyebrow">Ενότητα 5 / 8 — Design system</div>
<h1>Components: ένα σημείο αλλαγής</h1>
<p class="lede">Η ίδια ιδέα με τη function που καλείς σε πολλά σημεία, μεταφερμένη στο σχέδιο.</p>

<h2>Η προφανής προσέγγιση, και το κόστος της</h2>
<p>Σχεδιάζεις ένα κουμπί, το αντιγράφεις και το επικολλάς σε δώδεκα οθόνες. Είναι γρήγορο και δουλεύει. Μετά αποφασίζεται ότι το radius των γωνιών πάει από 8 σε 12. Τώρα έχεις δώδεκα ανεξάρτητα αντίγραφα να διορθώσεις, θα ξεχάσεις δύο, και τα δύο που ξέχασες θα τα βρει κάποιος άλλος τρεις εβδομάδες αργότερα.</p>

<h2>Main component και copies</h2>
<p>Μετατρέπεις το κουμπί σε component. Από εκείνη τη στιγμή υπάρχει ένα <strong>main component</strong> και όσα <strong>copies</strong> θέλεις. Αλλαγή στο main διαδίδεται σε όλα τα copies.</p>
<p>Ένα copy μπορεί όμως να διαφέρει τοπικά: αλλάζεις το κείμενο, το χρώμα, ένα εικονίδιο. Αυτό λέγεται <strong>override</strong>. Το copy συνεχίζει να ακολουθεί το main σε ό,τι δεν έχεις αλλάξει, και κρατάει τη δική του τιμή σε ό,τι έχεις.</p>

<div class="callout">
  <span class="tag">Προσοχή / Συχνό λάθος</span>
  Το override είναι εργαλείο, όχι λύση για κάθε παραλλαγή. Αν κάθε copy έχει πέντε overrides, το component δεν σου προσφέρει τίποτα πια: κανένα copy δεν μοιάζει με το main και η αλλαγή στο main δεν φτάνει πουθενά. Όταν το δεις αυτό, η παραλλαγή δεν ήταν override, ήταν variant.
</div>

<h2>Variants</h2>
<p>Ένα κουμπί δεν έχει μία μορφή. Έχει primary και secondary, έχει μεγάλο και μικρό, έχει κανονική, πατημένη και απενεργοποιημένη κατάσταση. Τα variants εκφράζουν ακριβώς αυτό: ένα component με ονομασμένες ιδιότητες και τιμές.</p>

<pre><code class="lang-js">// one component, three properties — not nine separate components
button
  variant : primary | secondary | ghost
  size    : small | medium | large
  state   : default | pressed | disabled
</code></pre>

<p>Στο σχέδιο αυτό σημαίνει ότι επιλέγεις το copy και αλλάζεις τιμές από αναδυόμενες λίστες, αντί να ψάχνεις στο panel των assets ανάμεσα σε εννιά παρόμοια εικονίδια. Στην υλοποίηση αντιστοιχεί σε παραμέτρους ενός composable ή props ενός component.</p>

<h2>Φώλιασμα και shared libraries</h2>
<p>Ένα component μπορεί να περιέχει άλλα components: το στοιχείο λίστας περιέχει το avatar και το εικονίδιο, η κάρτα περιέχει το κουμπί. Αλλαγή στο εσωτερικό διαδίδεται προς τα έξω, σε όλα τα επίπεδα.</p>
<p>Ένα ολόκληρο αρχείο μπορεί να δημοσιευτεί ως <strong>shared library</strong>. Τότε τα components, τα χρώματα και οι typographies του γίνονται διαθέσιμα σε άλλα αρχεία της ομάδας. Όταν η βιβλιοθήκη ενημερωθεί, τα αρχεία που τη χρησιμοποιούν ειδοποιούνται και αποφασίζουν πότε θα δεχτούν την ενημέρωση.</p>

<div class="callout good">
  <span class="tag">Το αναγνωρίζεις;</span>
  Main component και copies, overrides, variants, shared library: είναι ορισμός, κλήση με ορίσματα, προεπιλεγμένες τιμές και εξαρτήσεις πακέτου. Η ίδια δομή σκέψης με τον κώδικα, σε άλλο μέσο.
</div>
`);

<div class="eyebrow">Ενότητα 5 / 8 — Design system</div>
<h1>Design tokens</h1>
<p class="lede">Ονομασμένες τιμές που ζουν έξω από το σχέδιο και έξω από τον κώδικα, και τροφοδοτούν και τα δύο.</p>

<h2>Το πρόβλημα που λύνουν</h2>
<p>Ένα αποθηκευμένο χρώμα στο Assets λύνει το πρόβλημα μέσα σε ένα αρχείο Penpot. Δεν λύνει το ότι η ίδια τιμή υπάρχει επίσης σε ένα CSS αρχείο, σε ένα <code>colors.xml</code> του Android και σε ένα theme του Compose, και ότι οι τέσσερις εκδοχές αποκλίνουν με τον χρόνο.</p>
<p>Τα design tokens είναι μια πηγή σε μορφή δεδομένων, από την οποία παράγονται όλες οι υπόλοιπες. Το Penpot τα υποστηρίζει εγγενώς και ακολουθεί το πρότυπο του W3C για τη μορφή τους, οπότε το αρχείο που εξάγεις δεν είναι ιδιόκτητο.</p>

<h2>Τι μπορεί να γίνει token</h2>
<table class="glossary-table">
  <tr><td class="gt-term">color</td><td class="gt-def">Χρώματα γεμίσματος, κειμένου, περιγράμματος</td></tr>
  <tr><td class="gt-term">spacing</td><td class="gt-def">Padding και gaps — τα gaps ισχύουν μόνο σε flex ή grid layout</td></tr>
  <tr><td class="gt-term">sizing / dimension</td><td class="gt-def">Πλάτη, ύψη, μεγέθη εικονιδίων</td></tr>
  <tr><td class="gt-term">border radius</td><td class="gt-def">Στρογγύλεμα γωνιών</td></tr>
  <tr><td class="gt-term">stroke width</td><td class="gt-def">Πάχος περιγράμματος</td></tr>
  <tr><td class="gt-term">typography</td><td class="gt-def">Μέγεθος, βάρος, ύψος γραμμής</td></tr>
  <tr><td class="gt-term">opacity / rotation</td><td class="gt-def">Διαφάνεια και στροφή</td></tr>
</table>

<h2>Αναφορές και επίπεδα</h2>
<p>Ένα token μπορεί να δείχνει σε άλλο. Αυτό επιτρέπει δύο επίπεδα ονομασίας, και η διάκριση είναι το πιο χρήσιμο σημείο όλου του συστήματος:</p>

<div class="grid2">
  <div class="card">
    <h3>Primitive</h3>
    <p>Περιγράφει την τιμή. <code>blue-600</code>, <code>space-16</code>. Δεν λέει πού χρησιμοποιείται.</p>
  </div>
  <div class="card">
    <h3>Semantic</h3>
    <p>Περιγράφει τον ρόλο. <code>color-action-primary</code>, <code>space-card-padding</code>. Δείχνει σε ένα primitive.</p>
  </div>
</div>

<pre><code class="lang-js">{
  "color": {
    "blue-600":  { "$type": "color", "$value": "#1B62D6" },
    "grey-900":  { "$type": "color", "$value": "#14181F" },

    "action-primary": { "$type": "color", "$value": "{color.blue-600}" },
    "text-default":   { "$type": "color", "$value": "{color.grey-900}" }
  },
  "space": {
    "2": { "$type": "dimension", "$value": "8px" },
    "3": { "$type": "dimension", "$value": "16px" }
  }
}
</code></pre>

<p>Στα στοιχεία του σχεδίου εφαρμόζεις πάντα το semantic token, ποτέ το primitive. Έτσι, όταν αλλάξει το χρώμα της μάρκας, αλλάζει μία γραμμή: το <code>action-primary</code> δείχνει σε άλλο μπλε, και ενημερώνονται όλα τα κουμπιά, τα links και τα ενεργά εικονίδια ταυτόχρονα.</p>

<h2>Sets και themes</h2>
<p>Τα tokens οργανώνονται σε <strong>sets</strong>, και τα sets συνδυάζονται σε <strong>themes</strong>. Η τυπική χρήση είναι το ζευγάρι light και dark: το ίδιο semantic όνομα, δύο διαφορετικές τιμές, εναλλαγή από ένα σημείο. Για Android αυτό αντιστοιχεί ακριβώς στο ζεύγος light και dark theme που ούτως ή άλλως πρέπει να υποστηρίξεις.</p>

<div class="eyebrow">Ενότητα 6 / 8 — Prototyping</div>
<h1>Από στατικές οθόνες σε κάτι που πατιέται</h1>
<p class="lede">Ένα prototype δεν είναι εφαρμογή. Είναι ένα σύνολο οθονών με κανόνες μετάβασης, που απαντάει σε ερωτήσεις τις οποίες μια στατική εικόνα δεν μπορεί να απαντήσει.</p>

<h2>Τι απαντάει ένα prototype</h2>
<p>Πόσα πατήματα χρειάζονται για να ολοκληρωθεί μια εργασία. Αν ο χρήστης βρίσκει την επιστροφή. Αν η σειρά των οθονών βγάζει νόημα όταν τη ζεις αντί να την κοιτάς. Αυτά δεν φαίνονται σε καμία εικόνα, και είναι ακριβώς τα πράγματα που κοστίζουν αν ανακαλυφθούν μετά την υλοποίηση.</p>

<h2>Ο μηχανισμός</h2>
<p>Στο tab Prototype, επιλέγεις ένα στοιχείο και τραβάς μια σύνδεση προς το board προορισμού. Κάθε σύνδεση έχει τρία μέρη:</p>

<div class="grid3">
  <div class="card">
    <h3>Trigger</h3>
    <p>Τι την ενεργοποιεί: click, mouse enter, mouse leave, ή αυτόματα μετά από καθυστέρηση.</p>
  </div>
  <div class="card">
    <h3>Action</h3>
    <p>Τι συμβαίνει: navigate to, open overlay, close overlay, toggle overlay, previous screen, open URL.</p>
  </div>
  <div class="card">
    <h3>Animation</h3>
    <p>Πώς φαίνεται η μετάβαση: dissolve, slide, push, με διάρκεια και καμπύλη επιτάχυνσης.</p>
  </div>
</div>

<p>Ένα board μπορεί να οριστεί ως αφετηρία ενός <strong>flow</strong>. Ένα αρχείο συνήθως έχει περισσότερα από ένα flows — εγγραφή, αγορά, ρυθμίσεις — και ο θεατής ξεκινάει από όποιο διαλέξει, χωρίς να χρειάζεται να διασχίσει όλη την εφαρμογή για να φτάσει στο σημείο που τον ενδιαφέρει.</p>

<h2>Overlays</h2>
<p>Η ενέργεια <code>open overlay</code> εμφανίζει ένα board πάνω από το τρέχον, χωρίς να το αντικαταστήσει. Είναι ο σωστός τρόπος για dialog, bottom sheet, μενού και toast. Ρυθμίζεις τη θέση του, αν υπάρχει σκούρο φόντο από πίσω, και αν κλείνει με πάτημα εκτός του.</p>

<div class="callout">
  <span class="tag">Προσοχή / Συχνό λάθος</span>
  Ένα dialog φτιαγμένο ως κανονική οθόνη αντί για overlay φαίνεται σχεδόν ίδιο και συμπεριφέρεται λάθος: η προηγούμενη οθόνη δεν υπάρχει από κάτω, οπότε η επιστροφή πρέπει να στηθεί με το χέρι σε κάθε σημείο από όπου μπορεί να ανοίξει το dialog. Με overlay, το κλείσιμο επιστρέφει εκεί που ήσουν, ό,τι κι αν ήταν αυτό.
</div>

<h2>Scroll και σταθερά στοιχεία</h2>
<p>Αν το περιεχόμενο ξεπερνάει το ύψος του board, η περιοχή γίνεται κυλιόμενη στο viewer. Ένα στοιχείο μπορεί να οριστεί ως σταθερό ώστε να μένει στη θέση του ενώ το υπόλοιπο κυλάει — έτσι στήνεται μια κεφαλίδα ή μια κάτω γραμμή πλοήγησης που δεν φεύγει από την οθόνη.</p>
`);

<div class="eyebrow">Ενότητα 6 / 8 — Prototyping</div>
<h1>Παρουσίαση, σχόλια και τα όρια</h1>

<h2>Viewer και κοινοποίηση</h2>
<p>Το prototype παρουσιάζεται στο viewer, σε πλήρη οθόνη. Από εκεί παράγεται και ένας σύνδεσμος κοινοποίησης: μπορείς να επιλέξεις ποια flows θα είναι ορατά, αν χρειάζεται κωδικός, και αν ο επισκέπτης βλέπει μόνο το prototype ή έχει πρόσβαση και στο Inspect.</p>
<p>Ο σύνδεσμος ανοίγει και στο κινητό. Αυτό είναι πιο σημαντικό απ ό,τι ακούγεται: ένα σχέδιο για Android που κρίθηκε μόνο σε οθόνη υπολογιστή δεν έχει ελεγχθεί καθόλου. Τα μεγέθη αφής, η αναγνωσιμότητα του κειμένου και η απόσταση που πρέπει να διανύσει ο αντίχειρας φαίνονται μόνο στη συσκευή.</p>

<h2>Σχόλια</h2>
<p>Οποιοσδήποτε έχει πρόσβαση μπορεί να αφήσει σχόλιο καρφιτσωμένο σε συγκεκριμένο σημείο του καμβά. Είναι σαφώς καλύτερο από την εναλλακτική, δηλαδή τη συζήτηση σε chat όπου κανείς δεν ξέρει σε ποια οθόνη αναφέρεται το «το κουμπί είναι πολύ ψηλά».</p>

<h2>Τι δεν αποδεικνύει ένα prototype</h2>

</table>

<div class="callout">
  <span class="tag">Ειδικά για Android</span>

</div>

<div class="eyebrow">Ενότητα 7 / 8 — Handoff</div>
<h1>Από το σχέδιο στην υλοποίηση</h1>
<p class="lede">Handoff είναι το σημείο όπου το σχέδιο γίνεται κώδικας. Είναι επίσης το σημείο όπου χάνονται οι περισσότερες πληροφορίες, και σχεδόν πάντα επειδή δεν είχαν καταγραφεί ποτέ.</p>

<h2>Inspect</h2>
<p>Το tab Inspect δείχνει το επιλεγμένο αντικείμενο ως δεδομένα: ακριβείς διαστάσεις και θέση, αποστάσεις προς τα γειτονικά στοιχεία, τιμές χρωμάτων σε διάφορες μορφές, ρυθμίσεις τυπογραφίας, εφέ. Δίπλα σε αυτά, το παραγόμενο CSS και το SVG markup του αντικειμένου.</p>

<div class="callout">
  <span class="tag">Προσοχή / Συχνό λάθος</span>
  Το CSS του Inspect είναι αναφορά, όχι πηγαίος κώδικας για αντιγραφή. Περιγράφει ένα αντικείμενο εκεί που στέκεται, χωρίς να ξέρει τι είναι επαναχρησιμοποιήσιμο, ποιο είναι το component και ποια τιμή προέρχεται από token. Αν αντιγραφεί αυτούσιο, το αποτέλεσμα είναι κώδικας με σταθερές παντού και καμία δομή.
</div>

<h2>Export</h2>
<p>Το export ορίζεται ανά αντικείμενο ή ανά board, στο κάτω μέρος του Design panel. Κάθε αντικείμενο μπορεί να έχει πολλές ρυθμίσεις εξόδου ταυτόχρονα, καθεμία με δική της κλίμακα και δικό της επίθεμα στο όνομα αρχείου. Οι μορφές καλύπτουν raster έξοδο, όπως PNG, JPEG και WebP, και vector έξοδο, δηλαδή SVG και PDF.</p>

<h2>Τι χρειάζεται ένα έργο Android</h2>
<table class="glossary-table">
  <tr><td class="gt-term">Εικονίδια</td><td class="gt-def">Σε SVG. Το Android Studio τα μετατρέπει σε vector drawable, οπότε ένα αρχείο καλύπτει όλες τις πυκνότητες οθόνης.</td></tr>

  <tr><td class="gt-term">Λογότυπα</td><td class="gt-def">Σε SVG όπου γίνεται. Ένα λογότυπο εξαγόμενο ως PNG σε μία κλίμακα θα φανεί θολό σε κάποια συσκευή.</td></tr>
  <tr><td class="gt-term">Χρώματα και μεγέθη</td><td class="gt-def">Ως tokens, όχι ως τιμές αντιγραμμένες από το Inspect μία προς μία.</td></tr>
</table>

<div class="callout good">
  <span class="tag">Πότε χρειάζεσαι πολλαπλές κλίμακες</span>
  Μόνο για raster. Ένα SVG δεν έχει κλίμακα, γι αυτό και δεν εξάγεται σε ×2 ή ×3. Αν εξάγεις εικονίδια σε PNG για Android, κάτι έχει πάει στραβά νωρίτερα στη διαδικασία.
</div>
`);

<h1>Ιστορικό, επεκτάσεις και το ανθρώπινο κομμάτι</h1>

<h2>Ιστορικό και μεταφορά αρχείων</h2>
<p>Το Penpot κρατάει ιστορικό εκδόσεων, ώστε να μπορείς να επιστρέψεις σε προηγούμενη κατάσταση του αρχείου. Ένα αρχείο εξάγεται επίσης ολόκληρο και εισάγεται σε άλλο περιβάλλον — για παράδειγμα από την cloud έκδοση σε δικό σου self-hosted server. Υπάρχει και εισαγωγή αρχείων Figma: τα περισσότερα περνούν καθαρά, αλλά τα σύνθετα layouts συνήθως θέλουν χειροκίνητη διόρθωση μετά.</p>

<h2>Plugins και MCP</h2>
<p>Το Penpot έχει API plugins, οπότε μπορείς να γράψεις δικές σου επεκτάσεις — για παράδειγμα να γεμίσεις μια λίστα με ρεαλιστικά δεδομένα, ή να ελέγξεις αυτόματα τους λόγους αντίθεσης σε όλη τη σελίδα. Διαθέτει επίσης MCP server, δηλαδή έναν τυποποιημένο τρόπο ώστε ένα AI εργαλείο να διαβάζει τα σχέδια και να δουλεύει πάνω τους.</p>

<div class="callout">

<h2>Τι πραγματικά ζητάει αυτός που θα το υλοποιήσει</h2>
<p>Η μεγαλύτερη απώλεια στο handoff δεν είναι τεχνική. Είναι ότι το σχέδιο δείχνει μία εκδοχή του κόσμου και ο κώδικας πρέπει να καλύψει όλες. Ένα σχέδιο έτοιμο για παράδοση απαντάει στα εξής, χωρίς να χρειαστεί να ρωτήσει κανείς:</p>

<h1>Από την ιδέα στην οθόνη</h1>

<div class="callout">
  <span class="tag">Γιατί το wireframe πριν το χρώμα</span>
  Αν δείξεις σε κάποιον μια έγχρωμη οθόνη, θα σχολιάσει το χρώμα. Αν του δείξεις γκρι κουτιά, θα σχολιάσει τη δομή — που είναι το μόνο πράγμα που έχει νόημα να αλλάξει σε αυτό το στάδιο, γιατί είναι και το πιο ακριβό αργότερα.
</div>

<h2>Ένα παράδειγμα, από άκρη σε άκρη</h2>
<p>Εφαρμογή που δείχνει μια λίστα μαθημάτων και τις λεπτομέρειες του καθενός.</p>

<p><strong>Task flow:</strong> ανοίγει την εφαρμογή, βλέπει τη λίστα, διαλέγει ένα μάθημα, διαβάζει τις λεπτομέρειες, επιστρέφει στη λίστα.</p>

<p><strong>Δομή στο Penpot:</strong> δύο boards 360 × 800. Το πρώτο, με όνομα <code>screen-course-list</code>, παίρνει grid layout τριών γραμμών: 56 για την κεφαλίδα, το υπόλοιπο για τη λίστα, 64 για την κάτω πλοήγηση. Το δεύτερο, <code>screen-course-detail</code>, με την ίδια δομή.</p>

<p><strong>Components:</strong> ένα <code>course-card</code> με flex layout σε row — εικονίδιο σε Fix, στήλη κειμένου σε Fill, βέλος σε Fix — και variants για τις καταστάσεις <code>default</code> και <code>pressed</code>. Ένα <code>app-bar</code> και ένα <code>bottom-nav</code>, χρησιμοποιημένα και στις δύο οθόνες.</p>

<p><strong>Tokens:</strong> <code>color-surface</code>, <code>color-text-default</code>, <code>color-action-primary</code>, <code>space-2</code> και <code>space-3</code> για padding και gaps, <code>radius-card</code>. Δύο sets, light και dark.</p>

<p><strong>Καταστάσεις:</strong> τρίτο board <code>screen-course-list-empty</code> με μήνυμα και κουμπί, και τέταρτο <code>screen-course-list-error</code> με μήνυμα αποτυχίας και επανάληψη.</p>

<p><strong>Prototype:</strong> το <code>course-card</code> συνδέεται με την οθόνη λεπτομερειών με trigger click και animation slide. Το βέλος επιστροφής στην κεφαλίδα χρησιμοποιεί <code>previous screen</code>, ώστε να συμπεριφέρεται όπως η κίνηση επιστροφής του συστήματος.</p>
`);
