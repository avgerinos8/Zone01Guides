<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <g transform="translate(150, 50)">
    <!-- Node Box Boundary -->
    <rect x="0" y="0" width="200" height="130" rx="12" fill="#0f172a"/>
    <rect x="0" y="0" width="200" height="130" rx="12" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8,4"/>
    
    <!-- Data Property -->
    <rect x="20" y="20" width="160" height="36" rx="6" fill="#0f172a"/>
    <rect x="20" y="20" width="160" height="36" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="100" y="43" fill="white" font-size="14" font-weight="600" text-anchor="middle">Data: 42</text>
    
    <!-- Next Property -->
    <rect x="20" y="75" width="160" height="36" rx="6" fill="#0f172a"/>
    <rect x="20" y="75" width="160" height="36" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="100" y="98" fill="white" font-size="14" font-weight="600" text-anchor="middle">Next: 0xc42000a</text>
  </g>

  <!-- Annotations -->
  <text x="140" y="88" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="end">Η τιμή</text>
  <line x1="145" y1="84" x2="165" y2="84" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="140" y="143" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="end">Πού βρίσκεται ο επόμενος</text>
  <line x1="145" y1="139" x2="165" y2="139" stroke="#94a3b8" stroke-width="1.5"/>
</svg>
