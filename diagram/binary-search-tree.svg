<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <g transform="translate(0, 30)">
    <!-- Lines -->
    <!-- Root to L and R -->
    <line x1="300" y1="30" x2="180" y2="110" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
    <line x1="300" y1="30" x2="420" y2="110" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

    <!-- L to LL and LR -->
    <line x1="180" y1="110" x2="100" y2="190" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
    <line x1="180" y1="110" x2="260" y2="190" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

    <!-- R to RL and RR -->
    <line x1="420" y1="110" x2="340" y2="190" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
    <line x1="420" y1="110" x2="500" y2="190" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

    <!-- Nodes -->
    <!-- Node 20 -->
    <circle cx="300" cy="30" r="24" fill="#0f172a"/>
    <circle cx="300" cy="30" r="24" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="300" y="36" fill="white" font-size="16" font-weight="600" text-anchor="middle">20</text>

    <!-- Node 10 -->
    <circle cx="180" cy="110" r="24" fill="#0f172a"/>
    <circle cx="180" cy="110" r="24" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="180" y="116" fill="white" font-size="16" font-weight="600" text-anchor="middle">10</text>

    <!-- Node 30 -->
    <circle cx="420" cy="110" r="24" fill="#0f172a"/>
    <circle cx="420" cy="110" r="24" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="420" y="116" fill="white" font-size="16" font-weight="600" text-anchor="middle">30</text>

    <!-- Node 5 -->
    <circle cx="100" cy="190" r="24" fill="#0f172a"/>
    <circle cx="100" cy="190" r="24" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="100" y="196" fill="white" font-size="16" font-weight="600" text-anchor="middle">5</text>

    <!-- Node 15 -->
    <circle cx="260" cy="190" r="24" fill="#0f172a"/>
    <circle cx="260" cy="190" r="24" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="260" y="196" fill="white" font-size="16" font-weight="600" text-anchor="middle">15</text>

    <!-- Node 25 -->
    <circle cx="340" cy="190" r="24" fill="#0f172a"/>
    <circle cx="340" cy="190" r="24" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="340" y="196" fill="white" font-size="16" font-weight="600" text-anchor="middle">25</text>

    <!-- Node 35 -->
    <circle cx="500" cy="190" r="24" fill="#0f172a"/>
    <circle cx="500" cy="190" r="24" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="500" y="196" fill="white" font-size="16" font-weight="600" text-anchor="middle">35</text>
  </g>
</svg>
