<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- ARRAY Section -->
  <text x="30" y="40" fill="#22d3ee" font-size="16" font-weight="700">ARRAY</text>
  
  <g transform="translate(30, 60)">
    <!-- Opaque mask -->
    <rect x="0" y="0" width="240" height="50" rx="4" fill="#0f172a"/>
    <!-- Box -->
    <rect x="0" y="0" width="240" height="50" rx="4" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <line x1="60" y1="0" x2="60" y2="50" stroke="#22d3ee" stroke-width="1.5"/>
    <line x1="120" y1="0" x2="120" y2="50" stroke="#22d3ee" stroke-width="1.5"/>
    <line x1="180" y1="0" x2="180" y2="50" stroke="#22d3ee" stroke-width="1.5"/>

    <text x="30" y="31" fill="white" font-size="20" font-weight="600" text-anchor="middle">5</text>
    <text x="90" y="31" fill="white" font-size="20" font-weight="600" text-anchor="middle">8</text>
    <text x="150" y="31" fill="white" font-size="20" font-weight="600" text-anchor="middle">2</text>
    <text x="210" y="31" fill="white" font-size="20" font-weight="600" text-anchor="middle">9</text>
  </g>

  <!-- LINKED LIST Section -->
  <text x="30" y="150" fill="#34d399" font-size="16" font-weight="700">LINKED LIST</text>

  <g transform="translate(30, 170)">
    <!-- Nodes -->
    <!-- Node 1 -->
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#0f172a"/>
    <rect x="0" y="0" width="50" height="50" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="25" y="31" fill="white" font-size="20" font-weight="600" text-anchor="middle">5</text>
    <line x1="50" y1="25" x2="105" y2="25" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

    <!-- Node 2 -->
    <rect x="115" y="0" width="50" height="50" rx="8" fill="#0f172a"/>
    <rect x="115" y="0" width="50" height="50" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="140" y="31" fill="white" font-size="20" font-weight="600" text-anchor="middle">8</text>
    <line x1="165" y1="25" x2="220" y2="25" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

    <!-- Node 3 -->
    <rect x="230" y="0" width="50" height="50" rx="8" fill="#0f172a"/>
    <rect x="230" y="0" width="50" height="50" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="255" y="31" fill="white" font-size="20" font-weight="600" text-anchor="middle">2</text>
    <line x1="280" y1="25" x2="335" y2="25" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

    <!-- Node 4 -->
    <rect x="345" y="0" width="50" height="50" rx="8" fill="#0f172a"/>
    <rect x="345" y="0" width="50" height="50" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="370" y="31" fill="white" font-size="20" font-weight="600" text-anchor="middle">9</text>
    <line x1="395" y1="25" x2="450" y2="25" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    
    <text x="475" y="30" fill="#94a3b8" font-size="16" font-weight="600" text-anchor="middle">nil</text>
  </g>
</svg>
