<div class="eyebrow">Ενότητα 8 / 8 — Data Structures</div>

<h1>Δισδιάστατοι Πίνακες</h1>

<p class="lede">
    Μέχρι τώρα κάθε συλλογή που είδαμε ήταν "μονοδιάστατη" — μια απλή σειρά στοιχείων. Πολύ συχνά όμως χρειάζεσαι κάτι
    πιο σύνθετο: μια δομή με <strong>γραμμές και στήλες</strong>, σαν λογιστικό φύλλο ή ταμπλό παιχνιδιού. Αυτό
    ακριβώς προσφέρουν οι δισδιάστατες δομές — ουσιαστικά, μια συλλογή <em>μέσα</em> σε μια άλλη συλλογή.
</p>

<h2>Τι είναι, στην πράξη, ένας δισδιάστατος πίνακας</h2>

<p>
    Φαντάσου ένα σκάκι, ή ένα λογιστικό φύλλο: κάθε κελί προσδιορίζεται από <strong>δύο</strong> συντεταγμένες — τη
    γραμμή (row) και τη στήλη (column), όχι μόνο μία θέση όπως σε ένα απλό slice. Ένα ακόμα παράδειγμα από την
    καθημερινότητα: ένα ταμπλό <strong>tic-tac-toe</strong> είναι κι αυτό ένας δισδιάστατος πίνακας 3×3 — κάθε κελί
    έχει τη δική του γραμμή και στήλη.
</p>

<p>
    Στη Go, αυτό υλοποιείται απλά ως "μια συλλογή, όπου κάθε στοιχείο της είναι κι αυτό μια συλλογή". Δύο βασικές
    μορφές: <strong>δισδιάστατο array</strong> (σταθερού μεγέθους, και στις δύο διαστάσεις) και
    <strong>δισδιάστατο slice</strong> (δυναμικού μεγέθους — η πιο συνηθισμένη μορφή στην πράξη).
</p>

<h2>Δισδιάστατα Arrays</h2>

<p>
    Η σύνταξη <code>[rows][cols]T</code> δηλώνει έναν πίνακα από <code>rows</code> πίνακες, ο καθένας με
    <code>cols</code> στοιχεία τύπου <code>T</code>:
</p>

<pre><code class="lang-go">var grid [3][2]int // 3 γραμμές, 2 στήλες, όλα zero value (0)

literal := [2][3]int{
    {1, 2, 3},
    {4, 5, 6},
}

fmt.Println(literal[0][1]) // γραμμή 0, στήλη 1 → 2
</code></pre>

<p>
    Ακριβώς όπως ένα κανονικό array, το μέγεθος (και στις δύο διαστάσεις) είναι μέρος του ίδιου του τύπου — ένα
    <code>[2][3]int</code> και ένα <code>[3][2]int</code> είναι εντελώς διαφορετικοί τύποι, ακόμα κι αν "χωράνε" τον
    ίδιο συνολικό αριθμό στοιχείων.
</p>

<h2>Δισδιάστατα Slices — <code>[][]T</code></h2>

<p>
    Στην πράξη, σχεδόν πάντα θα χρησιμοποιείς <code>[][]T</code> — ένα "slice από slices". Κάθε γραμμή είναι το δικό
    της, ανεξάρτητο slice:
</p>

<pre><code class="lang-go">matrix := [][]int{
    {1, 2, 3},
    {4, 5},
    {6},
}
</code></pre>

<div class="callout">
    <span class="tag">Παγίδα: Ragged slices — οι γραμμές ΔΕΝ είναι υποχρεωμένες να έχουν το ίδιο μήκος</span>
    <p>
        Σε αντίθεση με ένα δισδιάστατο array (όπου κάθε γραμμή έχει εγγυημένα το ίδιο μήκος, αφού είναι μέρος του
        τύπου), ένα <code>[][]T</code> είναι απλά ένα slice όπου κάθε στοιχείο τυχαίνει να είναι κι αυτό ένα slice.
        Τίποτα δεν σε εμποδίζει να έχεις γραμμές διαφορετικού μήκους, όπως στο παράδειγμα παραπάνω (3, 2, και 1
        στοιχεία). Αυτό λέγεται <strong>ragged</strong> (ή "jagged") slice. Δεν είναι λάθος από μόνο του — απλά μην
        υποθέτεις αυτόματα ότι όλες οι γραμμές έχουν το ίδιο μήκος, εκτός αν το έχτισες εσύ έτσι σκόπιμα.
    </p>
</div>

<h2>Δημιουργία με make — μια παγίδα που αξίζει προσοχή</h2>

<p>
    Όταν φτιάχνεις ένα <code>[][]T</code> με <code>make</code>, πρέπει να προσέξεις: η <code>make</code> δεσμεύει
    μόνο το <strong>εξωτερικό</strong> slice. Κάθε εσωτερικό slice (κάθε "γραμμή") ξεκινά ως <code>nil</code>, μέχρι να
    το δεσμεύσεις ξεχωριστά:
</p>

<pre><code class="lang-go">rows, cols := 3, 4

grid := make([][]int, rows) // δεσμεύει ΜΟΝΟ τις 3 γραμμές
grid[0][0] = 1              // PANIC: index out of range — η grid[0] είναι ακόμα nil, με length 0
</code></pre>

<p>Ο σωστός τρόπος είναι να δεσμεύσεις κάθε γραμμή ξεχωριστά, συνήθως με ένα loop:</p>

<pre><code class="lang-go">grid := make([][]int, rows)
for i := range grid {
    grid[i] = make([]int, cols) // τώρα κάθε γραμμή έχει πραγματικά 4 θέσεις
}

grid[0][0] = 1 // OK πλέον
</code></pre>

<div class="callout">
    <span class="tag">Γιατί συμβαίνει αυτό</span>
    Η <code>make([][]int, rows)</code> δημιουργεί ένα slice με <code>rows</code> "κουτάκια" — αλλά κάθε κουτάκι
    περιέχει, προς το παρόν, τη zero value ενός slice, δηλαδή <code>nil</code>. Ένα nil slice έχει length 0 — γι'
    αυτό οποιαδήποτε πρόσβαση μέσω index πάνω του (<code>grid[0][0]</code>) προκαλεί πάντα panic, μέχρι να το
    αρχικοποιήσεις ρητά με τη δική του <code>make</code>.
</div>

<h2>Πρόσβαση και τροποποίηση στοιχείων</h2>

<p>
    Χρησιμοποιείς δύο index στη σειρά — πρώτα τη γραμμή, μετά τη στήλη:
</p>

<pre><code class="lang-go">matrix := [][]int{
    {1, 2, 3},
    {4, 5, 6},
}

fmt.Println(matrix[0][2]) // γραμμή 0, στήλη 2 → 3
matrix[1][0] = 99         // αλλάζει τη γραμμή 1, στήλη 0
fmt.Println(matrix[1][0]) // 99
</code></pre>

<h2>Iteration με διπλή for range</h2>

<p>
    Ακριβώς όπως έκανες iterate σε λέξεις μέσα σε ένα slice από strings και μετά σε γράμματα μέσα σε κάθε λέξη
    (φωλιασμένο <code>range</code>), έτσι κάνεις iterate και σε ένα δισδιάστατο slice — μια εξωτερική
    <code>range</code> για τις γραμμές, μια εσωτερική για τα στοιχεία κάθε γραμμής:
</p>

<pre><code class="lang-go">matrix := [][]int{
    {1, 2, 3},
    {4, 5, 6},
}

for i, row := range matrix {
    for j, val := range row {
        fmt.Println("γραμμή", i, "στήλη", j, "τιμή", val)
    }
}
</code></pre>

<p>
    Το <code>i</code> είναι ο δείκτης γραμμής, το <code>row</code> είναι ολόκληρο το slice εκείνης της γραμμής. Μέσα
    στην εσωτερική <code>range</code>, το <code>j</code> είναι ο δείκτης στήλης, και το <code>val</code> η τιμή στο
    κελί <code>(i, j)</code>.
</p>

<h2>Παράδειγμα: Τυπώνοντας ένα ταμπλό tic-tac-toe</h2>

<p>
    Ένα πιο οπτικό παράδειγμα iteration σε δύο διαστάσεις — τυπώνουμε ένα ταμπλό 3×3, γραμμή προς γραμμή:
</p>

<pre><code class="lang-go">board := [][]string{
    {"X", "O", "X"},
    {"", "X", ""},
    {"O", "", "O"},
}

for _, row := range board {
    for _, cell := range row {
        if cell == "" {
            fmt.Print("_ ")
        } else {
            fmt.Print(cell, " ")
        }
    }
    fmt.Println()
}
// X O X
// _ X _
// O _ O
</code></pre>

<p>
    Παρατήρησε ότι το <code>fmt.Println()</code> (χωρίς ορίσματα) στο τέλος της εξωτερικής loop απλά αλλάζει γραμμή —
    έτσι κάθε γραμμή του ταμπλό τυπώνεται ξεχωριστά, κάτω από την προηγούμενη.
</p>

<h2>Παράδειγμα: Άθροισμα ανά γραμμή και συνολικό άθροισμα</h2>

<pre><code class="lang-go">package main

import "fmt"

func main() {
    grid := [][]int{
        {1, 2, 3},
        {4, 5, 6},
        {7, 8, 9},
    }

    total := 0
    for i, row := range grid {
        rowSum := 0
        for _, v := range row {
            rowSum += v
            total += v
        }
        fmt.Println("Row", i, "sum:", rowSum)
    }
    fmt.Println("Total:", total)
}
// Row 0 sum: 6
// Row 1 sum: 15
// Row 2 sum: 24
// Total: 45
</code></pre>

<h2>Παράδειγμα: Χτίζοντας έναν πίνακα πολλαπλασιασμού</h2>

<p>
    Ένα κλασικό παράδειγμα που συνδυάζει το σωστό, δίβημο <code>make</code> με φωλιασμένο <code>for</code>: φτιάχνουμε
    δυναμικά έναν πίνακα πολλαπλασιασμού <code>n×n</code>, όπου κάθε κελί <code>(i, j)</code> περιέχει το γινόμενο
    <code>(i+1) * (j+1)</code>:
</p>

<pre><code class="lang-go">package main

import "fmt"

func main() {
    n := 4
    table := make([][]int, n)

    for i := range table {
        table[i] = make([]int, n) // δέσμευση κάθε γραμμής ξεχωριστά
        for j := range table[i] {
            table[i][j] = (i + 1) * (j + 1)
        }
    }

    for _, row := range table {
        fmt.Println(row)
    }
}
// [1 2 3 4]
// [2 4 6 8]
// [3 6 9 12]
// [4 8 12 16]
</code></pre>

<h2>Παράδειγμα: Αντιστροφή γραμμών/στηλών (Transpose)</h2>

<p>
    Ένα ελαφρώς πιο προχωρημένο παράδειγμα: αντιστρέφουμε ένα matrix, ώστε οι γραμμές να γίνουν στήλες και οι στήλες
    γραμμές. Το κελί <code>(i, j)</code> του αρχικού πίνακα γίνεται το κελί <code>(j, i)</code> του νέου:
</p>

<pre><code class="lang-go">package main

import "fmt"

func main() {
    original := [][]int{
        {1, 2, 3},
        {4, 5, 6},
    }

    rows, cols := len(original), len(original[0])
    transposed := make([][]int, cols) // οι στήλες γίνονται γραμμές
    for i := range transposed {
        transposed[i] = make([]int, rows)
    }

    for i, row := range original {
        for j, val := range row {
            transposed[j][i] = val
        }
    }

    for _, row := range transposed {
        fmt.Println(row)
    }
}
// [1 4]
// [2 5]
// [3 6]
</code></pre>

<p>
    Το κρίσιμο σημείο εδώ είναι η γραμμή <code>transposed[j][i] = val</code> — το <code>i</code> και το
    <code>j</code> αντιστρέφουν θέση σε σχέση με το αρχικό <code>original[i][j]</code>. Ο νέος πίνακας έχει διαστάσεις
    <code>cols × rows</code> αντί για <code>rows × cols</code>.
</p>

<h2>len() σε δύο διαστάσεις</h2>

<div class="grid2">
    <div class="card">
        <h3><code>len(matrix)</code></h3>
        <p>Το πλήθος των <strong>γραμμών</strong> — πόσα εξωτερικά στοιχεία (slices) περιέχει το matrix.</p>
    </div>
    <div class="card">
        <h3><code>len(matrix[i])</code></h3>
        <p>Το πλήθος των <strong>στηλών</strong> στη συγκεκριμένη γραμμή <code>i</code> — όχι απαραίτητα το ίδιο για
        κάθε γραμμή, αν το slice είναι ragged.</p>
    </div>
</div>

<div class="callout">
    <span class="tag">Συνοπτικά — οι 3 πιο συχνές παγίδες</span>
    <ul>
        <li><strong>Ragged rows:</strong> μην υποθέτεις ότι κάθε γραμμή έχει το ίδιο <code>len()</code>, εκτός αν το έχτισες εσύ έτσι.</li>
        <li><strong>make σε δύο βήματα:</strong> η <code>make([][]T, rows)</code> δεν δεσμεύει τις εσωτερικές γραμμές — χρειάζεται ξεχωριστό <code>make</code> για την καθεμία, συνήθως μέσα σε loop.</li>
        <li><strong>Σειρά index:</strong> το <code>matrix[i][j]</code> είναι πάντα γραμμή πρώτα, στήλη μετά — το αντίστροφο είναι από τα πιο συχνά λάθη.</li>
    </ul>
</div>

<h2>Και πέρα από δύο διαστάσεις;</h2>

<p>
    Πολύ σύντομα: τίποτα ουσιαστικό δεν αλλάζει με τρεις ή περισσότερες διαστάσεις — απλά προσθέτεις ένα ακόμα ζεύγος
    αγκύλων. Ένα <code>[][][]int</code> είναι ένα "slice από slices από slices", και το προσπελαύνεις με τρία index
    αντί για δύο:
</p>

<pre><code class="lang-go">cube := make([][][]int, x)
for i := range cube {
    cube[i] = make([][]int, y)
    for j := range cube[i] {
        cube[i][j] = make([]int, z)
    }
}

cube[0][0][0] = 1
</code></pre>

<p>
    Η ίδια λογική ισχύει και για <code>n</code> διαστάσεις γενικά — ίδιο μοτίβο, απλά ένα ακόμα επίπεδο
    <code>make</code> και ένα ακόμα index για κάθε επιπλέον διάσταση. Το μόνο που πραγματικά αλλάζει πέρα από τις 3
    διαστάσεις είναι πρακτικό, όχι τεχνικό: δεν μπορούμε πια να <strong>οπτικοποιήσουμε</strong> τη δομή με μια
    εικόνα στο μυαλό μας (γραμμή/στήλη/βάθος), όπως κάναμε μέχρι τις 3 διαστάσεις — ο κώδικας όμως λειτουργεί
    ακριβώς με τον ίδιο τρόπο.
</p>

<h1>Maps</h1>

<p class="lede">
    Το τελευταίο data structure σε αυτόν τον οδηγό: ο map, η δομή "κλειδί/τιμή" (key/value) της Go — αντίστοιχο με ό,τι σε άλλες γλώσσες ονομάζεται dictionary ή hash map.
</p>

<h2>Τι είναι ένας Map</h2>

<p>
    Σε ένα slice ή array, προσπελαύνεις τα στοιχεία μέσω ενός αριθμητικού index (0, 1, 2, ...). Σε έναν <strong>map</strong>, αντ' αυτού, κάθε τιμή συνδέεται με ένα δικό της, μοναδικό <strong>κλειδί</strong> (key) — που μπορεί να είναι, για παράδειγμα, ένα string, αντί για έναν απλό αύξοντα αριθμό. Αυτό είναι εξαιρετικά χρήσιμο όταν θες να "ψάχνεις" γρήγορα δεδομένα με βάση κάτι πιο νοηματικό από μια αριθμημένη θέση — π.χ. να αποθηκεύσεις την ηλικία ενός ατόμου, με το όνομά του ως κλειδί αναζήτησης.
</p>

<div class="callout">
    <span class="tag">Μια αναλογία: ο τηλεφωνικός κατάλογος</span>
    <p>
        Σκέψου έναν τηλεφωνικό κατάλογο. Για να βρεις τον αριθμό κάποιου, δεν ξεκινάς από τη σελίδα 1 και διαβάζεις όλα τα ονόματα ένα-ένα μέχρι να τον βρεις — χρησιμοποιείς το όνομα ως <strong>κλειδί</strong> (key) για να πας κατευθείαν στον αριθμό του (την <strong>τιμή</strong>, value). Ο map λειτουργεί ακριβώς έτσι: αντί να ψάχνεις με αριθμητικό index, ψάχνεις με ένα κλειδί που εσύ επιλέγεις.
    </p>
</div>

<h2>Δήλωση και αρχικοποίηση</h2>

<pre><code class="lang-go">ages := make(map[string]int)  // an empty map, ready to use: keys are strings, values are ints

scores := map[string]int{     // map literal, with initial key/value pairs already filled in
    "first":  90,
    "second": 85,
}
</code></pre>

<p>
    Η σύνταξη <code>map[string]int</code> σημαίνει "map όπου τα κλειδιά είναι τύπου string, και οι τιμές είναι τύπου int". Όπως και με τα slices, η <code>make</code> δημιουργεί έναν κενό, αλλά έτοιμο προς χρήση map.
</p>

<h2>Προσθήκη, ενημέρωση, και διαγραφή στοιχείων</h2>

<pre><code class="lang-go">ages["someone"] = 20       // adds a new entry, OR updates an existing one — same syntax either way
delete(ages, "someone")    // removes a key (and its value) entirely from the map
</code></pre>

<p>
    Η σύνταξη είναι ίδια είτε προσθέτεις ένα εντελώς νέο κλειδί, είτε ενημερώνεις την τιμή ενός κλειδιού που υπάρχει ήδη — η Go το χειρίζεται αυτόματα, χωρίς να χρειάζεται να ελέγξεις ρητά ποιο από τα δύο συμβαίνει.
</p>

<h2>Έλεγχος ύπαρξης κλειδιού — το πρόβλημα και η λύση του</h2>

<p>
    Εδώ προκύπτει ένα ενδιαφέρον πρόβλημα: πώς ξεχωρίζεις την περίπτωση "αυτό το κλειδί υπάρχει στον map, και η τιμή του τυχαίνει να είναι 0" από την περίπτωση "αυτό το κλειδί δεν υπάρχει καθόλου στον map"; Αν έγραφες απλά <code>ages["someone"]</code> για ένα κλειδί που δεν υπάρχει, η Go θα σου επέστρεφε τη zero value του τύπου της τιμής (δηλαδή 0 για int) — ακριβώς την ίδια τιμή που θα έπαιρνες αν το κλειδί υπήρχε πραγματικά με τιμή 0. Χωρίς επιπλέον πληροφορία, δεν θα μπορούσες να ξεχωρίσεις τις δύο περιπτώσεις.
</p>

<p>
    Η λύση της Go είναι ένα δεύτερο, προαιρετικό return value κατά την αναζήτηση σε map, γνωστό ως το <strong>comma-ok pattern</strong>:
</p>

<pre><code class="lang-go">value, ok := ages["someone"]
if ok {
    fmt.Println("found:", value)
} else {
    fmt.Println("key does not exist")
}
</code></pre>

<p>
    Το δεύτερο return value, εδώ ονομασμένο <code>ok</code>, είναι τύπου <code>bool</code>: <code>true</code> αν το κλειδί όντως υπάρχει στον map, <code>false</code> αν δεν υπάρχει. Αυτό σου δίνει ρητή, ξεκάθαρη πληροφορία, χωρίς αμφισημία.
</p>

<h2>Iteration με for range</h2>

<pre><code class="lang-go">for key, value := range scores {
    fmt.Println(key, value)
}
</code></pre>

<div class="callout">
    <span class="tag">Προσοχή: μη εγγυημένη σειρά</span>
    <p>
        Σε αντίθεση με τα slices και τα arrays, όπου η <code>range</code> σου δίνει πάντα τα στοιχεία με τη φυσική, αριθμητική τους σειρά (index 0, μετά 1, μετά 2, ...), η Go <strong>δεν εγγυάται καμία συγκεκριμένη σειρά</strong> όταν διασχίζεις έναν map με <code>for range</code>. Κάθε φορά που τρέχεις το ίδιο πρόγραμμα, η σειρά με την οποία εμφανίζονται τα key/value ζεύγη μπορεί να είναι διαφορετική. Αν χρειάζεσαι σταθερή, προβλέψιμη σειρά (π.χ. αλφαβητική), πρέπει πρώτα να εξάγεις όλα τα κλειδιά σε ένα ξεχωριστό slice, και μετά να τα ταξινομήσεις μόνος σου, πριν τα διατρέξεις.
    </p>
</div>
`);
