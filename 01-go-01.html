    addContent(`<div class="eyebrow">Ενότητα 1 / 8 — Εισαγωγή &amp; Περιβάλλον</div>

<h1>Τι είναι, στην πραγματικότητα, ένα πρόγραμμα;</h1>

<p class="lede">
    Πριν μιλήσουμε καν για τη Go, ας ξεκαθαρίσουμε τι ακριβώς συμβαίνει όταν "τρέχεις" ένα πρόγραμμα — γιατί όλα τα
    επόμενα βασίζονται σε αυτό.
</p>

<p>
    Ένας υπολογιστής, στο πιο βαθύ επίπεδο, καταλαβαίνει μόνο ηλεκτρικά σήματα που αναπαριστούν δύο καταστάσεις: 0 και 1
    (binary — δυαδικό σύστημα). Κάθε εντολή που εκτελεί ο επεξεργαστής (CPU) του υπολογιστή σου είναι, τελικά, μια
    ακολουθία από 0 και 1. Αυτό λέγεται <strong>machine code</strong> (κώδικας μηχανής) — η "μητρική γλώσσα" του
    hardware.
</p>

<p>
    Είναι σχεδόν αδύνατο για έναν άνθρωπο να γράψει κατευθείαν σε machine code — θα ήταν σαν να προσπαθείς να γράψεις
    ένα βιβλίο χρησιμοποιώντας μόνο τα ψηφία 0 και 1, χωρίς γράμματα. Γι' αυτό εφευρέθηκαν οι
    <strong>γλώσσες προγραμματισμού</strong> (programming languages): συστήματα γραφής πιο κοντά στην ανθρώπινη σκέψη
    (λέξεις όπως <code>if</code>, <code>for</code>, <code>function</code>), τα οποία στη συνέχεια
    <em>μεταφράζονται</em> αυτόματα σε machine code, ώστε ο υπολογιστής να μπορεί τελικά να τα εκτελέσει.
</p>

<div class="callout">
    <span class="tag">Machine Language &amp; Assembly</span>

    <p>
        Η <strong>machine language</strong> είναι η μοναδική γλώσσα που καταλαβαίνει απευθείας ο επεξεργαστής. Κάθε
        εντολή είναι μια ακολουθία από 0 και 1, π.χ. <code>10110000 01100001</code>. Δεν έχει λέξεις, μόνο αριθμούς.
    </p>

    <p>
        Η <strong>assembly language</strong> είναι το πρώτο βήμα προς τον άνθρωπο: χρησιμοποιεί μνημονικά (π.χ.
        <code>MOV</code>, <code>ADD</code>) αντί για 0 και 1. Κάθε εντολή assembly αντιστοιχεί σε μία εντολή μηχανής,
        και ένας <em>assembler</em> τη μετατρέπει σε machine code. Η assembly είναι πολύ κοντά στο hardware, αλλά ακόμα
        δύσκολη για μεγάλα προγράμματα.
    </p>
</div>

<h2>Low-level, Mid-level, High-level — μια κλίμακα αφαίρεσης</h2>

<div class="grid3">
    <div class="card">
        <span class="card-tag">Low-level</span>

        <p><strong>Machine Language</strong> (0 και 1) και <strong>Assembly</strong> (MOV, ADD, JMP).</p>

        <p>
            Είναι άμεσα συνδεδεμένες με το hardware. Δίνουν πλήρη έλεγχο στη μνήμη και τον επεξεργαστή, αλλά απαιτούν
            γνώση της αρχιτεκτονικής του συστήματος. Π.χ. x86 Assembly, ARM Assembly.
        </p>
    </div>

    <div class="card">
        <span class="card-tag">Mid-level</span>

        <p>Γλώσσες όπως <strong>C</strong> και <strong>C++</strong>.</p>

        <p>
            Προσφέρουν αφαίρεση (μεταβλητές, συναρτήσεις, δομές ελέγχου) αλλά διατηρούν άμεση πρόσβαση στη μνήμη μέσω
            δεικτών (pointers). Ο compiler μετατρέπει τον κώδικα σε machine code, αλλά ο προγραμματιστής έχει ακόμα
            στενή επαφή με το πώς λειτουργεί ο υπολογιστής.
        </p>
    </div>

    <div class="card">
        <span class="card-tag">High-level</span>

        <p><strong>Python, Java, JavaScript, Go, Ruby</strong>.</p>

        <p>
            Ο προγραμματιστής γράφει σε μια γλώσσα κοντά στην ανθρώπινη σκέψη, χωρίς να ασχολείται με τη μνήμη ή τους
            καταχωρητές του επεξεργαστή. Ο compiler (π.χ. στη Go) ή ο interpreter (π.χ. στην Python) αναλαμβάνει όλη τη
            "βαριά δουλειά" μετάφρασης σε machine code.
        </p>
    </div>
</div>

<div class="callout">
    <span class="tag">Πού ανήκει η Go;</span>

    <p>
        Η <strong>Go</strong> ανήκει στις high-level γλώσσες, αλλά έχει χαρακτηριστικά mid-level: είναι
        <em>compiled</em> (μεταγλωττίζεται σε machine code, σαν τη C) και προσφέρει εργαλεία διαχείρισης μνήμης (garbage
        collector) χωρίς να εκθέτει τον προγραμματιστή σε δείκτες και ευάλωτες λειτουργίες. Είναι δηλαδή
        <strong>high-level με απόδοση mid-level</strong>.
    </p>
</div>

<h2>Τα οφέλη των High-level γλωσσών</h2>

<div class="glossary-columns">
    <div>
        <p>
            <strong>Αναγνωσιμότητα &amp; παραγωγικότητα</strong><br />
            Γράφεις λιγότερες γραμμές κώδικα για να κάνεις περισσότερα. Π.χ. σε C χρειάζεσαι ~50 γραμμές για έναν web
            server, σε Go ~10 με τη βιβλιοθήκη <code>net/http</code>.
        </p>

        <p>
            <strong>Μεταφεροσιμότητα (portability)</strong><br />
            Ο ίδιος κώδικας μπορεί να μεταγλωττιστεί για διαφορετικά λειτουργικά συστήματα (Windows, Linux, macOS) χωρίς
            αλλαγές, αρκεί να υπάρχει compiler για τη συγκεκριμένη πλατφόρμα.
        </p>
    </div>

    <div>
        <p>
            <strong>Αυτοματοποιημένη διαχείριση μνήμης</strong><br />
            Δεν χρειάζεται να δεσμεύεις και να ελευθερώνεις μνήμη χειροκίνητα (όπως στη C με
            <code>malloc</code>/<code>free</code>). Η Go, όπως και η Java, διαθέτει
            <strong>garbage collector</strong>
            που καθαρίζει αυτόματα τη μνήμη που δεν χρησιμοποιείται πια.
        </p>

        <p>
            <strong>Ασφάλεια &amp; λιγότερα σφάλματα</strong><br />
            Ο compiler ελέγχει τύπους δεδομένων και συντάκτικα λάθη πριν καν τρέξει το πρόγραμμα. Πολλά σφάλματα που στη
            C οδηγούν σε "crash" (π.χ. segmentation fault) στη Go εντοπίζονται στη μεταγλώττιση.
        </p>
    </div>
</div>

<div class="callout">
    <span class="tag">Η ιστορική διαδρομή</span>

    <p>
        Machine Language (δεκαετία '40) → Assembly (δεκαετία '50) → C (1972) → C++ (1985) → Java (1995) → Go (2009).<br />
        Κάθε βήμα πρόσθεσε <strong>αφαίρεση</strong>: λιγότερη επαφή με το hardware, περισσότερη έμφαση στη λογική του
        προγράμματος.
    </p>
</div>

<h2>Compiled vs Interpreted γλώσσες — δύο διαφορετικοί τρόποι "μετάφρασης"</h2>

<p>
    Υπάρχουν, σε γενικές γραμμές, δύο μεγάλες οικογένειες γλωσσών προγραμματισμού, ανάλογα με το πώς μετατρέπεται ο
    κώδικάς σου σε κάτι που ο υπολογιστής μπορεί να εκτελέσει:
</p>

<div class="grid2">
    <div class="card">
        <h3>Compiled γλώσσες</h3>

        <p>
            Ολόκληρο το πρόγραμμα μεταφράζεται <em>μία φορά</em>, πριν καν τρέξει, σε ένα αυτόνομο εκτελέσιμο αρχείο
            (machine code). Μετά, αυτό το αρχείο τρέχει απευθείας, χωρίς να χρειάζεται ξανά μετάφραση. Η Go, η C, η C++
            και η Rust ανήκουν εδώ.
        </p>
    </div>

    <div class="card">
        <h3>Interpreted γλώσσες</h3>

        <p>
            Ο κώδικας διαβάζεται και εκτελείται γραμμή-γραμμή, "εν κινήσει", από ένα ειδικό πρόγραμμα (τον interpreter),
            κάθε φορά που τρέχει το πρόγραμμα. Η Python και η JavaScript (στις πιο απλές τους μορφές) ανήκουν εδώ.
        </p>
    </div>
</div>

<p>
    Το πρόγραμμα που κάνει αυτή τη μία-φορά μετάφραση σε compiled γλώσσες λέγεται
    <strong>compiler</strong> (μεταγλωττιστής). Η Go διαθέτει τον δικό της compiler, ο οποίος διαβάζει τα αρχεία
    <code>.go</code> που γράφεις και παράγει ένα εκτελέσιμο αρχείο, έτοιμο να τρέξει απευθείας στο λειτουργικό σου
    σύστημα (Windows, macOS, ή Linux) χωρίς να χρειάζεται τίποτα άλλο εγκατεστημένο.
</p>

<div class="callout">
    <span class="tag">Γιατί έχει σημασία για εσένα ως αρχάριο</span>

    <p>
        Επειδή η Go είναι compiled, ο compiler σου ελέγχει τον κώδικα <strong>πριν</strong> καν τρέξεις το πρόγραμμα,
        και αν βρει λάθος (π.χ. λάθος τύπο μεταβλητής, ξεχασμένη παρένθεση) αρνείται εντελώς να παράξει εκτελέσιμο
        αρχείο, δίνοντάς σου ένα μήνυμα σφάλματος. Αυτό μοιάζει αρχικά "αυστηρό", αλλά στην πραγματικότητα σε
        προστατεύει: πολλά bugs που σε άλλες γλώσσες θα εμφανίζονταν μόνο όταν έτρεχε συγκεκριμένος κώδικας (ίσως και
        μήνες αργότερα, σε παραγωγή), στη Go εντοπίζονται αμέσως, στο γραφείο σου, πριν καν πατήσεις "τρέξε".
    </p>
</div>

`);

<div class="eyebrow">Ενότητα 1 / 8 — Εισαγωγή &amp; Περιβάλλον</div>

<h1>Γιατί δημιουργήθηκε η Go</h1>

<p class="lede">
    Κάθε γλώσσα προγραμματισμού δημιουργείται για να λύσει συγκεκριμένα προβλήματα. Κατανοώντας το "γιατί" πίσω από τη
    Go, θα καταλαβαίνεις καλύτερα και το "γιατί" πίσω από πολλές αποφάσεις σχεδίασής της που θα συναντάς σε όλον αυτόν
    τον οδηγό.
</p>

<p>
    Η Go (μερικές φορές αναφέρεται και ως "Golang", απλά και μόνο επειδή το <code>go.org</code> ήταν ήδη κατειλημμένο ως
    domain name — το επίσημο όνομα της γλώσσας είναι απλά "Go") δημιουργήθηκε στη Google, ξεκινώντας το 2007 και
    ανακοινώθηκε δημόσια το 2009. Οι δημιουργοί της, Robert Griesemer, Rob Pike και Ken Thompson, ήταν έμπειροι
    μηχανικοί λογισμικού που αντιμετώπιζαν καθημερινά συγκεκριμένα προβλήματα σε τεράστια, πολύπλοκα codebases (σύνολα
    πηγαίου κώδικα) της Google:
</p>

<ul>
    <li>
        Οι υπάρχουσες compiled γλώσσες (κυρίως η C++) είχαν αργές μεταγλωττίσεις — σε projects εκατομμυρίων γραμμών
        κώδικα, μια μεταγλώττιση μπορούσε να πάρει πολλά λεπτά, ή ακόμα και ώρες, επιβραδύνοντας δραματικά την ανάπτυξη.
    </li>

    <li>
        Η C++ είχε γίνει με τον καιρό εξαιρετικά πολύπλοκη, με πολλαπλά "στυλ" προγραμματισμού (paradigms) που
        συνυπήρχαν, κάνοντας δύσκολο να συνεννοηθούν μεγάλες ομάδες μηχανικών για το "σωστό" τρόπο να γράφουν κώδικα.
    </li>

    <li>
        Η διαχείριση εξαρτήσεων (dependencies — εξωτερικός κώδικας που χρησιμοποιεί το πρόγραμμά σου) ήταν αγκάθι σε
        πολλές γλώσσες, με πολύπλοκα εργαλεία και ασαφείς κανόνες.
    </li>
</ul>

<p>
    Η Go σχεδιάστηκε γύρω από τρεις βασικούς πυλώνες:
    <strong>απλότητα</strong>, <strong>ταχύτητα</strong> και <strong>συντηρησιμότητα</strong>. Ας δούμε τι σημαίνει ο
    καθένας συγκεκριμένα, γιατί δεν είναι απλά "buzzwords" — αντικατοπτρίζονται άμεσα σε πραγματικές σχεδιαστικές
    αποφάσεις της γλώσσας που θα συναντάς συνέχεια.
</p>

<div class="grid3">
    <div class="card">
        <h3>Απλότητα</h3>

        <p>
            Η Go έχει σκόπιμα μικρή γραμματική (μόλις 25 λέξεις-κλειδιά, σε σύγκριση με πολύ περισσότερες σε άλλες
            γλώσσες). Υπάρχει συνήθως ένας "σωστός" τρόπος να κάνεις κάτι, όχι δέκα εναλλακτικοί — αυτό σημαίνει
            λιγότερες αποφάσεις στυλ και λιγότερες διαφωνίες σε ομαδική δουλειά.
        </p>
    </div>

    <div class="card">
        <h3>Ταχύτητα</h3>

        <p>
            Ως compiled γλώσσα, η Go παράγει native machine code, χωρίς ενδιάμεσο "εικονικό περιβάλλον" εκτέλεσης
            (virtual machine) όπως έχουν άλλες γλώσσες. Επιπλέον, ο ίδιος ο compiler της Go σχεδιάστηκε ειδικά ώστε να
            είναι εξαιρετικά γρήγορος, ακόμα και σε τεράστια projects.
        </p>
    </div>

    <div class="card">
        <h3>Συντηρησιμότητα</h3>

        <p>
            Η Go έρχεται με ενσωματωμένο εργαλείο αυτόματης μορφοποίησης κώδικα (<code>go fmt</code>, θα το δούμε
            αναλυτικά παρακάτω), ξεκάθαρα μηνύματα σφάλματος, και μια φιλοσοφία "σύμβαση πάνω από ρύθμιση" — δηλαδή
            προτιμά έναν κοινά αποδεκτό τρόπο οργάνωσης αντί να σε αφήνει να αποφασίσεις τα πάντα μόνος σου.
        </p>
    </div>
</div>

<p>
    Μια ακόμα σημαντική σχεδιαστική επιλογή: η Go αποφασίστηκε σκόπιμα να <em>μην</em> περιλαμβάνει κάποια
    χαρακτηριστικά που άλλες γλώσσες θεωρούν αυτονόητα — δεν έχει κλασική κληρονομικότητα (inheritance) μεταξύ "κλάσεων"
    όπως έχουν οι object-oriented γλώσσες, δεν είχε αρχικά generics (προστέθηκαν πολύ αργότερα, στην έκδοση 1.18, το
    2022), και δεν έχει exceptions με μπλοκ try/catch για τον χειρισμό σφαλμάτων. Αντί γι' αυτά, η Go προτιμά ρητά,
    απλά, ξεκάθαρα patterns — κάτι που θα το βλέπεις κυριολεκτικά σε κάθε ενότητα αυτού του οδηγού, ειδικά όταν φτάσουμε
    στα σφάλματα (errors) και τις συναρτήσεις.
</p>

<div class="callout">
    <span class="tag">Go Concurrency</span>
    <p>
        Η Go έγινε ιδιαίτερα δημοφιλής και χρήσιμη χάρη σε ένα ακόμα κεντρικό χαρακτηριστικό της: τις
        <strong>goroutines</strong>. Οι goroutines είναι ελαφριές "διεργασίες" (lightweight threads) που μπορούν να
        τρέχουν ταυτόχρονα (concurrently) με εξαιρετικά μικρό κόστος εκκίνησης και μνήμης. Αυτό επιτρέπει στη Go να
        χειρίζεται εύκολα χιλιάδες ή και εκατομμύρια ταυτόχρονες εργασίες ταυτόχρονα — από web servers που εξυπηρετούν
        χιλιάδες requests μέχρι εφαρμογές δικτύου που επεξεργάζονται μεγάλο όγκο δεδομένων. Δεν θα ασχοληθούμε προς το
        παρόν με τις goroutines σε αυτό το guide, αλλά να ξέρεις από τώρα ότι είναι ένας από τους σημαντικότερους λόγους
        που η Go επιλέγεται για σύγχρονα, κατανεμημένα συστήματα.
    </p>
</div>

`);

<div class="eyebrow">Ενότητα 1 / 8 — Εισαγωγή &amp; Περιβάλλον</div>

<h1>Εγκατάσταση &amp; Setup</h1>

<p class="lede">
    Ας περάσουμε τώρα από τη θεωρία στην πράξη: τι χρειάζεσαι εγκατεστημένο στον υπολογιστή σου για να γράφεις και να
    τρέχεις κώδικα Go.
</p>

<h2>Το Go Toolchain (Go SDK)</h2>

<p>
    Ο όρος <strong>toolchain</strong> (ή <strong>SDK</strong> — Software Development Kit) αναφέρεται σε ένα ολοκληρωμένο
    πακέτο εργαλείων που χρειάζεσαι για να αναπτύξεις λογισμικό σε μια συγκεκριμένη γλώσσα. Το Go Toolchain κατεβαίνει
    δωρεάν από την επίσημη σελίδα <code>go.dev/dl</code>
    και είναι διαθέσιμο για Windows, macOS και Linux. Η εγκατάσταση είναι απλή — κατεβάζεις τον installer για το
    λειτουργικό σου σύστημα και ακολουθείς τα βήματα.
</p>

<h2>VS Code + Go extension</h2>

<p>
    Το μόνο που χρειάζεσαι για να γράφεις κώδικα Go είναι ο δωρεάν editor <strong>VS Code</strong> της Microsoft. Μετά
    την εγκατάστασή του, ανοίγεις το VS Code, πας στις επεκτάσεις (Extensions), ψάχνεις για "Go" και εγκαθιστάς την
    επίσημη επέκταση της Google.
</p>

<br>
<h1>Το Πρώτο σου Πρόγραμμα — Ανατομία του main.go</h1>

<p class="lede">
    Ήρθε η ώρα να δούμε πραγματικό κώδικα Go για πρώτη φορά. Θα εξηγήσουμε κυριολεκτικά κάθε λέξη — τίποτα δεν θεωρείται
    δεδομένο.
</p>

<pre><code><span class="tok-com">// declares which package this file belongs to</span>
<span class="tok-kw">package</span> <span class="tok-func">main</span>

<span class="tok-kw">import</span> <span class="tok-str">"fmt"</span>

<span class="tok-com">// the entry point: execution starts here</span>
<span class="tok-kw">func</span> <span class="tok-func">main</span>() {
    fmt.<span class="tok-func">Println</span>(<span class="tok-str">"Hello, World!"</span>)
}
</code></pre>

<h2>Γραμμή προς γραμμή</h2>

<p>
    <strong><code>package main</code></strong> — Για την ώρα, το μόνο που χρειάζεται να ξέρεις είναι ότι
    <strong>αν θέλεις ο κώδικάς σου να τρέξει αυτόνομα</strong>, το package <strong>πρέπει</strong> να ονομάζεται
    <code>main</code>. Αν το ονομάσεις αλλιώς, ο compiler θα το δει ως βιβλιοθήκη, όχι ως εκτελέσιμο πρόγραμμα. Θα δούμε
    τι ακριβώς είναι τα packages σε επόμενη ενότητα.
</p>

<p>
    <strong><code>import "fmt"</code></strong> — Η λέξη-κλειδί <code>import</code> φέρνει στο αρχείο σου κώδικα που έχει
    γραφτεί αλλού. Εδώ εισάγουμε το package <code>fmt</code>, που περιέχει συναρτήσεις για είσοδο/έξοδο κειμένου, όπως
    το να εμφανίζεις κάτι στην οθόνη. Στον προγραμματισμό λέμε <strong>"τυπώνω"</strong> (print) αντί για "εμφανίζω" —
    είναι ιστορικός όρος από τις μηχανές εκτύπωσης. Σήμερα σημαίνει απλά <em>να γράψεις κείμενο στο terminal</em>.
</p>

<p>
    <strong><code>func main()</code></strong> — Η λέξη-κλειδί <code>func</code> ξεκινά τον ορισμό μιας
    <strong>συνάρτησης</strong> (function). Θα εξηγήσουμε τις συναρτήσεις πλήρως στην Ενότητα 6, αλλά για τώρα αρκεί να
    ξέρεις ότι μια συνάρτηση είναι ένα ονομασμένο "κομμάτι" κώδικα που μπορεί να εκτελεστεί όταν το καλέσεις. Η
    συνάρτηση <code>main</code>, μέσα σε ένα <code>package main</code>, έχει επίσης ειδική σημασία: είναι το υποχρεωτικό
    <strong>entry point</strong> (σημείο εκκίνησης) του προγράμματος. Όταν το εκτελέσιμο αρχείο τρέξει, η εκτέλεση
    ξεκινά ακριβώς από την πρώτη γραμμή μέσα σε αυτή τη συνάρτηση, και προχωρά γραμμή προς γραμμή προς τα κάτω, εκτός αν
    συναντήσει μια κλήση σε άλλη συνάρτηση (οπότε "πηδά" εκεί προσωρινά) ή μια δομή ελέγχου ροής (θα τις δούμε στην
    Ενότητα 4).
</p>

<p>
    <strong><code>fmt.Println("Hello, World!")</code></strong> — Εδώ <em>καλούμε</em> (call) τη συνάρτηση
    <code>Println</code>, η οποία ανήκει στο package <code>fmt</code> που εισάγαμε παραπάνω — γι' αυτό γράφεται
    <code>fmt.Println</code> (πακέτο, τελεία, συνάρτηση). Η <code>Println</code> τυπώνει στο terminal (τη γραμμή
    εντολών) οτιδήποτε της δώσεις ως όρισμα (argument) — εδώ, το κείμενο <code>"Hello, World!"</code> — και μετά
    προσθέτει αυτόματα μια νέα γραμμή, ώστε το επόμενο πράγμα που θα τυπωθεί να ξεκινήσει από καινούρια γραμμή.
</p>

<div class="callout">
    <span class="tag">Κανόνας: κάθε πρόγραμμα Go χρειάζεται ακριβώς μία func main()</span>

    <p>
        Μέσα σε ένα εκτελέσιμο πρόγραμμα (package main), πρέπει να υπάρχει <strong>ακριβώς μία</strong> συνάρτηση
        <code>main()</code>, χωρίς παραμέτρους εισόδου και χωρίς τιμή επιστροφής. Αν λείπει, ή αν υπάρχουν δύο, ο
        compiler αρνείται να παράξει εκτελέσιμο αρχείο.
    </p>
</div>

<div class="callout">
    <span class="tag">Whitespace — κενά και αλλαγές γραμμής</span>
    <p>
        Στη Go, ο compiler αγνοεί τα επιπλέον κενά, τις αλλαγές γραμμής (newlines) και τις εσοχές (indentation) — όσα
        κενά και enter και να πατήσεις, μετράνε σαν ένα. Μπορείς να γράψεις ολόκληρο το πρόγραμμα σε μία γραμμή και θα
        μεταγλωττιστεί κανονικά (αν και θα είναι εντελώς δυσανάγνωστο). Αυτό που έχει σημασία είναι να υπάρχει κενό εκεί
        που χρειάζεται, π.χ. ανάμεσα σε λέξεις-κλειδιά και ονόματα μεταβλητών.
    </p>
    <pre><code class="lang-go">// Τα ακόλουθα 2 παραδείγματα είναι ισοδύναμα για τον compiler:

package main
import "fmt"
func main() { fmt.Println("Hello, World!") }

/*
Το ίδιο πρόγραμμα με περισσότερα κενά και νέες γραμμές:
*/

package     main

import
    "fmt"

func
main()
{
    fmt.Println("Hello, World!")
}</code></pre>
    <p>
        Τα σχόλια στη Go είναι τύπου C: το <code>//</code> σχολιάζει όσα βρίσκονται μετά από αυτό μέχρι το τέλος της
        γραμμής — ό,τι ακολουθεί μετά από <code>//</code> αγνοείται από τον compiler και υπάρχει εκεί απλά για να το
        διαβάσουμε εμείς. Το <code>/* ... */</code> σχολιάζει οτιδήποτε βρίσκεται ανάμεσά τους, ακόμα και σε πολλές
        γραμμές.
    </p>
</div>

<br>
<h1>Το Go CLI — Δουλεύοντας από τη γραμμή εντολών</h1>

<p class="lede"> Για να τρέξεις Go κώδικα, θα χρησιμοποιείς το <code>terminal</code> (τη γραμμή εντολών) — εκεί πληκτρολογείς εντολές που ξεκινούν με τη λέξη <code>go</code>, ακολουθούμενη από το τι θέλεις να κάνεις. </p>


<h2>Οι τρεις πιο συχνά χρησιμοποιούμενες υποεντολές</h2>

<div class="grid3">
    <div class="card">
        <h3><code>go run</code></h3>
        <p>
            Παίρνει τον πηγαίο κώδικα, τον μεταγλωττίζει σε ένα <em>προσωρινό</em> εκτελέσιμο αρχείο,
            το τρέχει αμέσως, και μετά το πετάει.
            Χρησιμοποιείται κατά την ανάπτυξη, όταν θέλεις να δεις γρήγορα αν δουλεύει κάτι.
        </p>
        <code>go run main.go</code>
    </div>

    <div class="card">
        <h3><code>go build</code></h3>
        <p>
            Μεταγλωττίζει τον κώδικα σε ένα <em>μόνιμο</em> εκτελέσιμο αρχείο,
            αποθηκευμένο στον τρέχοντα φάκελο, χωρίς να το τρέξει.
            Αυτό το αρχείο μπορείς να το δώσεις σε άλλους ή να το ανεβάσεις σε server.
        </p>
        <code>go build -o myapp.exe main.go</code>
    </div>

    <div class="card">
        <h3><code>go fmt</code></h3>
        <p>
            Μορφοποιεί αυτόματα τον κώδικα σύμφωνα με τα επίσημα πρότυπα της Go.
            Στην πράξη, δεν χρειάζεται να το τρέξεις χειροκίνητα —
            το VS Code το κάνει <strong>μόνο του κάθε φορά που αποθηκεύεις</strong> το αρχείο.
            Έτσι, όλοι οι προγραμματιστές γράφουν με τον ίδιο τρόπο (κενά - αλλαγή γραμμής), χωρίς διαφωνίες περί "στυλ".
        </p>
    </div>
</div>

<p>
    Στην πράξη, όσο αναπτύσσεις το πρόγραμμά σου δοκιμάζοντας αλλαγές, θα χρησιμοποιείς σχεδόν αποκλειστικά
    <code>go run main.go</code> (όπου <code>main.go</code> είναι το όνομα του αρχείου σου) — γρήγορο, χωρίς να αφήνει
    πίσω του άσχετα αρχεία. Μόνο όταν το πρόγραμμα είναι πραγματικά έτοιμο για να "παραδοθεί" ή να τρέξει σε άλλο
    μηχάνημα, τρέχεις <code>go build</code> για να πάρεις το τελικό, αυτόνομο εκτελέσιμο αρχείο.
</p>`);

<div class="eyebrow">Ενότητα 2 / 8 — Μεταβλητές &amp; Τύποι</div>
<h1>Τι είναι μια Μεταβλητή;</h1>
<p class="lede">Πριν δούμε τη σύνταξη της Go, ας καταλάβουμε πλήρως τι σημαίνει η ίδια η έννοια "μεταβλητή" — γιατί θα τη χρησιμοποιείς κυριολεκτικά σε κάθε γραμμή κώδικα που θα γράψεις από εδώ και πέρα.</p>

<p>Όταν ένα πρόγραμμα τρέχει, ο υπολογιστής χρησιμοποιεί ένα κομμάτι της μνήμης του (RAM) για να αποθηκεύει προσωρινά δεδομένα που χρειάζεται — αριθμούς, κείμενο, οτιδήποτε. Η μνήμη αυτή μπορεί να φανταστεί σαν μια τεράστια σειρά από "κουτάκια", το καθένα με τη δική του, μοναδική αριθμητική διεύθυνση (address) — κάτι σαν τους αριθμούς σε ένα τεράστιο ξενοδοχείο με εκατομμύρια δωμάτια.</p>

<p>Μια <strong>μεταβλητή</strong> (variable) είναι, ουσιαστικά, ένα <em>ονομασμένο</em> κουτάκι μνήμης, στο οποίο μπορείς να αποθηκεύσεις μια τιμή, να τη διαβάσεις αργότερα, και —όπως λέει και το όνομα— να την αλλάξεις (να τη "μεταβάλλεις") όποτε χρειάζεται. Αντί να αναφέρεσαι στο κουτάκι με την ακριβή διεύθυνσή του στη μνήμη (κάτι δύσχρηστο και δυσανάγνωστο για έναν άνθρωπο), του δίνεις ένα όνομα που εσύ επιλέγεις — π.χ. <code>age</code>, <code>total</code>, <code>isReady</code> — και ο compiler αναλαμβάνει να θυμάται πού ακριβώς βρίσκεται αυτό το κουτάκι στη μνήμη.</p>

<div class="callout">
  <span class="tag">Μια αναλογία: το ντουλάπι με την ετικέτα</span>
  Φαντάσου ένα τεράστιο δωμάτιο γεμάτο ντουλάπια, το καθένα με έναν αριθμό σειράς πάνω του (η "διεύθυνση μνήμης"). Αντί να θυμάσαι "το πράγμα που με ενδιαφέρει είναι στο ντουλάπι Νο. 4.482.991", κολλάς μια ετικέτα πάνω στο ντουλάπι που λέει, π.χ., "age". Από εδώ και πέρα, μπορείς να ζητήσεις "άνοιξε το ντουλάπι με την ετικέτα ηλικία" χωρίς να θυμάσαι καθόλου τον πραγματικό αριθμό. Αυτό ακριβώς κάνει μια μεταβλητή — σου δίνει ένα βολικό, ανθρώπινο όνομα για ένα κομμάτι μνήμης.
</div>

<h2>Γιατί χρειάζεται και τύπος (type), όχι μόνο όνομα;</h2>
<p>Δεν αρκεί απλά να πεις "θέλω ένα κουτάκι με το όνομα <code>age</code>" — ο υπολογιστής χρειάζεται επίσης να ξέρει <em>τι είδους δεδομένα</em> θα αποθηκευτούν εκεί, γιατί διαφορετικά είδη δεδομένων χρειάζονται διαφορετικό χώρο στη μνήμη και υποστηρίζουν διαφορετικές πράξεις. Ένας ακέραιος αριθμός (π.χ. 25) αποθηκεύεται διαφορετικά από ένα κομμάτι κειμένου (π.χ. "Καλημέρα"), και δεν έχει νόημα να "προσθέσεις" δύο κομμάτια κειμένου μεταξύ τους με τον ίδιο τρόπο που προσθέτεις δύο αριθμούς.</p>
<p>Η Go είναι μια <strong>statically typed</strong> γλώσσα (στατικά τυποποιημένη): αυτό σημαίνει ότι ο τύπος κάθε μεταβλητής καθορίζεται και ελέγχεται από τον compiler <em>κατά τη μεταγλώττιση</em> — δηλαδή πριν καν τρέξει το πρόγραμμα — και δεν μπορεί να αλλάξει αργότερα κατά την εκτέλεση. Αυτό διαφέρει από γλώσσες όπως η Python, όπου μια μεταβλητή μπορεί να "κρατά" έναν αριθμό σε ένα σημείο του προγράμματος και ένα κομμάτι κειμένου σε άλλο σημείο — κάτι που δεν επιτρέπεται στη Go.</p>
`);

<div class="eyebrow">Ενότητα 2 / 8 — Μεταβλητές &amp; Τύποι</div>
<h1>Δήλωση Μεταβλητών στην Go</h1>
<p class="lede">Ας δούμε τώρα πώς γράφεις πραγματικά μια δήλωση μεταβλητής στη Go, ξεκινώντας από τον πιο ρητό, "μεγαλόφωνο" τρόπο.</p>

<p>Ο πιο ρητός τρόπος να δηλώσεις μια μεταβλητή στη Go είναι με τη λέξη-κλειδί <code>var</code> (συντομογραφία του "variable"), ακολουθούμενη από το όνομα που εσύ επιλέγεις, και μετά τον τύπο:</p>
<pre><code><span class="tok-kw">var</span> age <span class="tok-type">int</span>
<span class="tok-kw">var</span> name <span class="tok-type">string</span> = <span class="tok-str">"Unknown"</span>
</code></pre>
<p>Στην πρώτη γραμμή, δηλώνουμε μια μεταβλητή με όνομα <code>age</code> και τύπο <code>int</code> (ακέραιος αριθμός), χωρίς να της δώσουμε ρητά αρχική τιμή. Στη δεύτερη γραμμή, δηλώνουμε μια μεταβλητή <code>name</code> τύπου <code>string</code> (συμβολοσειρά κειμένου) και της δίνουμε αμέσως την αρχική τιμή <code>"Unknown"</code>.</p>

<h2>Τι συμβαίνει όταν δεν δίνεις αρχική τιμή; Οι Zero Values</h2>
<p>Σε πολλές γλώσσες χαμηλού επιπέδου, μια μεταβλητή που δηλώνεται χωρίς αρχική τιμή περιέχει ό,τι τυχαία bits βρίσκονταν ήδη σε εκείνο το σημείο της μνήμης από προηγούμενη χρήση, κάτι που μπορεί να οδηγήσει σε απρόβλεπτη συμπεριφορά. Η Go αποφεύγει εντελώς αυτό το πρόβλημα: κάθε τύπος έχει μια καθορισμένη <strong>zero value</strong> (μηδενική τιμή), και κάθε μεταβλητή που δηλώνεται χωρίς ρητή αρχικοποίηση παίρνει αυτόματα αυτή την τιμή.</p>
<ul>
  <li>Αριθμητικοί τύποι (όπως <code>int</code>, <code>float64</code>) → zero value: <code>0</code></li>
  <li><code>string</code> → zero value: <code>""</code> (κενό string, χωρίς χαρακτήρες)</li>
  <li><code>bool</code> → zero value: <code>false</code></li>
  <li>Δείκτες, slices, maps, κ.ά. (θα τα δούμε στις Ενότητες 7-8) → zero value: <code>nil</code>, μια ειδική τιμή που σημαίνει "καμία τιμή/κανένας προορισμός"</li>
</ul>
<p>Αυτό σημαίνει ότι το πρόγραμμά σου <em>ποτέ</em> δεν βρίσκεται σε απροσδιόριστη κατάσταση εξαιτίας ξεχασμένης αρχικοποίησης — πάντα ξέρεις ακριβώς τι τιμή έχει μια νέα μεταβλητή, ακόμα κι αν δεν την όρισες ρητά.</p>

<h2>Η ανάθεση τιμής με τον τελεστή = (Assignment)</h2>

<p>
    Αφού μια μεταβλητή έχει δηλωθεί, μπορείς να της δώσεις μια τιμή (σε ξεχωριστή εντολή) χρησιμοποιώντας τον τελεστή
    <code>=</code>. Αυτή η διαδικασία λέγεται <strong>ανάθεση (assignment)</strong>.
</p>

<p>
    Ο τελεστής <code>=</code> λειτουργεί ως εξής: <strong>πρώτα υπολογίζει</strong> οτιδήποτε βρίσκεται στη δεξιά του
    πλευρά, και μετά <strong>εκχωρεί</strong> (αποθηκεύει) αυτή την τιμή στη μεταβλητή που βρίσκεται στην αριστερή του
    πλευρά.
</p>

<pre><code class="lang-go">var width int   // δήλωση μεταβλητής
width = 5       // ανάθεση: η τιμή 5 αποθηκεύεται στη width
</code></pre>

<p>Μια μεταβλητή μπορεί να δεχτεί νέα τιμή όποτε θέλουμε — η παλιά τιμή απλά αντικαθίσταται:</p>

<pre><code class="lang-go">age := 25       // δήλωση + αρχικοποίηση
fmt.Println(age) // 25

age = 30        // ανάθεση νέας τιμής
fmt.Println(age) // 30

age = age + 1   // πρώτα υπολογίζεται το age + 1 (30+1=31),
                // μετά η τιμή 31 εκχωρείται στην age
fmt.Println(age) // 31
</code></pre>

<p>
    Στην τρίτη γραμμή, το <code>age + 1</code> υπολογίζεται πρώτα, και το αποτέλεσμα (31) εκχωρείται στην
    <code>age</code>, αντικαθιστώντας την προηγούμενη τιμή της (30).
</p>

<div class="callout">
    <span class="tag">Προσοχή: Μην μπερδεύεις το = με το ==</span>
    <p>
        Ο τελεστής <code>=</code> (<strong>ανάθεση</strong>) είναι διαφορετικός από τον τελεστή
        <code>==</code> (<strong>σύγκριση</strong>).
    </p>
    <ul>
        <li><code>x = 5</code> — <em>αναθέτει</em> την τιμή 5 στη μεταβλητή x (αλλάζει την τιμή της)</li>
        <li>
            <code>x == 5</code> — <em>συγκρίνει</em> αν η μεταβλητή x είναι ίση με 5, και επιστρέφει <code>true</code> ή
            <code>false</code>
            (χωρίς να αλλάζει τίποτα)
        </li>
    </ul>
</div>


<h2>Σύντομη δήλωση με τον τελεστή :=</h2>
<p>Μέσα σε συναρτήσεις (όχι στο επίπεδο του package, εκτός κάθε συνάρτησης — θα δούμε τη διάκριση αναλυτικά στην Ενότητα 6), η Go σού προσφέρει έναν πιο σύντομο τρόπο να δηλώσεις <em>και</em> να αρχικοποιήσεις μια μεταβλητή σε ένα μόνο βήμα, με τον τελεστή <code>:=</code>:</p>
<pre><code>age <span class="tok-kw">:=</span> <span class="tok-num">25</span>
name <span class="tok-kw">:=</span> <span class="tok-str">"Unknown"</span>
</code></pre>
<p>Παρατήρησε ότι εδώ δεν γράψαμε καθόλου τον τύπο (<code>int</code> ή <code>string</code>) — και όμως, η μεταβλητή <em>έχει</em> έναν συγκεκριμένο τύπο, ακριβώς όπως πριν. Αυτό γίνεται επειδή ο compiler κάνει <strong>type inference</strong> (εξαγωγή τύπου): κοιτάζει την τιμή στα δεξιά του <code>:=</code> και συμπεραίνει αυτόματα ποιος τύπος ταιριάζει. Το <code>25</code> είναι προφανώς ακέραιος αριθμός, άρα το <code>age</code> γίνεται τύπου <code>int</code>. Το <code>"Unknown"</code> είναι κείμενο μέσα σε εισαγωγικά, άρα το <code>name</code> γίνεται τύπου <code>string</code>. Μετά από αυτό το σημείο, η μεταβλητή έχει πλέον σταθερό τύπο — δεν μπορείς να της αναθέσεις αργότερα μια τιμή διαφορετικού τύπου.</p>

<p>Το <code>:=</code> είναι το πιο συχνά χρησιμοποιούμενο μοτίβο μέσα σε σώματα συναρτήσεων, ακριβώς επειδή είναι πιο σύντομο και το type inference καλύπτει τις περισσότερες περιπτώσεις χωρίς απώλεια σαφήνειας. Το <code>var</code> παραμένει απαραίτητο σε τρεις περιπτώσεις: (1) όταν θες μόνο τη zero value, χωρίς καμία αρχικοποίηση, (2) όταν δηλώνεις μεταβλητή στο επίπεδο του package, εκτός κάθε συνάρτησης, όπου το <code>:=</code> απαγορεύεται εντελώς, ή (3) όταν θες να επιβάλεις ρητά διαφορετικό τύπο από αυτόν που θα συμπέρανε αυτόματα ο compiler (π.χ. <code>var x float64 = 5</code> αντί για το inferred <code>int</code>).</p>

<h2>Δήλωση πολλαπλών μεταβλητών</h2>

<p>
  Η Go επιτρέπει να δηλώσεις πολλές μεταβλητές μαζί,
  είτε συμπτυγμένα σε μία γραμμή,
  είτε ομαδοποιημένα σε ένα block με τη λέξη <code>var</code>
  ακολουθούμενη από παρένθεση —
  χρήσιμο όταν θες να οργανώσεις οπτικά πολλές σχετικές δηλώσεις μαζί:
</p>

<pre><code class="lang-go">// three (n) variables declared and assigned on one line:
x, y, z := 10, 20, 30

// block declaration (var block):
var (
    width  int  = 100
    height int  = 50
    active bool = true
)
</code></pre>

<h2>Παραδείγματα στην πράξη</h2>

<p>
  Ας δούμε μερικά απλά παραδείγματα που δείχνουν πώς συμπεριφέρονται οι μεταβλητές στη Go.
</p>

<h3>1. Αλλαγή τιμής μιας μεταβλητής</h3>

<pre><code class="lang-go">age := 25
fmt.Println(age) // 25

age = 26          // η τιμή αλλάζει
fmt.Println(age) // 26
</code></pre>

<p>
  Όπως βλέπεις, η μεταβλητή <code>age</code> ξεκινά με την τιμή <code>25</code>,
  και αργότερα την αλλάζουμε σε <code>26</code>.
  Αυτό ακριβώς σημαίνει "μεταβλητή" — η τιμή της <em>μεταβάλλεται</em>.
  Η αρχική δήλωση έγινε με <code>:=</code> (δήλωση + αρχικοποίηση),
  ενώ η αλλαγή τιμής γίνεται με απλό <code>=</code> (ανάθεση, χωρίς ξαναδήλωση).
</p>

<h3>2. Το κλασικό λάθος: ξαναδήλωση με <code>:=</code></h3>

<pre><code class="lang-go">x := 10
x := 20 // ERROR: no new variables on left side of :=
</code></pre>

<p>
  Ο τελεστής <code>:=</code> <strong>δηλώνει</strong> <em>και</em> αρχικοποιεί μια <strong>νέα</strong> μεταβλητή.
  Αν η μεταβλητή έχει ήδη δηλωθεί στο ίδιο scope,
  η Go αρνείται να την ξαναδηλώσει και πετάει σφάλμα μεταγλώττισης.
  Για να αλλάξεις την τιμή μιας υπάρχουσας μεταβλητής,
  χρησιμοποιείς απλό <code>=</code>, όχι <code>:=</code>.
</p>

<h3>3. Αχρησιμοποίητες μεταβλητές — σφάλμα</h3>

<pre><code class="lang-go">y := 42
// η y δεν χρησιμοποιείται πουθενά
// ERROR: y declared but not used
</code></pre>

<p>
  Στη Go, <strong>κάθε μεταβλητή που δηλώνεις πρέπει να χρησιμοποιείται</strong>.
  Αν δηλώσεις μια μεταβλητή και δεν τη διαβάσεις ή δεν τη χρησιμοποιήσεις
  (ακόμα και αν της έχεις δώσει τιμή),
  ο compiler αρνείται να μεταγλωττίσει το πρόγραμμα.
  Αυτό είναι σκόπιμο: αποτρέπει τη συσσώρευση νεκρού κώδικα
  και κρατά τα προγράμματα καθαρά.
</p>

<h1>Βασικοί Τύποι Δεδομένων</h1>

<p class="lede">Ας δούμε αναλυτικά τους βασικούς "δομικούς λίθους" τύπων που θα χρησιμοποιείς συνέχεια στη Go.</p>

<h2>Ακέραιοι (Integers)</h2>

<p>
    Ένας <strong>ακέραιος</strong> (integer) είναι ένας αριθμός χωρίς δεκαδικό μέρος — π.χ. <code>0</code>,

    ένας τύπος, τόσο μεγαλύτερο εύρος τιμών μπορεί να αναπαραστήσει, αλλά και τόσο περισσότερη μνήμη καταλαμβάνει:
</p>

<ul>
    <li>
        <code>int8</code>, <code>int16</code>, <code>int32</code>, <code>int64</code> — signed ακέραιοι, δηλαδή μπορούν
        να είναι θετικοί ή αρνητικοί. Ο αριθμός στο όνομα δείχνει πόσα bits χρησιμοποιεί ο τύπος.
    </li>
    <li>
        <code>uint8</code>, <code>uint16</code>, <code>uint32</code>, <code>uint64</code> — unsigned ακέραιοι, δηλαδή
        δέχονται μόνο τιμές μηδέν ή θετικές, ποτέ αρνητικές. Επειδή δεν "σπαταλούν" κανένα bit για να αναπαραστήσουν το
        πρόσημο, μπορούν να αναπαραστήσουν διπλάσιο θετικό εύρος τιμών σε σχέση με τον αντίστοιχο signed τύπο ίδιου
        μεγέθους.
    </li>
</ul>

<p>
    Ο τύπος <code>int</code>, χωρίς κανέναν αριθμό δίπλα του, είναι ο πιο συνηθισμένος στην καθημερινή χρήση — είναι ο
    "προεπιλεγμένος" ακέραιος τύπος. Το ακριβές μέγεθός του (32 ή 64 bits) εξαρτάται τεχνικά από την αρχιτεκτονική του
    συστήματος στο οποίο μεταγλωττίζεται το πρόγραμμα, αλλά σε πρακτικά όλα τα σύγχρονα συστήματα σήμερα (2026) είναι

    συγκεκριμένο λόγο να επιλέξεις κάτι διαφορετικό — π.χ. εξοικονόμηση μνήμης όταν αποθηκεύεις εκατομμύρια τιμές μαζί,

<h3>Overflow — τι συμβαίνει όταν μια τιμή ξεπεράσει τα όριά της;</h3>

<p>
    Κάθε ακέραιος τύπος έχει ένα συγκεκριμένο, πεπερασμένο εύρος τιμών που μπορεί να αναπαραστήσει. Για παράδειγμα, ένας
    <code>int8</code> μπορεί να κρατήσει τιμές από <code>-128</code> έως <code>127</code>. Τι συμβαίνει όμως αν
    προσπαθήσεις να αποθηκεύσεις μια τιμή μεγαλύτερη από το μέγιστο επιτρεπτό όριο;
</p>

<p>
    Στη Go, όταν μια ακέραια τιμή ξεπεράσει το μέγιστο όριο του τύπου της, συμβαίνει αυτό που λέγεται
    <strong>overflow</strong> (υπερχείλιση). Ο compiler <strong>δεν</strong> θα σου δώσει σφάλμα — απλά η τιμή θα
    "κουμπώσει" (wrap around) στην άλλη άκρη του εύρους. Δηλαδή, αν προσθέσεις 1 στη μέγιστη τιμή ενός
    <code>int8</code> (<code>127 + 1</code>), το αποτέλεσμα θα είναι <code>-128</code> (η ελάχιστη τιμή). Το ίδιο συμβαίνει
    και προς την αντίθετη κατεύθυνση: αν αφαιρέσεις 1 από την ελάχιστη τιμή (<code>-128</code>), το αποτέλεσμα θα είναι
    <code>127</code>.
</p>

<div class="callout">

        αποτέλεσμα "κάνει κύκλο" (wrap around). Αυτό είναι μια θεμελιώδης ιδιότητα του πώς λειτουργούν οι δυαδικοί
        αριθμοί στα κυκλώματα του υπολογιστή.

    και να επιλέγεις τον κατάλληλο τύπο για την περίπτωσή σου. Για τις περισσότερες καθημερινές χρήσεις, το
    <code>int</code> (που στα σύγχρονα συστήματα είναι 64-bit) έχει τόσο τεράστιο εύρος που το overflow είναι πρακτικά
    αδύνατο να συμβεί σε κανονικά προγράμματα.
</p>

<h2>Float</h2>

<p>
    Για αριθμούς με δεκαδικό μέρος (π.χ. <code>3.14</code>, <code>-0.5</code>), η Go διαθέτει τους τύπους
    <code>float32</code> και <code>float64</code>, ακολουθώντας το διεθνές πρότυπο IEEE 754 για την αναπαράσταση
    δεκαδικών αριθμών σε δυαδική μορφή. Ο αριθμός στο όνομα δείχνει πόσα bits χρησιμοποιούνται, με το
    <code>float64</code> να προσφέρει σημαντικά μεγαλύτερη ακρίβεια (περισσότερα δεκαδικά ψηφία αξιόπιστα
    αναπαραστάσιμα) σε σχέση με το <code>float32</code>. Στην πράξη, το <code>float64</code> είναι η προεπιλογή που
    χρησιμοποιείται στη συντριπτική πλειοψηφία των περιπτώσεων, αφού το κόστος σε μνήμη/ταχύτητα είναι αμελητέο σε
    σύγχρονα συστήματα, ενώ το κέρδος σε ακρίβεια είναι σημαντικό.
</p>

<h3>Overflow και Precision στα Floats</h3>

<p>
    Όπως και οι ακέραιοι, έτσι και οι float αριθμοί έχουν πεπερασμένο εύρος τιμών. Το <code>float32</code> μπορεί να
    αναπαραστήσει αριθμούς περίπου έως <code>3.4 × 10³⁸</code>, ενώ το <code>float64</code> έως
    <code>1.8 × 10³⁰⁸</code>. Αν προσπαθήσεις να αποθηκεύσεις μια τιμή μεγαλύτερη από αυτό το όριο, συμβαίνει
    <strong>overflow</strong> — αλλά σε αντίθεση με τους ακέραιους, το αποτέλεσμα δεν κάνει wrap around, αλλά γίνεται
    <code>+Inf</code> (θετικό άπειρο) ή <code>-Inf</code> (αρνητικό άπειρο). Αντίστοιχα, αν προσπαθήσεις να αποθηκεύσεις
    έναν αριθμό πολύ κοντά στο μηδέν (μικρότερο από το ελάχιστο αναπαραστάσιμο), συμβαίνει <strong>underflow</strong>,
    και η τιμή γίνεται απλά <code>0</code>.
</p>

<p>
    Πολύ πιο σημαντικό από το overflow, ωστόσο, είναι το θέμα της <strong>ακρίβειας (precision)</strong>. Οι δεκαδικοί
    αριθμοί αναπαριστώνται στη μνήμη σε <strong>δυαδική μορφή</strong> (με βάση το 2, όχι με βάση το 10). Πολλοί απλοί
    δεκαδικοί αριθμοί —όπως το <code>0.1</code> ή το <code>0.3</code>— <strong>δεν</strong> μπορούν να αναπαρασταθούν
    ακριβώς σε δυαδική μορφή, ακριβώς όπως το <code>1/3</code> δεν μπορεί να γραφτεί με πεπερασμένους δεκαδικούς.
</p>

<pre><code class="lang-go">var x float64 = 0.1
var y float64 = 0.2
var z float64 = 0.3

fmt.Println(x + y)      // 0.30000000000000004 (όχι ακριβώς 0.3!)
fmt.Println(x+y == z)   // false
</code></pre>

<p>
    Αυτό είναι ίσως το πιο κλασικό "λάθος" που κάνουν οι νέοι προγραμματιστές με floats:
    <strong>δεν πρέπει ποτέ να συγκρίνεις floats με <code>==</code></strong
    >. Επειδή τα floats χάνουν ακρίβεια, δύο τιμές που <em>μαθηματικά</em> είναι ίσες μπορεί να διαφέρουν κατά ένα
    ελάχιστο, μη αντιληπτό ποσό, και η σύγκριση θα δώσει λανθασμένο αποτέλεσμα. (Θα δούμε πώς να
    συγκρίνουμε αριθμούς σε επόμενη ενότητα).
</p>

<div class="callout">

    <p>
        Τα floats είναι ιδανικά όταν η ακρίβεια <em>δεν</em> είναι κρίσιμη, π.χ. σε επιστημονικούς υπολογισμούς,
        γραφικά, προσομοιώσεις, ή μετρήσεις. Όταν χρειάζεσαι απόλυτη ακρίβεια (π.χ. σε οικονομικές εφαρμογές με
        χρήματα), <strong>δεν</strong> χρησιμοποιούμε floats — αντίθετα, δουλεύουμε με ακέραιους τύπους αποθηκεύοντας το
        ποσό στην <em>μικρότερη μονάδα</em> του νομίσματος (π.χ. σεντς αντί για ευρώ, ή λεπτά αντί για δολάρια). Έτσι,
        το ποσό <code>3.14€</code> αποθηκεύεται ως <code>314</code> (σεντς), και μόνο κατά την εμφάνιση το μετατρέπουμε
        σε δεκαδικό. Υπάρχουν επίσης ειδικές βιβλιοθήκες για ακριβή δεκαδική αριθμητική (π.χ. <code>decimal</code>),
        αλλά ο απλούστερος τρόπος είναι οι ακέραιοι.
    </p>
</div>


<h2>Λογικός τύπος (Boolean)</h2>

<p>
    Ο τύπος <code>bool</code> (από το "Boolean", προς τιμήν του μαθηματικού George Boole) έχει ακριβώς δύο δυνατές
    τιμές: <code>true</code> (αληθές) ή <code>false</code> (ψευδές) — τίποτα ενδιάμεσο, τίποτα άλλο. Χρησιμοποιείται
    παντού όπου χρειάζεται μια απάντηση "ναι/όχι", όπως στον έλεγχο συνθηκών που θα δούμε στην Ενότητα 4.</p>
<p>
    <em>Fun fact:</em> Σε γλώσσες όπως η C, ο αριθμός <code>0</code> αντιμετωπίζεται σαν "false" και κάθε άλλος αριθμός
    (π.χ. <code>1</code>, <code>-5</code>, <code>42</code>) σαν "true". Αυτό είναι χρήσιμο γιατί η αρχική τιμή μιας
    αριθμητικής μεταβλητής είναι συνήθως <code>0</code>, οπότε μπορεί να χρησιμοποιηθεί σαν "false" σε έλεγχο συνθηκών.
</p>


<h2>Χαρακτήρες και Runes</h2>

<p>
    Όταν θέλεις να δουλέψεις με έναν <strong>μεμονωμένο χαρακτήρα</strong> στη Go (π.χ. ένα γράμμα, ένα ψηφίο, ένα
    emoji), χρησιμοποιείς τον τύπο <code>rune</code>.
</p>

<p>
    Στην ουσία, ένα <code>rune</code> είναι ένας ακέραιος αριθμός που αντιστοιχεί σε έναν συγκεκριμένο χαρακτήρα,
    σύμφωνα με το διεθνές πρότυπο <strong>Unicode</strong>. Κάθε χαρακτήρας στον κόσμο έχει τον δικό του μοναδικό
    αριθμό, που λέγεται <strong>Unicode code point</strong> (ή <strong>ASCII code</strong> αν ο χαρακτήρας ανήκει στο
    παλιότερο, πιο περιορισμένο πρότυπο ASCII).
</p>

<p>Ας δούμε μερικά παραδείγματα:</p>

<pre><code class="lang-go">var char1 rune = 'C'
var char2 rune = '5'
var char3 rune = 'Γ'
var char4 rune = '🪄'

fmt.Println(char1) // 67  (ο αριθμός του 'C')
fmt.Println(char2) // 53  (ο αριθμός του '5')
fmt.Println(char3) // 915 (ο αριθμός του 'Γ')
fmt.Println(char4) // 129428 (ο αριθμός του '🪄')
</code></pre>

<p>
    Όταν τυπώνεις ένα <code>rune</code> με <code>fmt.Println</code>, βλέπεις τον <strong>αριθμό</strong> του (τον
    Unicode code point), όχι τον χαρακτήρα.
</p>

<div class="callout">
    <span class="tag">Η βασική ιδέα</span>
    <p>Ο υπολογιστής δεν καταλαβαίνει γράμματα — καταλαβαίνει μόνο αριθμούς. Το Unicode είναι η "γέφυρα" που λέει:</p>
    <ul>
        <li>ο αριθμός <code>67</code> σημαίνει το γράμμα <code>'C'</code> (λατινικό C)</li>
        <li>ο αριθμός <code>915</code> σημαίνει το γράμμα <code>'Γ'</code> (ελληνικό Γάμμα)</li>
        <li>ο αριθμός <code>129428</code> σημαίνει το emoji <code>'🪄'</code></li>
    </ul>
    <p>
        Κάθε φορά που γράφεις <code>'C'</code> ή <code>'Γ'</code> στον κώδικά σου, ο compiler τα μετατρέπει στους
        αντίστοιχους αριθμούς (<code>67</code> και <code>915</code>). Αυτό ισχύει για <strong>κάθε</strong> χαρακτήρα,
        από όλες τις γλώσσες.
    </p>
</div>


<p>
    Στη Go, ο τύπος <code>rune</code> είναι απλά ένα <em>alias</em> (εναλλακτικό όνομα) για τον τύπο
    <code>int32</code> — δηλαδή ένας ακέραιος αριθμός 32 bits. <br> Αυτό σημαίνει ότι μπορεί να κρατήσει τιμές από
    <code>-2 147 483 648</code> έως <code>2 147 483 647</code>. Ο μεγαλύτερος Unicode code point που υπάρχει είναι
    περίπου <code>1 114 111</code>, άρα το <code>rune</code> είναι παραπάνω από αρκετό για να χωρέσει κάθε πιθανό
    χαρακτήρα Unicode.
</p>
<p>
    Για να το καταλάβεις καλύτερα: αν το <code>rune</code> ήταν μικρότερο (π.χ. <code>int16</code>, που κρατάει μόνο έως
    <code>32 767</code>), δεν θα μπορούσε να αποθηκεύσει τα emoji (το 🪄 έχει code point <code>129 428</code>, πολύ
    μεγαλύτερο από <code>32 767</code>). Γι' αυτό η Go επέλεξε <code>int32</code> για τα runes.
</p>


<h2>Strings — μια ακολουθία από χαρακτήρες</h2>

<p>
    Ένα <code>string</code> είναι μια <strong>ακολουθία από χαρακτήρες</strong> — δηλαδή μια σειρά από
    <code>rune</code> τιμές, η μία μετά την άλλη.
</p>

<p>
    Για παράδειγμα, το string <code>"Γεια"</code> αποτελείται από τους χαρακτήρες <code>'Γ'</code>, <code>'ε'</code>,
    <code>'ι'</code>, <code>'α'</code>.
</p>

<pre><code class="lang-go">s := "Γεια"

// Σκέψου το σαν μια σειρά από runes:
// [ Γ ] [ ε ] [ ι ] [ α ]
// [915] [949] [953] [945]   (οι αριθμοί Unicode)
</code></pre>

<p>Μπορείς να "διατρέξεις" ένα string χαρακτήρα-χαρακτήρα:</p>

<pre><code class="lang-go">s := "Γεια"
for _, char := range s {
    fmt.Printf("%c = %d\n", char, char)
}
// Έξοδος:
// Γ = 915
// ε = 949
// ι = 953
// α = 945
</code></pre>

<div class="callout">
    <span class="tag">Πώς αποθηκεύονται τα strings στη μνήμη</span>

    <p>
        Παρόλο που ένα string είναι μια ακολουθία από χαρακτήρες (runes), στη μνήμη αποθηκεύεται ως μια ακολουθία από
        <strong>bytes</strong>.
    </p>

    <p>
        Αυτό συμβαίνει γιατί η μνήμη του υπολογιστή δουλεύει με bytes (η μικρότερη μονάδα δεδομένων που μπορεί να
        διαβάσει), όχι με "χαρακτήρες". Το πώς μετατρέπεται ένας χαρακτήρας (rune) σε bytes καθορίζεται από την
        <strong>κωδικοποίηση</strong> (encoding).
    </p>

    <p>Η Go χρησιμοποιεί <strong>UTF-8</strong>. Στην UTF-8, κάθε χαρακτήρας παίρνει 1 έως 4 bytes:</p>

    <ul>
        <li>
            <strong>1 byte</strong> — λατινικοί χαρακτήρες (<code>'A'</code>, <code>'b'</code>, <code>'5'</code>,
            <code>'$'</code>)
        </li>
        <li>
            <strong>2 bytes</strong> — ελληνικοί, κυριλλικοί, κ.ά. (<code>'Γ'</code>, <code>'α'</code>,
            <code>'Я'</code>)
        </li>
        <li><strong>3 bytes</strong> — σπάνιοι χαρακτήρες (<code>'𐌀'</code>)</li>
        <li><strong>4 bytes</strong> — emoji (<code>'🪄'</code>, <code>'❤️'</code>)</li>
    </ul>

<p>
    Έτσι, το string <code>"Γεια"</code> (4 χαρακτήρες) καταλαμβάνει <strong>8 bytes</strong> στη μνήμη (2 bytes ανά
    ελληνικό χαρακτήρα × 4). Μπορείς να το σκέφτεσαι σαν μια σειρά από runes τοποθετημένα ο ένας μετά τον άλλο — σαν μια
    "αλυσίδα" χαρακτήρων. (Θα δούμε πώς να δουλεύουμε με σειρές από δεδομένα, που λέγονται πίνακες/slices, σε επόμενη
    ενότητα).
</p>
</div>

<div class="callout">
    <span class="tag">Unicode, UTF-8, και ASCII — η ιεραρχία</span>

    <p>
        <strong>Unicode</strong> — ο κατάλογος: ορίζει "ο αριθμός 67 σημαίνει το γράμμα C, ο αριθμός 915 σημαίνει το
        γράμμα Γ".
    </p>

    <p> <strong>UTF-8</strong> — η κωδικοποίηση: ορίζει "γράψε τον αριθμό 65 σε 1 byte, τον αριθμό 915 σε 2 bytes". </p>


<p>
    <strong>ASCII</strong> — ένα παλιότερο, πιο περιορισμένο πρότυπο. Καλύπτει μόνο 128 χαρακτήρες (λατινικούς,
    αριθμούς, βασικά σύμβολα), και ο καθένας παίρνει ακριβώς 1 byte. (Αν θες να δεις οπτικά ποιος αριθμός αντιστοιχεί σε
    ποιον χαρακτήρα, γράψε "ASCII table" στη μηχανή αναζήτησής σου — είναι χρήσιμο να το έχεις υπόψιν σου).
</p>

    <p>
        Η UTF-8 είναι <em>συμβατή</em> με το ASCII: οι 128 ASCII χαρακτήρες γράφονται με τον ίδιο ακριβώς τρόπο και στην
        UTF-8 (1 byte ο καθένας).
    </p>

    <p>
        Για την καθημερινή σου δουλειά, μπορείς να σκέφτεσαι το string σαν μια ακολουθία από χαρακτήρες, και η Go
        φροντίζει για την κωδικοποίηση. Ωστόσο, η κατανόηση αυτής της διάκρισης είναι χρήσιμη όταν δουλεύεις με αρχεία ή
        δίκτυο.
    </p>
</div>

<h3>Immutability — γιατί τα strings δεν αλλάζουν</h3>

<p>
    Ένα πολύ σημαντικό χαρακτηριστικό: τα strings στη Go είναι
    <strong>immutable</strong> (αμετάβλητα). Αυτό σημαίνει ότι, μόλις δημιουργηθεί ένα string,
    <strong>δεν μπορείς να αλλάξεις</strong> κάποιον χαρακτήρα του "επιτόπου" (in place).
</p>

<pre><code class="lang-go">s := "hello"
// s[0] = 'H' // ERROR: cannot assign to s[0] (strings are immutable)
</code></pre>

<p>
    Κάθε φορά που φαίνεται να "τροποποιείς" ένα string (π.χ. προσθέτοντας κάτι σε αυτό), στην πραγματικότητα η Go
    δημιουργεί ένα <em>ολόκληρο νέο</em> string στη μνήμη, και η μεταβλητή σου απλά "δείχνει" πλέον στο νέο. Το παλιό
    string παραμένει στη μνήμη μέχρι ο garbage collector να το καθαρίσει.
</p>

<pre><code class="lang-go">s := "hello"
s = s + " world" // Δημιουργείται ΝΕΟ string "hello world"
                  // Το παλιό "hello" παραμένει στη μνήμη
</code></pre>

<p>
    Αυτό έχει σημαντικές συνέπειες στην απόδοση: η συχνή τροποποίηση strings (π.χ. μέσα σε βρόχους) μπορεί να είναι
    "ακριβή" σε μνήμη και ταχύτητα, γιατί κάθε φορά δεσμεύεται νέα μνήμη. (Θα δούμε πώς να το αποφεύγουμε σε επόμενο
    guide — <code>strings.Builder</code>).
</p>


<div class="callout">
    <span class="tag">Γιατί υπάρχει το immutability;</span>
    <p>
        Ο κύριος λόγος είναι η <strong>απόδοση</strong>. Επειδή τα strings δεν αλλάζουν ποτέ, η Go μπορεί να κάνει
        βελτιστοποιήσεις που δεν θα ήταν δυνατές αν μπορούσαν να αλλάξουν. Για παράδειγμα, όταν περνάς ένα string ως
        όρισμα σε μια συνάρτηση, η Go μπορεί να περάσει απλά μια αναφορά (δείκτη) στο ίδιο string, αντί να αντιγράψει
        ολόκληρο το string στη μνήμη. Αυτό εξοικονομεί χρόνο και μνήμη.
    </p>
</div>

<div class="callout">
  <span class="tag">double quotes, single quotes</span>

  <p>
    <strong>Διπλά εισαγωγικά (<code>" "</code>)</strong> → χρησιμοποιούνται για <strong>string literals</strong>
    (κείμενο, 0 ή περισσότεροι χαρακτήρες).
  </p>

  <p>
    <strong>Μονά εισαγωγικά (<code>' '</code>)</strong> → χρησιμοποιούνται για <strong>rune literals</strong>
    (ένας και μόνο ένας χαρακτήρας). Π.χ. το <code>'A'</code> είναι πάντα <code>rune</code>, όχι <code>byte</code>.
  </p>

  <p>
    <strong>Προσοχή:</strong> το <code>"H"</code> (<em>string</em> literal) είναι διαφορετικό από το <code>'H'</code> (<em>rune</em> literal).
    Δεν είναι το ίδιο πράγμα, και η Go δεν τα μετατρέπει αυτόματα.
  </p>
</div>

<div class="callout">
  <span class="tag">byte, rune, string</span>
  <p>
    <strong><code>byte</code></strong> είναι ένα <em>alias</em> για τον τύπο <code>uint8</code> (8 bits).
    Χρησιμοποιείται για raw bytes (αρχεία, δίκτυο, δυαδικά δεδομένα).
    <br>Δεν υπάρχει "byte literal" — αν θέλεις <code>byte</code>, γράφεις τον αριθμό (π.χ. <code>65</code>)
    ή κάνεις κάτι που θα δούμε στο επόμενο κεφάλαιο, μετατροπή (casting): <code>byte('A')</code>.
  </p>

  <p>
    <strong><code>rune</code></strong> είναι ένα <em>alias</em> για τον τύπο <code>int32</code> (32 bits).
    Χρησιμοποιείται για να κρατάει <strong>οποιονδήποτε</strong> Unicode χαρακτήρα
    (ελληνικό, emoji, κινέζικο, κ.λπ.).
  </p>

  <p>
    <strong><code>string</code></strong> είναι μια ακολουθία από bytes κωδικοποιημένη σε UTF-8.
    Σκέψου το σαν μια σειρά από χαρακτήρες (runes) στη μνήμη.
  </p>
</div>

`);

<p class="lede">

<div class="eyebrow">Ενότητα 2 / 8 — Μεταβλητές &amp; Τύποι</div>

<h1>Μετατροπές Τύπων (Type Casting / Conversion)</h1>

<p class="lede">
    Ήρθε η ώρα να δούμε ένας από τους πιο αυστηρούς κανόνες της Go — και γιατί, παρόλο που αρχικά φαίνεται
    ενοχλητικός, σε προστατεύει από ολόκληρες κατηγορίες σφαλμάτων.
</p>

<p>
    Είδαμε παραπάνω ότι η Go είναι statically typed — κάθε μεταβλητή έχει έναν συγκεκριμένο, σταθερό τύπο. Αυτό πάει ένα
    βήμα παραπέρα: η Go <strong>δεν κάνει ποτέ αυτόματη, σιωπηλή μετατροπή</strong> ανάμεσα σε διαφορετικούς
    αριθμητικούς τύπους, ακόμα κι αν φαίνονται "συγγενικοί" με την πρώτη ματιά — όπως το <code>int</code> με το
    <code>float64</code>. Αν προσπαθήσεις να <strong>προσθέσεις</strong> απευθείας μια μεταβλητή τύπου
    <code>int</code> με μία τύπου <code>float64</code>, ο compiler θα αρνηθεί να μεταγλωττίσει το πρόγραμμα, δίνοντάς
    σου σφάλμα τύπου (type mismatch).
</p>

<p>
    Για να το κάνεις αυτό να δουλέψει, χρειάζεται μια <strong>ρητή μετατροπή</strong> (explicit type conversion) —
    γράφεις το όνομα του επιθυμητού τύπου σαν να ήταν συνάρτηση, δίνοντάς του ως όρισμα την τιμή που θες να μετατρέψεις:
</p>

<pre><code class="lang-go">x := 42       // int
y := 3.14     // float64

// result := x + y // this line would NOT compile: mismatched types int and float64

result := float64(x) + y // explicit conversion fixes it

fmt.Println(result)
</code></pre>

<p>
    Στην τρίτη γραμμή, το <code>float64(x)</code> παίρνει την τιμή του <code>x</code> (που είναι <code>int</code>) και
    δημιουργεί μια νέα, προσωρινή τιμή τύπου <code>float64</code> με την ίδια αριθμητική αξία (42.0). Τώρα και οι δύο
    πλευρές της πρόσθεσης είναι <code>float64</code>, και ο compiler είναι ευχαριστημένος.
</p>



<h2>Η αντίστροφη περίπτωση — float → int και απώλεια ακρίβειας</h2>

<p>
    Το ίδιο ισχύει και προς την αντίθετη κατεύθυνση: αν έχεις μια τιμή <code>float64</code> και θες να την αποθηκεύσεις
    σε μια μεταβλητή <code>int</code>, πρέπει να κάνεις ρητή μετατροπή.
</p>

<pre><code class="lang-go">x := 42       // int
y := 3.99     // float64

// result := x + y // this line would NOT compile: mismatched types int and float64

result := x + int(y)     // 42 + 3 = 45 (int, το 3.99 χάνεται!)

fmt.Println(result)
</code></pre>

<p>
    Στην πρώτη περίπτωση (<code>float64(x) + y</code>), το αποτέλεσμα ήταν μια μεταβλητή <code>result</code> τύπου <code>float64</code> που ισούταν με <code>45.99</code>.
</p>
<p>
    Στην δεύτερη περίπτωση (<code>x + int(y)</code>), το αποτέλεσμα είναι μια μεταβλήτη <code>result</code> τύπου <code>int</code> και ισούται με <code>45</code>, γιατί το <code>3.99</code> κόπηκε σε <code>3</code>.
</p>


<div class="callout">
    <span class="tag">Γιατί αυτό είναι σημαντικό</span>
    <p>
        Σε γλώσσες που επιτρέπουν σιωπηρή μετατροπή (π.χ. C ή JavaScript), μια τιμή σαν το <code>45.99</code> μπορεί να
        μετατραπεί σε <code>45</code>
        χωρίς καμία προειδοποίηση — ένα λάθος που μπορεί να περάσει απαρατήρητο και να καταστρέψει υπολογισμούς.
    </p>
    <p>
        Η Go <strong>δεν επιτρέπει</strong> αυτή τη μετατροπή χωρίς να τη ζητήσεις ρητά. Όταν γράφεις
        <code>int(y)</code>, είναι ξεκάθαρο ότι <strong>γνωρίζεις</strong> ότι χάνεις ακρίβεια — και το δέχεσαι
        συνειδητά. Ο compiler δεν κάνει κάτι πίσω από την πλάτη σου.
    </p>
    <p>
    Ακριβώς επειδή η Go είναι τόσο αυστηρή, ένας άλλος προγραμματιστής που διαβάζει τον κώδικά σου βλέπει αμέσως ότι εδώ γίνεται σκόπιμα μετατροπή.
    </p>
</div>

<h2>String + String</h2>

<p>Όπως είδαμε και προηγουμένως, αν προσθέσουμε 2 strings, το αποτέλεσμα είναι ένα νέο string (πχ. <code>fullName</code>) που περιέχει τα δυο.</p>

<pre><code class="lang-go">firstName := "John"
lastName := "Doe"
fullName := firstName + " " + lastName // "John Doe" — λειτουργεί!
</code></pre>

<p>
    Στην πραγματικότητα προσθέσαμε τρία strings μεταξύ τους: τη μεταβλητή <code>firstName</code>,
    το literal string <code>" "</code> (ένα κενό διάστημα), και τη μεταβλητή <code>lastName</code>.
    Η Go τα ενώνει (concatenate) με τη σειρά που δίνονται,
    παράγοντας ένα ενιαίο string: <code>"John Doe"</code>.
</p>

<h2>String + Rune</h2>

<p>Αν όμως προσπαθήσεις να ενώσεις ένα string με ένα rune ή με ένα byte, ο compiler θα σου δώσει σφάλμα:</p>

<pre><code class="lang-go">s := "Hello"
c := '!'

// result := s + c // ERROR: mismatched types string and rune
</code></pre>

<p>Για να το διορθώσεις, πρέπει να μετατρέψεις ρητά το rune σε string:</p>

<pre><code class="lang-go">s := "Hello"
c := '!'

result := s + string(c) // "Hello!" — λειτουργεί!
</code></pre>

<h2>Runes και ASCII/Unicode — η μετατροπή σε αριθμό</h2>

<p>
    Επειδή ένα <code>rune</code> είναι ουσιαστικά ένας ακέραιος αριθμός (ένας <code>int32</code>), μπορείς να το
    μετατρέψεις ρητά σε αριθμό για να δεις τον Unicode code point του.
</p>

<pre><code class="lang-go">var greekGamma rune = 'Γ'
var latinC rune = 'C'
var magic rune = '🪄'

// Τυπώνουμε τους αριθμούς (Unicode code points):
fmt.Println(greekGamma) // 915
fmt.Println(latinC)     // 67
fmt.Println(magic)      // 129428

// Το ίδιο κάνουμε και με ρητή μετατροπή σε int:
fmt.Println(int(greekGamma)) // 915
fmt.Println(int(latinC))     // 67
fmt.Println(int(magic))      // 129428

// Για να δεις τον χαρακτήρα αντί για τον αριθμό:
fmt.Println(string(greekGamma)) // Γ
fmt.Println(string(latinC))     // C
fmt.Println(string(magic))      // 🪄

// Πρόσθεσε τους αριθμούς του C και του 🪄:
fmt.Println(int(latinC) + int(magic)) // 67 + 129428 = 129495

// Το 129495 είναι ο Unicode code point για το emoji 🧗 (άνθρωπος που σκαρφαλώνει):
fmt.Println(string(int(latinC) + int(magic))) // 🧗
</code></pre>

<p><strong>Παράξενο, έτσι;</strong> Μπορείς να κάνεις αριθμητικές πράξεις με τους αριθμούς των χαρακτήρων!
    Το <code>C</code> (67) συν το <code>🪄</code> (129428) κάνει <code>🧗</code>,
    που είναι ο χαρακτήρας με Unicode code point <code>129495</code>.</p>

<p>Αντίστροφα, μπορείς να μετατρέψεις έναν αριθμό σε rune:</p>

<pre><code class="lang-go">var num int = 67
char := rune(num)            // μετατροπή αριθμού σε rune
fmt.Println(string(char))    // C
</code></pre>

<h2>Γιατί αυτή η αυστηρότητα υπάρχει σκόπιμα</h2>

<p>
    Αυτή η συμπεριφορά μπορεί αρχικά να φαίνεται περιττά αυστηρή, ειδικά αν έρχεσαι από γλώσσες με πιο "χαλαρή" στάση
    απέναντι στους τύπους. Όμως αποτρέπει μια ολόκληρη κατηγορία bugs που προκύπτουν από απρόσμενη απώλεια ακρίβειας ή
    νοήματος. Για παράδειγμα, σε μια γλώσσα που επιτρέπει σιωπηλή μετατροπή, ένας δεκαδικός αριθμός όπως το 3.99 θα
    μπορούσε να "κοπεί" αυτόματα σε 3 όταν ανατεθεί σε ακέραια μεταβλητή, χωρίς καμία προειδοποίηση — ένα λάθος που
    μπορεί να περάσει απαρατήρητο για πολύ καιρό. Η Go σε αναγκάζει να γράψεις ρητά <code>int(3.99)</code>, ώστε να
    είναι ξεκάθαρο, διαβάζοντας απλά τον κώδικα, ότι εδώ συμβαίνει σκόπιμα μια μετατροπή — και άρα ενδεχόμενη απώλεια
    πληροφορίας. Η ίδια λογική είναι εξίσου χρήσιμη και σε <strong>σύνθετους τύπους</strong>,
    όπως τα <code>struct</code> που θα δούμε σε επόμενο guide —
    η Go δεν επιτρέπει αυτόματη αντιστοίχιση ούτε εκεί,
    ακόμα κι αν μοιάζουν πανομοιότυποι.
</p>
<br>
<h1>Σταθερές (Constants)</h1>
<p class="lede">Μέχρι τώρα είδαμε μεταβλητές — δεδομένα που μπορούν να αλλάξουν τιμή κατά την εκτέλεση. Η Go διαθέτει επίσης έναν τρόπο να δηλώνεις τιμές που δεν πρόκειται <em>ποτέ</em> να αλλάξουν.</p>

<p>Μια <strong>σταθερά</strong> (constant) δηλώνεται με τη λέξη-κλειδί <code>const</code>, και η τιμή της καθορίζεται κατά τη μεταγλώττιση — δεν μπορεί να αλλάξει κατά την εκτέλεση του προγράμματος..</p>
<pre><code class="lang-go">const MaxUsers int = 100
const Pi = 3.14159
</code></pre>
<p>Αν προσπαθήσεις να αναθέσεις νέα τιμή σε μια σταθερά αφού δηλωθεί, ο compiler θα αρνηθεί να μεταγλωττίσει το πρόγραμμα</p>
<pre><code class="lang-go">const MaxUsers int = 100
const Pi = 3.14159
MaxUsers = 200 // ERROR: cannot assign to MaxUsers (constant)
Pi = 3.14159 // ERROR: cannot assign to Pi (constant) — even with the same value!
</code></pre>

<p>Γιατί να χρησιμοποιήσεις σταθερά αντί για απλή μεταβλητή που απλά "δεν αλλάζεις ποτέ" στην πράξη; Δύο λόγοι: πρώτον, επικοινωνεί ξεκάθαρα την πρόθεσή σου σε όποιον διαβάσει τον κώδικα αργότερα (συμπεριλαμβανομένου του εαυτού σου, σε μερικούς μήνες) — "αυτή η τιμή δεν πρέπει ποτέ να αλλάξει". Δεύτερον, ο compiler ενεργά σε προστατεύει, αρνούμενος να μεταγλωττίσει αν κάπου, κατά λάθος, προσπαθήσεις να την τροποποιήσεις.</p>
`);

<div class="eyebrow">Ενότητα 3 / 8 — Τελεστές &amp; Εκφράσεις</div>
<h1>Expressions vs Statements</h1>
<p class="lede">Αυτή η διάκριση είναι θεμελιώδης για να καταλάβεις πώς δουλεύει μια γλώσσα προγραμματισμού: τι παράγει τιμή και τι κάνει μια ενέργεια.</p>

<h2>Τι είναι Expression (Έκφραση)</h2>
<p>Ένα <strong>Expression</strong> είναι, με απλά λόγια, οτιδήποτε στον κώδικά σου <em>παράγει ή "επιστρέφει" μια τιμή</em> — μια τιμή που μπορείς στη συνέχεια να χρησιμοποιήσεις κάπου αλλού: να την αναθέσεις σε μεταβλητή, να την περάσεις ως όρισμα σε συνάρτηση, να τη συγκρίνεις με κάτι άλλο. Μερικά παραδείγματα:</p>
<ul>
  <li><code>5 + 3</code> — είναι expression, γιατί "παράγει" την τιμή 8</li>
  <li><code>x &gt; 10</code> — είναι expression, γιατί παράγει μια τιμή τύπου bool (είτε true, είτε false)</li>
  <li><code>myFunc()</code> — αν η <code>myFunc</code> επιστρέφει κάποια τιμή, τότε και η κλήση της είναι expression (περισσότερα στο κεφάλαιο 6)</li>
</ul>
<p>Το χαρακτηριστικό γνώρισμα ενός expression είναι ότι μπορείς να το "χρησιμοποιήσεις" εκεί όπου περιμένεται μια τιμή — π.χ. στα δεξιά ενός <code>=</code>, ή μέσα σε παρένθεση μιας συνθήκης.</p>

<h2>Τι είναι Statement (Εντολή)</h2>
<p>Ένα <strong>Statement</strong> είναι μια πλήρης "μονάδα εκτέλεσης" — κάτι που κάνει μια ενέργεια, αλλά δεν παράγει, από μόνο του, μια τιμή που να μπορεί να χρησιμοποιηθεί κάπου αλλού. Μερικά παραδείγματα:</p>
<ul>
  <li><code>var x int</code> — είναι statement: δηλώνει μια μεταβλητή, αλλά η ίδια η δήλωση δεν "παράγει" μια τιμή που να μπορείς να αναθέσεις κάπου</li>
  <li>Ένα ολόκληρο μπλοκ <code>if { ... }</code> — εκτελεί κάποια ενέργεια υπό συνθήκη, αλλά δεν "επιστρέφει" τιμή (περισσότερα στο κεφάλαιο 4)</li>
  <li>Ένα ολόκληρο μπλοκ <code>for { ... }</code> — εκτελεί επανάληψη, δεν παράγει τιμή (περισσότερα στο κεφάλαιο 5)</li>
  <li><code>myFunc()</code> — αν η <code>myFunc</code> ΔΕΝ επιστρέφει κάποια τιμή, τότε και η κλήση της είναι statement (περισσότερα στο κεφάλαιο 6)</li>
</ul>
<h2>Κατηγορίες Statements</h2>
<p>
  Οι εντολές στη Go χωρίζονται σε διάφορες κατηγορίες (θα δούμε τι σημαίνουν όσα δεν γνωρίζουμε ακόμα σε επόμενες ενότητες):
</p>
<ul>
    <li>
        <strong>Declaration statements</strong> — δηλώσεις μεταβλητών, σταθερών, τύπων, συναρτήσεων (π.χ.
        <code>var x int</code>, <code>const Pi = 3.14</code>, <code>func main() { ... }</code>)
    </li>
    <li>
        <strong>Expression statements</strong> — εκφράσεις που στέκονται μόνες τους (π.χ. <code>myFunc()</code>,
        <code>x = 5</code>, <code>x++</code>)
    </li>
    <li>
        <strong>Selection statements</strong> — δομές επιλογής βάσει συνθήκης (<code>if</code>, <code>if/else</code>,
        <code>switch</code>)
    </li>
    <li><strong>Iteration statements</strong> — δομές επανάληψης (<code>for</code> σε όλες τις μορφές του)</li>
    <li>
        <strong>Jump statements</strong> — αλλαγή ροής εκτέλεσης (<code>break</code>, <code>continue</code>,
        <code>goto</code>, <code>return</code>)
    </li>
    <li><strong>Compound statements</strong> — ένα μπλοκ από statements μέσα σε αγκύλες <code>{ ... }</code></li>
</ul>

</ul>
<br>
<h1>Κατηγορίες Τελεστών</h1>
<p class="lede">Ένας <strong>τελεστής</strong> (operator) είναι ένα σύμβολο που εκτελεί μια συγκεκριμένη πράξη πάνω σε μία ή περισσότερες τιμές (που λέγονται operands). Η Go διαθέτει αρκετές κατηγορίες τελεστών, καθεμιά με τον δικό της σκοπό.</p>

<div class="grid2">
  <div class="card"><h3>Αριθμητικοί</h3><p><code>+</code> (πρόσθεση) <code>-</code> (αφαίρεση) <code>*</code> (πολλαπλασιασμός) <code>/</code> (διαίρεση) <code>%</code> (modulo — το υπόλοιπο μιας ακέραιας διαίρεσης, π.χ. <code>7 % 2</code> δίνει <code>1</code>)</p></div>
  <div class="card"><h3>Σύγκρισης / Σχεσιακοί</h3><p><code>==</code> (ίσο με) <code>!=</code> (διαφορετικό από) <code>&lt;</code> <code>&gt;</code> <code>&lt;=</code> <code>&gt;=</code> — όλοι αυτοί παράγουν πάντα μια τιμή τύπου <code>bool</code></p></div>
  <div class="card"><h3>Λογικοί</h3><p><code>&amp;&amp;</code> (λογικό AND — "και") <code>||</code> (λογικό OR — "ή") <code>!</code> (λογικό NOT — άρνηση). Λειτουργούν πάνω σε τιμές <code>bool</code>, παράγοντας νέα τιμή <code>bool</code></p></div>
  <div class="card"><h3>Bitwise</h3><p><code>&amp;</code> <code>|</code> <code>^</code> <code>&amp;^</code> <code>&lt;&lt;</code> <code>&gt;&gt;</code> — λειτουργούν απευθείας πάνω στα επιμέρους δυαδικά bits ενός ακέραιου αριθμού, όχι στην "αριθμητική" αξία του συνολικά</p></div>
  <div class="card"><h3>Εκχώρησης</h3><p><code>=</code> (απλή ανάθεση) <code>+=</code> <code>-=</code> <code>*=</code> <code>/=</code> κ.ά. — συνδυάζουν μια πράξη με ανάθεση σε ένα βήμα, π.χ. <code>x += 5</code> ισοδυναμεί με <code>x = x + 5</code></p></div>
</div>
<br>
<h1>Σειρά Εκτέλεσης &amp; Προτεραιότητα Τελεστών</h1>

<p class="lede">
    Όταν μια έκφραση περιέχει πολλαπλούς τελεστές, η σειρά υπολογισμού καθορίζεται από
    <strong>προτεραιότητα</strong> (ακριβώς όπως στα μαθηματικά: πρώτα πολλαπλασιασμός, μετά πρόσθεση) και από
    <strong>παρενθέσεις</strong>, που μπορούν να την αλλάξουν ρητά.
</p>

<p>
    Για παράδειγμα, στην έκφραση <code>2 + 3 * 4</code>, ο πολλαπλασιασμός γίνεται πρώτος (3*4=12), και μετά προστίθεται
    το 2, δίνοντας 14. <br> Με τις εξής παρενθέσεις: <code>(2 + 3) * 4</code> δίνει 20.
</p>
`);

    addContent(`
<div class="eyebrow">Μίνι Γλωσσάρι — Ενότητα 3</div>
<h2>Όροι που μόλις είδαμε</h2>
<table class="glossary-table">
  <tr><td class="gt-term">Operator / Operand</td><td class="gt-def">τελεστής (σύμβολο πράξης) και operand (η τιμή πάνω στην οποία εφαρμόζεται)</td></tr>
  <tr><td class="gt-term">Expression</td><td class="gt-def">παράγει τιμή που μπορεί να χρησιμοποιηθεί περαιτέρω</td></tr>

<h2>Συνθήκη if</h2>

<p>

<h2>Condition</h2>

</p>

</p>

<p>

cloudCover := 90

}

<p>Στο πρώτο <code>if</code>, έχουμε τρεις ομάδες συνθηκών σε παρενθέσεις, συνδεδεμένες με <code>&amp;&amp;</code>:</p>

<h2>Η παγίδα του Shadowing</h2>

<p>Θυμήσου: το <code>:=</code> δηλώνει πάντα μια <strong>νέα</strong> μεταβλητή. Αυτό μπορεί να δημιουργήσει ένα πολύ ύπουλο bug: αν μέσα σε ένα block (π.χ. μέσα σε ένα if) χρησιμοποιήσεις <code>:=</code> με ένα όνομα μεταβλητής που υπάρχει <em>ήδη</em> σε ένα εξωτερικό (ευρύτερο) scope, δεν κάνεις ανάθεση στην υπάρχουσα μεταβλητή — δημιουργείς μια εντελώς <strong>νέα, ξεχωριστή</strong> μεταβλητή, η οποία απλά "σκιάζει" (shadows), δηλαδή κρύβει προσωρινά, την παλιά, αλλά μόνο μέσα στο τρέχον block. Έξω από αυτό το block, η αρχική εξωτερική μεταβλητή παραμένει εντελώς ανεπηρέαστη από ό,τι συνέβη μέσα.</p>

<pre><code class="lang-go">score := 10

if score > 5 {
    score := 100 // BUG: this creates a NEW score, shadowing the outer one
    fmt.Println(score) // prints 100 (the INNER score)
}
fmt.Println(score) // prints 10 (the ORIGINAL score, completely unchanged)
</code></pre>

<p>Στο παραπάνω παράδειγμα, η πρόθεση ήταν να αλλάξει η τιμή της <code>score</code> σε 100, αλλά επειδή χρησιμοποιήσαμε <code>:=</code> μέσα στο if, δημιουργήθηκε μια νέα μεταβλητή <code>score</code> που υπάρχει μόνο μέσα στο if. Η αρχική <code>score</code> έξω από το if παραμένει 10.</p>

<div class="callout">
  <span class="tag">Ναι, μπορείς να έχεις δύο μεταβλητές με το ίδιο όνομα!</span>
  <p>Αρκεί να μην δηλώνονται στο ίδιο επίπεδο block. Αυτή που δηλώνεται στο πιο "τοπικό" (μικρότερο) block επισκιάζει (shadows) την άλλη, και την αντικαθιστά σαν να μην υπήρχε — μέχρι το τέλος του block της. Όλα αυτά θα τα δούμε αναλυτικά στο κεφάλαιο για το scope (δηλαδή τον χρόνο ζωής) των συναρτήσεων.</p>
</div>

}
</code></pre>
<p>Παρατήρησε τη γραμμή <code>case 1, 2, 3, 4, 5:</code> — μπορείς να ομαδοποιήσεις πολλαπλές τιμές στο ίδιο case, χωρισμένες με κόμμα· αν η τιμή του <code>day</code> ταιριάζει με <em>οποιαδήποτε</em> από αυτές, εκτελείται το ίδιο μπλοκ κώδικα, χωρίς να χρειάζεται να επαναλάβεις τον ίδιο κώδικα πολλές φορές. Η λέξη <code>default</code> ορίζει τι εκτελείται όταν η τιμή δεν ταιριάζει με <em>κανένα</em> από τα προηγούμενα case — είναι προαιρετική, αλλά καλή πρακτική να τη συμπεριλαμβάνεις πάντα, ώστε το πρόγραμμά σου να έχει προβλέψιμη συμπεριφορά ακόμα και σε απρόβλεπτες τιμές εισόδου.</p>

<p>
    Η <code>switch</code> συγκρίνει την τιμή μιας έκφρασης με τις τιμές των <code>case</code> χρησιμοποιώντας <strong>ισότητα</strong> (<code>==</code>) — δεν μπορείς να ελέγξεις αν είναι μεγαλύτερο ή μικρότερο από μια τιμή (με εξαίρεση την περίπτωση που θα δούμε αμέσως παρακάτω). Το πλεονέκτημά της είναι η αναγνωσιμότητα — λειτουργικά, είναι ακριβώς όπως μια σειρά <code>if / else if</code>.
</p>

<h2>Tagless switch — switch χωρίς έκφραση</h2>
<p>Αν παραλείψεις εντελώς την τιμή που θα ελεγχθεί αμέσως μετά τη λέξη <code>switch</code>, παίρνεις μια εναλλακτική μορφή γνωστή ως <strong>tagless switch</strong>. Αυτή λειτουργεί ουσιαστικά σαν μια πιο καθαρή, πιο ευανάγνωστη εναλλακτική μιας μεγάλης αλυσίδας από <code>if</code>/<code>else if</code> — κάθε case περιέχει τη δική του πλήρη, ανεξάρτητη συνθήκη:</p>
<pre><code><span class="tok-kw">switch</span> {
<span class="tok-kw">case</span> score >= <span class="tok-num">90</span>:
    fmt.<span class="tok-func">Println</span>(<span class="tok-str">"A"</span>)
<span class="tok-kw">case</span> score >= <span class="tok-num">75</span>:
    fmt.<span class="tok-func">Println</span>(<span class="tok-str">"B"</span>)
<span class="tok-kw">default</span>:
    fmt.<span class="tok-func">Println</span>(<span class="tok-str">"C or below"</span>)
}
</code></pre>
<p>Η Go ελέγχει τα cases με τη σειρά από πάνω προς τα κάτω, και εκτελεί το πρώτο του οποίου η συνθήκη είναι true — ακριβώς όπως μια αλυσίδα <code>if</code>/<code>else if</code>/<code>else</code>, αλλά με πιο συμπυκνωμένη, οπτικά καθαρή σύνταξη όταν έχεις πολλές διαδοχικές συνθήκες πάνω στην ίδια μεταβλητή.</p>
`);

<div class="eyebrow">Ενότητα 5 / 8 — Επαναλήψεις &amp; Loops</div>
<h1>Η for — Η Μοναδική Λούπα της Go</h1>
<p class="lede">Πολλές γλώσσες προγραμματισμού διαθέτουν αρκετές ξεχωριστές λέξεις-κλειδιά για επαναλήψεις: <code>for</code>, <code>while</code>, <code>do-while</code>, η καθεμία με τη δική της σύνταξη και περιπτώσεις χρήσης. Η Go πήρε μια διαφορετική, πιο μινιμαλιστική απόφαση: κράτησε <strong>μόνο</strong> τη <code>for</code>, αλλά της έδωσε αρκετή ευελιξία στη σύνταξη ώστε να καλύπτει όλες τις περιπτώσεις που σε άλλες γλώσσες θα χρειάζονταν διαφορετική λέξη-κλειδί.</p>

<h2>Τι είναι μια επανάληψη</h2>
<p>Μια <strong>επανάληψη</strong> (loop) είναι μια δομή που επιτρέπει σε ένα κομμάτι κώδικα να εκτελεστεί πολλές φορές στη σειρά, χωρίς να χρειάζεται να το ξαναγράψεις χειροκίνητα κάθε φορά. Αντί να γράψεις δέκα φορές την ίδια εντολή <code>fmt.Println(i)</code> με διαφορετική τιμή του <code>i</code> κάθε φορά, γράφεις μία φορά τη λογική, και της λες "επανέλαβε αυτό μέχρι να ισχύσει μια συγκεκριμένη συνθήκη τερματισμού".</p>

<h2>Standard for loop — η πλήρης μορφή</h2>
<p>Η πλήρης μορφή της <code>for</code> έχει τρία ξεχωριστά μέρη, χωρισμένα με άνω-κάτω τελείες (<code>;</code>) — ακριβώς όπως σε γλώσσες όπως η C ή η Java, αλλά και εδώ χωρίς παρενθέσεις γύρω τους:</p>
<pre><code><span class="tok-kw">for</span> i <span class="tok-kw">:=</span> <span class="tok-num">0</span>; i < <span class="tok-num">5</span>; i++ {
    fmt.<span class="tok-func">Println</span>(i)
}
</code></pre>
<p>Ας δούμε τι κάνει ακριβώς κάθε κομμάτι: <strong>Η αρχικοποίηση</strong> (<code>i := 0</code>) εκτελείται <em>μία μόνο φορά</em>, στην πολύ αρχή, πριν καν ξεκινήσει η πρώτη επανάληψη — εδώ δηλώνουμε μια νέα μεταβλητή <code>i</code> (γνωστή και ως "μετρητής" ή "index") με αρχική τιμή 0. <strong>Η συνθήκη</strong> (<code>i < 5</code>) ελέγχεται <em>πριν από κάθε</em> επανάληψη — αν είναι true, η επανάληψη εκτελείται· αν είναι false, η λούπα σταματά αμέσως και η εκτέλεση συνεχίζει στη γραμμή μετά το κλείσιμο του for. <strong>Το βήμα</strong> (<code>i++</code>) εκτελείται <em>στο τέλος κάθε</em> επανάληψης, αφού εκτελεστεί το σώμα της λούπας, και πριν ελεγχθεί ξανά η συνθήκη για την επόμενη επανάληψη. Στο συγκεκριμένο παράδειγμα, η λούπα τυπώνει τους αριθμούς 0, 1, 2, 3, 4 — παρατήρησε ότι το 5 <em>δεν</em> τυπώνεται, αφού μόλις το <code>i</code> γίνει 5, η συνθήκη <code>i < 5</code> γίνεται false και η λούπα σταματά πριν εκτελεστεί άλλη μία φορά.</p>

<h2>for μόνο με συνθήκη — ισοδύναμο του while</h2>
<p>Αν παραλείψεις εντελώς την αρχικοποίηση και το βήμα, κρατώντας μόνο τη συνθήκη, η <code>for</code> συμπεριφέρεται ακριβώς όπως το <code>while</code> άλλων γλωσσών — απλά ελέγχει τη συνθήκη πριν από κάθε επανάληψη, χωρίς κανένα αυτόματο βήμα:</p>
<pre><code>count <span class="tok-kw">:=</span> <span class="tok-num">0</span>
<span class="tok-kw">for</span> count < <span class="tok-num">3</span> {
    fmt.<span class="tok-func">Println</span>(<span class="tok-str">"counting:"</span>, count)
    count++ <span class="tok-com">// the increment must now be done manually, inside the body</span>
}
</code></pre>
<p>Παρατήρησε ότι εδώ το <code>count++</code> γράφεται πλέον χειροκίνητα μέσα στο σώμα της λούπας — χωρίς αυτό, η συνθήκη <code>count < 3</code> θα παρέμενε πάντα true, δημιουργώντας ατέρμονη λούπα (θα το δούμε αναλυτικά παρακάτω ως συχνή παγίδα).</p>

<h2>Ατέρμων λούπα (Infinite loop)</h2>
<p>Χωρίς καθόλου συνθήκη —απλά <code>for {}</code>— η λούπα τρέχει επ' αόριστον, χωρίς φυσικό τερματισμό. Αυτό ακούγεται σαν λάθος, αλλά είναι στην πραγματικότητα χρήσιμο και σκόπιμο σε συγκεκριμένα σενάρια, όπως server loops (προγράμματα που πρέπει να "ακούνε" συνέχεια για νέα αιτήματα) ή event loops (προγράμματα που περιμένουν συνεχώς νέα γεγονότα προς επεξεργασία) — οτιδήποτε χρειάζεται να τρέχει "για πάντα" μέχρι να διακοπεί ρητά από μέσα, συνήθως με ένα <code>break</code>.</p>
<pre><code><span class="tok-kw">for</span> {
    <span class="tok-com">// runs forever unless a break or return statement stops it from inside</span>
}
</code></pre>

<h2>break και continue</h2>
<p>Δύο ειδικές λέξεις-κλειδιά σου δίνουν επιπλέον έλεγχο μέσα σε μια λούπα: το <code>break</code> σταματά <strong>εντελώς</strong> το πλησιέστερο (το πιο εσωτερικό) loop στο οποίο βρίσκεται, προχωρώντας κατευθείαν στον κώδικα μετά τη λούπα. Το <code>continue</code> παραλείπει μόνο την υπόλοιπη τρέχουσα επανάληψη — "πηδά" κατευθείαν στο επόμενο πέρασμα της λούπας (ελέγχοντας ξανά τη συνθήκη και εκτελώντας το βήμα, αν υπάρχει), χωρίς όμως να σταματήσει ολόκληρη τη λούπα.</p>

<h2>Labels για διακοπή εξωτερικών loops</h2>
<p>Όταν έχεις φωλιασμένα (nested) loops — δηλαδή ένα loop μέσα σε άλλο loop — και θες να διακόψεις το <em>εξωτερικό</em> loop απευθείας από μέσα από το εσωτερικό, ένα απλό <code>break</code> δεν αρκεί — αυτό θα σταματήσει μόνο το εσωτερικό loop, ενώ το εξωτερικό θα συνεχίσει κανονικά την επόμενη επανάληψή του. Η Go λύνει αυτό το πρόβλημα με <strong>labels</strong> (ετικέτες): μια ονομασία που τοποθετείς ακριβώς πάνω από μια λούπα, την οποία μπορείς έπειτα να στοχεύσεις ρητά με ένα <code>break</code> ή <code>continue</code> από οπουδήποτε βρίσκεσαι μέσα σε αυτήν, ακόμα κι από φωλιασμένα εσωτερικά loops:</p>
<pre><code>outer:
    <span class="tok-kw">for</span> i <span class="tok-kw">:=</span> <span class="tok-num">0</span>; i < <span class="tok-num">3</span>; i++ {
        <span class="tok-kw">for</span> j <span class="tok-kw">:=</span> <span class="tok-num">0</span>; j < <span class="tok-num">3</span>; j++ {
            <span class="tok-kw">if</span> j == <span class="tok-num">1</span> {
                <span class="tok-kw">break</span> outer <span class="tok-com">// breaks the OUTER loop entirely, not just the inner one</span>
            }
            fmt.<span class="tok-func">Println</span>(i, j)
        }
    }
</code></pre>
<p>Το <code>outer:</code> είναι το label, τοποθετημένο ακριβώς πάνω από το εξωτερικό <code>for</code>. Μέσα στο εσωτερικό loop, το <code>break outer</code> δεν σταματά απλά το εσωτερικό loop (όπως θα έκανε ένα απλό <code>break</code> χωρίς label) — σταματά κατευθείαν <em>και</em> το εξωτερικό loop με το όνομα <code>outer</code>, τερματίζοντας ολόκληρη τη φωλιασμένη δομή.</p>
`);

<div class="eyebrow">Ενότητα 5 / 8 — VSCode Challenge</div>
<h1>FizzBuzz</h1>
<p class="lede">Γράψε το κλασικό παιχνίδι "FizzBuzz" για τους αριθμούς 1 έως 20, χρησιμοποιώντας μία <code>for</code> loop και μία tagless <code>switch</code>. Τύπωσε "Fizz" για πολλαπλάσια του 3, "Buzz" για πολλαπλάσια του 5, "FizzBuzz" για πολλαπλάσια και των δύο ταυτόχρονα, ή τον ίδιο τον αριθμό αν δεν ισχύει τίποτα από τα παραπάνω.</p>
<div class="callout">
  <span class="tag">Οδηγίες</span>
  Θυμήσου τη σειρά ελέγχου των case: πρέπει να ελέγξεις πρώτα τη διπλή περίπτωση (πολλαπλάσιο και των δύο, δηλαδή του 15) πριν τις μεμονωμένες περιπτώσεις — αλλιώς το "FizzBuzz" δεν θα εμφανιστεί ποτέ, αφού η switch θα σταματήσει ήδη στο πρώτο case που ταιριάζει. Ο τελεστής <code>%</code> (modulo, το υπόλοιπο της ακέραιας διαίρεσης) σου δίνει τον τρόπο να ελέγξεις αν ένας αριθμός είναι πολλαπλάσιο κάποιου άλλου — αν <code>i % 3 == 0</code>, τότε το i είναι πολλαπλάσιο του 3.
</div>

<div class="spoiler"><div class="spoiler-lock"><span>Σύρε για να αποκαλυφθεί η λύση →</span></div><pre><code><span class="tok-kw">package</span> <span class="tok-func">main</span>

<span class="tok-kw">import</span> <span class="tok-str">"fmt"</span>

<span class="tok-kw">func</span> <span class="tok-func">main</span>() {
    <span class="tok-kw">for</span> i <span class="tok-kw">:=</span> <span class="tok-num">1</span>; i <= <span class="tok-num">20</span>; i++ {
        <span class="tok-kw">switch</span> {
        <span class="tok-kw">case</span> i%<span class="tok-num">15</span> == <span class="tok-num">0</span>:
            fmt.<span class="tok-func">Println</span>(<span class="tok-str">"FizzBuzz"</span>)
        <span class="tok-kw">case</span> i%<span class="tok-num">3</span> == <span class="tok-num">0</span>:
            fmt.<span class="tok-func">Println</span>(<span class="tok-str">"Fizz"</span>)
        <span class="tok-kw">case</span> i%<span class="tok-num">5</span> == <span class="tok-num">0</span>:
            fmt.<span class="tok-func">Println</span>(<span class="tok-str">"Buzz"</span>)
        <span class="tok-kw">default</span>:
            fmt.<span class="tok-func">Println</span>(i)
        }
    }
}
</code></pre></div>
`);

    addContent(`
<div class="eyebrow">Ενότητα 5 / 8 — Έλεγχος Ροής</div>
<h1>Παγίδες και Χρήσιμα Πράγματα για τα Loops</h1>
<p>Το πιο συχνό λάθος αρχαρίων με την <code>for</code> είναι η ακούσια (μη ηθελημένη) ατέρμων λούπα — συνήθως επειδή η συνθήκη τερματισμού ξεχάστηκε να ενημερωθεί σωστά, ή επειδή το βήμα (π.χ. <code>i++</code>) λείπει κατά λάθος από τη λούπα μόνο-με-συνθήκη:</p>
<pre><code><span class="tok-com">// BUG: i never changes value inside the loop body,</span>
<span class="tok-com">// so the condition i < 10 remains true forever</span>
<span class="tok-kw">for</span> i <span class="tok-kw">:=</span> <span class="tok-num">0</span>; i < <span class="tok-num">10</span>; {
    fmt.<span class="tok-func">Println</span>(i)
    <span class="tok-com">// missing i++ here — this loop will never stop on its own</span>
}
</code></pre>
<p>Ένα δεύτερο, εξίσου συχνό λάθος είναι η σύγχυση ανάμεσα σε <code>&lt;</code> και <code>&lt;=</code> στη συνθήκη — γνωστό ως <strong>off-by-one error</strong> (σφάλμα κατά ένα). Για παράδειγμα, αν γράψεις <code>i &lt; 10</code> ενώ στην πραγματικότητα ήθελες να συμπεριλάβεις και τον αριθμό 10 στην επανάληψη, η λούπα σου θα σταματήσει μία επανάληψη νωρίτερα από ό,τι σκόπευες — ένα λάθος αρκετά ύπουλο ώστε να περάσει απαρατήρητο αν δεν το ελέγξεις προσεκτικά.</p>
<div class="callout">
  <span class="tag">Σημείωση για τη συνέχεια του οδηγού</span>
  Σε αυτό το σημείο δεν έχουμε δει ακόμα τις έννοιες array/slice — η διάσχιση συλλογών δεδομένων με <code>for range</code> θα έρθει αναλυτικά στην Ενότητα 8. Προς το παρόν, οι λούπες που έγραψες δουλεύουν αποκλειστικά πάνω σε αριθμούς και λογικές συνθήκες, όχι πάνω σε συλλογές δεδομένων — αυτό θα αλλάξει σύντομα.
</div>
`);
