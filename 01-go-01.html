    addContent(`
<div class="eyebrow">Ενότητα 6 / 8 — Συναρτήσεις &amp; Scope</div>
<h1>Τι είναι, στην πραγματικότητα, μια Συνάρτηση;</h1>
<p class="lede">Έχεις ήδη χρησιμοποιήσει συναρτήσεις πολλές φορές μέχρι τώρα σε αυτόν τον οδηγό — η ίδια η <code>main()</code>, η <code>fmt.Println()</code>. Ήρθε η ώρα να κατανοήσεις πλήρως τι είναι, γιατί υπάρχουν, και πώς να φτιάχνεις τις δικές σου.</p>

<p>Μια <strong>συνάρτηση</strong> (function) είναι ένα ονομασμένο, αυτόνομο "κομμάτι" κώδικα, το οποίο μπορείς να "καλέσεις" (call) — δηλαδή να ζητήσεις να εκτελεστεί — από οποιοδήποτε άλλο σημείο του προγράμματός σου, όσες φορές θέλεις, χωρίς να χρειάζεται να ξαναγράψεις τον ίδιο κώδικα κάθε φορά. Οι συναρτήσεις είναι το βασικό εργαλείο <strong>οργάνωσης</strong> κώδικα σε σχεδόν κάθε γλώσσα προγραμματισμού: αντί να γράφεις ένα τεράστιο, αδιάσπαστο "τείχος" κώδικα μέσα στη <code>main()</code>, σπάς τη λογική σου σε μικρότερα, ονομασμένα κομμάτια, το καθένα υπεύθυνο για μία συγκεκριμένη δουλειά.</p>

<div class="callout">
  <span class="tag">Μια αναλογία: η συνταγή μέσα στη συνταγή</span>
  Φαντάσου ότι γράφεις μια συνταγή για ένα σύνθετο γλυκό, και ένα από τα βήματα είναι "φτιάξε ζαχαρόπαστα". Αντί να ξαναγράφεις κάθε φορά ολόκληρη τη διαδικασία της ζαχαρόπαστας μέσα στη συνταγή του γλυκού, μπορείς απλά να γράψεις "δες τη συνταγή 'Ζαχαρόπαστα' στη σελίδα 42" — και όποτε χρειαστεί ζαχαρόπαστα σε <em>οποιαδήποτε</em> άλλη συνταγή, παραπέμπεις πάλι εκεί, χωρίς επανάληψη. Μια συνάρτηση είναι ακριβώς αυτό: μια ξεχωριστή, ονομασμένη "συνταγή" κώδικα, στην οποία μπορείς να παραπέμπεις (να καλείς) από παντού.</p>
</div>

<h2>Γιατί χρησιμοποιούμε συναρτήσεις</h2>
<p>Πέρα από την προφανή εξοικονόμηση επανάληψης κώδικα, οι συναρτήσεις προσφέρουν και άλλα σημαντικά οφέλη: κάνουν τον κώδικα πιο <strong>ευανάγνωστο</strong> (ένα σωστά ονομασμένο <code>calculateTotal()</code> λέει αμέσως τι κάνει, χωρίς να χρειάζεται να διαβάσεις όλη τη λογική μέσα του), πιο <strong>ευέλικτο στο testing</strong> (μπορείς να ελέγξεις ξεχωριστά αν ένα μικρό κομμάτι λογικής δουλεύει σωστά, χωρίς να χρειάζεται να τρέξεις ολόκληρο το πρόγραμμα), και πιο εύκολο στη <strong>συντήρηση</strong> (αν χρειαστεί να διορθώσεις ένα bug ή να αλλάξεις μια συμπεριφορά, το κάνεις σε ένα μόνο σημείο αντί να ψάχνεις σε δεκάδες σημεία όπου έχεις αντιγράψει τον ίδιο κώδικα).</p>
`);

    addContent(`
<div class="eyebrow">Ενότητα 6 / 8 — Συναρτήσεις &amp; Scope</div>
<h1>Ανατομία μιας Συνάρτησης στη Go</h1>
<p class="lede">Ας δούμε τη σύνταξη λεπτομερώς, κομμάτι-κομμάτι.</p>

<h2>Ορισμός και κλήση</h2>
<pre><code><span class="tok-kw">func</span> <span class="tok-func">greet</span>(name <span class="tok-type">string</span>) {
    fmt.<span class="tok-func">Println</span>(<span class="tok-str">"Hello,"</span>, name)
}

<span class="tok-kw">func</span> <span class="tok-func">main</span>() {
    <span class="tok-func">greet</span>(<span class="tok-str">"there"</span>) <span class="tok-com">// calling the function defined above</span>
}
</code></pre>
<p>Η λέξη-κλειδί <code>func</code> ξεκινά τον <strong>ορισμό</strong> (definition) μιας συνάρτησης — εδώ γράφεις τη λογική της, μία και μοναδική φορά. Ακολουθεί το όνομα που εσύ επιλέγεις (<code>greet</code>), και μετά, μέσα σε παρένθεση, οι <strong>παράμετροι</strong> (parameters) της — οι "εισόδους" που δέχεται η συνάρτηση κάθε φορά που καλείται. Εδώ, η <code>greet</code> δέχεται μία παράμετρο, ονόματι <code>name</code>, τύπου <code>string</code>.</p>
<p>Μέσα στη <code>main()</code>, η γραμμή <code>greet("there")</code> είναι η <strong>κλήση</strong> (call) της συνάρτησης — εδώ "ζητάμε" να εκτελεστεί ο κώδικας που ορίσαμε παραπάνω, δίνοντας συγκεκριμένη τιμή (<code>"there"</code>) στην παράμετρο <code>name</code>. Κατά την εκτέλεση, ο υπολογιστής "πηδά" προσωρινά μέσα στη <code>greet</code>, εκτελεί ό,τι υπάρχει εκεί (τυπώνει "Hello, there"), και μετά επιστρέφει ακριβώς εκεί απ' όπου κλήθηκε, συνεχίζοντας κανονικά την υπόλοιπη <code>main()</code>.</p>

<h2>Παράμετροι και συμπτυγμένοι τύποι</h2>
<p>Όταν πολλαπλές διαδοχικές παράμετροι έχουν τον <em>ίδιο ακριβώς</em> τύπο, η Go σου επιτρέπει να παραλείψεις τον τύπο σε όλες εκτός από την τελευταία — ο compiler τον εφαρμόζει αναδρομικά και στις προηγούμενες:</p>
<pre><code><span class="tok-com">// equivalent to writing: func add(x int, y int) int</span>
<span class="tok-kw">func</span> <span class="tok-func">add</span>(x, y <span class="tok-type">int</span>) <span class="tok-type">int</span> {
    <span class="tok-kw">return</span> x + y
}
</code></pre>
<p>Αυτό είναι απλά μια συντόμευση συντακτικού (syntactic sugar) — δεν αλλάζει τίποτα στη λειτουργικότητα, απλά κάνει τον κώδικα λίγο πιο συμπυκνωμένο όταν πολλές παράμετροι μοιράζονται τον ίδιο τύπο.</p>
`);

    addContent(`
<div class="eyebrow">Ενότητα 6 / 8 — Συναρτήσεις &amp; Scope</div>
<h1>Τιμές Επιστροφής (Return Values)</h1>
<p class="lede">Μια συνάρτηση δεν χρειάζεται μόνο να "κάνει κάτι" — συχνά χρειάζεται και να επιστρέψει ένα αποτέλεσμα πίσω στο σημείο απ' όπου κλήθηκε, ώστε να μπορείς να το χρησιμοποιήσεις παρακάτω.</p>

<h2>Συνάρτηση με μία τιμή επιστροφής</h2>
<p>Ο τύπος της τιμής που επιστρέφει μια συνάρτηση γράφεται αμέσως μετά την παρένθεση των παραμέτρων της. Η λέξη-κλειδί <code>return</code>, μέσα στο σώμα της συνάρτησης, τερματίζει αμέσως την εκτέλεσή της και "στέλνει πίσω" την τιμή που ακολουθεί:</p>
<pre><code><span class="tok-kw">func</span> <span class="tok-func">square</span>(n <span class="tok-type">int</span>) <span class="tok-type">int</span> {
    <span class="tok-kw">return</span> n * n
}
</code></pre>
<p>Εδώ, το <code>int</code> μετά την παρένθεση λέει "αυτή η συνάρτηση, όταν κληθεί, θα επιστρέψει πάντα μια τιμή τύπου int". Ο compiler ελέγχει αυστηρά αυτή την υπόσχεση — αν προσπαθήσεις να γράψεις <code>return "hello"</code> μέσα σε μια συνάρτηση δηλωμένη να επιστρέφει <code>int</code>, το πρόγραμμα δεν θα μεταγλωττιστεί.</p>

<h2>Πολλαπλές τιμές επιστροφής</h2>
<p>Μια από τις πιο χαρακτηριστικές, ιδιωματικές (idiomatic) δυνατότητες της Go: μια συνάρτηση μπορεί να επιστρέψει <strong>περισσότερες από μία</strong> τιμές ταυτόχρονα, χωρίς να χρειάζεται να τις "τυλίξεις" σε κάποιο ειδικό αντικείμενο-δοχείο (όπως θα ήταν αναγκασμένος να κάνεις σε πολλές άλλες γλώσσες). Αυτό χρησιμοποιείται εξαιρετικά συχνά στο μοτίβο "αποτέλεσμα + error", το οποίο θα συναντάς κυριολεκτικά παντού σε κώδικα Go από εδώ και πέρα:</p>
<pre><code><span class="tok-kw">func</span> <span class="tok-func">divmod</span>(a, b <span class="tok-type">int</span>) (<span class="tok-type">int</span>, <span class="tok-type">int</span>) {
    <span class="tok-kw">return</span> a / b, a % b
}

quotient, remainder <span class="tok-kw">:=</span> <span class="tok-func">divmod</span>(<span class="tok-num">17</span>, <span class="tok-num">5</span>) <span class="tok-com">// quotient = 3, remainder = 2</span>
</code></pre>
<p>Οι δύο τύποι επιστροφής δηλώνονται μέσα σε παρένθεση, χωρισμένοι με κόμμα: <code>(int, int)</code>. Κατά την κλήση, δηλώνεις τόσες μεταβλητές όσες είναι και οι τιμές επιστροφής, χωρισμένες επίσης με κόμμα — η πρώτη μεταβλητή παίρνει την πρώτη τιμή επιστροφής, η δεύτερη την δεύτερη, κ.ο.κ.</p>

<h2>Ονοματισμένες τιμές επιστροφής (Named return values)</h2>
<p>Η Go σου επιτρέπει επιπλέον να δώσεις <em>ονόματα</em> στις ίδιες τις τιμές επιστροφής, μέσα στην ίδια τη δήλωση της συνάρτησης. Αυτά τα ονόματα συμπεριφέρονται ακριβώς σαν κανονικές, τοπικές μεταβλητές της συνάρτησης, αρχικοποιημένες αυτόματα στη zero value τους (θυμήσου την έννοια από την Ενότητα 2). Ένα "γυμνό" <code>return</code>, χωρίς να γράψεις καμία τιμή δίπλα του (naked return), επιστρέφει αυτόματα τις τρέχουσες τιμές αυτών των ονοματισμένων μεταβλητών, ό,τι τιμή κι αν έχουν εκείνη τη στιγμή:</p>
<pre><code><span class="tok-kw">func</span> <span class="tok-func">divmod</span>(a, b <span class="tok-type">int</span>) (q, r <span class="tok-type">int</span>) {
    q = a / b
    r = a % b
    <span class="tok-kw">return</span> <span class="tok-com">// naked return: automatically sends back the current q and r</span>
}
</code></pre>
<div class="callout">
  <span class="tag">Προσοχή με τα naked returns</span>
  Σε μικρές, απλές συναρτήσεις σαν την παραπάνω, τα naked returns μπορεί να είναι βολικά. Ωστόσο, σε μεγαλύτερες συναρτήσεις με πολλαπλά σημεία εξόδου, μπορούν να κάνουν τον κώδικα σημαντικά πιο δυσανάγνωστο — διαβάζοντας απλά ένα μοναχικό <code>return</code>, δεν είναι πάντα προφανές με μια ματιά ποιες ακριβώς τιμές επιστρέφονται, χωρίς να "σκρολάρεις" πίσω για να δεις τα named returns στη δήλωση. Πολλές ομάδες προγραμματιστών αποφεύγουν συνειδητά τα naked returns σε συναρτήσεις με πάνω από λίγες γραμμές κώδικα, ακριβώς για αυτόν τον λόγο.
</div>
`);

    addContent(`
<div class="eyebrow">Ενότητα 6 / 8 — Συναρτήσεις &amp; Scope</div>
<h1>Μεταβλητός Αριθμός Παραμέτρων (Variadic Functions)</h1>
<p class="lede">Μερικές φορές, όταν σχεδιάζεις μια συνάρτηση, δεν ξέρεις εκ των προτέρων πόσα ορίσματα θα της δοθούν κάθε φορά που θα κληθεί — η ίδια η <code>fmt.Println</code> που χρησιμοποιείς συνέχεια είναι ένα τέτοιο παράδειγμα, αφού δέχεται όσα ορίσματα θέλεις, από κανένα μέχρι πολλά.</p>

<p>Η Go επιτυγχάνει αυτή την ευελιξία με τη σύνταξη <code>...τύπος</code> μπροστά από το όνομα μιας παραμέτρου — αυτό λέγεται <strong>variadic parameter</strong> (παράμετρος μεταβλητού πλήθους). Μέσα στο σώμα της συνάρτησης, μια τέτοια παράμετρος συμπεριφέρεται σαν ένα slice (θα εξηγήσουμε πλήρως τι είναι slice στην Ενότητα 8, αλλά προς το παρόν αρκεί να το φαντάζεσαι σαν μια λίστα τιμών):</p>
<pre><code><span class="tok-kw">func</span> <span class="tok-func">sum</span>(nums ...<span class="tok-type">int</span>) <span class="tok-type">int</span> {
    total <span class="tok-kw">:=</span> <span class="tok-num">0</span>
    <span class="tok-kw">for</span> _, n <span class="tok-kw">:=</span> <span class="tok-kw">range</span> nums {
        total += n
    }
    <span class="tok-kw">return</span> total
}

<span class="tok-func">sum</span>(<span class="tok-num">1</span>, <span class="tok-num">2</span>, <span class="tok-num">3</span>)       <span class="tok-com">// works with any number of arguments — here, three</span>
<span class="tok-func">sum</span>(<span class="tok-num">5</span>, <span class="tok-num">10</span>)         <span class="tok-com">// or fewer — here, two</span>
<span class="tok-func">sum</span>()               <span class="tok-com">// or even none at all — nums would just be empty</span>
</code></pre>
<p>Δεν χρειάζεται να καταλάβεις πλήρως το <code>for _, n := range nums</code> σε αυτό το σημείο — θα το εξηγήσουμε αναλυτικά στην Ενότητα 8. Προς το παρόν, αρκεί να καταλάβεις ότι διασχίζει (δηλαδή περνάει διαδοχικά από) κάθε τιμή μέσα στο <code>nums</code> και τις προσθέτει όλες μαζί.</p>
<p>Ένας σημαντικός συντακτικός κανόνας: η variadic παράμετρος πρέπει να είναι πάντα η <strong>τελευταία</strong> στη λίστα παραμέτρων μιας συνάρτησης — δεν επιτρέπεται να ακολουθήσουν άλλες, "κανονικές" παράμετροι μετά από αυτήν, αφού ο compiler δεν θα μπορούσε να ξέρει πού "τελειώνει" η μεταβλητή λίστα και πού ξεκινά η επόμενη παράμετρος.</p>
`);

    addContent(`
<div class="eyebrow">Ενότητα 6 / 8 — Συναρτήσεις &amp; Scope</div>
<h1>Εμβέλεια (Scope) &amp; Διάρκεια Ζωής Μεταβλητών</h1>
<p class="lede">Η έννοια του "scope" έχει εμφανιστεί ήδη αρκετές φορές σε προηγούμενες ενότητες (π.χ. στο if με short statement, και στο shadowing). Ήρθε η ώρα να την εξηγήσουμε πλήρως, από τη βάση.</p>

<p>Το <strong>scope</strong> (εμβέλεια) μιας μεταβλητής είναι η "περιοχή" του κώδικά σου μέσα στην οποία αυτή η μεταβλητή είναι ορατή και μπορεί να χρησιμοποιηθεί. Έξω από αυτή την περιοχή, η μεταβλητή απλά δεν υπάρχει — σαν να μην την είχες ποτέ δηλώσει.</p>

<h2>Τοπικές (Local) vs Καθολικές (Global / Package-level) μεταβλητές</h2>
<p>Μια μεταβλητή δηλωμένη <em>μέσα</em> σε μια συνάρτηση είναι <strong>local</strong> (τοπική) — το scope της περιορίζεται αποκλειστικά μέσα σε εκείνη τη συνάρτηση. Δεν μπορείς να την "δεις" ή να τη χρησιμοποιήσεις από κάποια άλλη συνάρτηση, ούτε καν από τη <code>main()</code>, αν δεν δηλώθηκε εκεί. Επιπλέον, μια τοπική μεταβλητή "εξαφανίζεται" (η μνήμη της απελευθερώνεται) μόλις η συνάρτηση ολοκληρώσει την εκτέλεσή της και επιστρέψει.</p>
<p>Μια μεταβλητή δηλωμένη <em>εκτός</em> κάθε συνάρτησης, απευθείας στο επίπεδο του package (δηλαδή έξω από οποιαδήποτε <code>func</code>), είναι <strong>package-level</strong> (γνωστή επίσης και ως global/καθολική) — είναι προσβάσιμη από <em>οποιαδήποτε</em> συνάρτηση μέσα στο ίδιο package, καθ' όλη τη διάρκεια εκτέλεσης του προγράμματος.</p>

<h2>Block scope</h2>
<p>Κάθε ζεύγος αγκίστρων <code>{}</code> στη Go δημιουργεί το δικό του ξεχωριστό scope — αυτό ισχύει για το σώμα ενός <code>if</code>, ενός <code>for</code>, ακόμα και για ένα "γυμνό" block χωρίς καμία δομή γύρω του. Μια μεταβλητή δηλωμένη μέσα σε ένα τέτοιο block δεν είναι ορατή έξω από αυτό. Αυτό είναι, ακριβώς, ο μηχανισμός πίσω από το πρόβλημα του shadowing που είδαμε στην Ενότητα 4: όταν δηλώνεις μια μεταβλητή μέσα σε ένα εσωτερικό block με το ίδιο όνομα με μια εξωτερική, δημιουργείς μια εντελώς νέα μεταβλητή με το δικό της, περιορισμένο scope, η οποία απλά "κρύβει" προσωρινά την εξωτερική όσο βρίσκεσαι μέσα στο block.</p>

<h2>Exported vs Unexported identifiers — η σύμβαση κεφαλαίου/πεζού</h2>
<p>Πολλές γλώσσες προγραμματισμού διαθέτουν ρητές λέξεις-κλειδιά όπως <code>public</code> και <code>private</code> για να ορίσουν αν κάτι είναι ορατό από έξω, ή μόνο εσωτερικά. Η Go δεν έχει τέτοιες λέξεις-κλειδιά· αντ' αυτού, χρησιμοποιεί μια απλή, αλλά αυστηρά τηρημένη σύμβαση βασισμένη στο <strong>πρώτο γράμμα</strong> του ονόματος ενός identifier (δηλαδή του ονόματος μιας συνάρτησης, μεταβλητής, τύπου, κλπ.):</p>
<ul>
  <li>Αν το όνομα ξεκινά με <strong>κεφαλαίο</strong> γράμμα (π.χ. <code>DoSomething</code>), το identifier είναι <strong>exported</strong> (εξαγόμενο) — ορατό και χρησιμοποιήσιμο και από <em>άλλα</em> packages, όχι μόνο από το δικό του.</li>
  <li>Αν το όνομα ξεκινά με <strong>πεζό</strong> γράμμα (π.χ. <code>doSomething</code>), το identifier είναι <strong>unexported</strong> — ορατό μόνο μέσα στο ίδιο ακριβώς package, σαν "εσωτερική λεπτομέρεια υλοποίησης" που δεν αφορά κανέναν έξω από αυτό.</li>
</ul>
<pre><code><span class="tok-kw">func</span> <span class="tok-func">PublicHelper</span>() {}  <span class="tok-com">// exported: visible and usable from other packages</span>
<span class="tok-kw">func</span> <span class="tok-func">privateHelper</span>() {} <span class="tok-com">// unexported: only visible inside this same package</span>
</code></pre>
<p>Αυτή η σύμβαση σου δίνει έναν απλό, οπτικά άμεσο τρόπο να καταλάβεις, διαβάζοντας απλά τον κώδικα κάποιου άλλου, τι προορίζεται να χρησιμοποιηθεί "από έξω" και τι είναι απλά εσωτερική λεπτομέρεια — χωρίς να χρειάζεται να ψάξεις ξεχωριστή τεκμηρίωση για να το μάθεις.</p>
`);

<div class="eyebrow">Ενότητα 7 / 8 — Δείκτες &amp; Μνήμη</div>
<h1>Εισαγωγή στους Δείκτες</h1>
<p class="lede">Οι δείκτες (pointers) είναι συχνά το σημείο όπου όσοι μαθαίνουν προγραμματισμό δυσκολεύονται περισσότερο — όχι επειδή η ίδια η ιδέα είναι δύσκολη, αλλά επειδή είναι μια καινούρια έννοια που δεν έχει άμεσο αντίστοιχο στην καθημερινή ζωή. Ας το χτίσουμε βήμα-βήμα, ξεκινώντας από αυτά που ήδη ξέρεις.</p>

<h2>Υπενθύμιση: η μνήμη ως σειρά "κουτακιών" με διευθύνσεις</h2>
<p>Θυμήσου από την Ενότητα 2: κάθε μεταβλητή στο πρόγραμμά σου ζει, στην πραγματικότητα, κάπου μέσα στη μνήμη (RAM) του υπολογιστή, σε μια συγκεκριμένη, μοναδική <strong>διεύθυνση</strong> (address) — σαν έναν αριθμό δωματίου σε ένα τεράστιο ξενοδοχείο. Όταν γράφεις <code>age := 25</code>, ο compiler δεσμεύει ένα "δωμάτιο" στη μνήμη, γράφει εκεί την τιμή 25, και θυμάται ότι, από εδώ και πέρα, το όνομα <code>age</code> αναφέρεται σε εκείνο ακριβώς το δωμάτιο.</p>

<h2>Τι είναι, λοιπόν, ένας δείκτης</h2>
<p>Ένας <strong>δείκτης</strong> (pointer) είναι μια μεταβλητή που δεν αποθηκεύει μια "κανονική" τιμή, όπως έναν αριθμό ή ένα κείμενο — αντ' αυτού, αποθηκεύει τη <em>διεύθυνση</em> μιας άλλης μεταβλητής. Με άλλα λόγια, δεν κρατά το ίδιο το περιεχόμενο ενός "δωματίου" της μνήμης, αλλά τον <em>αριθμό</em> εκείνου του δωματίου — έναν τρόπο να "δείξεις" προς μια συγκεκριμένη τοποθεσία στη μνήμη.</p>

<div class="callout">
  <span class="tag">Μια αναλογία: το χαρτάκι με τη διεύθυνση</span>
  Φαντάσου ξανά το ξενοδοχείο με τα ντουλάπια από την Ενότητα 2. Μια κανονική μεταβλητή είναι το ίδιο το ντουλάπι, με το περιεχόμενό του μέσα — π.χ. ένα ντουλάπι με ετικέτα "ηλικία" που περιέχει τον αριθμό 25. Ένας δείκτης, αντίθετα, είναι σαν ένα ξεχωριστό χαρτάκι πάνω στο οποίο δεν είναι γραμμένος ο αριθμός 25, αλλά ο αριθμός σειράς του ντουλαπιού "ηλικία" (π.χ. "Ντουλάπι Νο. 4.482.991"). Κρατώντας αυτό το χαρτάκι, μπορείς να πας στο ακριβές ντουλάπι, να δεις τι περιέχει, ή ακόμα και να αλλάξεις το περιεχόμενό του — χωρίς να χρειάζεται να έχεις ονομάσει το ίδιο το ντουλάπι "ηλικία" εκεί που βρίσκεσαι.
</div>

<h2>Ο τελεστής &amp; (Address-of operator)</h2>
<p>Πώς παίρνεις, στην πράξη, τη διεύθυνση μιας μεταβλητής; Με το σύμβολο <code>&amp;</code> ("address-of", δηλαδή "η διεύθυνση του..."), τοποθετημένο ακριβώς μπροστά από το όνομα μιας μεταβλητής:</p>
<pre><code>x <span class="tok-kw">:=</span> <span class="tok-num">42</span>
p <span class="tok-kw">:=</span> &x <span class="tok-com">// p is now a pointer, holding the memory address of x</span>
fmt.<span class="tok-func">Println</span>(p) <span class="tok-com">// prints something like 0xc0000140a0 — a raw memory address</span>
</code></pre>
<p>Στη δεύτερη γραμμή, το <code>&amp;x</code> δεν "παίρνει" την τιμή 42 — παίρνει τη διεύθυνση στη μνήμη όπου βρίσκεται αποθηκευμένο το 42, και αυτή η διεύθυνση αποθηκεύεται στη νέα μεταβλητή <code>p</code>. Αν τυπώσεις το <code>p</code>, δεν θα δεις το 42 — θα δεις έναν παράξενα εμφανιζόμενο αριθμό σε δεκαεξαδική μορφή (κάτι σαν <code>0xc0000140a0</code>), που είναι η ίδια η διεύθυνση μνήμης, όχι το περιεχόμενο εκεί.</p>

<h2>Ο τελεστής * (Dereference operator)</h2>
<p>Έχοντας πλέον έναν δείκτη, πώς "ακολουθείς" αυτόν τον δείκτη για να φτάσεις στην πραγματική τιμή στην οποία δείχνει; Με το σύμβολο <code>*</code> ("dereference", δηλαδή "η τιμή στην οποία δείχνει..."), τοποθετημένο μπροστά από τον δείκτη:</p>
<pre><code>x <span class="tok-kw">:=</span> <span class="tok-num">42</span>
p <span class="tok-kw">:=</span> &x
fmt.<span class="tok-func">Println</span>(*p) <span class="tok-com">// prints 42 — the actual value stored at the address p holds</span>

*p = <span class="tok-num">100</span> <span class="tok-com">// writes through the pointer, changing x itself in memory</span>
fmt.<span class="tok-func">Println</span>(x) <span class="tok-com">// prints 100 — x really did change, even though we never wrote "x = 100"</span>
</code></pre>
<p>Η τελευταία γραμμή είναι το πιο σημαντικό σημείο σε όλη αυτή την ενότητα: γράφοντας <code>*p = 100</code>, δεν αλλάζουμε τον ίδιο τον δείκτη <code>p</code> (δεν αλλάζουμε τη διεύθυνση στην οποία δείχνει) — αλλάζουμε την τιμή <em>στο σημείο της μνήμης όπου δείχνει</em>, δηλαδή αλλάζουμε το ίδιο το <code>x</code>, μέσω μιας "παρακαμπτήριας διαδρομής". Γι' αυτό, όταν τυπώνουμε ξανά το <code>x</code> απευθείας, βλέπουμε την καινούρια τιμή 100, παρόλο που ποτέ δεν γράψαμε ρητά <code>x = 100</code>.</p>

<h2>Η μηδενική τιμή nil</h2>
<p>Θυμήσου από την Ενότητα 2 ότι κάθε τύπος έχει μια zero value. Για τους δείκτες, η zero value είναι <code>nil</code> — μια ειδική τιμή που σημαίνει "αυτός ο δείκτης δεν δείχνει πουθενά, δεν κρατά καμία έγκυρη διεύθυνση μνήμης". Η προσπάθεια να κάνεις dereference έναν δείκτη που είναι <code>nil</code> (δηλαδή να γράψεις <code>*p</code> τη στιγμή που το <code>p</code> είναι <code>nil</code>) προκαλεί ένα <strong>panic</strong> κατά την εκτέλεση — ένα απότομο, ελεγχόμενο "κράσιμο" του προγράμματος, αφού η γλώσσα δεν έχει καμία πραγματική διεύθυνση να ακολουθήσει. Αυτό είναι, στην πράξη, ένα από τα πιο συχνά runtime σφάλματα (σφάλματα κατά την εκτέλεση, όχι κατά τη μεταγλώττιση) σε προγράμματα Go, ειδικά σε αρχάριους.</p>
`);

    addContent(`
<div class="eyebrow">Ενότητα 7 / 8 — Δείκτες &amp; Μνήμη</div>
<h1>Πέρασμα Παραμέτρων: By Value vs By Reference</h1>
<p class="lede">Τώρα που καταλαβαίνεις τι είναι ένας δείκτης, μπορούμε να εξηγήσουμε μια από τις πιο σημαντικές —και αρχικά μπερδεμένες— συμπεριφορές της Go όσον αφορά τις συναρτήσεις.</p>

<h2>Πώς η Go περνάει τα πάντα "by value"</h2>
<p>Στη Go, <strong>τα πάντα περνούν με τιμή</strong> (pass by value) όταν καλείς μια συνάρτηση — και ναι, αυτό ισχύει ακόμα και για τους ίδιους τους δείκτες, όπως θα δούμε αμέσως παρακάτω. Αυτό σημαίνει το εξής: όταν περνάς μια μεταβλητή ως όρισμα σε μια συνάρτηση, η συνάρτηση δεν παίρνει την ίδια τη μεταβλητή — παίρνει ένα ξεχωριστό <em>αντίγραφο</em> της τιμής της, αποθηκευμένο σε νέα, ανεξάρτητη θέση μνήμης. Οποιαδήποτε αλλαγή γίνει σε αυτό το αντίγραφο, μέσα στη συνάρτηση, δεν επηρεάζει καθόλου το πρωτότυπο έξω από αυτήν.</p>
<pre><code><span class="tok-kw">func</span> <span class="tok-func">tryToChange</span>(n <span class="tok-type">int</span>) {
    n = <span class="tok-num">999</span> <span class="tok-com">// this only changes the LOCAL COPY of n, inside this function</span>
}

x <span class="tok-kw">:=</span> <span class="tok-num">5</span>
<span class="tok-func">tryToChange</span>(x)
fmt.<span class="tok-func">Println</span>(x) <span class="tok-com">// still prints 5 — the original x was never touched at all</span>
</code></pre>
<p>Στο παράδειγμα παραπάνω, όταν καλούμε <code>tryToChange(x)</code>, η συνάρτηση παίρνει ένα αντίγραφο της τιμής 5 και το αποθηκεύει στη δική της, τοπική μεταβλητή <code>n</code> (θυμήσου το scope από την Ενότητα 6 — η <code>n</code> εδώ είναι εντελώς ξεχωριστή, τοπική μεταβλητή, όχι το ίδιο "κουτάκι μνήμης" με το <code>x</code>). Όταν μέσα στη συνάρτηση γράφουμε <code>n = 999</code>, αλλάζουμε μόνο αυτό το τοπικό αντίγραφο — το πρωτότυπο <code>x</code>, πίσω στη <code>main</code>, παραμένει απείραχτο.</p>

<h2>Τροποποίηση μέσω δεικτών</h2>
<p>Για να τροποποιήσεις πραγματικά μια εξωτερική μεταβλητή "από μέσα" σε μια συνάρτηση, χρειάζεται να περάσεις σε αυτήν, αντί για την ίδια την τιμή, έναν <strong>δείκτη</strong> προς αυτή τη μεταβλητή. Έτσι, η συνάρτηση εξακολουθεί να παίρνει ένα "αντίγραφο" (θυμήσου, όλα περνούν by value στη Go) — αλλά αυτή τη φορά, το αντίγραφο είναι της ίδιας της <em>διεύθυνσης</em>, όχι της τιμής. Κάνοντας dereference αυτόν τον δείκτη μέσα στη συνάρτηση (με <code>*</code>), φτάνεις στην ίδια, πρωτότυπη θέση μνήμης — άρα οποιαδήποτε αλλαγή κάνεις εκεί, επηρεάζει πραγματικά την αρχική μεταβλητή:</p>
<pre><code><span class="tok-kw">func</span> <span class="tok-func">reallyChange</span>(n *<span class="tok-type">int</span>) {
    *n = <span class="tok-num">999</span> <span class="tok-com">// dereferences the pointer, writing through to the ORIGINAL x</span>
}

x <span class="tok-kw">:=</span> <span class="tok-num">5</span>
<span class="tok-func">reallyChange</span>(&x)
fmt.<span class="tok-func">Println</span>(x) <span class="tok-com">// prints 999 — x was genuinely, actually modified this time</span>
</code></pre>
<p>Η παράμετρος εδώ δηλώνεται ως <code>n *int</code> — δηλαδή "μια παράμετρος n, τύπου pointer-προς-int". Όταν καλούμε <code>reallyChange(&amp;x)</code>, δεν περνάμε το 5 απευθείας· περνάμε τη <em>διεύθυνση</em> του <code>x</code>. Μέσα στη συνάρτηση, <code>*n = 999</code> σημαίνει "πήγαινε στη διεύθυνση που κρατά το n, και γράψε εκεί την τιμή 999" — και αφού αυτή η διεύθυνση είναι ακριβώς εκεί που βρίσκεται το <code>x</code> στη <code>main</code>, το <code>x</code> πράγματι αλλάζει.</p>

<h2>Πότε να χρησιμοποιείς δείκτες, και πότε όχι</h2>
<div class="grid2">
  <div class="card"><h3>Χρησιμοποίησε δείκτη όταν</h3><p>Θες η συνάρτηση να τροποποιήσει πραγματικά την αρχική, εξωτερική μεταβλητή. Ή όταν η τιμή που περνάς είναι "βαριά" (μια μεγάλη δομή δεδομένων) και θες να αποφύγεις το κόστος αντιγραφής ολόκληρης της δομής σε κάθε κλήση συνάρτησης.</p></div>
  <div class="card"><h3>Απόφυγε τον δείκτη όταν</h3><p>Η τιμή είναι μικρή (όπως ένα int ή bool) και δεν χρειάζεται καμία τροποποίηση από τη συνάρτηση — το αντίγραφο είναι πρακτικά "δωρεάν" σε κόστος, και ο κώδικας παραμένει πιο απλός και ευανάγνωστος χωρίς την επιπλέον πολυπλοκότητα του dereferencing.</p></div>
</div>
`);

<div class="eyebrow">Ενότητα 7 / 8 — VSCode Challenge</div>
<h1>Μηδενισμός By Value vs By Pointer</h1>
<p class="lede">Γράψε μια συνάρτηση <code>zeroValue(val int)</code> που προσπαθεί να μηδενίσει μια μεταβλητή (by value) και μια συνάρτηση <code>zeroPointer(val *int)</code> που τη μηδενίζει πραγματικά μέσω δείκτη. Τύπωσε τη διεύθυνση μνήμης (<code>&amp;x</code>) και την τιμή της μεταβλητής στη main, πριν και μετά από κάθε κλήση.</p>
<div class="callout">
  <span class="tag">Οδηγίες</span>
  Η διεύθυνση του x στη main δεν θα αλλάξει ποτέ σε όλο το πρόγραμμα — αυτό που αλλάζει (ή δεν αλλάζει, ανάλογα με την περίπτωση) είναι η <em>τιμή</em> που περιέχεται σε εκείνη τη διεύθυνση. Παρατήρησε προσεκτικά τη διαφορά στα prints πριν και μετά από κάθε κλήση, για να δεις με τα ίδια σου τα μάτια τη διαφορά που κάνει ο δείκτης.
</div>

<div class="spoiler"><div class="spoiler-lock"><span>Σύρε για να αποκαλυφθεί η λύση →</span></div><pre><code><span class="tok-kw">package</span> <span class="tok-func">main</span>

<span class="tok-kw">import</span> <span class="tok-str">"fmt"</span>

<span class="tok-kw">func</span> <span class="tok-func">zeroValue</span>(val <span class="tok-type">int</span>) {
    val = <span class="tok-num">0</span> <span class="tok-com">// only changes the local copy, has no effect outside</span>
}

<span class="tok-kw">func</span> <span class="tok-func">zeroPointer</span>(val *<span class="tok-type">int</span>) {
    *val = <span class="tok-num">0</span> <span class="tok-com">// writes through to the original variable's memory address</span>
}

<span class="tok-kw">func</span> <span class="tok-func">main</span>() {
    x <span class="tok-kw">:=</span> <span class="tok-num">10</span>
    fmt.<span class="tok-func">Println</span>(<span class="tok-str">"before zeroValue:"</span>, &x, x)
    <span class="tok-func">zeroValue</span>(x)

    fmt.<span class="tok-func">Println</span>(<span class="tok-str">"before zeroPointer:"</span>, &x, x)
    <span class="tok-func">zeroPointer</span>(&x)
    fmt.<span class="tok-func">Println</span>(<span class="tok-str">"after zeroPointer: "</span>, &x, x) <span class="tok-com">// x is now 0</span>

    addContent(`
<div class="eyebrow">Ενότητα 8 / 8 — Συλλογές Δεδομένων</div>
<h1>Τι Σημαίνει "Συλλογή Δεδομένων"</h1>
<p class="lede">Μέχρι τώρα, κάθε μεταβλητή που είδαμε κρατούσε <em>μία</em> μεμονωμένη τιμή — έναν αριθμό, ένα string, ένα bool. Στην πράξη, πολύ συχνά χρειάζεσαι να αποθηκεύσεις <em>πολλές</em> σχετικές τιμές μαζί, οργανωμένες κάτω από ένα ενιαίο όνομα — π.χ. μια λίστα με ονόματα, ή τους βαθμούς όλων των μαθητών μιας τάξης. Αυτό ακριβώς προσφέρουν οι <strong>συλλογές δεδομένων</strong> (data collections/structures), και σε αυτή την τελευταία ενότητα του Μέρους 1 θα δούμε τις τρεις βασικές που προσφέρει η Go: arrays, slices, και maps.</p>

<h1>Πίνακες (Arrays)</h1>
<p class="lede">Η Go ξεκινά με το πιο "ωμό", βασικό εργαλείο συλλογής δεδομένων: τον πίνακα σταθερού μεγέθους. Θα δούμε αμέσως γιατί, στην πράξη, οι έμπειροι προγραμματιστές Go χρησιμοποιούν σχεδόν πάντα κάτι πιο ευέλικτο αντ' αυτού.</p>

<h2>Δήλωση και αρχικοποίηση</h2>
<p>Ένα <strong>array</strong> (πίνακας) στη Go έχει <strong>σταθερό μέγεθος</strong>, ορισμένο κατά τη στιγμή της δήλωσής του και αμετάβλητο για πάντα, καθ' όλη τη διάρκεια ζωής του — δεν μπορείς ποτέ να το "μεγαλώσεις" ή να το "μικρύνεις" αργότερα. Το μέγεθος είναι μάλιστα μέρος του ίδιου του τύπου του array:</p>
<pre><code><span class="tok-kw">var</span> nums [<span class="tok-num">5</span>]<span class="tok-type">int</span> <span class="tok-com">// an array of EXACTLY 5 ints, each initialized to the zero value 0</span>
letters <span class="tok-kw">:=</span> [<span class="tok-num">3</span>]<span class="tok-type">string</span>{<span class="tok-str">"a"</span>, <span class="tok-str">"b"</span>, <span class="tok-str">"c"</span>}
</code></pre>
<p>Στην πρώτη γραμμή, το <code>[5]int</code> σημαίνει "πίνακας από ακριβώς 5 στοιχεία, το καθένα τύπου int" — αφού δεν δώσαμε αρχικές τιμές, κάθε ένα από τα 5 στοιχεία παίρνει αυτόματα τη zero value του <code>int</code>, δηλαδή 0.</p>

<h2>Προσπέλαση και τροποποίηση στοιχείων</h2>
<p>Κάθε στοιχείο μέσα σε ένα array έχει μια θέση, γνωστή ως <strong>index</strong> (δείκτης θέσης — προσοχή, διαφορετική έννοια από τον "δείκτη/pointer" της Ενότητας 7, παρόλο που η ελληνική λέξη μοιάζει). Το index ξεκινά πάντα από το <code>0</code>, όχι από το 1 — το πρώτο στοιχείο ενός array βρίσκεται στη θέση <code>0</code>, το δεύτερο στη θέση <code>1</code>, κ.ο.κ.:</p>
<pre><code>nums[<span class="tok-num">0</span>] = <span class="tok-num">10</span> <span class="tok-com">// sets the FIRST element (index 0) to 10</span>
fmt.<span class="tok-func">Println</span>(nums[<span class="tok-num">0</span>]) <span class="tok-com">// reads back the value at index 0, prints 10</span>
</code></pre>

<h2>Οι περιορισμοί των Arrays</h2>
<p>Επειδή το μέγεθος είναι μέρος του ίδιου του τύπου ενός array, ένα <code>[3]int</code> και ένα <code>[5]int</code> θεωρούνται από τον compiler <strong>εντελώς διαφορετικοί τύποι</strong> — δεν μπορείς να αναθέσεις το ένα στο άλλο, ούτε να περάσεις σε μια συνάρτηση που περιμένει συγκεκριμένο μέγεθος array ένα array διαφορετικού μεγέθους. Αυτή η ακαμψία (δηλαδή η έλλειψη ευελιξίας) είναι ο κύριος λόγος για τον οποίο τα arrays χρησιμοποιούνται σπάνια απευθείας στην καθημερινή δουλειά με Go· στη θέση τους, οι προγραμματιστές χρησιμοποιούν σχεδόν πάντα <strong>slices</strong>, τα οποία θα δούμε αμέσως παρακάτω.</p>
`);

    addContent(`
<div class="eyebrow">Ενότητα 8 / 8 — Συλλογές Δεδομένων</div>
<h1>Slices (Δυναμικοί Πίνακες)</h1>
<p class="lede">Το slice είναι η δομή δεδομένων που πραγματικά χρησιμοποιείς όταν θες μια "λίστα" στη Go — ευέλικτο σε μέγεθος, χτισμένο εσωτερικά πάνω από ένα array, αλλά χωρίς τους περιορισμούς του.</p>

<h2>Τι είναι ένα Slice, και πώς διαφέρει από ένα Array</h2>
<p>Ένα <strong>slice</strong>, σε αντίθεση με ένα array, <strong>δεν</strong> έχει σταθερό, προκαθορισμένο μέγεθος — μπορεί να "μεγαλώσει" δυναμικά κατά την εκτέλεση του προγράμματος, ανάλογα με τις ανάγκες σου. Τεχνικά, ένα slice δεν είναι μια αυτόνομη δομή δεδομένων από μόνο του — είναι μια "θέα" (view), δηλαδή ένα παράθυρο πρόσβασης πάνω σε ένα υποκείμενο (underlying) array που υπάρχει "από κάτω", κρυμμένο. Αυτή η υποκείμενη δομή είναι κάτι που, ως χρήστης του slice, συνήθως δεν χρειάζεται να διαχειριστείς απευθείας — η Go το κάνει αυτόματα για λογαριασμό σου.</p>

<h2>Ανατομία ενός Slice — τρία εσωτερικά κομμάτια</h2>
<p>Εσωτερικά, ένα slice αποτελείται πάντα από τρία κομμάτια πληροφορίας:</p>
<div class="grid3">
  <div class="card"><h3>Pointer</h3><p>Ένας δείκτης (θυμήσου την Ενότητα 7) που δείχνει στο πρώτο στοιχείο του υποκείμενου array που "βλέπει" αυτό το slice.</p></div>
  <div class="card"><h3>Length (len)</h3><p>Πόσα στοιχεία περιέχει το slice <em>αυτή τη στιγμή</em> — αυτό δηλαδή που βλέπεις όταν το διασχίζεις ή το τυπώνεις.</p></div>
  <div class="card"><h3>Capacity (cap)</h3><p>Πόσα στοιχεία θα χωρούσαν <em>συνολικά</em> στο υποκείμενο array, πριν χρειαστεί η Go να δημιουργήσει ένα εντελώς νέο, μεγαλύτερο array στο παρασκήνιο.</p></div>
</div>

<h2>Τρόποι δημιουργίας Slices</h2>
<pre><code>a <span class="tok-kw">:=</span> []<span class="tok-type">int</span>{<span class="tok-num">1</span>, <span class="tok-num">2</span>, <span class="tok-num">3</span>}     <span class="tok-com">// slice literal: creates a slice directly with these 3 values</span>
b <span class="tok-kw">:=</span> <span class="tok-func">make</span>([]<span class="tok-type">int</span>, <span class="tok-num">5</span>)     <span class="tok-com">// make: creates a slice of length 5, all elements zero-valued</span>
c <span class="tok-kw">:=</span> a[<span class="tok-num">0</span>:<span class="tok-num">2</span>]           <span class="tok-com">// slicing: a new slice view over elements at index 0 and 1 of a</span>
</code></pre>
<p>Η ενσωματωμένη συνάρτηση <code>make</code> είναι ένας ειδικός τρόπος να δημιουργήσεις άδεια, αλλά έτοιμα προς χρήση, slices (και maps, όπως θα δούμε παρακάτω). Η σύνταξη <code>a[0:2]</code> λέγεται <strong>slicing</strong> — παίρνει ένα υπάρχον slice (ή array) και δημιουργεί ένα νέο slice που "βλέπει" μόνο ένα υποσύνολο των στοιχείων του, από τη θέση 0 (συμπεριλαμβανομένης) μέχρι τη θέση 2 (μη συμπεριλαμβανομένης) — δηλαδή τα στοιχεία στις θέσεις 0 και 1.</p>

<h2>Προσθήκη στοιχείων με την append, και το γιατί της επανεκχώρησης</h2>
<p>Η ενσωματωμένη συνάρτηση <code>append</code> προσθέτει ένα ή περισσότερα στοιχεία στο <em>τέλος</em> ενός υπάρχοντος slice. Αν η τρέχουσα capacity του slice δεν αρκεί για να χωρέσει το νέο στοιχείο, η Go αναλαμβάνει αυτόματα να δημιουργήσει, στο παρασκήνιο, ένα <strong>νέο, μεγαλύτερο</strong> υποκείμενο array, να αντιγράψει εκεί όλα τα παλιά στοιχεία, και να επιστρέψει ένα νέο slice που δείχνει σε αυτό το νέο array:</p>
<pre><code>nums <span class="tok-kw">:=</span> []<span class="tok-type">int</span>{<span class="tok-num">1</span>, <span class="tok-num">2</span>}
nums = <span class="tok-func">append</span>(nums, <span class="tok-num">3</span>) <span class="tok-com">// ALWAYS reassign — append may return a completely NEW slice</span>
</code></pre>
<div class="callout">
  <span class="tag">Γιατί πάντα nums = append(nums, ...)</span>
  Επειδή η <code>append</code> ενδέχεται να χρειαστεί να δημιουργήσει ένα νέο υποκείμενο array (όταν η παλιά capacity δεν αρκεί πια), το slice που σου επιστρέφει μπορεί να "δείχνει" αλλού από ό,τι έδειχνε το αρχικό slice πριν την κλήση. Αν δεν ξανααναθέσεις την επιστρεφόμενη τιμή στη μεταβλητή σου (όπως στο παράδειγμα, <code>nums = append(...)</code>), το πρόγραμμά σου θα μπορούσε να συνεχίσει να χρησιμοποιεί το "παλιό" slice, το οποίο δεν περιέχει το νέο στοιχείο που μόλις πρόσθεσες — ένα ύπουλο bug που εμφανίζεται μόνο περιστασιακά, ανάλογα με το πότε ακριβώς χρειάστηκε νέο υποκείμενο array.
</div>

<h2>Αντιγραφή Slices με την copy</h2>
<p>Η ενσωματωμένη συνάρτηση <code>copy(dst, src)</code> αντιγράφει στοιχεία από ένα slice (<code>src</code> — source, πηγή) σε ένα άλλο (<code>dst</code> — destination, προορισμός), δημιουργώντας ένα πραγματικά ανεξάρτητο αντίγραφο — τα δύο slices δεν θα μοιράζονται πλέον το ίδιο υποκείμενο array μετά την αντιγραφή, οπότε αλλαγές στο ένα δεν θα επηρεάζουν το άλλο.</p>
`);

<div class="eyebrow">Ενότητα 8 / 8 — Συλλογές Δεδομένων</div>
<h1>Προσπέλαση Συλλογών — Διάσχιση με Loops</h1>
<p class="lede">Έχοντας μια συλλογή δεδομένων, το πιο συνηθισμένο πράγμα που θα χρειαστεί να κάνεις είναι να "περάσεις" από κάθε στοιχείο της, ένα προς ένα — αυτό λέγεται <strong>διάσχιση</strong> (traversal ή iteration). Η Go σου προσφέρει δύο τρόπους.</p>

<h2>Με απλή for</h2>
<p>Μπορείς να χρησιμοποιήσεις την κλασική μορφή της <code>for</code> που είδαμε στην Ενότητα 5, χρησιμοποιώντας έναν μετρητή που ξεκινά από 0 και φτάνει μέχρι το μήκος (length) της συλλογής, χρησιμοποιώντας την ενσωματωμένη συνάρτηση <code>len()</code> που επιστρέφει το τρέχον μήκος ενός slice ή array:</p>
<pre><code><span class="tok-kw">for</span> i <span class="tok-kw">:=</span> <span class="tok-num">0</span>; i < <span class="tok-func">len</span>(nums); i++ {
    fmt.<span class="tok-func">Println</span>(nums[i])
}
</code></pre>

<h2>Με range (index + value)</h2>
<p>Η Go προσφέρει επίσης μια πιο σύντομη, πιο ιδιωματική μορφή, χρησιμοποιώντας τη λέξη-κλειδί <code>range</code> μέσα στην <code>for</code>. Σε κάθε επανάληψη, σου δίνει αυτόματα <em>και</em> το index <em>και</em> την τιμή του στοιχείου σε εκείνη τη θέση, χωρίς να χρειάζεται να τα υπολογίσεις χειροκίνητα:</p>
<pre><code><span class="tok-kw">for</span> i, v <span class="tok-kw">:=</span> <span class="tok-kw">range</span> nums {
    fmt.<span class="tok-func">Println</span>(i, v) <span class="tok-com">// i = the index (position), v = the value at that index</span>
}
</code></pre>

<h2>Σύγκριση των δύο προσεγγίσεων</h2>
<div class="grid2">
  <div class="card"><h3>Απλή for</h3><p>Πιο ρητή και "φλύαρη" (μεγαλύτερος όγκος κώδικα), αλλά σου δίνει πλήρη έλεγχο πάνω στο index — π.χ. αν θέλεις να παραλείψεις ορισμένα στοιχεία, να διασχίσεις ανάποδα, ή να προχωρήσεις με βήμα διαφορετικό από 1.</p></div>
  <div class="card"><h3>for range</h3><p>Πιο σύντομη και το πιο συνηθισμένο, "ιδιωματικό" (idiomatic) μοτίβο στη Go για την απλή περίπτωση "πέρνα από όλα τα στοιχεία διαδοχικά, με τη φυσική τους σειρά". Λιγότερο κατάλληλη για μη-γραμμικές, πιο σύνθετες διασχίσεις.</p></div>
</div>

<div class="callout">
  <span class="tag">Προσοχή: panic σε πρόσβαση εκτός ορίων</span>
  Η προσπάθεια πρόσβασης σε ένα index εκτός των έγκυρων ορίων μιας συλλογής (π.χ. <code>nums[10]</code>, όταν το slice έχει μόνο 5 στοιχεία, δηλαδή έγκυρα index από 0 έως 4) προκαλεί <strong>panic</strong> κατά την εκτέλεση — το πρόγραμμα τερματίζεται απότομα, εκτός αν υπάρχει ειδικός χειρισμός ανάκτησης (recover, μια έννοια πιο προχωρημένη από όσα καλύπτει αυτό το Μέρος 1). Αυτό συμβαίνει αρκετά συχνά σε loops όπου η συνθήκη τερματισμού είναι λανθασμένη — π.χ. αν γράψεις κατά λάθος <code>i &lt;= len(nums)</code> αντί για το σωστό <code>i &lt; len(nums)</code>, θα προσπαθήσεις να διαβάσεις ένα στοιχείο μία θέση παραπάνω από όσα πραγματικά υπάρχουν.
</div>

<h2>Παράλειψη μεταβλητών με τον τελεστή _ (Blank identifier)</h2>
<p>Αν σε ένα <code>for range</code> δεν σε ενδιαφέρει καθόλου το index, ή δεν σε ενδιαφέρει καθόλου η τιμή, η Go σού δίνει έναν τρόπο να το δηλώσεις ρητά αγνοώντας το: τον <strong>blank identifier</strong> <code>_</code> (κάτω παύλα). Αυτό είναι απαραίτητο επειδή, όπως θυμάσαι από την Ενότητα 1, η Go αρνείται να μεταγλωττίσει κώδικα με δηλωμένες αλλά ποτέ χρησιμοποιημένες τοπικές μεταβλητές — το <code>_</code> λέει ρητά στον compiler "ξέρω ότι υπάρχει αυτή η τιμή εδώ, αλλά σκόπιμα δεν με ενδιαφέρει, μην με προειδοποιείς γι' αυτήν":</p>
<pre><code><span class="tok-kw">for</span> _, v <span class="tok-kw">:=</span> <span class="tok-kw">range</span> nums {
    fmt.<span class="tok-func">Println</span>(v) <span class="tok-com">// we only care about the value here, so we discard the index with _</span>
}
</code></pre>
`);

<div class="eyebrow">Ενότητα 8 / 8 — Συλλογές Δεδομένων</div>
<h1>Χάρτες (Maps)</h1>
<p class="lede">Ο τελευταίος τύπος συλλογής δεδομένων σε αυτόν τον οδηγό: ο map, η δομή "κλειδί/τιμή" (key/value) της Go — αντίστοιχο με ό,τι σε άλλες γλώσσες ονομάζεται dictionary ή hash map.</p>

<h2>Τι είναι ένας Map</h2>
<p>Σε ένα slice ή array, προσπελαύνεις τα στοιχεία μέσω ενός αριθμητικού index (0, 1, 2, ...). Σε έναν <strong>map</strong>, αντ' αυτού, κάθε τιμή συνδέεται με ένα δικό της, μοναδικό <strong>κλειδί</strong> (key) — που μπορεί να είναι, για παράδειγμα, ένα string, αντί για έναν απλό αύξοντα αριθμό. Αυτό είναι εξαιρετικά χρήσιμο όταν θες να "ψάχνεις" γρήγορα δεδομένα με βάση κάτι πιο νοηματικό από μια αριθμημένη θέση — π.χ. να αποθηκεύσεις την ηλικία ενός ατόμου, με το όνομά του ως κλειδί αναζήτησης.</p>

<h2>Δήλωση και αρχικοποίηση</h2>
<pre><code>ages <span class="tok-kw">:=</span> <span class="tok-func">make</span>(<span class="tok-kw">map</span>[<span class="tok-type">string</span>]<span class="tok-type">int</span>)  <span class="tok-com">// an empty map, ready to use: keys are strings, values are ints</span>

scores <span class="tok-kw">:=</span> <span class="tok-kw">map</span>[<span class="tok-type">string</span>]<span class="tok-type">int</span>{     <span class="tok-com">// map literal, with initial key/value pairs already filled in</span>
    <span class="tok-str">"first"</span>:  <span class="tok-num">90</span>,
    <span class="tok-str">"second"</span>: <span class="tok-num">85</span>,
}
</code></pre>
<p>Η σύνταξη <code>map[string]int</code> σημαίνει "map όπου τα κλειδιά είναι τύπου string, και οι τιμές είναι τύπου int". Όπως και με τα slices, η <code>make</code> δημιουργεί έναν κενό, αλλά έτοιμο προς χρήση map.</p>

<h2>Προσθήκη, ενημέρωση, και διαγραφή στοιχείων</h2>
<pre><code>ages[<span class="tok-str">"someone"</span>] = <span class="tok-num">20</span>       <span class="tok-com">// adds a new entry, OR updates an existing one — same syntax either way</span>
<span class="tok-func">delete</span>(ages, <span class="tok-str">"someone"</span>)  <span class="tok-com">// removes a key (and its value) entirely from the map</span>
</code></pre>
<p>Η σύνταξη είναι ίδια είτε προσθέτεις ένα εντελώς νέο κλειδί, είτε ενημερώνεις την τιμή ενός κλειδιού που υπάρχει ήδη — η Go το χειρίζεται αυτόματα, χωρίς να χρειάζεται να ελέγξεις ρητά ποιο από τα δύο συμβαίνει.</p>

<h2>Έλεγχος ύπαρξης κλειδιού — το πρόβλημα και η λύση του</h2>
<p>Εδώ προκύπτει ένα ενδιαφέρον πρόβλημα: πώς ξεχωρίζεις την περίπτωση "αυτό το κλειδί υπάρχει στον map, και η τιμή του τυχαίνει να είναι 0" από την περίπτωση "αυτό το κλειδί δεν υπάρχει καθόλου στον map"; Αν έγραφες απλά <code>ages["someone"]</code> για ένα κλειδί που δεν υπάρχει, η Go θα σου επέστρεφε τη zero value του τύπου της τιμής (δηλαδή 0 για int) — ακριβώς την ίδια τιμή που θα έπαιρνες αν το κλειδί υπήρχε πραγματικά με τιμή 0. Χωρίς επιπλέον πληροφορία, δεν θα μπορούσες να ξεχωρίσεις τις δύο περιπτώσεις.</p>
<p>Η λύση της Go είναι ένα δεύτερο, προαιρετικό return value κατά την αναζήτηση σε map, γνωστό ως το <strong>comma-ok pattern</strong>:</p>
<pre><code>value, ok <span class="tok-kw">:=</span> ages[<span class="tok-str">"someone"</span>]
<span class="tok-kw">if</span> ok {
    fmt.<span class="tok-func">Println</span>(<span class="tok-str">"found:"</span>, value)
} <span class="tok-kw">else</span> {
    fmt.<span class="tok-func">Println</span>(<span class="tok-str">"key does not exist"</span>)
}
</code></pre>
<p>Το δεύτερο return value, εδώ ονομασμένο <code>ok</code>, είναι τύπου <code>bool</code>: <code>true</code> αν το κλειδί όντως υπάρχει στον map, <code>false</code> αν δεν υπάρχει. Αυτό σου δίνει ρητή, ξεκάθαρη πληροφορία, χωρίς αμφισημία.</p>

<h2>Διάσχιση με for range</h2>
<pre><code><span class="tok-kw">for</span> key, value <span class="tok-kw">:=</span> <span class="tok-kw">range</span> scores {
    fmt.<span class="tok-func">Println</span>(key, value)
}
</code></pre>
<div class="callout">
  <span class="tag">Προσοχή: μη εγγυημένη σειρά διάσχισης</span>
  Σε αντίθεση με τα slices και τα arrays, όπου η <code>range</code> σου δίνει πάντα τα στοιχεία με τη φυσική, αριθμητική τους σειρά (index 0, μετά 1, μετά 2, ...), η Go <strong>δεν εγγυάται καμία συγκεκριμένη σειρά</strong> όταν διασχίζεις έναν map με <code>for range</code>. Κάθε φορά που τρέχεις το ίδιο πρόγραμμα, η σειρά με την οποία εμφανίζονται τα key/value ζεύγη μπορεί να είναι διαφορετική. Αν χρειάζεσαι σταθερή, προβλέψιμη σειρά (π.χ. αλφαβητική), πρέπει πρώτα να εξάγεις όλα τα κλειδιά σε ένα ξεχωριστό slice, και μετά να τα ταξινομήσεις ρητά μόνος σου, πριν τα διασχίσεις.
</div>
`);
