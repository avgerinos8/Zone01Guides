    <h2>Importing Driver &amp; sql.Open()</h2>

    <pre><code class="lang-go">package main
    
    import (
      "database/sql"
      "fmt"
      "log"
      "time"
    
      _ "github.com/mattn/go-sqlite3" // Blank import registers driver
    )
    
    // ── database connection setup ───────────────────────────────────────────────── ⊃
    
    // initDB opens a connection pool and configures connection parameters.
    func initDB() *sql.DB {
      // sql.Open does NOT create a connection immediately; it only validates parameters.
      db, err := sql.Open("sqlite3", "./app.db")
      if err != nil {
        log.Fatalf("Open failed: %v", err)
      }
    
      // Ping forces an actual network/file connection to verify access.
      if err := db.Ping(); err != nil {
        log.Fatalf("Ping failed: %v", err)
      }
    
      // ── connection pool settings ───────────────────────────────────────────────── ⊃
      db.SetMaxOpenConns(25)                 // Max active connections
      db.SetMaxIdleConns(5)                  // Max idle connections in pool
      db.SetConnMaxLifetime(5 * time.Minute) // Max lifetime of a connection
    
      fmt.Println("Database connection established!")
      return db
    }</code></pre>

    <pre><code class="lang-go">// ── single row query ────────────────────────────────────────────────────────── ⊃
    
    // getUserByID fetches a user by unique identifier.
    func getUserByID(db *sql.DB, id int) (string, int, error) {
      var name string
      var age int
    
      query := \`SELECT name, age FROM users WHERE id = $1\`
      err := db.QueryRow(query, id).Scan(&amp;name, &amp;age)
      if err != nil {
        return "", 0, err
      }
    
      return name, age, nil
    }</code></pre>
    
    <h2>2. Multiple Rows: Query()</h2>
    <p>Όταν περιμένουμε μηδέν, μία ή πολλές γραμμές:</p>
    
    <pre><code class="lang-go">// ── multi row query ─────────────────────────────────────────────────────────── ⊃
    
    // User represents a database record.
    type User struct {
      ID   int
      Name string
      Age  int
    }
    
    // getAllUsers retrieves all users from database.
    func getAllUsers(db *sql.DB) ([]User, error) {
      rows, err := db.Query("SELECT id, name, age FROM users")
      if err != nil {
        return nil, err
      }
      defer rows.Close() // ALWAYS close rows to release connection back to pool!
    
      var users []User
      for rows.Next() {
        var u User
        if err := rows.Scan(&amp;u.ID, &amp;u.Name, &amp;u.Age); err != nil {
          return nil, err
        }
        users = append(users, u)
      }
    
      // Check for errors encountered during iteration
      if err := rows.Err(); err != nil {
        return nil, err
      }
    
      return users, nil
    }</code></pre>

    <pre><code class="lang-go">// ── insert record ───────────────────────────────────────────────────────────── ⊃

    func insertUser(db *sql.DB, name string, age int) (int64, error) {

      }

      }

    <p class="lede">Ένα Prepared Statement μεταγλωττίζεται μία φορά από τη βάση δεδομένων και μπορεί να εκτελεστεί πολλές

    <h2>Πότε να χρησιμοποιείς Prepared Statements</h2>
    <div class="grid2">

        <h3>Πότε ΧΡΕΙΑΖΟΝΤΑΙ</h3>

          prepared statement αυτόματα με 1 network roundtrip.</p>
      </div>
    </div>
    
    <pre><code class="lang-go">// ── prepared statement batch ────────────────────────────────────────────────── ⊃
    
    // insertBatch inserts multiple users efficiently using a single prepared statement.
    func insertBatch(db *sql.DB, names []string, age int) error {
      stmt, err := db.Prepare("INSERT INTO users (name, age) VALUES ($1, $2)")
      if err != nil {
        return err
      }
      defer stmt.Close() // Always close prepared statements!
    
      for _, name := range names {
        if _, err := stmt.Exec(name, age); err != nil {
          return err
        }
      }
    
      return nil
    }</code></pre>
    `);

    <h1>6. Ενημέρωση, Διαγραφή &amp; Transactions</h1>
    <p class="lede">Οι εντολές <code>UPDATE</code> και <code>DELETE</code> τροποποιούν υπάρχοντα δεδομένα. Οι συναλλαγές
      (Transactions) διασφαλίζουν ότι πολλές ενέργειες εκτελούνται ως μία ατομική μονάδα (All or Nothing).</p>
    
    <h2>UPDATE &amp; DELETE με Ασφάλεια</h2>
    <div class="callout">
      <span class="tag">Προσοχή!</span>
      Ποτέ μην ξεχνάς το <code>WHERE</code> clause! Χωρίς <code>WHERE</code>, το UPDATE/DELETE θα επηρεάσει

    func updateUserAge(db *sql.DB, id int, newAge int) (int64, error) {
      res, err := db.Exec("UPDATE users SET age = $1 WHERE id = $2", newAge, id)
      if err != nil {
        return 0, err
      }
      return res.RowsAffected()
    }</code></pre>
    
    <h2>Transactions (db.Begin, Commit, Rollback)</h2>
    <pre><code class="lang-go">// ── transaction process ─────────────────────────────────────────────────────── ⊃
    
    // transferMoney handles a database transaction safely.
    func transferMoney(db *sql.DB, fromID, toID int, amount float64) error {
      tx, err := db.Begin()
      if err != nil {
        return err
      }
      // Rollback is safe to call even after Commit (it will be a no-op).
      defer tx.Rollback()
    
      if _, err := tx.Exec("UPDATE accounts SET balance = balance - $1 WHERE id = $2", amount, fromID); err != nil {
        return err
      }
    
      if _, err := tx.Exec("UPDATE accounts SET balance = balance + $1 WHERE id = $2", amount, toID); err != nil {
        return err
      }
    
      // Commit applies all changes permanently
      return tx.Commit()
    }</code></pre>

    <pre><code class="lang-go">// ── error handling ──────────────────────────────────────────────────────────── ⊃
    
    // findUser searches for a user and checks for ErrNoRows.
    func findUser(db *sql.DB, id int) {
      var name string
      err := db.QueryRow("SELECT name FROM users WHERE id = $1", id).Scan(&amp;name)
      if err == sql.ErrNoRows {
        fmt.Println("User not found!")
      } else if err != nil {
        log.Fatalf("Query failed: %v", err)
      } else {
        fmt.Println("Found user:", name)
      }
    }</code></pre>
