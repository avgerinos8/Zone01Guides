addContent(`
<div class="eyebrow">Ενότητα 1 / 5 — Intro & Parsing</div>
<h1 id="@intro">Ο Κανόνας του 1 Μυρμηγκιού</h1>
<p class="lede">Φαινομενικά το <code>lem-in</code> είναι ένα απλό παιχνίδι μετακίνησης. Στην πραγματικότητα, είναι ένα κλασικό πρόβλημα <strong>Network Flow (Ροή Δικτύου)</strong>.</p>
<p>Έχετε <code>N</code> μυρμήγκια στο <code>##start</code> node και θέλετε να τα μεταφέρετε στο <code>##end</code> node, ελαχιστοποιώντας τους γύρους (turns). Αν μπορούσαμε να βάλουμε όσα μυρμήγκια θέλαμε σε κάθε δωμάτιο, θα βρίσκαμε απλώς τη συντομότερη διαδρομή (Shortest Path) και θα τα στέλναμε όλα από εκεί.</p>
<p>Όμως, το Lem-in εισάγει έναν αυστηρό περιορισμό: <strong>Κάθε δωμάτιο (Node) εκτός από το Start και το End έχει Capacity = 1</strong>. Μόνο ένα μυρμήγκι μπορεί να βρίσκεται σε ένα δωμάτιο ανά πάσα στιγμή.</p>
<p>Αυτό δημιουργεί <em>μποτιλιάρισμα (Bottleneck)</em>. Αν έχετε 1000 μυρμήγκια και τα στείλετε σε ένα μόνο μονοπάτι μήκους 5, το τελευταίο μυρμήγκι θα φτάσει μετά από 1004 γύρους! Η μόνη λύση είναι να βρείτε <strong>πολλαπλά, ανεξάρτητα (Vertex-Disjoint) μονοπάτια</strong>, ώστε να μοιράσετε την κίνηση.</p>

<svg viewBox="0 0 800 180" style="max-width: 800px; width: 100%; height: auto; margin: 2rem 0;">

        </pattern>

            <line x1="0" y1="0" x2="0" y2="8" stroke="var(--correct)" stroke-width="2" stroke-opacity="0.3" />
        </pattern>
    </defs>
    
    <!-- Labeled Boxes for Single Path vs Disjoint Paths -->
    <!-- Scenario A -->
    <rect x="20" y="20" width="350" height="140" rx="8" fill="url(#hatch-red)" stroke="var(--danger)" stroke-width="2"/>
    <text x="35" y="45" font-family="var(--font-sans)" font-weight="bold" fill="var(--danger)">Λάθος: 1 Μονοπάτι (Ουρά)</text>

    <line x1="215" y1="100" x2="245" y2="100" stroke="var(--ink)" stroke-width="3"/>

    <text x="140" y="140" font-family="var(--font-sans)" font-size="12" fill="var(--ink)" text-anchor="middle">500 μυρμήγκια περιμένουν στο Start</text>

addContent(`
<div class="eyebrow">Ενότητα 1 / 5 — Intro & Parsing</div>
<h1 id="@parsing">Ο State Machine Parser</h1>
<p class="lede">Πριν βρούμε μονοπάτια, πρέπει να διαβάσουμε τον χάρτη. Το αρχείο έχει τρεις διακριτές φάσεις (Ants, Rooms, Links), αλλά η μετάβαση από τα δωμάτια στις συνδέσεις (Links) καθορίζεται από το πρώτο σύμβολο <code>-</code>.</p>
<p>Το <code>stdin</code> διαβάζεται γραμμή-γραμμή. Ένας State Machine parser ελέγχει σε ποια φάση βρισκόμαστε. Ακολουθήστε αυτούς τους αυστηρούς κανόνες:</p>
<ul>
    <li><strong>Φάση 1 (Ants):</strong> Η πρώτη γραμμή που <em>δεν είναι σχόλιο</em>, πρέπει να είναι ένας ακέραιος μεγαλύτερος του μηδενός.</li>
    <li><strong>Φάση 2 (Rooms):</strong> Μορφή <code>name x y</code>. Oι συντεταγμένες X και Y είναι εντελώς αδιάφορες για τον αλγόριθμό σας. Διαβάστε τις μόνο για το Validation.</li>
    <li><strong>Οι ταμπέλες:</strong> Εάν βρείτε <code>##start</code> ή <code>##end</code>, αυτό δεν είναι δωμάτιο. Είναι εντολή (Command) που λέει: "Το <strong>επόμενο</strong> έγκυρο δωμάτιο που θα διαβάσεις, αποθήκευσέ το ως Start/End".</li>
    <li><strong>Φάση 3 (Links):</strong> Μορφή <code>name1-name2</code>. <strong>ΠΡΟΣΟΧΗ:</strong> Από τη στιγμή που θα διαβάσετε έστω και ένα Link, ο γράφος έχει "κλειδώσει". Αν μετά από link διαβάσετε πάλι συντεταγμένες δωματίου, το αρχείο είναι άκυρο και πρέπει να τερματίσετε με ERROR.</li>
</ul>

<svg viewBox="0 0 800 220" style="max-width: 800px; width: 100%; height: auto; margin: 1.5rem 0;">
    <rect x="10" y="10" width="780" height="200" rx="4" fill="var(--code-bg)"/>
    <text x="30" y="45" font-family="var(--font-mono)" font-size="16" fill="var(--tone-4)">1. </text><text x="60" y="45" font-family="var(--font-mono)" font-size="16" fill="var(--correct)">50</text>
    <text x="30" y="70" font-family="var(--font-mono)" font-size="16" fill="var(--tone-4)">2. </text><text x="60" y="70" font-family="var(--font-mono)" font-size="16" fill="var(--tone-5)">##start</text>
    <text x="30" y="95" font-family="var(--font-mono)" font-size="16" fill="var(--tone-4)">3. </text><text x="60" y="95" font-family="var(--font-mono)" font-size="16" fill="var(--ink)">RoomA 1 2</text>
    <text x="30" y="120" font-family="var(--font-mono)" font-size="16" fill="var(--tone-4)">4. </text><text x="60" y="120" font-family="var(--font-mono)" font-size="16" fill="var(--ink)">RoomB 3 4</text>
    <text x="30" y="145" font-family="var(--font-mono)" font-size="16" fill="var(--tone-4)">5. </text><text x="60" y="145" font-family="var(--font-mono)" font-size="16" fill="var(--ink)"># Just a comment</text>
    <text x="30" y="170" font-family="var(--font-mono)" font-size="16" fill="var(--tone-4)">6. </text><text x="60" y="170" font-family="var(--font-mono)" font-size="16" fill="var(--accent)">RoomA-RoomB</text>

    <!-- Path Arrows -->
    <path d="M 180 40 Q 250 40 250 80" fill="none" stroke="var(--correct)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="260" y="90" font-family="var(--font-sans)" font-size="14" fill="var(--correct)">Ants = 50</text>

    <path d="M 180 70 Q 300 70 300 120" fill="none" stroke="var(--tone-5)" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="310" y="125" font-family="var(--font-sans)" font-size="14" fill="var(--tone-5)">Ενεργοποιεί State isStart=true</text>

    <path d="M 180 95 Q 230 95 230 145" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <text x="240" y="150" font-family="var(--font-sans)" font-size="14" fill="var(--ink)">Γίνεται Start Node λόγω του State!</text>

    <path d="M 180 170 Q 550 170 550 120" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <text x="560" y="125" font-family="var(--font-sans)" font-size="14" fill="var(--accent)">Αλλάζει Phase σε Links. Τα Rooms τελείωσαν.</text>
</svg>
<p>Η λογική του State Machine σημαίνει ότι δεν ψάχνουμε τυχαία με Regex όλο το κείμενο, αλλά τρέχουμε ένα μεγάλο <code>for scanner.Scan()</code> και διατηρούμε μεταβλητές όπως <code>phase = 1</code>, <code>nextIsStart = true</code> κλπ.</p>
`);

addFillBlank({
  code: `// State machine for parsing rooms
isNextStart := false

for scanner.Scan() {
    line := scanner.Text()
    
    // Αγνοούμε τα απλά σχόλια
    if strings.HasPrefix(line, "#") && line != "##start" && line != "##end" {
        continue
    }
    
    // Command
    if line == "##start" {
        isNextStart = __true__
    } else if isNextStart && isRoom(line) {
        // Καταχώρηση δωματίου ως Start
        startNode = parseRoom(__line__)
        isNextStart = false
    }
}`,
  blanks: [
    { id: "true", answer: "true" },
    { id: "line", answer: "line" }
  ],
  explain: "Όταν συναντάμε την εντολή <code>##start</code>, η boolean μεταβλητή <code>isNextStart</code> γίνεται true. Στην επόμενη επανάληψη (loop), αν βρούμε έγκυρο <code>line</code> δωματίου, το ορίζουμε ως <code>startNode</code> και κλείνουμε τον διακόπτη."
}, { lang: "go" });

  { term: "Coordinates (X, Y)", def: "Διαβάζονται κατά το parsing για εγκυρότητα, αλλά αγνοούνται πλήρως από τον αλγόριθμο Pathfinding." },

addContent(`
<div class="eyebrow">Ενότητα 2 / 5 — Graph Modeling</div>
<h1 id="@adj-list">Μοντελοποίηση: Adjacency List</h1>
<p class="lede">Ο χάρτης του Lem-in είναι ένας <strong>Undirected Graph (Μη Κατευθυνόμενος Γράφος)</strong>. Δεν έχει σημασία αν ένα τούνελ δηλώθηκε ως <code>A-B</code> ή <code>B-A</code>, τα μυρμήγκια μπορούν να το διασχίσουν και προς τις δύο κατευθύνσεις.</p>
<p>Υπάρχουν δύο βασικοί τρόποι να αποθηκεύσουμε έναν γράφο στη μνήμη του υπολογιστή:</p>
<ol>
    <li><strong>Adjacency Matrix (Πίνακας Γειτνίασης):</strong> Ένας 2D πίνακας [N][N] όπου το κελί [i][j] είναι 1 αν υπάρχει ακμή, 0 αλλιώς. Αυτό είναι καταστροφή για το Lem-in! Αν έχετε 10,000 δωμάτια, ο πίνακας θα πιάσει μνήμη για 100,000,000 κελιά, τα περισσότερα εκ των οποίων θα είναι μηδέν (Sparse Graph).</li>
    <li><strong>Adjacency List (Λίστα Γειτνίασης):</strong> Κάθε Node κρατάει ένα slice (Go) που περιέχει pointers μόνο προς τους άμεσους γείτονές του. Αυτό καταναλώνει μνήμη μόνο για τις υπάρχουσες ακμές (Edges) και κάνει το Pathfinding ταχύτατο, καθώς κάνουμε loop μόνο στους γείτονες που <em>όντως</em> υπάρχουν.</li>
</ol>

<svg viewBox="0 0 800 250" style="max-width: 800px; width: 100%; height: auto; margin: 1.5rem 0;">
    <!-- Blueprint grid background -->
    <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--tone-2)" stroke-width="0.5"/>
        </pattern>
    </defs>
    <rect width="800" height="250" fill="url(#grid)" />
    
    <!-- Graph Representation -->
    <g transform="translate(50, 50)">
        <circle cx="50" cy="80" r="20" fill="var(--panel)" stroke="var(--tone-4)" stroke-width="3"/>
        <text x="50" y="85" font-family="var(--font-sans)" font-weight="bold" fill="var(--ink)" text-anchor="middle">A</text>
        
        <circle cx="150" cy="30" r="20" fill="var(--panel)" stroke="var(--tone-4)" stroke-width="3"/>
        <text x="150" y="35" font-family="var(--font-sans)" font-weight="bold" fill="var(--ink)" text-anchor="middle">B</text>
        
        <circle cx="150" cy="130" r="20" fill="var(--panel)" stroke="var(--tone-4)" stroke-width="3"/>
        <text x="150" y="135" font-family="var(--font-sans)" font-weight="bold" fill="var(--ink)" text-anchor="middle">C</text>
        
        <line x1="68" y1="72" x2="132" y2="38" stroke="var(--accent)" stroke-width="3"/>
        <line x1="68" y1="88" x2="132" y2="122" stroke="var(--accent)" stroke-width="3"/>
    </g>

    <text x="250" y="125" font-family="var(--font-mono)" font-size="24" fill="var(--tone-4)">→</text>
    
    <!-- Struct Representation -->
    <g transform="translate(300, 30)">
        <rect width="450" height="190" rx="8" fill="var(--code-bg)" stroke="var(--tone-3)" stroke-width="2"/>
        <text x="20" y="40" font-family="var(--font-mono)" font-size="16" fill="var(--tone-5)">type Node struct {</text>

func (g *Graph) AddEdge(name1, name2 string) {
    node1 := g.Nodes[name1]
    node2 := g.Nodes[name2]
    
    // Πριν προσθέσουμε, ελέγχουμε αν υπάρχει ήδη
    for _, neighbor := range node1.Edges {

addContent(`
<div class="eyebrow">Ενότητα 3 / 5 — Pathfinding</div>
<h1 id="@bfs-fail">Το Greediness του BFS</h1>
<p class="lede">Το Pathfinding είναι η καρδιά του Lem-in. Ψάχνουμε αυστηρά <strong>Vertex-Disjoint Paths</strong> — μονοπάτια που <em>δεν έχουν κανένα κοινό δωμάτιο (node)</em> μεταξύ τους. Αν είχαν κοινό δωμάτιο, τα μυρμήγκια θα συγκρούονταν (λόγω του Capacity = 1).</p>
<p>Το BFS (Breadth-First Search) είναι ένας φανταστικός αλγόριθμος. Όταν τον τρέξεις από το Start στο End, θα σου βρει <em>εγγυημένα</em> το συντομότερο μονοπάτι σε αριθμό αλμάτων (hops). Γιατί λοιπόν δεν τρέχουμε απλά το BFS, βρίσκουμε το Path, διαγράφουμε τα Nodes του από τον γράφο, και το ξανατρέχουμε για το επόμενο Path;</p>

<p>Αυτή η προσέγγιση (Greedy BFS) <strong>αποτυγχάνει παταγωδώς</strong>. Διότι το πρώτο (συντομότερο) μονοπάτι μπορεί να κόψει τον γράφο στη μέση, καταστρέφοντας δύο άλλα, ελαφρώς μεγαλύτερα (αλλά παράλληλα) μονοπάτια.</p>

<p>Αν το BFS διαλέξει το κεντρικό, κόκκινο μονοπάτι επειδή τυχαίνει να είναι κατά 1 δωμάτιο πιο σύντομο, "ακρωτηριάζει" τον γράφο. Τα πάνω και κάτω μονοπάτια (που αθροιστικά θα μετέφεραν την διπλάσια κίνηση) μένουν αχρησιμοποίητα.</p>
<p>Ο αλγόριθμος πρέπει με κάποιο τρόπο να μπορεί να <em>αναιρέσει</em> αυτή την κακή επιλογή. Εδώ έρχεται το Suurballe's Algorithm και το concept του Residual Graph.</p>

addContent(`
<div class="eyebrow">Ενότητα 3 / 5 — Pathfinding</div>
<h1 id="@node-split">Node Splitting (1 Μυρμήγκι)</h1>
<p>Στη θεωρία Γράφων, ο κλασικός αλγόριθμος εύρεσης μέγιστης ροής (Max Flow) λέγεται <strong>Edmonds-Karp</strong>. Ο αλγόριθμος αυτός όμως λειτουργεί με "Edge Capacity" (Πόσο νερό χωράει ο σωλήνας). Στο Lem-in δεν έχουμε περιορισμό στα τούνελ, έχουμε <em>Node Capacity</em> (Πόσα μυρμήγκια χωράει το δωμάτιο = 1).</p>
<p>Πώς το λύνουμε; Χρησιμοποιούμε μια μαθηματική παραίσθηση που λέγεται <strong>Node Splitting</strong>. Χωρίζουμε προγραμματιστικά κάθε δωμάτιο (π.χ. <code>RoomA</code>) σε <strong>δύο</strong> εικονικά δωμάτια: <code>RoomA_in</code> και <code>RoomA_out</code>. <br>Όλα τα εισερχόμενα τούνελ ενώνονται στο <code>_in</code>. Όλα τα εξερχόμενα τούνελ φεύγουν από το <code>_out</code>. <br>Και ανάμεσά τους, υπάρχει ένα <strong>μονοδρομικό τούνελ</strong> <code>RoomA_in -> RoomA_out</code>.</p>
<p>Αν ο αλγόριθμός μας μαρκάρει αυτή τη μοναδική εσωτερική ακμή ως "χρησιμοποιημένη", είναι <em>αδύνατον</em> για οποιοδήποτε δεύτερο μυρμήγκι να διασχίσει το δωμάτιο! Έτσι, μετατρέπουμε το Node Capacity σε Edge Capacity.</p>
`);

addContent(`
<div class="eyebrow">Ενότητα 3 / 5 — Pathfinding</div>
<h1 id="@residual">Residual Graph & Edge Reversal</h1>
<p class="lede">Πώς αναιρούμε τις λάθος (Greedy) επιλογές του BFS; Αντιστρέφοντας τα τούνελ!</p>
<p>Όταν το πρώτο BFS βρίσκει ένα μονοπάτι (π.χ. Start -> A -> B -> End), αντί να διαγράψουμε τους κόμβους, δημιουργούμε έναν <strong>Residual Graph</strong> (Υπολειπόμενο Γράφο). Σε αυτόν τον γράφο, <strong>διαγράφουμε</strong> τα τούνελ που χρησιμοποιήσαμε, και στη θέση τους <strong>προσθέτουμε ανάποδα τούνελ</strong> (B -> A).</p>
<p>Όταν τρέξουμε το *δεύτερο* BFS στον Residual Graph, αυτό θα ψάξει για το επόμενο μονοπάτι. Αν, στην προσπάθειά του να βρει δρόμο, <strong>περπατήσει πάνω σε μια ανάποδη ακμή</strong> (δηλαδή πάει από το B πίσω στο A), αυτό προγραμματιστικά μεταφράζεται ως <em>ΑΚΥΡΩΣΗ (Cancellation)</em> της προηγούμενης κίνησης!</p>

<div class="callout good">
  <span class="tag">Ο ΜΑΓΙΚΟΣ ΜΗΧΑΝΙΣΜΟΣ</span>
  Αν το πρώτο μονοπάτι είχε χρησιμοποιήσει την ακμή A->B, και το δεύτερο μονοπάτι περπατήσει ανάποδα την ακμή B->A, οι δύο δυνάμεις αλληλοεξουδετερώνονται. Η σύνδεση A-B "σπάει", και τα δύο μονοπάτια "ξεμπλέκονται" αυτόματα δημιουργώντας δύο εντελώς νέα, <strong>Vertex-Disjoint paths</strong> που δεν διασταυρώνονται πλέον πουθενά!
</div>
<p>Η διαδικασία (Βρες Path → Αντέστρεψε Edges → Ξαναψάξε → Ακύρωσε αν χρειαστεί) επαναλαμβάνεται μέχρι το BFS να μην βρίσκει πλέον κανένα μονοπάτι (επιστρέφει <code>nil</code>). Τότε, έχουμε βρει την <em>απόλυτα μέγιστη ροή</em> (Max Flow).</p>
`);

// Το path που βρέθηκε είναι slice από *Node

func cancelPath(path []*Node) {
    for i := 0; i < len(path)-1; i++ {
        from := path[i]
        to := path[i+1]
        
        // 1. Σπάμε (αφαιρούμε) την αρχική κανονική σύνδεση
        removeEdge(from, to)
        
        // 2. Προσθέτουμε την "αντίστροφη" ακμή στον γράφο
        // για να επιτρέψουμε το 'ξεμπέρδεμα' στο επόμενο BFS
        addEdge(__to__, __from__)
    }
}`,

addContent(`
<div class="eyebrow">Ενότητα 4 / 5 — Routing</div>
<h1 id="@routing">Τα Μαθηματικά του Routing</h1>
<p class="lede">Ο αλγόριθμός σας (Suurballe) τρέχει σε λούπα (iterative approach). Στο πρώτο iteration βρίσκει 1 Path (Σετ 1). Στο δεύτερο iteration βρίσκει 2 Paths (Σετ 2). Στο τρίτο βρίσκει 3 Paths (Σετ 3), και ούτω καθεξής.</p>
<p><strong>Ποιο Σετ είναι το καλύτερο;</strong> Πρέπει να πάρουμε το Σετ με τα περισσότερα Paths; <em>Όχι απαραίτητα.</em></p>
<p>Η απάντηση εξαρτάται <strong>αποκλειστικά από το πλήθος των μυρμηγκιών (N)</strong>. Αν έχετε 3 μυρμήγκια και το Σετ 2 περιέχει ένα μονοπάτι Μήκους 2 και ένα μονοπάτι Μήκους 100, ολόκληρο το Σετ είναι άχρηστο. Θα στείλετε και τα 3 μυρμήγκια στο γρήγορο μονοπάτι. Αν είχατε 5,000 μυρμήγκια, το Σετ 2 (που περιλαμβάνει και το τεράστιο μονοπάτι) θα κέρδιζε, γιατί η αναμονή στο μικρό μονοπάτι θα ήταν μεγαλύτερη από το να κάνουν τα 100 βήματα.</p>

<div class="callout">
  <span class="tag">Η ΦΟΡΜΟΥΛΑ TOY ROUTING</span>
  Κόστος Χρήσης Μονοπατιού = <code>Μήκος Μονοπατιού + Μυρμήγκια που περιμένουν ήδη σε αυτό</code>.<br><br>
  Για κάθε ένα από τα N μυρμήγκια, υπολογίζουμε το "Κόστος" όλων των μονοπατιών στο τρέχον Σετ. Το μυρμήγκι ανατίθεται στο μονοπάτι με το χαμηλότερο Κόστος. Στο τέλος, ο μέγιστος γύρος άφιξης (Max Turns) ορίζει την <strong>"αξία" (σκορ)</strong> ολόκληρου του Σετ.
</div>

<p>Επομένως, το πρόγραμμα δουλεύει έτσι: <br>1. Βρίσκεις Σετ X.<br>2. Κάνεις Εικονική Κατανομή (Distribution) όλων των μυρμηγκιών στα Paths του Σετ X.<br>3. Μετράς τους Γύρους (Turns).<br>4. Αν το Σετ X δίνει λιγότερους Γύρους από το Σετ X-1, το κρατάς! Αν δίνει περισσότερους, σημαίνει ότι τα νέα paths είναι πολύ μεγάλα. Πετάς το Σετ X, σταματάς το ψάξιμο, και προχωράς στο Print με το Σετ X-1.</p>
`);

addFillBlank({
  code: `// Simulated Distribution (Εικονική Κατανομή)
// Επιστρέφει πόσα μυρμήγκια δόθηκαν σε κάθε μονοπάτι (allocation)

func distributeAnts(ants int, paths []Path) []int {
    allocation := make([]int, len(paths))
    
    for i := 0; i < ants; i++ {
        bestPathIdx := 0
        
        // Αρχικό κόστος: Μήκος 0ου Path + Πόσα μυρμήγκια του έχουμε δώσει
        minCost := paths[0].Length + allocation[__0__]
        
        for j := 1; j < len(paths); j++ {
            cost := paths[j].Length + allocation[__j__]
            
            // Ψάχνουμε το μονοπάτι που προσφέρει τον ταχύτερο χρόνο άφιξης
            if cost < minCost {
                minCost = cost
                bestPathIdx = j
            }
        }
        // Δίνουμε 1 μυρμήγκι στο καλύτερο path και συνεχίζουμε
        allocation[bestPathIdx]++
    }
    return allocation
}`,

<h1 id="@strings-builder">Αποδοτική Εκτύπωση (strings.Builder)</h1>
<p>Το format εξόδου απαιτεί ένα κενό διάστημα μεταξύ των κινήσεων: <code>L1-A L2-B</code>.</p>
<p>Όταν έχετε 1000 μυρμήγκια και μεγάλα paths, το loop κίνησης μπορεί να εκτελεστεί δεκάδες χιλιάδες φορές. Αν χρησιμοποιήσετε <code>str += " L1-A"</code> μέσα στο loop, η Go θα κάνει allocation νέας μνήμης (αφού τα strings είναι immutable) για <em>κάθε</em> ένα <code>+</code>. Το πρόγραμμά σας θα γίνει τρομερά αργό και θα κοπεί στο Time Limit (Timeout) του Zone01.</p>

<pre><code class="lang-go">// ΠΑΝΤΑ να χρησιμοποιείτε strings.Builder 
// για string concatenation μέσα σε μεγάλα loops!
import "strings"

var sb strings.Builder

// Μέσα στο loop κίνησης του κάθε γύρου:

sb.WriteString(strconv.Itoa(antID))
sb.WriteString("-")
sb.WriteString(roomName)
sb.WriteString(" ")

</code></pre>
