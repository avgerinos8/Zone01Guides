<div class="eyebrow">Ενότητα 1 / 5 — Intro & Parsing</div>
<h1 id="@intro">Ο Κανόνας του 1 Μυρμηγκιού</h1>
<p class="lede">Φαινομενικά το <code>lem-in</code> είναι ένα απλό παιχνίδι μετακίνησης. Στην πραγματικότητα, είναι ένα κλασικό πρόβλημα <strong>Network Flow (Ροή Δικτύου)</strong>.</p>
<p>Έχετε <code>N</code> μυρμήγκια στο <code>##start</code> node και θέλετε να τα μεταφέρετε στο <code>##end</code> node, ελαχιστοποιώντας τους γύρους (turns). Αν μπορούσαμε να βάλουμε όσα μυρμήγκια θέλαμε σε κάθε δωμάτιο, θα βρίσκαμε απλώς τη συντομότερη διαδρομή (Shortest Path) και θα τα στέλναμε όλα από εκεί.</p>
<p>Όμως, το Lem-in εισάγει έναν αυστηρό περιορισμό: <strong>Κάθε δωμάτιο (Node) εκτός από το Start και το End έχει Capacity = 1</strong>. Μόνο ένα μυρμήγκι μπορεί να βρίσκεται σε ένα δωμάτιο ανά πάσα στιγμή.</p>
<p>Αυτό δημιουργεί <em>μποτιλιάρισμα (Bottleneck)</em>. Αν έχετε 1000 μυρμήγκια και τα στείλετε σε ένα μόνο μονοπάτι μήκους 5, το τελευταίο μυρμήγκι θα φτάσει μετά από 1004 γύρους! Η μόνη λύση είναι να βρείτε <strong>πολλαπλά, ανεξάρτητα (Vertex-Disjoint) μονοπάτια</strong>, ώστε να μοιράσετε την κίνηση.</p>

<div class="eyebrow">Ενότητα 1 / 5 — Intro & Parsing</div>
<h1 id="@parsing">Ο State Machine Parser</h1>
<p class="lede">Πριν βρούμε μονοπάτια, πρέπει να διαβάσουμε τον χάρτη. Το αρχείο έχει τρεις διακριτές φάσεις (Ants, Rooms, Links), αλλά η μετάβαση από τα δωμάτια στις συνδέσεις (Links) καθορίζεται από το πρώτο σύμβολο <code>-</code>.</p>
<p>Το <code>stdin</code> διαβάζεται γραμμή-γραμμή. Ένας State Machine parser ελέγχει σε ποια φάση βρισκόμαστε. Ακολουθήστε αυτούς τους αυστηρούς κανόνες:</p>
<ul>
    <li><strong>Φάση 1 (Ants):</strong> Η πρώτη γραμμή που <em>δεν είναι σχόλιο</em>, πρέπει να είναι ένας ακέραιος μεγαλύτερος του μηδενός.</li>
    <li><strong>Φάση 2 (Rooms):</strong> Μορφή <code>name x y</code>. Oι συντεταγμένες X και Y είναι εντελώς αδιάφορες για τον αλγόριθμό σας. Διαβάστε τις μόνο για το Validation.</li>
    <li><strong>Οι ταμπέλες:</strong> Εάν βρείτε <code>##start</code> ή <code>##end</code>, αυτό δεν είναι δωμάτιο. Είναι εντολή (Command) που λέει: "Το <strong>επόμενο</strong> έγκυρο δωμάτιο που θα διαβάσεις, αποθήκευσέ το ως Start/End".</li>
    <li><strong>Φάση 3 (Links):</strong> Μορφή <code>name1-name2</code>. <strong>ΠΡΟΣΟΧΗ:</strong> Από τη στιγμή που θα διαβάσετε έστω και ένα Link, ο γράφος έχει "κλειδώσει". Αν μετά από link διαβάσετε πάλι συντεταγμένες δωματίου, το αρχείο είναι άκυρο και πρέπει να τερματίσετε με ERROR.</li>
</ul>

<p>Παράδειγμα input:</p>
<pre><code>50              # Φάση 1: αριθμός μυρμηγκιών
##start         # Command: το επόμενο δωμάτιο = Start
RoomA 1 2       # Φάση 2: δωμάτιο (γίνεται Start λόγω ##start)
##end           # Command: το επόμενο δωμάτιο = End
RoomB 3 4       # δωμάτιο (γίνεται End)
RoomC 5 6       # κανονικό δωμάτιο
# σχόλιο       # αγνοείται
RoomA-RoomB     # Φάση 3: πρώτο «-» → αλλαγή φάσης σε Links
RoomA-RoomC     # ακόμα Links
RoomC-RoomB     # ακόμα Links</code></pre>
<p>Η λογική του State Machine σημαίνει ότι δεν ψάχνουμε τυχαία με Regex όλο το κείμενο, αλλά τρέχουμε ένα μεγάλο <code>for scanner.Scan()</code> και διατηρούμε μεταβλητές όπως <code>phase = 1</code>, <code>nextIsStart = true</code> κλπ.</p>
`);

<div class="eyebrow">Ενότητα 2 / 5 — Graph Modeling</div>
<h1 id="@graph-intro">Τι είναι ένας Γράφος (Graph);</h1>
<p class="lede">Για να λύσουμε το Lem-in, πρέπει πρώτα να το μεταφράσουμε στη γλώσσα των υπολογιστών. Χρησιμοποιούμε τη <strong>Θεωρία Γράφων (Graph Theory)</strong>.</p>
<p>Ένας Γράφος δεν είναι γραφική παράσταση με X και Y. Είναι απλά ένας τρόπος να μοντελοποιούμε δίκτυα (όπως το internet, οι δρόμοι μιας πόλης, ή μια μυρμηγκοφωλιά).</p>

<div class="callout">
  <span class="tag">ΤΑ ΒΑΣΙΚΑ ΣΥΣΤΑΤΙΚΑ</span>
  <ul>
    <li><strong>Κόμβος (Node ή Vertex):</strong> Τα σημεία του δικτύου. Στο Lem-in, κάθε <em>Δωμάτιο (Room)</em> είναι ένας Κόμβος.</li>
    <li><strong>Ακμή (Edge ή Link):</strong> Οι συνδέσεις μεταξύ των σημείων. Στο Lem-in, κάθε <em>Τούνελ</em> που ενώνει δύο δωμάτια είναι μια Ακμή.</li>

</div>

<div class="eyebrow">Ενότητα 2 / 5 — Graph Modeling</div>
<h1 id="@graph-types">Ιδιότητες του Γράφου μας</h1>
<p class="lede">Ο γράφος του Lem-in έχει δύο πολύ συγκεκριμένες ιδιότητες που κάνουν τη ζωή μας ευκολότερη.</p>

<table class="glossary-table">
  <tr>
    <td class="gt-term">Undirected<br><span style="font-size: 0.8em; font-weight: normal; opacity: 0.7">(Μη Κατευθυνόμενος)</span></td>
    <td class="gt-def">
      <p>Δεν έχει σημασία αν ένα τούνελ δηλώθηκε στο input ως <code>A-B</code> ή <code>B-A</code>. Τα μυρμήγκια μπορούν να το διασχίσουν και προς τις δύο κατευθύνσεις ελεύθερα. Είναι <em>δρόμος διπλής κυκλοφορίας</em>.</p>
    </td>
  </tr>
  <tr>
    <td class="gt-term">Unweighted<br><span style="font-size: 0.8em; font-weight: normal; opacity: 0.7">(Χωρίς Βάρη)</span></td>
    <td class="gt-def">
      <p>Στους πραγματικούς χάρτες (π.χ. Google Maps), οι δρόμοι έχουν "Βάρη" (χιλιομετρικές αποστάσεις). Εκεί χρειαζόμαστε πολύπλοκους αλγόριθμους όπως ο <strong>Dijkstra</strong> για να βρούμε την πιο σύντομη διαδρομή. Στο Lem-in, η απόσταση από το δωμάτιο A στο B είναι <strong>πάντα 1 άλμα (hop)</strong>. Όλα τα τούνελ είναι "ίδια". Γι' αυτό δεν χρειαζόμαστε τον Dijkstra!</p>
    </td>
  </tr>
</table>
`);

<div class="eyebrow">Ενότητα 2 / 5 — Graph Modeling</div>
<h1 id="@adj-list">Μοντελοποίηση: Adjacency List</h1>
<p class="lede">Τώρα που ξέρουμε τι είναι ο Γράφος, πώς τον αποθηκεύουμε στη μνήμη του υπολογιστή;</p>
<p>Υπάρχουν δύο βασικοί τρόποι να αποθηκεύσουμε έναν γράφο στη μνήμη του υπολογιστή:</p>
<ol>
    <li><strong>Adjacency Matrix (Πίνακας Γειτνίασης):</strong> Ένας 2D πίνακας [N][N] όπου το κελί [i][j] είναι 1 αν υπάρχει ακμή, 0 αλλιώς. Αυτό είναι καταστροφή για το Lem-in! Αν έχετε 10,000 δωμάτια, ο πίνακας θα πιάσει μνήμη για 100,000,000 κελιά, τα περισσότερα εκ των οποίων θα είναι μηδέν (Sparse Graph).</li>
    <li><strong>Adjacency List (Λίστα Γειτνίασης):</strong> Κάθε Node κρατάει ένα slice (Go) που περιέχει pointers μόνο προς τους άμεσους γείτονές του. Αυτό καταναλώνει μνήμη μόνο για τις υπάρχουσες ακμές (Edges) και κάνει το Pathfinding ταχύτατο, καθώς κάνουμε loop μόνο στους γείτονες που <em>όντως</em> υπάρχουν.</li>
</ol>

<svg viewBox="0 0 800 250" style="max-width: 800px; width: 100%; height: auto; margin: 1.5rem 0;">
    <!-- Blueprint grid background -->
    <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--tone-2)" stroke-width="0.5"/>
        </pattern>
    </defs>
    <rect width="800" height="250" fill="url(#grid)" />
    
    <!-- Graph Representation -->
    <g transform="translate(50, 50)">
        <circle cx="50" cy="80" r="20" fill="var(--panel)" stroke="var(--tone-4)" stroke-width="3"/>
        <text x="50" y="85" font-family="var(--font-sans)" font-weight="bold" fill="var(--ink)" text-anchor="middle">A</text>
        
        <circle cx="150" cy="30" r="20" fill="var(--panel)" stroke="var(--tone-4)" stroke-width="3"/>
        <text x="150" y="35" font-family="var(--font-sans)" font-weight="bold" fill="var(--ink)" text-anchor="middle">B</text>
        
        <circle cx="150" cy="130" r="20" fill="var(--panel)" stroke="var(--tone-4)" stroke-width="3"/>
        <text x="150" y="135" font-family="var(--font-sans)" font-weight="bold" fill="var(--ink)" text-anchor="middle">C</text>
        
        <line x1="68" y1="72" x2="132" y2="38" stroke="var(--accent)" stroke-width="3"/>
        <line x1="68" y1="88" x2="132" y2="122" stroke="var(--accent)" stroke-width="3"/>
    </g>

    <text x="250" y="125" font-family="var(--font-mono)" font-size="24" fill="var(--tone-4)">→</text>

    <li>Για κάθε <strong>μη-επισκεφθέντα</strong> γείτονά του: σημείωσέ τον ως visited, αποθήκευσε τον parent του, βάλ' τον στο τέλος της Queue.</li>
    <li>Αν βρεις το <code>End</code>, σταμάτα. Ανακατασκεύασε το Path ακολουθώντας τους parents ανάποδα.</li>
    <li>Αν η Queue αδειάσει χωρίς να βρεις το End, δεν υπάρχει μονοπάτι.</li>
</ol>
<p>Το BFS εγγυάται <strong>shortest path σε αριθμό hops</strong> γιατί εξετάζει πρώτα όλους τους κόμβους σε απόσταση <em>k</em> πριν περάσει στην απόσταση <em>k+1</em>. Γι' αυτό χρησιμοποιείται στο Lem-in.</p>
`);

        addContent(`
<div class="eyebrow">Ενότητα 3 / 5 — Pathfinding</div>

    <!-- Stack visualization -->
    <rect x="40" y="220" width="740" height="35" rx="6" fill="var(--code-bg)" opacity="0.8"/>

</svg>

<p>Ο αλγόριθμος:</p>
<ol>
    <li>Ξεκίνα από το <code>Start</code>, βάλ' το στο Stack (ή κάλεσε αναδρομικά).</li>
    <li>Βγάλε τον <strong>τελευταίο</strong> κόμβο από το Stack.</li>
    <li>Για κάθε μη-επισκεφθέντα γείτονά του: σημείωσέ τον και βάλ' τον στην κορυφή του Stack.</li>
    <li>Αν βρεις το <code>End</code>, σταμάτα. Ο δρόμος που ακολούθησες <em>δεν είναι κατ' ανάγκη ο συντομότερος</em>.</li>
</ol>
<div class="callout">
  <span class="tag">ΓΙΑΤΙ ΟΧΙ DFS ΣΤΟ LEM-IN;</span>
  Το DFS δεν εγγυάται shortest path. Μπορεί να βρει μονοπάτι μήκους 10 ενώ υπάρχει ένα μήκους 3. Στο Lem-in χρησιμοποιούμε <strong>BFS</strong> γιατί μας δίνει εγγυημένα το συντομότερο μονοπάτι σε κάθε iteration, πράγμα που είναι κρίσιμο για τον Suurballe's.
</div>

        addContent(`
<div class="eyebrow">Ενότητα 3 / 5 — Pathfinding</div>
<h1 id="@dijkstra-explained">Και ο Dijkstra; Τι κάνει;</h1>
<p class="lede">Ο αλγόριθμος του <strong>Dijkstra</strong> βρίσκει το συντομότερο μονοπάτι σε <em>Γράφους με Βάρη (Weighted Graphs)</em>, όπου κάθε ακμή έχει ένα "κόστος" (π.χ. χιλιόμετρα, διόδια, χρόνος). Αντί για απλή Ουρά, χρησιμοποιεί μια <strong>Ουρά Προτεραιότητας (Priority Queue)</strong>.</p>

<svg viewBox="0 0 820 280" style="max-width: 920px; width: 100%; height: auto; margin: 1.5rem auto; display: block;" color="var(--ink)">
    <defs>
        <marker id="dij-arr-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/>
        </marker>
        <marker id="dij-arr-tone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--tone-4)"/>
        </marker>
        <marker id="dij-arr-corr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--correct)"/>
        </marker>
    </defs>

    <!-- Nodes -->
    <circle cx="100" cy="120" r="22" fill="var(--panel)" stroke="var(--correct)" stroke-width="3"/>
    <text x="100" y="125" font-family="var(--font-sans)" font-weight="bold" font-size="14" fill="var(--correct)" text-anchor="middle">S</text>

    <!-- Node A -->
    <circle cx="300" cy="60" r="20" fill="var(--panel)" stroke="var(--correct)" stroke-width="3"/>
    <text x="300" y="65" font-family="var(--font-mono)" font-size="12" fill="var(--ink)" text-anchor="middle">A</text>
    <text x="300" y="32" font-family="var(--font-mono)" font-size="11" fill="var(--correct)" text-anchor="middle" font-weight="bold">Cost: 2</text>

    <!-- Node B -->
    <circle cx="300" cy="180" r="20" fill="var(--panel)" stroke="var(--correct)" stroke-width="3"/>
    <text x="300" y="185" font-family="var(--font-mono)" font-size="12" fill="var(--ink)" text-anchor="middle">B</text>
    <text x="300" y="215" font-family="var(--font-mono)" font-size="11" fill="var(--correct)" text-anchor="middle" font-weight="bold">Cost: <tspan fill="var(--tone-4)" text-decoration="line-through">6</tspan> → 3!</text>

    <!-- Node E -->
    <circle cx="500" cy="120" r="22" fill="var(--panel)" stroke="var(--correct)" stroke-width="3"/>
    <text x="500" y="125" font-family="var(--font-sans)" font-weight="bold" font-size="14" fill="var(--ink)" text-anchor="middle">E</text>
    <text x="500" y="85" font-family="var(--font-mono)" font-size="11" fill="var(--correct)" text-anchor="middle" font-weight="bold">Cost: <tspan fill="var(--tone-4)" text-decoration="line-through">9</tspan> → 5!</text>

    <!-- Edges and Weights -->
    <!-- S to A (Final Path) -->
    <line x1="121" y1="113" x2="279" y2="67" stroke="var(--correct)" stroke-width="2.5" marker-end="url(#dij-arr-corr)"/>
    <rect x="188" y="82" width="24" height="16" fill="var(--code-bg)" rx="4"/>
    <text x="200" y="94" font-family="var(--font-mono)" font-size="11" fill="var(--correct)" text-anchor="middle" font-weight="bold">2</text>
    
    <!-- S to B (Initial slow path) -->
    <line x1="121" y1="127" x2="279" y2="173" stroke="var(--tone-4)" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
    <rect x="188" y="142" width="24" height="16" fill="var(--code-bg)" rx="4"/>
    <text x="200" y="154" font-family="var(--font-mono)" font-size="11" fill="var(--tone-4)" text-anchor="middle">6</text>

    <!-- A to B (The first shortcut) -->
    <line x1="300" y1="80" x2="300" y2="160" stroke="var(--correct)" stroke-width="2.5" marker-end="url(#dij-arr-corr)"/>
    <rect x="288" y="112" width="24" height="16" fill="var(--code-bg)" rx="4"/>
    <text x="300" y="124" font-family="var(--font-mono)" font-size="11" fill="var(--correct)" text-anchor="middle" font-weight="bold">1</text>

    <!-- A to E (Slow path to End) -->
    <line x1="321" y1="67" x2="479" y2="113" stroke="var(--tone-4)" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
    <rect x="388" y="82" width="24" height="16" fill="var(--code-bg)" rx="4"/>
    <text x="400" y="94" font-family="var(--font-mono)" font-size="11" fill="var(--tone-4)" text-anchor="middle">7</text>

    <!-- B to E (Final Path to End) -->
    <line x1="321" y1="173" x2="479" y2="127" stroke="var(--correct)" stroke-width="2.5" marker-end="url(#dij-arr-corr)"/>
    <rect x="388" y="142" width="24" height="16" fill="var(--code-bg)" rx="4"/>
    <text x="400" y="154" font-family="var(--font-mono)" font-size="11" fill="var(--correct)" text-anchor="middle" font-weight="bold">2</text>

    <!-- Explanation Box -->
    <rect x="560" y="40" width="250" height="180" rx="6" fill="var(--code-bg)" opacity="0.8"/>
    <text x="685" y="65" font-family="var(--font-sans)" font-size="11" fill="var(--tone-4)" font-weight="bold" text-anchor="middle">Πώς ανακαλύπτει το Shortest Path:</text>
    
    <text x="580" y="90" font-family="var(--font-mono)" font-size="11" fill="var(--ink)">1. Από S βρίσκει A(2) &amp; B(6).</text>
    <text x="580" y="110" font-family="var(--font-mono)" font-size="11" fill="var(--ink)">2. Επεκτείνει το A (είναι φθηνότερο).</text>
    <text x="580" y="130" font-family="var(--font-mono)" font-size="11" fill="var(--accent)">3. Βρίσκει shortcut A→B: Νέο B(3)!</text>
    <text x="580" y="150" font-family="var(--font-mono)" font-size="11" fill="var(--ink)">4. Επεκτείνει το B (αγνοεί το αρχικό 6).</text>
    <text x="580" y="170" font-family="var(--font-mono)" font-size="11" fill="var(--accent)">5. Βρίσκει shortcut B→E: Νέο E(5)!</text>
    <text x="580" y="195" font-family="var(--font-mono)" font-size="11" fill="var(--correct)" font-weight="bold">Τελικό Path: S → A → B → E (5)</text>
</svg>

<p>Ο αλγόριθμος:</p>
<ol>
    <li>Σε κάθε βήμα, αντί να παίρνει το <em>επόμενο</em> στη σειρά (όπως το BFS), βγάζει από την Ουρά τον κόμβο με το <strong>μικρότερο τρέχον κόστος (βάρος)</strong> από την αφετηρία.</li>
    <li>Αν βρει μια φθηνότερη διαδρομή (shortcut) για έναν κόμβο που ήδη έχει επισκεφθεί επιφανειακά (όπως το S→A→B που κοστίζει 3, ενώ το S→B κοστίζει 5), ενημερώνει το κόστος του.</li>
</ol>
<div class="callout">
  <span class="tag">Η ΣΧΕΣΗ ΜΕ ΤΟ BFS</span>
  Όταν όλες οι ακμές έχουν <strong>βάρος 1</strong> (όπως συμβαίνει στα τούνελ του Lem-in, όπου κάθε άλμα μετράει για 1 turn), η Priority Queue του Dijkstra λειτουργεί ακριβώς όπως η απλή Queue του BFS. Δεν υπάρχουν "shortcuts" να ανακαλύψει. <strong>Άρα το BFS είναι απλά ένας Dijkstra για Unweighted Graphs!</strong>
</div>
`);


        addContent(`
<div class="eyebrow">Ενότητα 3 / 5 — Pathfinding</div>
<h1 id="@node-split-intro">Το Πρόβλημα του Χώρου (Capacity)</h1>
<p class="lede">Ο κλασικός αλγόριθμος εύρεσης μέγιστης ροής (Max Flow) λέγεται <strong>Edmonds-Karp</strong>. Όμως, αυτός σχεδιάστηκε αρχικά για δίκτυα ύδρευσης.</p>
<p>Γι' αυτό το λόγο ελέγχει το <strong>Edge Capacity</strong> (Πόσο νερό χωράει ο σωλήνας / τούνελ). Στο Lem-in όμως δεν έχουμε κανένα περιορισμό στα τούνελ. Έχουμε <em>Node Capacity</em> (Κάθε δωμάτιο χωράει αυστηρά και μόνο 1 μυρμήγκι τη φορά).</p>
<svg viewBox="0 0 800 160" style="max-width: 800px; width: 100%; height: auto; margin: 1.5rem 0;">
    <rect width="800" height="160" fill="var(--code-bg)" rx="8" />
    <!-- Edge Capacity -->
    <text x="200" y="30" font-family="var(--font-sans)" font-size="14" fill="var(--tone-4)" text-anchor="middle">Δίκτυα (Edge Capacity)</text>
    <circle cx="80" cy="100" r="20" fill="var(--panel)" stroke="var(--tone-4)" stroke-width="2"/>
    <circle cx="320" cy="100" r="20" fill="var(--panel)" stroke="var(--tone-4)" stroke-width="2"/>
    <line x1="100" y1="100" x2="300" y2="100" stroke="var(--accent)" stroke-width="24"/>
    <text x="200" y="104" font-family="var(--font-sans)" font-size="12" font-weight="bold" fill="var(--code-bg)" text-anchor="middle">Χωράει 50 Μονάδες</text>

    <line x1="400" y1="20" x2="400" y2="140" stroke="var(--tone-3)" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Node Capacity -->
    <text x="600" y="30" font-family="var(--font-sans)" font-size="14" fill="var(--tone-4)" text-anchor="middle">Lem-in (Node Capacity)</text>
    <circle cx="480" cy="100" r="20" fill="var(--panel)" stroke="var(--tone-4)" stroke-width="2"/>
    <circle cx="720" cy="100" r="20" fill="var(--panel)" stroke="var(--tone-4)" stroke-width="2"/>
    <line x1="500" y1="100" x2="700" y2="100" stroke="var(--tone-4)" stroke-width="2"/>
    <circle cx="600" cy="100" r="35" fill="var(--danger)" fill-opacity="0.15" stroke="var(--danger)" stroke-width="2"/>
    <text x="600" y="104" font-family="var(--font-sans)" font-size="12" font-weight="bold" fill="var(--danger)" text-anchor="middle">Χωράει 1</text>
</svg>
<p>Επειδή ο αλγόριθμος "καταλαβαίνει" μόνο από όρια σε τούνελ (edges), πρέπει με κάποιο τρόπο να τον ξεγελάσουμε. Πρέπει να <em>μετατρέψουμε</em> τον περιορισμό του δωματίου, σε περιορισμό τούνελ!</p>
`);

        addContent(`
<div class="eyebrow">Ενότητα 3 / 5 — Pathfinding</div>
<h1 id="@node-split-trick">Η Μαθηματική Παραίσθηση</h1>
<p class="lede">Η λύση λέγεται <strong>Node Splitting</strong>. Χωρίζουμε (προγραμματιστικά) κάθε πραγματικό δωμάτιο σε <em>δύο εικονικά δωμάτια</em>.</p>
<p>Αν έχουμε το <code>RoomA</code>, φτιάχνουμε το <code>RoomA_in</code> και το <code>RoomA_out</code>. <br>Όλα τα <strong>εισερχόμενα</strong> εξωτερικά τούνελ του γράφου συνδέονται στο <code>_in</code>. <br>Όλα τα <strong>εξερχόμενα</strong> εξωτερικά τούνελ φεύγουν από το <code>_out</code>.</p>
<p>Ανάμεσα στα δύο αυτά μισά, προσθέτουμε <strong>ένα μονοδρομικό τούνελ (Internal Edge)</strong>. Αυτό το εσωτερικό τούνελ λειτουργεί ως η "εικονική πόρτα" του δωματίου.</p>

<svg viewBox="0 0 800 200" style="max-width: 800px; width: 100%; height: auto; margin: 1.5rem 0;">
    <rect width="800" height="200" fill="var(--code-bg)" rx="8" />
    
    <!-- Real Room -->
    <text x="200" y="30" font-family="var(--font-sans)" font-size="14" fill="var(--tone-4)" text-anchor="middle">Το Πραγματικό Δωμάτιο</text>
    <!-- incoming -->
    <line x1="80" y1="60" x2="160" y2="100" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow-ink)"/>
    <line x1="80" y1="140" x2="160" y2="100" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow-ink)"/>
    <!-- outgoing -->

        addContent(`
<div class="eyebrow">Ενότητα 3 / 5 — Pathfinding</div>
<h1 id="@node-split-code">Τι Σημαίνει Πρακτικά Στον Κώδικα;</h1>
<p class="lede">Το Splitting δεν είναι απλά "θεωρία", μεταφράζεται 1-προς-1 σε Structs. Όταν κάνετε Parsing τα δωμάτια από το αρχείο, δεν δημιουργείτε 1 Node. Δημιουργείτε <strong>δύο</strong>, και τα συνδέετε κατευθείαν μεταξύ τους.</p>
<pre><code class="lang-go">// Όταν διαβάζετε ένα δωμάτιο (π.χ. "RoomA")
func (g *Graph) AddRoom(name string) {
    // 1. Δημιουργία των Split Nodes
    nodeIn := &Node{Name: name + "_in"}
    nodeOut := &Node{Name: name + "_out"}
    
    // 2. Σύνδεση IN -> OUT (Μονοδρομική εσωτερική ακμή)
    // Αναπαριστά τη φυσική διάσχιση του ίδιου του δωματίου
    nodeIn.Edges = append(nodeIn.Edges, nodeOut)
    
    // 3. Αποθήκευση στον Γράφο
    g.Nodes[nodeIn.Name] = nodeIn
    g.Nodes[nodeOut.Name] = nodeOut
}
</code></pre>
<p>Όταν αργότερα διαβάζετε τα εξωτερικά τούνελ, π.χ. <code>RoomA-RoomB</code>, τα συνδέετε "χιαστί" σύμφωνα με τον κανόνα: Το <code>Out</code> του ενός πάει στο <code>In</code> του άλλου.</p>
<pre><code class="lang-go">// Όταν διαβάζετε τη σύνδεση RoomA-RoomB
func (g *Graph) AddExternalEdge(nameA, nameB string) {
    // A -> B (Το Out του A πάει στο In του B)
    outA := g.Nodes[nameA + "_out"]
    inB := g.Nodes[nameB + "_in"]
    outA.Edges = append(outA.Edges, inB)
    
    // B -> A (Το Out του B πάει στο In του A)
    outB := g.Nodes[nameB + "_out"]
    inA := g.Nodes[nameA + "_in"]
    outB.Edges = append(outB.Edges, inA)
}
</code></pre>
<div class="callout"><span class="tag">ΕΞΑΙΡΕΣΗ</span>Το Start και το End Node δεν χρειάζονται Split! Αφού το Start μπορεί να φιλοξενήσει άπειρα μυρμήγκια (ξεκινούν όλα από εκεί) και το End δεν "γεμίζει" ποτέ, παραμένουν μονοί κόμβοι. Το Node Splitting εφαρμόζεται <strong>αυστηρά μόνο στα ενδιάμεσα δωμάτια</strong>.</div>
`);

        addContent(`
<div class="eyebrow">Ενότητα 3 / 5 — Pathfinding</div>
<h1 id="@residual">Residual Graph (Υπολειπόμενος Γράφος)</h1>
<p class="lede">Πώς αναιρούμε τις λάθος (Greedy) επιλογές του BFS; Δεν μπορούμε να μαντέψουμε το σωστό εξαρχής. Αφήνουμε τον αλγόριθμο να κάνει λάθος, και του δίνουμε τον μηχανισμό να <em>αλλάξει γνώμη</em>.</p>
<p>Όταν το πρώτο BFS βρίσκει ένα μονοπάτι (π.χ. Start -> A -> B -> End), αντί να διαγράψουμε τους κόμβους αυτούς, δημιουργούμε έναν <strong>Residual Graph</strong> (Υπολειπόμενο Γράφο).</p>
<p>Σε αυτόν τον νέο γράφο, η διαδρομή που μόλις χρησιμοποιήσαμε παραμένει ζωντανή, αλλά <strong>μόνο προς την αντίθετη κατεύθυνση!</strong> Αντί να "κλειδώνουμε" τα δωμάτια, διαγράφουμε το τούνελ και το ξαναφτιάχνουμε ανάποδα.</p>
`);

        addContent(`
<div class="eyebrow">Ενότητα 3 / 5 — Pathfinding</div>
<h1 id="@reversal">Η Αναστροφή (Edge Reversal)</h1>
<p>Κάθε φορά που ένα μονοπάτι επικυρώνεται (αποθηκεύεται ως λύση), <strong>διαγράφουμε</strong> τις αρχικές ακμές του από τον γράφο και προσθέτουμε <strong>Ανάποδες Ακμές (Reverse Edges)</strong>.</p>
<svg viewBox="0 0 800 160" style="max-width: 800px; width: 100%; height: auto; margin: 1.5rem 0;">
    <defs>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--danger)" />
        </marker>
    </defs>
    <rect width="800" height="160" fill="var(--code-bg)" rx="8" />
    
    <!-- Original State -->
    <text x="120" y="35" font-family="var(--font-sans)" font-size="14" fill="var(--tone-4)" text-anchor="middle">Αρχικός Γράφος</text>
    <circle cx="60" cy="100" r="20" fill="var(--panel)" stroke="var(--tone-4)" stroke-width="2"/>
    <text x="60" y="105" font-family="var(--font-sans)" font-weight="bold" fill="var(--ink)" text-anchor="middle">A</text>
    <circle cx="180" cy="100" r="20" fill="var(--panel)" stroke="var(--tone-4)" stroke-width="2"/>
    <text x="180" y="105" font-family="var(--font-sans)" font-weight="bold" fill="var(--ink)" text-anchor="middle">B</text>
    <line x1="80" y1="100" x2="160" y2="100" stroke="var(--ink)" stroke-width="2"/>
    
    <!-- Transition -->
    <text x="390" y="90" font-family="var(--font-sans)" font-size="16" fill="var(--accent)" text-anchor="middle">Το BFS επιλέγει το A→B</text>
    <text x="390" y="125" font-family="var(--font-mono)" font-size="30" fill="var(--tone-4)" text-anchor="middle">→</text>
    
    <!-- Residual State -->
    <text x="660" y="35" font-family="var(--font-sans)" font-size="14" fill="var(--tone-4)" text-anchor="middle">Residual Graph</text>
    <circle cx="600" cy="100" r="20" fill="var(--panel)" stroke="var(--danger)" stroke-width="2"/>
    <text x="600" y="105" font-family="var(--font-sans)" font-weight="bold" fill="var(--ink)" text-anchor="middle">A</text>
    <circle cx="720" cy="100" r="20" fill="var(--panel)" stroke="var(--danger)" stroke-width="2"/>
    <text x="720" y="105" font-family="var(--font-sans)" font-weight="bold" fill="var(--ink)" text-anchor="middle">B</text>
    
    <!-- Reversed Edge -->
    <path d="M 700 100 L 620 100" stroke="var(--danger)" stroke-width="3" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>

</svg>
<p>Η Reverse Edge <code>B -> A</code> είναι πλέον διαθέσιμη στο <strong>επόμενο</strong> BFS. Λειτουργεί σαν "Undo Button". Αν το επόμενο BFS αναγκαστεί (ψάχνοντας διέξοδο) να την επιλέξει, σημαίνει ότι βρήκε τρόπο να <em>διορθώσει</em> το λάθος του προηγούμενου!</p>
`);

        addContent(`
<div class="eyebrow">Ενότητα 3 / 5 — Pathfinding</div>
<h1 id="@cancellation">Το "Ξεμπέρδεμα" (Cancellation)</h1>
<p class="lede">Τι γίνεται όταν το δεύτερο BFS περπατήσει πάνω σε μια Reverse Edge;</p>
<p>Αν το <strong>Path 1</strong> είχε χρησιμοποιήσει την κανονική ακμή <code>A -> B</code>, και αργότερα το <strong>Path 2</strong> περπατήσει πάνω στην αντίστροφη <code>B -> A</code>, συμβαίνει κάτι μαγικό (Cancellation). Οι δύο αντίρροπες κινήσεις αλληλοεξουδετερώνονται.</p>
<div class="callout good">
  <span class="tag">Ο ΜΗΧΑΝΙΣΜΟΣ ΞΕΜΠΕΡΔΕΜΑΤΟΣ</span>
  Η κοινή σύνδεση A-B διαγράφεται τελείως. Το πρώτο μισό του Path 1 ενώνεται με το δεύτερο μισό του Path 2, και το πρώτο μισό του Path 2 ενώνεται με το δεύτερο μισό του Path 1.<br><br>
  Ο γράφος μόλις αναδιατάχθηκε αυτόματα, αποδίδοντας <strong>δύο εντελώς νέα, τέλεια διαχωρισμένα (Vertex-Disjoint) μονοπάτια</strong> που δεν διασταυρώνονται πλέον πουθενά!
</div>
<p>Η διαδικασία (Βρες Path → Αντέστρεψε Edges → Ξαναψάξε → Ακύρωσε αν διασταυρωθείς) επαναλαμβάνεται σε Loop. Το Loop σταματάει <strong>μόνο όταν το BFS επιστρέψει nil</strong> (δηλαδή δεν υπάρχει πλέον καμία διαδρομή από το Start στο End). Τότε, έχουμε φτάσει στο απόλυτο όριο (Max Flow).</p>
`);

        addContent(`
<div class="eyebrow">Ενότητα 3 / 5 — Pathfinding</div>
<h1 id="@edmonds-vs-suurballe">Edmonds-Karp vs Suurballe</h1>
<p class="lede">Εδώ προκύπτει μια κλασική απορία: <em>"Τελικά ποιον αλγόριθμο φτιάχνουμε; Τον Edmonds-Karp ή τον Suurballe;"</em> Η απάντηση είναι: <strong>Και τους δύο, γιατί στο Lem-in ταυτίζονται!</strong></p>

<div class="callout">
  <span class="tag">ΤΟ ΜΥΣΤΙΚΟ ΤΩΝ ΑΛΓΟΡΙΘΜΩΝ</span>
  <p><strong>Edmonds-Karp:</strong> Είναι ο "μπαμπάς" της θεωρίας. Αυτός εισήγαγε το <em>Capacity</em> (Χωρητικότητα), το <em>Residual Graph</em> (Αντεστραμμένες Ακμές) και το <em>Cancellation</em> (Ξεμπέρδεμα) χρησιμοποιώντας <strong>BFS</strong>. Ανάλυοντάς τον, καταλαβαίνουμε *γιατί* χρειάζεται το Node-Splitting.</p>
  
  <p><strong>Suurballe's Algorithm:</strong> Είναι ένας αλγόριθμος σχεδιασμένος *συγκεκριμένα* για να βρίσκει τα συντομότερα Vertex-Disjoint Paths. Όμως, επειδή σχεδιάστηκε για χάρτες με αποστάσεις (Weighted Graphs, π.χ. διόδια), χρησιμοποιεί τον <strong>Dijkstra</strong> αντί για BFS.</p>
  
  <p><strong>Η Ταύτιση:</strong> Στο Lem-in, η απόσταση μεταξύ των δωματίων είναι πάντα ακριβώς 1 άλμα (Unweighted). Όταν τρέχεις Dijkstra σε γράφο όπου όλα τα βάρη είναι 1, ο Dijkstra <em>εκφυλίζεται σε ένα απλό BFS</em>.</p>
</div>

<p>Επομένως:</p>
<ul>
    <li>Ο <strong>Suurballe</strong> σε Unweighted Graph = BFS + Reverse Edges.</li>
    <li>Ο <strong>Edmonds-Karp</strong> (με Capacity 1) = BFS + Reverse Edges.</li>
</ul>
<p>Είναι 100% η ίδια μηχανή (ίδιος κώδικας). Αναφέρουμε τον Edmonds-Karp για να κατανοήσουμε τη θεωρία (Capacity/Flow), και τον Suurballe γιατί αυτός είναι ο όρος που κάνει focus στον τελικό μας στόχο (Disjoint Paths).</p>
`);

        addContent(`
<div class="eyebrow">Ενότητα 4 / 5 — Routing</div>
<h1 id="@routing">Τα Μαθηματικά του Routing</h1>
<p class="lede">Ο αλγόριθμός σας (Suurballe) τρέχει σε λούπα (iterative approach). Στο πρώτο iteration βρίσκει 1 Path (Σετ 1). Στο δεύτερο iteration βρίσκει 2 Paths (Σετ 2). Στο τρίτο βρίσκει 3 Paths (Σετ 3), και ούτω καθεξής.</p>
<p><strong>Ποιο Σετ είναι το καλύτερο;</strong> Πρέπει να πάρουμε το Σετ με τα περισσότερα Paths; <em>Όχι απαραίτητα.</em></p>
<p>Η απάντηση εξαρτάται <strong>αποκλειστικά από το πλήθος των μυρμηγκιών (N)</strong>. Αν έχετε 3 μυρμήγκια και το Σετ 2 περιέχει ένα μονοπάτι Μήκους 2 και ένα μονοπάτι Μήκους 100, ολόκληρο το Σετ είναι άχρηστο. Θα στείλετε και τα 3 μυρμήγκια στο γρήγορο μονοπάτι. Αν είχατε 5,000 μυρμήγκια, το Σετ 2 (που περιλαμβάνει και το τεράστιο μονοπάτι) θα κέρδιζε, γιατί η αναμονή στο μικρό μονοπάτι θα ήταν μεγαλύτερη από το να κάνουν τα 100 βήματα.</p>

<div class="callout">
  <span class="tag">Η ΦΟΡΜΟΥΛΑ TOY ROUTING</span>
  Κόστος Χρήσης Μονοπατιού = <code>Μήκος Μονοπατιού + Μυρμήγκια που περιμένουν ήδη σε αυτό</code>.<br><br>
  Για κάθε ένα από τα N μυρμήγκια, υπολογίζουμε το "Κόστος" όλων των μονοπατιών στο τρέχον Σετ. Το μυρμήγκι ανατίθεται στο μονοπάτι με το χαμηλότερο Κόστος. Στο τέλος, ο μέγιστος γύρος άφιξης (Max Turns) ορίζει την <strong>"αξία" (σκορ)</strong> ολόκληρου του Σετ.
</div>

<p>Επομένως, το πρόγραμμα δουλεύει έτσι: <br>1. Βρίσκεις Σετ X.<br>2. Κάνεις Εικονική Κατανομή (Distribution) όλων των μυρμηγκιών στα Paths του Σετ X.<br>3. Μετράς τους Γύρους (Turns).<br>4. Αν το Σετ X δίνει λιγότερους Γύρους από το Σετ X-1, το κρατάς! Αν δίνει περισσότερους, σημαίνει ότι τα νέα paths είναι πολύ μεγάλα. Πετάς το Σετ X, σταματάς το ψάξιμο, και προχωράς στο Print με το Σετ X-1.</p>
`);

<p>Το <code>Lx-y</code> σημαίνει "Το μυρμήγκι x πήγε στο δωμάτιο y". Όμως υπάρχει ένας <strong>Κρίσιμος Κανόνας Προσομοίωσης</strong>.</p>
<div class="callout">

<h1 id="@strings-builder">Αποδοτική Εκτύπωση (strings.Builder)</h1>
<p>Το format εξόδου απαιτεί ένα κενό διάστημα μεταξύ των κινήσεων: <code>L1-A L2-B</code>.</p>
<p>Όταν έχετε 1000 μυρμήγκια και μεγάλα paths, το loop κίνησης μπορεί να εκτελεστεί δεκάδες χιλιάδες φορές. Αν χρησιμοποιήσετε <code>str += " L1-A"</code> μέσα στο loop, η Go θα κάνει allocation νέας μνήμης (αφού τα strings είναι immutable) για <em>κάθε</em> ένα <code>+</code>. Το πρόγραμμά σας θα γίνει τρομερά αργό και θα κοπεί στο Time Limit (Timeout) του Zone01.</p>

<pre><code class="lang-go">// ΠΑΝΤΑ να χρησιμοποιείτε strings.Builder 
// για string concatenation μέσα σε μεγάλα loops!
import "strings"

var sb strings.Builder

// Μέσα στο loop κίνησης του κάθε γύρου:
sb.WriteString("L")
sb.WriteString(strconv.Itoa(antID))
sb.WriteString("-")
sb.WriteString(roomName)
sb.WriteString(" ")

// Στο τέλος του γύρου:
fmt.Println(strings.TrimSpace(sb.String()))
sb.Reset() // Για τον επόμενο γύρο
</code></pre>
