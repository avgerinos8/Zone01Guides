        addContent(`
<div class="eyebrow">Ενότητα 1 / 5 — Slices</div>
<h1>Arrays</h1>
<p class="lede">Ο πιο απλός τρόπος να δηλώσουμε μια μεταβλητή τύπου array (πίνακας).</p>

<pre><code class="lang-go">var numbers [3]int</code></pre>

<p>Αν θέλουμε να του δώσουμε απευθείας αρχικές τιμές (για παράδειγμα, τα <code>12, 24, 36</code>) κατά τη δήλωση:</p>
<pre><code class="lang-go">var numbers [3]int = [3]int{12, 24, 36}</code></pre>
<p>ή, ακριβώς το ίδιο:</p>
<pre><code class="lang-go">numbers := [3]int{12, 24, 36}</code></pre>

<p>Για να διαβάσουμε ή να γράψουμε μια τιμή, γράφουμε το όνομα του array ακολουθούμενο από τον δείκτη (index) της θέσης μέσα σε αγκύλες <code>[n]</code>:</p>
<pre><code class="lang-go">fmt.Println(numbers[0]) // prints 12
fmt.Println(numbers[1]) // prints 24
fmt.Println(numbers[2]) // prints 36</code></pre>

<div style="display:flex;justify-content:center;margin:0"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" style="width:100%;max-width:420px;height:auto;color:inherit"><text x="160" y="25" text-anchor="middle" font-family="var(--font-mono)" font-size="15" fill="currentColor">[3]int = {12, 24, 36}</text><g stroke="currentColor" stroke-width="2" fill="rgba(var(--panel-rgb), 0.45)"><rect x="40" y="45" width="240" height="60" rx="6"/><path d="M120 45v60m80-60v60"/></g><g text-anchor="middle" font-family="var(--font-mono)" font-size="20" fill="currentColor"><text x="80" y="83">12</text><text x="160" y="83">24</text><text x="240" y="83">36</text></g><g text-anchor="middle" font-family="var(--font-mono)" font-size="14" fill="var(--accent)"><text x="80" y="185">0</text><text x="160" y="185">1</text><text x="240" y="185">2</text></g><g fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M80 165q-10-25 0-50"/><path d="m74 122 6-7 6 5m74 45q-10-25 0-50"/><path d="m154 122 6-7 6 5m74 45q-10-25 0-50"/><path d="m234 122 6-7 6 5"/></g></svg></div>

<div class="callout">
  <span class="tag">Προσοχή / Συχνό λάθος</span>
  Η αρίθμηση των θέσεων ξεκινάει <strong>πάντα από το 0</strong>. Το <code>numbers[0]</code> είναι το πρώτο στοιχείο του array (στο παράδειγμά μας το 12), όχι το <code>numbers[1]</code>. Αντίστοιχα, το τελευταίο στοιχείο ενός array μεγέθους 3 είναι το <code>numbers[2]</code>. Δηλαδή <code>numbers[len(numbers)-1]</code>. Αν προσπαθήσεις να διαβάσεις το <code>numbers[3]</code>, το πρόγραμμα θα καταρρεύσει (panic: index out of range).
</div>


`);
        addContent(`
<div class="eyebrow">Ενότητα 1 / 5 — Slices</div>

<h1>Ο περιορισμός των arrays</h1>
<p>Ένα <strong>array</strong> στη Go έχει ένα θεμελιώδες χαρακτηριστικό: το μέγεθός του (3) είναι μέρος του τύπου του και <strong>δεν μπορεί να αλλάξει ποτέ</strong>. Ένα <code>[3]int</code> και ένα <code>[4]int</code> είναι δύο εντελώς διαφορετικοί τύποι δεδομένων, όπως το <code>int</code> και το <code>string</code>.</p>

<div class="callout">
  <span class="tag">ΑΥΤΟ ΔΕΝ ΚΑΝΕΙ ΤΑ ARRAYS ΙΔΙΑΙΤΕΡΑ ΧΡΗΣΙΜΑ</span>
  Γι'αυτό τον λόγο χρησιμοποιούμε τα <strong>arrays</strong> σπάνια, σχεδόν ποτέ. Αντίθετα, προτιμάμε τα <strong>slices</strong> που έχουν δυναμική χωρητικότητα (το μέγεθός τους μπορεί να μεταβάλλεται).
</div>

<h1>Slices</h1>
<p>Ένα <strong>slice</strong> είναι σχεδόν ακριβώς το ίδιο με ένα array, με μία βασική διαφορά: δεν γράφουμε κάποιον σταθερό αριθμό μέσα στις αγκύλες <code>[]</code> του τύπου του. Επειδή απουσιάζει αυτός ο αριθμός, το μέγεθός του δεν είναι προκαθορισμένο.</p>

<pre><code class="lang-go">var myArray [3]int // array: fixed size 3
var mySlice []int  // slice: no size specified</code></pre>

        addContent(`
<div class="eyebrow">Ενότητα 1 / 5 — Slices</div>
<h1>Iteration σε Slice</h1>
<p>Έστω ότι έχουμε ένα slice με τυχαία στοιχεία:</p>
<pre><code class="lang-go">var numbers []int = []int{ 24, 96, 31, 36, 72, 12, 48, 81}
fmt.Println(numbers[4])              // 72
fmt.Println(numbers[len(numbers)-1]) // 81</code></pre>
<p>Για να "ταξιδέψουμε" ένα-ένα τα στοιχεία του slice, θα χρησιμοποιήσουμε loop:</p>
<pre><code class="lang-go">for i := 0; i &lt; len(numbers); i++ {
    fmt.Println(numbers[i])
}</code></pre>
<p>Ακριβώς το ίδιο θα κάναμε χρησιμοποιώντας την πιο εξιδικευμένη <code>for := range</code> που κάνει ακριβώς αυτό (iteration στα στοιχεία ενός slice):</p>
<pre><code class="lang-go">for index, _ := range numbers {
    fmt.Println(numbers[index])
}</code></pre>
<p>Μπορούμε να αγνοήσουμε το <code>index</code>. Τα στοιχεία μπαίνουν ένα προς ένα στην 2η μεταβλητή (<code>element</code>) που δημιουργούμε:</p>
<pre><code class="lang-go">for _, element := range numbers {
    fmt.Println(element)
}</code></pre>
<div class="callout">
  <span class="tag">ΤΡΕΙΣ ΤΡΟΠΟΙ ΙΔΙΟ ΑΠΟΤΕΛΕΣΜΑ</span>
  Και τα τρία παραπάνω <code>for</code> loops είναι εντελώς ισοδύναμα και κάνουν ακριβώς το ίδιο πράγμα. Το ποιό θα χρησιμοποιήσεις εξαρτάται καθαρά από το τι πληροφορία χρειάζεσαι μέσα στη λούπα (το index, την τιμή, ή έλεγχο στο βήμα του loop — η <code>for := range</code> στο στερεί αυτό).
</div>
`);

        addContent(`
<div class="eyebrow">Ενότητα 1 / 5 — Slices</div>
<h1>Αρχικοποίηση με make</h1>
<p class="lede">Παρόλο που ένα slice δεν έχει προκαθορισμένο μέγεθος στον τύπο του, πολλές φορές ξέρουμε από πριν πόσα στοιχεία θα χρειαστούμε.</p>

<p>Αν θέλουμε ένα slice με συγκεκριμένο μέγεθος (π.χ. 5 στοιχεία), αρχικοποιημένα όλα στο μηδέν (τη zero value του τύπου τους), χρησιμοποιούμε την ενσωματωμένη συνάρτηση <code>make</code>:</p>

<pre><code class="lang-go">scores := make([]int, 5)
fmt.Println(scores) // prints [0 0 0 0 0]</code></pre>

<p>Αυτό είναι πολύ βολικό όταν θέλουμε να "δεσμεύσουμε" τον χώρο πρώτα, για να τον γεμίσουμε μετά με συγκεκριμένες τιμές στις αντίστοιχες θέσεις (indexes):</p>

<pre><code class="lang-go">scores[0] = 100
scores[4] = 95
fmt.Println(scores) // prints [100 0 0 0 95]</code></pre>

4" y="170" width="46" height="34" rx="6"/><rect x="108" y="170" width="46" height="34" rx="6"/><rect x="162" y="170" width="46" height="34" rx="6"/></g><rect x="216" y="170" width="46" height="34" rx="6" fill="rgba(var(--correct-rgb), 0.12)" stroke="var(--correct)" stroke-width="2"/><g text-anchor="middle" font-family="var(--font-mono)" font-size="14" fill="currentColor"><text x="23" y="193">100</text><text x="77" y="193">0</text><text x="131" y="193">0</text><text x="185" y="193">0</text><text x="239" y="193" fill="var(--correct)" font-weight="600">95</text></g><g text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="currentColor" opacity=".4"><text x="23" y="222">0</text><text x="77" y="222">1</text><text x="131" y="222">2</text><text x="185" y="222">3</text><text x="239" y="222">4</text></g></svg></div>

<div class="eyebrow">Ενότητα 1 / 5 — Slices</div>
<h1>Προσθήκη με append</h1>
<p class="lede">Το μεγαλύτερο πλεονέκτημα των slices είναι ότι μπορούμε να προσθέτουμε νέα στοιχεία "στο τέλος" τους δυναμικά.</p>

<p>Αυτό γίνεται με την ενσωματωμένη συνάρτηση <code>append</code>. Της δίνουμε το αρχικό slice και τα νέα στοιχεία, και μας επιστρέφει ένα <strong>νέο, μεγαλύτερο slice</strong>:</p>

<pre><code class="lang-go">names := []string{"Alice"}
names = append(names, "Bob")
names = append(names, "Charlie", "Dave")
fmt.Println(names) // prints [Alice Bob Charlie Dave]</code></pre>

<div class="eyebrow">Ενότητα 2 / 5 — Command Line Arguments</div>
<h1>Είσοδος από το Terminal (os.Args)</h1>
<p class="lede">Πώς διαβάζουμε τις λέξεις που γράφει ο χρήστης δίπλα στο <code>go run .</code> κατά την εκτέλεση του προγράμματος.</p>

<p>Στη Go, τα ορίσματα της γραμμής εντολών (command-line arguments) βρίσκονται στο <code>os.Args</code>. Για να το χρησιμοποιήσουμε, πρέπει να κάνουμε import το package <code>"os"</code>.</p>
<p>Το <code>os.Args</code> είναι απλώς ένα slice από strings (<code>[]string</code>). Όμως έχει μια θεμελιώδη ιδιαιτερότητα:</p>

<div class="callout">
  <span class="tag">Προσοχή / Συχνό λάθος</span>
  Το <code>os.Args[0]</code> <strong>δεν</strong> είναι το πρώτο όρισμα που έδωσε ο χρήστης. Είναι πάντα η διαδρομή (path) ή το όνομα του ίδιου του εκτελέσιμου αρχείου. Τα πραγματικά ορίσματα που μας ενδιαφέρουν ξεκινάνε από το <code>os.Args[1]</code>.
</div>

<p>Αν τρέξουμε το πρόγραμμά μας ως εξής:</p>
<pre><code class="lang-bash">go run main.go hello world</code></pre>
<p>Το slice <code>os.Args</code> θα έχει 3 στοιχεία:</p>
<div class="grid3">
  <div class="card"><h3>os.Args[0]</h3><p>Το όνομα του προγράμματος (π.χ. η προσωρινή διαδρομή του build).</p></div>
  <div class="card"><h3>os.Args[1]</h3><p>Το string <code>"hello"</code>.</p></div>
  <div class="card"><h3>os.Args[2]</h3><p>Το string <code>"world"</code>.</p></div>
</div>
`);

<div class="eyebrow">Ενότητα 2 / 5 — Command Line Arguments</div>
<h2>Η αφελής προσέγγιση και το Panic</h2>
<p class="lede">Έστω ότι θέλουμε να τυπώσουμε το πρώτο όρισμα που μας έδωσε ο χρήστης. Η πρώτη, αφελή σκέψη είναι να διαβάσουμε απευθείας το <code>os.Args[1]</code>.</p>

<pre><code class="lang-go">package main

import (
    "fmt"
    "os"
)

func main() {
    // Naive approach: just print the 1st argument
    fmt.Println("Your name is:", os.Args[1])
}</code></pre>

<p>Αν ο χρήστης τρέξει <code>go run . George</code>, όλα δουλεύουν τέλεια. Τι γίνεται όμως αν τρέξει απλώς <code>go run .</code> χωρίς καμία λέξη δίπλα;</p>

<div class="callout">
  <span class="tag">PANIC: INDEX OUT OF RANGE</span>
  Το <code>os.Args</code> θα έχει μόνο 1 στοιχείο (το <code>os.Args[0]</code> με το όνομα του προγράμματος). Προσπαθώντας να διαβάσουμε το <code>os.Args[1]</code>, ζητάμε μια θέση που δεν υπάρχει, και το πρόγραμμα καταρρέει (panic).
</div>
`);
        addContent(`
<div class="eyebrow">Ενότητα 2 / 5 — Command Line Arguments</div>
<h2>Η σωστή λύση (Guard Clause)</h2>
<p>Εφόσον το <code>os.Args</code> είναι ένα κανονικό slice, πρέπει <strong>πάντα</strong> να ελέγχουμε το μήκος του με την <code>len()</code> πριν προσπελάσουμε συγκεκριμένα indexes.</p>

<pre><code class="lang-go">func main() {
    // Guard clause: safe check
    if len(os.Args) &lt; 2 {
        fmt.Println("No arguments provided.")
        return
    }

    fmt.Println("Your name is:", os.Args[1])
}</code></pre>
`);

<h1>Ο έλεγχος: απειλείται αυτό το τετράγωνο?</h1>
<p class="lede"> Πριν τοποθετήσουμε οποιαδήποτε βασίλισσα, χρειαζόμαστε μια βοηθητική function που θα καλείται σε κάθε πιθανό συνδιασμό που θα δοκιμάζουμε και απαντάει με <code>true</code>/<code>false</code>: αν βάλω βασίλισσα εδώ, την απειλεί κάποια από όσες έχω ήδη τοποθετήσει; Θα τη λέμε <code>isSafe</code>. </p>

<p> Δύο πράγματα μας γλιτώνουν από δουλειά. Δεν ελέγχουμε ποτέ γραμμές: το μονοδιάστατο slice κάνει αδύνατο να υπάρχουν δύο βασίλισσες στην ίδια γραμμή. Και δεν ελέγχουμε μετά από την τιμή της <code>row</code>, γιατί γεμίζουμε από πάνω προς τα κάτω, αυτή τη στιγμή ξέρουμε ότι βρισκόμαστε στο γραμμή <code>row</code> και όλα τα κάτω row είναι ακόμα άδεια. Συμπερασματικά: μένουν στήλες και διαγώνιοι, και οι γραμμές <code>0</code> έως και <code>row-1</code>.</p>

<div class="eyebrow" id="@issafe-kodikas">Ενότητα 5 / 5 — N Queens</div>
<h1>Η <code>isSafe</code>, γραμμή προς γραμμή</h1>

<pre><code class="lang-go">// isSafe reports whether a queen at (row, col) is attacked by any
// queen already placed in rows 0..row-1.
func isSafe(board []int, row, col int) bool {
    for r := 0; r <= row - 1; r++ {
        c := board[r] // the column of the queen in row r

        if c == col {
            return false // same column
        }
        if  r+c == row+col || r-c == row-col {
            return false // same diagonal
        }
    }
    return true
}</code></pre>

<p> Το <code>for r := 0; r &lt; row; r++</code> περνάει από κάθε ήδη τοποθετημένη βασίλισσα, και μόνο από αυτές. Και οι δύο έλεγχοι κάνουν <code>return false</code> αμέσως: μία απειλή αρκεί, δεν έχει νόημα να συνεχίσουμε το loop. Το <code>return true</code> στο τέλος σημαίνει «επέζησε από κάθε έλεγχο», όχι «δεν βρέθηκε τίποτα να ελεγχθεί».</p>

<div class="callout">
  <span class="tag">Η ειδική περίπτωση της πρώτης γραμμής</span>
  <p> Όταν <code>row</code> είναι 0, η συνθήκη <code>0 &lt; 0</code> είναι ψευδής και το loop δεν εκτελείται καθόλου. Η function πηγαίνει κατευθείαν στο <code>return true</code>, που είναι σωστό: στην πρώτη γραμμή δεν υπάρχει τίποτα από πάνω. Δεν χρειάστηκε ειδικός χειρισμός. </p>
</div>
`);

<div class="eyebrow" id="@queens-algo">Ενότητα 5 / 5 — N Queens</div>
<h1>Ο αλγόριθμος</h1>
<p class="lede"> Κάθε κλήση αναλαμβάνει μία μόνο σειρά: δοκιμάζει τις στήλες της με τη σειρά και αφήνει τις επόμενες σειρές στις αναδρομικές κλήσεις. Ένα γεμάτο <code>[]int</code> σημαίνει ότι βρέθηκε λύση, το <code>nil</code> σημαίνει ότι αυτό το branch δεν οδηγεί πουθενά. </p>

<pre><code class="lang-go">// SolveQueens fills every row from the given row downwards.
func SolveQueens(board []int, row int) []int {
    if row == len(board) {
        return board
    }

    for col := 0; col < len(board); col++ {
        if !isSafe(board, row, col) {
            continue // PRUNE
        }

        board[row] = col                       // 1. CHOOSE
        solution := SolveQueens(board, row+1)  // 2. EXPLORE (recursion)
        if solution != nil {
            return solution
        }
        board[row] = -1                        // 3. UN-CHOOSE (backtracking)
    }

    return nil
}</code></pre>
`);

<h1>Δες το να τρέχει</h1>
<p class="lede">Σκακιέρα 4×4. Πάτα βήμα-βήμα: κάθε χρώμα δείχνει αν μια βασίλισσα μπαίνει, απορρίπτεται, ή αφαιρείται όταν το branch αδιεξοδεύει.</p>

<p> Παρακολούθησε ιδίως το σημείο όπου η πρώτη βασίλισσα, αφού φαινόταν αθώα για πολλά βήματα, τελικά ακυρώνεται: χρειάζονται τέσσερα επίπεδα υποχώρησης για να αποδειχθεί λάθος επιλογή, ενώ από εκεί και μετά κάθε επόμενη γραμμή βρίσκει αμέσως έγκυρη στήλη.</p>
