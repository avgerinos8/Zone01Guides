    addContent(`
    <div class="eyebrow" id="@Ενότητα_1_HTTP_Βασικά">Ενότητα 1 — HTTP Βασικά</div>
    <h1>Τι είναι ένα REST API;</h1>
    <p class="lede">Πριν γράψουμε κώδικα, πρέπει να καταλάβουμε τι ακριβώς κάνουμε όταν «καλούμε ένα API».</p>

    <p>Ένα <strong>REST API</strong> (Application Programming Interface) είναι ένας τρόπος με τον οποίο δύο εφαρμογές επικοινωνούν μέσω του πρωτοκόλλου HTTP. Ο server εκθέτει <strong>endpoints</strong> (URLs) που ο client (π.χ. το πρόγραμμά μας στη Go) καλεί για να διαβάσει ή να στείλει δεδομένα.</p>

    <div class="grid2">
      <div class="card">
        <h3>HTTP Methods</h3>
        <ul>
          <li><strong>GET</strong> — Ανάκτηση δεδομένων (η πιο συχνή)</li>
          <li><strong>POST</strong> — Δημιουργία νέου πόρου</li>
          <li><strong>PUT</strong> — Πλήρης ενημέρωση πόρου</li>
          <li><strong>DELETE</strong> — Διαγραφή πόρου</li>
        </ul>
      </div>
      <div class="card">
        <h3>HTTP Status Codes</h3>
        <ul>
          <li><strong>200 OK</strong> — Όλα πήγαν καλά</li>
          <li><strong>404 Not Found</strong> — Το endpoint δεν υπάρχει</li>
          <li><strong>500 Internal Server Error</strong> — Σφάλμα στον server</li>
        </ul>
      </div>
    </div>

    <p>Σε αυτό το μάθημα θα εστιάσουμε σε <strong>GET</strong> αιτήματα που επιστρέφουν JSON δεδομένα.</p>

    <h2>Το βασικό pattern: http.Get + resp.Body</h2>
    <pre><code class="lang-go">// ── basic HTTP GET request ────────────────────────────────────────────────── ⊃

resp, err := http.Get("https://api.example.com/data")
if err != nil {
    return nil, err
}
defer resp.Body.Close() // απελευθέρωση πόρων

// Το resp.Body είναι ένα io.ReadCloser — μια ροή δεδομένων από το δίκτυο.</code></pre>

    <div class="callout"><span class="tag">Προσοχή:</span> Το <code>defer resp.Body.Close()</code> είναι <strong>υποχρεωτικό</strong>! Αν το ξεχάσεις, ο server θα κρατάει ανοιχτές συνδέσεις μέχρι να εξαντληθούν οι πόροι του συστήματος.</div>
    `);


    // ── Section 1: API Reading (io.ReadAll vs Decoder) ───────────────────── ⊃
    addContent(`
<div class="eyebrow">Ενότητα 2 — Ανάγνωση API: io.ReadAll vs json.NewDecoder</div>
<h1>Δύο τρόποι για ανάγνωση JSON από API</h1>
<p class="lede">Όταν καλούμε ένα HTTP API στη Go, τα δεδομένα επιστρέφουν ως stream στο <code>resp.Body</code>. Η Go προσφέρει δύο διαφορετικούς μηχανισμούς για την μετατροπή τους σε structs.</p>

<h2>1. Τρόπος A: io.ReadAll + json.Unmarshal (In-Memory)</h2>
<p>Διαβάζει <strong>όλο</strong> το σώμα της απάντησης στη μνήμη RAM ως <code>[]byte</code> slice και στη συνέχεια κάνει decode.</p>

<pre><code class="lang-go">// ReadAll loads the entire payload into RAM at once
resp, err := http.Get("https://api.example.com/data")
if err != nil { return nil, err }
defer resp.Body.Close()

body, err := io.ReadAll(resp.Body)
if err != nil { return nil, err }

var data []Item
err = json.Unmarshal(body, &data)</code></pre>

<h2>2. Τρόπος B: json.NewDecoder().Decode() (Streaming)</h2>
<p>Διαβάζει τα δεδομένα απευθείας από τη δικτυακή ροή (stream) και τα αποκωδικοποιεί <strong>κατευθείαν</strong> στο struct, χωρίς να αποθηκεύει το ενδιάμεσο raw JSON στη RAM.</p>

<pre><code class="lang-go">// NewDecoder streams data directly into the target struct
resp, err := http.Get("https://api.example.com/data")
if err != nil { return nil, err }
defer resp.Body.Close()

var data []Item
err = json.NewDecoder(resp.Body).Decode(&data)</code></pre>

<div class="grid2">
  <div class="card">
    <h3>io.ReadAll</h3>
    <p><strong>Πότε:</strong> Όταν θέλουμε να κάνουμε print το raw JSON string για debugging πριν το parse.</p>
  </div>
  <div class="card">
    <h3>json.NewDecoder</h3>
    <p><strong>Πότε:</strong> Η βέλτιστη πρακτική για παραγωγή (production). Πολύ πιο γρήγορο & αποδοτικό στη RAM.</p>
  </div>
</div>
`);

    // ── Section 2: Custom Template Functions ─────────────────────────────── ⊃
    addContent(`
<div class="eyebrow">Ενότητα 3 — Go Templates & Custom Functions (FuncMap)</div>
<h1>Διαμόρφωση HTML Templates</h1>
<p class="lede">Όταν θέλουμε να καλέσουμε δικές μας Go συναρτήσεις μέσα από ένα HTML template (π.χ. μετατροπή κειμένου σε κεφαλαία), η απλή <code>template.ParseFiles()</code> δεν αρκεί.</p>

<h2>1. Απλό Loading: template.ParseFiles()</h2>
<p>Δημιουργεί αυτόματα το template και φορτώνει το αρχείο. <strong>Δεν επιτρέπει</strong> την προσθήκη custom συναρτήσεων εκ των προτέρων.</p>

<pre><code class="lang-go">// Simple loading - custom functions will cause parse errors!
tmpl, err := template.ParseFiles("./templates/index.html")</code></pre>

<h2>2. Προσαρμοσμένο Loading: New() + Funcs() + ParseFiles()</h2>
<p>Επιτρέπει την εγγραφή ενός <code>FuncMap</code> <strong>πριν</strong> γίνει το parsing του αρχείου.</p>

<pre><code class="lang-go">// Advanced loading - registers custom functions FIRST
tmpl, err := template.New("index.html").
    Funcs(indexFuncMap()).
    ParseFiles("templates/index.html")</code></pre>

<div class="callout">
  <span class="tag">Προσοχή / Αυστηρή Σειρά!</span>
  Η μέθοδος <code>.Funcs()</code> πρέπει να καλεστεί <strong>υποχρεωτικά πριν</strong> την <code>.ParseFiles()</code>. Αν καλεστεί μετά, ο parser κατά την ανάγνωση του HTML δεν θα αναγνωρίσει τη συνάρτηση και το πρόγραμμα θα καταρρεύσει με error!
</div>
`);

    // ── Section 1.5: URL Query Parameters ─────────────────────────────────── ⊃
    addContent(`
<div class="eyebrow">Ενότητα 4 — Ανάγνωση URL Query Parameters</div>
<h1>Διαχείριση Αιτημάτων με το r.URL.Query()</h1>
<p class="lede">Όταν ο χρήστης επισκέπτεται ένα URL με παραμέτρους (π.χ. <code>/search?query=queen&amp;page=2</code>), η Go μας επιτρέπει να διαβάσουμε εύκολα αυτά τα δεδομένα μέσω της <code>r.URL.Query()</code>.</p>

<h2>1. Τι είναι το r.URL.Query();</h2>
<p>Η μέθοδος <code>r.URL.Query()</code> αναλύει το query string του URL και επιστρέφει έναν τύπο <code>url.Values</code> (που στην πραγματικότητα είναι ένα <code>map[string][]string</code>).</p>

<h2>2. Βασικές Μεθόδοι Ανάγνωσης</h2>
<pre><code class="lang-go">// ── query parameters parsing ─────────────────────────────────────────────── ⊃

// parsePagination extracts and validates the "page" query parameter from the request.
func parsePagination(r *http.Request) (int, error) {
	// Query parses the URL and returns a url.Values map
	queryParams := r.URL.Query()

	// Get retrieves the FIRST value associated with the key "page".
	// If the key does not exist, it returns an empty string "".
	pageStr := queryParams.Get("page")
	if pageStr == "" {
		return 1, nil // Default fallback page
	}

	// URL parameters are ALWAYS strings, so numeric conversion is required
	page, err := strconv.Atoi(pageStr)
	if err != nil {
		return 0, fmt.Errorf("invalid page number format: %w", err)
	}

	return page, nil
}</code></pre>

<div class="grid2">
  <div class="card">
    <h3>.Get("key")</h3>
    <p>Επιστρέφει τη **πρώτη** τιμή της παραμέτρου ως <code>string</code>. Αν η παράμετρος δεν υπάρχει στο URL, επιστρέφει κενό string (<code>""</code>).</p>
  </div>
  <div class="card">
    <h3>Πολλαπλές Τιμές (Slice)</h3>
    <p>Αν το URL έχει διπλότυπα keys (π.χ. <code>?tag=go&amp;tag=web</code>), αποκτούμε πρόσβαση σε όλες τις τιμές ως slice μέσω του map: <code>tags := r.URL.Query()["tag"]</code>.</p>
  </div>
</div>

<div class="callout">
  <span class="tag">Προσοχή: Τύποι Δεδομένων</span>
  Όλες οι τιμές που λαμβάνονται από το <code>r.URL.Query()</code> είναι <strong>πάντα strings</strong>! Πρέπει πάντα να κάνουμε μετατροπή τύπου (π.χ. <code>strconv.Atoi()</code> για ακέραιους, <code>strconv.ParseBool()</code> για boolean) και έλεγχο σφαλμάτων (Input Validation) πριν τις χρησιμοποιήσουμε.
</div>

<h2>2. Ποιος δημιουργεί το Query Endpoint και Πώς;</h2>
<p>Το query string στο URL (π.χ. <code>?query=metallica</code>) δημιουργείται <strong>αποκλειστικά στο Frontend (Browser)</strong> με δύο τρόπους:</p>

<div class="grid2">
  <div class="card">
    <h3>A. Αυτόματα μέσω HTML Form (GET Method)</h3>
    <p>Όταν μια φόρμα έχει <code>method="GET"</code>, ο browser συλλέγει τα <code>name</code> attributes των <code>&lt;input&gt;</code> και χτίζει αυτόματα το URL κατά το submit:</p>
    <pre><code class="lang-html">&lt;form action="/search" method="GET"&gt;
  &lt;input type="text" name="query" placeholder="Search..."&gt;
  &lt;button type="submit"&gt;Search&lt;/button&gt;
&lt;/form&gt;</code></pre>
  </div>
  <div class="card">
    <h3>B. Δυναμικά μέσω JavaScript (AJAX / Fetch)</h3>
    <p>Η JavaScript κατασκευάζει το URL κατά την πληκτρολόγηση (live search/suggestions) χρησιμοποιώντας τη συνάρτηση <code>encodeURIComponent()</code> για ασφαλή χαρακτήρες:</p>
    <pre><code class="lang-js">// ── frontend URL construction ────────────────────────────────────────────── ⊃

// fetchSearchResults builds the query string dynamically and sends an AJAX request.
async function fetchSearchResults(searchTerm) {
    const encodedQuery = encodeURIComponent(searchTerm);
    const response = await fetch(\`/suggestions?query=\${encodedQuery}\`);
    return await response.json();
}</code></pre>
  </div>
</div>

<div class="callout good">
  <span class="tag">Σύνοψη Ροής</span>
  Ο <b>Browser ή η JavaScript</b> φτιάχνει το URL με το query string (<code>?query=...</code>) &rarr; Ο <b>Go Server</b> το παραλαμβάνει στο <code>r.URL.Query().Get("query")</code> &rarr; Εκτελείται το filtering των δεδομένων.
</div>
`);

    // ── Section 3: Handler Factory Pattern (Closures) ─────────────────────── ⊃
    addContent(`
<div class="eyebrow">Ενότητα 6 — HTTP Routing & Closures</div>
<h1>Το Handler Factory Pattern (Dependency Injection)</h1>
<p class="lede">Η συνάρτηση <code>http.HandleFunc</code> απαιτεί αυστηρά ένα signature της μορφής <code>func(w http.ResponseWriter, r *http.Request)</code>. Πώς περνάμε λοιπόν εξωτερικά δεδομένα (π.χ. <code>artists</code>) χωρίς να χρησιμοποιήσουμε καθολικές (global) μεταβλητές;</p>

<h2>Η Λύση: Higher-Order Functions & Closures</h2>
<p>Δημιουργούμε μια συνάρτηση "wrapper" (Factory) που δέχεται τα δεδομένα μας ως ορίσματα και <strong>επιστρέφει</strong> μια ανώνυμη συνάρτηση <code>http.HandlerFunc</code>. Η εσωτερική αυτή συνάρτηση "θυμάται" τα δεδομένα χάρη στον μηχανισμό των **closures**.</p>

<pre><code class="lang-go">// ── handler factory pattern ──────────────────────────────────────────────── ⊃

// Handler returns an http.HandlerFunc closure that retains access
// to the injected artists and locations slices without global state.
func Handler(artists []Artist, locations []Location) http.HandlerFunc {
	// The outer function finishes, but the inner closure keeps reference
	// to artists and locations in its scope environment.
	return func(w http.ResponseWriter, r *http.Request) {
		if r.URL.Path != "/" {
			ErrorHandler(w, "Invalid path", http.StatusNotFound)
			return
		}
		// Accessing artists and locations directly here!
		fmt.Fprintf(w, "Total artists available: %d", len(artists))
	}
}</code></pre>

<div class="grid2">
  <div class="card">
    <h3>Γιατί αποφεύγουμε τα Globals;</h3>
    <p>Τα global variables καθιστούν τον κώδικα δύσκολο στη συντήρηση, μη ασφαλή σε παράλληλα requests (race conditions) και αδύνατον να ελεγχθεί με unit tests.</p>
  </div>
  <div class="card">
    <h3>Πώς δουλεύει το Factory;</h3>
    <p>Όταν καλούμε <code>Handler(artists, locations)</code>, το αποτέλεσμα της κλήσης είναι η ίδια η συνάρτηση <code>http.HandlerFunc</code> έτοιμη να καταχωρηθεί στο <code>mux</code>.</p>
  </div>
</div>
`);

    // ── Section 4: Pagination & Unique Data Logic ──────────────────────────── ⊃
    addContent(`
<div class="eyebrow">Ενότητα 7 — Pagination & Data Processing</div>
<h1>Σελιδοποίηση & Απομάκρυνση Διπλότυπων (Deduplication)</h1>
<p class="lede">Μέσα στο <code>Handler</code> βλέπουμε δύο πολύ συνηθισμένους αλγόριθμους: τον τεμαχισμό δεδομένων σε σελίδες (Pagination) και την εύρεση μοναδικών τιμών με <code>map</code>.</p>

<h2>1. Υπολογισμός Page Slices</h2>
<p>Μετατρέπουμε το <code>page</code> query parameter σε ακέραιο και υπολογίζουμε τα όρια <code>start</code> και <code>end</code> για να πάρουμε το σωστό sub-slice των δεδομένων μας.</p>

<pre><code class="lang-go">// ── pagination calculation ───────────────────────────────────────────────── ⊃

// Calculate slice boundaries for the requested page
start := (currentPage - 1) * pageSize
end := start + pageSize

if end > len(artists) {
	end = len(artists)
}

// Pass only the sliced range to the template
pageData.Artists = artists[start:end]</code></pre>

<h2>2. Deduplication με Map (Unique Values)</h2>
<p>Για να πάρουμε μια λίστα από τοποθεσίες χωρίς διπλότυπα, χρησιμοποιούμε ένα <code>map[string]bool</code> ως "set". Αν η τοποθεσία υπάρχει ήδη στο map, την προσπερνάμε με <code>continue</code>.</p>

<pre><code class="lang-go">// ── location deduplication ───────────────────────────────────────────────── ⊃

theListOfLocations := []string{}
seenLocations := make(map[string]bool)

for _, locationGroup := range locations {
	for _, loc := range locationGroup.Locations {
		if seenLocations[loc] {
			continue // Skip duplicate entry
		}
		seenLocations[loc] = true
		theListOfLocations = append(theListOfLocations, loc)
	}
}</code></pre>
`);

    // ── Section 5: JSON Streaming, Headers & Frontend AJAX ───────────────── ⊃
    addContent(`
<div class="eyebrow">Ενότητα 8 — JSON Streaming, Headers & Frontend AJAX</div>
<h1>HTTP Headers, JSON Streaming & JS Fetch</h1>
<p class="lede">Πώς επικοινωνεί η Go με το Frontend μέσω JSON, πώς ρυθμίζουμε τα HTTP Headers και πώς καταναλώνουμε τα δεδομένα στην JavaScript.</p>

<h2>1. w.Header() vs w.WriteHeader()</h2>
<p>Η <code>http.ResponseWriter</code> παρέχει δύο ξεχωριστούς μηχανισμούς για τον έλεγχο της απάντησης:</p>

<ul>
  <li><code>w.Header()</code>: Επιστρέφει το <code>http.Header</code> (ένα map από headers). Πάνω σε αυτό καλούμε τη μέθοδο <code>.Set(key, value)</code> για να προσθέσουμε ή να αλλάξουμε headers.</li>
  <li><code>w.WriteHeader(statusCode)</code>: Στέλνει τον HTTP κωδικό κατάστασης (π.χ. <code>200 OK</code>, <code>404 Not Found</code>, <code>500 InternalServerError</code>).</li>
</ul>

<div class="callout">
  <span class="tag">Προσοχή στη Σειρά</span>
  Όλες οι κλήσεις <code>w.Header().Set(...)</code> πρέπει να γίνονται <strong>ΠΡΙΝ</strong> τις <code>w.WriteHeader()</code>, <code>json.NewEncoder(w).Encode()</code> ή <code>w.Write()</code>. Μόλις γραφτεί το πρώτο byte στο network stream, τα headers "κλειδώνουν" και δεν μεταβάλλονται!
</div>

<h2>2. Τι πετυχαίνουμε με το w.Header().Set() &amp; Δημοφιλή Content-Types</h2>
<p>Με το <code>w.Header().Set(key, value)</code> ενημερώνουμε τον browser για τη φύση των δεδομένων, τους κανόνες ασφαλείας και το caching:</p>

<div class="grid2">
  <div class="card">
    <h3>Συχνά Content-Types</h3>
    <ul>
      <li><code>application/json</code> (JSON APIs / AJAX responses)</li>
      <li><code>text/html; charset=utf-8</code> (HTML σελίδες)</li>
      <li><code>text/css</code> &amp; <code>text/javascript</code> (Static assets)</li>
      <li><code>multipart/form-data</code> (Upload αρχείων)</li>
      <li><code>application/x-www-form-urlencoded</code> (Απλές HTML φόρμες)</li>
    </ul>
  </div>
  <div class="card">
    <h3>Άλλες Χρήσεις του .Set()</h3>
    <ul>
      <li><strong>CORS:</strong> <code>Access-Control-Allow-Origin: *</code></li>
      <li><strong>Caching:</strong> <code>Cache-Control: no-cache</code></li>
      <li><strong>Redirects:</strong> <code>Location: /login</code> (μαζί με 302 status)</li>
      <li><strong>Security:</strong> <code>X-Content-Type-Options: nosniff</code></li>
    </ul>
  </div>
</div>

<h2>3. JSON Streaming: Encoder vs Decoder</h2>
<p>Το <strong>JSON Streaming</strong> σημαίνει ότι γράφουμε ή διαβάζουμε δεδομένα απευθείας από τη δικτυακή ροή (stream), παρακάμπτοντας την προσωρινή αποθήκευση intermediate <code>[]byte</code> στη μνήμη RAM.</p>

<pre><code class="lang-go">// ── streaming encoder & decoder ───────────────────────────────────────────── ⊃

// Encode: Go Struct -> JSON Stream (Output)
// Serializes Go structs and streams bytes directly into the HTTP response stream (w).
err := json.NewEncoder(w).Encode(matches)

// Decode: JSON Stream -> Go Struct (Input)
// Reads JSON bytes straight from the HTTP request body stream (r.Body) into a Go struct pointer.
err := json.NewDecoder(r.Body).Decode(&amp;incomingData)</code></pre>

<h2>4. Παράλληλος Κώδικας σε JavaScript (Frontend AJAX)</h2>
<p>Όταν το Go backend στέλνει JSON με <code>Content-Type: application/json</code>, η JavaScript στο frontend (browser) χρησιμοποιεί το <code>fetch()</code> API για ασύγχρονη λήψη δεδομένων χωρίς reload της σελίδας:</p>

<pre><code class="lang-js">// ── frontend ajax fetch ──────────────────────────────────────────────────── ⊃

// fetchSuggestions makes an asynchronous HTTP request to the Go backend
// and automatically parses the streamed JSON response.
async function fetchSuggestions(query) {
    try {
        const response = await fetch(\`/suggestions?query=\${encodeURIComponent(query)}\`);
        
        if (!response.ok) {
            throw new Error(\`HTTP error! Status: \${response.status}\`);
        }
        
        // Parsed directly from the streamed application/json response
        const artists = await response.json();
        console.log("Suggestions received:", artists);
    } catch (err) {
        console.error("Failed to fetch suggestions:", err);
    }
}</code></pre>

<div class="callout good">
  <span class="tag">Σύνοψη</span>
  Η Go προετοιμάζει τα Headers (<code>w.Header().Set</code>), κάνει stream τα δεδομένα (<code>json.NewEncoder(w).Encode</code>), και η JavaScript στο frontend τα καταναλώνει ασύγχρονα με <code>await response.json()</code>.
</div>
`);

    // ── Section 6: Environment Variables & Custom HTTP Server ─────────────── ⊃
    addContent(`
<div class="eyebrow">Ενότητα 9 — Environment Variables &amp; Custom HTTP Server</div>
<h1>Production Server Setup &amp; Timeouts στη Go</h1>
<p class="lede">Γιατί η απλή <code>http.ListenAndServe(":8080", mux)</code> είναι επικίνδυνη για παραγωγή (production) και πώς ρυθμίζουμε σωστά έναν <code>http.Server</code> με Timeouts και Environment Variables.</p>

<h2>1. Δυναμικό Port μέσω Environment Variables</h2>
<p>Σε περιβάλλοντα deployment (Docker, Cloud Providers όπως Render/Heroku), το port ορίζεται δυναμικά από το περιβάλλον εκτέλεσης. Χρησιμοποιούμε την <code>os.Getenv()</code> με fallback τιμή (default):</p>

<pre><code class="lang-go">// ── dynamic port resolution ──────────────────────────────────────────────── ⊃

// Read environment port or fallback to default 8080
port := os.Getenv("PORT")
if port == "" {
	port = "8080"
}</code></pre>

<h2>2. Γιατί Χρειάζεται Custom http.Server Pointer;</h2>
<p>Η βασική συνάρτηση <code>http.ListenAndServe</code> δεν θέτει κανένα χρονικό όριο (timeout). Αν ένας client συνδεθεί και σταματήσει να στέλνει δεδομένα, ο server θα κρατήσει τη σύνδεση ανοιχτή <strong>για πάντα</strong>, εξαντλώντας τη μνήμη RAM του συστήματος.</p>

<pre><code class="lang-go">// ── custom HTTP server configuration ──────────────────────────────────────── ⊃

// Configure custom server timeouts to safeguard against slow clients and DDoS attacks
server := &amp;http.Server{
	Addr:              ":" + port,         // Listening TCP address
	Handler:           mux,                // Root router (ServeMux)
	ReadTimeout:       5 * time.Second,    // Max duration for reading entire request body
	ReadHeaderTimeout: 2 * time.Second,    // Max duration for reading request headers
	WriteTimeout:      10 * time.Second,   // Max duration for writing the response
	IdleTimeout:       120 * time.Second,  // Keep-alive connection wait duration
	MaxHeaderBytes:    1 &lt;&lt; 20,            // Limit request headers to 1 MB (Bitwise Shift)
}

// Start server with configured settings
err := server.ListenAndServe()</code></pre>

<h2>3. Αναλυτική Εξήγηση Παραμέτρων Ασφαλείας</h2>
<div class="grid2">
  <div class="card">
    <h3>ReadHeaderTimeout (Slowloris Protection)</h3>
    <p>Προστατεύει από <strong>Slowloris DDoS attacks</strong>, όπου ο επιτιθέμενος στέλνει τα headers πάρα πολύ αργά για να δεσμεύσει sockets. Όριο: 2 δευτερόλεπτα.</p>
  </div>
  <div class="card">
    <h3>MaxHeaderBytes (Bitwise Shift: 1 &lt;&lt; 20)</h3>
    <p>Η έκφραση <code>1 &lt;&lt; 20</code> μετατοπίζει το bit κατά 20 θέσεις αριστερά: $1 \times 2^{20} = 1.048.576\text{ bytes}$ (**1 MB**). Αποτρέπει επιθέσεις εξάντλησης RAM μέσω τεράστιων headers.</p>
  </div>
</div>

<div class="grid2" style="margin-top:16px;">
  <div class="card">
    <h3>Read &amp; Write Timeouts</h3>
    <p><code>ReadTimeout</code>: Συνολικός χρόνος ανάγνωσης request body (5s).<br><code>WriteTimeout</code>: Συνολικός χρόνος για να απαντήσει ο server (10s).</p>
  </div>
  <div class="card">
    <h3>IdleTimeout</h3>
    <p>Χρόνος αναμονής για το επόμενο request σε σύνδεση Keep-Alive (120s) πριν την αποδέσμευση του TCP socket.</p>
  </div>
</div>

<div class="callout good">
  <span class="tag">Production Tip</span>
  Ένας production-ready HTTP server στη Go πρέπει <strong>πάντα</strong> να ορίζει ρητά <code>ReadHeaderTimeout</code> και <code>WriteTimeout</code>!
</div>
`);
    addContent(`
<div class="eyebrow">Μίνι Γλωσσάρι — Ενότητα 10</div>
<h1>Όροι & Έννοιες για JSON Streaming, Headers & Frontend AJAX</h1>
<p class="lede">Γρήγορη αναφορά στους βασικούς όρους που καλύπτονται στην ενότητα της επικοινωνίας Go ↔ Frontend μέσω JSON.</p>

<div class="glossary-group">
  <h2>HTTP Response Writer & Headers</h2>
  <table class="glossary-table">
    <tr><td class="gt-term">w.Header()</td><td class="gt-def">Επιστρέφει το map των HTTP headers. Χρησιμοποιούμε <code>.Set(key, value)</code> για να προσθέσουμε/αλλάξουμε headers πριν την αποστολή της απάντησης.</td></tr>
    <tr><td class="gt-term">w.WriteHeader(statusCode)</td><td class="gt-def">Στέλνει τον HTTP κωδικό κατάστασης (π.χ. 200, 404). Πρέπει να καλείται <strong>μετά</strong> τα <code>w.Header().Set()</code> και <strong>πριν</strong> την εγγραφή του body.</td></tr>
    <tr><td class="gt-term">Content-Type header</td><td class="gt-def">Ενημερώνει τον browser για τον τύπο των δεδομένων. Κοινά: <code>application/json</code>, <code>text/html</code>, <code>text/css</code>.</td></tr>
    <tr><td class="gt-term">Access-Control-Allow-Origin</td><td class="gt-def">Header CORS που επιτρέπει σε σελίδες από άλλα domains να καλούν το API μας. Στο παράδειγμα: <code>*</code> (οποιοδήποτε) ή συγκεκριμένο domain.</td></tr>
    <tr><td class="gt-term">Cache-Control</td><td class="gt-def">Ελέγχει το caching στον browser. Π.χ. <code>no-cache, no-store</code> για αποφυγή αποθήκευσης ευαίσθητων δεδομένων.</td></tr>
    <tr><td class="gt-term">Location</td><td class="gt-def">Header που χρησιμοποιείται σε redirects, μαζί με status 3xx (π.χ. 302 Found).</td></tr>
    <tr><td class="gt-term">X-Content-Type-Options: nosniff</td><td class="gt-def">Αποτρέπει τον browser από το να μαντέψει τον MIME τύπο, μειώνοντας τον κίνδυνο επιθέσεων.</td></tr>
  </table>
</div>

<div class="glossary-group">
  <h2>JSON Streaming (Encoder / Decoder)</h2>
  <table class="glossary-table">
    <tr><td class="gt-term">json.NewEncoder(w)</td><td class="gt-def">Δημιουργεί έναν encoder που γράφει JSON απευθείας στο <code>http.ResponseWriter</code> (stream output). Χρησιμοποιούμε <code>.Encode(v)</code> για σειριοποίηση.</td></tr>
    <tr><td class="gt-term">json.NewDecoder(r.Body)</td><td class="gt-def">Δημιουργεί έναν decoder που διαβάζει JSON απευθείας από το <code>http.Request.Body</code> (stream input). Χρησιμοποιούμε <code>.Decode(&v)</code> για αποσειριοποίηση.</td></tr>
    <tr><td class="gt-term">JSON Streaming</td><td class="gt-def">Η τεχνική της ανάγνωσης/εγγραφής JSON δεδομένων χωρίς να αποθηκεύεται ολόκληρο το payload στη RAM, επεξεργάζοντας τα δεδομένα σταδιακά (stream).</td></tr>
  </table>
</div>

<div class="glossary-group">
  <h2>Frontend JavaScript (Fetch API)</h2>
  <table class="glossary-table">
    <tr><td class="gt-term">fetch(url)</td><td class="gt-def">Η ενσωματωμένη JavaScript συνάρτηση για ασύγχρονα HTTP requests. Επιστρέφει ένα Promise που επιλύεται σε αντικείμενο <code>Response</code>.</td></tr>
    <tr><td class="gt-term">response.ok</td><td class="gt-def">Boolean που δείχνει αν το status code είναι 200-299 (επιτυχία). Χρησιμοποιείται για έλεγχο σφαλμάτων.</td></tr>
    <tr><td class="gt-term">response.json()</td><td class="gt-def">Μέθοδος που διαβάζει το body stream και το μετατρέπει σε JavaScript object (ή array). Επιστρέφει Promise, γι' αυτό χρησιμοποιούμε <code>await</code>.</td></tr>
    <tr><td class="gt-term">encodeURIComponent()</td><td class="gt-def">Συνάρτηση που κωδικοποιεί ειδικούς χαρακτήρες (π.χ. κενά, &, #) ώστε να είναι έγκυροι σε ένα query string URL.</td></tr>
  </table>
</div>

<div class="callout good">
  <span class="tag">Σύνοψη</span>
  Η Go ρυθμίζει headers με <code>w.Header().Set</code>, στέλνει JSON με <code>json.NewEncoder(w).Encode</code>, και η JavaScript το καταναλώνει με <code>fetch</code> και <code>response.json()</code>, όλα σε ένα ασύγχρονο, streaming μοντέλο.
</div>
`);

    addContent(`
    <div class="eyebrow" id="@Ενότητα_11_Ασφάλεια_Εισαγωγή">Ενότητα 11 — Defense in Depth: Εισαγωγή</div>
    <h1>Πλήρης Οδηγός Ασφαλείας Web Εφαρμογών στη Go</h1>
    <p class="lede">Η ασφάλεια απαιτεί πολλαπλά επίπεδα προστασίας (Defense in Depth). Κάθε επίπεδο μειώνει τον κίνδυνο, ακόμα και αν κάποιο άλλο αποτύχει.</p>

    <p>Οι σύγχρονες web εφαρμογές αντιμετωπίζουν ένα ευρύ φάσμα απειλών. Σε αυτή την ενότητα θα καλύψουμε τις πιο κρίσιμες ευπάθειες και πώς να τις αντιμετωπίσουμε στη Go (2026).</p>

    <div class="grid2">

        <h3>Οι 5 πιο συχνές ευπάθειες (OWASP Top 10)</h3>
        <ul>
          <li><strong>XSS</strong> — Cross‑Site Scripting</li>
          <li><strong>CSRF</strong> — Cross‑Site Request Forgery</li>
          <li><strong>SQL Injection</strong></li>

      <div class="card">
        <h3>Βασικές αρχές ασφαλούς ανάπτυξης</h3>

          <li><strong>Validate everything</strong> — εισερχόμενα δεδομένα</li>

    // ─── SECTION 12: XSS ──────────────────────────────────────────────────────
    addContent(`
    <div class="eyebrow" id="@Ενότητα_12_XSS">Ενότητα 12 — XSS (Cross‑Site Scripting)</div>
    <h1>XSS: Τι είναι και πώς το αποτρέπουμε στη Go</h1>
    <p class="lede">Το Cross‑Site Scripting (XSS) επιτρέπει σε έναν εισβολέα να εισάγει κακόβουλο JavaScript σε μια ιστοσελίδα που προβάλλεται από άλλους χρήστες.</p>

    <h2>Πώς λειτουργεί μια XSS επίθεση;</h2>
    <p>Ένας εισβολέας υποβάλλει ένα σχόλιο που περιέχει <code>&lt;script&gt;alert('XSS')&lt;/script&gt;</code>. Αν το backend το εμφανίσει χωρίς escaping, το script εκτελείται στον browser κάθε επισκέπτη.</p>

    <div class="grid2">
      <div class="card">
        <h3>Ευάλωτος κώδικας (ΠΟΤΕ ΜΗΝ ΤΟ ΚΑΝΕΙΣ)</h3>
        <pre><code class="lang-go">// Χρησιμοποιώντας text/template ή string concatenation
var comment string = "&lt;script&gt;alert('XSS')&lt;/script&gt;"
fmt.Fprintf(w, "&lt;p&gt;%s&lt;/p&gt;", comment) // DANGER!</code></pre>
      </div>
      <div class="card">
        <h3>Ασφαλής κώδικας (html/template)</h3>
        <pre><code class="lang-go">// Χρησιμοποιούμε html/template που κάνει escaping
tmpl := template.Must(template.New("").Parse("&lt;p&gt;{{.}}&lt;/p&gt;"))
tmpl.Execute(w, comment) // &lt;p&gt;&lt;script&gt;...&lt;/script&gt;&lt;/p&gt;</code></pre>
      </div>
    </div>

    <h2>Επιπλέον προστασία: Content Security Policy (CSP)</h2>
    <p>Το CSP είναι ένα header που περιορίζει τις πηγές από τις οποίες μπορεί να φορτωθεί JavaScript.</p>
    <pre><code class="lang-go">w.Header().Set("Content-Security-Policy",
    "default-src 'self'; script-src 'self' https://trusted.cdn.com;")
</code></pre>

    <div class="callout good"><span class="tag">Σύνοψη:</span> Χρησιμοποιούμε <strong>πάντα</strong> το <code>html/template</code> για απόδοση HTML και προσθέτουμε <strong>CSP</strong> headers για επιπλέον άμυνα.</div>
    `);



    // ─── SECTION 13: CSRF ──────────────────────────────────────────────────────
    addContent(`
    <div class="eyebrow" id="@Ενότητα_13_CSRF">Ενότητα 13 — CSRF (Cross‑Site Request Forgery)</div>
    <h1>CSRF: Προστασία από μη εξουσιοδοτημένες ενέργειες</h1>
    <p class="lede">Το CSRF εξαναγκάζει έναν πιστοποιημένο χρήστη να εκτελέσει μια ανεπιθύμητη ενέργεια σε μια web εφαρμογή, χωρίς τη συγκατάθεσή του.</p>

    <h2>Πώς λειτουργεί;</h2>
    <p>Ένας κακόβουλος ιστότοπος στέλνει ένα POST request στο bank.com/transfer με τα στοιχεία του χρήστη, εκμεταλλευόμενος το session cookie του θύματος.</p>

    <h2>Προστασία: CSRF Tokens</h2>
    <p>Ενσωματώνουμε ένα μυστικό token σε κάθε φόρμα και το επαληθεύουμε στον server. Έτσι, ένας επιτιθέμενος δεν μπορεί να πλαστογραφήσει το αίτημα χωρίς το token.</p>

    <pre><code class="lang-go">// ── CSRF protection with gorilla/csrf ─────────────────────────────────────── ⊃

import "github.com/gorilla/csrf"

// Middleware
csrfMiddleware := csrf.Protect(
    []byte("32-byte-long-secret-key"),
    csrf.Secure(true),   // only over HTTPS
)

// Στη φόρμα HTML: {{ .csrfField }}
// Στη Go handler: r.ParseForm() και έλεγχος γίνεται αυτόματα από το middleware.</code></pre>

    <div class="callout"><span class="tag">Σημείωση:</span> Για APIs που χρησιμοποιούνται από frontend frameworks, χρησιμοποιούμε tokens που αποστέλλονται σε headers (π.χ. <code>X-CSRF-Token</code>).</div>
    `);


    // ─── SECTION 14: SQL Injection ────────────────────────────────────────────
    addContent(`
    <div class="eyebrow" id="@Ενότητα_14_SQL_Injection">Ενότητα 14 — SQL Injection</div>
    <h1>SQL Injection: Παραμετροποιημένα Queries με database/sql</h1>
    <p class="lede">Η SQL Injection συμβαίνει όταν ο χρήστης εισάγει κακόβουλο SQL κώδικα μέσω μιας φόρμας, που εκτελείται στη βάση δεδομένων.</p>

    <h2>Παράδειγμα ευάλωτου κώδικα (ΠΟΤΕ)</h2>
    <pre><code class="lang-go">// DANGER: string concatenation
query := "SELECT * FROM users WHERE name = '" + userName + "'"
rows, err := db.Query(query) // Αν userName = "'; DROP TABLE users; --" → disaster</code></pre>

    <h2>Σωστός τρόπος: Parameterized Queries</h2>
    <pre><code class="lang-go">// ── safe parameterized query ───────────────────────────────────────────────── ⊃

var user User
err := db.QueryRow(
    "SELECT id, name, email FROM users WHERE name = $1",
    userName,
).Scan(&amp;user.ID, &amp;user.Name, &amp;user.Email)</code></pre>

    <p>Η Go βιβλιοθήκη <code>database/sql</code> υποστηρίζει placeholders (<code>$1</code>, <code>?</code> ανάλογα με τη βάση). Το driver φροντίζει για το escaping.</p>

    <div class="callout good"><span class="tag">Χρυσός κανόνας:</span> Ποτέ μη φτιάχνεις SQL queries με concatenation! Πάντα χρησιμοποίησε parameterized queries ή ORM (π.χ. GORM) που τα κάνει αυτόματα.</div>
    `);



    // ─── SECTION 15: Path Traversal ──────────────────────────────────────────
    addContent(`
    <div class="eyebrow" id="@Ενότητα_15_Path_Traversal">Ενότητα 15 — Path Traversal</div>
    <h1>Path Traversal: Αποτροπή πρόσβασης σε αρχεία εκτός φακέλου</h1>
    <p class="lede">Η ευπάθεια Path Traversal επιτρέπει σε έναν επιτιθέμενο να διαβάσει αρχεία εκτός του επιτρεπόμενου φακέλου, χρησιμοποιώντας <code>../</code>.</p>

    <h2>Παράδειγμα ευάλωτου κώδικα</h2>
    <pre><code class="lang-go">// DANGER: ο χρήστης μπορεί να στείλει "../../etc/passwd"
file, err := os.Open("/var/www/static/" + userFilename)</code></pre>

    <h2>Σωστή προστασία</h2>
    <ul>
      <li>Χρησιμοποιούμε <code>filepath.Clean()</code> για να αφαιρέσουμε τα <code>../</code>.</li>
      <li>Ελέγχουμε ότι το τελικό μονοπάτι βρίσκεται μέσα στον επιτρεπόμενο φάκελο.</li>
    </ul>

    <pre><code class="lang-go">// ── safe file access ──────────────────────────────────────────────────────── ⊃

func serveFile(w http.ResponseWriter, r *http.Request) {
    baseDir := "./static"
    requested := r.URL.Path[len("/files/"):]

    // Clean the path to remove ".."
    cleanPath := filepath.Clean(requested)
    fullPath := filepath.Join(baseDir, cleanPath)

    // Verify that the resolved path is inside baseDir
    if !strings.HasPrefix(fullPath, filepath.Clean(baseDir)+string(os.PathSeparator)) {
        http.Error(w, "Forbidden", http.StatusForbidden)
        return
    }
    http.ServeFile(w, r, fullPath)
}</code></pre>

    <div class="callout"><span class="tag">Συχνό λάθος:</span> Να εμπιστεύεστε το <code>filepath.Clean</code> μόνο του. Πάντα να επαληθεύετε ότι το αποτέλεσμα βρίσκεται εντός του επιτρεπόμενου φακέλου.</div>
    `);



    // ─── SECTION 16: Rate Limiting ───────────────────────────────────────────
    addContent(`
    <div class="eyebrow" id="@Ενότητα_16_Rate_Limiting">Ενότητα 16 — Rate Limiting</div>
    <h1>Rate Limiting: Προστασία από brute‑force και DoS</h1>
    <p class="lede">Το Rate Limiting περιορίζει τον αριθμό των requests από μια IP σε ένα χρονικό διάστημα, αποτρέποντας επιθέσεις brute‑force και DoS.</p>

    <h2>Υλοποίηση με golang.org/x/time/rate</h2>
    <pre><code class="lang-go">import "golang.org/x/time/rate"

// ── rate limiter middleware ────────────────────────────────────────────────── ⊃

func rateLimitMiddleware(next http.Handler) http.Handler {
    // 10 requests per second, burst up to 20
    limiter := rate.NewLimiter(10, 20)
    return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
        if !limiter.Allow() {
            http.Error(w, "Too many requests", http.StatusTooManyRequests)
            return
        }
        next.ServeHTTP(w, r)
    })
}</code></pre>

    <p>Για πιο προχωρημένη λογική (ανά IP, sliding window) μπορούμε να χρησιμοποιήσουμε βιβλιοθήκες όπως <code>github.com/didip/tollbooth</code>.</p>

    <div class="callout good"><span class="tag">Πρακτική συμβουλή:</span> Εφάρμοσε rate limiting σε endpoints που είναι ευάλωτα (π.χ. login, registration, API search).</div>
    `);

    addContent(`
    <div class="eyebrow" id="@Ενότητα_17_Security_Headers">Ενότητα 17 — Security Headers</div>
    <h1>HTTP Security Headers: Ενισχύοντας την άμυνα</h1>
    <p class="lede">Τα security headers δίνουν εντολές στον browser για το πώς να συμπεριφέρεται, αποτρέποντας πολλές επιθέσεις.</p>

    <div class="grid2">
      <div class="card">
        <h3>HSTS (HTTP Strict Transport Security)</h3>
        <p>Επιβάλλει τη χρήση HTTPS για όλες τις μελλοντικές συνδέσεις.</p>
        <pre><code class="lang-go">w.Header().Set("Strict-Transport-Security",
    "max-age=31536000; includeSubDomains; preload")</code></pre>
      </div>
      <div class="card">
        <h3>X‑Frame‑Options</h3>
        <p>Αποτρέπει το clickjacking, μην επιτρέποντας embedding σε frames.</p>
        <pre><code class="lang-go">w.Header().Set("X-Frame-Options", "SAMEORIGIN")</code></pre>
      </div>
    </div>
    <div class="grid2">
      <div class="card">
        <h3>Content‑Type‑Options</h3>
        <p>Αποτρέπει τον browser να κάνει MIME sniffing.</p>
        <pre><code class="lang-go">w.Header().Set("X-Content-Type-Options", "nosniff")</code></pre>
      </div>
      <div class="card">
        <h3>Referrer‑Policy</h3>
        <p>Ελέγχει πόσες πληροφορίες αποστέλλονται στο header Referer.</p>
        <pre><code class="lang-go">w.Header().Set("Referrer-Policy", "strict-origin-when-cross-origin")</code></pre>
      </div>
    </div>

    <h2>Ολοκληρωμένο middleware για security headers</h2>
    <pre><code class="lang-go">// ── security headers middleware ───────────────────────────────────────────── ⊃

func securityHeadersMiddleware(next http.Handler) http.Handler {
    return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
        w.Header().Set("Strict-Transport-Security", "max-age=31536000; includeSubDomains")
        w.Header().Set("X-Frame-Options", "SAMEORIGIN")
        w.Header().Set("X-Content-Type-Options", "nosniff")
        w.Header().Set("Referrer-Policy", "strict-origin-when-cross-origin")
        // CSP μπορεί να προστεθεί ανάλογα
        next.ServeHTTP(w, r)
    })
}</code></pre>

    <div class="callout good"><span class="tag">Σύνοψη:</span> Πρόσθεσε αυτά τα headers σε όλες τις απαντήσεις σου για να ενισχύσεις την ασφάλεια χωρίς επιπλέον κόστος.</div>
    `);

    <h1>Διαχείριση Μυστικών και Ασφάλεια Container</h1>
    <p class="lede">Ποτέ μην αποθηκεύεις API keys, κωδικούς βάσης ή άλλα μυστικά στον κώδικα. Χρησιμοποίησε περιβαλλοντικές μεταβλητές και Docker security practices.</p>

if apiKey == "" {

    <pre><code class="lang-docker">FROM golang:1.21-alpine

...
</code></pre>

    <div class="eyebrow" id="@Ενότητα_19_Complete_Secure_App">Ενότητα 19 — Ολοκληρωμένο Ασφαλές Web App</div>
    <h1>Πλήρης υλοποίηση με όλα τα παραπάνω</h1>
    <p class="lede">Ακολουθεί ένα ολοκληρωμένο main.go που συνδυάζει όλες τις τεχνικές ασφαλείας που μάθαμε.</p>

    <pre><code class="lang-go">// ── main.go (production‑ready, secure) ────────────────────────────────────── ⊃

package main

import (
    "context"
    "log"
    "net/http"
    "os"
    "os/signal"
    "time"

    "github.com/gorilla/csrf"
    "golang.org/x/time/rate"
)

func main() {
    // 1. Environment
    port := os.Getenv("PORT")
    if port == "" { port = "8080" }

    // 2. Router
    mux := http.NewServeMux()
    mux.HandleFunc("/", homeHandler)
    mux.HandleFunc("/api/data", apiHandler)

    // 3. Middleware stack (order matters!)
    handler := securityHeadersMiddleware(mux)       // Headers
    handler = csrf.Protect([]byte("32-byte-secret"))(handler) // CSRF
    handler = rateLimitMiddleware(handler)          // Rate limit
    // (add logging, recovery, etc.)

    // 4. Server with timeouts
    srv := &amp;http.Server{
        Addr:              ":" + port,
        Handler:           handler,
        ReadTimeout:       5 * time.Second,
        ReadHeaderTimeout: 2 * time.Second,
        WriteTimeout:      10 * time.Second,
        IdleTimeout:       120 * time.Second,
        MaxHeaderBytes:    1 &lt;&lt; 20,
    }

    // 5. Graceful shutdown
    go func() {
        if err := srv.ListenAndServe(); err != http.ErrServerClosed {
            log.Fatalf("listen: %s\n", err)
        }
    }()
    log.Printf("Server running on port %s", port)

    c := make(chan os.Signal, 1)
    signal.Notify(c, os.Interrupt)
    &lt;-c
    ctx, cancel := context.WithTimeout(context.Background(), 5*time.Second)
    defer cancel()
    srv.Shutdown(ctx)
    log.Println("Server gracefully stopped")
}

// Middleware functions (as defined in previous slides)
func securityHeadersMiddleware(next http.Handler) http.Handler { ... }
func rateLimitMiddleware(next http.Handler) http.Handler { ... }
// Handlers...
</code></pre>

    <div class="callout good"><span class="tag">Σύνοψη:</span> Αυτό το boilerplate είναι έτοιμο για production. Προσθέτει timeouts, rate limiting, CSRF, security headers, και graceful shutdown.</div>
    `);
