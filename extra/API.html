<div class="eyebrow">Ενότητα 1 / 2 — Ανάγνωση API: io.ReadAll vs json.NewDecoder</div>
<h1>Δύο τρόποι για ανάγνωση JSON από API</h1>
<p class="lede">Όταν καλούμε ένα HTTP API στη Go, τα δεδομένα επιστρέφουν ως stream στο <code>resp.Body</code>. Η Go προσφέρει δύο διαφορετικούς μηχανισμούς για την μετατροπή τους σε structs.</p>

<h2>1. Τρόπος A: io.ReadAll + json.Unmarshal (In-Memory)</h2>
<p>Διαβάζει <strong>όλο</strong> το σώμα της απάντησης στη μνήμη RAM ως <code>[]byte</code> slice και στη συνέχεια κάνει decode.</p>

<pre><code class="lang-go">// ReadAll loads the entire payload into RAM at once
resp, err := http.Get("https://api.example.com/data")
if err != nil { return nil, err }
defer resp.Body.Close()

body, err := io.ReadAll(resp.Body)
if err != nil { return nil, err }

var data []Item
err = json.Unmarshal(body, &data)</code></pre>

<h2>2. Τρόπος B: json.NewDecoder().Decode() (Streaming)</h2>
<p>Διαβάζει τα δεδομένα απευθείας από τη δικτυακή ροή (stream) και τα αποκωδικοποιεί <strong>κατευθείαν</strong> στο struct, χωρίς να αποθηκεύει το ενδιάμεσο raw JSON στη RAM.</p>

<pre><code class="lang-go">// NewDecoder streams data directly into the target struct
resp, err := http.Get("https://api.example.com/data")
if err != nil { return nil, err }
defer resp.Body.Close()

var data []Item
err = json.NewDecoder(resp.Body).Decode(&data)</code></pre>

<div class="grid2">
  <div class="card">
    <h3>io.ReadAll</h3>
    <p><strong>Πότε:</strong> Όταν θέλουμε να κάνουμε print το raw JSON string για debugging πριν το parse.</p>
  </div>
  <div class="card">
    <h3>json.NewDecoder</h3>
    <p><strong>Πότε:</strong> Η βέλτιστη πρακτική για παραγωγή (production). Πολύ πιο γρήγορο & αποδοτικό στη RAM.</p>
  </div>
</div>
`);

<div class="eyebrow">Ενότητα 2 / 2 — Go Templates & Custom Functions (FuncMap)</div>
<h1>Διαμόρφωση HTML Templates</h1>
<p class="lede">Όταν θέλουμε να καλέσουμε δικές μας Go συναρτήσεις μέσα από ένα HTML template (π.χ. μετατροπή κειμένου σε κεφαλαία), η απλή <code>template.ParseFiles()</code> δεν αρκεί.</p>

<h2>1. Απλό Loading: template.ParseFiles()</h2>
<p>Δημιουργεί αυτόματα το template και φορτώνει το αρχείο. <strong>Δεν επιτρέπει</strong> την προσθήκη custom συναρτήσεων εκ των προτέρων.</p>

<pre><code class="lang-go">// Simple loading - custom functions will cause parse errors!
tmpl, err := template.ParseFiles("./templates/index.html")</code></pre>

<h2>2. Προσαρμοσμένο Loading: New() + Funcs() + ParseFiles()</h2>
<p>Επιτρέπει την εγγραφή ενός <code>FuncMap</code> <strong>πριν</strong> γίνει το parsing του αρχείου.</p>

<pre><code class="lang-go">// Advanced loading - registers custom functions FIRST
tmpl, err := template.New("index.html").
    Funcs(indexFuncMap()).
    ParseFiles("templates/index.html")</code></pre>

<div class="callout">
  <span class="tag">Προσοχή / Αυστηρή Σειρά!</span>
  Η μέθοδος <code>.Funcs()</code> πρέπει να καλεστεί <strong>υποχρεωτικά πριν</strong> την <code>.ParseFiles()</code>. Αν καλεστεί μετά, ο parser κατά την ανάγνωση του HTML δεν θα αναγνωρίσει τη συνάρτηση και το πρόγραμμα θα καταρρεύσει με error!
</div>
`);

<div class="eyebrow">Ενότητα 3 / 4 — HTTP Routing & Closures</div>
<h1>Το Handler Factory Pattern (Dependency Injection)</h1>
<p class="lede">Η συνάρτηση <code>http.HandleFunc</code> απαιτεί αυστηρά ένα signature της μορφής <code>func(w http.ResponseWriter, r *http.Request)</code>. Πώς περνάμε λοιπόν εξωτερικά δεδομένα (π.χ. <code>artists</code>) χωρίς να χρησιμοποιήσουμε καθολικές (global) μεταβλητές;</p>

<h2>Η Λύση: Higher-Order Functions & Closures</h2>
<p>Δημιουργούμε μια συνάρτηση "wrapper" (Factory) που δέχεται τα δεδομένα μας ως ορίσματα και <strong>επιστρέφει</strong> μια ανώνυμη συνάρτηση <code>http.HandlerFunc</code>. Η εσωτερική αυτή συνάρτηση "θυμάται" τα δεδομένα χάρη στον μηχανισμό των **closures**.</p>

<pre><code class="lang-go">// ── handler factory pattern ──────────────────────────────────────────────── ⊃

// Handler returns an http.HandlerFunc closure that retains access
// to the injected artists and locations slices without global state.
func Handler(artists []Artist, locations []Location) http.HandlerFunc {
	// The outer function finishes, but the inner closure keeps reference
	// to artists and locations in its scope environment.
	return func(w http.ResponseWriter, r *http.Request) {
		if r.URL.Path != "/" {
			ErrorHandler(w, "Invalid path", http.StatusNotFound)
			return
		}
		// Accessing artists and locations directly here!
		fmt.Fprintf(w, "Total artists available: %d", len(artists))
	}
}</code></pre>

<div class="grid2">
  <div class="card">
    <h3>Γιατί αποφεύγουμε τα Globals;</h3>
    <p>Τα global variables καθιστούν τον κώδικα δύσκολο στη συντήρηση, μη ασφαλή σε παράλληλα requests (race conditions) και αδύνατον να ελεγχθεί με unit tests.</p>
  </div>
  <div class="card">
    <h3>Πώς δουλεύει το Factory;</h3>
    <p>Όταν καλούμε <code>Handler(artists, locations)</code>, το αποτέλεσμα της κλήσης είναι η ίδια η συνάρτηση <code>http.HandlerFunc</code> έτοιμη να καταχωρηθεί στο <code>mux</code>.</p>
  </div>
</div>
`);

    // ── Section 4: Pagination & Unique Data Logic ──────────────────────────── ⊃
    addContent(`
<div class="eyebrow">Ενότητα 4 / 4 — Pagination & Data Processing</div>
<h1>Σελιδοποίηση & Απομάκρυνση Διπλότυπων (Deduplication)</h1>
<p class="lede">Μέσα στο <code>Handler</code> βλέπουμε δύο πολύ συνηθισμένους αλγόριθμους: τον τεμαχισμό δεδομένων σε σελίδες (Pagination) και την εύρεση μοναδικών τιμών με <code>map</code>.</p>

<h2>1. Υπολογισμός Page Slices</h2>
<p>Μετατρέπουμε το <code>page</code> query parameter σε ακέραιο και υπολογίζουμε τα όρια <code>start</code> και <code>end</code> για να πάρουμε το σωστό sub-slice των δεδομένων μας.</p>

<pre><code class="lang-go">// ── pagination calculation ───────────────────────────────────────────────── ⊃

// Calculate slice boundaries for the requested page
start := (currentPage - 1) * pageSize
end := start + pageSize

if end > len(artists) {
	end = len(artists)
}

// Pass only the sliced range to the template
pageData.Artists = artists[start:end]</code></pre>

<h2>2. Deduplication με Map (Unique Values)</h2>
<p>Για να πάρουμε μια λίστα από τοποθεσίες χωρίς διπλότυπα, χρησιμοποιούμε ένα <code>map[string]bool</code> ως "set". Αν η τοποθεσία υπάρχει ήδη στο map, την προσπερνάμε με <code>continue</code>.</p>

<pre><code class="lang-go">// ── location deduplication ───────────────────────────────────────────────── ⊃

theListOfLocations := []string{}
seenLocations := make(map[string]bool)

for _, locationGroup := range locations {
	for _, loc := range locationGroup.Locations {
		if seenLocations[loc] {
			continue // Skip duplicate entry
		}
		seenLocations[loc] = true
		theListOfLocations = append(theListOfLocations, loc)
	}
}</code></pre>
`);

    // ── Section 5: JSON Streaming, Headers & Frontend AJAX ───────────────── ⊃
    addContent(`
<div class="eyebrow">Ενότητα 5 — JSON Streaming, Headers & Frontend AJAX</div>
<h1>HTTP Headers, JSON Streaming & JS Fetch</h1>
<p class="lede">Πώς επικοινωνεί η Go με το Frontend μέσω JSON, πώς ρυθμίζουμε τα HTTP Headers και πώς καταναλώνουμε τα δεδομένα στην JavaScript.</p>

<h2>1. w.Header() vs w.WriteHeader()</h2>
<p>Η <code>http.ResponseWriter</code> παρέχει δύο ξεχωριστούς μηχανισμούς για τον έλεγχο της απάντησης:</p>

<ul>
  <li><code>w.Header()</code>: Επιστρέφει το <code>http.Header</code> (ένα map από headers). Πάνω σε αυτό καλούμε τη μέθοδο <code>.Set(key, value)</code> για να προσθέσουμε ή να αλλάξουμε headers.</li>
  <li><code>w.WriteHeader(statusCode)</code>: Στέλνει τον HTTP κωδικό κατάστασης (π.χ. <code>200 OK</code>, <code>404 Not Found</code>, <code>500 InternalServerError</code>).</li>
</ul>

<div class="callout">
  <span class="tag">Προσοχή στη Σειρά</span>
  Όλες οι κλήσεις <code>w.Header().Set(...)</code> πρέπει να γίνονται <strong>ΠΡΙΝ</strong> τις <code>w.WriteHeader()</code>, <code>json.NewEncoder(w).Encode()</code> ή <code>w.Write()</code>. Μόλις γραφτεί το πρώτο byte στο network stream, τα headers "κλειδώνουν" και δεν μεταβάλλονται!
</div>

<h2>2. Τι πετυχαίνουμε με το w.Header().Set() &amp; Δημοφιλή Content-Types</h2>
<p>Με το <code>w.Header().Set(key, value)</code> ενημερώνουμε τον browser για τη φύση των δεδομένων, τους κανόνες ασφαλείας και το caching:</p>

<div class="grid2">
  <div class="card">
    <h3>Συχνά Content-Types</h3>
    <ul>
      <li><code>application/json</code> (JSON APIs / AJAX responses)</li>
      <li><code>text/html; charset=utf-8</code> (HTML σελίδες)</li>
      <li><code>text/css</code> &amp; <code>text/javascript</code> (Static assets)</li>
      <li><code>multipart/form-data</code> (Upload αρχείων)</li>
      <li><code>application/x-www-form-urlencoded</code> (Απλές HTML φόρμες)</li>
    </ul>
  </div>
  <div class="card">
    <h3>Άλλες Χρήσεις του .Set()</h3>
    <ul>
      <li><strong>CORS:</strong> <code>Access-Control-Allow-Origin: *</code></li>
      <li><strong>Caching:</strong> <code>Cache-Control: no-cache</code></li>
      <li><strong>Redirects:</strong> <code>Location: /login</code> (μαζί με 302 status)</li>
      <li><strong>Security:</strong> <code>X-Content-Type-Options: nosniff</code></li>
    </ul>
  </div>
</div>

<h2>3. JSON Streaming: Encoder vs Decoder</h2>
<p>Το <strong>JSON Streaming</strong> σημαίνει ότι γράφουμε ή διαβάζουμε δεδομένα απευθείας από τη δικτυακή ροή (stream), παρακάμπτοντας την προσωρινή αποθήκευση intermediate <code>[]byte</code> στη μνήμη RAM.</p>

<pre><code class="lang-go">// ── streaming encoder & decoder ───────────────────────────────────────────── ⊃

// Encode: Go Struct -> JSON Stream (Output)
// Serializes Go structs and streams bytes directly into the HTTP response stream (w).
err := json.NewEncoder(w).Encode(matches)

// Decode: JSON Stream -> Go Struct (Input)
// Reads JSON bytes straight from the HTTP request body stream (r.Body) into a Go struct pointer.
err := json.NewDecoder(r.Body).Decode(&amp;incomingData)</code></pre>

<h2>4. Παράλληλος Κώδικας σε JavaScript (Frontend AJAX)</h2>
<p>Όταν το Go backend στέλνει JSON με <code>Content-Type: application/json</code>, η JavaScript στο frontend (browser) χρησιμοποιεί το <code>fetch()</code> API για ασύγχρονη λήψη δεδομένων χωρίς reload της σελίδας:</p>

<pre><code class="lang-js">// ── frontend ajax fetch ──────────────────────────────────────────────────── ⊃

// fetchSuggestions makes an asynchronous HTTP request to the Go backend
// and automatically parses the streamed JSON response.
async function fetchSuggestions(query) {
    try {
        const response = await fetch(\`/suggestions?query=\${encodeURIComponent(query)}\`);
        
        if (!response.ok) {
            throw new Error(\`HTTP error! Status: \${response.status}\`);
        }
        
        // Parsed directly from the streamed application/json response
        const artists = await response.json();
        console.log("Suggestions received:", artists);
    } catch (err) {
        console.error("Failed to fetch suggestions:", err);
    }
}</code></pre>

  Η Go προετοιμάζει τα Headers (<code>w.Header().Set</code>), κάνει stream τα δεδομένα (<code>json.NewEncoder(w).Encode</code>), και η JavaScript στο frontend τα καταναλώνει ασύγχρονα με <code>await response.json()</code>.
</div>
`);
