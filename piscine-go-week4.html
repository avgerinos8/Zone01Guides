<div class="eyebrow" id="@ll-vs-array">Ενότητα 1 / 2 &mdash; Linked Lists</div>
<h1>Linked List vs Array</h1>
<p class="lede">Σε αντίθεση με τα Arrays (ή τα Slices), σε μια Linked List <strong>δεν ξέρεις το μέγεθός της</strong> εκ των προτέρων (δεν υπάρχει κάτι σαν <code>len(sl)</code>), ούτε μπορείς να πας κατευθείαν σε ένα συγκεκριμένο στοιχείο (π.χ. στο <code>sl[3]</code>).</p>

<p>Για να διαβάσεις το 3ο στοιχείο, πρέπει να <em>περπατήσεις</em> μέχρι εκεί μέσω των pointers: από το 1 &rarr; 2 &rarr; 3, και μετά να το διαβάσεις. Αυτό ίσως σου ακούγεται τρελό και εντελώς άχρηστο λοιπόν.</p>

<div class="callout">
  <span class="tag">Γιατί να την προτιμήσουμε;</span>
  <p>Αν θέλεις να προσθέσεις ένα νέο στοιχείο στη θέση 2 ενός <strong>πίνακα (Array/Slice)</strong>, πρέπει να «σπρώξεις» χειροκίνητα όλα τα επόμενα στοιχεία μία θέση δεξιά για να ανοίξεις χώρο. Κι αν ο πίνακας έχει γεμίσει, η Go πρέπει να πάει στη μνήμη, να δεσμεύσει έναν <em>ολοκαίνουριο</em> τεράστιο πίνακα, και να τα αντιγράψει όλα από την αρχή (τεράστιο κόστος!).</p>
  <p style="margin-bottom:0;">Στη <strong>Linked List</strong>, απλά βάζεις το έξτρα στοιχείο οπουδήποτε υπάρχει χώρος στη μνήμη, και πειράζεις αποκλειστικά τους <em>δεσμούς (pointers)</em> που ενώνουν την αλυσίδα. Δεν χρειάζεται να κουνήσεις <strong>κανένα απολύτως</strong> από τα υπόλοιπα εκατομμύρια στοιχεία που ακολουθούν!</p>
</div>
`);

<div class="eyebrow" id="@pointers-reminder">Ενότητα 1 / 2 &mdash; Linked Lists</div>
<h1>Μικρή Παρένθεση: Pointers (&amp; και *)</h1>
<p>Φαντάσου τη μνήμη του υπολογιστή σαν μια τεράστια γειτονιά με σπίτια. Κάθε σπίτι έχει μια <strong>τιμή</strong> (το περιεχόμενό του) και μια <strong>διεύθυνση</strong> (π.χ. Οδός 0x104).</p>

<ul class="clean-list">
  <li><strong>Το <code>&amp;</code> (Διεύθυνση):</strong> Σημαίνει <em>"Πού μένει;"</em>. Αν έχεις μια μεταβλητή <code>x</code>, το <code>&amp;x</code> σου δίνει την ακριβή διεύθυνση που βρίσκεται στη μνήμη.</li>
  <li><strong>Το <code>*</code> (Dereference):</strong> Σημαίνει <em>"Πήγαινε σε αυτή τη διεύθυνση"</em>. Αν έχεις έναν pointer <code>p</code> (ένα "χαρτάκι" με διεύθυνση), το <code>*p</code> σε πάει στο σπίτι και σου δείχνει το περιεχόμενο.</li>
</ul>

<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:760px;height:auto;display:block;margin:16px auto;" role="img">
  <title>Pointers: Memory Addresses and Values</title>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">

    </marker>
  </defs>

  <!-- Variable x -->
  <g transform="translate(80, 25)">
    <rect width="180" height="120" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="3" filter="url(#card-shadow)"/>

    <text x="90" y="5" font-family="monospace" font-size="16" fill="#a1a1aa" text-anchor="middle" font-weight="bold">0x108</text>
  </g>

  <rect x="300" y="46" width="160" height="30" rx="15" fill="#18181b" stroke="var(--accent, #60a5fa)" stroke-width="2"/>
  <text x="380" y="66" font-family="monospace" font-size="14" font-weight="bold" fill="var(--accent, #60a5fa)" text-anchor="middle">p = &amp;x</text>

  <!-- *p Arrow -->
  <path d="M 590 127 C 590 205 170 205 170 133" fill="none" stroke="var(--correct, #34d399)" stroke-width="4" marker-end="url(#pointer-arrow)"/>

<pre><code class="lang-go">x := 12
var p *int  // Οι μεταβλητή p είναι τύπου pointer σε int (γράφεται *int)
p = &amp;x      // Το p τώρα κρατάει τη διεύθυνση του x (δηλαδή το 0x104)

fmt.Println(*p) // *p σημαίνει "Τι έχει μέσα στο 0x104;" -&gt; Τυπώνει 12
*p = 99         // Αλλάζει την τιμή του x (εκεί που δείχνει) σε 99
</code></pre>

<div class="callout">
  <span class="tag">Σημαντική Διάκριση: <code>*p</code> vs <code>*Node</code></span>
  Το αστεράκι (<code>*</code>) έχει δύο εντελώς διαφορετικές χρήσεις:
  <ul>
    <li>Όταν μπαίνει <strong>μπροστά από ΤΥΠΟ</strong> (π.χ. <code>*Node</code> ή <code>*int</code>), σημαίνει <em>"Τύπος Pointer που δείχνει σε τέτοιο πράγμα"</em>. Δεν κάνουμε dereference τη λέξη Node, γιατί το Node δεν είναι μεταβλητή, είναι τύπος!</li>
    <li>Όταν μπαίνει <strong>μπροστά από ΜΕΤΑΒΛΗΤΗ</strong> (π.χ. <code>*p</code>), σημαίνει <em>"Dereference: πήγαινε στη διεύθυνση που κρατάει το p και φέρε την τιμή"</em>.</li>
  </ul>
</div>
`);

<div class="eyebrow" id="@diaschisi">Ενότητα 1 / 2 &mdash; Linked Lists</div>
<h1>Διάσχιση και ListPushBack</h1>
<p class="lede">Για να προσθέσουμε ένα στοιχείο στο τέλος, πρέπει πρώτα να βρούμε... πού είναι το τέλος. Ξεκινάμε από το Head και προχωράμε μέχρι να βρούμε τον κόμβο που το <code>Next</code> του είναι <code>nil</code>.</p>

<div id="viz-listpushback"></div>

<pre><code class="lang-go">func ListPushBack(l *List, data interface{}) {
	n := &amp;NodeL{Data: data} // Φτιάχνουμε τον νέο κόμβο
	
	if l.Head == nil { // Αν η λίστα είναι άδεια
		l.Head = n
		return
	}
	
	curr := l.Head
	for curr.Next != nil { // Προχωράμε μέχρι το τέλος
		curr = curr.Next
	}
	
	curr.Next = n // Τον συνδέουμε
}</code></pre>
`);

    addContent(`
<div class="eyebrow" id="@listreverse-stratigiki">Ενότητα 1 / 2 &mdash; Linked Lists</div>
<h1>Η στρατηγική για την ListReverse</h1>
<p class="lede">Το να γυρίσεις μια λίστα ανάποδα μοιάζει δύσκολο, αλλά λύνεται διατηρώντας τρεις δείκτες: τον προηγούμενο (prev), τον τρέχοντα (curr), και τον επόμενο (next).</p>

<p>Σε κάθε βήμα:
<ol>
<li>Σημειώνουμε ποιος είναι ο <code>next</code> (γιατί αλλιώς θα τον χάσουμε)</li>
<li>Αλλάζουμε το <code>Next</code> του <code>curr</code> να δείχνει στον <code>prev</code></li>
<li>Προχωράμε τον <code>prev</code> και τον <code>curr</code> ένα βήμα μπροστά</li>
</ol>
</p>

<pre><code class="lang-go">func ListReverse(l *List) {
	var prev *NodeL
	curr := l.Head
	
	l.Tail = l.Head // το παλιό Head γίνεται το νέο Tail
	
	for curr != nil {
		next := curr.Next
		curr.Next = prev
		prev = curr
		curr = next
	}
	
	l.Head = prev // το παλιό Tail γίνεται το νέο Head
}</code></pre>

<div class="callout">
  <span class="tag">Προσοχή / Συχνό λάθος</span>
  Αν ξεχάσεις να σώσεις το <code>curr.Next</code> σε μια βοηθητική μεταβλητή πριν το αλλάξεις, θα χάσεις την επαφή με το υπόλοιπο της λίστας (αφού μόλις γύρισες το βελάκι ανάποδα!) και το πρόγραμμά σου θα προκαλέσει panic ή άπειρη αναδρομή.
</div>
`);

<div class="eyebrow" id="@btree-insert-code">Ενότητα 2 / 2 &mdash; Binary Search Trees</div>
<h1>Ο Κώδικας Προσθήκης</h1>
<p class="lede">Ας δούμε πώς μεταφράζεται η προηγούμενη διαδικασία σε κώδικα Go.</p>

<pre><code class="lang-go">func BTreeInsertData(root *TreeNode, data string) *TreeNode {
	if root == nil {
		return &amp;TreeNode{Data: data}
	}
	
	if data &lt; root.Data {
		root.Left = BTreeInsertData(root.Left, data)
	} else {
		root.Right = BTreeInsertData(root.Right, data)
	}
	
	return root
}</code></pre>

<p>Εδώ βλέπουμε τη δύναμη της αναδρομής (recursion). Το δέντρο λύνει το πρόβλημα με τον ίδιο ακριβώς τρόπο, ανεξάρτητα από το σε ποιο "ύψος" βρισκόμαστε.</p>

<div class="callout">
  <span class="tag">Πότε το αναγνωρίζεις</span>
  Αν δεις άσκηση που ζητάει "προσθήκη", "διαγραφή", "επεξεργασία" σε δέντρο, 99% θα χρειαστείς recursion. Το tree traversal γίνεται πάρα πολύ δύσκολο με απλές λούπες.
</div>
`);
