        msg.style.cssText = "font-size:22px;font-weight:600;letter-spacing:.02em;";
        overlay.appendChild(msg);

        var btn = document.createElement("button");
        btn.textContent = "Reset Progress";
        btn.style.cssText = "font-family:inherit;font-size:15px;padding:10px 22px;" +
          "border-radius:7px;border:1px solid #888;background:transparent;" +
          "color:#ccc;cursor:pointer;";
        btn.addEventListener("click", function () {
          var prefix = "quiz_deck_" + window.location.pathname.replace(/[^a-zA-Z0-9]/g, "_") + "_";
          localStorage.removeItem(prefix + "current_slide");
          localStorage.removeItem(prefix + "answers");
          localStorage.removeItem(prefix + "scores");
          localStorage.removeItem(prefix + "notified_100");
          localStorage.removeItem(prefix + "version");
          window.location.reload();
        });
        overlay.appendChild(btn);
        document.body.appendChild(overlay);
      }
    })();

<div class="eyebrow" id="@ti-einai-linked-list">Ενότητα 1 / 2 &mdash; Linked Lists</div>
<h1>Τι είναι η Linked List</h1>
<p class="lede">Μέχρι τώρα χρησιμοποιούσαμε arrays και slices, όπου όλα τα δεδομένα βρίσκονται στη σειρά. Η Linked List (Συνδεδεμένη Λίστα) λειτουργεί εντελώς διαφορετικά: κάθε στοιχείο βρίσκεται κάπου αλλού στη μνήμη και απλώς ξέρει πού βρίσκεται το επόμενο.</p>

<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:760px;height:auto;display:block;margin:18px auto;color:var(--ink)">
  <style>
    .blacked-shadow { filter: drop-shadow(2px 2px 0px #000) drop-shadow(-1px -1px 0px #000) drop-shadow(1px -1px 0px #000) drop-shadow(-1px 1px 0px #000); }
  </style>
  <defs>
    <pattern id="hatch-blue" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="var(--accent)" stroke-width="1.5" stroke-opacity="0.2" />
    </pattern>
    <pattern id="hatch-green" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="var(--correct)" stroke-width="1.5" stroke-opacity="0.2" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--correct)" />
    </marker>
  </defs>

  <!-- Array -->
  <rect x="30" y="35" width="500" height="36" fill="var(--accent)" opacity="0.4" rx="18" />
  <text x="200" y="58" font-size="16" text-anchor="middle" font-family="monospace" font-weight="bold" fill="var(--tone-text)" class="blacked-shadow">ARRAY / SLICE</text>
  
  <rect x="30" y="80" width="240" height="50" fill="url(#hatch-blue)" stroke="var(--accent)" stroke-width="2" rx="4"/>
  <line x1="90" y1="80" x2="90" y2="130" stroke="var(--accent)" stroke-width="2"/>
  <line x1="150" y1="80" x2="150" y2="130" stroke="var(--accent)" stroke-width="2"/>
  <line x1="210" y1="80" x2="210" y2="130" stroke="var(--accent)" stroke-width="2"/>
  
  <text x="60" y="112" font-size="20" text-anchor="middle" style="fill:var(--tone-text); font-family:monospace; font-weight:bold" class="blacked-shadow">5</text>
  <text x="120" y="112" font-size="20" text-anchor="middle" style="fill:var(--tone-text); font-family:monospace; font-weight:bold" class="blacked-shadow">8</text>
  <text x="180" y="112" font-size="20" text-anchor="middle" style="fill:var(--tone-text); font-family:monospace; font-weight:bold" class="blacked-shadow">2</text>
  <text x="240" y="112" font-size="20" text-anchor="middle" style="fill:var(--tone-text); font-family:monospace; font-weight:bold" class="blacked-shadow">9</text>

  <!-- Linked List -->
  <rect x="30" y="145" width="500" height="36" fill="var(--correct)" opacity="0.4" rx="18" />
  <text x="200" y="168" font-size="16" text-anchor="middle" font-family="monospace" font-weight="bold" fill="var(--tone-text)" class="blacked-shadow">LINKED LIST</text>
  
  <rect x="30" y="190" width="50" height="50" fill="url(#hatch-green)" stroke="var(--correct)" stroke-width="2" rx="8"/>
  <text x="55" y="222" font-size="20" text-anchor="middle" style="fill:var(--tone-text); font-family:monospace; font-weight:bold" class="blacked-shadow">5</text>
  <text x="127" y="208" font-size="10" text-anchor="middle" fill="var(--correct)">pointer to next -&gt;</text>
  <line x1="80" y1="215" x2="175" y2="215" stroke="var(--correct)" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="180" y="190" width="50" height="50" fill="url(#hatch-green)" stroke="var(--correct)" stroke-width="2" rx="8"/>
  <text x="205" y="222" font-size="20" text-anchor="middle" style="fill:var(--tone-text); font-family:monospace; font-weight:bold" class="blacked-shadow">8</text>
  <text x="277" y="208" font-size="10" text-anchor="middle" fill="var(--correct)">pointer to next -&gt;</text>
  <line x1="230" y1="215" x2="325" y2="215" stroke="var(--correct)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="190" width="50" height="50" fill="url(#hatch-green)" stroke="var(--correct)" stroke-width="2" rx="8"/>
  <text x="355" y="222" font-size="20" text-anchor="middle" style="fill:var(--tone-text); font-family:monospace; font-weight:bold" class="blacked-shadow">2</text>
  <text x="427" y="208" font-size="10" text-anchor="middle" fill="var(--correct)">pointer to next -&gt;</text>
  <line x1="380" y1="215" x2="475" y2="215" stroke="var(--correct)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="190" width="50" height="50" fill="url(#hatch-green)" stroke="var(--correct)" stroke-width="2" rx="8"/>
  <text x="505" y="222" font-size="20" text-anchor="middle" style="fill:var(--tone-text); font-family:monospace; font-weight:bold" class="blacked-shadow">9</text>
  <line x1="530" y1="215" x2="570" y2="215" stroke="var(--correct)" stroke-width="2" stroke-dasharray="4"/>
  <text x="595" y="220" font-size="16" text-anchor="middle" fill="#ffffff" font-family="monospace">nil</text>
</svg>

<p>Γιατί να την προτιμήσουμε; Σε ένα array, για να βάλεις ένα στοιχείο στη μέση, πρέπει να μετακινήσεις όλα τα επόμενα προς τα δεξιά (με μεγάλο κόστος). Σε μια Linked List, το μόνο που κάνεις είναι να αλλάξεις πού δείχνουν τα βελάκια, χωρίς επιπλέον δουλειά.</p>

<svg viewBox="0 0 760 160" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:760px;height:auto;display:block;margin:32px auto 0 auto;">
  <defs>
    <filter id="shadow-chain" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="8" stdDeviation="5" flood-color="#000" flood-opacity="0.65"/>
    </filter>

    <!-- Base full flat link -->
    <g id="link-flat">
      <rect x="-60" y="-30" width="120" height="60" rx="30" fill="none" stroke="#181818" stroke-width="20" />
      <rect x="-60" y="-30" width="120" height="60" rx="30" fill="none" stroke="#333333" stroke-width="16" />
      <rect x="-60" y="-30" width="120" height="60" rx="30" fill="none" stroke="#555555" stroke-width="12" />
      <rect x="-60" y="-30" width="120" height="60" rx="30" fill="none" stroke="#777777" stroke-width="8" />
      <rect x="-60" y="-30" width="120" height="60" rx="30" fill="none" stroke="#999999" stroke-width="4" />
      <rect x="-60" y="-30" width="120" height="60" rx="30" fill="none" stroke="#dddddd" stroke-width="1" />
    </g>

    <!-- Left rim cover (for interlacing) -->
    <g id="link-flat-cover-left">
      <path d="M 0 -30 L -30 -30 A 30 30 0 0 0 -30 30 L 0 30" fill="none" stroke="#181818" stroke-width="20" stroke-linecap="butt" />
      <path d="M 0 -30 L -30 -30 A 30 30 0 0 0 -30 30 L 0 30" fill="none" stroke="#333333" stroke-width="16" stroke-linecap="butt" />
      <path d="M 0 -30 L -30 -30 A 30 30 0 0 0 -30 30 L 0 30" fill="none" stroke="#555555" stroke-width="12" stroke-linecap="butt" />
      <path d="M 0 -30 L -30 -30 A 30 30 0 0 0 -30 30 L 0 30" fill="none" stroke="#777777" stroke-width="8" stroke-linecap="butt" />
      <path d="M 0 -30 L -30 -30 A 30 30 0 0 0 -30 30 L 0 30" fill="none" stroke="#999999" stroke-width="4" stroke-linecap="butt" />
      <path d="M 0 -30 L -30 -30 A 30 30 0 0 0 -30 30 L 0 30" fill="none" stroke="#dddddd" stroke-width="1" stroke-linecap="butt" />
    </g>

    <!-- Right rim cover (for interlacing) -->
    <g id="link-flat-cover-right">
      <path d="M 0 -30 L 30 -30 A 30 30 0 0 1 30 30 L 0 30" fill="none" stroke="#181818" stroke-width="20" stroke-linecap="butt" />
      <path d="M 0 -30 L 30 -30 A 30 30 0 0 1 30 30 L 0 30" fill="none" stroke="#333333" stroke-width="16" stroke-linecap="butt" />
      <path d="M 0 -30 L 30 -30 A 30 30 0 0 1 30 30 L 0 30" fill="none" stroke="#555555" stroke-width="12" stroke-linecap="butt" />
      <path d="M 0 -30 L 30 -30 A 30 30 0 0 1 30 30 L 0 30" fill="none" stroke="#777777" stroke-width="8" stroke-linecap="butt" />
      <path d="M 0 -30 L 30 -30 A 30 30 0 0 1 30 30 L 0 30" fill="none" stroke="#999999" stroke-width="4" stroke-linecap="butt" />
      <path d="M 0 -30 L 30 -30 A 30 30 0 0 1 30 30 L 0 30" fill="none" stroke="#dddddd" stroke-width="1" stroke-linecap="butt" />
    </g>

    <!-- Perpendicular (Edge) link -->
    <g id="link-edge">
      <rect x="-45" y="-12" width="90" height="24" rx="12" fill="#181818" />
      <rect x="-43" y="-10" width="86" height="20" rx="10" fill="#333333" />
      <rect x="-41" y="-8" width="82" height="16" rx="8" fill="#555555" />
      <rect x="-39" y="-6" width="78" height="12" rx="6" fill="#777777" />
      <rect x="-37" y="-4" width="74" height="8" rx="4" fill="#999999" />
      <rect x="-35" y="-2" width="70" height="4" rx="2" fill="#dddddd" />
    </g>
  </defs>

  <!-- 1. Flat Links (all receive drop shadows to cast on background) -->
  <use href="#link-flat" filter="url(#shadow-chain)" transform="translate(80, 80) rotate(-5)" />
  <use href="#link-flat" filter="url(#shadow-chain)" transform="translate(220, 80) rotate(8)" />
  <use href="#link-flat" filter="url(#shadow-chain)" transform="translate(360, 80) rotate(-3)" />
  <use href="#link-flat" filter="url(#shadow-chain)" transform="translate(500, 80) rotate(6)" />
  <use href="#link-flat" filter="url(#shadow-chain)" transform="translate(640, 80) rotate(-8)" />

  <!-- 2. Edge Links (receive drop shadows that cast over the flat links beneath them) -->
  <use href="#link-edge" filter="url(#shadow-chain)" transform="translate(150, 80) rotate(4)" />
  <use href="#link-edge" filter="url(#shadow-chain)" transform="translate(290, 80) rotate(-6)" />
  <use href="#link-edge" filter="url(#shadow-chain)" transform="translate(430, 80) rotate(5)" />
  <use href="#link-edge" filter="url(#shadow-chain)" transform="translate(570, 80) rotate(-4)" />

  <!-- 3. Cover Rims (drawn with no shadow to perfectly mask the edge links and create the interlacing illusion) -->
  <use href="#link-flat-cover-right" transform="translate(80, 80) rotate(-5)" />
  <use href="#link-flat-cover-left" transform="translate(220, 80) rotate(8)" />
  
  <use href="#link-flat-cover-right" transform="translate(220, 80) rotate(8)" />
  <use href="#link-flat-cover-left" transform="translate(360, 80) rotate(-3)" />
  
  <use href="#link-flat-cover-right" transform="translate(360, 80) rotate(-3)" />
  <use href="#link-flat-cover-left" transform="translate(500, 80) rotate(6)" />
  
  <use href="#link-flat-cover-right" transform="translate(500, 80) rotate(6)" />
  <use href="#link-flat-cover-left" transform="translate(640, 80) rotate(-8)" />
</svg>
`);

<div class="eyebrow" id="@chain-metaphor">Ενότητα 1 / 2 &mdash; Linked Lists</div>
<h1>Η αλυσίδα στην πράξη</h1>
<p class="lede">Η παρομοίωση με μια φυσική αλυσίδα μας βοηθάει να καταλάβουμε οπτικά τι συμβαίνει στο εσωτερικό της λίστας όταν προσθέτουμε ή αφαιρούμε κόμβους:</p>

<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:760px;height:auto;display:block;margin:32px auto 16px auto;color:var(--ink)">
  <defs>
    <filter id="chain-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--dim)"/>
    </marker>
    <marker id="arrow-nil" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/>
    </marker>

    <!-- Side Links -->
    <g id="link-side">
      <rect x="0" y="14" width="80" height="16" rx="8" fill="var(--tone-4)" filter="url(#chain-shadow)"/>
    </g>
    <g id="link-side-accent">

    </g>
  </defs>

  <!-- FRAME 1 -->
  <g transform="translate(20, 50)">
    <text x="0" y="-15" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="var(--tone-text)">1. Αρχική μορφή</text>

    <text x="320" y="27" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle" fill="var(--tone-text)">B</text>

    <text x="0" y="-15" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="var(--tone-text)">2. Αποσύνδεση κρίκου</text>

    <path d="M 210 22 Q 240 22 240 45" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="5" marker-end="url(#arrow-nil)"/>
    <text x="240" y="62" font-family="monospace" font-size="13" fill="#ffffff" text-anchor="middle">nil</text>

    <use href="#link-node" x="420" y="0" />
    <text x="480" y="27" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle" fill="var(--tone-text)">B</text>>

  <!-- FRAME 3 -->

    <text x="0" y="-15" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="var(--tone-text)">3. Νέος κρίκος ενδιάμεσα</text>

<div class="eyebrow" id="@ti-einai-node">Ενότητα 1 / 2 &mdash; Linked Lists</div>
<h1>Τι είναι το *Node</h1>
<p class="lede">Ο βασικός δομικός λίθος της λίστας είναι ο κόμβος (node). Κάθε κόμβος κρατάει ένα κομμάτι πληροφορίας και έναν pointer προς τον επόμενο κόμβο.</p>

<pre><code class="lang-go">type NodeL struct {
	Data interface{}
	Next *NodeL
}</code></pre>

<p>Όταν γράφουμε <code>*NodeL</code>, εννοούμε τη διεύθυνση μνήμης όπου βρίσκεται ο κόμβος. Επίσης, αν δεν υπάρχει επόμενος κόμβος, το <code>Next</code> παίρνει την τιμή <code>nil</code>.</p>
`);

    addContent(`
<div class="eyebrow" id="@diaschisi">Ενότητα 1 / 2 &mdash; Linked Lists</div>
<h1>Διάσχιση και ListPushBack</h1>
<p class="lede">Για να προσθέσουμε ένα στοιχείο στο τέλος, πρέπει πρώτα να βρούμε... πού είναι το τέλος. Ξεκινάμε από το Head και προχωράμε μέχρι να βρούμε τον κόμβο που το <code>Next</code> του είναι <code>nil</code>.</p>

<div id="viz-listpushback"></div>

<pre><code class="lang-go">func ListPushBack(l *List, data interface{}) {
	n := &amp;NodeL{Data: data} // Φτιάχνουμε τον νέο κόμβο
	
	if l.Head == nil { // Αν η λίστα είναι άδεια
		l.Head = n
		return
	}
	
	curr := l.Head
	for curr.Next != nil { // Προχωράμε μέχρι το τέλος
		curr = curr.Next
	}
	
	curr.Next = n // Τον συνδέουμε
}</code></pre>
`);

    addContent(`
<div class="eyebrow" id="@listreverse-stratigiki">Ενότητα 1 / 2 &mdash; Linked Lists</div>
<h1>Η στρατηγική για την ListReverse</h1>
<p class="lede">Το να γυρίσεις μια λίστα ανάποδα μοιάζει δύσκολο, αλλά λύνεται διατηρώντας τρεις δείκτες: τον προηγούμενο (prev), τον τρέχοντα (curr), και τον επόμενο (next).</p>

<p>Σε κάθε βήμα:
<ol>
<li>Σημειώνουμε ποιος είναι ο <code>next</code> (γιατί αλλιώς θα τον χάσουμε)</li>
<li>Αλλάζουμε το <code>Next</code> του <code>curr</code> να δείχνει στον <code>prev</code></li>
<li>Προχωράμε τον <code>prev</code> και τον <code>curr</code> ένα βήμα μπροστά</li>
</ol>
</p>

<pre><code class="lang-go">func ListReverse(l *List) {
	var prev *NodeL
	curr := l.Head
	
	l.Tail = l.Head // το παλιό Head γίνεται το νέο Tail
	
	for curr != nil {
		next := curr.Next
		curr.Next = prev
		prev = curr
		curr = next
	}
	
	l.Head = prev // το παλιό Tail γίνεται το νέο Head
}</code></pre>

<div class="callout">
  <span class="tag">Προσοχή / Συχνό λάθος</span>
  Αν ξεχάσεις να σώσεις το <code>curr.Next</code> σε μια βοηθητική μεταβλητή πριν το αλλάξεις, θα χάσεις την επαφή με το υπόλοιπο της λίστας (αφού μόλις γύρισες το βελάκι ανάποδα!) και το πρόγραμμά σου θα προκαλέσει panic ή άπειρη αναδρομή.
</div>
`);

<div class="eyebrow" id="@btree-insert">Ενότητα 2 / 2 &mdash; Binary Search Trees</div>
<h1>Πώς προσθέτουμε έναν κόμβο</h1>
<p class="lede">Για να κρατήσουμε τον κανόνα, όταν προσθέτουμε έναν κόμβο ξεκινάμε από τη ρίζα. Κάνουμε μια ερώτηση: Είναι μικρότερο ή μεγαλύτερο;</p>

<div id="viz-bst"></div>

<pre><code class="lang-go">func BTreeInsertData(root *TreeNode, data string) *TreeNode {
	if root == nil {
		return &amp;TreeNode{Data: data}
	}
	
	if data &lt; root.Data {
		root.Left = BTreeInsertData(root.Left, data)
	} else {
		root.Right = BTreeInsertData(root.Right, data)
	}
	
	return root
}</code></pre>

<p>Εδώ βλέπουμε τη δύναμη της αναδρομής (recursion). Το δέντρο λύνει το πρόβλημα με τον ίδιο ακριβώς τρόπο, ανεξάρτητα από το σε ποιο "ύψος" βρισκόμαστε.</p>

<div class="callout">
  <span class="tag">Πότε το αναγνωρίζεις</span>
  Αν δεις άσκηση που ζητάει "προσθήκη", "διαγραφή", "επεξεργασία" σε δέντρο, 99% θα χρειαστείς recursion. Το tree traversal γίνεται πάρα πολύ δύσκολο με απλές λούπες.
</div>
`);

<div class="eyebrow" id="@btree-traversals">Ενότητα 2 / 2 &mdash; Binary Search Trees</div>
<h1>Η στρατηγική για Inorder, Preorder, Postorder</h1>
<p class="lede">Υπάρχουν 3 τρόποι να περάσουμε από όλους τους κόμβους. Η διαφορά τους είναι στο <strong>πότε</strong> κοιτάμε τα δεδομένα του κόμβου.</p>

<div class="grid3">
  <div class="card">
    <h3>Preorder</h3>
    <p>Data &rarr; Left &rarr; Right</p>
    <p>Κοιτάμε πρώτα τη ρίζα, μετά κατεβαίνουμε αριστερά, μετά δεξιά.</p>
  </div>
  <div class="card">
    <h3>Inorder</h3>
    <p>Left &rarr; Data &rarr; Right</p>
    <p>Πρώτα όλα τα αριστερά, μετά η ρίζα. <strong>Μας δίνει τα στοιχεία σε απόλυτη αλφαβητική/αριθμητική σειρά.</strong></p>
  </div>
  <div class="card">
    <h3>Postorder</h3>
    <p>Left &rarr; Right &rarr; Data</p>
    <p>Πρώτα εξερευνούμε όλα τα παιδιά, και στο τέλος τον ίδιο τον κόμβο.</p>
  </div>
</div>

<pre><code class="lang-go">func BTreeApplyInorder(root *TreeNode, f func(...interface{}) (int, error)) {
	if root == nil {
		return
	}
	BTreeApplyInorder(root.Left, f)
	f(root.Data)
	BTreeApplyInorder(root.Right, f)
}</code></pre>
`);
