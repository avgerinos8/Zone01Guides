  ZONE01 SLIDE-DECK TEMPLATE. This file is self-contained instruction-wise —
  script.js/style.css are a fixed engine you never need to see or edit.

  Edit only the inline <script> at the bottom of <body>. It's a sequence of
  calls, ending with initSlideDeck() exactly once:

    addContent(html, opts?)
      One slide. HTML classes available: h1 h2 h3 p .lede .callout
      .callout.good .card .grid2 .grid3 <pre><code> (hand-color tokens with
      <span class="tok-kw|tok-type|tok-str|tok-com|tok-num|tok-func">, no
      auto-highlighter exists) .glossary-table/.glossary-strip/.glossary-columns
      (mix all three for variety) .title-slide/.title-badge/.kicker-line
      (title slide only, keep the "ask an AI when stuck" callout as-is).
      Drag-to-reveal spoiler (e.g. hiding a code answer until dragged open):
        <div class="spoiler"><div class="spoiler-lock"><span>Drag to
        reveal →</span></div><pre><code>...</code></pre></div>
      A click/tap does nothing — only an actual drag past ~40% unlocks it.
      opts = { bg: "path/to/image.jpg", overlayAlpha: 0..1 (default 0.5),
      backgroundSize (default "auto"), backgroundRepeat (default "no-repeat"),
      backgroundPosition (default "top left") }
      → optional per-slide background image with a solid readability
      overlay; different slides can use different images or none at all.
      backgroundPosition accepts real CSS values, e.g. "center center",
      "top left", "bottom right", "50% 50%".

    addQuiz(question | [question,...], opts?)
      One or more MC questions on one slide.
      question = { q, options:[4 strings], correct: index, explain }
      opts = { bg, overlayAlpha } — same background option as addContent.
      Rules: options similar length/style; correct-answer slot varies
      across questions; distractors are plausible, never "obviously
      silly"; include at least one distractor ~5 words longer than the
      correct answer somewhere in the deck; one short explain per question.

    addFillBlank(item | [item,...], opts?)
      item = { code (mark blanks with __id__), blanks:[{id,answer}], explain }
      opts = { label, note }
      Auto-adds a "Reveal hint"/"Check" UI — nothing else to wire up. If an
      item has exactly 1 blank, the hint button is disabled automatically
      (shows "[Time to Guess]" instead) since there'd be nothing to guess.

    addMatching(pairs | [set1, set2, ...], opts?)
      pairs = [{term, def}, ...] for ONE set, OR an array of 2-3 such sets
      to stack multiple independent matching games on the same slide.
      opts = { label, note }

  Score: every quiz/fillblank/matching item is scored automatically (100
  correct, 50 fill-blank-with-hint-used, 0 wrong) and shown as a small
  badge next to each slide's "Reset this quiz". To show the aggregate
  result, put <div id="final-score"></div> ANYWHERE in the deck (typically
  the sources/last slide) — it fills itself in automatically.

  Deck structure: title → theory sections (interleave addQuiz() checkpoints
  regularly, not just at the end) → a glossary addContent() may appear
  after ANY section/quiz where it helps (not only once at the very end) →
  one final combined addQuiz() with 2-3 questions → sources/footer slide
  with the #final-score placeholder (keep the "pavgerin/avgerinos8" credit).

  Never solve the actual exercise — theory/tools only. Prose Greek, code
  comments English. Confirm the section list with the user before writing
  full content, unless already confirmed.
-->

<head>
  <!-- Must be the very first thing in <head>, inline (not an external
       file — no time for an extra network round-trip): captures the URL's
       #hash and immediately strips it from the address bar, BEFORE the
       browser gets any chance to attempt its own native scroll-to-fragment.
       That native attempt is guaranteed broken here (the target heading
       doesn't exist until static/script.js builds all the slides later),
       and worse, some browsers RETRY it once the target appears — landing
       on a still-hidden (display:none) element, which produces exactly the
       "scrolled somewhere wrong" symptom, and only intermittently since the
       retry timing itself isn't consistent. Stripping the hash here removes
       every native attempt entirely — see handleHashNavigation() in
       script.js, which reads window.__initialHash (not location.hash,
       that's been cleared) and does the whole thing itself, deterministically,
       once slides actually exist. -->
  <script>
    window.__initialHash = location.hash;
    if (location.hash) {
      history.replaceState(null, "", location.pathname + location.search);
    }
  </script>
