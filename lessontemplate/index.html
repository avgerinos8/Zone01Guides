  ZONE01 SLIDE-DECK TEMPLATE. This file is self-contained instruction-wise —
  script.js/style.css are a fixed engine you never need to see or edit.

  Edit only the inline <script> at the bottom of <body>. It's a sequence of
  calls, ending with initSlideDeck() exactly once:

    addContent(html, opts?)
      One slide. HTML classes available: h1 h2 h3 p .lede .callout
      .callout.good .card .grid2 .grid3 <pre><code> (hand-color tokens with
      <span class="tok-kw|tok-type|tok-str|tok-com|tok-num|tok-func">, no
      auto-highlighter exists) .glossary-table/.glossary-strip/.glossary-columns
      (mix all three for variety) .title-slide/.title-badge/.kicker-line
      (title slide only, keep the "ask an AI when stuck" callout as-is).
      opts = { bg: "path/to/image.jpg", overlayAlpha: 0..1 (default 0.5) }
      → optional per-slide background image with a solid readability
      overlay; different slides can use different images or none at all.

    addQuiz(question | [question,...])
      One or more MC questions on one slide.
      question = { q, options:[4 strings], correct: index, explain }
      Rules: options similar length/style; correct-answer slot varies
      across questions; distractors are plausible, never "obviously
      silly"; include at least one distractor ~5 words longer than the
      correct answer somewhere in the deck; one short explain per question.

    addFillBlank(item | [item,...], opts?)
      item = { code (mark blanks with __id__), blanks:[{id,answer}], explain }
      opts = { label, note }

    addMatching(pairs, opts?)
      pairs = [{term, def}, ...]   opts = { label, note }

  Deck structure: title → theory sections (interleave addQuiz() checkpoints
  regularly, not just at the end) → a glossary addContent() may appear
  after ANY section/quiz where it helps (not only once at the very end) →
  one final combined addQuiz() → sources/footer (keep the
  "pavgerin/avgerinos8" credit).

  Never solve the actual exercise — theory/tools only. Prose Greek, code
  comments English. Confirm the section list with the user before writing
  full content, unless already confirmed.
-->

import (
	"fmt"
	"sync"

// [placeholder comment]
func worker(id int, jobs <-chan int, results chan<- int, wg *sync.WaitGroup) {
	defer wg.Done()
	for j := range jobs {
		result := j * 2
		results <- result
	}
	fmt.Println("worker", id, "finished")
}

func main() {
	jobs := make(chan int, 100)
	results := make(chan int, 100)
	var wg sync.WaitGroup

	for w := 1; w <= 3; w++ {
		wg.Add(1)
		go worker(w, jobs, results, &wg)
	}
	close(jobs)
	wg.Wait()
	close(results)
