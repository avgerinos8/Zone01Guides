<div class="eyebrow">Ενότητα 1 / 7 — Τα Βασικά</div>
<h1>Hardware, Software και Λειτουργικό Σύστημα (OS)</h1>
<p>Το hardware είναι το φυσικό μηχάνημα: cpu, memory, storage. Το software είναι οι οδηγίες που εκτελεί το hardware. Ανάμεσά τους βρίσκεται το Λειτουργικό Σύστημα (OS), ένα πρόγραμμα που διαχειρίζεται τους πόρους του υπολογιστή (μνήμη, αρχεία, διεργασίες, συσκευές) και δίνει σε όλα τα υπόλοιπα προγράμματα έναν τρόπο να τους χρησιμοποιήσουν, χωρίς αυτά να χρειάζεται να μιλούν απευθείας στο hardware. Linux, macOS και Windows είναι τρία διαφορετικά λειτουργικά συστήματα, με διαφορετική φιλοσοφία αλλά κοινό σκοπό.</p>

<h2>Γιατί Linux</h2>
<p>Ως developer θα δουλεύεις κυρίως με Linux. Δεν είναι τυχαία επιλογή. Το Linux είναι ανοιχτού κώδικα, δηλαδή μπορεί ο καθένας να δει και να τροποποιήσει πώς λειτουργεί, κάτι που το έχει κάνει το βασικό λειτουργικό σύστημα σε servers, σε cloud υποδομές και στα περισσότερα εργαλεία ανάπτυξης λογισμικού. Σχεδόν κάθε εταιρεία τεχνολογίας τρέχει τον κώδικά της πάνω σε Linux μηχανήματα, ακόμα κι αν οι προγραμματιστές γράφουν τον κώδικα σε Windows ή macOS. Επιπλέον, το Linux σού δίνει άμεση, χωρίς περιορισμούς πρόσβαση στο σύστημα αρχείων και στις διεργασίες, κάτι πολύ σημαντικό όταν μαθαίνεις πώς λειτουργεί πραγματικά ένας υπολογιστής. Γι' αυτό αξίζει να περάσεις χρόνο μέσα σε ένα Linux terminal: οι δεξιότητες που θα αποκτήσεις εδώ μεταφέρονται σχεδόν παντού στη μετέπειτα πορεία σου.</p>

<h2>CLI εναντίον GUI</h2>
<p>Υπάρχουν δύο βασικοί τρόποι να δώσεις εντολές σε ένα λειτουργικό σύστημα. Το GUI (Graphical User Interface) είναι αυτό που ήδη ξέρεις: εικονίδια, παράθυρα, κλικ με το ποντίκι. Το CLI (Command Line Interface) είναι ένα console/terminal, όπου γράφεις εντολές σε μορφή κειμένου και ο υπολογιστής σου απαντάει με κείμενο. Δεν είναι πιο δύσκολο επειδή φαίνεται "παλιομοδίτικο". Είναι πιο άμεσο, πιο γρήγορο για επαναλαμβανόμενες εργασίες, και απαραίτητο όταν δουλεύεις σε servers που δεν έχουν καν οθόνη.</p>

<div class="grid2">
  <div class="card"><h3>GUI</h3><p>Οπτικό, φυσικό, καλό για εξερεύνηση. Δύσκολο να αυτοματοποιηθεί.</p></div>
  <div class="card"><h3>CLI</h3><p>Ακριβές, ιδανικό για επανάληψη και αυτοματισμό. Απαιτεί να θυμάσαι εντολές.</p></div>
</div>

<h2>Τι είναι το Shell</h2>
<p>Το shell είναι το πρόγραμμα που σου δίνει πρόσβαση στο CLI. Διαβάζει ό,τι πληκτρολογείς, το ερμηνεύει, και ζητάει από το λειτουργικό σύστημα να το εκτελέσει. Είναι κυριολεκτικά το "κέλυφος" γύρω από τον πυρήνα του συστήματος: εσύ μιλάς στο shell, το shell μιλάει στο λειτουργικό σύστημα.</p>

<h2>Τι είναι Scripting</h2>
<p>Scripting σημαίνει να γράφεις μια ακολουθία εντολών μέσα σε ένα αρχείο, ώστε να τις εκτελείς όλες μαζί αντί να τις πληκτρολογείς μία-μία κάθε φορά. Ένα shell script είναι απλά ένα αρχείο κειμένου γεμάτο εντολές shell, που το shell διαβάζει και εκτελεί σαν πρόγραμμα. Είναι το πρώτο σκαλί πριν τον προγραμματισμό όπως τον φαντάζεσαι, αφού οι ίδιες λογικές δομές (μεταβλητές, συνθήκες, βρόχοι) εμφανίζονται παντού.</p>

<h2>Η ανατομία μιας εντολής</h2>
<p>Πριν δεις έστω και μία εντολή, αξίζει να ξέρεις ότι σχεδόν όλες έχουν την ίδια δομή. Τρία μέρη, χωρισμένα μεταξύ τους με κενά: το όνομα του προγράμματος, τα flags που αλλάζουν τον τρόπο που δουλεύει, και τα arguments, δηλαδή το πάνω σε τι θα δουλέψει.</p>
<pre><code><span class="tok-func">ls</span> <span class="tok-kw">-l</span> <span class="tok-type">/home</span>
<span class="tok-com"># ls    -> the program name: WHAT you want to run</span>
<span class="tok-com"># -l    -> a flag (option): changes HOW it runs, here "long format"</span>
<span class="tok-com"># /home -> an argument: WHAT the program should work on</span>
</code></pre>
<p>Τα flags γράφονται είτε με μία παύλα και ένα γράμμα (<code>-l</code>), είτε με δύο παύλες και ολόκληρη λέξη (<code>--long</code>). Πολύ συχνά οι δύο μορφές κάνουν ακριβώς το ίδιο πράγμα, με τη δεύτερη να είναι πιο ευανάγνωστη όταν διαβάζεις εντολές κάποιου άλλου. Τα μονογράμματα flags συνδυάζονται και σε ένα: το <code>ls -l -a</code> γράφεται και <code>ls -la</code>. Αν κάτι σου φαίνεται ανεξήγητο σε μια εντολή, σχεδόν πάντα είναι απλώς ένα flag που δεν έχεις ξαναδεί.</p>

<h2>Τι συμβαίνει όταν πατάς Enter</h2>
<p>Η εντολή δεν πηγαίνει κατευθείαν στον επεξεργαστή. Περνάει από μια σειρά βημάτων, και το να τα έχεις στο μυαλό σου βοηθάει τρομερά όταν κάτι δεν δουλεύει όπως περίμενες:</p>
<div class="grid3">
  <div class="card"><h3>1. Ανάγνωση</h3><p>Το shell διαβάζει τη γραμμή που έγραψες και τη σπάει σε λέξεις, με βάση τα κενά.</p></div>
  <div class="card"><h3>2. Επέκταση</h3><p>Αντικαθιστά τα σύμβολα με την πραγματική τους τιμή: το ~ γίνεται ο home φάκελός σου, το *.txt γίνεται λίστα αρχείων.</p></div>
  <div class="card"><h3>3. Εύρεση</h3><p>Ψάχνει σε μια προκαθορισμένη λίστα φακέλων (τη μεταβλητή PATH) το πρόγραμμα με αυτό το όνομα.</p></div>
  <div class="card"><h3>4. Εκτέλεση</h3><p>Ζητάει από το λειτουργικό σύστημα να ξεκινήσει το πρόγραμμα ως νέα διεργασία.</p></div>
  <div class="card"><h3>5. Έξοδος</h3><p>Το πρόγραμμα τυπώνει το αποτέλεσμά του και επιστρέφει έναν κωδικό επιτυχίας ή αποτυχίας.</p></div>
  <div class="card"><h3>6. Επιστροφή</h3><p>Το shell εμφανίζει ξανά το prompt και περιμένει την επόμενη εντολή σου.</p></div>
</div>
<p>Το διάσημο μήνυμα <code>command not found</code> γεννιέται στο βήμα 3. Το πρόγραμμα μπορεί κάλλιστα να υπάρχει στον υπολογιστή σου, αλλά αν ο φάκελός του δεν βρίσκεται μέσα στο PATH, το shell δεν ξέρει πού να ψάξει. Θα δούμε το PATH αναλυτικά στην Ενότητα 6.</p>

<div class="callout">
  <span class="tag">Καλό να ξέρεις</span>
  Κάθε φορά που ανοίγεις ένα "Terminal" app, αυτό που βλέπεις είναι ένα παράθυρο (terminal emulator) που σου δίνει πρόσβαση σε ένα shell. Terminal και shell δεν είναι το ίδιο πράγμα. Το terminal είναι το παράθυρο, το shell είναι το πρόγραμμα που τρέχει μέσα του.
</div>
`);

<div class="eyebrow">Ενότητα 2 / 7 — Shells &amp; WSL</div>
<h1>Ποιο shell θα χρησιμοποιήσεις</h1>
<p class="lede">Υπάρχουν πολλά shells. Δεν χρειάζεται να τα ξέρεις όλα, αλλά είναι καλό να ξέρεις ότι υπάρχουν και τι τα ξεχωρίζει, γιατί θα τα συναντήσεις σε διαφορετικά συστήματα.</p>

<h2>Δημοφιλή shells, επιγραμματικά</h2>
<div class="grid3">
  <div class="card"><h3>bash</h3><p>Το πιο διαδεδομένο σε Linux. Default σε πολλά συστήματα, πλούσιο σε δυνατότητες scripting.</p></div>
  <div class="card"><h3>zsh</h3><p>Επέκταση του bash με περισσότερα extras. Default σε macOS από το 2019.</p></div>
  <div class="card"><h3>PowerShell / cmd</h3><p>Τα shells των Windows. Το cmd είναι το κλασικό, το PowerShell πιο σύγχρονο και object-oriented.</p></div>
</div>

<div class="callout">
  <span class="tag">Γιατί bash</span>
  Σε αυτόν τον οδηγό, όπως και στο μεγαλύτερο μέρος του κλάδου, θα δουλεύουμε με bash. Είναι το πιο κοινό, το πιο τεκμηριωμένο, και οι δεξιότητές του μεταφέρονται σχεδόν παντού.
</div>

<h2>Τι είναι το WSL 2</h2>
<p>Αν βρίσκεσαι σε Windows, το WSL (Windows Subsystem for Linux) σου επιτρέπει να τρέχεις ένα πλήρες περιβάλλον Linux με bash μέσα στα Windows, χωρίς dual-boot ή εικονική μηχανή με την παραδοσιακή έννοια. Το WSL 2 χρησιμοποιεί έναν πραγματικό Linux kernel, για καλύτερη απόδοση και συμβατότητα σε σχέση με το WSL 1.</p>

<h2>Γρήγορη ρύθμιση WSL 2</h2>
<pre><code><span class="tok-com"># Run in PowerShell as Administrator</span>
<span class="tok-func">wsl</span> --install

<span class="tok-com"># Example to install Ubuntu 24.04</span>
<span class="tok-func">wsl</span> --install -d Ubuntu-24.04

<span class="tok-com"># Check installed version</span>
<span class="tok-func">wsl</span> --list --verbose

<span class="tok-com"># Set default version to 2</span>
<span class="tok-func">wsl</span> --set-default-version 2
</code></pre>
<p>Μετά την εγκατάσταση, ανοίγεις το app "Ubuntu" (ή όποια διανομή επέλεξες) από το Start Menu και έχεις ένα πλήρες bash terminal.</p>

<h2>Ποιο shell τρέχω αυτή τη στιγμή;</h2>
<p>Δεν είναι πάντα προφανές ποιο shell είναι ενεργό, ειδικά όταν συνδέεσαι σε ξένο μηχάνημα ή σε server. Δύο γρήγοροι τρόποι να το δεις:</p>
<pre><code><span class="tok-func">echo</span> <span class="tok-kw">$SHELL</span>        <span class="tok-com"># the shell registered as your default login shell</span>
<span class="tok-func">echo</span> <span class="tok-kw">$0</span>            <span class="tok-com"># the shell that is actually running right now</span>
<span class="tok-func">cat</span> /etc/shells     <span class="tok-com"># list every shell installed on this machine</span>
<span class="tok-func">chsh</span> <span class="tok-kw">-s</span> /bin/bash   <span class="tok-com"># change your default shell (applies on next login)</span>
</code></pre>
<div class="callout">
  <span class="tag">Λεπτή διαφορά</span>
  Το <code>$SHELL</code> λέει ποιο shell σου έχει ανατεθεί ως προεπιλογή, όχι απαραίτητα ποιο τρέχει τώρα. Αν ανοίξεις ένα zsh terminal και μέσα του γράψεις <code>bash</code>, το <code>$SHELL</code> θα λέει ακόμα zsh ενώ εσύ βρίσκεσαι ήδη σε bash.
</div>

<h2>Το αρχείο ~/.bashrc</h2>
<p>Κάθε φορά που ανοίγεις ένα νέο διαδραστικό bash terminal, το bash διαβάζει και εκτελεί ένα αρχείο ρυθμίσεων που βρίσκεται στον home φάκελό σου: το <code>~/.bashrc</code>. Ό,τι γράψεις μέσα εκεί ισχύει αυτόματα σε κάθε επόμενο terminal που θα ανοίξεις. Είναι το σημείο όπου μπαίνουν οι προσωπικές σου ρυθμίσεις και, κυρίως, τα aliases: συντομεύσεις που δίνουν δικό σου όνομα σε μια εντολή που πληκτρολογείς συνέχεια.</p>
<pre><code><span class="tok-com"># inside ~/.bashrc</span>
<span class="tok-func">alias</span> ll=<span class="tok-str">'ls -lah'</span>       <span class="tok-com"># typing ll now runs ls -lah</span>
<span class="tok-func">alias</span> gs=<span class="tok-str">'git status'</span>
<span class="tok-func">alias</span> ..=<span class="tok-str">'cd ..'</span>
</code></pre>
<pre><code><span class="tok-func">source</span> ~/.bashrc      <span class="tok-com"># re-read the file so changes apply to the CURRENT terminal too</span>
<span class="tok-func">alias</span>                 <span class="tok-com"># list every alias currently defined</span>
</code></pre>
<p>Χωρίς το <code>source</code>, οι αλλαγές σου θα εμφανιστούν μόνο στο επόμενο terminal που θα ανοίξεις, γιατί το αρχείο διαβάζεται μόνο κατά την εκκίνηση του shell.</p>
`);

<div class="eyebrow">Ενότητα 3 / 7 — Files &amp; Directories</div>
<h1>Πλοηγήσου στο σύστημα αρχείων</h1>
<p class="lede">Το filesystem είναι μια δενδρική δομή φακέλων και αρχείων. Οι παρακάτω εντολές είναι αυτές που θα χρησιμοποιείς κάθε μέρα, πολλαπλές φορές την ημέρα.</p>

<h2>Ποιος είσαι και πού βρίσκεσαι</h2>
<pre><code><span class="tok-func">whoami</span>   <span class="tok-com"># print the current username</span>
<span class="tok-func">pwd</span>      <span class="tok-com"># print working directory — πού βρίσκομαι τώρα</span>
</code></pre>

<h2>Βασικές εντολές πλοήγησης</h2>
<pre><code><span class="tok-func">ls</span>                  <span class="tok-com"># list — τι περιέχει ο τρέχων φάκελος</span>
<span class="tok-func">ls</span> <span class="tok-kw">-a</span>               <span class="tok-com"># list all — δείχνει και τα κρυφά αρχεία</span>
<span class="tok-func">ls</span> <span class="tok-kw">-l</span>               <span class="tok-com"># list σε long form (δικαιώματα, μέγεθος, ημερομηνία)</span>
<span class="tok-func">ls</span> <span class="tok-kw">-l</span> <span class="tok-kw">-h</span>            <span class="tok-com"># long form με human-readable μεγέθη (π.χ. 4.0K αντί για 4096)</span>
<span class="tok-func">ls</span> <span class="tok-kw">-t</span>               <span class="tok-com"># ταξινόμηση κατά ημερομηνία τροποποίησης, το πιο πρόσφατο πρώτο</span>
<span class="tok-func">cd</span> <span class="tok-type">foo</span>              <span class="tok-com"># change directory — μπες στον υποφάκελο foo</span>
<span class="tok-func">cd</span>                  <span class="tok-com"># χωρίς όρισμα, πήγαινε στον home φάκελο</span>
<span class="tok-func">cd</span> ~                <span class="tok-com"># πήγαινε στον home φάκελο (ρητά)</span>
<span class="tok-func">cd</span> ..               <span class="tok-com"># πήγαινε έναν φάκελο πάνω (στον "γονικό" φάκελο)</span>
<span class="tok-func">cd</span> -                <span class="tok-com"># πήγαινε στον προηγούμενο φάκελο που ήσουν</span>
</code></pre>

<h2>Absolute και relative paths</h2>
<p>Path είναι η διεύθυνση ενός αρχείου ή φακέλου μέσα στο filesystem. Υπάρχουν δύο τρόποι να τη γράψεις, και η διαφορά τους είναι από πού ξεκινάς να μετράς.</p>
<pre><code><span class="tok-com"># absolute path: starts from the root of the filesystem, means the same thing from anywhere</span>
/home/student/projects/notes.txt

<span class="tok-com"># relative path: starts from wherever you happen to be standing right now</span>
projects/notes.txt
</code></pre>
<div class="grid3">
  <div class="card"><h3>/</h3><p>Η ρίζα (root) όλου του filesystem. Κάθε absolute path ξεκινά από εδώ, γι' αυτό και αναγνωρίζεται αμέσως.</p></div>
  <div class="card"><h3>.</h3><p>Ο τρέχων φάκελος. Το <code>./script.sh</code> σημαίνει "το script που βρίσκεται ακριβώς εδώ".</p></div>
  <div class="card"><h3>..</h3><p>Ο γονικός φάκελος, ένα επίπεδο πάνω. Συνδυάζεται με τον εαυτό του: <code>../../foo</code>.</p></div>
  <div class="card"><h3>~</h3><p>Ο home φάκελός σου, π.χ. /home/student. Λειτουργεί σαν συντόμευση μέσα σε οποιοδήποτε path.</p></div>
  <div class="card"><h3>-</h3><p>Δεν είναι path, αλλά χρησιμοποιείται σαν τέτοιο από το cd: "ο φάκελος στον οποίο ήμουν πριν".</p></div>
  <div class="card"><h3>/home</h3><p>Ο φάκελος που περιέχει τους προσωπικούς φακέλους όλων των χρηστών του μηχανήματος.</p></div>
</div>
<p>Ας το δούμε πάνω σε ένα συγκεκριμένο δέντρο:</p>
<pre><code>/home/student
├── notes.txt
└── projects
    ├── go-project
    │   └── main.go
    └── bash-project
</code></pre>


<div class="callout">
  <span class="tag">Αρχεία, Φάκελοι &amp; Επεκτάσεις</span>
  <p><strong>Πώς τα ξεχωρίζουμε:</strong>
  <ul>
    <li><strong>Αρχείο (File):</strong> Περιέχει δεδομένα (κείμενο, κώδικα, εικόνα). Συνήθως τελειώνει σε κατάληξη (extension) όπως <code>.go</code>, <code>.txt</code>, <code>.sh</code> (π.χ. <code>main.go</code>, <code>notes.txt</code>).</li>
    <li><strong>Φάκελος (Directory):</strong> Περιέχει άλλα αρχεία ή φακέλους (π.χ. <code>projects</code>, <code>go-project</code>). Συχνά προσθέτουμε ένα <code>/</code> στο τέλος (<code>projects/</code>) για να δηλώσουμε ρητά ότι πρόκειται για φάκελο.</li>
  </ul>
  <p>
  Όταν βλέπεις μια τελεία σε ένα όνομα, η θέση της αλλάζει εντελώς τη σημασία της:
</p>
<p>
  Αν η τελεία βρίσκεται στο τέλος, όπως στο <code>name.something</code> (π.χ. <code>main.go</code>, <code>script.sh</code>), το τμήμα μετά την τελεία είναι η επέκταση (extension) που δηλώνει τον τύπο του αρχείου — για παράδειγμα, το <code>.go</code> φανερώνει πηγαίο κώδικα Go και το <code>.txt</code> απλό κείμενο. 
  Αντίθετα, όταν η τελεία βρίσκεται στην αρχή του ονόματος (π.χ. <code>.git</code>, <code>.env</code>, <code>.bashrc</code>), δηλώνει ότι το αρχείο ή ο φάκελος είναι <strong>κρυφός</strong>. Το σύστημα αποκρύπτει αυτά τα στοιχεία από την απλή εντολή <code>ls</code> (απαιτείται <code>ls -a</code> για να εμφανιστούν) και χρησιμοποιούνται συνήθως για αρχεία ρυθμίσεων (configuration).
  Σημείωσε ότι στο Linux η επέκταση δεν είναι υποχρεωτική για να αναγνωριστεί ένα αρχείο, σε αντίθεση με τα Windows όπου το extension καθορίζει με ποιο πρόγραμμα θα ανοίξει (αν και εξ ορισμού είναι κρυμμένο από τον χρήστη).
</p>
<p><strong>Παραδείγματα:</strong></p>
  <ul>
    <li><code>main.go</code> &rarr; Αρχείο κειμένου που περιέχει πηγαίο κώδικα Go.</li>
    <li><code>notes.txt</code> &rarr; Αρχείο απλού κειμένου (plain text).</li>
    <li><code>go-project</code> &rarr; Φάκελος (directory). Δεν έχει κατάληξη, αν και <em>θα μπορούσε</em> θεωρητικά να έχει τελεία στο όνομά του.</li>
    <li><code>.gitignore</code> &rarr; <strong>Κρυφό αρχείο:</strong> Κάθε αρχείο ή φάκελος που ξεκινάει με τελεία (<code>.</code>) είναι κρυφό στο filesystem και εμφανίζεται μόνο με την εντολή <code>ls -a</code>.</li>
  </ul>
</div>

<p>Αν αυτή τη στιγμή βρίσκεσαι μέσα στο <code>/home/student/projects/go-project</code>, όλα τα παρακάτω δείχνουν σωστά:</p>
<pre><code><span class="tok-func">cat</span> <span class="tok-type">main.go</span>                  <span class="tok-com"># relative: a file right next to me</span>
<span class="tok-func">cd</span> ..                        <span class="tok-com"># -> /home/student/projects</span>
<span class="tok-func">cd</span> ../bash-project           <span class="tok-com"># -> sideways, into a sibling folder</span>
<span class="tok-func">cat</span> ../../notes.txt          <span class="tok-com"># two levels up, then read the file</span>
<span class="tok-func">cat</span> /home/student/notes.txt  <span class="tok-com"># absolute: same file, works from anywhere</span>
</code></pre>
<div class="callout good">
  <span class="tag">Πρακτικός κανόνας</span>
  Μέσα σε ένα project χρησιμοποίησε relative paths, ώστε ο κώδικας να δουλεύει σε όλους τους υπολογιστές. Όταν αναφέρεσαι σε κάτι του συστήματος, χρησιμοποίησε absolute path, ώστε να μη σε νοιάζει από πού τρέχει η εντολή.
</div>

<h2>Κρυφά αρχεία</h2>
<p>Κάθε αρχείο ή φάκελος του οποίου το όνομα ξεκινά με τελεία θεωρείται κρυφό και δεν εμφανίζεται στην απλή <code>ls</code>. Δεν υπάρχει καμία ειδική προστασία από πίσω, ούτε κάποιο ξεχωριστό flag στο αρχείο: είναι απλώς μια σύμβαση για την τελεία στην αρχή του ονόματος. Έτσι κρύβονται τα αρχεία ρυθμίσεων, όπως το <code>.bashrc</code> ή ο φάκελος <code>.git</code>, για να μη γεμίζουν την οθόνη σου κάθε φορά.</p>
<pre><code><span class="tok-func">ls</span>       <span class="tok-com"># notes.txt  projects</span>
<span class="tok-func">ls</span> <span class="tok-kw">-a</span>    <span class="tok-com"># .  ..  .bashrc  .git  notes.txt  projects</span>
</code></pre>
<p>Πρόσεξε ότι η <code>ls -a</code> εμφανίζει και δύο "περίεργες" καταχωρήσεις: το <code>.</code> και το <code>..</code>. Δεν είναι σκουπίδια, είναι πραγματικές καταχωρήσεις που υπάρχουν μέσα σε κάθε φάκελο και δείχνουν στον ίδιο τον φάκελο και στον γονέα του αντίστοιχα. Ακριβώς γι' αυτό λειτουργεί το <code>cd ..</code> από οπουδήποτε.</p>

<h2>Λεπτομέρειες αρχείων και φακέλων</h2>
<p>Οι εντολές <code>ls -l</code> και <code>stat</code> δίνουν διαφορετικού βάθους πληροφορία. Η <code>tree</code> δείχνει ολόκληρη τη δομή σε μορφή δέντρου, κάτι πολύ χρήσιμο όταν θέλεις να καταλάβεις γρήγορα πώς είναι οργανωμένο ένα project.</p>
<pre><code><span class="tok-func">stat</span> <span class="tok-type">foo.txt</span>    <span class="tok-com"># μέγεθος, ημερομηνία δημιουργίας και τροποποίησης ενός αρχείου</span>
<span class="tok-func">stat</span> <span class="tok-type">foo</span>        <span class="tok-com"># το ίδιο, αλλά για φάκελο</span>
<span class="tok-func">tree</span>            <span class="tok-com"># δέντρο φακέλων και αρχείων</span>
<span class="tok-func">tree</span> <span class="tok-kw">-a</span>         <span class="tok-com"># δέντρο συμπεριλαμβανομένων κρυφών αρχείων</span>
<span class="tok-func">tree</span> <span class="tok-kw">-d</span>         <span class="tok-com"># δέντρο μόνο με φακέλους, χωρίς αρχεία</span>
</code></pre>

<h2>Διαβάζοντας την έξοδο της ls -l</h2>
<p>Η <code>ls -l</code> είναι από τις εντολές που θα τρέχεις καθημερινά, οπότε αξίζει να ξέρεις τι σημαίνει η κάθε στήλη της:</p>
<pre><code>-rw-r--r--  1  student  student  220  Aug 18 10:12  notes.txt
<span class="tok-com"># -rw-r--r--     -> file type + permissions (Ενότητα 6)</span>
<span class="tok-com"># 1              -> number of hard links to this file</span>
<span class="tok-com"># student student-> the owner, and the group it belongs to</span>
<span class="tok-com"># 220            -> size in bytes (use -h for a human-readable form)</span>
<span class="tok-com"># Aug 18 10:12   -> last modification date and time</span>
<span class="tok-com"># notes.txt      -> the name</span>
</code></pre>
<p>Ο πρώτος χαρακτήρας της πρώτης στήλης λέει τι είδους καταχώρηση είναι: παύλα για κανονικό αρχείο, <code>d</code> για φάκελο (directory), <code>l</code> για symbolic link. Τα υπόλοιπα εννιά γράμματα είναι τα δικαιώματα, που θα τα αναλύσουμε στην Ενότητα 6.</p>

<h2>Δημιουργία φακέλων</h2>
<pre><code><span class="tok-func">mkdir</span> <span class="tok-type">foo</span>                    <span class="tok-com"># create a directory</span>
<span class="tok-func">mkdir</span> <span class="tok-type">foo bar</span>                <span class="tok-com"># create multiple directories at once</span>
<span class="tok-func">mkdir</span> <span class="tok-kw">-p</span> <span class="tok-type">foo/bar</span>             <span class="tok-com"># create nested directories (parents), ακόμα κι αν το foo δεν υπάρχει ακόμα</span>
<span class="tok-func">mkdir</span> <span class="tok-kw">-p</span> <span class="tok-type">{foo,bar}/baz</span>       <span class="tok-com"># brace expansion: δημιουργεί foo/baz ΚΑΙ bar/baz</span>
<span class="tok-func">mktemp</span> <span class="tok-kw">-d</span>                    <span class="tok-com"># create a temporary directory με μοναδικό όνομα</span>
</code></pre>

<h2>Αντιγραφή, μετακίνηση, διαγραφή</h2>
<pre><code><span class="tok-func">cp</span> <span class="tok-kw">--recursive</span> <span class="tok-type">foo bar</span>  <span class="tok-com"># copy an entire directory (recursive, δηλαδή μαζί με το περιεχόμενό της)</span>
<span class="tok-func">mv</span> <span class="tok-type">foo bar</span>              <span class="tok-com"># move / rename a directory or file</span>
<span class="tok-func">rmdir</span> <span class="tok-type">foo</span>               <span class="tok-com"># delete an EMPTY directory</span>
<span class="tok-func">rm</span> <span class="tok-kw">-r</span> <span class="tok-type">foo</span>               <span class="tok-com"># delete a directory including its contents</span>
<span class="tok-func">rm</span> <span class="tok-kw">-r</span> <span class="tok-kw">-f</span> <span class="tok-type">foo</span>            <span class="tok-com"># same, but never prompt and ignore nonexistent files</span>
</code></pre>

<div class="callout">
  <span class="tag">Προσοχή</span>
  Η <code>rm</code> δεν στέλνει αρχεία σε κάδο ανακύκλωσης. Μόλις διαγραφεί κάτι, χάθηκε. Πρόσεξε ιδιαίτερα με το <code>rm -rf</code>.
</div>

<h2>Δημιουργία αρχείων</h2>
<pre><code><span class="tok-func">touch</span> <span class="tok-type">foo.txt</span>            <span class="tok-com"># create an empty file, ή ενημέρωσε το timestamp αν υπάρχει ήδη</span>
<span class="tok-func">touch</span> <span class="tok-type">foo.txt bar.txt</span>    <span class="tok-com"># create multiple files</span>
<span class="tok-func">touch</span> <span class="tok-type">{foo,bar}.txt</span>      <span class="tok-com"># brace expansion — ίδιο αποτέλεσμα με την προηγούμενη γραμμή</span>
<span class="tok-func">touch</span> <span class="tok-type">test{1..3}</span>         <span class="tok-com"># δημιουργεί test1, test2, test3</span>
<span class="tok-func">touch</span> <span class="tok-type">test{a..c}</span>         <span class="tok-com"># δημιουργεί testa, testb, testc</span>
</code></pre>

<h2>Άνοιγμα αρχείων σε editor</h2>
<pre><code><span class="tok-func">code</span> <span class="tok-type">foo.sh</span>    <span class="tok-com"># open a file in Visual Studio Code</span>
<span class="tok-func">open</span> <span class="tok-type">foo.txt</span>   <span class="tok-com"># open a file with the system's default application</span>
</code></pre>

<h2>Εύρεση αρχείων και βασικές εντολές</h2>

</div>

    addContent(`
<div class="eyebrow">Ενότητα 3.5 / 7 — Git</div>
<h1>Το εργαλείο που θυμάται κάθε αλλαγή στον κώδικά σου</h1>
<p class="lede">Πριν προχωρήσουμε στο επόμενο κομμάτι του shell, ας δούμε ένα εργαλείο που θα χρησιμοποιείς σε κάθε project από εδώ και πέρα: το Git.</p>

<h2>Τι είναι το Git</h2>
<p>Το Git είναι ένα σύστημα ελέγχου εκδόσεων (version control system). Κρατάει ιστορικό όλων των αλλαγών που έχεις κάνει σε ένα project, ώστε να μπορείς ανά πάσα στιγμή να δεις τι άλλαξε, ποιος το άλλαξε, και να επιστρέψεις σε παλιότερη έκδοση αν κάτι πάει στραβά. Κάθε φορά που αποθηκεύεις μια ομάδα αλλαγών, δημιουργείς ένα commit, ένα στιγμιότυπο του project εκείνη τη στιγμή.</p>

<h2>Γιατί το χρησιμοποιούμε</h2>
<p>Χωρίς Git, η μόνη επιλογή για να κρατήσεις ιστορικό είναι να αντιγράφεις χειροκίνητα φακέλους με ονόματα όπως project_final, project_final_v2, project_final_REALLY_final. Το Git λύνει αυτό το πρόβλημα αυτόματα, αλλά ο πραγματικός λόγος που είναι απαραίτητο είναι η συνεργασία. Όταν δουλεύεις σε ομάδα, το Git επιτρέπει σε πολλά άτομα να δουλεύουν στο ίδιο project ταυτόχρονα, χωρίς να διαγράφει ο ένας τη δουλειά του άλλου, και δίνει έναν σαφή τρόπο να ενώσεις τη δουλειά όλων μαζί. Είναι επίσης το εργαλείο που στέκεται πίσω από πλατφόρμες όπως το GitHub, όπου φιλοξενείται σχεδόν όλος ο ανοιχτός κώδικας του κόσμου.</p>

<div class="callout">
  <span class="tag">Git εναντίον GitHub</span>
  Το Git είναι το ίδιο το εργαλείο version control, τρέχει τοπικά στον υπολογιστή σου. Το GitHub είναι μια online υπηρεσία που φιλοξενεί Git repositories και προσθέτει εργαλεία συνεργασίας από πάνω, όπως τα pull requests που θα δούμε παρακάτω. Θα μπορούσες να χρησιμοποιείς Git χωρίς ποτέ να αγγίξεις το GitHub.
</div>

<h2>Ρύθμιση ταυτότητας</h2>
<p>Πριν κάνεις το πρώτο σου commit οπουδήποτε, το Git χρειάζεται να ξέρει ποιος είσαι, ώστε κάθε commit να έχει συνδεδεμένο το όνομα και το email σου:</p>
<pre><code><span class="tok-func">git</span> config --global user.name <span class="tok-str">"giteausername"</span>
<span class="tok-func">git</span> config --global user.email <span class="tok-str">"gmail@gmail.com"</span>
<span class="tok-func">git</span> config --global credential.helper store
<span class="tok-com"># the last line saves your login credentials locally, so you don't retype them on every push</span>
</code></pre>
<p>Το <code>--global</code> σημαίνει ότι αυτή η ρύθμιση ισχύει για όλα τα repositories στον υπολογιστή σου, όχι μόνο για ένα.</p>

<h2>Ξεκινώντας ένα repository</h2>
<pre><code><span class="tok-func">git</span> init               <span class="tok-com"># turn the current folder into a new Git repository</span>
<span class="tok-func">git</span> clone <span class="tok-type">url</span>          <span class="tok-com"># download an existing repository from somewhere (e.g. GitHub) to your machine</span>
</code></pre>

<h2>Οι τρεις περιοχές του Git</h2>
<p>Το Git μοιράζει τη δουλειά σου σε τρεις περιοχές. Αν καταλάβεις αυτές τις τρεις, όλες οι εντολές που ακολουθούν παύουν να είναι απομνημόνευση και γίνονται λογική:</p>
<div class="grid3">
  <div class="card"><h3>1. Working Directory</h3><p>Τα αρχεία όπως τα βλέπεις και τα επεξεργάζεσαι αυτή τη στιγμή στον δίσκο σου.</p></div>
  <div class="card"><h3>2. Staging Area</h3><p>Το "καλάθι" με τις αλλαγές που έχεις διαλέξει να μπουν στο επόμενο commit.</p></div>
  <div class="card"><h3>3. Repository</h3><p>Το μόνιμο ιστορικό: όλα τα commits που έχεις ήδη αποθηκεύσει, με τη σειρά τους.</p></div>
</div>
<p>Το <code>git add</code> μετακινεί αλλαγές από το 1 στο 2, το <code>git commit</code> από το 2 στο 3, και το <code>git push</code> στέλνει το τοπικό 3 στο αντίγραφο που ζει στο remote, π.χ. στο GitHub.</p>

<h2>Ο βασικός κύκλος: add, commit, push</h2>
<p>Αυτός είναι ο κύκλος που θα επαναλαμβάνεις κάθε φορά που θέλεις να αποθηκεύσεις πρόοδο:</p>
<pre><code><span class="tok-func">git</span> add <span class="tok-type">filename</span>          <span class="tok-com"># stage a specific file — mark it as "ready to be committed"</span>
<span class="tok-func">git</span> add .                 <span class="tok-com"># stage EVERY changed file in the current folder and below</span>
<span class="tok-func">git</span> commit -m <span class="tok-str">"message"</span>   <span class="tok-com"># save the staged changes as a new snapshot, with a description</span>
<span class="tok-func">git</span> push                  <span class="tok-com"># upload your commits to the remote repository (e.g. GitHub)</span>
</code></pre>
<div class="callout good">
  <span class="tag">Γιατί δύο βήματα (add και commit)</span>
  Το add βάζει αλλαγές στο "staging area", ένα ενδιάμεσο σημείο πριν το commit. Αυτό σου επιτρέπει να επιλέξεις ακριβώς ποιες αλλαγές θα μπουν στο επόμενο commit, ακόμα κι αν έχεις αλλάξει πολλά αρχεία ταυτόχρονα.
</div>

<h2>Πού βρίσκομαι; status, log, diff</h2>
<p>Ο κύκλος add-commit-push είναι το τι γράφεις. Οι τρεις εντολές που ακολουθούν είναι το τι βλέπεις, και στην πράξη θα τις τρέχεις πιο συχνά από όλες τις άλλες μαζί:</p>
<pre><code><span class="tok-func">git</span> status              <span class="tok-com"># what changed, what is staged, which branch you are on</span>
<span class="tok-func">git</span> log                 <span class="tok-com"># full history of commits, newest first (press q to quit)</span>
<span class="tok-func">git</span> log --oneline       <span class="tok-com"># the same history, one compact line per commit</span>
<span class="tok-func">git</span> diff                <span class="tok-com"># line-by-line changes you made but have NOT staged yet</span>
<span class="tok-func">git</span> diff --staged       <span class="tok-com"># line-by-line changes that WILL go into the next commit</span>
</code></pre>
<div class="callout good">
  <span class="tag">Αν κρατήσεις μία εντολή</span>
  Κράτα το <code>git status</code>. Σου λέει σε ποιο branch είσαι, ποια αρχεία άλλαξες, ποια είναι ήδη staged, και συνήθως προτείνει από μόνο του την εντολή που χρειάζεσαι για το επόμενο βήμα. Τρέξ' το πριν και μετά από κάθε άλλη εντολή Git όσο μαθαίνεις.
</div>

<h2>Branches</h2>
<p>Ένα branch είναι ένα ανεξάρτητο "παράλληλο" αντίγραφο του project, όπου μπορείς να κάνεις αλλαγές χωρίς να επηρεάζεις το κύριο branch (συνήθως ονομάζεται main ή master), μέχρι να είσαι σίγουρος ότι η δουλειά σου είναι έτοιμη. Αυτό είναι ιδιαίτερα χρήσιμο σε ομαδική δουλειά: κάθε άτομο δουλεύει στο δικό του branch, χωρίς κίνδυνο να χαλάσει τη δουλειά των άλλων.</p>
<pre><code><span class="tok-func">git</span> branch                <span class="tok-com"># list all branches in this repository</span>
<span class="tok-func">git</span> checkout <span class="tok-type">branch-name</span>  <span class="tok-com"># switch to an existing branch</span>
<span class="tok-func">git</span> checkout -b <span class="tok-type">new-name</span>  <span class="tok-com"># create a NEW branch and switch to it immediately</span>
</code></pre>

<h2>fetch, pull, merge, εισαγωγικά</h2>
<p>Το <code>git fetch</code> κατεβάζει τις τελευταίες αλλαγές από το remote repository, χωρίς όμως να τις εφαρμόζει ακόμα στη δική σου δουλειά. Το <code>git pull</code> κάνει το ίδιο, αλλά τις εφαρμόζει αμέσως. Το <code>git merge</code> ενώνει τη δουλειά ενός branch μέσα σε ένα άλλο.</p>
<pre><code><span class="tok-func">git</span> fetch    <span class="tok-com"># download the latest changes from the remote, without applying them yet</span>
<span class="tok-func">git</span> pull     <span class="tok-com"># download AND apply the latest changes to your current branch</span>
<span class="tok-func">git</span> merge <span class="tok-type">branch-name</span>  <span class="tok-com"># bring the changes from another branch into the one you're on</span>
</code></pre>

<h2>.gitignore, τι ΔΕΝ μπαίνει στο repository</h2>
<p>Δεν θέλεις να μπαίνουν όλα τα αρχεία στο ιστορικό. Τα εκτελέσιμα που παράγει ο compiler, οι προσωπικοί σου κωδικοί, τα προσωρινά αρχεία του editor: όλα αυτά είτε ξαναφτιάχνονται από μόνα τους, είτε δεν πρέπει ποτέ να δημοσιευτούν. Φτιάχνεις ένα αρχείο με όνομα <code>.gitignore</code> στη ρίζα του project και γράφεις μέσα ένα pattern ανά γραμμή:</p>
<pre><code><span class="tok-com"># inside .gitignore</span>
*.exe          <span class="tok-com"># every compiled binary</span>
.env           <span class="tok-com"># secrets and passwords, never commit these</span>
node_modules/  <span class="tok-com"># a whole folder, note the trailing slash</span>
*.log
</code></pre>
<p>Το <code>.gitignore</code> είναι το ίδιο ένα κανονικό αρχείο του project, οπότε το κάνεις κι αυτό commit: έτσι ισχύει για όλη την ομάδα, όχι μόνο για σένα.</p>

<h2>Merge conflicts, μια πρώτη ματιά</h2>
<p>Όταν δύο άτομα αλλάξουν την ίδια γραμμή του ίδιου αρχείου, το Git δεν μπορεί να αποφασίσει ποια εκδοχή είναι η σωστή, οπότε σταματάει και σου το αφήνει. Αυτό λέγεται merge conflict, και δεν είναι σφάλμα ούτε καταστροφή. Το Git σημειώνει και τις δύο εκδοχές μέσα στο αρχείο:</p>
<pre><code>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD
echo "my version of the line"
=======
echo "my teammate's version of the line"
&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature-branch
</code></pre>

<div class="eyebrow">Ενότητα 4 / 7 — Ροές &amp; Σωλήνες</div>
<h1>stdin, stdout, stderr, και πώς τα ενώνουμε</h1>
<p class="lede">Αυτό είναι ένα από τα πιο δυνατά χαρακτηριστικά της φιλοσοφίας του Unix: κάθε πρόγραμμα έχει τρεις ροές επικοινωνίας, και μπορούμε να τις συνδέσουμε μεταξύ τους ή με αρχεία.</p>

<h2>Οι τρεις standard streams</h2>
<div class="grid3">
  <div class="card"><h3>stdin (0)</h3><p>Η ροή εισόδου. Από πού διαβάζει το πρόγραμμα δεδομένα (default: το πληκτρολόγιο).</p></div>
  <div class="card"><h3>stdout (1)</h3><p>Η ροή κανονικής εξόδου. Εκεί γράφει το πρόγραμμα τα αποτελέσματά του (default: η οθόνη).</p></div>
  <div class="card"><h3>stderr (2)</h3><p>Η ροή σφαλμάτων, ξεχωριστή από το stdout, ώστε τα λάθη να μη μπερδεύονται με τα κανονικά δεδομένα.</p></div>
</div>

<h2>Redirection εξόδου, εισόδου, σφαλμάτων</h2>
<pre><code><span class="tok-func">echo</span> <span class="tok-str">"foo"</span> <span class="tok-kw">&gt;</span> <span class="tok-type">bar.txt</span>       <span class="tok-com"># overwrite a file with new content</span>
<span class="tok-func">echo</span> <span class="tok-str">"foo"</span> <span class="tok-kw">&gt;&gt;</span> <span class="tok-type">bar.txt</span>      <span class="tok-com"># append content to a file instead of overwriting</span>

<span class="tok-func">ls</span> <span class="tok-type">exists</span> 1<span class="tok-kw">&gt;</span> <span class="tok-type">stdout.txt</span>   <span class="tok-com"># redirect standard output to a file (1 is optional, it's the default)</span>
<span class="tok-func">ls</span> <span class="tok-type">noexist</span> 2<span class="tok-kw">&gt;</span> <span class="tok-type">stderror.txt</span>  <span class="tok-com"># redirect standard error to a file</span>
<span class="tok-func">ls</span> <span class="tok-kw">&gt;</span> <span class="tok-type">out.txt</span> 2<span class="tok-kw">&gt;&amp;1</span>   <span class="tok-com"># stdout to the file, then send stderr wherever stdout goes</span>
<span class="tok-func">ls</span> <span class="tok-kw">&amp;&gt;</span> <span class="tok-type">out.txt</span>          <span class="tok-com"># bash shorthand for exactly the same thing</span>
<span class="tok-func">ls</span> <span class="tok-kw">&gt;</span> /dev/null       <span class="tok-com"># discard the output entirely — /dev/null is a "black hole"</span>

<span class="tok-func">sort</span> <span class="tok-kw">&lt;</span> <span class="tok-type">input.txt</span>         <span class="tok-com"># redirect a file's content into a program's stdin</span>
<span class="tok-func">read</span> <span class="tok-type">foo</span>                <span class="tok-com"># read from stdin and store it in the variable foo</span>
</code></pre>

<div class="callout">
  <span class="tag">Η σειρά μετράει</span>
  Το <code>2&gt;&amp;1</code> δεν σημαίνει "στείλε το stderr σε αρχείο", σημαίνει "στείλε το stderr όπου δείχνει αυτή τη στιγμή το stdout". Γι' αυτό μπαίνει πάντα ΜΕΤΑ το <code>&gt; out.txt</code>. Αν το γράψεις ανάποδα, το <code>ls 2&gt;&amp;1 &gt; out.txt</code>, το stderr αντιγράφει τον προορισμό που είχε τότε το stdout, δηλαδή την οθόνη, και μετά μόνο το stdout ανακατευθύνεται στο αρχείο. Το αποτέλεσμα είναι ακριβώς το αντίθετο από αυτό που ήθελες.
</div>

<h2>Pipes — σύνδεσε προγράμματα μεταξύ τους</h2>
<p>Το σύμβολο <code>|</code> (pipe) παίρνει το stdout ενός προγράμματος και το κάνει stdin του επόμενου. Έτσι μπορείς να χτίσεις αλυσίδες εντολών, όπου η καθεμία κάνει μια απλή δουλειά, αλλά μαζί λύνουν πολύπλοκα προβλήματα.</p>
<pre><code><span class="tok-func">ls</span> <span class="tok-kw">|</span> <span class="tok-func">wc</span> <span class="tok-kw">-l</span>
<span class="tok-com">// list files → count how many lines (i.e. how many files/folders) came out</span>
</code></pre>
<div class="callout">
  <span class="tag">Θα το ξαναδούμε</span>
  Σε πιο σύνθετα pipes θα συναντήσεις και εντολές φιλτραρίσματος κειμένου όπως το <code>grep</code>, που δεν έχουμε δει ακόμα. Θα το αναλύσουμε αναλυτικά στην επόμενη ενότητα. Προς το παρόν, κράτα ότι κάθε τέτοια εντολή απλά διαβάζει από το stdin της και γράφει στο stdout της, όπως ακριβώς και οι εντολές που ήδη ξέρεις.
</div>

<h2>Χτίζοντας ένα pipeline βήμα-βήμα</h2>
<p>Τα pipes δεν γράφονται ολόκληρα με τη μία. Ο τρόπος που δουλεύει κανείς στην πράξη είναι να προσθέτει ένα κομμάτι κάθε φορά και να κοιτάει το αποτέλεσμα. Έστω ότι θέλουμε να μετρήσουμε πόσες φορές εμφανίζεται σφάλμα 404 σε ένα log αρχείο:</p>
<pre><code><span class="tok-func">cat</span> <span class="tok-type">access.log</span>                        <span class="tok-com"># step 1: see everything (too much)</span>
<span class="tok-func">cat</span> <span class="tok-type">access.log</span> <span class="tok-kw">|</span> <span class="tok-func">grep</span> <span class="tok-str">'404'</span>           <span class="tok-com"># step 2: keep only the lines that matter</span>
<span class="tok-func">cat</span> <span class="tok-type">access.log</span> <span class="tok-kw">|</span> <span class="tok-func">grep</span> <span class="tok-str">'404'</span> <span class="tok-kw">|</span> <span class="tok-func">wc</span> <span class="tok-kw">-l</span>   <span class="tok-com"># step 3: count them</span>
</code></pre>
<p>Κάθε κρίκος της αλυσίδας δεν ξέρει τίποτα για τους υπόλοιπους. Το <code>grep</code> δεν έχει ιδέα ότι τα δεδομένα του ήρθαν από αρχείο και όχι από πληκτρολόγιο, και το <code>wc</code> δεν ξέρει ότι κάποιος τα φιλτράρισε πριν. Το μόνο που κάνει το καθένα είναι να διαβάζει από το stdin του και να γράφει στο stdout του. Αυτή ακριβώς η άγνοια είναι που τα κάνει συνδυάσιμα με άπειρους τρόπους.</p>

<div class="callout">
  <span class="tag">Τι ΔΕΝ περνάει από το pipe</span>
  Το <code>|</code> μεταφέρει μόνο το stdout. Το stderr συνεχίζει να πηγαίνει κατευθείαν στην οθόνη σου, ακόμα κι αν βρίσκεται στη μέση ενός τεράστιου pipeline. Γι' αυτό βλέπεις μηνύματα λάθους ενώ το τελικό αποτέλεσμα είναι κενό: το λάθος δεν μπήκε ποτέ στον σωλήνα. Αν θέλεις να περάσει και αυτό, το ζητάς ρητά με <code>cmd 2&gt;&amp;1 | grep foo</code>.
</div>

<h2>Command Substitution &amp; Process Substitution</h2>
<p>Command substitution τρέχει μια εντολή και αντικαθιστά το αποτέλεσμά της μέσα σε άλλη εντολή, χρησιμοποιώντας <code>$(...)</code>:</p>
<pre><code>today=<span class="tok-kw">$(</span><span class="tok-func">date</span> +%Y-%m-%d<span class="tok-kw">)</span>
<span class="tok-func">echo</span> <span class="tok-str">"Today is $today"</span>
</code></pre>
<p>Process substitution είναι πιο προχωρημένο: επιτρέπει να αντιμετωπίσεις την έξοδο μιας εντολής σαν να ήταν αρχείο, χρησιμοποιώντας <code>&lt;(...)</code>. Χρήσιμο όταν μια εντολή περιμένει filename ως όρισμα, αντί για δεδομένα από pipe.</p>
<pre><code><span class="tok-func">diff</span> <span class="tok-kw">&lt;(</span><span class="tok-func">sort</span> a.txt<span class="tok-kw">)</span> <span class="tok-kw">&lt;(</span><span class="tok-func">sort</span> b.txt<span class="tok-kw">)</span>
<span class="tok-com">// compare the sorted output of two files without creating temp files</span>
</code></pre>
`);

<h1>Τα εργαλεία που κόβουν, φιλτράρουν και μετράνε κείμενο</h1>
<p class="lede">Η φιλοσοφία του Unix λέει ότι κάθε εργαλείο κάνει μία δουλειά καλά, και τα συνδυάζεις με pipes για να λύσεις πολύπλοκα προβλήματα. Εδώ βρίσκονται τα πιο χρησιμοποιούμενα εργαλεία επεξεργασίας κειμένου, όπως το grep που αναφέραμε στην προηγούμενη ενότητα.</p>

<h2>Προβολή αρχείων</h2>
<pre><code><span class="tok-func">cat</span> <span class="tok-type">file.txt</span>       <span class="tok-com"># print the whole file at once</span>

<h2>wc — μέτρησε γραμμές, λέξεις, χαρακτήρες</h2>

</code></pre>

<h2>grep — Global Regular Expression Print</h2>
<p>Το grep ψάχνει μέσα σε κείμενο για γραμμές που ταιριάζουν με ένα pattern. Είναι από τα εργαλεία που θα χρησιμοποιείς περισσότερο από όλα, γι' αυτό αξίζει να δεις αρκετά από τα flags του:</p>
<pre><code><span class="tok-func">grep</span> <span class="tok-str">'foo'</span> <span class="tok-type">bar.txt</span>                 <span class="tok-com"># search for "foo" inside bar.txt</span>
<span class="tok-func">grep</span> <span class="tok-kw">-r</span> <span class="tok-str">'foo'</span> <span class="tok-type">bar/</span>               <span class="tok-com"># --recursive: search inside every file in the directory</span>

<span class="tok-func">grep</span> <span class="tok-kw">-l</span> <span class="tok-str">'foo'</span> <span class="tok-type">bar/*</span>              <span class="tok-com"># --files-with-matches: show only filenames that matched</span>
<span class="tok-func">grep</span> <span class="tok-kw">-L</span> <span class="tok-str">'foo'</span> <span class="tok-type">bar/*</span>              <span class="tok-com"># --files-without-match: show only filenames that DIDN'T match</span>
<span class="tok-func">grep</span> <span class="tok-kw">-v</span> <span class="tok-str">'foo'</span> <span class="tok-type">bar.txt</span>              <span class="tok-com"># --invert-match: show only lines that DON'T match</span>
<span class="tok-func">grep</span> <span class="tok-kw">-c</span> <span class="tok-str">'foo'</span> <span class="tok-type">bar.txt</span>              <span class="tok-com"># --count: count matching lines instead of printing them</span>
<span class="tok-func">grep</span> <span class="tok-kw">-n</span> <span class="tok-str">'foo'</span> <span class="tok-type">bar.txt</span>              <span class="tok-com"># --line-number: show the line number of each match</span>
<span class="tok-func">grep</span> <span class="tok-kw">-x</span> <span class="tok-str">'foo'</span> <span class="tok-type">bar.txt</span>              <span class="tok-com"># --line-regexp: match only if the ENTIRE line equals the pattern</span>
<span class="tok-func">grep</span> <span class="tok-kw">-C</span> 1 <span class="tok-str">'foo'</span> <span class="tok-type">bar.txt</span>            <span class="tok-com"># --context: show 1 extra line above/below each match</span>
<span class="tok-func">grep</span> <span class="tok-kw">-E</span> <span class="tok-str">'foo|bar'</span> <span class="tok-type">baz.txt</span>           <span class="tok-com"># --extended-regexp: enables the | (or) operator in patterns</span>
</code></pre>
<p>Το <code>egrep 'foo|bar' baz.txt</code> κάνει ακριβώς το ίδιο με το <code>grep -E</code>, απλώς είναι διαφορετικό όνομα εντολής για την ίδια λειτουργικότητα.</p>

<h2>find — εύρεση αρχείων, σε βάθος</h2>
<pre><code><span class="tok-func">find</span> /path <span class="tok-kw">-name</span> <span class="tok-type">foo.txt</span>          <span class="tok-com"># find a file by exact name</span>
<span class="tok-func">find</span> <span class="tok-kw">-iname</span> <span class="tok-type">foo.txt</span>              <span class="tok-com"># case-insensitive search</span>
<span class="tok-func">find</span> <span class="tok-kw">-name</span> <span class="tok-str">"*.txt"</span>              <span class="tok-com"># find all files matching a wildcard pattern</span>

<div class="callout">

<h2>sort, uniq, tr</h2>
<pre><code><span class="tok-func">sort</span> <span class="tok-type">names.txt</span>              <span class="tok-com"># sort lines alphabetically</span>

<span class="tok-func">sort</span> <span class="tok-kw">-u</span> <span class="tok-type">names.txt</span>           <span class="tok-com"># --unique: sort AND drop duplicates in one step</span>
<span class="tok-func">uniq</span>                       <span class="tok-com"># remove ADJACENT duplicate lines (usually paired with sort first)</span>
<span class="tok-func">uniq</span> <span class="tok-kw">-c</span>                    <span class="tok-com"># --count: prefix each line with how many times it appeared</span>

<span class="tok-func">echo</span> <span class="tok-str">"hello"</span> <span class="tok-kw">|</span> <span class="tok-func">tr</span> <span class="tok-str">'l'</span> <span class="tok-str">'1'</span>    <span class="tok-com"># translate characters — "l" becomes "1", result: he11o</span>

</code></pre>
<div class="callout">
  <span class="tag">Το πιο συχνό λάθος με το uniq</span>

<h2>Παράδειγμα: οι πιο συχνές λέξεις ενός κειμένου</h2>
<p>Αυτό είναι ίσως το πιο διάσημο pipeline του Unix, και δείχνει καθαρά τη φιλοσοφία "μικρά εργαλεία που ενώνονται". Κανένα από τα προγράμματα παρακάτω δεν ξέρει τι είναι "συχνή λέξη". Μαζί όμως το υπολογίζουν:</p>

<h2>sed — αντικατάσταση κειμένου εν κινήσει</h2>
<p>Το <code>sed</code> είναι ένας stream editor: διαβάζει κείμενο γραμμή-γραμμή, εφαρμόζει έναν κανόνα, και τυπώνει το αποτέλεσμα. Η συντριπτική πλειοψηφία της χρήσης του είναι μία μόνο μορφή, η αντικατάσταση:</p>
<pre><code><span class="tok-func">sed</span> <span class="tok-str">'s/foo/bar/'</span> <span class="tok-type">file.txt</span>     <span class="tok-com"># replace the FIRST "foo" of each line with "bar"</span>
<span class="tok-func">sed</span> <span class="tok-str">'s/foo/bar/g'</span> <span class="tok-type">file.txt</span>    <span class="tok-com"># g = global: every occurrence on each line</span>
<span class="tok-func">sed</span> <span class="tok-kw">-i</span> <span class="tok-str">'s/foo/bar/g'</span> <span class="tok-type">file.txt</span> <span class="tok-com"># --in-place: rewrite the file itself, no output printed</span>
</code></pre>

<div class="eyebrow">Ενότητα 6 / 7 — Variables, Exit Codes &amp; Permissions</div>
<h1>Πώς το shell θυμάται πράγματα και ελέγχει αν πέτυχε</h1>
<p class="lede">Εδώ αρχίζουμε να βλέπουμε δομές που θα ξανασυναντήσεις σε κάθε γλώσσα προγραμματισμού: μεταβλητές και έλεγχος επιτυχίας ή αποτυχίας.</p>

<h2>Shell Variables εναντίον Environment Variables</h2>
<p>Μια shell variable υπάρχει μόνο μέσα στο τρέχον shell session και χάνεται αν ανοίξεις νέο terminal. Μια environment variable είναι ορατή και σε κάθε πρόγραμμα που ξεκινάς από αυτό το shell, δηλαδή τα child processes την κληρονομούν.</p>
<pre><code><span class="tok-type">foo</span>=123                   <span class="tok-com"># initialize a shell variable with 123</span>
<span class="tok-func">declare</span> <span class="tok-kw">-i</span> <span class="tok-type">foo</span>=123        <span class="tok-com"># initialize an INTEGER variable</span>
<span class="tok-func">declare</span> <span class="tok-kw">-r</span> <span class="tok-type">foo</span>=123        <span class="tok-com"># initialize a READONLY variable, can't change it afterwards</span>
<span class="tok-func">echo</span> <span class="tok-kw">$foo</span>                 <span class="tok-com"># print the variable's value</span>
<span class="tok-func">echo</span> <span class="tok-kw">\${foo}</span>_<span class="tok-str">'bar'</span>          <span class="tok-com"># {} clarifies where the variable name ends — prints "123bar"</span>
<span class="tok-func">echo</span> <span class="tok-kw">\${foo:-'default'}</span>    <span class="tok-com"># print foo if it exists, otherwise print 'default'</span>

<span class="tok-func">export</span> <span class="tok-type">foo</span>                <span class="tok-com"># make foo an environment variable — child processes inherit it</span>
<span class="tok-func">unset</span> <span class="tok-type">foo</span>                 <span class="tok-com"># remove the variable completely</span>
</code></pre>
<pre><code><span class="tok-func">export</span> <span class="tok-type">PATH</span>=<span class="tok-str">"$PATH:/my/path"</span>   <span class="tok-com"># append a new directory to the PATH environment variable</span>
<span class="tok-func">env</span>                          <span class="tok-com"># list all environment variables currently set</span>
<span class="tok-func">echo</span> <span class="tok-kw">$PATH</span>                    <span class="tok-com"># print the PATH variable specifically</span>
</code></pre>

<p>Το PATH είναι ακριβώς εκείνη η λίστα φακέλων που ανέφερε το βήμα 3 στην Ενότητα 1: όταν γράφεις <code>ls</code>, το shell ψάχνει το πρόγραμμα μέσα σε αυτούς τους φακέλους, με τη σειρά, και σταματάει στον πρώτο που το βρίσκει. Μπορείς να δεις ποιον ακριβώς διάλεξε:</p>
<pre><code><span class="tok-func">which</span> <span class="tok-type">ls</span>        <span class="tok-com"># /usr/bin/ls — the file that actually runs when you type ls</span>
<span class="tok-func">type</span> <span class="tok-type">ll</span>         <span class="tok-com"># tells you if something is a program, an alias or a shell builtin</span>
</code></pre>
<p>Αυτό εξηγεί και γιατί, μόλις εγκαταστήσεις ένα νέο εργαλείο, μερικές φορές χρειάζεται να ανοίξεις νέο terminal για να το "δει" το σύστημα: το PATH του τρέχοντος shell είχε ήδη διαβαστεί πριν αλλάξει.</p>

<h2>Ειδικές μεταβλητές</h2>
<pre><code><span class="tok-kw">$0</span>        <span class="tok-com"># the name of the running script</span>
<span class="tok-kw">$1</span>, <span class="tok-kw">$2</span> ...  <span class="tok-com"># positional arguments passed to the script</span>
<span class="tok-kw">$#</span>        <span class="tok-com"># number of arguments passed</span>
<span class="tok-kw">$@</span>        <span class="tok-com"># all arguments as a list</span>
<span class="tok-kw">$?</span>        <span class="tok-com"># exit code of the last command</span>
</code></pre>

<h2>Εισαγωγικά: η πιο συχνή πηγή μπερδέματος</h2>
<p>Τα εισαγωγικά στο bash δεν είναι διακοσμητικά. Καθορίζουν αν το shell θα κοιτάξει μέσα στο κείμενό σου για μεταβλητές και σύμβολα ή αν θα το αφήσει ακριβώς όπως το έγραψες. Οι τρεις περιπτώσεις:</p>
<pre><code>name=Kostas

<span class="tok-func">echo</span> <span class="tok-str">"Hello $name"</span>   <span class="tok-com"># double quotes: variables ARE expanded  -> Hello Kostas</span>
<span class="tok-func">echo</span> <span class="tok-str">'Hello $name'</span>   <span class="tok-com"># single quotes: everything stays literal -> Hello $name</span>
<span class="tok-func">echo</span> Hello $name     <span class="tok-com"># no quotes: expanded, but spaces split it into separate words</span>
</code></pre>
<p>Η τρίτη περίπτωση είναι αυτή που δαγκώνει. Όσο η μεταβλητή δεν έχει κενά, όλα φαίνονται μια χαρά, και ο κώδικας δουλεύει για μήνες. Την πρώτη φορά που θα δώσεις κάτι με κενό, το shell θα το σπάσει σε δύο ορίσματα και η εντολή θα αποτύχει με μήνυμα που δεν βγάζει νόημα:</p>
<pre><code>file=<span class="tok-str">"my notes.txt"</span>

<span class="tok-func">cat</span> $file       <span class="tok-com"># WRONG: cat receives two arguments, "my" and "notes.txt"</span>
<span class="tok-func">cat</span> <span class="tok-str">"$file"</span>     <span class="tok-com"># RIGHT: one single argument, spaces and all</span>
</code></pre>
<div class="callout good">
  <span class="tag">Κανόνας που γλιτώνει ώρες</span>
  Βάζε πάντα διπλά εισαγωγικά γύρω από μεταβλητές, εκτός αν έχεις συγκεκριμένο λόγο να μην το κάνεις. Το <code>"$file"</code> δεν κοστίζει τίποτα όταν δεν χρειάζεται, αλλά σε σώζει κάθε φορά που χρειάζεται.
</div>

<h2>Exit Codes — $? και exit</h2>
<p>Κάθε εντολή, όταν τελειώσει, επιστρέφει έναν exit code: το 0 σημαίνει επιτυχία, οποιοσδήποτε άλλος αριθμός από 1 έως 255 σημαίνει κάποιου είδους αποτυχία. Το ελέγχεις αμέσως μετά με <code>$?</code>.</p>
<pre><code><span class="tok-func">ls</span> /some/folder
<span class="tok-func">echo</span> <span class="tok-kw">$?</span>   <span class="tok-com"># prints 0 if the folder existed, non-zero otherwise</span>

<span class="tok-func">exit</span> 0   <span class="tok-com"># inside a script, exit successfully</span>
<span class="tok-func">exit</span> 1   <span class="tok-com"># inside a script, exit with a failure code</span>
</code></pre>
<div class="callout good">
  <span class="tag">Γιατί μετράει</span>
  Αυτό είναι το θεμέλιο για το πώς τα scripts παίρνουν αποφάσεις, όπως "αν η προηγούμενη εντολή απέτυχε, σταμάτα εδώ". Θα το ξαναδείς σε κάθε γλώσσα προγραμματισμού με άλλη μορφή, όπως errors ή exceptions.
</div>

<h2>File Permissions</h2>
<p>Κάθε αρχείο έχει δικαιώματα για τρεις κατηγορίες: owner (ιδιοκτήτης), group (ομάδα), others (όλοι οι υπόλοιποι). Και τρεις τύπους δικαιωμάτων: read (r), write (w), execute (x).</p>
<pre><code><span class="tok-func">ls</span> <span class="tok-kw">-l</span> <span class="tok-type">foo.sh</span>
<span class="tok-com"># -rwxr-xr--  owner: rwx, group: r-x, others: r--</span>
</code></pre>

<h2>chmod — αλλαγή δικαιωμάτων</h2>
<p>Το chmod δέχεται δύο μορφές: symbolic (γράμματα) και numeric (αριθμούς).</p>
<pre><code><span class="tok-func">chmod</span> <span class="tok-kw">u+x</span> <span class="tok-type">foo.sh</span>       <span class="tok-com"># give the OWNER (user) execute permission</span>
<span class="tok-func">chmod</span> <span class="tok-kw">g+x</span> <span class="tok-type">foo.sh</span>       <span class="tok-com"># give the GROUP execute permission</span>
<span class="tok-func">chmod</span> <span class="tok-kw">u-x,g-x</span> <span class="tok-type">foo.sh</span>   <span class="tok-com"># take away execute permission from user and group</span>
<span class="tok-func">chmod</span> <span class="tok-kw">a+x</span> <span class="tok-type">foo.sh</span>       <span class="tok-com"># give EVERYBODY (all) execute permission</span>
<span class="tok-func">chmod</span> <span class="tok-kw">+x</span> <span class="tok-type">foo.sh</span>         <span class="tok-com"># same as a+x — shorthand for everybody</span>

<span class="tok-func">chmod</span> <span class="tok-kw">+100</span> <span class="tok-type">foo.sh</span>       <span class="tok-com"># add 1 (execute) to the user's permission bits</span>
<span class="tok-func">chmod</span> <span class="tok-kw">-100</span> <span class="tok-type">foo.sh</span>       <span class="tok-com"># subtract 1 (execute) from the user's permission bits</span>
<span class="tok-func">chmod</span> 755 <span class="tok-type">foo.sh</span>          <span class="tok-com"># numeric form: owner=rwx(7), group=rx(5), others=rx(5)</span>
</code></pre>

<h2>Οι αριθμοί πίσω από το chmod 755</h2>
<p>Η αριθμητική μορφή δεν είναι αυθαίρετη. Κάθε δικαίωμα έχει μια σταθερή αξία, και τα προσθέτεις μεταξύ τους για να πάρεις ένα ψηφίο:</p>
<div class="grid3">
  <div class="card"><h3>read = 4</h3><p>Δικαίωμα ανάγνωσης του περιεχομένου.</p></div>
  <div class="card"><h3>write = 2</h3><p>Δικαίωμα τροποποίησης ή διαγραφής.</p></div>
  <div class="card"><h3>execute = 1</h3><p>Δικαίωμα εκτέλεσης του αρχείου ως πρόγραμμα.</p></div>
</div>
<p>Ένα ψηφίο ανά κατηγορία, πάντα με την ίδια σειρά: πρώτα ο owner, μετά το group, τέλος οι υπόλοιποι.</p>
<pre><code>7 = 4+2+1 = rwx    <span class="tok-com"># read, write and execute</span>
6 = 4+2   = rw-    <span class="tok-com"># read and write, but not executable</span>
5 = 4+1   = r-x    <span class="tok-com"># read and execute, cannot be modified</span>
4 = 4     = r--    <span class="tok-com"># read only</span>
0 = 0     = ---    <span class="tok-com"># no permission at all</span>
</code></pre>
<pre><code><span class="tok-func">chmod</span> 755 <span class="tok-type">script.sh</span>   <span class="tok-com"># owner rwx, everyone else r-x — the usual setting for a script</span>
<span class="tok-func">chmod</span> 644 <span class="tok-type">notes.txt</span>   <span class="tok-com"># owner rw-, everyone else r-- — the usual setting for a plain file</span>
<span class="tok-func">chmod</span> 600 <span class="tok-type">secrets.env</span> <span class="tok-com"># owner rw-, nobody else can even read it</span>
</code></pre>
<p>Άρα το <code>755</code> και το <code>u=rwx,go=rx</code> λένε ακριβώς το ίδιο πράγμα. Η αριθμητική μορφή είναι πιο σύντομη και πιο συχνή σε οδηγούς, η συμβολική πιο ξεκάθαρη όταν θέλεις να αλλάξεις ένα μόνο δικαίωμα χωρίς να πειράξεις τα υπόλοιπα.</p>

<h2>Το πρώτο σου script</h2>
<p>Έχεις πλέον όλα τα κομμάτια: μεταβλητές, ορίσματα, exit codes και δικαιώματα. Ας τα ενώσουμε σε ένα πραγματικό, μικρό script. Δημιούργησε ένα αρχείο <code>greet.sh</code> με αυτό το περιεχόμενο:</p>
<pre><code>#!/bin/bash
# greet.sh - greets the name given as the first argument

name=$1

if [ -z "$name" ]; then
    echo "Usage: ./greet.sh &lt;name&gt;"
    exit 1
fi

echo "Hello, $name!"
exit 0
</code></pre>
<p>Γραμμή προς γραμμή: η πρώτη γραμμή λέγεται shebang και δηλώνει με ποιον interpreter πρέπει να τρέξει το αρχείο, εδώ με bash. Το <code>name=$1</code> κρατάει το πρώτο όρισμα σε μεταβλητή με κατανοητό όνομα. Το <code>[ -z "$name" ]</code> ελέγχει αν η μεταβλητή είναι άδεια, δηλαδή αν ο χρήστης ξέχασε να δώσει όρισμα, οπότε τυπώνουμε οδηγίες χρήσης και βγαίνουμε με κωδικό αποτυχίας. Αν όλα πήγαν καλά, χαιρετάμε και βγαίνουμε με 0.</p>
<pre><code><span class="tok-func">chmod</span> <span class="tok-kw">+x</span> <span class="tok-type">greet.sh</span>     <span class="tok-com"># without this, the file is just text and cannot run</span>
./greet.sh <span class="tok-type">Kostas</span>       <span class="tok-com"># Hello, Kostas!</span>
./greet.sh                <span class="tok-com"># Usage: ./greet.sh &lt;name&gt;</span>
<span class="tok-func">echo</span> <span class="tok-kw">$?</span>                  <span class="tok-com"># 1 — the script reported failure</span>
</code></pre>
<div class="callout">
  <span class="tag">Γιατί ./ και όχι σκέτο greet.sh</span>
  Επειδή ο τρέχων φάκελος δεν βρίσκεται μέσα στο PATH. Χωρίς το <code>./</code>, το shell θα ψάξει το greet.sh μόνο στους φακέλους του PATH, δεν θα το βρει, και θα σου πει <code>command not found</code> ενώ το αρχείο βρίσκεται μπροστά στα μάτια σου. Το <code>./</code> σημαίνει "αυτό εδώ, στον φάκελο που βρίσκομαι".
</div>

<h2>Regular Expressions — μια πρώτη ματιά</h2>
<p>Τα regex είναι patterns για ταίριασμα κειμένου, πιο ισχυρά από τα wildcards, και τα χρησιμοποιούν εργαλεία όπως το grep, το sed και το awk. Ας δούμε τα πρώτα σύμβολα:</p>
<div class="grid3">
  <div class="card"><h3>^ και $</h3><p>Αρχή και τέλος γραμμής αντίστοιχα.</p></div>
  <div class="card"><h3>. και *</h3><p>Οποιοσδήποτε χαρακτήρας, και "μηδέν ή περισσότερες φορές".</p></div>
  <div class="card"><h3>[0-9]</h3><p>Ένα ψηφίο μέσα στο εύρος 0 έως 9.</p></div>
</div>
`);

<div class="eyebrow">Ενότητα 7 / 7 — Processes, Δίκτυο &amp; Συστήματα</div>
<h1>Τι τρέχει τώρα, και πώς μιλάει το μηχάνημά σου με τον έξω κόσμο</h1>
<p class="lede">Πώς διαχειρίζεσαι προγράμματα που τρέχουν, πώς επικοινωνείς με άλλα μηχανήματα, και πώς παρακολουθείς την υγεία του συστήματός σου.</p>

<h2>Process Management</h2>
<pre><code><span class="tok-func">command</span> &amp;         <span class="tok-com"># run a command in the background</span>
<span class="tok-func">jobs</span>              <span class="tok-com"># list background jobs of this shell</span>
<span class="tok-func">fg</span> %1              <span class="tok-com"># bring job 1 to the foreground</span>
<span class="tok-func">bg</span> %1              <span class="tok-com"># resume a stopped job in the background</span>
<span class="tok-func">disown</span> %1          <span class="tok-com"># detach a job so it survives even if you close the terminal</span>
<span class="tok-func">nohup</span> <span class="tok-type">command</span> &amp;   <span class="tok-com"># run a command immune to "hangup" — keeps running after logout</span>
</code></pre>

<h2>Σταματώντας μια διεργασία: σήματα και kill</h2>
<p>Ένα πρόγραμμα δεν "σβήνει" απλώς. Το λειτουργικό σύστημα του στέλνει ένα σήμα, και το πρόγραμμα, ανάλογα με το σήμα, προλαβαίνει ή δεν προλαβαίνει να καθαρίσει τα πράγματά του πριν φύγει. Στην καθημερινή χρήση θα συναντήσεις κυρίως τρία:</p>
<div class="grid3">
  <div class="card"><h3>Ctrl + C</h3><p>Στέλνει SIGINT: "σταμάτα τώρα". Το πρόγραμμα μπορεί να καθαρίσει και να τερματίσει ομαλά.</p></div>
  <div class="card"><h3>Ctrl + Z</h3><p>Στέλνει SIGTSTP: παγώνει τη διεργασία. Δεν πέθανε, περιμένει, και τη συνεχίζεις με fg ή bg.</p></div>
  <div class="card"><h3>kill -9</h3><p>Στέλνει SIGKILL: τερματισμός χωρίς προειδοποίηση. Δεν μπορεί να αγνοηθεί, ούτε να καθαρίσει τίποτα.</p></div>
</div>
<pre><code><span class="tok-func">ps</span> <span class="tok-kw">aux</span> <span class="tok-kw">|</span> <span class="tok-func">grep</span> <span class="tok-str">'node'</span>   <span class="tok-com"># find the PID (process id) of what you want to stop</span>
<span class="tok-func">kill</span> <span class="tok-type">4821</span>              <span class="tok-com"># polite request to terminate (SIGTERM)</span>
<span class="tok-func">kill</span> <span class="tok-kw">-9</span> <span class="tok-type">4821</span>           <span class="tok-com"># force it, use only if the polite version failed</span>
<span class="tok-func">pgrep</span> <span class="tok-type">node</span>             <span class="tok-com"># print the PIDs of processes matching a name</span>
<span class="tok-func">pkill</span> <span class="tok-type">node</span>             <span class="tok-com"># kill by name instead of by PID, careful: matches everything</span>
</code></pre>
<div class="callout">
  <span class="tag">Ξεκίνα από το ήπιο</span>
  Το <code>kill -9</code> είναι δελεαστικό γιατί δουλεύει πάντα, αλλά δεν δίνει στο πρόγραμμα καμία ευκαιρία να αποθηκεύσει αρχεία, να κλείσει συνδέσεις ή να σβήσει προσωρινά δεδομένα. Δοκίμασε πρώτα το σκέτο <code>kill</code> και κράτα το -9 για όταν πραγματικά έχει κολλήσει.
</div>

<h2>Networking, βασικά εργαλεία</h2>
<pre><code><span class="tok-func">ping</span> <span class="tok-type">example.com</span>     <span class="tok-com"># check if a host is reachable</span>
<span class="tok-func">wget</span> <span class="tok-type">https://example.com/file.zip</span>  <span class="tok-com"># download a file</span>
<span class="tok-func">ssh</span> <span class="tok-type">user@remote-host</span>  <span class="tok-com"># open a secure shell session on a remote machine</span>
<span class="tok-func">scp</span> <span class="tok-type">file.txt user@host:/path</span>  <span class="tok-com"># securely copy a file to a remote machine</span>
<span class="tok-func">rsync</span> <span class="tok-kw">-av</span> <span class="tok-type">src/ dest/</span>  <span class="tok-com"># sync files/directories, only transferring differences</span>
</code></pre>

<h2>Παρακολούθηση συστήματος</h2>
<pre><code><span class="tok-func">ps</span> <span class="tok-kw">aux</span>    <span class="tok-com"># list all running processes</span>
<span class="tok-func">top</span>       <span class="tok-com"># live view of processes and resource usage</span>
<span class="tok-func">htop</span>      <span class="tok-com"># nicer interactive version of top (not always pre-installed)</span>
<span class="tok-func">free</span> <span class="tok-kw">-h</span>   <span class="tok-com"># show free/used memory, human-readable</span>
<span class="tok-func">df</span> <span class="tok-kw">-h</span>     <span class="tok-com"># disk space per filesystem, human-readable</span>
<span class="tok-func">du</span> <span class="tok-kw">-sh</span> <span class="tok-type">folder</span>  <span class="tok-com"># total disk usage of a folder</span>
<span class="tok-func">uptime</span>    <span class="tok-com"># how long the system has been running</span>
</code></pre>

<p>Το <code>df</code> και το <code>du</code> μοιάζουν αλλά απαντούν σε διαφορετική ερώτηση. Το <code>df</code> κοιτάει τον δίσκο συνολικά και λέει πόσος χώρος απομένει. Το <code>du</code> κοιτάει έναν συγκεκριμένο φάκελο και λέει πόσο πιάνει αυτός. Όταν γεμίσει ο δίσκος σου, τρέχεις πρώτα <code>df -h</code> για να δεις ότι όντως γέμισε, και μετά <code>du -sh *</code> μέσα σε φακέλους για να βρεις ποιος φταίει.</p>

<h2>Συμπίεση αρχείων</h2>
<pre><code><span class="tok-func">tar</span> <span class="tok-kw">-czvf</span> <span class="tok-type">archive.tar.gz folder/</span>  <span class="tok-com"># create a compressed archive</span>

<span class="tok-func">gzip</span> <span class="tok-type">file.txt</span>               <span class="tok-com"># compress a single file to file.txt.gz</span>
<span class="tok-func">gunzip</span> <span class="tok-type">file.txt.gz</span>            <span class="tok-com"># decompress it back</span>
</code></pre>

<h2>Package Management</h2>
