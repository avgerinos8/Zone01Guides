<div class="eyebrow">Ενότητα 1 / 7 — Εισαγωγή στο Docker</div>
<h1>Ορισμός και Σκοπός</h1>
<p class="lede">Το Docker είναι μια πλατφόρμα ανοιχτού λογισμικού που επιτρέπει την αυτοματοποίηση της ανάπτυξης, της
αποστολής και της εκτέλεσης εφαρμογών μέσα σε απομονωμένα περιβάλλοντα εκτέλεσης, τα οποία ονομάζονται
<strong>containers</strong>.</p>

<h2>Το πρόβλημα: «Δουλεύει στο μηχάνημά μου»</h2>
<p>Σε ομαδικά έργα λογισμικού είναι σύνηθες ένας κώδικας να εκτελείται σωστά σε ένα σύστημα και να αποτυγχάνει
σε άλλο. Οι συνήθεις αιτίες είναι:</p>
<ul>
  <li>Διαφορετική έκδοση της γλώσσας ή του runtime (π.χ. Go 1.21 έναντι 1.22)</li>
  <li>Διαφορετικό λειτουργικό σύστημα (Windows, Linux, macOS)</li>
  <li>Ελλιπείς βιβλιοθήκες συστήματος ή διαφορετικά δικαιώματα στους φακέλους</li>
</ul>
<p>Το Docker περικλείει την εφαρμογή μαζί με όλα τα dependencies, τις ρυθμίσεις και το runtime της σε ένα
ενιαίο πακέτο. Αν η εφαρμογή εκτελείται μέσα σε Docker, θα εκτελείται με πανομοιότυπο τρόπο σε οποιοδήποτε
σύστημα διαθέτει τον Docker engine.</p>

<h2>Containers έναντι Virtual Machines</h2>
<p>Είναι συχνό λάθος να ταυτίζονται τα Docker containers με τα Virtual Machines. Η
θεμελιώδης διαφορά έγκειται στο επίπεδο απομόνωσης:</p>

    <h3>Dockerfile <code>[Local File]</code></h3>
    <p>Αρχείο απλού κειμένου στον φάκελό σου που περιέχει τις βήμα-προς-βήμα οδηγίες κατασκευής μιας εικόνας.</p>
  </div>
  
  <div class="card">
    <h3>Docker Image <code>[Local Snapshot]</code></h3>
    <p>Το read-only πακέτο που προκύπτει από το build. Υπάρχει τοπικά στο σύστημά σου (παρόλο που δεν φαίνεται ως απλό αρχείο στον φάκελο) και περιέχει τον κώδικα, τα binaries και το runtime (ό,τι ζητείται στο Dockerfile).</p>

    <h3>Docker Container <code>[Local Process]</code></h3>
    <p>Η ενεργή, ζωντανή εκτέλεση ενός image στη μηχανή σου. Από το ίδιο local image μπορούν να εκκινηθούν πολλαπλά, απομονωμένα containers ταυτόχρονα. (π.χ. για scaling ή για απομόνωση testing, dev και production)</p>

<p>Απομακρυσμένη κεντρική αποθήκη στο Cloud (π.χ. Docker Hub, GitHub Container Registry) για push και pull εικόνων. Από εκεί αντλούνται οι έτοιμες εικόνες (όπως <code>golang</code> ή <code>alpine</code>) που χρειάζονται για το build του δικού σου image.</p>  </div>

        addContent(`
    <div class="eyebrow">Ενότητα 2 / 7 — Dockerfile</div>
  <h1>Dockerfile Syntax & Instructions Reference</h1>
  <p class="lede">Το Dockerfile είναι το αρχείο κειμένου που θα δημιουργήσουμε εμείς και θα περιέχει εντολές σε σειρά, τις οποίες εκτελεί ο Docker builder για τη δημιουργία του image.</p>
  <div class="callout good">
    <p>Κάθε εντολή δημιουργεί ένα νέο image layer. Η σειρά και η ομαδοποίηση επηρεάζουν το μέγεθος του image.</p>
  </div>
  
  <h2>Ένα τυπικό αρχείο Dockerfile:</h2>
<pre><code class="lang-docker"># Base image with Go installed
FROM golang:1.22-alpine

# Set working directory inside container
WORKDIR /app

# Download dependencies
COPY go.mod go.sum ./
RUN go mod download

# Copy source code and build application binary
COPY . .
RUN go build -o myapp .

# Expose network port
EXPOSE 8080

# Execute compiled binary
CMD ["./myapp"]</code></pre></code></pre>

  <h2>Αναλυτικές Εντολές Dockerfile</h2>
  <table class="glossary-table">
    <tr>
      <td class="gt-term">1. FROM</td>
      <td class="gt-def">
        Η εντολή FROM ορίζει ποιο image θα κατεβεί και από ποιο θα ξεκινήσει το χτίσιμο. Πρέπει να είναι η πρώτη εντολή στο Dockerfile. Ένα Dockerfile μπορεί να έχει πολλαπλές εντολές FROM, πράγμα που σημαίνει ότι παράγει περισσότερες από μία εικόνες (multi-stage build).
        <br><b>Παράδειγμα:</b> <code>FROM java:8</code>
      </td>
    </tr>
    <tr>
      <td class="gt-term">2. LABEL</td>
      <td class="gt-def">
        Προσθέτει μεταδεδομένα (metadata) στο image με τη μορφή ζευγών κλειδιού-τιμής (key-value). Χρησιμοποιείται για την αναγραφή του δημιουργού (maintainer), της έκδοσης, της περιγραφής κ.ά. (Έχει αντικαταστήσει την παλαιότερη εντολή <code>MAINTAINER</code>).
        <br><b>Παράδειγμα:</b> <code>LABEL maintainer=&quot;Firstname Lastname &lt;example@zone01.gr&gt;&quot;</code>
      </td>
    </tr>
    <tr>
      <td class="gt-term">3. RUN</td>
      <td class="gt-def">
        Η εντολή RUN εκτελεί εντολές κατά τη διάρκεια της διαδικασίας build του image και αποθηκεύει το αποτέλεσμα σε ένα νέο layer. Χρησιμοποιείται κυρίως για την εγκατάσταση πακέτων, τη δημιουργία καταλόγων ή τη ρύθμιση του περιβάλλοντος.
        <br><b>Παράδειγμα:</b> <code>RUN unzip install.zip /opt/install</code> | <code>RUN echo hello</code>
      </td>
    </tr>
    <tr>
      <td class="gt-term">4. ADD</td>
      <td class="gt-def">
        Χρησιμοποιείται για την προσθήκη αρχείων. Δίνει οδηγίες για την αντιγραφή νέων αρχείων, καταλόγων ή απομακρυσμένων URLs στο σύστημα αρχείων του image. Μπορεί να προσθέσει τοπικά αρχεία, περιεχόμενα αρχείων tar (τα οποία αποσυμπιέζει αυτόματα) καθώς και URLs.
        <br><b>Παράδειγμα:</b> <code>ADD run.sh /run.sh</code> | <code>ADD project.tar.gz /install/</code> | <code>ADD https://example.com/test.rpm /test</code>
      </td>
    </tr>
    <tr>
      <td class="gt-term">5. COPY</td>
      <td class="gt-def">
        Αντιγράφει αρχεία ή καταλόγους από το σύστημα του host μέσα στο σύστημα αρχείων του image.
        <br><b>Παράδειγμα:</b> <code>COPY go.mod go.sum ./</code>
        <br><small><b>Διαφορά με ADD:</b> Η <code>COPY</code> κάνει <i>μόνο</i> απλή αντιγραφή τοπικών αρχείων (best practice). Η <code>ADD</code> επιπλέον αποσυμπιέζει αυτόματα αρχεία (π.χ. <code>.tar.gz</code>) και μπορεί να κατεβάζει αρχεία από URLs.</small>
      </td>
    </tr>
    <tr>
      <td class="gt-term">6. ENV</td>
      <td class="gt-def">
        Η εντολή ENV ορίζει μεταβλητές περιβάλλοντος τόσο κατά το build όσο και κατά την εκτέλεση του container. Μπορεί να χρησιμοποιηθεί μέσα στο Dockerfile και σε οποιαδήποτε scripts καλεί αυτό. Είναι μόνιμες στο container και προσβάσιμες ανά πάσα στιγμή.
        <br><b>Παράδειγμα:</b> <code>ENV URL_POST=production.example.com</code>
      </td>
    </tr>
    <tr>
      <td class="gt-term">7. ENTRYPOINT</td>
      <td class="gt-def">
        Καθορίζει την αρχική εντολή/έκφραση που θα χρησιμοποιηθεί κατά την εκκίνηση του container. Ορίζει την κύρια εντολή που θα εκτελεστεί. Αν το container λειτουργεί ως πρόγραμμα γραμμής εντολών, χρησιμοποιείται το ENTRYPOINT.
        <br><b>Παράδειγμα:</b> <code>ENTRYPOINT ["/start.sh"]</code>
      </td>
    </tr>
    <tr>
      <td class="gt-term">8. CMD</td>
      <td class="gt-def">
        Η εντολή CMD καθορίζει την προεπιλεγμένη εντολή που θα εκτελεστεί όταν ξεκινά ένα container. Μπορεί επίσης να παράσχει προεπιλεγμένα ορίσματα για την εντολή ENTRYPOINT. Αν υπάρχουν ENTRYPOINT και CMD, συνδυάζονται μαζί.
        <br><b>Παράδειγμα:</b> <code>CMD ["program-foreground"]</code> | <code>CMD ["executable", "p1", "p2"]</code>
      </td>
    </tr>
    <tr>
      <td class="gt-term">9. EXPOSE</td>
      <td class="gt-def">
        Η εντολή EXPOSE ενημερώνει το Docker ότι το container ακούει σε συγκεκριμένη θύρα δικτύου κατά το runtime. Προεπιλεγμένα το πρωτόκολλο είναι το TCP, αλλά μπορεί να οριστεί και UDP.
        <br><b>Παράδειγμα:</b> <code>EXPOSE 5000</code> | <code>EXPOSE 8080/udp</code>
      </td>
    </tr>
    <tr>
      <td class="gt-term">10. WORKDIR</td>
      <td class="gt-def">
        Ορίζει τον κατάλογο στον οποίο ξεκινά το container. Ο κύριος σκοπός της είναι να ορίσει τον κατάλογο εργασίας για όλες τις μελλοντικές εντολές του Dockerfile.
        <br><b>Παράδειγμα:</b> <code>WORKDIR /directory-name</code>
      </td>
    </tr>
    <tr>
      <td class="gt-term">11. ARG</td>
      <td class="gt-def">
        Ορίζει μια μεταβλητή που παρέχεται κατά τη διάρκεια του build (μέσω της παραμέτρου <code>--build-arg</code>). Είναι η μόνη εντολή που μπορεί να μπει πριν από την FROM.
        <br><b>Παράδειγμα:</b> <code>ARG NODE_VERSION=20</code> | <code>FROM node:\${NODE_VERSION}-alpine</code>
      </td>
    </tr>
  </table>`);

<div class="eyebrow">Ενότητα 3 / 7 — Ανάλυση Dockerfile & Multi-stage</div>
<h1>Το πρόβλημα του Single-stage Build</h1>
<p class="lede">Ένα απλό, μη βελτιστοποιημένο Dockerfile για μια εφαρμογή Go έχει τυπικά την εξής μορφή:</p>

<pre><code class="lang-docker">FROM golang:1.22-alpine
WORKDIR /app
COPY . .
RUN go build -o app ./cmd/main.go
EXPOSE 8080
CMD ["./app"]</code></pre>

<p>Αυτή η εικόνα περιέχει ολόκληρο το περιβάλλον ανάπτυξης της Go: τον compiler, τα εργαλεία build, τα headers
και ολόκληρο τον πηγαίο κώδικα. Το αποτέλεσμα είναι ένα τελικό image μεγέθους περίπου <strong>350MB έως
800MB</strong>.</p>
<p>Πέραν του μεγέθους, υπάρχει και ζήτημα ασφάλειας: όποιος αποκτήσει πρόσβαση στο container έχει άμεση
πρόσβαση σε όλα τα αρχεία πηγαίου κώδικα (<code>.go</code>), κάτι που θεωρείται σημαντικό κενό ασφαλείας σε
παραγωγικό περιβάλλον.</p>

<h2>Η λύση: Multi-stage Build</h2>
<p>Η τεχνική του multi-stage build χωρίζει τη διαδικασία σε δύο διακριτά στάδια:</p>
<ul>
  <li><strong>Στάδιο 1 (Builder):</strong> χρησιμοποιείται το πλήρες περιβάλλον της Go αποκλειστικά για τη
  μεταγλώττιση (compile) του κώδικα, με τελικό προϊόν ένα έτοιμο εκτελέσιμο αρχείο (binary).</li>
  <li><strong>Στάδιο 2 (Runtime):</strong> ξεκινά από μια καθαρή, ελαφριά εικόνα Linux (π.χ. Alpine, περίπου
  5MB) και μεταφέρονται σε αυτήν μόνο το έτοιμο binary και τα απαραίτητα assets (static, templates,
  δεδομένα).</li>
</ul>
<p>Το αποτέλεσμα αυτής της διαδικασίας είναι μια τελική εικόνα της τάξης των <strong>27-30MB</strong>:
ταχύτατη στο download, χωρίς περιττά αρχεία, χωρίς εκτεθειμένο πηγαίο κώδικα.</p>
`);

<div class="eyebrow">Ενότητα 3 / 7 — Ανάλυση Dockerfile & Multi-stage</div>
<h1>Ανάλυση multi-stage γραμμή-γραμμή</h1>

<pre><code class="lang-docker"># Stage 1: Builder
FROM golang:1.22-alpine AS builder
WORKDIR /app
COPY go.mod ./
RUN go mod download
COPY . .
RUN CGO_ENABLED=0 GOOS=linux go build -ldflags="-w -s" -o app ./cmd/main.go

# Stage 2: Runtime
FROM alpine:3.19
WORKDIR /app
RUN adduser -D -g '' appuser
COPY --from=builder /app/app .
USER appuser
CMD ["./app"]</code></pre>

<h2>Στάδιο 1 (Builder)</h2>
<pre><code class="lang-docker">FROM golang:1.22-alpine AS builder</code></pre>
<p>Κατεβάζει την επίσημη εικόνα της Go και το <code>AS builder</code> ονομάζει το στάδιο, ώστε να μπορεί να γίνει αναφορά σε αυτό αργότερα.</p>

<pre><code class="lang-docker">WORKDIR /app
COPY go.mod ./
RUN go mod download
COPY . .</code></pre>
<p>Η αντιγραφή του αρχείου διαχείρισης εξαρτήσεων και η λήψη τους γίνεται <strong>πριν</strong> αντιγραφεί ο υπόλοιπος κώδικας, ώστε το Docker να μπορεί να κάνει cache αυτό το layer· αν αλλάξει π.χ. μόνο ένα αρχείο HTML στη συνέχεια, δεν θα χρειαστεί να ξαναγίνει λήψη των βιβλιοθηκών.</p>

<pre><code class="lang-docker">RUN CGO_ENABLED=0 GOOS=linux go build -ldflags="-w -s" -o app ./cmd/main.go</code></pre>
<ul>
  <li><code class="lang-docker">CGO_ENABLED=0</code>: απενεργοποιεί τα C bindings, παράγοντας ένα πλήρως στατικό (statically linked) binary που εκτελείται σε οποιοδήποτε περιβάλλον Linux χωρίς εξάρτηση από εξωτερικές system libraries.</li>
  <li><code class="lang-docker">-ldflags="-w -s"</code>: αφαιρεί τις πληροφορίες debugging και τα symbols από το binary, μειώνοντας το μέγεθός του κατά περίπου 30-40%.</li>
</ul>

<h2>Στάδιο 2 (Runtime)</h2>
<pre><code class="lang-docker">FROM alpine:3.19
WORKDIR /app
RUN adduser -D -g '' appuser</code></pre>
<p>Δημιουργείται ένας απλός, μη προνομιούχος χρήστης συστήματος. Για λόγους ασφαλείας, η εφαρμογή πρέπει να εκτελείται με περιορισμένα δικαιώματα.</p>

<pre><code class="lang-docker">COPY --from=builder /app/app .
USER appuser
CMD ["./app"]</code></pre>
<p>Το <code class="lang-docker">COPY --from=builder</code> αντιγράφει επιλεκτικά αρχεία από το προηγούμενο στάδιο (που ονομάσαμε εμείς <code>AS builder</code>). Μεταφέρεται μόνο το έτοιμο εκτελέσιμο· κανένα αρχείο πηγαίου κώδικα δεν μεταφέρεται. Στη συνέχεια ενεργοποιείται ο χρήστης <code>appuser</code>.</p>
`);

<div class="eyebrow">Ενότητα 4 / 7 — Docker Compose</div>
<h1>Χωρίς Docker Compose</h1>
<p class="lede">Για να καταλάβουμε την αξία του Docker Compose, ας δούμε πώς θα εκτελούσαμε την εφαρμογή μας χρησιμοποιώντας αποκλειστικά τις εντολές του Docker CLI.</p>

<h2>Βήμα 1: Χτίσιμο της Εικόνας (Build Image)</h2>
<pre><code class="lang-bash">docker build -t project-app:v1 .</code></pre>
<p>Η εντολή αυτή διαβάζει το <code>Dockerfile</code> στον τρέχοντα κατάλογο (<code>.</code>) και δημιουργεί μια εικόνα με το όνομα/tag <code>project-app:v1</code>.</p>

<h2>Βήμα 2: Εκτέλεση του Container (Run Container)</h2>
<pre><code class="lang-bash">docker run -d \
  --name project-app \
  -p 8080:8080 \
  --restart unless-stopped \
  project-app:v1</code></pre>

<p>Για να ρυθμίσουμε σωστά το container κατά την εκτέλεση, πρέπει να απομνημονεύουμε και να πληκτρολογούμε κάθε φορά μια σειρά από flags:</p>
<ul>
  <li><code>-d</code>: Εκτελεί το container στο παρασκήνιο (detached mode).</li>
  <li><code>--name project-app</code>: Ορίζει ένα σταθερό όνομα στο container (αντί για κάποιο τυχαίο).</li>
  <li><code>-p 8080:8080</code>: Αντιστοιχίζει τη θύρα 8080 του host machine στη θύρα 8080 του container.</li>
  <li><code>--restart unless-stopped</code>: Επανεκκινεί αυτόματα το container αν καταρρεύσει ή αν επανεκκινηθεί ο Docker daemon.</li>
</ul>



<h3>Επιβεβαίωση Κατάστασης</h3>
<p>Μετά το build ή το run, χρησιμοποιούμε τις παρακάτω εντολές για να ελέγξουμε τις εικόνες και τα containers στο σύστημά μας:</p>

<pre><code class="lang-bash"># Προβολή όλων των τοπικών εικόνων (images)
docker images

# Προβολή των ενεργών (running) containers
docker ps

# Προβολή ΟΛΩΝ των containers (ενεργών και σταματημένων)
docker ps -a</code></pre>

<hr />

<div class="callout attention">
  <span class="tag">Το Πρόβλημα</span>
  Αυτή η διαδικασία απαιτεί <strong>πολλαπλές εντολές</strong> με πολλά παραμετρικά flags. Αν αλλάξει ο κώδικας, πρέπει χειροκίνητα να κάνουμε <code>docker stop</code>, <code>docker rm</code> (σβήσιμο) το παλιό container, ξανά <code>build</code> και ξανά <code>run</code>.
</div>
`);

<div class="eyebrow">Ενότητα 4 / 7 — Docker Compose</div>
<h1>Με Docker Compose</h1>
<p class="lede">Το Docker Compose είναι ένας απλός τρόπος να εκτελούνται με μία μόνο εντολή, αυτόματα, οι εντολές build και run που είδαμε πριν, χρησιμοποιώντας τις παραμέτρους που έχουμε ορίσει σε ένα αρχείο YAML, του οποίου τη μορφή θα δούμε αμέσως τώρα.</p>

<p>Ακόμη και στην περίπτωση ενός απλού container, λειτουργεί ως το επίσημο <strong>αρχείο ρυθμίσεων (configuration file)</strong> του deployment. Αντί να απαιτείται απομνημόνευση θυρών, ονομάτων και ρυθμίσεων ασφαλείας μέσω επαναλαμβανόμενων εντολών τερματικού, όλες οι παράμετροι καταγράφονται μία φορά στο YAML αρχείο.</p>

<h2>Ανάλυση του docker-compose.yml</h2>
<pre><code class="lang-yml">version: '3.8'                    // version of the Compose file format

services:
  web-app:                         // name of our service
    build:
      context: .                   // build context: current directory
      dockerfile: Dockerfile       // which file builds the image

    container_name: project-app    // replaces --name

    ports:
      - "8080:8080"                // replaces -p (host:container)

    restart: unless-stopped        // replaces --restart</code></pre>
<p>Κάθε πεδίο του yml αντιστοιχεί ένα-προς-ένα σε ένα flag της χειροκίνητης εντολής <code>docker container run</code>.</p>
`);

<div class="eyebrow">Ενότητα 4 / 7 — Docker Compose</div>
<h1>Βασικές Εντολές Λειτουργίας</h1>

<div class="grid2">
  <div class="card">
    <h3>Εκκίνηση (Up)</h3>
    <pre><code>docker-compose up -d --build</code></pre>
    <p>Η εντολή διαβάζει τις οδηγίες από το αρχείο docker-compose.yml.</p>
    <p>Λειτουργεί ως "έξυπνος μεταγλωττιστής": 
    Το flag <code>--build</code> ελέγχει αν έχει αλλάξει ο κώδικας, αναδημιουργεί το image εφόσον χρειάζεται, εκκινεί το container και το <code>-d</code> το αφήνει να τρέχει στο παρασκήνιο.</p>
  </div>
  <div class="card">
    <h3>Καταστροφή (Down)</h3>
    <pre><code>docker-compose down</code></pre>
    <p>Αντίθετα με το απλό <code>stop</code>, η εντολή <code>down</code> τερματίζει τα containers και επιπλέον <strong>καθαρίζει το σύστημα</strong>: διαγράφει τα ίδια τα containers και καταστρέφει το αυτόματο δίκτυο.</p>
    <p>Με αυτόν τον τρόπο, απελευθερώνονται άμεσα όλοι οι δεσμευμένοι πόροι, διασφαλίζοντας ότι δεν μένουν «ορφανά» δίκτυα ή ανενεργά containers που επιβαρύνουν τον υπολογιστή σας.</p>
  </div>
</div>

<p class="lede">Αν η εφαρμογή μας αποτελείται από κομμάτια που θα εκτελεστούν σε πολλαπλά containers, το Compose έχει τη δυνατότητα να τα διαχειριστεί σαν μια ενιαία οντότητα.</p>

<div class="callout good">
  <span class="tag">Αυτόματο Δίκτυο</span>
  Το Docker Compose δημιουργεί αυτόματα ένα απομονωμένο, ιδιωτικό δίκτυο στο οποίο εντάσσονται όλα τα services που δηλώνονται στο ίδιο αρχείο YAML. Αυτό επιτρέπει την άμεση και ασφαλή επικοινωνία μεταξύ τους, χωρίς να χρειάζεται να γνωρίζετε ή να ορίζετε IP διευθύνσεις. Τα containers αναγνωρίζουν το ένα το άλλο αυτόματα, χρησιμοποιώντας απλώς το όνομα του service τους ως hostname (Service Discovery).

<h2>Δομή ενός docker-compose.yml</h2>
<p class="lede">Το αρχείο YAML είναι ο χάρτης της εφαρμογής μας. Ας δούμε ένα κλασικό παράδειγμα με δύο containers (μια web εφαρμογή και μια βάση δεδομένων) για να καταλάβουμε τη σύνταξή του.</p>

      - "3000:3000"

    <p><strong>services:</strong><br>Η καρδιά του αρχείου. Κάτω από αυτή τη λέξη δηλώνουμε (με εσοχή) όλα τα ξεχωριστά containers που θέλουμε να σηκώσουμε.</p>
    <p><strong>frontend & database:</strong><br>Είναι τα δικά μας, προσαρμοσμένα ονόματα για τα services. Το Compose θα τα χρησιμοποιήσει και ως hostnames για να μιλάνε μεταξύ τους.</p>

<div class="eyebrow">Ενότητα 6 / 7 — Garbage Collection</div>
<h1>Διαχείριση Πόρων & Καθαρισμός</h1>
<p class="lede">Το Docker διατηρεί cache, παλιά images και stopped containers. Πριν καθαρίσεις τα πάντα μαζικά, μπορείς να ελέγξεις και να διαγράψεις συγκεκριμένους πόρους.</p>

<h2>1. Προβολή Πόρων (Inspection)</h2>

<pre><code class="lang-bash">// list active containers
docker ps

// list all containers (including stopped)
docker ps -a

// list all local images
docker images

// check total disk usage
docker system df</code></pre>

<h2>2. Στοχευμένη Διαγραφή (Specific Cleanup)</h2>

<pre><code class="lang-bash">// remove a specific container (must be stopped first)
docker rm &lt;container_id_or_name&gt;

// force remove a running container
docker rm -f &lt;container_id_or_name&gt;

// remove a specific image
docker rmi &lt;image_id_or_name&gt;</code></pre>

<h2>3. Μαζικός Καθαρισμός (Garbage Collection)</h2>

<pre><code class="lang-bash">// remove unused dangling images
docker image prune

// clean up EVERYTHING not actively in use
docker system prune -a --volumes</code></pre>
<p>Η εντολή <code>docker system prune -a --volumes</code> είναι η πιο δραστική: Διαγράφει όλα τα σταματημένα containers, τα αχρησιμοποίητα δίκτυα, όλα τα αδρανή images και με το <code>--volumes</code> διαγράφει και τα αχρησιμοποίητα volumes (<strong>ΠΡΟΣΟΧΗ: τα δεδομένα χάνονται</strong>).</p>
`);

<div class="eyebrow">Ενότητα 7 / 7 — Volumes</div>
<h1>Διατήρηση Δεδομένων (Docker Volumes)</h1>
<p class="lede">Τα containers είναι εξ ορισμού ephemeral (προσωρινά). Αν ένα container διαγραφεί, όλα τα δεδομένα που γράφτηκαν μέσα σε αυτό χάνονται για πάντα. Τα Volumes λύνουν αυτό το πρόβλημα.</p>

<div class="callout attention">
  <span class="tag">Τι είναι το Volume;</span>
  Ένας μηχανισμός που επιτρέπει στο container να διαβάζει και να γράφει αρχεία απευθείας στο σύστημα του host (εκτός container), διασφαλίζοντας ότι τα δεδομένα παραμένουν ασφαλή ακόμα κι αν το container καταστραφεί.
</div>

<h2>Γιατί είναι σημαντικά & Κύριες Χρήσεις</h2>
<ul>
  <li><strong>Data Persistence (Βάσεις Δεδομένων):</strong> Απαραίτητο για PostgreSQL, MySQL, Redis κ.ά. ώστε να μην χάνονται τα δεδομένα των χρηστών κατά το restart/update.</li>
  <li><strong>Shared Files / File Uploads:</strong> Αποθήκευση αρχείων (π.χ. εικόνες, user uploads, PDF) εκτός του container image.</li>
  <li><strong>Live Development (Bind Mounts):</strong> Σύνδεση του τοπικού πηγαίου κώδικα (source code) με το container για άμεσο reload χωρίς rebuild.</li>
</ul>

<h2>Βασικές Εντολές CLI & Compose</h2>
