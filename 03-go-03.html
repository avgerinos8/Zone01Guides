<div class="eyebrow">Ενότητα 6 / 7 — Πολυμορφισμός στην Πράξη</div>
<h1>Ανατομία: Read() &amp; Write()</h1>
<p class="lede">Ας δούμε ξανά, πιο προσεκτικά, τις δύο θεμελιώδεις μεθόδους — τώρα που ξέρεις πλήρως πώς λειτουργούν τα interfaces.</p>

<h2>io.Reader.Read(p []byte) (n int, err error)</h2>
<p>Η μέθοδος γεμίζει το slice <code class="inline-code">p</code> που της δίνεις με ΟΣΑ δεδομένα υπάρχουν διαθέσιμα (μέχρι το μήκος του p), και επιστρέφει πόσα bytes πραγματικά έγραψε μέσα στο p (<code class="inline-code">n</code>). Όταν δεν υπάρχουν άλλα δεδομένα, επιστρέφει το ειδικό error <code class="inline-code">io.EOF</code>.</p>

<h2>io.Writer.Write(p []byte) (n int, err error)</h2>
<p>Συμμετρικά: παίρνει τα bytes που βρίσκονται μέσα στο <code class="inline-code">p</code> και τα "γράφει" προς τον προορισμό, επιστρέφοντας πόσα πραγματικά γράφτηκαν.</p>

<h2>Πώς το *os.File Υλοποιεί ΚΑΙ τα Δύο Ταυτόχρονα</h2>
<p>Ο τύπος <code class="inline-code">*os.File</code> έχει ΚΑΙ μια μέθοδο <code class="inline-code">Read</code> ΚΑΙ μια μέθοδο <code class="inline-code">Write</code> με τις ακριβώς σωστές υπογραφές. Αυτό σημαίνει ότι <code class="inline-code">*os.File</code> ταιριάζει ΤΑΥΤΟΧΡΟΝΑ σε <code class="inline-code">io.Reader</code>, <code class="inline-code">io.Writer</code>, ΚΑΙ στο σύνθετο <code class="inline-code">io.ReadWriter</code> — χωρίς καμία επιπλέον προσπάθεια, απλά επειδή έχει τα σωστά methods.</p>

<pre><code class="lang-go">var r io.Reader = someFile  // OK — *os.File ταιριάζει σε io.Reader
var w io.Writer = someFile  // OK — ΚΑΙ σε io.Writer, το ΙΔΙΟ value
var rw io.ReadWriter = someFile // OK — ΚΑΙ στο σύνθετο interface</code></pre>

<div class="callout">
  <span class="tag">Σύνδεση με προηγούμενες ενότητες</span>
  Αυτό είναι το ΙΔΙΟ implicit implementation που είδαμε στην Ενότητα 5 — το <code class="inline-code">*os.File</code> δεν δηλώνει πουθενά "I implement io.Reader" — απλά έχει το σωστό method, και ταιριάζει αυτόματα, σε ΠΟΛΛΑΠΛΑ interfaces ταυτόχρονα.
</div>
`);

<h1>Πραγματικός Πολυμορφισμός: Piping Data Anywhere</h1>
<p class="lede">Εδώ είναι το πιο εντυπωσιακό κομμάτι: η ΙΔΙΑ ακριβώς function επεξεργασίας δεδομένων μπορεί να δουλέψει ΑΔΙΑΦΟΡΑ πάνω σε εντελώς διαφορετικές πηγές, αρκεί να δηλώνει ότι δέχεται <code class="inline-code">io.Reader</code> αντί για κάποιον συγκεκριμένο τύπο.</p>

<div class="grid2">

<p>Όλα τα παραπάνω, εντελώς διαφορετικά "πράγματα", μπορούν να περαστούν στην ΙΔΙΑ function, αρκεί εκείνη να δηλώνει το ορίσμά της ως <code class="inline-code">io.Reader</code> αντί για κάποιον από τους συγκεκριμένους τύπους.</p>

    scanner := bufio.NewScanner(r)

<h2>io.Copy: Το Απόλυτο Παράδειγμα</h2>
<p>Η function <code class="inline-code">io.Copy(dst Writer, src Reader)</code> είναι ίσως το καθαρότερο παράδειγμα αυτής της φιλοσοφίας: αντιγράφει δεδομένα από ΟΠΟΙΟΔΗΠΟΤΕ Reader σε ΟΠΟΙΟΝΔΗΠΟΤΕ Writer, χωρίς να νοιάζεται ΚΑΘΟΛΟΥ τι είναι το καθένα.</p>

<pre><code class="lang-go">srcFile, _ := os.Open("source.txt")
defer srcFile.Close()
dstFile, _ := os.Create("destination.txt")
defer dstFile.Close()

io.Copy(dstFile, srcFile) // αρχείο -> αρχείο

var buf bytes.Buffer
io.Copy(&buf, srcFile) // αρχείο -> μνήμη (buffer)
io.Copy(os.Stdout, srcFile) // αρχείο -> τερματικό</code></pre>

<h1>Παγίδες, Anti-patterns &amp; Testing Benefits</h1>

<h2>Tight Coupling Pitfall — Επανάληψη</h2>
<p>Ο κανόνας εμπειρίας: αν μια function χρειάζεται μόνο να διαβάσει ή να γράψει bytes ακολουθιακά, δήλωσε το όρισμά της ως <code class="inline-code">io.Reader</code> ή <code class="inline-code">io.Writer</code> — ΠΟΤΕ ως <code class="inline-code">*os.File</code>, εκτός αν πραγματικά χρειάζεσαι κάτι ειδικό για αρχεία (π.χ. <code class="inline-code">Stat()</code> για πληροφορίες αρχείου, που δεν υπάρχει στο απλό Reader interface).</p>

<h2>Unit Testing χωρίς Πραγματικά Αρχεία</h2>
<p>Αυτό είναι το πρακτικό όφελος που κάνει τη διαφορά καθημερινά: μπορείς να τεστάρεις τη λογική σου χρησιμοποιώντας <code class="inline-code">bytes.Buffer</code> ή <code class="inline-code">strings.NewReader</code> αντί για πραγματικά αρχεία στο δίσκο — πιο γρήγορο (καμία επαφή με δίσκο), πιο απομονωμένο (isolated· δεν αφήνει "σκουπίδια" αρχεία πίσω), και πιο απλό στο setup.</p>

<pre><code class="lang-go">// Η function δεν "ξέρει" αν τεσταρίζεται ή τρέχει σε production:
func ProcessData(r io.Reader, w io.Writer) error {
    data, err := io.ReadAll(r)
    if err != nil {
        return err
    }
    _, err = w.Write(bytes.ToUpper(data))
    return err
}

// Σε production:
ProcessData(realFile, os.Stdout)

// Σε test — ΧΩΡΙΣ κανένα πραγματικό αρχείο:
input := strings.NewReader("hello")
var output bytes.Buffer
ProcessData(input, &output)
// έλεγξε το output.String() == "HELLO"</code></pre>

<h2>Buffer Re-use &amp; Partial Reads Trap</h2>
<p>Μια σημαντική λεπτομέρεια όταν καλείς <code class="inline-code">Read</code> χειροκίνητα (όχι μέσω <code class="inline-code">io.ReadAll</code> ή scanner): ΔΕΝ είναι εγγυημένο ότι θα διαβαστούν ΟΛΑ τα ζητούμενα bytes με τη μία κλήση. Το <code class="inline-code">Read</code> μπορεί να επιστρέψει λιγότερα bytes από όσα χωράει το slice σου — αυτό δεν είναι σφάλμα, είναι απολύτως φυσιολογική συμπεριφορά (π.χ. σε δεδομένα δικτύου, που μπορεί να "φτάνουν" σταδιακά).</p>

<pre><code class="lang-go">buf := make([]byte, 1024)
n, err := r.Read(buf)
// ΛΑΘΟΣ υπόθεση: "n είναι πάντα 1024"
// ΣΩΣΤΗ υπόθεση: "n είναι ΤΟ ΠΟΣΟ που πραγματικά διαβάστηκε — ίσως λιγότερο"
data := buf[:n] // χρησιμοποίησε ΜΟΝΟ τα πρώτα n bytes, όχι όλο το buf</code></pre>

    addContent(`
<div class="eyebrow">Ενότητα 7 / 7 — Αρχιτεκτονικά Μοτίβα</div>
<h1>Pipeline Pattern</h1>
<p class="lede">Φτάσαμε στην τελευταία, πιο "αρχιτεκτονική" ενότητα. Εδώ δεν θα δούμε νέα σύνταξη της γλώσσας — θα δούμε <strong>μοτίβα</strong> (patterns): αποδεδειγμένους τρόπους οργάνωσης κώδικα που χρησιμοποιούν όσα ήδη έμαθες (structs, methods, interfaces, functions) για να λύσουν επαναλαμβανόμενα προβλήματα σχεδίασης.</p>

<h2>Τι είναι το Pipeline Pattern</h2>
<p>Ένα Pipeline (διοχέτευση) οργανώνει την επεξεργασία δεδομένων σε ξεχωριστά, διαδοχικά <strong>στάδια</strong> (stages) — κάθε στάδιο παίρνει την είσοδο, κάνει ΜΙΑ συγκεκριμένη δουλειά, και περνάει το αποτέλεσμα στο επόμενο στάδιο. Stage 1 → Stage 2 → Stage 3 → ... Το μοτίβο σου είναι ήδη γνώριμο αν σκεφτείς πώς επεξεργάζεσαι δεδομένα βήμα-βήμα: πρώτα καθάρισε τα δεδομένα, μετά μετάτρεψέ τα, μετά επικύρωσέ τα.</p>

<h2>Χωρίς Pipeline: Όλα Ανακατεμένα</h2>
<pre><code class="lang-go">func processUsername(raw string) (string, error) {
    // Καθάρισμα, μετασχηματισμός, ΚΑΙ επικύρωση όλα μπερδεμένα μαζί
    trimmed := strings.TrimSpace(raw)
    lower := strings.ToLower(trimmed)
    if len(lower) < 3 {
        return "", errors.New("username too short")
    }
    if strings.Contains(lower, " ") {
        return "", errors.New("username cannot contain spaces")
    }
    return lower, nil
}</code></pre>

<h2>Με Pipeline: Ξεκάθαρα Στάδια</h2>
<pre><code class="lang-go">type Stage func(string) (string, error)

func trimStage(s string) (string, error) {
    return strings.TrimSpace(s), nil
}

func lowerStage(s string) (string, error) {
    return strings.ToLower(s), nil
}

func validateLengthStage(s string) (string, error) {
    if len(s) < 3 {
        return "", errors.New("username too short")
    }
    return s, nil
}

func validateNoSpacesStage(s string) (string, error) {
    if strings.Contains(s, " ") {
        return "", errors.New("username cannot contain spaces")
    }
    return s, nil
}

// Ο ίδιος ο pipeline runner -- τρέχει κάθε στάδιο διαδοχικά
func runPipeline(input string, stages ...Stage) (string, error) {
    result := input
    var err error
    for _, stage := range stages {
        result, err = stage(result)
        if err != nil {
            return "", err // stop at first failure
        }
    }
    return result, nil
}

func main() {
    clean, err := runPipeline("  John Doe  ",
        trimStage,
        lowerStage,
        validateLengthStage,
        validateNoSpacesStage,
    )
}</code></pre>

<div class="callout">
  <span class="tag">Το κέρδος</span>

<div class="eyebrow">Ενότητα 7 / 7 — Αρχιτεκτονικά Μοτίβα</div>
<h1>Finite State Machine (FSM)</h1>
<p class="lede">Μια Μηχανή Πεπερασμένων Καταστάσεων μοντελοποιεί ένα σύστημα που βρίσκεται πάντα ΑΚΡΙΒΩΣ σε ΜΙΑ από ένα προκαθορισμένο σύνολο "καταστάσεων" (states), και μεταβαίνει (transitions) από τη μία κατάσταση στην άλλη ως απάντηση σε "συμβάντα" (events).</p>

<h2>Βασικές Έννοιες</h2>
<div class="grid3">
  <div class="card"><h3>States (Καταστάσεις)</h3><p>Οι διακριτές "φάσεις" στις οποίες μπορεί να βρίσκεται το σύστημα — π.χ. Pending, Paid, Shipped.</p></div>
  <div class="card"><h3>Events (Συμβάντα)</h3><p>Πράγματα που συμβαίνουν και μπορούν να προκαλέσουν αλλαγή κατάστασης — π.χ. "ο πελάτης πλήρωσε".</p></div>
  <div class="card"><h3>Transitions (Μεταβάσεις)</h3><p>Οι επιτρεπτοί "δρόμοι" από μια κατάσταση σε άλλη — π.χ. Pending → Paid, αλλά ΟΧΙ Pending → Shipped απευθείας.</p></div>
</div>

<p>Θα δούμε το ΙΔΙΟ πρόβλημα — μια παραγγελία e-shop που περνάει από <code class="inline-code">Pending → Paid → Shipped → Delivered</code> — υλοποιημένο με πέντε διαφορετικούς τρόπους, από τον πιο απλό μέχρι τον πιο ισχυρό, βλέποντας τα πλεονεκτήματα/μειονεκτήματα κάθε προσέγγισης.</p>

<h2>1η Υλοποίηση: Απλό Switch</h2>
<p>Η πιο "χωρίς σκέψη" προσέγγιση: μια function που παίρνει την τρέχουσα κατάσταση και ένα event, και αποφασίζει με ένα switch τι θα γίνει.</p>

<pre><code class="lang-go">type OrderState string

const (
    Pending   OrderState = "pending"
    Paid      OrderState = "paid"
    Shipped   OrderState = "shipped"
    Delivered OrderState = "delivered"
)

func transition(current OrderState, event string) (OrderState, error) {
    switch current {
    case Pending:
        if event == "pay" {
            return Paid, nil
        }
    case Paid:
        if event == "ship" {
            return Shipped, nil
        }
    case Shipped:
        if event == "deliver" {
            return Delivered, nil
        }
    }
    return current, fmt.Errorf("invalid transition from %s on event %s", current, event)
}</code></pre>

<div class="callout">
  <span class="tag">Πλεονεκτήματα &amp; Μειονεκτήματα</span>
  <strong>Καλό:</strong> εξαιρετικά απλό, κατανοητό με μία ματιά για μικρά FSMs. <strong>Κακό:</strong> δύσκολο να δεις "όλη την εικόνα" των επιτρεπτών μεταβάσεων με μία ματιά — είναι σκορπισμένη μέσα σε nested ifs· μεγαλώνει δύσκολα διαχειρίσιμα καθώς προστίθενται περισσότερες καταστάσεις/events.
</div>
`);

<div class="eyebrow">Ενότητα 7 / 7 — Αρχιτεκτονικά Μοτίβα</div>
<h1>2η Υλοποίηση FSM: Με Enums (iota)</h1>
<p class="lede">Αντί για strings ως καταστάσεις, χρησιμοποιούμε το <code class="inline-code">iota</code> για να ορίσουμε τις καταστάσεις ως ξεχωριστές, αριθμητικές σταθερές — πιο αποδοτικό, και ο compiler μπορεί να ελέγξει τύπους πιο αυστηρά.</p>

<pre><code class="lang-go">type OrderState int

const (
    Pending OrderState = iota // 0
    Paid                       // 1
    Shipped                    // 2
    Delivered                  // 3
)

// Δίνουμε στο OrderState μια μέθοδο String() ώστε να τυπώνεται ευανάγνωστα
func (s OrderState) String() string {
    names := []string{"Pending", "Paid", "Shipped", "Delivered"}
    return names[s]
}

func transition(current OrderState, event string) (OrderState, error) {
    switch current {
    case Pending:
        if event == "pay" {
            return Paid, nil
        }
    case Paid:
        if event == "ship" {
            return Shipped, nil
        }
    case Shipped:
        if event == "deliver" {
            return Delivered, nil
        }
    }
    return current, fmt.Errorf("invalid transition from %s on event %s", current, event)
}</code></pre>

<div class="callout">
  <span class="tag">Διαφορές από την 1η Υλοποίηση</span>
  <strong>Καλό:</strong> οι καταστάσεις είναι τώρα ένας ρητός, δικός τους τύπος (<code class="inline-code">OrderState</code>) αντί για γυμνά strings — ο compiler σε προστατεύει από τυπογραφικά λάθη (π.χ. <code class="inline-code">"Pyad"</code> αντί για <code class="inline-code">"Paid"</code> θα ήταν compile error εδώ, ενώ με strings θα ήταν silent bug). <strong>Κακό:</strong> η δομή switch/if παραμένει η ίδια — ακόμα δύσκολο να δεις όλες τις μεταβάσεις μαζί με μία ματιά.
</div>

<div class="eyebrow">Ενότητα 7 / 7 — Αρχιτεκτονικά Μοτίβα</div>
<h1>3η Υλοποίηση FSM: Πίνακας Μεταβάσεων (Map)</h1>
<p class="lede">Αντί για switch/if διάσπαρτα, "χτίζουμε" ρητά έναν πίνακα (πραγματικά, ένα map) που περιγράφει ΟΛΕΣ τις επιτρεπτές μεταβάσεις σε ΕΝΑ κεντρικό σημείο.</p>

<pre><code class="lang-go">type Event string

const (
    EventPay      Event = "pay"
    EventShip     Event = "ship"
    EventDeliver  Event = "deliver"
)

// Το "κλειδί" είναι ένα ζευγάρι (τρέχουσα κατάσταση, event) -> επόμενη κατάσταση
type transitionKey struct {
    state OrderState
    event Event
}

var transitions = map[transitionKey]OrderState{
    {Pending, EventPay}:     Paid,
    {Paid, EventShip}:       Shipped,
    {Shipped, EventDeliver}: Delivered,
}

func transition(current OrderState, event Event) (OrderState, error) {
    next, ok := transitions[transitionKey{current, event}]
    if !ok {
        return current, fmt.Errorf("invalid transition from %s on event %s", current, event)
    }
    return next, nil
}</code></pre>

<div class="callout">
  <span class="tag">Οι Διαφορές ανάμεσα σε 2 και 3</span>
  <strong>Καλό:</strong> ΟΛΕΣ οι επιτρεπτές μεταβάσεις φαίνονται μαζί, σε ΕΝΑ σημείο (το map) — μπορείς να "διαβάσεις" ολόκληρη τη λογική του FSM με μία ματιά, χωρίς να ψάχνεις μέσα σε switch statements. Η προσθήκη νέας μετάβασης είναι μία γραμμή στο map, χωρίς να αγγίξεις καθόλου τη function <code class="inline-code">transition</code>. <strong>Κακό:</strong> δεν μπορείς εύκολα να εκτελέσεις επιπλέον λογική (π.χ. "στείλε email") ΚΑΤΑ τη μετάβαση — το map δίνει μόνο "επόμενη κατάσταση", όχι ενέργειες.
</div>
`);

<div class="eyebrow">Ενότητα 7 / 7 — Αρχιτεκτονικά Μοτίβα</div>
<h1>4η Υλοποίηση FSM: Βασισμένη σε Callbacks/Hooks</h1>
<p class="lede">Τι γίνεται αν θέλουμε να εκτελεστεί ΕΠΙΠΛΕΟΝ λογική κατά τη μετάβαση — π.χ. "όταν η παραγγελία γίνεται Paid, στείλε email επιβεβαίωσης"; Προσθέτουμε ένα callback (μια function) σε κάθε μετάβαση.</p>

<pre><code class="lang-go">type transitionRule struct {
    next   OrderState
    action func(orderID string) // εκτελείται ΚΑΤΑ τη μετάβαση
}

var transitionsWithActions = map[transitionKey]transitionRule{
    {Pending, EventPay}: {
        next: Paid,
        action: func(orderID string) {
            fmt.Println("Sending payment confirmation email for order", orderID)
        },
    },
    {Paid, EventShip}: {
        next: Shipped,
        action: func(orderID string) {
            fmt.Println("Notifying shipping carrier for order", orderID)
        },
    },
    {Shipped, EventDeliver}: {
        next: Delivered,
        action: func(orderID string) {
            fmt.Println("Marking order delivered:", orderID)
        },
    },
}

func transition(current OrderState, event Event, orderID string) (OrderState, error) {
    rule, ok := transitionsWithActions[transitionKey{current, event}]
    if !ok {
        return current, fmt.Errorf("invalid transition from %s on event %s", current, event)
    }
    rule.action(orderID) // side effect εκτελείται εδώ
    return rule.next, nil
}</code></pre>

<div class="callout">
  <span class="tag">Οι Διαφορές ανάμεσα σε 3 και 4</span>
  <strong>Καλό:</strong> τώρα το FSM μπορεί να "κάνει πράγματα" κατά τη μετάβαση, όχι μόνο να αλλάζει κατάσταση — πολύ πιο ρεαλιστικό για πραγματικά συστήματα (notifications, logging, ενημέρωση άλλων υποσυστημάτων). <strong>Κακό:</strong> η δομή δεδομένων μεγαλώνει σε πολυπλοκότητα· debugging γίνεται λίγο πιο δύσκολο γιατί η "μετάβαση" τώρα έχει side effects ενσωματωμένα μέσα της, όχι μόνο καθαρή αλλαγή κατάστασης.
</div>
`);

<div class="eyebrow">Ενότητα 7 / 7 — Αρχιτεκτονικά Μοτίβα</div>
<h1>5η Υλοποίηση FSM: State Pattern με Structs &amp; Interfaces</h1>
<p class="lede">Η πιο "πλήρης" προσέγγιση: αντί κάθε κατάσταση να είναι απλά μια σταθερά (const), κάθε κατάσταση γίνεται ο ΔΙΚΟΣ ΤΗΣ τύπος (struct), που υλοποιεί ένα κοινό interface. Θυμήσου όσα έμαθες στις Ενότητες 3, 4 και 5 — εδώ συνδυάζονται όλα μαζί.</p>

<pre><code class="lang-go">// Το interface που ΚΑΘΕ κατάσταση πρέπει να υλοποιεί
type OrderStateHandler interface {
    Name() string
    Pay() (OrderStateHandler, error)
    Ship() (OrderStateHandler, error)
    Deliver() (OrderStateHandler, error)
}

// ── PendingState ──
type PendingState struct{}

func (s PendingState) Name() string { return "Pending" }
func (s PendingState) Pay() (OrderStateHandler, error) {
    return PaidState{}, nil
}
func (s PendingState) Ship() (OrderStateHandler, error) {
    return s, fmt.Errorf("cannot ship: order not paid yet")
}
func (s PendingState) Deliver() (OrderStateHandler, error) {
    return s, fmt.Errorf("cannot deliver: order not paid yet")
}

// ── PaidState ──
type PaidState struct{}

func (s PaidState) Name() string { return "Paid" }
func (s PaidState) Pay() (OrderStateHandler, error) {
    return s, fmt.Errorf("already paid")
}
func (s PaidState) Ship() (OrderStateHandler, error) {
    return ShippedState{}, nil
}
func (s PaidState) Deliver() (OrderStateHandler, error) {
    return s, fmt.Errorf("cannot deliver: not shipped yet")
}

// ── ShippedState ──
type ShippedState struct{}

func (s ShippedState) Name() string { return "Shipped" }
func (s ShippedState) Pay() (OrderStateHandler, error) {
    return s, fmt.Errorf("already paid")
}
func (s ShippedState) Ship() (OrderStateHandler, error) {
    return s, fmt.Errorf("already shipped")
}
func (s ShippedState) Deliver() (OrderStateHandler, error) {
    return DeliveredState{}, nil
}

// ── DeliveredState ──
type DeliveredState struct{}

func (s DeliveredState) Name() string { return "Delivered" }
func (s DeliveredState) Pay() (OrderStateHandler, error) {
    return s, fmt.Errorf("order already completed")
}
func (s DeliveredState) Ship() (OrderStateHandler, error) {
    return s, fmt.Errorf("order already completed")
}
func (s DeliveredState) Deliver() (OrderStateHandler, error) {
    return s, fmt.Errorf("order already delivered")
}</code></pre>

<h2>Χρήση</h2>
<pre><code class="lang-go">var order OrderStateHandler = PendingState{}

order, err := order.Pay()
fmt.Println(order.Name()) // "Paid"

order, err = order.Ship()
fmt.Println(order.Name()) // "Shipped"

_, err = order.Pay() // ΛΑΘΟΣ μετάβαση -> επιστρέφει error, ρητό μήνυμα</code></pre>

<div class="callout">
  <span class="tag">Γιατί λέγεται "State Pattern"</span>
  Παρατήρησε: κάθε κατάσταση "ξέρει" η ίδια τι επιτρέπεται να συμβεί από εκεί, και ΤΙ πρέπει να επιστρέψει σε κάθε περίπτωση — η λογική είναι ΑΠΟΚΕΝΤΡΩΜΕΝΗ (decentralized) σε κάθε state struct, αντί για ΚΕΝΤΡΙΚΟΠΟΙΗΜΕΝΗ (centralized) σε ένα switch ή map. Αυτό είναι ακριβώς πολυμορφισμός στην πράξη: η <code class="inline-code">main</code> function καλεί <code class="inline-code">order.Pay()</code> χωρίς να νοιάζεται ΠΟΙΑ κατάσταση είναι πραγματικά — κάθε state struct χειρίζεται τη δική του λογική.
</div>
`);

func Next(current TrafficLight) TrafficLight {

    default:

    }

<div class="eyebrow">Ενότητα 7 / 7 — Αρχιτεκτονικά Μοτίβα</div>
<h1>Strategy Pattern</h1>
<p class="lede">Το Strategy Pattern σου επιτρέπει να "εναλλάσσεις" (swap) διαφορετικούς αλγορίθμους ΚΑΤΑ την εκτέλεση (runtime), χωρίς να αλλάζεις τον κώδικα που τους χρησιμοποιεί. Βασίζεται εξ ολοκλήρου σε ό,τι ήδη ξέρεις για interfaces.</p>

<h2>Το Πρόβλημα: Πολλαπλοί Τρόποι Πληρωμής</h2>
<p>Φαντάσου ένα e-shop που υποστηρίζει πολλαπλούς τρόπους πληρωμής — πιστωτική κάρτα, PayPal, κρυπτονόμισμα. Η ΛΟΓΙΚΗ κάθε τρόπου είναι εντελώς διαφορετική, αλλά η "διεπαφή" (τι χρειάζεται να γίνει) είναι η ίδια: "επεξεργάσου μια πληρωμή συγκεκριμένου ποσού".</p>

<pre><code class="lang-go">type PaymentStrategy interface {
    Pay(amount float64) error
}

type CreditCardPayment struct {
    CardNumber string
}

func (c CreditCardPayment) Pay(amount float64) error {
    fmt.Printf("Charging %.2f to card ending in %s\\n", amount, c.CardNumber[len(c.CardNumber)-4:])
    return nil
}

type PayPalPayment struct {
    Email string
}

func (p PayPalPayment) Pay(amount float64) error {
    fmt.Printf("Charging %.2f via PayPal account %s\\n", amount, p.Email)
    return nil
}

type CryptoPayment struct {
    WalletAddress string
}

func (c CryptoPayment) Pay(amount float64) error {
    fmt.Printf("Sending %.2f to wallet %s\\n", amount, c.WalletAddress)
    return nil
}</code></pre>

<h2>Χρήση: Εναλλαγή Στρατηγικής χωρίς Αλλαγή Κώδικα</h2>
<pre><code class="lang-go">func checkout(amount float64, strategy PaymentStrategy) error {
    return strategy.Pay(amount) // δεν νοιάζεται ΚΑΘΟΛΟΥ ποια στρατηγική είναι
}

func main() {
    checkout(100, CreditCardPayment{CardNumber: "4111111111111234"})
    checkout(50, PayPalPayment{Email: "user@example.com"})
    checkout(200, CryptoPayment{WalletAddress: "0xABC..."})
}</code></pre>

<div class="callout">
  <span class="tag">Σύνδεση με προηγούμενα</span>
  Αναγνωρίζεις το μοτίβο — είναι ΑΚΡΙΒΩΣ το ίδιο interface-based polymorphism που είδαμε στην Ενότητα 5 με το <code class="inline-code">Shape</code>, απλά τώρα εφαρμοσμένο σε ένα πρακτικό, επιχειρησιακό πρόβλημα. Το "Strategy Pattern" δεν είναι νέα σύνταξη — είναι απλά ΕΝΑ ΟΝΟΜΑ για αυτό το ήδη γνώριμο σχήμα, όταν χρησιμοποιείται συγκεκριμένα για να εναλλάσσεις αλγορίθμους.
</div>

<div class="eyebrow">Ενότητα 7 / 7 — Αρχιτεκτονικά Μοτίβα</div>
<h1>Command Pattern</h1>
<p class="lede">Το Command Pattern "τυλίγει" ένα αίτημα (request) ή μια ενέργεια σε ένα struct, με μια κοινή μέθοδο <code class="inline-code">Execute()</code>. Η βασική ιδέα: αντί να καλείς μια function απευθείας, ΑΝΤΙΚΕΙΜΕΝΟΠΟΙΕΙΣ (encapsulate) την ίδια την ενέργεια της κλήσης — κάτι που ανοίγει δυνατότητες όπως αναβολή εκτέλεσης, αποθήκευση ιστορικού εντολών, ή Undo/Redo.</p>

<h2>Το Interface</h2>
<pre><code class="lang-go">type Command interface {
    Execute() error
}</code></pre>

<h2>Παράδειγμα: Job Queue</h2>
<pre><code class="lang-go">type SendEmailCommand struct {
    To      string
    Subject string
}

func (c SendEmailCommand) Execute() error {
    fmt.Printf("Sending email to %s: %s\\n", c.To, c.Subject)
    return nil
}

type ResizeImageCommand struct {
    Filename string
    Width    int
}

func (c ResizeImageCommand) Execute() error {
    fmt.Printf("Resizing %s to width %d\\n", c.Filename, c.Width)
    return nil
}

// Μια ουρά εντολών (job queue) -- ΔΕΝ νοιάζεται ΤΙ κάνει η κάθε εντολή
type JobQueue struct {
    jobs []Command
}

func (q *JobQueue) Add(cmd Command) {
    q.jobs = append(q.jobs, cmd)
}

func (q *JobQueue) RunAll() {
    for _, job := range q.jobs {
        if err := job.Execute(); err != nil {
            fmt.Println("job failed:", err)
        }
    }
}

func main() {
    queue := &JobQueue{}
    queue.Add(SendEmailCommand{To: "user@example.com", Subject: "Welcome!"})
    queue.Add(ResizeImageCommand{Filename: "photo.jpg", Width: 800})
    queue.RunAll() // εκτελεί όλες τις εντολές, με τη σειρά</code></pre>

<h2>Undo/Redo: Η Κλασική Χρήση</h2>
<p>Το Command Pattern είναι ιδιαίτερα δημοφιλές όταν χρειάζεσαι Undo/Redo λειτουργικότητα (π.χ. σε έναν text editor): αφού κάθε ενέργεια είναι "αντικειμενοποιημένη" σε ένα Command, μπορείς να κρατήσεις ιστορικό εντολών, και για Undo, να εκτελέσεις την "αντίστροφη" ενέργεια της τελευταίας εντολής στη λίστα.</p>

<div class="callout">
  <span class="tag">Strategy vs Command: η διαφορά</span>
  Και τα δύο μοτίβα χρησιμοποιούν interfaces με πολυμορφισμό — η διαφορά είναι στον ΣΚΟΠΟ. Το Strategy Pattern αφορά "ΠΩΣ να κάνεις κάτι" (ποιος αλγόριθμος/προσέγγιση χρησιμοποιείται). Το Command Pattern αφορά "ΤΙ πρέπει να γίνει" (μια συγκεκριμένη ενέργεια, αντικειμενοποιημένη, ώστε να μπορεί να περάσει, να αποθηκευτεί, ή να αναβληθεί).
</div>
`);

<div class="eyebrow">Ενότητα 7 / 7 — Αρχιτεκτονικά Μοτίβα</div>
<h1>Builder Pattern</h1>
<p class="lede">Τι γίνεται όταν ένα struct έχει ΠΟΛΛΑ πεδία, και θέλεις να το "χτίσεις" σταδιακά, βήμα-βήμα, αντί με ένα τεράστιο literal μονομιάς; Το Builder Pattern λύνει αυτό μέσω αλυσιδωτών (chained) κλήσεων μεθόδων.</p>

<h2>Το Πρόβλημα: Τεράστιοι Constructors</h2>
<pre><code class="lang-go">// ΔΥΣΚΟΛΟ να διαβαστεί: ποιο όρισμα είναι ποιο, χωρίς να κοιτάξεις την υπογραφή;
func NewServer(host string, port int, timeout int, maxConns int, tls bool, debug bool) *Server {
    // ...
}

srv := NewServer("localhost", 8080, 30, 100, true, false) // ΤΙ είναι το true; Το false;</code></pre>

<h2>Η Λύση: Method Chaining</h2>
<pre><code class="lang-go">type Server struct {
    host     string
    port     int
    timeout  int
    maxConns int
    tls      bool
}

type ServerBuilder struct {
    server Server
}

func NewServerBuilder() *ServerBuilder {
    return &ServerBuilder{
        server: Server{host: "localhost", port: 8080}, // sensible defaults
    }
}

func (b *ServerBuilder) Host(h string) *ServerBuilder {
    b.server.host = h
    return b // επιστρέφει ΤΟΝ ΙΔΙΟ builder -- επιτρέπει αλυσίδα κλήσεων
}

func (b *ServerBuilder) Port(p int) *ServerBuilder {
    b.server.port = p
    return b
}

func (b *ServerBuilder) Timeout(t int) *ServerBuilder {
    b.server.timeout = t
    return b
}

func (b *ServerBuilder) EnableTLS() *ServerBuilder {
    b.server.tls = true
    return b
}

func (b *ServerBuilder) Build() Server {
    return b.server
}</code></pre>

<h2>Χρήση: Αναγνώσιμη, Αυτο-εξηγούμενη Κατασκευή</h2>
<pre><code class="lang-go">srv := NewServerBuilder().
    Host("api.example.com").
    Port(443).
    Timeout(60).
    EnableTLS().
    Build()</code></pre>

<div class="callout">
  <span class="tag">Το κλειδί: κάθε method επιστρέφει τον builder</span>
  Η "μαγεία" του method chaining είναι απλή: κάθε method του builder επιστρέφει <code class="inline-code">*ServerBuilder</code> (τον εαυτό του), επιτρέποντας την επόμενη κλήση να "κολλήσει" απευθείας πάνω στο αποτέλεσμα της προηγούμενης. Το τελικό <code class="inline-code">Build()</code> σπάει αυτή την αλυσίδα, επιστρέφοντας το τελικό, ολοκληρωμένο struct.
</div>

<div class="callout">
  <span class="tag">Πότε αξίζει το Builder Pattern</span>
  Για structs με 2-3 πεδία, ένα απλό named literal είναι υπεραρκετό — το Builder Pattern προσθέτει πολυπλοκότητα χωρίς πραγματικό όφελος εκεί. Αξίζει όταν έχεις ΠΟΛΛΑ (5+) πεδία, κάποια προαιρετικά, και θέλεις η κατασκευή να διαβάζεται σαν "πρόταση" (π.χ. <code class="inline-code">.Host(...).Port(...).EnableTLS()</code>) αντί για έναν τεράστιο, δυσανάγνωστο literal.
</div>
`);

<div class="eyebrow">Ενότητα 7 / 7 — Αρχιτεκτονικά Μοτίβα</div>
<h1>Functional Options Pattern</h1>
<p class="lede">Μια εναλλακτική, πολύ "Go-ική" λύση στο ίδιο πρόβλημα (πολλά, προαιρετικά ορίσματα κατασκευής) — αντί για ξεχωριστό Builder struct, χρησιμοποιούμε functions ως "options" που τροποποιούν το struct κατά την κατασκευή του.</p>

<h2>Το Θεμελιώδες Σχήμα</h2>
<pre><code class="lang-go">type Server struct {
    host     string
    port     int
    timeout  int
    tls      bool
}

// Option είναι μια function που τροποποιεί ένα *Server
type Option func(*Server)

func WithHost(h string) Option {
    return func(s *Server) {
        s.host = h
    }
}

func WithPort(p int) Option {
    return func(s *Server) {
        s.port = p
    }
}

func WithTimeout(t int) Option {
    return func(s *Server) {
        s.timeout = t
    }
}

func WithTLS() Option {
    return func(s *Server) {
        s.tls = true
    }
}

// Ο constructor δέχεται variadic Options -- όσα (ή όσο λίγα) χρειάζεσαι
func NewServer(opts ...Option) *Server {
    // Ξεκίνα με τις προεπιλεγμένες τιμές (defaults)
    s := &Server{
        host:    "localhost",
        port:    8080,
        timeout: 30,
    }

    // Εφάρμοσε κάθε option, με τη σειρά
    for _, opt := range opts {
        opt(s)
    }

    return s
}</code></pre>

<h2>Χρήση: Πλήρης Ευελιξία</h2>
<pre><code class="lang-go">// Χωρίς κανένα option -- όλα τα defaults
srv1 := NewServer()

// Με ΜΕΡΙΚΑ options -- μόνο αυτά που θέλεις να αλλάξεις
srv2 := NewServer(WithPort(443), WithTLS())

// Με ΟΛΑ τα options
srv3 := NewServer(
    WithHost("api.example.com"),
    WithPort(443),
    WithTimeout(60),
    WithTLS(),
)</code></pre>

<div class="callout">
  <span class="tag">Builder vs Functional Options: πότε ποιο</span>
  Και τα δύο μοτίβα λύνουν το ίδιο πρόβλημα (πολλά, προαιρετικά ορίσματα κατασκευής), με διαφορετικό "αίσθημα". Το Builder Pattern ταιριάζει καλύτερα όταν η κατασκευή έχει φυσική, ΔΙΑΔΟΧΙΚΗ λογική βημάτων. Το Functional Options Pattern είναι πιο ιδιωματικό (idiomatic) στη Go standard library και σε δημοφιλή Go frameworks — είναι πιο συμπαγές, δεν χρειάζεται ξεχωριστό Builder struct, και τα options μπορούν να περαστούν με ΟΠΟΙΑΔΗΠΟΤΕ σειρά, χωρίς να χρειάζεται αλυσίδα.
</div>

<h2>Αποφυγή Τεράστιων Constructors &amp; Διαχείριση Defaults</h2>
<p>Και τα δύο μοτίβα που είδαμε σε αυτή την υποενότητα λύνουν το ίδιο θεμελιώδες πρόβλημα: έναν constructor με δεκάδες παραμέτρους, όπου δεν είναι ξεκάθαρο ποια είναι προαιρετική, ποια υποχρεωτική, και ΤΙ ΣΗΜΑΙΝΕΙ κάθε θέση στην κλήση. Και οι δύο προσεγγίσεις σου επιτρέπουν να ορίσεις λογικές προεπιλεγμένες τιμές (defaults) ΜΙΑ φορά, στο κέντρο, και να "παρακάμπτεις" (override) μόνο ό,τι χρειάζεται — αντί ο κάθε καλών να πρέπει να θυμάται και να περνάει ΚΑΘΕ τιμή, ρητά, κάθε φορά.</p>
`);

<div class="eyebrow">Ενότητα 7 / 7 — VSCode Challenge</div>
<h1>HTTPClient με Functional Options</h1>
<p class="lede">Συνδύασε ό,τι έμαθες σε αυτή την τελευταία υποενότητα.</p>

<div class="callout">
  <span class="tag">Η Άσκηση</span>
  Δημιούργησε ένα struct <code class="inline-code">HTTPClient</code> με πεδία <code class="inline-code">baseURL string</code>, <code class="inline-code">timeoutSeconds int</code>, και <code class="inline-code">retries int</code>. Γράψε τον τύπο <code class="inline-code">Option func(*HTTPClient)</code> και τρεις option functions: <code class="inline-code">WithBaseURL(url string)</code>, <code class="inline-code">WithTimeout(seconds int)</code>, <code class="inline-code">WithRetries(n int)</code>. Γράψε τον constructor <code class="inline-code">NewHTTPClient(opts ...Option) *HTTPClient</code> με λογικά defaults (π.χ. timeout 10 δευτερόλεπτα, 0 retries). Στο τέλος, δημιούργησε ένα client περνώντας ΜΟΝΟ το baseURL και retries, αφήνοντας το timeout στο default.
</div>

<div class="callout">
  <span class="tag">HINT 1</span>
  Κάθε option function (π.χ. WithBaseURL) πρέπει να ΕΠΙΣΤΡΕΦΕΙ μια function τύπου Option — δεν τροποποιεί απευθείας τίποτα η ίδια, απλά "χτίζει" τη function που θα το κάνει αργότερα.
</div>

<div class="callout">
  <span class="tag">HINT 2</span>
  Μέσα στον constructor, πρώτα όρισε το struct με τα defaults, ΜΕΤΑ κάνε loop πάνω στα opts καλώντας το καθένα με το struct ως όρισμα.
</div>

<div class="spoiler"><div class="spoiler-lock"><span>Drag to reveal →</span></div><pre><code class="lang-go">type HTTPClient struct {
    baseURL        string
    timeoutSeconds int
    retries        int
}

type Option func(*HTTPClient)

func WithBaseURL(url string) Option {
    return func(c *HTTPClient) {
        c.baseURL = url
    }
}

func WithTimeout(seconds int) Option {
    return func(c *HTTPClient) {
        c.timeoutSeconds = seconds
    }
}

func WithRetries(n int) Option {
    return func(c *HTTPClient) {
        c.retries = n
    }
}

func NewHTTPClient(opts ...Option) *HTTPClient {
    c := &HTTPClient{
        baseURL:        "http://localhost",
        timeoutSeconds: 10,
        retries:        0,
    }
    for _, opt := range opts {
        opt(c)
    }
    return c
}

func main() {
    client := NewHTTPClient(
        WithBaseURL("https://api.example.com"),
        WithRetries(3),
        // timeoutSeconds stays at the default: 10
    )
    fmt.Printf("%+v\\n", *client)
}</code></pre></div>
`);
