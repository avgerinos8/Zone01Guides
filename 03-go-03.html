    addContent(`
<div class="eyebrow">Ενότητα 1 / 7 — Error Handling &amp; Standard Packages</div>
<h1>Η Φιλοσοφία του Error Handling στη Go</h1>
<p class="lede">Αν έρχεσαι από Python, Java ή JavaScript, το πρώτο πράγμα που θα σου φανεί περίεργο στη Go είναι αυτό που <em>δεν</em> υπάρχει: δεν υπάρχει <code class="inline-code">try</code>, δεν υπάρχει <code class="inline-code">catch</code>, δεν υπάρχει <code class="inline-code">throw</code>. Αυτό δεν είναι παράλειψη — είναι συνειδητή αρχιτεκτονική επιλογή.</p>

<h2>Γιατί όχι Exceptions;</h2>
<p>Σε γλώσσες με exceptions, ένα σφάλμα είναι ένα "κρυφό" μονοπάτι εκτέλεσης: μια συνάρτηση μπορεί να πετάξει (throw) ένα exception από οπουδήποτε μέσα της, και αυτό ανεβαίνει (propagates) προς τα πάνω στη στοίβα κλήσεων μέχρι κάποιο <code class="inline-code">catch</code> να το πιάσει — ή, αν κανείς δεν το πιάσει, το πρόγραμμα κρασάρει. Το πρόβλημα: διαβάζοντας μια απλή γραμμή κώδικα όπως <code class="inline-code">total = calculatePrice(item)</code> δεν μπορείς να ξέρεις, μόνο κοιτώντας τη, αν αυτή η κλήση μπορεί να αποτύχει και πώς. Το error handling γίνεται "αόρατο" στην ανάγνωση του κώδικα.</p>
<p>Οι σχεδιαστές της Go (Rob Pike, Ken Thompson, Robert Griesemer) πήραν την αντίθετη απόφαση: <strong>ένα σφάλμα είναι απλώς μια τιμή</strong> (value), ακριβώς όπως ένα int ή ένα string. Μια συνάρτηση που μπορεί να αποτύχει, το δηλώνει ρητά στην υπογραφή της (signature), επιστρέφοντας ένα δεύτερο αποτέλεσμα τύπου <code class="inline-code">error</code> δίπλα στο κανονικό της αποτέλεσμα.</p>

<pre><code><span class="tok-com">// Python-style thinking (δεν είναι Go):</span>
<span class="tok-com">// total = calculate_price(item)  -- μπορεί να πετάξει exception, δεν φαίνεται</span>

<span class="tok-com">// Go: το error φαίνεται στην ίδια τη γραμμή που καλείς τη function</span>
<span class="tok-type">total</span>, <span class="tok-type">err</span> <span class="tok-kw">:=</span> calculatePrice(item)
</code></pre>

<div class="callout">
  <span class="tag">Αρχιτεκτονική συνέπεια</span>
  Επειδή το error είναι μια απλή τιμή, ο compiler σε "αναγκάζει" έμμεσα να το χειριστείς: αν αγνοήσεις μια μεταβλητή error χωρίς λόγο, ο κώδικάς σου φαίνεται ύποπτος με την πρώτη ματιά — δεν κρύβεται πουθενά. Αυτό κάνει τον κώδικα Go πιο "προβλέψιμο" στην ανάγνωση, με το κόστος να είναι περισσότερες γραμμές ελέγχου (<code class="inline-code">if err != nil</code>) σκορπισμένες παντού.
</div>

<h2>Errors as Values — τι σημαίνει στην πράξη</h2>
<p>Το ότι το error είναι "απλά μια τιμή" σημαίνει ότι μπορείς να κάνεις μαζί του ό,τι κάνεις με οποιαδήποτε άλλη τιμή: να το αποθηκεύσεις σε μεταβλητή, να το περάσεις σε άλλη function, να το συγκρίνεις, να το τυπώσεις, ακόμα και να το αγνοήσεις (κάτι που, βέβαια, συνήθως είναι κακή ιδέα). Δεν υπάρχει ειδικός μηχανισμός "διακοπής ροής" όπως το throw — η ροή του προγράμματος συνεχίζει κανονικά, γραμμή-γραμμή, και εσύ αποφασίζεις τι θα κάνεις όταν δεις ότι κάτι πήγε στραβά.</p>

<div class="grid3">
  <div class="card"><h3>Exceptions (άλλες γλώσσες)</h3><p>Κρυφή ροή ελέγχου· το σφάλμα "πηδάει" προς τα πάνω μέχρι να πιαστεί· ο κώδικας που το χειρίζεται είναι μακριά από τον κώδικα που το προκάλεσε.</p></div>
  <div class="card"><h3>Errors as Values (Go)</h3><p>Ρητή, ορατή ροή· το σφάλμα επιστρέφεται σαν κανονική τιμή· ο χειρισμός γίνεται αμέσως δίπλα στην κλήση που μπορεί να αποτύχει.</p></div>
  <div class="card"><h3>Το κόστος</h3><p>Περισσότερος "θόρυβος" κώδικα (πολλά <code class="inline-code">if err != nil</code>)· ανταλλαγή που η κοινότητα της Go θεωρεί άξια για τη σαφήνεια.</p></div>
</div>
`);

    // ── Section 1.2 ──────────────────────────────────────────────────────── ⊃
    addContent(`
<div class="eyebrow">Ενότητα 1 / 7 — Error Handling &amp; Standard Packages</div>
<h1>Το Interface <code class="inline-code">error</code>: Ανατομία</h1>
<p class="lede">Πριν προχωρήσουμε, χρειάζεται να δούμε τι ΕΙΝΑΙ πραγματικά ο τύπος <code class="inline-code">error</code>. Δεν είναι ένα ειδικό, "μαγικό" κατασκεύασμα της γλώσσας — είναι ένα ενσωματωμένο (built-in) interface, τόσο απλό όσο αυτό:</p>

<pre><code class="lang-go">type error interface {
    Error() string
}</code></pre>

<p>Αυτό σημαίνει: <strong>οτιδήποτε</strong> έχει μια μέθοδο <code class="inline-code">Error() string</code> είναι αυτόματα ένα έγκυρο error στη Go. Δεν χρειάζεται να κληρονομήσεις από κάποια ειδική κλάση, ούτε να δηλώσεις ρητά ότι "αυτό είναι error" — αν το type σου έχει αυτή τη μία μέθοδο, ταιριάζει στο interface. (Θα δούμε γιατί αυτό λέγεται "implicit implementation" αναλυτικά στην Ενότητα 5 για τα Interfaces — προς το παρόν, κράτησε ότι το <code class="inline-code">error</code> είναι απλώς ένα συμβόλαιο συμπεριφοράς.)</p>

<div class="callout">
  <span class="tag">Γιατί έχει σημασία τώρα</span>
  Όταν βλέπεις <code class="inline-code">var err error</code>, δεν φαντάζεσαι ένα συγκεκριμένο "κουτί" δεδομένων — φαντάζεσαι <em>οποιοδήποτε</em> value που ξέρει να απαντήσει στην ερώτηση "τι πήγε στραβά;" μέσω της <code class="inline-code">Error()</code>. Αυτό είναι που επιτρέπει σε βιβλιοθήκες τρίτων να ορίζουν τα δικά τους, πλουσιότερα error types (π.χ. με επιπλέον πεδία όπως error code) χωρίς να σπάνε τη συμβατότητα με τον υπόλοιπο κώδικα Go.
</div>

<h2>Η zero value ενός error</h2>
<p>Η zero value κάθε interface — άρα και του error — είναι <code class="inline-code">nil</code>. Αυτό είναι θεμελιώδες: όταν μια function πετυχαίνει, δεν επιστρέφει "κάποιο ειδικό success error" — επιστρέφει κυριολεκτικά <code class="inline-code">nil</code>, που σημαίνει "δεν υπήρξε κανένα σφάλμα". Ο έλεγχος <code class="inline-code">if err != nil</code> που θα βλέπεις παντού είναι ακριβώς αυτό: "αν αυτή η μεταβλητή δεν είναι κενή, κάτι πήγε στραβά".</p>

<pre><code class="lang-go">func divide(a, b int) (int, error) {
    if b == 0 {
        return 0, errors.New("cannot divide by zero")
    }
    return a / b, nil // nil = "no error happened"
}</code></pre>
`);

    addContent(`
<div class="eyebrow">Ενότητα 1 / 7 — Error Handling &amp; Standard Packages</div>
<h1>Δημιουργία &amp; Διαχείριση Σφαλμάτων</h1>
<p class="lede">Τώρα που ξέρουμε τι ΕΙΝΑΙ ένα error, ας δούμε πώς το <strong>δημιουργούμε</strong> εμείς οι ίδιοι μέσα σε δικές μας functions.</p>

<h2>errors.New — το απλούστερο εργαλείο</h2>
<p>Το πακέτο <code class="inline-code">errors</code> της standard library προσφέρει τη function <code class="inline-code">errors.New(text string) error</code>: παίρνει ένα string και επιστρέφει ένα value που υλοποιεί το error interface, με αυτό το string ως το μήνυμά του.</p>

<pre><code class="lang-go">import "errors"

func validateAge(age int) error {
    if age < 0 {
        return errors.New("age cannot be negative")
    }
    if age > 150 {
        return errors.New("age is unrealistically high")
    }
    return nil
}</code></pre>

<h2>fmt.Errorf — όταν χρειάζεσαι δυναμικό περιεχόμενο</h2>
<p>Συχνά θέλεις το μήνυμα σφάλματος να περιλαμβάνει συγκεκριμένες τιμές — π.χ. "ποιο ήταν το άκυρο input;". Εδώ μπαίνει η <code class="inline-code">fmt.Errorf</code>, η οποία δουλεύει σαν την οικεία <code class="inline-code">fmt.Sprintf</code> αλλά επιστρέφει κατευθείαν ένα error αντί για string.</p>

<pre><code class="lang-go">import "fmt"

func validateAge(age int) error {
    if age < 0 {
        return fmt.Errorf("invalid age %d: cannot be negative", age)
    }
    return nil
}</code></pre>

<div class="callout">
  <span class="tag">Πότε ποιο;</span>
  Χρησιμοποίησε <code class="inline-code">errors.New</code> για στατικά, σταθερά μηνύματα που δεν αλλάζουν ποτέ. Χρησιμοποίησε <code class="inline-code">fmt.Errorf</code> όταν θέλεις να "χτίσεις" το μήνυμα δυναμικά, ενσωματώνοντας τιμές μεταβλητών μέσα του με τα ίδια verbs (<code class="inline-code">%d</code>, <code class="inline-code">%s</code>, <code class="inline-code">%v</code> κ.λπ.) που ήδη ξέρεις από το <code class="inline-code">fmt.Println</code>/<code class="inline-code">fmt.Printf</code>.
</div>

<h2>Το θεμελιώδες μοτίβο: Guard Clause</h2>
<p>Σχεδόν κάθε function στη Go που μπορεί να αποτύχει ακολουθεί το ίδιο σχήμα: έλεγξε αμέσως αν κάτι πήγε στραβά, και αν ναι, βγες νωρίς (early return) με το error. Αυτό λέγεται <strong>Guard Clause</strong> — "φρουρός" στην είσοδο της λογικής σου, που αποτρέπει τον υπόλοιπο κώδικα να τρέξει πάνω σε άκυρα δεδομένα.</p>

<pre><code class="lang-go">func processOrder(quantity int) (int, error) {
    // Guard clause: έλεγξε πρώτα, βγες νωρίς αν κάτι δεν πάει καλά
    if quantity <= 0 {
        return 0, errors.New("quantity must be positive")
    }

    // Ο υπόλοιπος κώδικας μπορεί τώρα να υποθέσει με ασφάλεια ότι quantity > 0
    total := quantity * 10
    return total, nil
}</code></pre>

<div class="grid2">
  <div class="card"><h3>Χωρίς Guard Clause</h3><p>Ο κύριος κώδικας μπερδεύεται με ελέγχους σε βάθος (nested ifs), δύσκολο να διαβαστεί η "χαρούμενη διαδρομή" (happy path).</p></div>
  <div class="card"><h3>Με Guard Clause</h3><p>Όλοι οι έλεγχοι σφαλμάτων μαζεύονται στην κορυφή· ό,τι απομένει μετά είναι καθαρή, γραμμική λογική χωρίς εμφωλευμένα ifs.</p></div>
</div>
`);

<div class="eyebrow">Ενότητα 1 / 7 — Error Handling &amp; Standard Packages</div>
<h1>Η λέξη-κλειδί <code class="inline-code">defer</code></h1>
<p class="lede">Πριν μιλήσουμε για panic και recover, χρειάζεται να καταλάβεις καλά το <code class="inline-code">defer</code> — γιατί το recover δουλεύει ΜΟΝΟ μέσα σε deferred κλήσεις, και θα το δεις παντού όπου υπάρχει "καθάρισμα" πόρων (resources).</p>

<h2>Τι κάνει το defer</h2>
<p>Η <code class="inline-code">defer</code> μπροστά από μια κλήση function λέει στη Go: "εκτέλεσε αυτή την κλήση, αλλά όχι τώρα — εκτέλεσέ την ακριβώς πριν η περικλείουσα function επιστρέψει (return), όποια κι αν είναι η αιτία της επιστροφής". Είναι εξαιρετικά χρήσιμο για ενέργειες "καθαρισμού" — κλείσιμο αρχείου, απελευθέρωση lock, κλείσιμο σύνδεσης δικτύου — γιατί τις γράφεις ΑΜΕΣΩΣ δίπλα στο σημείο που άνοιξες τον πόρο, αντί να πρέπει να θυμάσαι να τις βάλεις σε κάθε πιθανό σημείο εξόδου της function.</p>

<pre><code class="lang-go">func readConfig() {
    file, _ := os.Open("config.txt")
    defer file.Close() // θα εκτελεστεί ΟΤΙΔΗΠΟΤΕ κι αν συμβεί παρακάτω

    // ... πολύπλοκη λογική με πολλά πιθανά early returns ...
    // δεν χρειάζεται να θυμάσαι να καλέσεις file.Close() σε καθένα από αυτά
}</code></pre>

<h2>Στοίβα εκτέλεσης: LIFO</h2>
<p>Αν έχεις πολλαπλά <code class="inline-code">defer</code> μέσα στην ίδια function, εκτελούνται με σειρά <strong>LIFO</strong> (Last In, First Out) — σαν στοίβα (stack). Το τελευταίο defer που δηλώθηκε είναι το πρώτο που θα τρέξει.</p>

<pre><code class="lang-go">func demo() {
    defer fmt.Println("first deferred")  // θα τυπωθεί ΤΡΙΤΟ
    defer fmt.Println("second deferred") // θα τυπωθεί ΔΕΥΤΕΡΟ
    defer fmt.Println("third deferred")  // θα τυπωθεί ΠΡΩΤΟ
    fmt.Println("function body")         // τυπώνεται πρώτο απ' όλα
}
// Έξοδος:
// function body
// third deferred
// second deferred
// first deferred</code></pre>

<div class="callout">
  <span class="tag">Γιατί LIFO βγάζει νόημα</span>
  Σκέψου το σαν "άνοιγμα-κλείσιμο σε αντίστροφη σειρά": αν ανοίξεις αρχείο Α, μετά σύνδεση Β, μετά lock Γ — θέλεις να κλείσεις πρώτα το Γ, μετά το Β, μετά το Α. Δηλαδή κλείνεις πάντα τον πιο πρόσφατα ανοιγμένο πόρο πρώτο, ακριβώς όπως το LIFO της στοίβας.
</div>

<h2>Πότε αξιολογούνται τα arguments</h2>
<p>Ένα σημείο που μπερδεύει αρχάριους: τα arguments μιας deferred κλήσης αξιολογούνται <strong>αμέσως</strong>, τη στιγμή που συναντάται το defer — όχι αργότερα, όταν εκτελείται η κλήση.</p>

<pre><code class="lang-go">func demo() {
    x := 10
    defer fmt.Println("x was:", x) // το x εδώ "παγώνει" στην τιμή 10 ΤΩΡΑ
    x = 20
    fmt.Println("x is now:", x)
}
// Έξοδος:
// x is now: 20
// x was: 10   <- όχι 20! το argument είχε ήδη αξιολογηθεί</code></pre>
`);

    addContent(`
<div class="eyebrow">Ενότητα 1 / 7 — Error Handling &amp; Standard Packages</div>
<h1>Panic: Πότε επιτρέπεται</h1>
<p class="lede">Το <code class="inline-code">panic</code> το γνώρισες ήδη επιφανειακά στο Μέρος 1, ως ένα από τα δύο "failure modes" (μαζί με το compile error). Τώρα θα δούμε πότε είναι ΣΩΣΤΟ να το χρησιμοποιείς εσύ ο ίδιος/η ίδια, και πότε ΟΧΙ.</p>

<h2>Η βασική αρχή: panic ≠ error handling</h2>
<p>Ένα πολύ συχνό λάθος αρχαρίων είναι να χρησιμοποιούν <code class="inline-code">panic</code> σαν να ήταν "throw" από άλλες γλώσσες — δηλαδή σαν κανονικό μηχανισμό για αναμενόμενα σφάλματα (π.χ. "ο χρήστης έδωσε άκυρο input"). Αυτό είναι λάθος. Στη Go, η σύμβαση είναι ξεκάθαρη: <strong>το error είναι για αναμενόμενα, ανακτήσιμα προβλήματα· το panic είναι για μη αναμενόμενα, μη ανακτήσιμα σφάλματα προγραμματισμού ή συστήματος</strong>.</p>

<div class="grid2">
  <div class="card"><h3>Χρησιμοποίησε error όταν...</h3><p>Ο χρήστης έδωσε άκυρο input, ένα αρχείο δεν βρέθηκε, μια σύνδεση δικτύου απέτυχε — καταστάσεις που ο <em>καλών κώδικας</em> μπορεί λογικά να περιμένει και να χειριστεί.</p></div>
  <div class="card"><h3>Χρησιμοποίησε panic όταν...</h3><p>Κάτι έσπασε μια θεμελιώδη υπόθεση του προγράμματος — π.χ. ένα index εκτός ορίων array, διαίρεση με το μηδέν, ή ένα bug προγραμματισμού που δεν έπρεπε ποτέ να συμβεί.</p></div>
</div>

<p>Στην πράξη, τα περισσότερα panics που θα δεις δεν θα τα γράψεις εσύ ρητά — θα προκληθούν αυτόματα από το ίδιο το runtime της Go (π.χ. <code class="inline-code">index out of range</code>, <code class="inline-code">nil pointer dereference</code>, <code class="inline-code">integer divide by zero</code>). Η ρητή χρήση <code class="inline-code">panic("...")</code> στον δικό σου κώδικα κρατιέται συνήθως για πραγματικά εξαιρετικές περιπτώσεις — π.χ. αν ένα configuration που ΠΡΕΠΕΙ να υπάρχει λείπει εντελώς κατά την εκκίνηση του προγράμματος.</p>

<pre><code class="lang-go">func mustLoadConfig(path string) *Config {
    cfg, err := loadConfig(path)
    if err != nil {
        // Αν το config λείπει, το πρόγραμμα δεν μπορεί ΚΑΘΟΛΟΥ να λειτουργήσει —
        // δεν υπάρχει λογικό "ανάκτησε και συνέχισε" εδώ.
        panic("critical: cannot load required config: " + err.Error())
    }
    return cfg
}</code></pre>

<div class="callout">
  <span class="tag">Κανόνας εμπειρίας</span>
  Αν μια function μπορεί λογικά να αναμένει ότι κάτι θα πάει στραβά και ο καλών της μπορεί να αποφασίσει τι να κάνει γι' αυτό — επίστρεψε error. Αν κάτι είναι τόσο σοβαρό που το πρόγραμμα δεν μπορεί λογικά να συνεχίσει — τότε, και μόνο τότε, σκέψου το panic.
</div>
`);

<div class="eyebrow">Ενότητα 1 / 7 — Error Handling &amp; Standard Packages</div>
<h1>Recover: Περιορισμός της Ζημιάς</h1>
<p class="lede">Αν το panic ξεκινήσει και κανείς δεν κάνει τίποτα, το πρόγραμμα τερματίζει βίαια (crash), τυπώνοντας ένα stack trace. Το <code class="inline-code">recover</code> είναι ο μηχανισμός που σου επιτρέπει να "πιάσεις" ένα panic πριν κρασάρει ολόκληρο το πρόγραμμα, και να το μετατρέψεις σε κάτι πιο διαχειρίσιμο — συνήθως, ξανά, σε ένα κανονικό error.</p>

<h2>Ο κανόνας: recover δουλεύει ΜΟΝΟ μέσα σε defer</h2>
<p>Το <code class="inline-code">recover()</code> έχει νόημα μόνο όταν καλείται απευθείας μέσα σε μια deferred function. Αν το καλέσεις οπουδήποτε αλλού, απλά επιστρέφει <code class="inline-code">nil</code> και δεν κάνει τίποτα. Αυτό είναι σκόπιμο: θέλουμε το recover να μπορεί να "πιάσει" ένα panic ακριβώς τη στιγμή που η στοίβα κλήσεων ξετυλίγεται (unwinds) εξαιτίας του — και αυτό συμβαίνει μόνο κατά την εκτέλεση των deferred calls.</p>

<pre><code class="lang-go">func safeDivide(a, b int) (result int, err error) {
    defer func() {
        if r := recover(); r != nil {
            // Το panic "πιάστηκε" εδώ — το μετατρέπουμε σε κανονικό error
            err = fmt.Errorf("recovered from panic: %v", r)
        }
    }()

    result = a / b // αν b == 0, αυτό προκαλεί panic: "integer divide by zero"
    return result, nil
}</code></pre>

<div class="callout">
  <span class="tag">Τι κάνει πραγματικά αυτός ο κώδικας</span>
  Η named return value <code class="inline-code">err</code> επιτρέπει στο deferred closure να "τροποποιήσει" το τελικό αποτέλεσμα της function ΑΚΟΜΑ κι αν το υπόλοιπο σώμα της function δεν ολοκλήρωσε ποτέ κανονικά (λόγω panic). Αν κληθεί <code class="inline-code">safeDivide(10, 0)</code>, η function δεν κρασάρει το πρόγραμμα — επιστρέφει (0, ένα error) σαν να ήταν κανονική αποτυχία.
</div>

<h2>Πότε ΝΑ χρησιμοποιείς recover — και πότε ΟΧΙ</h2>
<p>Το recover ΔΕΝ πρέπει να γίνει η δικαιολογία σου για να χρησιμοποιείς panic σαν κανονικό error handling. Η κύρια, νόμιμη χρήση του recover είναι σε "όρια" (boundaries) του προγράμματος — π.χ. σε έναν web server, θέλεις ένα panic σε ένα request να μην ρίξει ολόκληρο τον server, οπότε βάζεις recover στο επίπεδο διαχείρισης κάθε request. Το να βάζεις recover σε κάθε δεύτερη function σου, ως γενική "ασπίδα", θεωρείται κακή πρακτική — κρύβει πραγματικά bugs αντί να τα διορθώνει.</p>

<div class="grid2">
  <div class="card"><h3>Καλή χρήση</h3><p>Σε ένα boundary σε επίπεδο υποδομής (π.χ. request handler, worker goroutine) ώστε ένα απρόσμενο panic να μην ρίξει όλο το σύστημα.</p></div>
  <div class="card"><h3>Κακή χρήση</h3><p>Βάζοντας recover παντού "για σιγουριά", χρησιμοποιώντας ουσιαστικά panic/recover σαν try/catch για κανονική επιχειρησιακή λογική.</p></div>
</div>
`);

    addContent(`
<div class="eyebrow">Ενότητα 2 / 7 — Standard Packages</div>
<h1>Το πακέτο <code class="inline-code">strings</code></h1>
<p class="lede">Από εδώ και πέρα μπαίνουμε στην standard library — τη "βιβλιοθήκη-εργαλειοθήκη" που έρχεται μαζί με κάθε εγκατάσταση Go, χωρίς να χρειάζεται να εγκαταστήσεις τίποτα επιπλέον. Ξεκινάμε με το <code class="inline-code">strings</code>, το πακέτο που θα χρησιμοποιείς σχεδόν σε κάθε πρόγραμμα που επεξεργάζεται κείμενο.</p>

<h2>Αναζήτηση &amp; Έλεγχος</h2>
<p>Οι πιο κοινές λειτουργίες: να ελέγξεις αν ένα string περιέχει, ξεκινάει ή τελειώνει με ένα άλλο.</p>

<pre><code class="lang-go">import "strings"

s := "Hello, Zone01!"

strings.Contains(s, "Zone01")    // true
strings.HasPrefix(s, "Hello")    // true
strings.HasSuffix(s, "!")        // true
strings.Index(s, "Zone01")       // 7 (θέση έναρξης, -1 αν δεν βρεθεί)
strings.Count(s, "l")            // 3 (πόσες φορές εμφανίζεται)</code></pre>

<div class="callout">
  <span class="tag">Σημείωση</span>
  Το <code class="inline-code">Index</code> επιστρέφει <code class="inline-code">-1</code> αν το substring δεν βρεθεί καθόλου — ΟΧΙ κάποιο error. Είναι σύμβαση σε πολλές functions της standard library: όταν "δεν βρέθηκε τίποτα" δεν θεωρείται σφάλμα αλλά μια απολύτως έγκυρη, αναμενόμενη απάντηση.
</div>

<h2>Μετασχηματισμός &amp; Καθαρισμός</h2>
<p>Πολύ συχνά χρειάζεται να "καθαρίσεις" ή να αλλάξεις τη μορφή ενός string πριν το επεξεργαστείς περαιτέρω.</p>

<pre><code class="lang-go">s := "  Hello, World!  "

strings.ToLower(s)              // "  hello, world!  "
strings.ToUpper(s)              // "  HELLO, WORLD!  "
strings.TrimSpace(s)            // "Hello, World!" (αφαιρεί κενά αρχή/τέλος)
strings.Trim(s, " !")           // αφαιρεί συγκεκριμένους χαρακτήρες αρχή/τέλος
strings.ReplaceAll(s, "o", "0") // "  Hell0, W0rld!  "</code></pre>

<div class="callout">
  <span class="tag">Θυμήσου: τα strings είναι immutable</span>
  Κάθε μία από αυτές τις functions <strong>δεν τροποποιεί</strong> το αρχικό string — επιστρέφει ένα καινούριο. Αυτό είναι λογική συνέχεια αυτού που έμαθες στο Μέρος 1: τα strings στη Go είναι immutable (αμετάβλητα). Αν δεν αποθηκεύσεις το αποτέλεσμα σε μια μεταβλητή, χάνεται.
</div>

<h2>Τεμαχισμός &amp; Συνένωση</h2>
<p>Το να "σπάσεις" ένα string σε κομμάτια, ή να ενώσεις πολλά κομμάτια σε ένα, είναι εξαιρετικά συχνή ανάγκη — π.χ. διάβασμα CSV γραμμών, ή δεδομένα χωρισμένα με κόμμα.</p>

<pre><code class="lang-go">csv := "apple,banana,cherry"
parts := strings.Split(csv, ",")   // []string{"apple", "banana", "cherry"}

sentence := "the   quick  brown fox"
words := strings.Fields(sentence) // []string{"the","quick","brown","fox"}
                                    // (Fields αγνοεί πολλαπλά/ανομοιόμορφα κενά!)

joined := strings.Join(parts, " - ") // "apple - banana - cherry"</code></pre>

<div class="callout">
  <span class="tag">Split vs Fields</span>
  Το <code class="inline-code">Split</code> χωρίζει σε ΑΚΡΙΒΩΣ τον διαχωριστή που δίνεις — αν δώσεις δύο κενά στη σειρά και χωρίσεις με ένα κενό, θα πάρεις ένα κενό string ως στοιχείο ανάμεσα. Το <code class="inline-code">Fields</code> χωρίζει σε whitespace γενικά (κενά, tabs, newlines) και αγνοεί πολλαπλά διαδοχικά whitespace — ιδανικό για "σπάσιμο σε λέξεις" χωρίς να νοιάζεσαι πόσα κενά υπάρχουν ανάμεσα.
</div>
`);

<h2>Το πρόβλημα με την επαναλαμβανόμενη συνένωση</h2>
<p>Θυμήσου: τα strings είναι immutable. Αυτό σημαίνει ότι κάθε φορά που κάνεις <code class="inline-code">s = s + "κάτι"</code> μέσα σε ένα loop, η Go δημιουργεί ΚΑΙΝΟΥΡΙΟ string από την αρχή — αντιγράφοντας ό,τι υπήρχε ήδη, συν το νέο κομμάτι. Σε ένα loop με χιλιάδες επαναλήψεις, αυτό γίνεται εξαιρετικά αναποδοτικό (πολλές περιττές αντιγραφές μνήμης).</p>

<pre><code class="lang-go">// Αναποδοτικό: κάθε += δημιουργεί ολόκληρο νέο string

<h2>Η λύση: strings.Builder</h2>
<p>Το <code class="inline-code">strings.Builder</code> είναι ένα ειδικό type φτιαγμένο ακριβώς για αυτό το πρόβλημα: "χτίζει" ένα string σταδιακά, εσωτερικά διαχειριζόμενο ένα growable buffer, χωρίς την επιβάρυνση επαναλαμβανόμενων πλήρων αντιγραφών.</p>

<pre><code class="lang-go">var b strings.Builder

<div class="eyebrow">Ενότητα 2 / 7 — Standard Packages</div>
<h1>Το πακέτο <code class="inline-code">strconv</code></h1>
<p class="lede">Η Go είναι μια αυστηρά typed γλώσσα (strict/static typing) — θυμήσου από το Μέρος 1 ότι δεν κάνει ποτέ αυτόματη μετατροπή τύπων (implicit conversion). Το πακέτο <code class="inline-code">strconv</code> ("string conversion") είναι το γεφύρι ανάμεσα σε strings και αριθμητικούς τύπους, ρητά και ελεγμένα.</p>

<h2>String → Αριθμός</h2>
<p>Η πιο συχνή ανάγκη: πήρες κείμενο (π.χ. από input χρήστη, ή από ένα αρχείο) και χρειάζεσαι τον αριθμό που αναπαριστά.</p>

<pre><code class="lang-go">import "strconv"

n, err := strconv.Atoi("42")       // "ASCII to integer" — string σε int
if err != nil {
    // το string δεν ήταν έγκυρος ακέραιος
}

f, err := strconv.ParseFloat("3.14", 64) // string σε float64
i64, err := strconv.ParseInt("42", 10, 64) // base 10, 64-bit</code></pre>

<div class="callout">
  <span class="tag">Γιατί επιστρέφουν πάντα error</span>
  Παρατήρησε το μοτίβο: ΚΑΘΕ μία από αυτές τις functions επιστρέφει ζευγάρι (τιμή, error) — ακριβώς η φιλοσοφία "errors as values" που είδαμε στην Ενότητα 1. Η μετατροπή string→αριθμός μπορεί πάντα λογικά να αποτύχει (π.χ. το string <code class="inline-code">"hello"</code> δεν είναι νόμιμος αριθμός), οπότε ο compiler σε αναγκάζει να αντιμετωπίσεις αυτή την πιθανότητα.
</div>

<h2>Αριθμός → String</h2>
<p>Η αντίστροφη κατεύθυνση — έχεις έναν αριθμό, θέλεις το κειμενικό του αναπαράσταση.</p>

<pre><code class="lang-go">s := strconv.Itoa(42)                       // "Integer to ASCII" — int σε string: "42"
s2 := strconv.FormatInt(42, 10)             // ίδιο αποτέλεσμα, πιο ρητό για int64/base
s3 := strconv.FormatFloat(3.14159, 'f', 2, 64) // "3.14" (2 δεκαδικά ψηφία)</code></pre>

<div class="callout">
  <span class="tag">Σημείωση</span>
  Παρατήρησε ότι η κατεύθυνση αριθμός→string ΔΕΝ επιστρέφει error — δεν υπάρχει τρόπος αυτή η μετατροπή να αποτύχει (κάθε αριθμός έχει έγκυρη κειμενική αναπαράσταση). Μόνο η κατεύθυνση string→αριθμός χρειάζεται error handling, γιατί όχι κάθε string είναι έγκυρος αριθμός.
</div>

<h2>Αναγνώριση Συγκεκριμένων Σφαλμάτων</h2>
<p>Το πακέτο <code class="inline-code">strconv</code> ορίζει δύο ειδικά, ονομασμένα σφάλματα που μπορείς να αναγνωρίσεις: <code class="inline-code">strconv.ErrSyntax</code> (το string δεν έχει καν τη σωστή "μορφή" αριθμού — π.χ. <code class="inline-code">"abc"</code>) και <code class="inline-code">strconv.ErrRange</code> (το string ΕΙΝΑΙ έγκυρος αριθμός, αλλά είναι πολύ μεγάλος/μικρός για τον τύπο-στόχο — π.χ. προσπαθείς να χωρέσεις έναν τεράστιο αριθμό σε <code class="inline-code">int8</code>).</p>

<pre><code class="lang-go">_, err := strconv.Atoi("not-a-number")
// err "τυλίγει" (wraps) το strconv.ErrSyntax

_, err2 := strconv.ParseInt("99999999999999999999", 10, 64)
// err2 "τυλίγει" το strconv.ErrRange — ο αριθμός είναι υπερβολικά μεγάλος για int64</code></pre>

<h2>Parsing Λογικών Τιμών &amp; Quote/Unquote</h2>
<pre><code class="lang-go">b, err := strconv.ParseBool("true")  // δέχεται: "1","t","T","TRUE","true","True" κ.ά.

quoted := strconv.Quote("Hello\nWorld")   // "\"Hello\\nWorld\"" (escaped μορφή)
original, err := strconv.Unquote(quoted)  // επιστροφή στην αρχική μορφή</code></pre>

<div class="eyebrow">Ενότητα 2 / 7 — Standard Packages</div>
<h1>Το πακέτο <code class="inline-code">os</code> &amp; Αλληλεπίδραση με το Σύστημα</h1>
<p class="lede">Το πακέτο <code class="inline-code">os</code> ("operating system") είναι η γέφυρα ανάμεσα στο πρόγραμμά σου και το λειτουργικό σύστημα — αρχεία, κατάλογοι, περιβαλλοντικές μεταβλητές, ακόμα και η ίδια η διεργασία (process) του προγράμματος.</p>

<h2>Διαχείριση Αρχείων &amp; Καταλόγων</h2>
<pre><code class="lang-go">import "os"

file, err := os.Open("data.txt")   // ανοίγει αρχείο ΜΟΝΟ για ανάγνωση
defer file.Close()                  // πάντα κλείνε ό,τι ανοίγεις (θυμήσου defer!)

newFile, err := os.Create("out.txt") // δημιουργεί (ή αδειάζει, αν υπάρχει ήδη)
defer newFile.Close()

err = os.Remove("old.txt")          // διαγράφει ένα αρχείο
err = os.MkdirAll("path/to/dir", 0755) // δημιουργεί κατάλογο(-ους), αγνοεί αν υπάρχει ήδη

entries, err := os.ReadDir(".")     // λίστα περιεχομένων ενός καταλόγου
for _, e := range entries {
    fmt.Println(e.Name(), e.IsDir())
}</code></pre>

<div class="callout">
  <span class="tag">MkdirAll vs Mkdir</span>
  Το <code class="inline-code">os.Mkdir</code> δημιουργεί ΕΝΑΝ κατάλογο και αποτυγχάνει αν ο γονικός του δεν υπάρχει. Το <code class="inline-code">os.MkdirAll</code> δημιουργεί όλη την αλυσίδα καταλόγων που λείπει (σαν <code class="inline-code">mkdir -p</code> στο Unix) — αυτό συνήθως θέλεις.
</div>

<h2>Πληροφορίες Αρχείων &amp; Δικαιώματα</h2>
<pre><code class="lang-go">info, err := os.Stat("data.txt")
if err == nil {
    fmt.Println(info.Name())    // "data.txt"
    fmt.Println(info.Size())    // μέγεθος σε bytes
    fmt.Println(info.IsDir())   // false — είναι αρχείο, όχι κατάλογος
    fmt.Println(info.Mode())    // os.FileMode: δικαιώματα (π.χ. -rw-r--r--)
}</code></pre>

<div class="callout">
  <span class="tag">Το 0755 στο MkdirAll — τι σημαίνει</span>
  Αυτός ο αριθμός είναι σε οκταδική (octal) μορφή και αντιπροσωπεύει δικαιώματα Unix: ο ιδιοκτήτης (owner) έχει read+write+execute (7), η ομάδα (group) και όλοι οι υπόλοιποι (others) έχουν μόνο read+execute (5 το καθένα). Δεν χρειάζεται να το απομνημονεύσεις πλήρως τώρα — απλά αναγνώρισε ότι <code class="inline-code">os.FileMode</code> είναι ο τύπος που κωδικοποιεί αυτά τα δικαιώματα.
</div>

<h2>Περιβαλλοντικές Μεταβλητές</h2>
<p>Περιβαλλοντικές μεταβλητές (environment variables) είναι key-value ζεύγη που "ζουν" έξω από το πρόγραμμά σου, στο ίδιο το λειτουργικό σύστημα ή το terminal session — π.χ. το <code class="inline-code">PATH</code> που ξέρει πού να ψάξει για εκτελέσιμα προγράμματα.</p>

<pre><code class="lang-go">path := os.Getenv("PATH")           // διάβασμα (κενό string αν δεν υπάρχει)
os.Setenv("MY_APP_MODE", "debug")   // ορισμός για την τρέχουσα διεργασία
os.Unsetenv("MY_APP_MODE")          // αφαίρεση

all := os.Environ() // []string με ΟΛΕΣ τις μεταβλητές, μορφής "KEY=VALUE"</code></pre>

<div class="callout">

</div>

<p class="lede">Η <code class="inline-code">os.Exit(code int)</code> τερματίζει το πρόγραμμα ΑΜΕΣΩΣ, επιστρέφοντας τον συγκεκριμένο κωδικό εξόδου (exit code) στο λειτουργικό σύστημα — συμβατικά, <code class="inline-code">0</code> σημαίνει επιτυχία και οποιοσδήποτε άλλος αριθμός σημαίνει κάποιο είδος αποτυχίας.</p>

<h1>Το πακέτο <code class="inline-code">io</code>: Αφαιρέσεις Εισόδου/Εξόδου</h1>
<p class="lede">Το πακέτο <code class="inline-code">io</code> δεν περιέχει "έτοιμες" λειτουργίες για συγκεκριμένες πηγές δεδομένων — περιέχει κάτι πιο θεμελιώδες: <strong>interfaces</strong> που περιγράφουν τι σημαίνει γενικά "διάβασμα" και "γράψιμο", ανεξάρτητα από το ΤΙ βρίσκεται στην άλλη άκρη (αρχείο, δίκτυο, μνήμη, οτιδήποτε).</p>

<h2>Το θεμελιώδες interface: io.Reader</h2>
<pre><code class="lang-go">type Reader interface {
    Read(p []byte) (n int, err error)
}</code></pre>
<p>Αυτό είναι όλο. Οτιδήποτε έχει μια μέθοδο <code class="inline-code">Read</code> με ΑΚΡΙΒΩΣ αυτή την υπογραφή, είναι ένας έγκυρος <code class="inline-code">io.Reader</code>. Η ιδέα: γεμίζει το slice <code class="inline-code">p</code> με δεδομένα, και επιστρέφει πόσα bytes πραγματικά διάβασε (<code class="inline-code">n</code>) και αν κάτι πήγε στραβά (<code class="inline-code">err</code>) — συμπεριλαμβανομένου του ειδικού error <code class="inline-code">io.EOF</code> ("End Of File") όταν δεν υπάρχουν άλλα δεδομένα.</p>

<h2>Το θεμελιώδες interface: io.Writer</h2>
<pre><code class="lang-go">type Writer interface {
    Write(p []byte) (n int, err error)
}</code></pre>
<p>Συμμετρικά με το Reader: παίρνει bytes και τα "γράφει" κάπου, επιστρέφοντας πόσα πραγματικά γράφτηκαν και τυχόν error.</p>

<div class="callout">
  <span class="tag">Γιατί έχει τόση σημασία αυτή η αφαίρεση</span>
  Επειδή τα interfaces αυτά είναι ΤΟΣΟ μικρά (μία μόνο μέθοδο το καθένα), δεκάδες διαφορετικά types στη standard library τα υλοποιούν χωρίς καν να το "ξέρουν" ρητά: αρχεία (<code class="inline-code">*os.File</code>), συνδέσεις δικτύου, buffers στη μνήμη, ακόμα και το ίδιο το terminal (<code class="inline-code">os.Stdin</code>, <code class="inline-code">os.Stdout</code>). Θα δούμε αυτή την ιδέα σε πλήρες βάθος στην Ενότητα 6.
</div>

<h2>Σύνθετα (Composite) Interfaces</h2>
<p>Η standard library συνδυάζει τα μικρά interfaces σε μεγαλύτερα, όταν κάτι χρειάζεται να κάνει περισσότερα από ένα πράγμα ταυτόχρονα.</p>

<pre><code class="lang-go">type ReadWriter interface {
    Reader
    Writer
}

type ReadCloser interface {
    Reader
    Closer
}

type WriteCloser interface {
    Writer
    Closer
}</code></pre>

<div class="callout">
  <span class="tag">Προεπισκόπηση: Interface Composition</span>
  Αυτό το μοτίβο — "χτίζω" μεγαλύτερα interfaces ενώνοντας μικρότερα — λέγεται Interface Composition, και θα το δούμε αναλυτικά στην Ενότητα 5. Για τώρα, κράτησε την εικόνα: μικρά, εστιασμένα interfaces (Reader, Writer, Closer) γίνονται "τουβλάκια" (building blocks) για μεγαλύτερα.
</div>

limited := io.LimitReader(src, 100) // Reader που σταματάει μετά από 100 bytes</code></pre>

<h1>Ανάγνωση &amp; Εγγραφή Αρχείων</h1>
<p class="lede">Τώρα που ξέρεις τα βασικά interfaces (Reader/Writer) και το πακέτο os, ας δούμε τις πιο πρακτικές, καθημερινές functions για δουλειά με αρχεία.</p>

<h2>Η "γρήγορη" μέθοδος: os.ReadFile</h2>
<p>Όταν θέλεις απλά ΟΛΟ το περιεχόμενο ενός αρχείου, χωρίς να νοιάζεσαι για ανοίγματα/κλεισίματα, το <code class="inline-code">os.ReadFile</code> κάνει τα πάντα σε μία κλήση.</p>

<pre><code class="lang-go">data, err := os.ReadFile("config.txt")
if err != nil {
    // π.χ. το αρχείο δεν υπάρχει, ή δεν έχεις δικαιώματα ανάγνωσης

<div class="callout">

  Το <code class="inline-code">os.ReadFile</code> ανοίγει, διαβάζει, ΚΑΙ κλείνει το αρχείο εσωτερικά — όλα μέσα στη μία κλήση. Δεν χρειάζεται (ούτε μπορείς) να καλέσεις εσύ Close σε αυτή την περίπτωση.
</div>

<h2>Δημιουργία &amp; Εγγραφή</h2>
<pre><code class="lang-go">err := os.WriteFile("out.txt", []byte("Hello, Go!"), 0644)
// δημιουργεί (ή αντικαθιστά πλήρως) το αρχείο με αυτό το περιεχόμενο</code></pre>

<h2>Άνοιγμα με Πλήρη Έλεγχο: os.OpenFile</h2>
<p>Όταν χρειάζεσαι περισσότερο έλεγχο — π.χ. να προσθέσεις (append) δεδομένα σε ένα ήδη υπάρχον αρχείο, αντί να το αντικαταστήσεις — χρησιμοποιείς το <code class="inline-code">os.OpenFile</code> με ρητά flags.</p>

<pre><code class="lang-go">f, err := os.OpenFile("log.txt",
    os.O_APPEND|os.O_CREATE|os.O_WRONLY, // flags: πρόσθεσε στο τέλος, δημιούργησε αν δεν υπάρχει, μόνο εγγραφή

<div class="eyebrow">Ενότητα 2 / 7 — Standard Packages</div>
<h1>Buffering &amp; Ροές Δεδομένων (<code class="inline-code">bufio</code>)</h1>
<p class="lede">Το <code class="inline-code">os.ReadFile</code> φορτώνει ΟΛΟΚΛΗΡΟ το αρχείο στη μνήμη — μια χαρά για μικρά αρχεία, αλλά προβληματικό αν το αρχείο είναι, ας πούμε, αρκετά GB. Το πακέτο <code class="inline-code">bufio</code> ("buffered I/O") σου επιτρέπει να επεξεργάζεσαι δεδομένα σταδιακά, κομμάτι-κομμάτι, χωρίς να τα φορτώνεις όλα ταυτόχρονα.</p>

<h2>bufio.Scanner — Ανάγνωση Γραμμή-Γραμμή</h2>
<p>Η πιο συχνή χρήση: διάβασμα αρχείου (ή οποιουδήποτε io.Reader) μία γραμμή τη φορά.</p>

<pre><code class="lang-go">file, _ := os.Open("data.txt")
defer file.Close()

scanner := bufio.NewScanner(file)
for scanner.Scan() {
    line := scanner.Text() // η τρέχουσα γραμμή, χωρίς το newline
    fmt.Println(line)
}
if err := scanner.Err(); err != nil {
    // κάτι πήγε στραβά ΚΑΤΑ το scanning (όχι απλό EOF — αυτό είναι φυσιολογικό τέλος)
}</code></pre>

<h2>Τρόποι "Σπασίματος" (Split Modes)</h2>
<p>Το scanner δεν χρειάζεται πάντα να σπάει σε γραμμές — μπορεί να "σπάει" τα δεδομένα με διαφορετικούς τρόπους ανάλογα με τη function που δίνεις στο <code class="inline-code">Split()</code>.</p>

<div class="grid2">
  <div class="card"><h3>bufio.ScanLines (default)</h3><p>Μία γραμμή τη φορά — ιδανικό για logs, ρυθμίσεις, γενικά κείμενα με νόημα ανά γραμμή.</p></div>
  <div class="card"><h3>bufio.ScanRunes</h3><p>Ένας χαρακτήρας (rune) τη φορά — για επεξεργασία κειμένου γράμμα-γράμμα.</p></div>
  <div class="card"><h3>bufio.ScanWords</h3><p>Μία λέξη τη φορά, χωρισμένη σε whitespace — ιδανικό για μέτρηση λέξεων.</p></div>
  <div class="card"><h3>scanner.Split(customFn)</h3><p>Custom split function, όταν κανένα από τα παραπάνω δεν ταιριάζει στην περίπτωσή σου.</p></div>
</div>

<pre><code class="lang-go">scanner := bufio.NewScanner(file)
scanner.Split(bufio.ScanWords) // αλλαγή default συμπεριφοράς σε λέξη-λέξη

count := 0
for scanner.Scan() {
    count++
}
fmt.Println("word count:", count)</code></pre>

<h2>Ανάγνωση Εισόδου Χρήστη (os.Stdin)</h2>
<p>Το <code class="inline-code">os.Stdin</code> είναι απλά ένας ακόμα <code class="inline-code">io.Reader</code> — αναπαριστά ό,τι πληκτρολογεί ο χρήστης στο terminal. Ο <code class="inline-code">bufio.Scanner</code> δουλεύει πάνω του ακριβώς όπως και σε ένα αρχείο.</p>

<pre><code class="lang-go">scanner := bufio.NewScanner(os.Stdin)
fmt.Print("Enter your name: ")
scanner.Scan()
name := scanner.Text()
fmt.Println("Hello,", name)</code></pre>

<h2>ReadString(delim) — Σταμάτα σε Συγκεκριμένο Σύμβολο</h2>
<p>Όταν ξέρεις ακριβώς σε ποιο χαρακτήρα θέλεις να σταματήσεις (όχι απαραίτητα newline), το <code class="inline-code">bufio.Reader</code> με <code class="inline-code">ReadString</code> είναι εναλλακτική επιλογή.</p>

<pre><code class="lang-go">reader := bufio.NewReader(os.Stdin)
line, err := reader.ReadString('\\n') // διαβάζει μέχρι (και συμπεριλαμβάνει) το newline</code></pre>

<h2>bufio.Writer — Αποδοτική Εγγραφή</h2>
<p>Συμμετρικά με το Scanner, το <code class="inline-code">bufio.Writer</code> "μαζεύει" εγγραφές σε ένα εσωτερικό buffer και τις στέλνει στην τελική πηγή σε παρτίδες, αντί για μία-μία — σημαντική βελτίωση απόδοσης όταν γράφεις πολλά μικρά κομμάτια δεδομένων διαδοχικά.</p>

<pre><code class="lang-go">writer := bufio.NewWriter(file)
for i := 0; i < 1000; i++ {
    writer.WriteString("line\\n") // γράφεται στο buffer, όχι απευθείας στο δίσκο ακόμα
}
writer.Flush() // ΚΡΙΣΙΜΟ: στέλνει ό,τι έχει μείνει στο buffer προς τα έξω</code></pre>

<div class="callout">
  <span class="tag">Μην ξεχνάς το Flush()</span>
  Αν δεν καλέσεις <code class="inline-code">Flush()</code> (ή αν το πρόγραμμα τερματίσει απότομα πριν προλάβει), δεδομένα που βρίσκονται ακόμα στο εσωτερικό buffer ΔΕΝ θα φτάσουν ποτέ στο τελικό αρχείο. Είναι κοινή πρακτική να κάνεις <code class="inline-code">defer writer.Flush()</code> αμέσως μετά τη δημιουργία του writer.
</div>
`);

<div class="eyebrow">Ενότητα 3 / 7 — Structs σε Βάθος</div>
<h1>Τι είναι το Struct</h1>
<p class="lede">Μέχρι τώρα δούλευες κυρίως με μεμονωμένους τύπους δεδομένων: ένα int, ένα string, ένα slice από κάτι. Αλλά τι γίνεται όταν χρειάζεσαι να περιγράψεις κάτι που έχει ΠΟΛΛΑΠΛΕΣ, διαφορετικές ιδιότητες μαζί — π.χ. έναν χρήστη με όνομα, ηλικία και email; Εδώ μπαίνει το <strong>struct</strong>.</p>

<h2>Struct αντί για Classes</h2>
<p>Αν έρχεσαι από μια αντικειμενοστραφή γλώσσα (Java, Python, C++), ίσως περίμενες η Go να έχει "class". Δεν έχει. Αντί γι' αυτό, η Go χρησιμοποιεί <strong>struct</strong> — μια δομή δεδομένων που ομαδοποιεί μαζί πολλαπλά πεδία (fields), το καθένα με το δικό του όνομα και τύπο. Η μεγάλη διαφορά φιλοσοφίας: το struct από μόνο του περιέχει ΜΟΝΟ δεδομένα — καμία συμπεριφορά (behavior). Η συμπεριφορά προστίθεται ξεχωριστά, μέσω των methods (θα τα δούμε στην Ενότητα 4).</p>

<pre><code class="lang-go">type User struct {
    Name  string
    Age   int
    Email string
}</code></pre>

<div class="callout">
  <span class="tag">Σύνταξη: type ... struct</span>
  Η δήλωση <code class="inline-code">type Όνομα struct { ... }</code> δημιουργεί έναν νέο, δικό σου τύπο δεδομένων. Από εδώ και πέρα, το <code class="inline-code">User</code> είναι ένας απολύτως έγκυρος τύπος στη Go — μπορείς να τον χρησιμοποιήσεις παντού που θα χρησιμοποιούσες int ή string: ως τύπο μεταβλητής, παραμέτρου function, ακόμα και μέσα σε άλλα structs.
</div>

<h2>Πεδία, Τύποι &amp; Memory Alignment</h2>
<p>Κάθε πεδίο (field) ενός struct έχει το δικό του όνομα και τύπο — και τα πεδία μπορούν να είναι διαφορετικών τύπων μεταξύ τους, χωρίς κανένα πρόβλημα.</p>

<pre><code class="lang-go">type Product struct {
    Name     string
    Price    float64
    InStock  bool
    Quantity int
}</code></pre>

<p>Στη μνήμη, ένα struct είναι στην πραγματικότητα ένα συνεχόμενο (contiguous) μπλοκ, όπου τα πεδία τοποθετούνται το ένα δίπλα στο άλλο με τη σειρά δήλωσης. Ο compiler, όμως, μπορεί να προσθέσει "κενό χώρο" (padding) ανάμεσα σε ορισμένα πεδία για λόγους ευθυγράμμισης μνήμης (memory alignment) — π.χ. ένας επεξεργαστής διαβάζει πιο αποδοτικά έναν <code class="inline-code">int64</code> αν ξεκινάει σε "στρογγυλή" διεύθυνση μνήμης. Αυτό είναι μια λεπτομέρεια χαμηλού επιπέδου που σπάνια σε αφορά ως αρχάριο — απλά ξέρε ότι το <code class="inline-code">sizeof</code> ενός struct δεν είναι πάντα ακριβώς το άθροισμα των μεγεθών των πεδίων του.</p>

<div class="callout">
  <span class="tag">Πρακτική συμβουλή (προχωρημένη, όχι απαραίτητη τώρα)</span>
  Αν κάποια στιγμή σε ενδιαφέρει βελτιστοποίηση μνήμης σε πολύ μεγάλα προγράμματα, η σειρά δήλωσης πεδίων (π.χ. μεγαλύτεροι τύποι πρώτα) μπορεί να μειώσει το padding. Για τώρα, γράψε τα πεδία με τη σειρά που έχει το περισσότερο νόημα διαβασμού — η βελτιστοποίηση μνήμης είναι λεπτομέρεια για αργότερα.
</div>
`);

<div class="eyebrow">Ενότητα 3 / 7 — Structs σε Βάθος</div>
<h1>Αρχικοποίηση &amp; Προσπέλαση</h1>
<p class="lede">Υπάρχουν αρκετοί τρόποι να δημιουργήσεις ένα struct value — ας τους δούμε έναν-έναν.</p>

<h2>Struct Literals: Named vs Positional</h2>
<pre><code class="lang-go">// Named field initialization — ΠΡΟΤΙΜΩΜΕΝΟΣ τρόπος: ρητά ονόματα, σειρά αδιάφορη
u1 := User{
    Name:  "Maria",
    Age:   28,
    Email: "maria@example.com",
}

// Positional initialization — ΠΡΕΠΕΙ να δώσεις ΟΛΑ τα πεδία, με ΑΚΡΙΒΩΣ τη σειρά δήλωσης
u2 := User{"Nikos", 34, "nikos@example.com"}</code></pre>

<div class="callout">
  <span class="tag">Γιατί το named προτιμάται σχεδόν πάντα</span>
  Το positional initialization είναι εύθραυστο (fragile): αν κάποιος αργότερα αλλάξει τη σειρά των πεδίων μέσα στον ορισμό του struct, ΚΑΘΕ positional literal σε ολόκληρο το πρόγραμμα σπάει σιωπηλά — τα δεδομένα μπαίνουν στα λάθος πεδία χωρίς κανένα compile error. Το named literal είναι ανθεκτικό σε τέτοιες αλλαγές και επιπλέον πιο ευανάγνωστο.
</div>

<h2>Προσπέλαση &amp; Τροποποίηση με τον Τελεστή Τελεία</h2>
<pre><code class="lang-go">fmt.Println(u1.Name)  // "Maria" — προσπέλαση πεδίου
u1.Age = 29            // τροποποίηση πεδίου</code></pre>

<h2>Zero Values σε Structs</h2>
<p>Θυμήσου από το Μέρος 1: κάθε τύπος στη Go έχει μια zero value. Ένα struct που δημιουργείται χωρίς literal παίρνει τη zero value ΚΑΘΕ πεδίου του ξεχωριστά.</p>

<pre><code class="lang-go">var u User // κανένα literal — zero value του struct
fmt.Println(u.Name)  // "" (zero value του string)
fmt.Println(u.Age)   // 0  (zero value του int)
fmt.Println(u.Email) // "" (zero value του string)</code></pre>

<h2>Κατασκευαστές (Constructor Functions)</h2>
<p>Η Go δεν έχει ενσωματωμένους constructors όπως άλλες γλώσσες — αλλά υπάρχει μια πολύ διαδεδομένη σύμβαση: μια απλή function με όνομα <code class="inline-code">NewXxx(...)</code> που δημιουργεί και επιστρέφει το struct, συχνά με κάποια αρχική επικύρωση (validation) ή προεπιλεγμένες τιμές.</p>

<pre><code class="lang-go">func NewUser(name, email string) (*User, error) {
    if name == "" {
        return nil, errors.New("name cannot be empty")
    }
    return &User{
        Name:  name,
        Age:   0, // default
        Email: email,
    }, nil
}

u, err := NewUser("Elena", "elena@example.com")</code></pre>

<div class="callout">
  <span class="tag">Γιατί χρησιμοποιούμε NewXxx αντί για γυμνό literal</span>
  Ένας constructor function σου δίνει ένα κεντρικό σημείο για επικύρωση δεδομένων (π.χ. "το όνομα δεν μπορεί να είναι κενό") και προεπιλεγμένες τιμές — κάτι που ένα γυμνό struct literal δεν μπορεί να εγγυηθεί. Θα το ξαναδούμε στην Ενότητα 7 με το Functional Options Pattern, μια πιο προχωρημένη παραλλαγή αυτής της ιδέας.
</div>
`);

<div class="eyebrow">Ενότητα 3 / 7 — Structs σε Βάθος</div>
<h1>Advanced Struct Concepts: Ανώνυμα Structs &amp; Δείκτες</h1>

<h2>Ανώνυμα Structs (Anonymous Structs)</h2>
<p>Μερικές φορές δεν χρειάζεσαι έναν πλήρως ονομασμένο τύπο struct — απλά θέλεις μια προσωρινή, "μιας χρήσης" ομαδοποίηση δεδομένων. Η Go σου επιτρέπει να δηλώσεις struct χωρίς όνομα τύπου, inline.</p>

<pre><code class="lang-go">point := struct {
    X, Y int
}{X: 10, Y: 20}

fmt.Println(point.X, point.Y) // 10 20</code></pre>

<div class="callout">
  <span class="tag">Πού είναι χρήσιμο</span>
  Anonymous structs εμφανίζονται συχνά σε δύο σενάρια: (1) γρήγορα, one-off test cases μέσα σε unit tests, όπου δεν αξίζει να ορίσεις ξεχωριστό named type· (2) ως προσωρινή δομή για JSON payloads, όπου θέλεις να "σχηματοποιήσεις" δεδομένα μόνο για μία χρήση χωρίς να "ρυπαίνεις" το πρόγραμμά σου με έναν τύπο που δεν θα ξαναχρησιμοποιηθεί.
</div>

<h2>Δείκτες σε Structs &amp; Auto-Dereferencing</h2>
<p>Θυμήσου τους δείκτες (pointers) από το Μέρος 1. Ένας δείκτης σε struct είναι εξαιρετικά συχνός — ειδικά όταν θέλεις μια function να ΤΡΟΠΟΠΟΙΗΣΕΙ το αρχικό struct αντί να δουλέψει πάνω σε αντίγραφο.</p>

<pre><code class="lang-go">u := User{Name: "Kostas", Age: 40}
p := &u // p είναι *User — δείκτης προς το struct u

p.Age = 41 // ΔΕΝ χρειάζεται (*p).Age — η Go κάνει auto-dereferencing
fmt.Println(u.Age) // 41 — το ΑΡΧΙΚΟ struct άλλαξε, μέσω του δείκτη</code></pre>

<div class="callout">
  <span class="tag">Auto-dereferencing: τι σημαίνει</span>
  Σε πολλές γλώσσες χαμηλού επιπέδου (π.χ. C), αν έχεις δείκτη σε struct, πρέπει να γράψεις ρητά <code class="inline-code">(*p).Age</code> για να φτάσεις στο πεδίο. Η Go σου το απλοποιεί: <code class="inline-code">p.Age</code> δουλεύει απευθείας ΚΑΙ σε value ΚΑΙ σε pointer προς struct — ο compiler καταλαβαίνει τι εννοείς και κάνει την αποαναφορά (dereference) αυτόματα.
</div>

<h2>Struct Tags: Μεταδεδομένα για Serialization</h2>
<p>Ένα struct field μπορεί να έχει μια ειδική "ετικέτα" (tag) — ένα string μεταδεδομένων που δεν επηρεάζει καθόλου τη συμπεριφορά του struct στον δικό σου κώδικα, αλλά διαβάζεται από εξωτερικά πακέτα (π.χ. το <code class="inline-code">encoding/json</code>) για να καθορίσει πώς θα μετατραπεί το struct σε/από άλλες μορφές (JSON, XML κ.λπ.).</p>

<pre><code class="lang-go">type User struct {
    Name  string \`json:"name"\`
    Email string \`json:"email"\`
    Age   int    \`json:"age,omitempty"\`
}</code></pre>

<div class="callout">
  <span class="tag">Πρόγευση για αργότερα</span>
  Το <code class="inline-code">json:"name"</code> λέει: "όταν μετατρέπεις αυτό το struct σε JSON, χρησιμοποίησε το key <code class="inline-code">"name"</code> αντί για <code class="inline-code">"Name"</code>". Το <code class="inline-code">omitempty</code> λέει: "αν αυτό το πεδίο έχει τη zero value του, παράλειψέ το εντελώς από το τελικό JSON". Δεν θα εμβαθύνουμε στο encoding/json σε αυτό τον οδηγό — απλά αναγνώρισε τη σύνταξη όταν τη συναντήσεις.
</div>

<h2>Σύγκριση Structs</h2>
<p>Δύο structs μπορούν να συγκριθούν με <code class="inline-code">==</code> ΜΟΝΟ αν όλα τα πεδία τους είναι "συγκρίσιμα" (comparable) τύποι — π.χ. int, string, bool. Αν ένα struct περιέχει slice ή map ως πεδίο, ΔΕΝ είναι πλέον comparable, και ο compiler θα αρνηθεί να μεταγλωττίσει μια σύγκριση με <code class="inline-code">==</code> πάνω του.</p>

<pre><code class="lang-go">type Point struct{ X, Y int }
p1 := Point{1, 2}
p2 := Point{1, 2}
fmt.Println(p1 == p2) // true — comparable, όλα τα πεδία είναι int

type Group struct{ Members []string } // slice μέσα!
// g1 == g2 -> COMPILE ERROR: invalid operation (struct containing []string cannot be compared)</code></pre>

<h2>Empty Struct: struct{}</h2>
<p>Ένα struct χωρίς κανένα πεδίο, <code class="inline-code">struct{}</code>, καταλαμβάνει ΜΗΔΕΝ bytes μνήμης. Αυτό το κάνει χρήσιμο ως "σημαία παρουσίας" (presence marker) — π.χ. υλοποίηση ενός Set (σύνολο μοναδικών στοιχείων) μέσω map, όπου δεν μας ενδιαφέρει καθόλου η τιμή, μόνο το αν το key υπάρχει.</p>

<pre><code class="lang-go">seen := make(map[string]struct{})
seen["apple"] = struct{}{}
seen["banana"] = struct{}{}

_, exists := seen["apple"]
fmt.Println(exists) // true</code></pre>

<div class="callout">
  <span class="tag">Γιατί όχι map[string]bool;</span>
  Θα μπορούσες να χρησιμοποιήσεις <code class="inline-code">map[string]bool</code> για τον ίδιο σκοπό — και είναι απολύτως έγκυρο, πιο απλό στην ανάγνωση. Η διαφορά είναι καθαρά μνήμη: το <code class="inline-code">bool</code> καταλαμβάνει 1 byte ανά entry, το <code class="inline-code">struct{}</code> καταλαμβάνει 0. Σε πολύ μεγάλα σύνολα δεδομένων, αυτό μπορεί να έχει σημασία — αλλιώς, διάλεξε ό,τι διαβάζεται πιο καθαρά.
</div>
`);

<div class="eyebrow">Ενότητα 3 / 7 — Structs σε Βάθος</div>
<h1>Struct Composition: Σύνθεση αντί για Κληρονομικότητα</h1>
<p class="lede">Ερχόμαστε τώρα σε μια από τις πιο σημαντικές αρχές σχεδίασης της Go — μια που θα τη συναντάς ξανά και ξανά σε όλη την υπόλοιπη πορεία σου.</p>

<h2>Embedded Structs: Struct μέσα σε Struct</h2>
<p>Η Go σου επιτρέπει να "ενσωματώσεις" (embed) ένα struct μέσα σε άλλο, δηλώνοντας το πεδίο ΧΩΡΙΣ όνομα — μόνο τον τύπο. Αυτό λέγεται Anonymous Field.</p>

<pre><code class="lang-go">type Address struct {
    City    string
    Country string
}

type User struct {
    Name    string
    Address // <- embedded struct: ΔΕΝ γράφουμε "Address Address", μόνο "Address"
}

u := User{
    Name: "Sofia",
    Address: Address{
        City:    "Athens",
        Country: "Greece",
    },
}</code></pre>

<h2>Promoted Fields: Προαγόμενα Πεδία</h2>
<p>Το πιο εντυπωσιακό κομμάτι: τα πεδία του embedded struct γίνονται προσβάσιμα ΑΠΕΥΘΕΙΑΣ πάνω στο εξωτερικό struct, σαν να ήταν δικά του — χωρίς να χρειάζεται να γράψεις <code class="inline-code">u.Address.City</code> (αν και εξακολουθεί να δουλεύει και έτσι).</p>

<pre><code class="lang-go">fmt.Println(u.City)         // "Athens" — προαγόμενο πεδίο, ΟΧΙ u.Address.City
fmt.Println(u.Address.City) // "Athens" — εξίσου έγκυρο, πιο ρητό</code></pre>

<div class="callout">
  <span class="tag">Πώς δουλεύει αυτό εσωτερικά</span>
  Δεν είναι "μαγεία" — ο compiler απλά ξέρει ότι όταν γράφεις <code class="inline-code">u.City</code> και το <code class="inline-code">User</code> δεν έχει δικό του πεδίο <code class="inline-code">City</code>, να ψάξει μέσα στο embedded <code class="inline-code">Address</code>. Αν υπάρχουν πολλαπλά επίπεδα embedding, η αναζήτηση συνεχίζεται σε βάθος μέχρι να βρεθεί (ή να αποτύχει το compile, αν δεν βρεθεί πουθενά).
</div>

<h2>Shadowing: Όταν Συγκρούονται Ονόματα</h2>
<p>Τι γίνεται αν το εξωτερικό struct ΕΧΕΙ ήδη ένα πεδίο με το ίδιο όνομα με κάποιο πεδίο του embedded struct; Το πεδίο του εξωτερικού struct "σκιάζει" (shadows) το προαγόμενο — δηλαδή κερδίζει προτεραιότητα.</p>

<pre><code class="lang-go">type Base struct {
    ID int
}

type Item struct {
    Base
    ID int // <- ΙΔΙΟ όνομα με το Base.ID
}

it := Item{Base: Base{ID: 1}, ID: 2}
fmt.Println(it.ID)      // 2 — το δικό του πεδίο "κερδίζει"
fmt.Println(it.Base.ID) // 1 — το embedded, ρητά, εξακολουθεί να είναι προσβάσιμο</code></pre>

<h2>Γιατί Composition αντί για Inheritance</h2>
<p>Σε γλώσσες με κληρονομικότητα κλάσεων (class inheritance), μια κλάση "επεκτείνει" (extends) μια άλλη, κληρονομώντας ΟΛΗ τη συμπεριφορά και τα δεδομένα της γονικής, σε μια αυστηρή, γραμμική ιεραρχία. Αυτό δημιουργεί γνωστά προβλήματα: βαθιές, δύσκαμπτες ιεραρχίες, το "diamond problem" σε γλώσσες με πολλαπλή κληρονομικότητα, και δυσκολία στην κατανόηση "από πού" προέρχεται πραγματικά μια συμπεριφορά.</p>

<p>Η Go αποφεύγει εντελώς την κληρονομικότητα κλάσεων. Αντί γι' αυτήν, προωθεί το <strong>composition</strong>: "χτίζεις" σύνθετους τύπους συνδυάζοντας μικρότερα, ανεξάρτητα κομμάτια — ακριβώς όπως το embedding που μόλις είδες. Η φιλοσοφία συνοψίζεται στη γνωστή αρχή σχεδίασης λογισμικού: <em>"favor composition over inheritance"</em> — μια αρχή που πολλές άλλες γλώσσες συστήνουν ως καλή πρακτική, αλλά η Go την επιβάλλει δομικά, μη προσφέροντας καν inheritance ως επιλογή.</p>

<div class="grid2">
  <div class="card"><h3>Inheritance (άλλες γλώσσες)</h3><p>"Is-a" σχέση — ένα Dog ΕΙΝΑΙ ένα Animal. Αυστηρή, γραμμική ιεραρχία. Αλλαγές στη γονική κλάση επηρεάζουν αυτόματα όλους τους απογόνους, μερικές φορές απρόβλεπτα.</p></div>
  <div class="card"><h3>Composition (Go)</h3><p>"Has-a" σχέση — ένα Car ΕΧΕΙ έναν Engine. Ευέλικτο συναρμολόγημα από ανεξάρτητα κομμάτια, το καθένα με ξεκάθαρη, μεμονωμένη ευθύνη.</p></div>
</div>

<div class="callout">
  <span class="tag">Σημαντική διευκρίνιση</span>
  Το embedding ΔΕΝ είναι κληρονομικότητα, ακόμα κι αν μοιάζει επιφανειακά — δεν υπάρχει polymorphism μέσω embedding από μόνο του (ένα <code class="inline-code">Item</code> δεν "είναι" ένα <code class="inline-code">Base</code> με την έννοια που ένα <code class="inline-code">Dog</code> "είναι" ένα <code class="inline-code">Animal</code> σε Java). Είναι απλώς μια βολική συντόμευση πρόσβασης σε πεδία ενός εσωτερικού struct. Θα δούμε τον πραγματικό μηχανισμό πολυμορφισμού της Go — μέσω interfaces — στην Ενότητα 5.
</div>
`);

<div class="eyebrow">Ενότητα 4 / 7 — Methods</div>
<h1>Εισαγωγή στα Methods</h1>
<p class="lede">Στην προηγούμενη ενότητα είπαμε ότι ένα struct περιέχει ΜΟΝΟ δεδομένα, καμία συμπεριφορά. Τώρα θα δούμε πώς προσθέτουμε αυτή τη συμπεριφορά: μέσω <strong>methods</strong>.</p>

<h2>Method vs Function</h2>
<p>Ένα method είναι, ουσιαστικά, μια κανονική function με ένα επιπλέον, ειδικό όρισμα πριν το όνομά της: τον <strong>receiver</strong> (παραλήπτη). Ο receiver δηλώνει "σε ποιον τύπο ανήκει" αυτό το method.</p>

<pre><code class="lang-go">type Rectangle struct {
    Width, Height float64
}

// Αυτό είναι ΜΕΘΟΔΟΣ: έχει receiver (r Rectangle) πριν το όνομα
func (r Rectangle) Area() float64 {
    return r.Width * r.Height
}

// Σύγκρισε με μια απλή FUNCTION (χωρίς receiver):
func RectangleArea(r Rectangle) float64 {
    return r.Width * r.Height
}</code></pre>

<h2>Κλήση: η Διαφορά στην Πράξη</h2>
<pre><code class="lang-go">rect := Rectangle{Width: 5, Height: 3}

area1 := rect.Area()              // method call — σαν να "ρωτάς" το rect
area2 := RectangleArea(rect)      // function call — περνάς το rect ως όρισμα</code></pre>

<div class="callout">
  <span class="tag">Γιατί προτιμούμε methods</span>
  Λειτουργικά, και οι δύο προσεγγίσεις παραπάνω κάνουν ΑΚΡΙΒΩΣ το ίδιο πράγμα. Η διαφορά είναι οργανωτική/αναγνωσιμότητα: το <code class="inline-code">rect.Area()</code> διαβάζεται φυσικά ως "ρώτα το ορθογώνιο για το εμβαδόν του" — η συμπεριφορά "ανήκει λογικά" στο δεδομένο. Επιπλέον, μόνο τα methods μπορούν να χρησιμοποιηθούν για να υλοποιήσουν ένα interface — κάτι που θα δούμε στην Ενότητα 5.
</div>

<h2>Προσομοίωση OOP χωρίς Κλάσεις</h2>
<p>Ο συνδυασμός struct (δεδομένα) + methods (συμπεριφορά πάνω σε αυτά τα δεδομένα) είναι ο τρόπος που η Go επιτυγχάνει κάτι αντίστοιχο με το "encapsulation" της αντικειμενοστραφούς προγραμματισμού — χωρίς κλάσεις, χωρίς κληρονομικότητα. Ένα struct με τα δικά του methods "συμπεριφέρεται" σαν αντικείμενο (object) με ιδιότητες και ενέργειες, αλλά η σχέση δηλώνεται ρητά μέσω του receiver, όχι μέσω μιας ιεραρχίας κλάσεων.</p>
`);

<div class="eyebrow">Ενότητα 4 / 7 — Methods</div>
<h1>Value Receivers vs Pointer Receivers</h1>
<p class="lede">Αυτό είναι το πιο κρίσιμο σημείο απόφασης όταν γράφεις ένα method: θα δηλώσεις τον receiver ως value (<code class="inline-code">r Rectangle</code>) ή ως pointer (<code class="inline-code">r *Rectangle</code>);</p>

<h2>Value Receiver: Δουλειά πάνω σε Αντίγραφο</h2>
<p>Όταν ο receiver είναι value, το method λαμβάνει ένα ΑΝΤΙΓΡΑΦΟ (copy) του struct — ό,τι αλλαγές κάνεις μέσα στο method στα πεδία του receiver, ΔΕΝ επηρεάζουν το αρχικό.</p>

<pre><code class="lang-go">func (r Rectangle) Double() {
    r.Width *= 2  // αλλάζει μόνο το ΑΝΤΙΓΡΑΦΟ r, όχι το αρχικό
}

rect := Rectangle{Width: 5, Height: 3}
rect.Double()
fmt.Println(rect.Width) // 5 — ΑΜΕΤΑΒΛΗΤΟ! Το Double() δεν είχε καμία επίδραση</code></pre>

<h2>Pointer Receiver: Πραγματική Τροποποίηση</h2>
<p>Όταν ο receiver είναι pointer, το method λαμβάνει τη ΔΙΕΥΘΥΝΣΗ του αρχικού struct — αλλαγές μέσα στο method ΕΠΗΡΕΑΖΟΥΝ το πραγματικό, αρχικό struct.</p>

<pre><code class="lang-go">func (r *Rectangle) Double() {
    r.Width *= 2  // τροποποιεί το ΠΡΑΓΜΑΤΙΚΟ struct μέσω του δείκτη
}

rect := Rectangle{Width: 5, Height: 3}
rect.Double()
fmt.Println(rect.Width) // 10 — ΑΛΛΑΞΕ! Η Go καλεί αυτόματα (&rect).Double()</code></pre>

<div class="callout">
  <span class="tag">Δεν χρειάζεται να γράψεις (&rect).Double() ρητά</span>
  Ακριβώς όπως το auto-dereferencing που είδαμε στην Ενότητα 3, η Go κάνει αυτόματα τη μετατροπή <code class="inline-code">rect.Double()</code> → <code class="inline-code">(&rect).Double()</code> όταν το method έχει pointer receiver και το rect είναι μια addressable μεταβλητή. Δεν χρειάζεται να το γράφεις εσύ χειροκίνητα.
</div>

<h2>Κανόνες Επιλογής</h2>
<div class="grid2">
  <div class="card"><h3>Χρησιμοποίησε Pointer Receiver όταν...</h3><p>Το method χρειάζεται να τροποποιήσει το struct· το struct είναι μεγάλο (αντιγραφή θα ήταν σπάταλη)· θέλεις συνέπεια με άλλα methods του ίδιου τύπου που ήδη χρησιμοποιούν pointer receiver.</p></div>
  <div class="card"><h3>Χρησιμοποίησε Value Receiver όταν...</h3><p>Το method μόνο "διαβάζει" δεδομένα, δεν τα αλλάζει· το struct είναι μικρό (λίγα, απλά πεδία)· θέλεις εγγύηση immutability μέσα στο method.</p></div>
</div>

<h2>Συνέπεια στο Method Set</h2>
<p>Μια σημαντική σύμβαση: αν έστω ΕΝΑ method ενός struct χρειάζεται pointer receiver, η κοινή πρακτική είναι να κάνεις ΟΛΑ τα methods αυτού του struct pointer receivers — ακόμα κι αν κάποια από αυτά θα δούλευαν μια χαρά και ως value receivers. Αυτό αποφεύγει σύγχυση: ο αναγνώστης του κώδικα δεν χρειάζεται να αναρωτιέται "γιατί άλλα methods τροποποιούν και άλλα όχι" σε ασυνεπή τρόπο.</p>

<div class="callout">
  <span class="tag">Πρακτικός κανόνας εμπειρίας</span>
  Αν δεν είσαι σίγουρος/η, ξεκίνα με pointer receiver. Είναι η ασφαλέστερη προεπιλογή σε πραγματικό κώδικα: αποφεύγει άσκοπες αντιγραφές μεγάλων structs και σου αφήνει ανοιχτή την επιλογή τροποποίησης αν τη χρειαστείς αργότερα.
</div>
`);

<div class="eyebrow">Ενότητα 4 / 7 — Methods</div>
<h1>Methods σε Non-Struct Types</h1>
<p class="lede">Κάτι που ίσως εκπλήσσει: τα methods στη Go ΔΕΝ περιορίζονται μόνο σε structs. Μπορείς να ορίσεις methods πάνω σε ΟΠΟΙΟΝΔΗΠΟΤΕ δικό σου (named/custom) τύπο — ακόμα και πάνω σε ένα απλό float64 ή string, αρκεί να το "μετονομάσεις" πρώτα.</p>

<pre><code class="lang-go">type Celsius float64

func (c Celsius) ToFahrenheit() float64 {
    return float64(c)*9/5 + 32
}

temp := Celsius(25)
fmt.Println(temp.ToFahrenheit()) // 77</code></pre>

<p>Το ίδιο δουλεύει και για custom types πάνω σε map ή slice — θυμήσου το <code class="inline-code">StringSet</code> από νωρίτερα:</p>

<pre><code class="lang-go">type StringSet map[string]struct{}

func (s StringSet) Contains(item string) bool {
    _, exists := s[item]
    return exists
}

func (s StringSet) Add(item string) {
    s[item] = struct{}{}
}

set := StringSet{}
set.Add("apple")
fmt.Println(set.Contains("apple")) // true</code></pre>

<div class="callout">
  <span class="tag">Γιατί αυτό είναι χρήσιμο</span>
  Αντί να γράφεις ελεύθερες functions που δέχονται <code class="inline-code">float64</code> ή <code class="inline-code">map[string]struct{}</code> ως πρώτο όρισμα, μπορείς να "τυλίξεις" έναν πρωτόγονο τύπο σε ένα νόημα-φέρον όνομα (<code class="inline-code">Celsius</code> αντί για γυμνό <code class="inline-code">float64</code>) και να προσθέσεις methods πάνω του — ο κώδικας γίνεται πιο εκφραστικός ΚΑΙ πιο ασφαλής (δεν μπερδεύεις κατά λάθος Celsius με Fahrenheit, αφού είναι πλέον διαφορετικοί τύποι).
</div>

<h2>Method Sets: Value (T) vs Pointer (*T)</h2>
<p>Υπάρχει ένας λεπτός αλλά σημαντικός κανόνας σχετικά με ΠΟΙΑ methods μπορείς να καλέσεις πάνω σε ένα value έναντι ενός pointer. Ο κανόνας: το method set ενός <code class="inline-code">*T</code> (pointer σε T) περιλαμβάνει ΚΑΙ τα value ΚΑΙ τα pointer receiver methods· το method set ενός γυμνού <code class="inline-code">T</code> περιλαμβάνει ΜΟΝΟ τα value receiver methods.</p>

<pre><code class="lang-go">type Counter struct{ Value int }

func (c Counter) Read() int    { return c.Value }   // value receiver
func (c *Counter) Inc()        { c.Value++ }         // pointer receiver

var c Counter = Counter{}
c.Read() // OK — value receiver, δουλεύει σε value
c.Inc()  // OK — η Go το μετατρέπει αυτόματα σε (&c).Inc(), αφού το c είναι addressable</code></pre>

<div class="callout">
  <span class="tag">Πού αυτό ΓΙΝΕΤΑΙ πρόβλημα</span>
  Ο παραπάνω αυτόματος μετασχηματισμός δουλεύει ΜΟΝΟ όταν το value είναι "addressable" (δηλαδή, μπορείς να πάρεις τη διεύθυνσή του — μια απλή μεταβλητή είναι, αλλά ένα value μέσα σε map δεν είναι). Θα το ξαναδούμε ως σημαντική παγίδα στην Ενότητα 5 σχετικά με τα interfaces, όπου αυτή η αυτόματη μετατροπή ΔΕΝ συμβαίνει πάντα.
</div>

<h2>Method Values vs Method Expressions</h2>
<p>Ένα method μπορεί να "δεσμευτεί" (bind) σε μια μεταβλητή με δύο διαφορετικούς τρόπους.</p>

<pre><code class="lang-go">rect := Rectangle{Width: 5, Height: 3}

// Method Value: δεσμεύεται στο ΣΥΓΚΕΚΡΙΜΕΝΟ rect — το "θυμάται" μόνιμα
areaFunc := rect.Area
fmt.Println(areaFunc()) // 15 — δεν χρειάζεται να ξαναπεράσεις το rect

// Method Expression: ΔΕΝ δεσμεύεται σε κανένα συγκεκριμένο instance —
// παίρνει το receiver ως πρώτο, ρητό όρισμα
areaExpr := Rectangle.Area
fmt.Println(areaExpr(rect)) // 15 — εδώ ΠΡΕΠΕΙ να περάσεις το rect ρητά</code></pre>

<div class="callout">
  <span class="tag">Πότε χρησιμοποιείς το καθένα</span>
  Το method value είναι χρήσιμο όταν θέλεις να περάσεις "τη συμπεριφορά ενός συγκεκριμένου αντικειμένου" σε άλλη function ως callback — π.χ. σε ένα σύστημα event listeners. Το method expression είναι πιο σπάνιο στην πράξη· εμφανίζεται κυρίως σε πιο προχωρημένα, generic patterns όπου θέλεις να μεταχειριστείς το ίδιο το method σαν "απλή function" χωρίς κανένα δεσμευμένο receiver.
</div>

<h2>Method Promotion μέσω Embedding</h2>
<p>Ακριβώς όπως τα πεδία ενός embedded struct "προάγονται" (promoted) στο εξωτερικό struct, το ΙΔΙΟ συμβαίνει και με τα methods.</p>

<pre><code class="lang-go">type Engine struct{ Horsepower int }

func (e Engine) Start() string {
    return "Engine starting..."
}

type Car struct {
    Engine // embedded
    Brand  string
}

c := Car{Engine: Engine{Horsepower: 300}, Brand: "Toyota"}
fmt.Println(c.Start()) // "Engine starting..." — promoted METHOD, όχι μόνο πεδίο!</code></pre>

<div class="callout">
  <span class="tag">Σύνδεση με προηγούμενη ενότητα</span>
  Αυτό είναι ακριβώς η ίδια ιδέα με το promoted field που είδες στην Ενότητα 3.4 — απλά τώρα εφαρμόζεται σε methods αντί για πεδία δεδομένων. Το <code class="inline-code">Car</code> "αποκτά" αυτόματα το <code class="inline-code">Start()</code> method του embedded <code class="inline-code">Engine</code>, χωρίς να χρειάζεται να το ξαναγράψεις.
</div>
`);

<div class="eyebrow">Ενότητα 5 / 7 — Interfaces</div>
<h1>Θεμελιώδεις Αρχές των Interfaces</h1>
<p class="lede">Φτάσαμε στο ίσως πιο σημαντικό εργαλείο σχεδίασης της Go. Ήδη είδες ένα interface νωρίτερα — το ίδιο το <code class="inline-code">error</code> από την Ενότητα 1 — χωρίς να το ονομάσουμε ρητά ως τέτοιο. Τώρα θα καταλάβεις πλήρως τι είναι.</p>

<h2>Interface: Συμβόλαιο Συμπεριφοράς</h2>
<p>Ένα interface στη Go ΔΕΝ περιγράφει δεδομένα (όπως ένα struct) — περιγράφει <strong>συμπεριφορά</strong>. Συγκεκριμένα, περιγράφει ένα σύνολο methods που ΚΑΠΟΙΟΣ τύπος πρέπει να έχει, χωρίς να λέει ΤΙΠΟΤΑ για το πώς αυτός ο τύπος υλοποιεί εσωτερικά αυτά τα methods.</p>

<pre><code class="lang-go">type Shape interface {
    Area() float64
}</code></pre>

<p>Αυτό λέει: "οτιδήποτε θέλει να θεωρείται Shape πρέπει να έχει ένα method <code class="inline-code">Area()</code> που επιστρέφει float64". Τίποτα παραπάνω. Δεν λέει τίποτα για το ΤΙ είναι — κύκλος, τετράγωνο, τρίγωνο — μόνο τι πρέπει να ΜΠΟΡΕΙ να κάνει.</p>

<h2>Duck Typing: "Αν περπατάει σαν πάπια..."</h2>
<p>Η φιλοσοφία πίσω από τα interfaces της Go συχνά περιγράφεται με τη γνωστή έκφραση: <em>"If it walks like a duck and quacks like a duck, then it's a duck"</em> — αν κάτι περπατάει σαν πάπια και κάνει "quack" σαν πάπια, τότε είναι πάπια, ανεξάρτητα από το τι "ονομάζεται" επίσημα. Στη Go, αυτό σημαίνει: δεν μας νοιάζει ΤΙ ΕΙΝΑΙ ένας τύπος (το όνομά του, η "καταγωγή" του) — μας νοιάζει μόνο ΤΙ ΜΠΟΡΕΙ ΝΑ ΚΑΝΕΙ (ποια methods έχει).</p>

<div class="callout">
  <span class="tag">Γιατί αυτό είναι δυνατό</span>
  Θα το δούμε αναλυτικά στην επόμενη ενότητα, αλλά η βασική ιδέα: στη Go δεν χρειάζεται να δηλώσεις ρητά "το struct μου υλοποιεί το interface Χ". Αν απλά ΕΧΕΙ τα σωστά methods, ταιριάζει αυτόματα — αυτό είναι το duck typing στην πράξη.
</div>
`);

<div class="eyebrow">Ενότητα 5 / 7 — Interfaces</div>
<h1>Implicit Implementation (Έμμεση Υλοποίηση)</h1>
<p class="lede">Εδώ βρίσκεται η πιο σημαντική διαφορά ανάμεσα στα interfaces της Go και τα interfaces άλλων γλωσσών (Java, C#, TypeScript).</p>

<h2>Σε άλλες γλώσσες: Ρητή Δήλωση</h2>
<p>Σε γλώσσες όπως η Java, αν θέλεις μια κλάση να υλοποιεί ένα interface, πρέπει να το δηλώσεις ΡΗΤΑ στον κώδικα: <code class="inline-code">class Circle implements Shape { ... }</code>. Αν ξεχάσεις αυτή τη δήλωση — ακόμα κι αν η κλάση έχει όλα τα σωστά methods — ο compiler δεν θα την αναγνωρίσει ως Shape.</p>

<h2>Στη Go: Αυτόματη Αναγνώριση</h2>
<p>Στη Go, ΔΕΝ γράφεις ποτέ κάτι σαν <code class="inline-code">implements Shape</code>. Αν ένα struct έχει ΟΛΑ τα methods που απαιτεί ένα interface, ΤΑΙΡΙΑΖΕΙ αυτόματα σε αυτό το interface — χωρίς καμία ρητή δήλωση σύνδεσης.</p>

<pre><code class="lang-go">type Shape interface {
    Area() float64
}

type Circle struct {
    Radius float64
}

// Το Circle δεν δηλώνει ΠΟΥΘΕΝΑ ότι "υλοποιεί" το Shape.
// Απλά ΕΧΕΙ ένα method Area() float64 -> αυτόματα ταιριάζει.
func (c Circle) Area() float64 {
    return math.Pi * c.Radius * c.Radius
}

func PrintArea(s Shape) {
    fmt.Println("Area:", s.Area())
}

func main() {
    c := Circle{Radius: 5}
    PrintArea(c) // δουλεύει! Το Circle "ταιριάζει" σε Shape αυτόματα</code></pre>

<div class="callout">
  <span class="tag">Πλεονεκτήματα της έμμεσης υλοποίησης</span>
  Πρώτον, <strong>Decoupling (αποσύζευξη)</strong>: το πακέτο που ορίζει το <code class="inline-code">Circle</code> δεν χρειάζεται καν να ξέρει ότι υπάρχει το interface <code class="inline-code">Shape</code> — μπορεί να γραφτεί εντελώς ανεξάρτητα, ακόμα και πριν υπάρξει το interface. Δεύτερον, <strong>Unit Testing μέσω Mock Implementations</strong>: μπορείς εύκολα να φτιάξεις ένα "ψεύτικο" (mock/fake) type που υλοποιεί το ίδιο interface, ειδικά για τεστ, χωρίς να χρειάζεται να αλλάξεις τίποτα στο πραγματικό interface ή στους πραγματικούς τύπους.
</div>
`);

<div class="eyebrow">Ενότητα 5 / 7 — Interfaces</div>
<h1>Θεωρία Πολυμορφισμού στη Go</h1>
<p class="lede">Έχεις ακούσει ίσως τον όρο "πολυμορφισμός" (polymorphism) από άλλες γλώσσες. Ας δούμε τι σημαίνει, και το κρίσιμο: πώς η προσέγγιση της Go διαφέρει θεμελιωδώς από αυτό που ίσως ξέρεις.</p>

<h2>Τι είναι Πολυμορφισμός</h2>
<p>Πολυμορφισμός σημαίνει, κυριολεκτικά, "πολλές μορφές" — η ικανότητα διαφορετικών τύπων δεδομένων να αντιμετωπίζονται ΜΕΣΩ ΜΙΑΣ κοινής διεπαφής (interface), χωρίς ο κώδικας που τους χρησιμοποιεί να χρειάζεται να ξέρει τον ΑΚΡΙΒΗ, συγκεκριμένο τύπο του καθενός. Ένα interface, πολλές δυνατές "μορφές" υλοποίησης από πίσω του.</p>

<pre><code class="lang-go">type Shape interface {
    Area() float64
}

type Circle struct{ Radius float64 }
type Rectangle struct{ Width, Height float64 }

func (c Circle) Area() float64    { return math.Pi * c.Radius * c.Radius }
func (r Rectangle) Area() float64 { return r.Width * r.Height }

func PrintArea(s Shape) {
    fmt.Println("Area:", s.Area()) // δεν νοιάζεται ΤΙ είναι το s — Circle; Rectangle; οτιδήποτε!
}

func main() {
    PrintArea(Circle{Radius: 5})           // "μορφή" 1
    PrintArea(Rectangle{Width: 4, Height: 3}) // "μορφή" 2 — ΙΔΙΑ function, διαφορετική συμπεριφορά
}</code></pre>

<h2>Πώς Διαφέρει η Go: Χωρίς Κληρονομικότητα</h2>
<p>Σε γλώσσες όπως η Java, ο πολυμορφισμός συνήθως επιτυγχάνεται μέσω κληρονομικότητας: μια υποκλάση (subclass) "επεκτείνει" (extends) μια γονική κλάση ή "υλοποιεί" (implements) ένα interface, και το <code class="inline-code">super</code> δίνει πρόσβαση στη γονική συμπεριφορά. Η Go ΔΕΝ έχει τίποτα από αυτά — ούτε <code class="inline-code">extends</code>, ούτε <code class="inline-code">super</code>, καμία ιεραρχία κλάσεων.</p>

<div class="callout">
  <span class="tag">Η ουσιαστική διαφορά</span>
  Στη Go, ο πολυμορφισμός βασίζεται ΑΠΟΚΛΕΙΣΤΙΚΑ στη <strong>συμπεριφορά</strong> (behavior) — ποια methods έχει ένας τύπος — και ΟΧΙ σε καμία ιεραρχία "είναι ένα" (is-a). Το <code class="inline-code">Circle</code> δεν "είναι ένα" Shape με την έννοια που ένα <code class="inline-code">Dog</code> "είναι ένα" Animal σε Java — απλά ΤΥΧΑΙΝΕΙ να έχει το method που το interface Shape απαιτεί. Αυτό επιτρέπει σε ένα type να "ταιριάζει" σε ΠΟΛΛΑΠΛΑ, εντελώς άσχετα interfaces ταυτόχρονα, χωρίς κανένα πρόβλημα ιεραρχίας.
</div>

<h2>Compile-time vs Runtime Dispatch</h2>
<p>Όταν καλείς <code class="inline-code">s.Area()</code> μέσα στην <code class="inline-code">PrintArea</code>, η Go δεν ξέρει κατά τη μεταγλώττιση (compile-time) ΠΟΙΑ ακριβώς υλοποίηση του <code class="inline-code">Area()</code> θα εκτελεστεί — Circle's ή Rectangle's; Αυτό αποφασίζεται κατά την εκτέλεση (runtime), ανάλογα με το ΤΙ πραγματικό value βρίσκεται μέσα στο interface τη δεδομένη στιγμή. Αυτό λέγεται <strong>dynamic dispatch</strong> (δυναμική αποστολή κλήσης).</p>

<div class="grid2">

<div class="eyebrow">Ενότητα 5 / 7 — Interfaces</div>
<h1>Advanced Interface Usage: Εσωτερική Δομή</h1>
<p class="lede">Για να καταλάβεις μερικές από τις πιο περίεργες παγίδες με interfaces, χρειάζεται να δεις τι ΕΙΝΑΙ πραγματικά ένα interface value "από μέσα".</p>

<h2>Dynamic Type &amp; Dynamic Value: το Interface Tuple</h2>
<p>Ένα interface value στη Go δεν είναι απλά "ένας δείκτης" — είναι εσωτερικά ένα ζευγάρι (tuple) δύο πραγμάτων: (1) ο <strong>δυναμικός τύπος</strong> (dynamic type) — ΤΙ συγκεκριμένος τύπος είναι αποθηκευμένος μέσα, και (2) η <strong>δυναμική τιμή</strong> (dynamic value) — η ΠΡΑΓΜΑΤΙΚΗ τιμή αυτού του τύπου.</p>

<pre><code class="lang-go">var s Shape = Circle{Radius: 5}
// Εσωτερικά: s = (type: Circle, value: {Radius: 5})</code></pre>

<div class="callout">
  <span class="tag">Γιατί έχει σημασία</span>
  Αυτό το tuple είναι που επιτρέπει το dynamic dispatch που είδαμε προηγουμένως — όταν καλείς <code class="inline-code">s.Area()</code>, η Go κοιτάζει το αποθηκευμένο "type" μέρος του tuple για να βρει ΠΟΙΑ έκδοση του Area() να τρέξει.
</div>

<h2>Η Παγίδα: nil pointer μέσα σε non-nil interface</h2>
<p>Αυτό είναι από τα πιο μπερδεμένα σημεία της Go για αρχάριους — και ακόμα και για έμπειρους προγραμματιστές. Ένα interface που περιέχει έναν <code class="inline-code">nil</code> pointer ΔΕΝ είναι το ίδιο με ένα <code class="inline-code">nil</code> interface.</p>

<pre><code class="lang-go">type MyError struct{}
func (e *MyError) Error() string { return "something failed" }

func doSomething() *MyError {
    return nil // επιστρέφει nil pointer τύπου *MyError
}

func main() {
    var err error = doSomething() // ΠΡΟΣΟΧΗ: μετατροπή σε interface error!
    fmt.Println(err == nil) // false !! Αν και ο pointer ΕΙΝΑΙ nil</code></pre>

<div class="callout">
  <span class="tag">Γιατί συμβαίνει αυτό</span>
  Θυμήσου το tuple: (type, value). Όταν το <code class="inline-code">*MyError(nil)</code> ανατίθεται στη μεταβλητή <code class="inline-code">error</code>, το interface γίνεται (type: *MyError, value: nil) — έχει ΕΝΑ ΣΥΓΚΕΚΡΙΜΕΝΟ τύπο αποθηκευμένο μέσα, ακόμα κι αν η τιμή είναι nil! Ένα interface είναι <code class="inline-code">nil</code> ΜΟΝΟ όταν ΚΑΙ ο τύπος ΚΑΙ η τιμή του είναι κενά — δηλαδή, όταν ΚΑΝΕΝΑ concrete type δεν έχει ανατεθεί ποτέ σε αυτό. Ο κανόνας εμπειρίας: <strong>μην επιστρέφεις ρητά typed nil pointers σαν error</strong> — αν δεν υπάρχει σφάλμα, επίστρεψε κυριολεκτικά <code class="inline-code">nil</code> απευθείας, τύπου error.
</div>

<h2>Empty Interface: interface{} / any</h2>
<p>Ένα interface ΧΩΡΙΣ κανένα method requirement — <code class="inline-code">interface{}</code>, ή ο πιο σύγχρονος συνώνυμος όρος <code class="inline-code">any</code> — ταιριάζει ΚΥΡΙΟΛΕΚΤΙΚΑ σε ΟΠΟΙΟΔΗΠΟΤΕ τύπο, αφού δεν απαιτεί τίποτα.</p>

<pre><code class="lang-go">func PrintAnything(v any) {
    fmt.Println(v)
}

PrintAnything(42)
PrintAnything("hello")
PrintAnything(Circle{Radius: 5})</code></pre>

<div class="callout">
  <span class="tag">Πότε ΝΑ το αποφεύγεις</span>
  Το <code class="inline-code">any</code> ακούγεται βολικό — "δουλεύει με τα πάντα!" — αλλά αυτή η ευελιξία έχει κόστος: χάνεις ΟΛΗ την ασφάλεια τύπων (type safety) που προσφέρει η Go. Ο compiler δεν μπορεί πλέον να σε προειδοποιήσει αν κάνεις κάτι λάθος με την τιμή — θα το ανακαλύψεις μόνο κατά το runtime, συχνά μέσω panic. Χρησιμοποίησε <code class="inline-code">any</code> μόνο όταν πραγματικά δεν υπάρχει τρόπος να ξέρεις τον τύπο εκ των προτέρων (π.χ. parsing άγνωστου JSON) — όχι ως "εύκολη διαφυγή" από το να σκεφτείς σωστά τα interfaces σου.
</div>
`);

<div class="eyebrow">Ενότητα 5 / 7 — Interfaces</div>
<h1>Type Assertions &amp; Type Switches</h1>
<p class="lede">Όταν έχεις μια μεταβλητή interface (π.χ. <code class="inline-code">any</code> ή ένα δικό σου interface) και χρειάζεται να ανακτήσεις τον ΣΥΓΚΕΚΡΙΜΕΝΟ, αρχικό τύπο που κρύβεται μέσα της, χρησιμοποιείς Type Assertion ή Type Switch.</p>

<h2>Type Assertion: Ασφαλής Ανάκτηση</h2>
<pre><code class="lang-go">var s Shape = Circle{Radius: 5}

// Μορφή με "comma ok" — ΑΣΦΑΛΗΣ, δεν κάνει ποτέ panic
circle, ok := s.(Circle)
if ok {
    fmt.Println("It's a circle with radius:", circle.Radius)
} else {
    fmt.Println("Not a circle")
}</code></pre>

<div class="callout">
  <span class="tag">Η "επικίνδυνη" μορφή — χωρίς comma ok</span>
  Υπάρχει και μορφή χωρίς το δεύτερο, boolean αποτέλεσμα: <code class="inline-code">circle := s.(Circle)</code>. Αυτή η μορφή προκαλεί <strong>panic</strong> αν το s δεν είναι ΠΡΑΓΜΑΤΙΚΑ Circle. Χρησιμοποίησέ τη ΜΟΝΟ όταν είσαι απόλυτα σίγουρος/η για τον τύπο (π.χ. μόλις τον έλεγξες με άλλο τρόπο) — στις περισσότερες περιπτώσεις, προτίμησε πάντα τη μορφή με "comma ok".
</div>

<h2>Type Switch: Χειρισμός Πολλαπλών Πιθανών Τύπων</h2>
<p>Όταν χρειάζεται να ελέγξεις ΠΟΛΛΟΥΣ πιθανούς τύπους διαδοχικά, το type switch είναι πιο καθαρό από μια αλυσίδα type assertions.</p>

<pre><code class="lang-go">func describe(s Shape) string {
    switch v := s.(type) {
    case Circle:
        return fmt.Sprintf("circle with radius %.1f", v.Radius)
    case Rectangle:
        return fmt.Sprintf("rectangle %vx%v", v.Width, v.Height)
    default:
        return "unknown shape"
    }
}</code></pre>

<div class="callout">
  <span class="tag">Πώς να το διαβάσεις</span>
  Η ειδική σύνταξη <code class="inline-code">s.(type)</code> λειτουργεί ΜΟΝΟ μέσα σε ένα switch statement — δεν είναι έγκυρη έκφραση πουθενά αλλού. Σε κάθε case, η μεταβλητή <code class="inline-code">v</code> αποκτά αυτόματα τον ΣΥΓΚΕΚΡΙΜΕΝΟ τύπο εκείνου του case (μέσα στο <code class="inline-code">case Circle:</code>, το <code class="inline-code">v</code> είναι ήδη τύπου Circle — δεν χρειάζεται ξανά assertion).
</div>

<h2>Interface Composition</h2>
<p>Όπως είδαμε ήδη με τα <code class="inline-code">io.ReadWriter</code> στην Ενότητα 2.4, μπορείς να "χτίσεις" μεγαλύτερα interfaces συνδυάζοντας μικρότερα.</p>

<pre><code class="lang-go">type Named interface {
    Name() string
}

type Aged interface {
    Age() int
}

// Interface composition: συνδυάζει δύο μικρότερα interfaces σε ένα
type Person interface {
    Named
    Aged
}
// Ένα type ταιριάζει σε Person ΜΟΝΟ αν έχει ΚΑΙ Name() ΚΑΙ Age()</code></pre>

<h2>Η Χρυσή Αρχή: Keep Interfaces Small</h2>
<p>Στη Go κοινότητα κυκλοφορεί μια πολύ γνωστή παροιμία: <em>"The bigger the interface, the weaker the abstraction"</em> — όσο μεγαλύτερο το interface, τόσο πιο αδύναμη η αφαίρεση. Αυτή η αρχή λέγεται και Interface Segregation Principle: προτίμησε πολλά μικρά, εστιασμένα interfaces (όπως το <code class="inline-code">io.Reader</code> με ΜΙΑ μέθοδο) αντί για ένα τεράστιο interface με δεκάδες methods.</p>

<div class="callout">
  <span class="tag">Γιατί μικρά interfaces είναι καλύτερα</span>
  Όσο μικρότερο ένα interface, τόσο ΠΕΡΙΣΣΟΤΕΡΟΙ τύποι μπορούν να ταιριάξουν σε αυτό φυσικά, χωρίς προσπάθεια — ένα interface με μία μόνο μέθοδο (όπως το Reader) μπορεί να υλοποιηθεί από δεκάδες ασύνδετους τύπους. Ένα τεράστιο interface με 15 methods είναι σχεδόν σίγουρο ότι θα ταιριάζει ΜΟΝΟ σε έναν ή δύο συγκεκριμένους τύπους που γράφτηκαν ρητά γι' αυτό — χάνοντας όλη την ευελιξία που προσφέρουν τα interfaces.
</div>
`);

<div class="eyebrow">Ενότητα 5 / 7 — VSCode Challenge</div>
<h1>Shape Interface — Πολυμορφισμός στην Πράξη</h1>
<p class="lede">Η κλασική άσκηση για interfaces — φτιάξε την από την αρχή.</p>

<div class="callout">
  <span class="tag">Η Άσκηση</span>
  Δημιούργησε ένα interface <code class="inline-code">Shape</code> με τη μέθοδο <code class="inline-code">Area() float64</code>. Φτιάξε δύο structs, <code class="inline-code">Rectangle</code> (με πεδία Width, Height) και <code class="inline-code">Circle</code> (με πεδίο Radius), που το καθένα υλοποιεί το <code class="inline-code">Shape</code> (θυμήσου: έμμεσα, χωρίς ρητή δήλωση). Γράψε μια function <code class="inline-code">PrintArea(s Shape)</code> που δέχεται ΟΤΙΔΗΠΟΤΕ είναι Shape και τυπώνει το εμβαδόν του — αποδεικνύοντας τον πολυμορφισμό στην πράξη, καλώντας την ΙΔΙΑ function και για τα δύο structs.
</div>

<div class="callout">
  <span class="tag">HINT 1</span>
  Δεν χρειάζεται να γράψεις πουθενά κάτι σαν "Rectangle implements Shape" — απλά δώσε στο Rectangle ένα method Area() float64 με τη σωστή υπογραφή, και θα ταιριάξει αυτόματα.
</div>

<div class="callout">
  <span class="tag">HINT 2</span>
  Για το εμβαδόν κύκλου χρειάζεσαι το <code class="inline-code">math.Pi</code> από το πακέτο <code class="inline-code">math</code> — μην ξεχάσεις το import.
</div>

<div class="spoiler"><div class="spoiler-lock"><span>Drag to reveal →</span></div><pre><code class="lang-go">package main

import (
    "fmt"
    "math"
)

type Shape interface {
    Area() float64
}

type Rectangle struct {
    Width, Height float64
}

func (r Rectangle) Area() float64 {
    return r.Width * r.Height
}

type Circle struct {
    Radius float64
}

func (c Circle) Area() float64 {
    return math.Pi * c.Radius * c.Radius
}

func PrintArea(s Shape) {
    fmt.Printf("Area: %.2f\\n", s.Area())
}

func main() {
    r := Rectangle{Width: 4, Height: 5}
    c := Circle{Radius: 3}

    PrintArea(r) // Area: 20.00
    PrintArea(c) // Area: 28.27

<div class="eyebrow">Ενότητα 6 / 7 — Πολυμορφισμός στην Πράξη</div>
<h1>*os.File vs io.Reader/io.Writer</h1>
<p class="lede">Τώρα που καταλαβαίνεις πλήρως interfaces και πολυμορφισμό, ήρθε η ώρα να δούμε το πιο εντυπωσιακό, πραγματικό παράδειγμά τους σε ολόκληρη τη standard library της Go: το σύστημα I/O.</p>

<h2>Concrete Type vs Abstraction</h2>
<p>Θυμήσου το <code class="inline-code">*os.File</code> από την Ενότητα 2 — τον τύπο που επιστρέφει το <code class="inline-code">os.Open</code>. Αυτό είναι ένας <strong>concrete type</strong> (συγκεκριμένος τύπος): αντιπροσωπεύει ΑΚΡΙΒΩΣ ένα αρχείο στο δίσκο, με όλα τα δικά του, ειδικά χαρακτηριστικά (file descriptor, δικαιώματα κ.λπ.).</p>
<p>Το <code class="inline-code">io.Reader</code> είναι μια <strong>abstraction</strong> (αφαίρεση): δεν λέει τίποτα για ΤΙ είναι η πηγή δεδομένων — μόνο ότι "μπορεί να διαβαστεί". Ένα <code class="inline-code">*os.File</code> ΤΥΧΑΙΝΕΙ να ικανοποιεί αυτή την αφαίρεση, επειδή έχει το κατάλληλο method <code class="inline-code">Read</code> — αλλά ΔΕΝ είναι το μόνο πράγμα που μπορεί.</p>

<h2>Γιατί το Concrete Type Δυσκολεύει το Testing</h2>
<p>Φαντάσου μια function που χρειάζεται να διαβάσει δεδομένα και δηλώνεις ρητά ότι θέλει <code class="inline-code">*os.File</code>:</p>

<pre><code class="lang-go">// ΚΑΚΗ σχεδίαση: εξάρτηση από ΣΥΓΚΕΚΡΙΜΕΝΟ τύπο
func CountLines(f *os.File) (int, error) {
    // ...
}</code></pre>

<div class="callout">
  <span class="tag">Το πρόβλημα</span>
  Για να τεστάρεις αυτή τη function, ΠΡΕΠΕΙ να δημιουργήσεις ένα πραγματικό αρχείο στο δίσκο — αργό, περίπλοκο, χρειάζεται cleanup μετά, και δεν δουλεύει καθόλου αν θέλεις να περάσεις δεδομένα από κάπου αλλού (π.χ. δίκτυο, ή ένα string στη μνήμη). Είναι <strong>tight coupling</strong> (στενή σύζευξη) στη ΣΥΓΚΕΚΡΙΜΕΝΗ πηγή "αρχείο στο δίσκο".
</div>
`);
