<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ο Γρίφος του Parlor</title>
<style>
  :root{
    --paper:#e7eef3;
    --paper-deep:#d9e5ec;
    --panel:#fbfdfe;
    --ink:#1f3346;
    --ink-soft:#3f5972;
    --ink-faint:#8fa4b6;
    --sage:#3d6f8f;
    --sage-deep:#26516d;
    --brass:#3d78ab;
    --brass-bright:#5c98cc;
    --rose:#2e5478;
    --line:#b7c9d6;
    --box-blue:#233c63;
    --box-blue-text:#d7e0ee;
    --box-white:#eef2f5;
    --box-black:#221c14;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background-color:var(--paper);
    background-image:
      radial-gradient(ellipse 60% 40% at 15% 0%, rgba(61,120,171,0.10), transparent 60%),
      radial-gradient(ellipse 55% 45% at 85% 8%, rgba(38,81,109,0.08), transparent 60%),
      repeating-linear-gradient(0deg, rgba(31,51,70,0.015) 0px, rgba(31,51,70,0.015) 1px, transparent 1px, transparent 3px);
    color:var(--ink);
    font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  }

  .page{
    max-width:800px;
    margin:0 auto;
    padding:26px;
  }

  /* -- ornamental frame -- */
  .frame{
    position:relative;
    border:1px solid var(--line);
    padding:52px 44px 60px;
  }
  .frame::before{
    content:"";
    position:absolute;
    inset:7px;
    border:1px solid var(--line);
    opacity:0.55;
    pointer-events:none;
  }

  .corner{
    position:absolute;
    width:46px;
    height:46px;
    opacity:0.75;
  }
  .corner svg{width:100%;height:100%;display:block;}
  .corner.tl{top:-1px;left:-1px;}
  .corner.tr{top:-1px;right:-1px;transform:scaleX(-1);}
  .corner.bl{bottom:-1px;left:-1px;transform:scaleY(-1);}
  .corner.br{bottom:-1px;right:-1px;transform:scale(-1,-1);}

  /* -- header -- */
  header{
    text-align:center;
    margin-bottom:40px;
  }

  .emblem-plate{
    width:150px;
    margin:0 auto 16px;
    background:var(--panel);
    border:1px solid var(--line);
    padding:14px 14px 10px;
    box-shadow:0 6px 18px rgba(31,51,70,0.12);
    transform:rotate(-1.5deg);
  }
  .emblem-plate img{
    display:block;
    width:100%;
    height:auto;
  }
  .emblem-caption{
    font-family:'Courier New',Courier,monospace;
    font-size:8.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-faint);
    text-align:center;
    margin-top:6px;
  }

  .eyebrow{
    font-family:'Courier New',Courier,monospace;
    letter-spacing:0.28em;
    text-transform:uppercase;
    font-size:10.5px;
    color:var(--sage-deep);
    margin-bottom:16px;
  }

  h1{
    font-family:'Big Caslon','Big Caslon Medium',Baskerville,'Palatino Linotype',Georgia,serif;
    font-weight:400;
    font-size:clamp(30px,6vw,44px);
    letter-spacing:0.005em;
    margin:0 0 14px;
    color:var(--ink);
  }

  h1 em{
    font-style:italic;
    color:var(--rose);
  }

  .rule{
    width:120px;
    height:1px;
    background:var(--line);
    margin:0 auto 18px;
    position:relative;
  }
  .rule::after{
    content:"❧";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-52%);
    background:var(--paper);
    padding:0 10px;
    color:var(--brass);
    font-size:14px;
  }

  .sub{
    color:var(--ink-soft);
    font-size:15.5px;
    max-width:440px;
    margin:0 auto;
    line-height:1.6;
    font-style:italic;
  }

  /* -- search -- */
  .search-shell{
    position:relative;
    margin:34px 0 6px;
  }

  #search{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:1px;
    color:var(--ink);
    font-family:'Palatino Linotype','Book Antiqua',Georgia,serif;
    font-size:18px;
    padding:16px 50px 16px 20px;
    outline:none;
    box-shadow:inset 0 1px 3px rgba(60,47,34,0.08);
    transition:border-color .2s ease;
  }

  #search::placeholder{
    color:var(--ink-faint);
    font-style:italic;
  }

  #search:focus{
    border-color:var(--brass);
    box-shadow:inset 0 1px 3px rgba(60,47,34,0.08), 0 0 0 2px rgba(196,154,63,0.25);
  }

  .search-icon{
    position:absolute;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    color:var(--brass);
    pointer-events:none;
    width:18px;
    height:18px;
  }

  .hint{
    font-family:'Courier New',Courier,monospace;
    font-size:10.5px;
    letter-spacing:0.05em;
    color:var(--ink-faint);
    text-align:right;
    margin-top:8px;
    min-height:14px;
  }

  /* -- results list (table of contents style) -- */
  #results{
    margin-top:22px;
    display:flex;
    flex-direction:column;
  }

  .result-row{
    background:transparent;
    border:none;
    border-bottom:1px dotted var(--line);
    padding:13px 4px;
    cursor:pointer;
    transition:background .15s ease, padding-left .15s ease;
    display:flex;
    align-items:baseline;
    gap:14px;
  }

  .result-row:hover{
    background:rgba(109,122,78,0.08);
    padding-left:10px;
  }

  .result-row:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:-2px;
  }

  .result-id{
    font-family:'Courier New',Courier,monospace;
    font-size:11px;
    letter-spacing:0.05em;
    color:var(--brass);
    flex-shrink:0;
  }

  .result-snippet{
    font-size:15px;
    color:var(--ink-soft);
    line-height:1.4;
  }

  .result-snippet mark{
    background:transparent;
    color:var(--rose);
    font-weight:bold;
    font-style:italic;
  }

  .empty-state{
    text-align:center;
    color:var(--ink-faint);
    font-style:italic;
    padding:34px 10px 10px;
    font-size:15px;
  }

  /* -- detail card -- */
  #detail{
    margin-top:28px;
    display:none;
  }

  .detail-card{
    background:var(--panel);
    border:1px solid var(--line);
    padding:30px;
    position:relative;
  }

  .detail-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }

  .detail-id{
    font-family:'Courier New',Courier,monospace;
    letter-spacing:0.08em;
    font-size:11.5px;
    color:var(--brass);
  }

  .back-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-family:'Courier New',Courier,monospace;
    font-size:10.5px;
    letter-spacing:0.05em;
    padding:7px 13px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .back-btn:hover{
    border-color:var(--brass);
    color:var(--brass-bright);
    background:rgba(196,154,63,0.08);
  }
  .back-btn:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:1px;
  }

  .boxes{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-bottom:26px;
  }

  .box{
    padding:17px 20px 17px 22px;
    font-size:15px;
    line-height:1.5;
    letter-spacing:0.01em;
    position:relative;
    border:1px solid rgba(0,0,0,0.18);
  }

  .box .label{
    font-family:'Courier New',Courier,monospace;
    font-size:9.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:7px;
    opacity:0.7;
  }

  .box .label .gem{
    width:9px;
    height:9px;
    display:none;
  }

  .box .stmt{
    display:block;
  }
  .box .stmt + .stmt{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid rgba(255,255,255,0.14);
  }

  .box.blue{ background:var(--box-blue); color:var(--box-blue-text); }
  .box.white{ background:var(--box-white); color:#2a2318; }
  .box.black{ background:var(--box-black); color:#dedad0; }

  .box.white .stmt + .stmt{ border-top-color:rgba(0,0,0,0.15); }

  .box.winner{
    box-shadow: inset 0 0 0 2px var(--brass-bright);
  }
  .box.winner .label .gem{
    display:inline-block;
  }
  .box.winner .label::after{
    content:"τα τζεμ";
    font-style:italic;
    text-transform:none;
    letter-spacing:0;
    color:var(--brass-bright);
    font-family:'Palatino Linotype','Book Antiqua',Georgia,serif;
    font-size:12px;
  }

  .prize-line{
    text-align:center;
    margin-bottom:26px;
    position:relative;
  }
  .prize-line span{
    font-family:'Big Caslon','Palatino Linotype',Georgia,serif;
    font-style:italic;
    font-size:16px;
    color:var(--rose);
    background:var(--panel);
    padding:0 14px;
    position:relative;
    z-index:1;
  }
  .prize-line::before{
    content:"";
    position:absolute;
    left:0;right:0;top:50%;
    height:1px;
    background:var(--line);
  }

  .solution{
    border-top:1px solid var(--line);
    padding-top:22px;
  }

  .solution .label{
    font-family:'Courier New',Courier,monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--sage-deep);
    display:block;
    margin-bottom:12px;
  }

  .solution p{
    margin:0;
    font-size:16px;
    line-height:1.75;
    color:var(--ink);
  }

  .solution p::first-letter{
    font-family:'Big Caslon','Palatino Linotype',Georgia,serif;
    font-size:2.5em;
    font-weight:600;
    color:var(--sage-deep);
    float:left;
    line-height:0.78;
    padding-right:6px;
    padding-top:4px;
  }

  footer{
    text-align:center;
    margin-top:36px;
    color:var(--ink-faint);
    font-family:'Courier New',Courier,monospace;
    font-size:10.5px;
    letter-spacing:0.08em;
  }

  @media (max-width:560px){
    .page{padding:12px;}
    .frame{padding:38px 18px 44px;}
    .detail-card{padding:20px;}
    #search{font-size:16px;padding:14px 44px 14px 16px;}
  }
</style>
</head>

es itself as containing the gems."}, {"id": "058", "blue": "THE GEMS ARE NOT IN THE BLACK BOX.", "white": "THE GEMS ARE IN THE BLUE BOX.", "black": "BOTH OF THESE STATEMENTS ARE FALSE. | THE STATEMENT ON THE WHITE BOX IS FALSE.", "prize": "White", "sol": "The black box's top statement must be false, lest it become paradoxical. This means that one of the two statements on the black box must be true, and as one has been proven false, the bottom statement on the black box is true. This means the white box is false, and the blue box must be the box that only displays true statements. With the information that the gems are in neither the blue nor the black boxes, it can be determined that they must be in the white box."}, {"id": "059", "blue": "THE GEMS ARE NOT IN THE BLACK BOX.", "white": "THIS STATEMENT IS AS TRUE AS THE STATEMENT ON THE BLACK BOX.", "black": "THE GEMS ARE IN THE WHITE BOX.", "prize": "White", "sol": "If the statement on the black box was false, the white box's statement would become paradoxical. Therefore, the black box must be true, and the gems are in the white box. Incidentally, the blue box's statement is true, and the white box's statement is false."}, {"id": "060", "blue": "THERE ARE TWO STATEMENTS ON THIS BOX. | THEY ARE BOTH FALSE.", "white": "THERE ARE TWO STATEMENTS ON THIS BOX. | THE GEMS ARE IN A BOX NO TRUE STATEMENTS.", "black": "THERE ARE TWO STATEMENTS ON THIS BOX.", "prize": "Black", "sol": "The blue box's top statement is trivially true, and its bottom statement is hence trivially false. The black box's statement is also trivially false. The white box is therefore the box that contains only true statements. The only box without true statements is the black box, and as per the bottom statement on the white box, said black box must contain the gems."}, {"id": "061", "blue": "THE SECOND STATEMENT ON THE BLACK BOX IS FALSE. | THE BLACK BOX CONTAINS THE GEMS.", "white": "EVERY STATEMENT WITH THE WORD 'BLUE' IS FALSE.", "black": "BOTH STATEMENTS ON THE BLUE BOX ARE TRUE. | THE BLUE BOX CONTAINS THE GEMS.", "prize": "Black", "sol": "The white box's statement, if true, is paradoxical, as it would call itself false. Therefore, the white box's statement must be false, and at least one of the two other statements with the word 'BLUE' must be true. Working through the black and blue boxes' statements, the black box's bottom statement is false, and the true statement containing the word 'BLUE' is the black box's top statement. This means the blue box is the box that only displays true statements, and it indicates the black box contains the gems."}, {"id": "062", "blue": "THE GEMS ARE IN THIS BOX. | THE ABOVE STATEMENT IS TRUE.", "white": "THE GEMS ARE NOT IN THIS BOX. | THE ABOVE STATEMENT IS FALSE.", "black": "THE TOP STATEMENT OF EACH BOX IS TRUE. | THE ABOVE STATEMENT IS TRUE.", "prize": "Blue", "sol": "The black box's top statement, if true, contradicts the rules of the Parlor Game, making its bottom statement false as well. The white box cannot be the box that displays only true statements, as it claims itself to be false. Therefore, the only box that could display only true statements is the blue box, which claims to contain the gems. Incidentally, the white box's top statement is true, and its bottom statement is false."}, {"id": "063", "blue": "BOTH OF THESE STATEMENTS ARE TRUE. | THE GEMS ARE IN THIS BOX.", "white": "THE GEMS ARE NOT IN THE BLUE BOX. | THE GEMS ARE NOT IN THE BLACK BOX.", "black": "THE GEMS ARE IN A BOX WITH A FALSE STATEMENT. | BOTH STATEMENTS ON THE BLUE BOX ARE TRUE.", "prize": "White", "sol": "If the white box's top statement was false, the gems would be in the blue box - but this would violate the rules of the Parlor Game (no box with only false statements). If the white box's bottom statement was false, no box would display only true statements, again violating the rules. Therefore, neither statement on the white box is true, and by process of elimination, the white box contains the gems. Incidentally, every statement not on the white box is false."}, {"id": "064", "blue": "THE GEMS ARE NOT IN THIS BOX. | THE GEMS ARE NOT IN THE WHITE BOX.", "white": "THE GEMS ARE NOT IN THIS BOX. | THE GEMS ARE IN THE BLUE BOX.", "black": "THE GEMS ARE NOT IN THIS BOX. | THE GEMS ARE IN THE BLUE BOX.", "prize": "Black", "sol": "The blue box cannot be the box that contains only false statements, as the gems can only be in one box. This means the white or black box must contain only false statements. Working through the logic, the white box is not the box that contains only false statements either, and that title must belong to the black box, which according to its own statement, contains the gems. Incidentally, except for the white box's bottom statement, every statement not on the black box is true."}, {"id": "065", "blue": "THE STATEMENTS ON THIS BOX ARE EITHER BOTH TRUE OR BOTH FALSE. | THIS BOX IS EMPTY.", "white": "THIS BOX IS WHITE.", "black": "ALL STATEMENTS ON THE BLUE BOX ARE TRUE. | THE BOX WITH NO FALSE STATEMENTS HAS THE GEMS.", "prize": "Black", "sol": "The white box is trivially true. If the blue box's top statement is true, its bottom statement must also be true, which would make the black box's top statement true as well - but this would mean no box displays only false statements, violating the rules. Therefore, the blue box's top statement is false, meaning the bottom statement is true. This means the box with only false statements must be the black box, and the box that displays only true statements, the white box, does not have the gems. Since the blue box is also empty, the black box must contain the gems."}, {"id": "066", "blue": "THE WHITE BOX HAS EXACTLY ONE TRUE STATEMENT. | THE BLACK BOX HAS NO TRUE STATEMENTS.", "white": "THE GEMS ARE NOT IN THE BLACK BOX. | THE ABOVE STATEMENT IS TRUE.", "black": "THE BLUE BOX HAS EXACTLY ONE TRUE STATEMENT. | THE GEMS ARE IN THE BLUE BOX.", "prize": "Blue", "sol": "The white box's statements nts, and while the truth value of the white box's statements cannot be determined, one must be true and the other must be false."}, {"id": "072", "blue": "YOU WILL NOT SOLVE THIS PUZZLE.", "white": "FOUR STATEMENTS ON BOXES IN THIS ROOM ARE TRUE. | A BOX WITH ONE FALSE STATEMENT CONTAINS GEMS.", "black": "A BOX WITH A TRUE STATEMENT CONTAINS THE GEMS. | THIS BOX DOES NOT CONTAIN THE GEMS.", "prize": "White", "sol": "It is an unspoken rule of the Parlor Game that all puzzles can be solved through logical deduction, which makes the blue box trivially false. Working through the white box's top statement (which must be false, else it creates a contradiction between the white and black boxes), the only box that could display only true statements is the black box. The two statements on the black box then show there must be another box with a true statement, and that box can only be the white box, which contains the gems."}, {"id": "073", "blue": "TWO OF THE TOP STATEMENTS ARE FALSE | ONLY ONE BOTTOM STATEMENT IS FALSE", "white": "THE GEMS ARE IN A BOX WITH A TRUE TOP STATEMENT | THE GEMS ARE IN A BOX WITH A FALSE BOTTOM STATEMENT", "black": "TWO OF THE TOP STATEMENTS ARE TRUE | ONLY ONE BOTTOM STATEMENT IS TRUE", "prize": "Black", "sol": "Whether the black box's bottom statement is true or false, working through the logic in either case leads to the same conclusion: the black box contains the gems. Incidentally, the blue box's top statement is false, while the white and black boxes' top statements are true."}, {"id": "074", "blue": "THE TOP STATEMENT ON THE WHITE BOX IS TRUE. | THE GEMS ARE NOT IN THIS BOX.", "white": "EXACTLY TWO STATEMENTS WITH THE WORD 'TRUE' ARE FALSE. | THE GEMS ARE NOT IN THIS BOX.", "black": "BOTH STATEMENTS ON THE WHITE BOX ARE TRUE. | BOTH STATEMENTS ON THIS BOX ARE TRUE.", "prize": "White", "sol": "The black box's statements would mean the blue box displays only lies while the white and black boxes display only true statements - but this contrad <script>
(function () {
  "use strict";

  // ── load embedded puzzle data ────────────────────────────────────────── ⊃
  const RAW = JSON.parse(document.getElementById("puzzle-data").textContent);

  const searchEl = document.getElementById("search");
  const resultsEl = document.getElementById("results");
  const detailEl = document.getElementById("detail");
  const hintEl = document.getElementById("hint");

  const COLOR_LABEL = { blue: "Μπλε", white: "Λευκό", black: "Μαύρο" };

  // ── helpers ───────────────────────────────────────────────────────────── ⊃
  function norm(s) {
    return (s || "").toLowerCase();
  }

  function splitStatements(text) {
    if (!text || text === "(no statement)") return [];
    return text.split("|").map((s) => s.trim());
  }

  function escapeHtml(s) {
    return s
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function highlight(text, query) {
    const escaped = escapeHtml(text);
    if (!query) return escaped;
    const idx = norm(text).indexOf(query);
    if (idx === -1) return escaped;
    const before = escapeHtml(text.slice(0, idx));
    const match = escapeHtml(text.slice(idx, idx + query.length));
    const after = escapeHtml(text.slice(idx + query.length));
    return `${before}<mark>${match}</mark>${after}`;
  }

  function firstSnippetMatch(puzzle, query) {
    for (const color of ["blue", "white", "black"]) {
      const text = puzzle[color] || "";
      if (norm(text).includes(query)) return { color, text };
    }
    return null;
  }

  // ── search over the three box statements of every puzzle ────────────── ⊃
  function search(query) {
    const q = norm(query).trim();
    if (!q) return [];
    const matches = [];
    for (const p of RAW) {
      const hit = firstSnippetMatch(p, q);
      if (hit) matches.push({ puzzle: p, hit });
    }
    return matches;
  }

  // ── rendering: results list ──────────────────────────────────────────── ⊃
  function renderResults(matches, query) {
    detailEl.style.display = "none";
    resultsEl.innerHTML = "";

    if (!query.trim()) {
      hintEl.textContent = "";
      return;
    }

    if (matches.length === 0) {
      hintEl.textContent = "";
      resultsEl.innerHTML = `<div class="empty-state">Καμία πρόταση κουτιού δεν ταιριάζει. Δοκίμασε πιο σύντομη φράση.</div>`;
      return;
    }

    hintEl.textContent = `${matches.length} αποτέλεσμα${matches.length === 1 ? "" : "τα"}`;

    // ── if there's exactly one match, show it directly ───────────────── ⊃
    if (matches.length === 1) {
      renderDetail(matches[0].puzzle, query);
      return;
    }

    const cap = matches.slice(0, 30);
    for (const { puzzle, hit } of cap) {
      const row = document.createElement("div");
      row.className = "result-row";
      row.innerHTML = `
        <span class="result-id">#${puzzle.id}</span>
        <span class="result-snippet">${highlight(hit.text, norm(query).trim())}</span>
      `;
      row.addEventListener("click", () => {
        renderDetail(puzzle, query);
        resultsEl.innerHTML = "";
        hintEl.textContent = `αποτέλεσμα για #${puzzle.id}`;
      });
      resultsEl.appendChild(row);
    }
  }

  // ── rendering: full puzzle detail (boxes + prize + solution) ────────── ⊃
  function renderDetail(puzzle, query) {
    detailEl.style.display = "block";
    const q = norm(query).trim();
    const prizeColor = puzzle.prize.toLowerCase(); // "blue" | "white" | "black"

    function boxHtml(color) {
      const stmts = splitStatements(puzzle[color]);
      const isWinner = color === prizeColor;
      const label = COLOR_LABEL[color];
      const body =
        stmts.length === 0
          ? `<span class="stmt" style="opacity:.5;font-style:italic;">— χωρίς πρόταση —</span>`
          : stmts.map((s) => `<span class="stmt">${highlight(s, q)}</span>`).join("");
      return `
        <div class="box ${color}${isWinner ? " winner" : ""}">
          <span class="label">${label}<svg class="gem" viewBox="0 0 12 12" fill="currentColor"><path d="M6 0 L10 4 L6 12 L2 4 Z"/></svg></span>
          ${body}
        </div>
      `;
    }

    detailEl.innerHTML = `
      <div class="detail-card">
        <div class="detail-top">
          <span class="detail-id">Γρίφος #${puzzle.id}</span>
          <button class="back-btn" id="back-btn">&larr; ΠΙΣΩ ΣΤΑ ΑΠΟΤΕΛΕΣΜΑΤΑ</button>
        </div>
        <div class="boxes">
          ${boxHtml("blue")}
          ${boxHtml("white")}
          ${boxHtml("black")}
        </div>
        <div class="prize-line">Τα τζέμ είναι στο ${COLOR_LABEL[prizeColor]} κουτί</div>
        <div class="solution">
          <span class="label">Λύση</span>
          <p>${escapeHtml(puzzle.sol)}</p>
        </div>
      </div>
    `;

    document.getElementById("back-btn").addEventListener("click", () => {
      const matches = search(searchEl.value);
      renderResults(matches, searchEl.value);
    });

    detailEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  // ── wire up live search ──────────────────────────────────────────────── ⊃
  searchEl.addEventListener("input", () => {
    const q = searchEl.value;
    const matches = search(q);
    renderResults(matches, q);
  });

  searchEl.focus();
})();

</script>
